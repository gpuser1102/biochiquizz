<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biochiquiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f4f6fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Biochiquiz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Layout: app a una schermata — feed a scroll verticale con snap, una card per schermata,
   tab bar blu notte fissa in basso con voce attiva a pillola corallo. Palette B: corallo e blu notte. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #f4f6fa;
  --line: #dde3ee;
  --ink: #0e1a33;
  --muted: #5a6782;
  --accent: #f24e2a;
  --accent-ink: #ffffff;
  --accent-soft: #ffe6df;
  --tabbar-bg: #0e1a33;
  --tabbar-ink: #8a97b3;
  --tabbar-on: #ffffff;
  --tile-rose: #ffe6df;
  --tile-peach: #e2f5f3;
  --tile-sage: #e2f4ea;
  --tile-sky: #e3ecfb;
  --tile-lilac: #ece8fb;
  --good: #16884a;
  --good-soft: #e3f6ea;
  --bad: #d23a2a;
  --bad-soft: #fde7e3;
  --warn: #5b3fd6;
  --warn-soft: #efebff;
  --patch: #ffe6df;
  --patch-line: #f24e2a;
  --young: #8ea3d6;
  --tile-ring: transparent;
  --lv-m: #2c5ea8;
  --key-bg: rgba(48, 82, 156, .74);
  --key-hi: rgba(255, 255, 255, .42);
  --key-ring: rgba(255, 255, 255, .5);
  --mol-ink: #0e1a33;
  --shadow: 0 1px 2px rgba(14, 26, 51, .05), 0 10px 28px rgba(14, 26, 51, .08);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r-card: 28px;
  --r-ctl: 16px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #050608; --surface: #0e1014; --surface-2: #15181e; --line: #2e333e;
    --ink: #f1f3f7; --muted: #9aa1b0; --accent: #ff6a47; --accent-ink: #ffffff; --accent-soft: #3a1a14;
    --tabbar-bg: #000000; --tabbar-ink: #7d8494; --tabbar-on: #ffffff;
    --tile-rose: #33171a; --tile-peach: #0f2a28; --tile-sage: #10291c; --tile-sky: #142035; --tile-lilac: #211c3a;
    --tile-ring: rgba(255, 255, 255, .14); --lv-m: #8fb4f0;
    --key-bg: rgba(150, 170, 220, .24); --key-hi: rgba(255, 255, 255, .24); --key-ring: rgba(255, 255, 255, .26);
    --good: #5ed493; --good-soft: #0f2a1b; --bad: #ff8575; --bad-soft: #33130f; --warn: #b9a8ff; --warn-soft: #1d1833;
    --patch: #3a1a14; --patch-line: #ff6a47; --young: #5f7bc0; --mol-ink: #f1f3f7;
    --shadow: 0 0 0 1px rgba(255,255,255,.04), 0 10px 28px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #050608; --surface: #0e1014; --surface-2: #15181e; --line: #2e333e;
    --ink: #f1f3f7; --muted: #9aa1b0; --accent: #ff6a47; --accent-ink: #ffffff; --accent-soft: #3a1a14;
    --tabbar-bg: #000000; --tabbar-ink: #7d8494; --tabbar-on: #ffffff;
    --tile-rose: #33171a; --tile-peach: #0f2a28; --tile-sage: #10291c; --tile-sky: #142035; --tile-lilac: #211c3a;
    --tile-ring: rgba(255, 255, 255, .14); --lv-m: #8fb4f0;
    --key-bg: rgba(150, 170, 220, .24); --key-hi: rgba(255, 255, 255, .24); --key-ring: rgba(255, 255, 255, .26);
    --good: #5ed493; --good-soft: #0f2a1b; --bad: #ff8575; --bad-soft: #33130f; --warn: #b9a8ff; --warn-soft: #1d1833;
    --patch: #3a1a14; --patch-line: #ff6a47; --young: #5f7bc0; --mol-ink: #f1f3f7;
    --shadow: 0 0 0 1px rgba(255,255,255,.04), 0 10px 28px rgba(0,0,0,.6);
    color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--font);
  -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

.app { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.view { flex: 1; min-height: 0; position: relative; }
.view[hidden] { display: none !important; }

/* ---------- Tab bar ---------- */
.tabbar {
  display: flex; justify-content: space-around; align-items: center; gap: 4px;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  background: var(--tabbar-bg);
}
.tab {
  flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: 0; padding: 4px 0; color: var(--tabbar-ink); font-size: 11px; font-weight: 600; cursor: pointer;
}
.tab .pill { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 999px; transition: background .2s; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--tabbar-on); }
.tab[aria-selected="true"] .pill { background: var(--accent); }

/* ---------- Pagine scrollabili (argomenti, statistiche, info) ---------- */
.page {
  height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
}
.page-inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.h1 { font: 800 30px/1.1 var(--font-display); letter-spacing: -.02em; margin: 6px 0 0; text-wrap: balance; }
.lead { color: var(--muted); margin: 0; font-size: 15px; }
.h2 { font: 700 13px/1.2 var(--font); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 4px 0; }

.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 6px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; min-width: 0; }
.row + .row { border-top: 1px solid var(--line); border-radius: 0; }
.tile { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); box-shadow: inset 0 0 0 1px var(--tile-ring); }
.tile svg { width: 21px; height: 21px; }
.t-rose { background: var(--tile-rose); } .t-peach { background: var(--tile-peach); } .t-sage { background: var(--tile-sage); }
.t-sky { background: var(--tile-sky); } .t-lilac { background: var(--tile-lilac); }
.row-text { flex: 1; min-width: 0; }
.row-title { font-weight: 700; font-size: 16px; }
.row-sub { color: var(--muted); font-size: 13px; margin-top: 1px; }

/* Argomenti */
.block-head { width: 100%; background: none; border: 0; text-align: left; cursor: pointer; }
.block-head .chev { transition: transform .2s; color: var(--muted); }
.block-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.topics { padding: 0 6px 6px 64px; display: flex; flex-direction: column; gap: 2px; }
.topic { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 14px; cursor: pointer; }
.topic input { position: absolute; opacity: 0; pointer-events: none; }
.check { flex: none; width: 24px; height: 24px; border-radius: 8px; border: 1.5px solid var(--line); display: grid; place-items: center; background: var(--surface); }
.check svg { width: 16px; height: 16px; opacity: 0; color: var(--accent-ink); }
.topic input:checked + .check { background: var(--accent); border-color: var(--accent); }
.topic input:checked + .check svg { opacity: 1; }
.topic input:focus-visible + .check { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.topic .tname { flex: 1; min-width: 0; font-size: 15px; }
.topic .tmeta { font-size: 12px; color: var(--muted); white-space: nowrap; }
.topic.soon { cursor: default; opacity: .5; }
.topic.soon .check { border-style: dashed; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.badge.new { background: var(--accent-soft); color: var(--accent); }

.switch-row { display: flex; align-items: center; gap: 12px; padding: 12px; }
.switch { position: relative; flex: none; width: 50px; height: 30px; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }

.seg { display: flex; background: var(--surface-2); border-radius: 14px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 6px; border-radius: 11px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r-ctl); padding: 14px 18px; font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: var(--bad-soft); color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: default; }

/* ---------- Feed ---------- */
.feed {
  height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
}
.slide {
  height: 100%; scroll-snap-align: start; scroll-snap-stop: always;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px; display: flex;
}
.card {
  flex: 1; max-width: 560px; margin: 0 auto; min-width: 0; min-height: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.card-body { flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 14px); }
.card-body > * { flex-shrink: 0; }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-kicker { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.card-topic { font-size: 13px; color: var(--muted); margin-top: 1px; }
.q { font: 800 clamp(18px, 2.6vh, 22px)/1.2 var(--font-display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }

.mol-box { background: var(--surface-2); border-radius: 22px; display: flex; align-items: center; justify-content: center; padding: 8px; position: relative; }
.card-body > .mol-box { flex: 1 1 0; min-height: 96px; }
.mol-box svg { width: 100%; height: 100%; max-height: 300px; display: block; }
.mol-box .fallback { color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }
.mol-tag { position: absolute; left: 12px; top: 10px; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

.options { display: flex; flex-direction: column; gap: clamp(5px, .9vh, 8px); }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: clamp(8px, 1.35vh, 12px) 12px; font-size: 15px; font-weight: 600;
}
.opt .key { flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--surface-2); color: var(--muted); }
.opt:not([disabled]):active { transform: scale(.99); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .key { background: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: var(--surface); }
.opt[disabled] { cursor: default; }

.write { display: flex; gap: 8px; }
.write input {
  flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 13px 14px; border-radius: var(--r-ctl);
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
}
.write input:focus { outline: none; border-color: var(--accent); }
.linkish { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 14px; padding: 4px 0; cursor: pointer; align-self: flex-start; }

/* Reazione da completare */
.rx { background: var(--surface-2); border-radius: 22px; padding: clamp(10px, 1.6vh, 16px) 14px; display: flex; flex-direction: column; gap: 10px; }
.rx-side { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rx-item { padding: 7px 11px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-weight: 650; font-size: 15px; }
.rx-item.cof { font-weight: 600; color: var(--muted); }
.rx-plus { color: var(--muted); font-weight: 700; }
.rx-arrow { display: flex; align-items: center; gap: 10px; padding-left: 4px; }
.rx-arrow .stem { flex: none; width: 2px; height: clamp(28px, 4.5vh, 46px); background: var(--ink); position: relative; margin-left: 10px; }
.rx-arrow .stem::after { content: ""; position: absolute; left: -5px; bottom: -2px; border: 6px solid transparent; border-top: 9px solid var(--ink); border-bottom: 0; }
.rx-arrow .stem.rev::before { content: ""; position: absolute; left: -5px; top: -2px; border: 6px solid transparent; border-bottom: 9px solid var(--ink); border-top: 0; }
.rx-enz { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rx-enz .enz { font-weight: 700; color: var(--accent); font-size: 15px; }
.rx-enz .co { font-size: 13px; color: var(--muted); }
.patch {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 12px; font-weight: 800; font-size: 15px;
  background: var(--patch); min-width: 64px; justify-content: center;
  border: 1.5px dashed var(--patch-line); color: var(--patch-line);
}
.patch.revealed { transform: none; background: var(--good-soft); border: 1.5px solid var(--good); color: var(--ink); }
.patch.revealed.miss { background: var(--bad-soft); border-color: var(--bad); }

.feedback { border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.feedback.ok { background: var(--good-soft); }
.feedback.ko { background: var(--bad-soft); }
.feedback .verdict { font-weight: 800; font-size: 17px; }
.feedback.ok .verdict { color: var(--good); }
.feedback.ko .verdict { color: var(--bad); }
.feedback .meta { color: var(--muted); font-size: 13px; }
.note { background: var(--warn-soft); border-radius: 18px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; }
.note b { color: var(--warn); }

.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px 12px 18px; border-top: 1px solid var(--line); }
.report { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 6px 0; text-decoration: none; }
.report svg { width: 16px; height: 16px; }
.next-hint { font-size: 13px; font-weight: 700; color: var(--accent); display: inline-flex; align-items: center; gap: 4px; opacity: 0; transition: opacity .3s; }
.answered .next-hint { opacity: 1; }
.next-hint svg { width: 16px; height: 16px; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

.empty { height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
.empty .box { padding: 26px 22px; max-width: 420px; display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* Statistiche */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px 12px; }
.stat .num { font: 800 26px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat .lbl { font-size: 12px; color: var(--muted); margin-top: 6px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* Benvenuto */
.welcome {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(20px, env(safe-area-inset-left, 0px));
}
.welcome-inner { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.hero-mark { width: 64px; height: 64px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.hero-mark svg { width: 36px; height: 36px; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 2px; }
.step { display: flex; gap: 12px; align-items: flex-start; padding: 12px; }
.step + .step { border-top: 1px solid var(--line); }
.step::before { counter-increment: s; content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 14px; }
.inline-ico { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; color: var(--accent); }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px);
}
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
.confirm .btns { display: flex; gap: 8px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  .feed { scroll-behavior: auto; }
}


/* Feedback a pop-up ancorato alla risposta */
.opt, .write { position: relative; }
.opt.has-pop, .write.has-pop { z-index: 3; }
.opt-label { flex: 1; min-width: 0; }
.write.right input { border-color: var(--good); background: var(--good-soft); }
.write.wrong input { border-color: var(--bad); background: var(--bad-soft); }
.pop {
  position: absolute; left: 10px; right: 10px; top: calc(100% - 4px); z-index: 4;
  display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: default;
  padding: 10px 12px; border-radius: 16px; border: 1.5px solid; font-size: 14px; font-weight: 500; line-height: 1.35;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .16); animation: pop-in .2s cubic-bezier(.2, .9, .3, 1.2) both; transform-origin: 24px 0;
}
.pop::before { content: ""; position: absolute; left: 18px; top: -7px; width: 12px; height: 12px; background: inherit; border: inherit; border-right: 0; border-bottom: 0; transform: rotate(45deg); }
.pop.up { top: auto; bottom: calc(100% - 4px); transform-origin: 24px 100%; }
.pop.up::before { top: auto; bottom: -7px; transform: rotate(225deg); }
.pop.ok { background: var(--good-soft); border-color: var(--good); }
.pop.ko { background: var(--bad-soft); border-color: var(--bad); }
.pop-verdict { font-weight: 800; font-size: 15px; }
.pop.ok .pop-verdict { color: var(--good); }
.pop.ko .pop-verdict { color: var(--bad); }
.pop-meta { color: var(--muted); font-size: 12.5px; }
.pop-note { margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--line); font-size: 13px; }
.pop-note b { color: var(--warn); }

@keyframes pop-in { from { opacity: 0; transform: scale(.94) translateY(-4px); } to { opacity: 1; transform: none; } }

/* Valutazione dentro il pop-up */
.rate { display: flex; gap: 6px; margin-top: 6px; }
.rate-b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 4px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer; }
.rate-b small { font-size: 11px; font-weight: 600; color: var(--muted); }
.rate-b[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.rate-b[aria-pressed="true"] small { color: var(--surface); opacity: .75; }
.bar.two { display: flex; }
.bar.two i { border-radius: 0; }
.bar.two i.young { background: var(--young); }
.stats-grid .lbl { line-height: 1.25; }

/* Nessuna barra di scorrimento visibile: si scorre solo tra una card e l'altra */
.feed, .page { scrollbar-width: none; }
.feed::-webkit-scrollbar, .page::-webkit-scrollbar { display: none; }
/* card con molto testo su schermi bassi: si compatta invece di scorrere */
.card.tight .card-head { display: none; }
.card.tight .rx-item, .card.tight .patch { padding: 5px 9px; font-size: 14px; }
.card.tight .opt { padding-block: 7px; }
.card.tight .opt .key { width: 24px; height: 24px; }
/* crediti */
.credit { display: flex; align-items: center; gap: 14px; padding: 14px; }
.credit .mono { flex: none; width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 20px/1 var(--font-display); letter-spacing: .02em; box-shadow: inset 0 0 0 1px var(--tile-ring); }
.credit .who { font: 800 19px/1.15 var(--font-display); }
.credit .role { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* Domande verificate: testo lungo, opzioni su più righe */
.ex-q { font-size: clamp(17px, 2.4vh, 20px); line-height: 1.25; }
.ex-q u { text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--accent); }
.opt .opt-label { line-height: 1.3; }
.card.tight .ex-q { font-size: 16px; }
.card.tight .opt { font-size: 14px; }
.pop-note.info b { color: var(--muted); }

/* Segnalazione: foglio dal basso */
.sheet-wrap { position: fixed; inset: 0; z-index: 70; background: rgba(5, 8, 15, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease both; }
.sheet {
  width: 100%; max-width: 560px; background: var(--surface); border-radius: 26px 26px 0 0; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px; max-height: 92%; overflow-y: auto; scrollbar-width: none;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  animation: rise .22s cubic-bezier(.2, .9, .3, 1) both;
}
.sheet::-webkit-scrollbar { display: none; }
.sheet-grip { width: 40px; height: 5px; border-radius: 99px; background: var(--line); align-self: center; margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sheet textarea, .sheet input[type="text"], .copy-area { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: var(--r-ctl); border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); resize: none; }
.sheet textarea:focus, .sheet input[type="text"]:focus { outline: none; border-color: var(--accent); }
.sheet input.bad { border-color: var(--bad); }
.field-err { color: var(--bad); font-size: 13px; font-weight: 600; margin-top: -4px; }
.copy-area { margin: 0 12px 12px; width: calc(100% - 24px); height: 120px; font-size: 12px; }
.sheet-btns { display: flex; gap: 8px; }
.sheet-btns .btn { flex: 1; }
.update-bar {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 65;
  display: flex; align-items: center; gap: 12px; width: calc(100% - 28px); max-width: 520px;
  background: var(--ink); color: var(--bg); border-radius: 18px; padding: 8px 8px 8px 16px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow);
}
.update-bar span { flex: 1; min-width: 0; }
.update-bar .btn { padding: 9px 14px; font-size: 14px; }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Livelli */
.lv { flex: none; font-size: 11px; font-weight: 800; letter-spacing: .02em; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.lv-f { background: var(--good-soft); color: var(--good); }
.lv-m { background: var(--tile-sky); color: var(--lv-m); }
.lv-a { background: var(--accent-soft); color: var(--accent); }
.lv-l { background: var(--ink); color: var(--surface); }
.lv.locked { opacity: .45; }
.lv-row { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 4px; }
.lv-chip[aria-pressed="false"] { background: var(--surface); color: var(--muted); border-color: var(--line); text-decoration: line-through; }
.lv-chip.lvc-f[aria-pressed="true"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.lv-chip.lvc-m[aria-pressed="true"] { background: var(--tile-sky); border-color: var(--lv-m); color: var(--lv-m); }
.lv-chip.lvc-a[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.lv-chip.lvc-l[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }

/* Modalità di studio */
#view-feed { display: flex; flex-direction: column; }
#view-feed .feed { flex: 1; height: auto; min-height: 0; }
.modebar { flex: none; padding: 8px max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); }
.modebar .seg { max-width: 560px; margin: 0 auto; }
.modebar .seg button { padding: 7px 4px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 5px; }
.modebar .seg button svg { width: 14px; height: 14px; }
.seg button.hard-b[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.card.hard { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.lv-h { background: var(--accent); color: var(--accent-ink); }
.mode-list { display: flex; flex-direction: column; gap: 8px; }
.mode-opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 18px; padding: 12px 14px; cursor: pointer; }
.mode-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.mode-opt .row-title { font-size: 15px; }

</style>

 dell'ATP dall'ADP e Pi mediante riossidazione del NADH","L'idrolisi dell'ATP","La formazione dell'ATP dall'ADP e Pi mediante energia rilasciata dalla scissione di un composto con un ΔG°' minore di −30 kJ/mole"],"ans":3,"why":"Un composto con potenziale di trasferimento più alto dell'ATP (1,3-BPG, PEP) cede il fosfato all'ADP. La B è la fosforilazione ossidativa, la A una normale reazione chinasica.","note":null,"times":2,"pending":false,"level":"m"},{"id":"ndpk","topic":"m1-atp","page":"17–18","src":"Biochimica II","q":"Quale di queste affermazioni è falsa riguardo alla nucleotide difosfato chinasi?","opts":["Trasferisce il fosfato in gamma da un trinucleotide ad un dinucleotide","Ha un'energia libera standard vicina allo zero","La sua azione favorisce i processi catabolici","La reazione dipende dal consumo degli NTP"],"ans":2,"why":"Forma GTP, UTP e CTP per le biosintesi (proteine, zuccheri, lipidi): favorisce l'anabolismo. Ha ΔG°' ≈ 0 e va avanti perché gli NTP vengono consumati. «Trinucleotide/dinucleotide» sta per nucleoside trifosfato/difosfato.","note":null,"times":2,"pending":false,"level":"a"},{"id":"carica","topic":"m1-atp","page":"16–17","src":"Biochimica II","q":"In una cellula le concentrazioni di ATP ed ADP sono equivalenti e quella dell'AMP è trascurabile. In queste condizioni:","opts":["Prevarrà il catabolismo","Prevarrà l'anabolismo","I due processi sono equivalenti","Il ΔG°' di idrolisi aumenta"],"ans":0,"why":"Carica energetica = ([ATP] + ½[ADP]) / ([ATP] + [ADP] + [AMP]) = 1,5/2 = 0,75. Sotto il valore normale di 0,9 aumentano le vie che generano ATP.","note":null,"times":2,"pending":false,"level":"a"},{"id":"no-atp","topic":"m2-ingresso","page":"32–33","src":"Biochimica II","q":"Quale di questi processi non richiede ATP?","opts":["Fosforilazione del glucosio","Trasporto del glucosio dal sangue alle cellule","Pompa sodio potassio","Pompa del calcio"],"ans":1,"why":"I GLUT fanno diffusione facilitata secondo gradiente. Esochinasi, Na⁺/K⁺-ATPasi e Ca²⁺-ATPasi consumano ATP.","note":"Sbobina di Biochimica II, p. 32: l'SGLT1 (scritto «SGLUT1») è descritto prima come «trasportatore attivo che utilizza ATP» e poi come simporto senza ATP. È un trasporto attivo secondario: l'ATP lo consuma la pompa Na⁺/K⁺, non l'SGLT1.","times":2,"pending":false,"level":"f"},{"id":"legami-energia","topic":"m1-atp","page":"19–20","src":"Biochimica II","q":"Ordina per energia libera, dalla più positiva alla più negativa, la scissione di: fosfoguanidinico della creatina fosfato (A), fosfoestere (B), tioestere (C), fosfoanidridico (D).","opts":["A-B-C-D","B-D-C-A","C-D-B-A","B-C-A-D"],"ans":1,"why":"ΔG°' di idrolisi: fosfoestere (es. glucosio 6-P) ≈ −14 kJ/mol, fosfoanidridico dell'ATP ≈ −30, tioestere dell'acetil-CoA −31,4, fosfocreatina ≈ −43.","note":null,"times":1,"pending":false,"level":"l"},{"id":"pk-base","topic":"m1-coenzimi","page":"24","src":"Biochimica II","q":"La base B ha un pK pari a 9,0. A pH 9,0 in soluzione si avrà:","opts":["Uguale concentrazione di B e B⁻","Uguale concentrazione di B e B⁺","Prevalenza della forma B","Prevalenza della forma B⁺"],"ans":1,"why":"A pH = pK le due forme sono in uguale concentrazione. La base B accetta un protone e diventa BH⁺ (B⁺).","note":null,"times":2,"pending":false,"level":"m"},{"id":"etanolo-nad","topic":"m1-coenzimi","page":"53","src":"Biochimica II","q":"L'etanolo, in presenza degli enzimi necessari, reagisce con due molecole di NAD⁺. Il prodotto finale è:","opts":["Etano","Acetaldeide","Acetato","Anidride carbonica"],"ans":2,"why":"Etanolo → acetaldeide (alcol deidrogenasi, 1 NAD⁺) → acetato (aldeide deidrogenasi, 1 NAD⁺).","note":null,"times":2,"pending":false,"level":"m"},{"id":"chetoacido","topic":"m1-coenzimi","page":"23–24, 49","src":"Biochimica II","q":"La riduzione di un alfa-chetoacido produce:","opts":["un composto con un alcol primario e un gruppo aldeidico","un composto con alcol secondario e un gruppo carbossilico","un composto con un chetone ed un gruppo carbossilico","un composto con due gruppi carbossilici"],"ans":1,"why":"Il chetone in α si riduce ad alcol secondario e il carbossile resta: piruvato → lattato.","note":null,"times":2,"pending":false,"level":"m"},{"id":"elettroni-glc","topic":"m1-coenzimi","page":"22","src":"Biochimica II","q":"Quanti elettroni vengono persi per la completa ossidazione della molecola di glucosio ad anidride carbonica ed acqua?","opts":["8","12","24","32"],"ans":2,"why":"Ogni carbonio del glucosio passa in media da 0 a +4: 6 × 4 = 24 elettroni, cioè le 12 coppie raccolte da 10 NADH e 2 FADH₂.","note":null,"times":1,"pending":false,"level":"a"},{"id":"ox-carbossile","topic":"m1-coenzimi","page":"22","src":"Biochimica II","q":"Quale di queste affermazioni è vera riguardo l'ossidazione di un gruppo carbossilico?","opts":["Non è possibile","Riguarda solo la forma deprotonata","Viene rilasciato come CO₂","È una reazione reversibile"],"ans":2,"why":"Il carbonio carbossilico è il più ossidato di una molecola organica: l'ultimo passaggio possibile è la sua eliminazione come CO₂, come nelle decarbossilazioni del ciclo di Krebs.","note":null,"times":1,"pending":false,"level":"m"},{"id":"elettroni-acoa","topic":"m1-coenzimi","page":"22","src":"Biochimica II","q":"L'acetil-CoA (CH₃COSCoA) viene ossidato nel ciclo di Krebs a 2 molecole di CO₂. Quanti elettroni vengono persi nell'ossidazione?","opts":["2","4","6","8"],"ans":3,"why":"I due carboni dell'acetile passano in totale da 0 a +8: 8 elettroni, raccolti da 3 NADH e 1 FADH₂ (4 coppie).","note":null,"times":1,"pending":false,"level":"a"},{"id":"c-secondario","topic":"m1-coenzimi","page":"23","src":"Biochimica II","q":"Per ossidare un carbonio secondario saturo a chetone quali passaggi sono necessari?","opts":["Ossidazione NAD dipendente con aggiunta di una molecola d'acqua","Idratazione seguita da un'ossidazione","Ossidazione, idratazione ed un ulteriore ossidazione","Non è possibile la trasformazione"],"ans":2,"why":"Ossidazione FAD-dipendente a doppio legame (succinato → fumarato), idratazione ad alcol secondario (→ malato), ossidazione NAD-dipendente a chetone (→ ossalacetato).","note":null,"times":1,"pending":false,"level":"a"},{"id":"no-acqua","topic":"m1-coenzimi","page":"25","src":"Biochimica II","q":"Quale tra questi legami non richiede la perdita di una molecola d'acqua per la sua formazione?","opts":["Estere","Fosfoanidridico","Emiacetalico","Glicosidico"],"ans":2,"why":"L'emiacetale si forma per addizione dell'OH al carbonile (C5–OH sul C1 del glucosio). Estere, fosfoanidride e glicoside sono condensazioni.","note":null,"times":1,"pending":false,"level":"m"},{"id":"glc-fru","topic":"m1-enzimologia","page":"23, 40","src":"Biochimica II","q":"La trasformazione da glucosio a fruttosio è catalizzata da:","opts":["Idrolasi","Ossidoreduttasi","Chinasi","Isomerasi"],"ans":3,"why":"Glucosio (aldoso) e fruttosio (chetoso) sono isomeri: la conversione non cambia lo stato di ossidazione (es. fosfoesoso isomerasi, G6P → F6P).","note":null,"times":2,"pending":false,"level":"f"},{"id":"idrolasi","topic":"m1-enzimologia","page":"31","src":"Biochimica II","q":"Quali di questi enzimi appartiene alla classe delle idrolasi?","opts":["Proteasi","Amilasi","Lipasi","Tutte e tre"],"ans":3,"why":"Proteasi, amilasi e lipasi scindono legami usando l'acqua: sono tutte idrolasi.","note":null,"times":1,"pending":false,"level":"f"},{"id":"es-saturante","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"Se in una reazione enzimatica tutto l'enzima è nella forma ES vuol dire che:","opts":["Il substrato è uguale alla KM","La concentrazione dell'enzima è uguale a quella del substrato","Si è raggiunta metà della Vmax","Il substrato è saturante"],"ans":3,"why":"Con tutto l'enzima legato come ES si lavora a Vmax: il substrato è saturante.","note":null,"times":1,"pending":false,"level":"f"},{"id":"primaria","topic":"m1-enzimologia","page":"25","src":"Biochimica I","q":"In quale livello di struttura di una proteina non intervengono legami deboli?","opts":["Primaria","Secondaria","Terziaria","Quaternaria"],"ans":0,"why":"La primaria è la sequenza unita da legami peptidici covalenti. Secondaria, terziaria e quaternaria dipendono da legami deboli (idrogeno, ionici, idrofobici).","note":null,"times":1,"pending":false,"level":"f"},{"id":"piu-enzima","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"In una reazione enzimatica un ulteriore aumento dell'enzima provoca:","opts":["Aumento della KM","Aumento della Vmax","Diminuzione della KM","Aumento della kcat"],"ans":1,"why":"Vmax = k₂[E]: cresce con l'enzima. KM e kcat sono costanti.","note":null,"times":1,"pending":false,"level":"f"},{"id":"km-unita","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"Le dimensioni della KM sono:","opts":["s⁻¹","M","s M⁻¹","M⁻¹"],"ans":1,"why":"La KM è la concentrazione di substrato a cui v = ½ Vmax: si misura in M.","note":null,"times":1,"pending":false,"level":"m"},{"id":"k05-neg","topic":"m1-enzimologia","page":"28","src":"Biochimica II","q":"La K0,5 (KM apparente) di un enzima allosterico, in presenza di un effettore allosterico negativo:","opts":["Non subisce variazioni","Diminuisce","Aumenta","Dipende dalla concentrazione del substrato"],"ans":2,"why":"L'effettore negativo sposta l'equilibrio verso T: la sigmoide va a destra e la K0,5 aumenta.","note":null,"times":2,"pending":false,"level":"m"},{"id":"t-r","topic":"m1-enzimologia","page":"28","src":"Biochimica II","q":"In un enzima allosterico la transizione dalla forma T alla forma R è inibita da:","opts":["Effettore omotropico negativo","Effettore eterotropico negativo","Effettore eterotropico positivo","Gli effettori allosterici non hanno influenza"],"ans":1,"why":"La inibisce un effettore negativo diverso dal substrato (eterotropico). L'effettore omotropico è il substrato stesso e di solito è positivo.","note":null,"times":1,"pending":false,"level":"m"},{"id":"s-km","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"Quando la concentrazione di substrato è uguale alla KM:","opts":["La velocità è uguale alla velocità massima","Tutto l'enzima è legato al substrato","La velocità è metà della velocità massima","Diminuisce la formazione del prodotto"],"ans":2,"why":"È la definizione di KM: la concentrazione di substrato a cui v = ½ Vmax.","note":null,"times":1,"pending":false,"level":"f"},{"id":"serina","topic":"m1-enzimologia","page":"29","src":"Biochimica II","q":"Quale tra questi residui aminoacidici si può trovare nel sito di fosforilazione di una proteina substrato di una protein chinasi?","opts":["Fenilalanina","Serina","Aspartato","Lisina"],"ans":1,"why":"Le protein chinasi fosforilano l'OH di serina e treonina (e tirosina).","note":null,"times":1,"pending":false,"level":"f"},{"id":"lento","topic":"m1-enzimologia","page":"30","src":"Biochimica II","q":"Tra i meccanismi di regolazione, quale tra questi rientra in un meccanismo lento?","opts":["Controllo allosterico","Espressione dell'enzima","Fosforilazione dell'enzima","Nessuno dei tre"],"ans":1,"why":"Allosteria e fosforilazione sono rapide. Cambiare la quantità di enzima (sintesi o degradazione) richiede ore.","note":null,"times":1,"pending":false,"level":"f"},{"id":"acqua-sub","topic":"m1-enzimologia","page":"146","src":"Biochimica II","q":"Quali tra questi enzimi ha l'acqua come substrato?","opts":["Isomerasi","Chinasi","Ossidoreduttasi (deidrogenasi)","Fosfatasi"],"ans":3,"why":"La fosfatasi idrolizza l'estere fosforico (es. glucosio 6-fosfatasi). Le chinasi usano ATP, le deidrogenasi NAD/FAD.","note":null,"times":1,"pending":false,"level":"m"},{"id":"mutasi","topic":"m1-enzimologia","page":"45","src":"Biochimica II","q":"Enzimi che trasferiscono gruppi sostituenti in posizioni diverse della stessa molecola si chiamano:","opts":["Isomerasi","Fosforilasi","Chinasi","Mutasi"],"ans":3,"why":"Le mutasi spostano un gruppo nella stessa molecola: 3-fosfoglicerato → 2-fosfoglicerato.","note":null,"times":1,"pending":false,"level":"f"},{"id":"glut-fegato","topic":"m2-ingresso","page":"32–33","src":"Biochimica II","q":"Quali sono i trasportatori di glucosio nell'epatocita?","opts":["GLUT1","GLUT2","GLUT3","GLUT4"],"ans":1,"why":"GLUT2: fegato, pancreas e membrana basolaterale dell'enterocita. Kt 17 mM, alta capacità: lavora dopo i pasti.","note":null,"times":1,"pending":false,"level":"f"},{"id":"glut4","topic":"m2-ingresso","page":"33, 35","src":"Biochimica II","q":"In quali tra queste cellule l'insulina permette il trasferimento sulla superficie dei trasportatori GLUT4?","opts":["Neuroni","Globuli rossi","Epatociti","Adipociti"],"ans":3,"why":"GLUT4: muscolo scheletrico, cuore e tessuto adiposo.","note":null,"times":1,"pending":false,"level":"f"},{"id":"glut-entero","topic":"m2-ingresso","page":"32","src":"Biochimica II","q":"Quale trasportatore del glucosio si trova sulla membrana basolaterale degli enterociti?","opts":["GLUT1","GLUT2","GLUT3","GLUT4"],"ans":1,"why":"Dal lume il glucosio entra con l'SGLT1, verso il sangue esce con il GLUT2 basolaterale.","note":null,"times":1,"pending":false,"level":"f"},{"id":"glut-bidir","topic":"m2-ingresso","page":"33","src":"Biochimica II","q":"I trasportatori GLUT sono:","opts":["unidirezionali","bidirezionali","possono assumere una sola conformazione","sono tutti sotto controllo ormonale"],"ans":1,"why":"Diffusione facilitata: il verso dipende solo dal gradiente (il fegato a digiuno libera glucosio con il GLUT2). Hanno due conformazioni, T1 e T2, e solo il GLUT4 è sotto controllo ormonale.","note":null,"times":1,"pending":false,"level":"m"},{"id":"glut-tumore","topic":"m2-ingresso","page":"64 e seguenti (pagine non numerate, effetto Warburg)","src":"Biochimica II","q":"In una cellula tumorale aumenta l'espressione di GLUT. Si tratterà di:","opts":["GLUT1","GLUT2","GLUT3","GLUT4"],"ans":0,"why":"Nelle cellule tumorali il fattore HIF è attivo anche con l'ossigeno e fa trascrivere enzimi glicolitici, LDH e trasportatori: soprattutto il GLUT1, ad alta affinità, che lavora già a glicemia basale (effetto Warburg).","note":"La sbobina cita sia GLUT1 sia GLUT3 tra i geni attivati da HIF: la risposta attesa è GLUT1. Se a lezione è stato detto diversamente, fallo presente segnalandolo.","times":1,"pending":false,"level":"a"},{"id":"gr-insulina","topic":"m2-ingresso","page":"33","src":"Biochimica II","q":"Quale di queste cellule non ha il recettore per l'insulina?","opts":["Epatocita","Miocita","Adipocita","Globulo rosso"],"ans":3,"why":"Il globulo rosso prende il glucosio con il GLUT1, indipendente dall'insulina. Esistono pochi recettori anche sugli eritrociti, ma la risposta attesa è questa.","note":null,"times":1,"pending":false,"level":"m"},{"id":"insulina-sec","topic":"m2-ingresso","page":"34","src":"Biochimica II","q":"Quali di questi eventi non è coinvolto nella secrezione dell'insulina?","opts":["Fosforilazione del glucosio per opera della glucochinasi","Fosforilazione ossidativa","Ingresso di ioni potassio","Ingresso del calcio"],"ans":2,"why":"L'ATP chiude i canali del K⁺: il potassio smette di uscire, la membrana si depolarizza, entra Ca²⁺ e partono le vescicole di insulina.","note":null,"times":1,"pending":false,"level":"m"},{"id":"glut1-neonati","topic":"m2-ingresso","page":"33","src":"Biochimica II","q":"Quali di questi eventi è più probabile che avvengano in neonati che presentano mutazioni del gene che codifica per GLUT1? (E come intervenire?)","opts":["Ipoglicemia","Problemi neurologici","Insufficienza renale","Insufficienza cardiaca"],"ans":1,"why":"Il GLUT1 porta il glucosio oltre la barriera ematoencefalica: il deficit dà convulsioni e ritardo dello sviluppo con glicemia normale. Si interviene con la dieta chetogenica, perché i corpi chetonici entrano nel cervello con altri trasportatori.","note":"Il nome della sindrome (deficit di GLUT1) e la dieta chetogenica non sono nelle sbobine.","times":1,"pending":false,"level":"a"},{"id":"glut-placenta","topic":"m2-ingresso","page":null,"src":"Biochimica II","q":"Quale trasportatore del glucosio vi aspettate di trovare nelle cellule della placenta?","opts":["GLUT1","GLUT2","GLUT3","GLUT4"],"ans":0,"why":"Nella placenta il trasportatore principale è il GLUT1: come nella barriera ematoencefalica, deve far passare glucosio già a glicemia basale.","note":"Non è nelle sbobine (Lehninger).","times":1,"pending":false,"level":"m"},{"id":"peptide-c","topic":"m2-ingresso","page":"36","src":"Biochimica II","q":"Un paziente con iperglicemia presenta nel sangue valori normali del peptide C originato dal taglio della proinsulina. Questo dato indica che:","opts":["L'insulina non viene prodotta dalle cellule del pancreas","L'insulina non trasporta i GLUT4 sulle membrane delle cellule muscolari","Il trasporto del glucosio nel fegato è rallentato","La glucochinasi del pancreas è c… (fine illeggibile nella foto)"],"ans":1,"why":"Peptide C normale = l'insulina viene prodotta. L'iperglicemia dipende dall'insulino-resistenza: i GLUT4 non vengono esposti sulla membrana.","note":null,"times":1,"pending":false,"level":"m"},{"id":"glc-atp","topic":"m2-fosforilazione","page":"37, 40","src":"Biochimica II","q":"Nella reazione: Glucosio + ATP → Glucosio 6P + ADP","opts":["Il fosfato in alfa dell'ATP è trasferito al glucosio","La scissione dell'ATP spinge la reazione verso destra","Si forma un legame anidridico","Il ΔG°' è ampiamente positivo"],"ans":1,"why":"Viene trasferito il fosfato γ e si forma un fosfoestere. La reazione è accoppiata all'idrolisi dell'ATP, che rende il ΔG negativo.","note":null,"times":2,"pending":false,"level":"m"},{"id":"glucochinasi","topic":"m2-fosforilazione","page":"37","src":"Biochimica II","q":"Quale delle seguenti affermazioni è vera per la glucochinasi?","opts":["È un enzima ubiquitario","Trasforma il glucosio in glucosio 1-P","Ha una KM superiore a quella dell'esochinasi","Forma un legame fosfoanidridico tra il glucosio ed il fosfato"],"ans":2,"why":"La glucochinasi (esochinasi IV) è solo in fegato e pancreas, ha una KM circa 100 volte più alta dell'esochinasi e forma glucosio 6-P con un fosfoestere.","note":null,"times":1,"pending":false,"level":"m"},{"id":"g6p-falsa","topic":"m2-fosforilazione","page":"38, 65","src":"Biochimica II","q":"Quale tra queste affermazioni non è vera per il glucosio 6P?","opts":["È il precursore del ribosio","Può essere immagazzinato sotto forma di glicogeno","Passa liberamente nel mitocondrio","Nell'epatocita può essere convertito in glucosio"],"ans":2,"why":"La membrana mitocondriale interna è impermeabile: il G6P resta nel citosol. Dà ribosio (pentoso fosfati), glicogeno e, nel fegato, glucosio libero (glucosio 6-fosfatasi).","note":null,"times":1,"pending":false,"level":"m"},{"id":"bilancio-g6p","topic":"m2-glicolisi","page":"47","src":"Biochimica II","q":"Il bilancio della glicolisi a partire dal glucosio-6P dà:","opts":["La riduzione di una molecola di NAD⁺","La produzione di anidride carbonica","Un aumento del pH","La formazione di 3 molecole di ATP"],"ans":3,"why":"Partendo dal G6P non si spende l'ATP dell'esochinasi: 4 prodotti − 1 (PFK1) = 3 ATP. Si riducono 2 NAD⁺, non si forma CO₂ e il pH scende.","note":null,"times":1,"pending":false,"level":"a"},{"id":"glut5","topic":"m2-glicolisi","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Le cellule testicolari posseggono trasportatori GLUT5. Quanti ATP si formano nella glicolisi?","opts":["1","2","3","4"],"ans":1,"why":"Il GLUT5 trasporta fruttosio. Nel muscolo il fruttosio diventa fruttosio 6-P con l'esochinasi; nel fegato fruttosio 1-P con la fruttochinasi, poi DHAP e gliceraldeide. In entrambi i casi il bilancio è di 2 ATP netti per esoso (4 prodotti, 2 spesi).","note":"Sbobina di Biochimica II, pagine non numerate dopo p. 64: la triosio chinasi fosforila la gliceraldeide a «gliceraldeide 2-fosfato». Il prodotto è la gliceraldeide 3-fosfato, come mostra anche la figura accanto.","times":1,"pending":false,"level":"a"},{"id":"gapdh-legame","topic":"m2-glicolisi","page":"43","src":"Biochimica II","q":"Durante la catalisi della gliceraldeide 3P deidrogenasi quale legame non si forma?","opts":["Fosfoanidridico","Tioemiacetale","Fosfoestere","Tioestere"],"ans":2,"why":"Si formano il tioemiacetale (Cys–aldeide), il tioestere dopo l'ossidazione e il fosfoanidridico misto dell'1,3-BPG. Il fosfoestere in C3 c'era già nella GA3P.","note":"Sbobina di Biochimica II, p. 43: il meccanismo dice che va al NAD⁺ «l'H⁺ sotto forma di idruro» e che «la riduzione» trasforma l'aldeide. Va al NAD⁺ un idruro (H⁻), l'aldeide si ossida e si forma il tioestere con la cisteina.","times":1,"pending":false,"level":"l"},{"id":"gapdh-cys","topic":"m2-glicolisi","page":"43","src":"Biochimica II","q":"Quale residuo aminoacidico è coinvolto nella catalisi della gliceraldeide 3-fosfato deidrogenasi?","opts":["Serina","Cisteina","Lisina","Metionina"],"ans":1,"why":"Il gruppo SH della cisteina attacca l'aldeide; per questo lo iodoacetato, che lo alchila, blocca la glicolisi.","note":null,"times":1,"pending":false,"level":"m"},{"id":"gapdh-nadh","topic":"m2-glicolisi","page":"43","src":"Biochimica II","q":"Nella reazione GA3P + Pi + NAD⁺ ⇌ 1,3-BPG + NADH + H⁺, un aumento del NADH produce:","opts":["Una diminuzione del NAD⁺","Un aumento della GA3P","Una diminuzione del pH","Nessun cambiamento"],"ans":1,"why":"Più NADH sposta l'equilibrio a sinistra (Le Chatelier): si riforma GA3P e aumenta il NAD⁺.","note":null,"times":1,"pending":false,"level":"a"},{"id":"slp-reazione","topic":"m2-glicolisi","page":"44","src":"Biochimica II","q":"Quale delle seguenti reazioni è una fosforilazione a livello del substrato?","opts":["Conversione della gliceraldeide in 1,3 bisfosfoglicerato","Conversione del 1,3 bisfosfoglicerato in 3-fosfoglicerato","Formazione del 2-fosfoglicerato","Formazione del fosfoenolpiruvato"],"ans":1,"why":"La fosfoglicerato chinasi: l'1,3-BPG cede il fosfato all'ADP. L'altra della glicolisi è la piruvato chinasi.","note":null,"times":1,"pending":false,"level":"f"},{"id":"dg-negativo","topic":"m2-glicolisi","page":"47","src":"Biochimica II","q":"Quale delle seguenti reazioni della glicolisi procede con un ΔG negativo?","opts":["Conversione del glucosio 6P in fruttosio 6P","Reazione della gliceraldeide 3 fosfato deidrogenasi","Reazione dell'enolasi","Reazione della piruvato chinasi"],"ans":3,"why":"Le tre reazioni con ΔG fortemente negativo sono esochinasi/glucochinasi, PFK1 e piruvato chinasi. Le altre sono vicine all'equilibrio.","note":null,"times":2,"pending":false,"level":"m"},{"id":"bpg-falsa","topic":"m2-glicolisi","page":"43–44","src":"Biochimica II","q":"Quale di queste affermazioni è falsa per l'1,3 bisfosfoglicerato?","opts":["Contiene un legame fosfoanidridico","Contiene un legame fosfoesterico","È meno ossidato del 3-fosfoglicerato","Ha un potenziale di trasferimento maggiore dell'ATP"],"ans":2,"why":"1,3-BPG e 3-fosfoglicerato hanno lo stesso stato di ossidazione (C1 a livello di acido): la fosfoglicerato chinasi sposta solo il fosfato.","note":null,"times":1,"pending":false,"level":"a"},{"id":"non-glicolisi","topic":"m2-glicolisi","page":"39","src":"Biochimica II","q":"Quali tra questi composti non partecipa alla glicolisi?","opts":["Esteri fosforici","Esosi","Acidi dicarbossilici","Fosfoanidridi"],"ans":2,"why":"Nella glicolisi ci sono esosi, esteri fosforici e fosfoanidridi (ATP, 1,3-BPG). Gli acidi dicarbossilici (malato, ossalacetato, succinato) sono del ciclo di Krebs.","note":null,"times":1,"pending":false,"level":"m"},{"id":"doppio-legame","topic":"m2-glicolisi","page":"45","src":"Biochimica II","q":"Quale dei seguenti composti della glicolisi ha un doppio legame?","opts":["2-fosfoglicerato","Fosfoenolpiruvato","Fruttosio 1,6-bisfosfato","Piruvato"],"ans":1,"why":"Il PEP ha un doppio legame C=C (forma enolica). Carbossili e chetoni hanno C=O, ma la domanda intende il doppio legame tra carboni.","note":null,"times":1,"pending":false,"level":"m"},{"id":"ga3p-fbp","topic":"m2-glicolisi","page":"41","src":"Biochimica II","q":"Una soluzione contiene gliceraldeide 3-P. Quali enzimi bisogna aggiungere per formare fruttosio 1,6 bisfosfato?","opts":["Gliceraldeide 3-P deidrogenasi + aldolasi","Gliceraldeide 3-P deidrogenasi + aldolasi + triosofosfato isomerasi","Triosofosfato isomerasi + diidrossiacetone 3-P deidrogenasi","Aldolasi + triosofosfato isomerasi"],"ans":3,"why":"La trioso fosfato isomerasi forma DHAP da una parte della GA3P, poi l'aldolasi (reversibile) condensa DHAP + GA3P in FBP.","note":null,"times":1,"pending":false,"level":"a"},{"id":"fbp-f6p","topic":"m2-glicolisi","page":"41, 146","src":"Biochimica II","q":"Una soluzione contiene gliceraldeide 3-P, aldolasi e triosofosfato isomerasi, quindi si forma fruttosio 1,6-bisfosfato. Quale ulteriore enzima della via glicolitica, aggiunto, permetterà la formazione del fruttosio 6-P?","opts":["Nessuno","Bastano quelli presenti","Fosfofruttochinasi 1","Fosfoesoso isomerasi"],"ans":0,"why":"Per FBP → F6P serve la fruttosio 1,6-bisfosfatasi, che è della gluconeogenesi. La PFK1 è irreversibile e la fosfoesoso isomerasi agisce su F6P/G6P.","note":"Nel foglio la domanda dice «alla soluzione precedente»: qui è collegata a quella sulla gliceraldeide 3-P. Se a lezione la soluzione era un'altra, fallo presente segnalandolo.","times":1,"pending":false,"level":"a"},{"id":"ferm-irrev","topic":"m2-fermentazioni","page":"53","src":"Biochimica II","q":"La fermentazione etanolica non è un processo reversibile. Perché?","opts":["Perché avviene in due tappe","Non ci sono nei microrganismi gli enzimi per le reazioni inverse","La prima tappa della fermentazione alcolica è una decarbossilazione","L'acetaldeide si ossida velocemente in acetato"],"ans":2,"why":"Piruvato → acetaldeide + CO₂: la decarbossilazione è irreversibile. La riduzione ad etanolo (alcol deidrogenasi) invece è reversibile.","note":null,"times":1,"pending":false,"level":"m"},{"id":"etanolo-vera","topic":"m2-fermentazioni","page":"53","src":"Biochimica II","q":"Quale di queste affermazioni è vera per l'etanolo?","opts":["La conversione in acetato richiede 1 NADH","La conversione in acetato richiede l'aldeide deidrogenasi","In eccesso di etanolo, diminuisce la formazione di lattato","È consigliabile assumere etanolo prima di una attività sportiva"],"ans":1,"why":"Etanolo → acetaldeide (alcol deidrogenasi) → acetato (aldeide deidrogenasi): si producono 2 NADH. L'NADH in eccesso spinge il piruvato a lattato, quindi il lattato aumenta.","note":null,"times":1,"pending":false,"level":"a"},{"id":"etanolo-falsa","topic":"m2-fermentazioni","page":"53, 169","src":"Biochimica II","q":"Quale affermazione è falsa per l'etanolo?","opts":["Passa la barriera ematoencefalica","La sua conversione in acetato avviene nel fegato","La produzione di acido acetico è un processo fermentativo","L'alcol deidrogenasi è un enzima costitutivo"],"ans":2,"why":"Nel fegato l'etanolo viene ossidato con NAD⁺: è un'ossidazione, non una fermentazione (che serve a riossidare NADH). L'alcol deidrogenasi è costitutiva; inducibile è il citocromo P450.","note":null,"times":1,"pending":false,"level":"a"},{"id":"ldh-falsa","topic":"m2-fermentazioni","page":"50","src":"Biochimica II","q":"Quale affermazione è falsa per la lattico deidrogenasi?","opts":["È un enzima a chiralità selettiva","È sempre un omotetramero","È un enzima dipendente dal pH","È presente nei globuli rossi"],"ans":1,"why":"È un tetramero di subunità H e M: solo H4 e M4 sono omotetrameri, M3H, M2H2 e MH3 sono eterotetrameri.","note":"Sbobina di Biochimica II, p. 49: c'è scritto che la LDH forma solo l'isomero «R». L'L-lattato è (S)-lattato.","times":1,"pending":false,"level":"m"},{"id":"ldh1","topic":"m2-fermentazioni","page":"50, 52","src":"Biochimica II","q":"La presenza nel sangue dell'isoenzima LDH1 può essere indice di:","opts":["Strappi muscolari","Fragilità dei globuli rossi","Infarto del miocardio","Cirrosi epatica"],"ans":2,"why":"LDH1 = H4, isoenzima cardiaco: marker tardivo di infarto (circa 48 ore). Sale anche nell'emolisi, ma la risposta attesa è l'infarto.","note":null,"times":1,"pending":false,"level":"m"},{"id":"cori","topic":"m2-fermentazioni","page":"51, 148","src":"Biochimica II","q":"Quale di queste condizioni deve essere soddisfatta dal fegato per il ciclo di Cori?","opts":["Deve essere attiva la via glicolitica","Ci deve essere un alto rapporto NAD⁺/NADH","Deve essere attiva la trasduzione del segnale dell'insulina","Deve essere attiva la glucochinasi"],"ans":1,"why":"Il fegato ossida il lattato a piruvato con la LDH: serve molto NAD⁺. Glicolisi e glucochinasi devono essere ferme, perché si fa gluconeogenesi.","note":null,"times":1,"pending":false,"level":"m"},{"id":"anion-gap","topic":"m2-fermentazioni","page":"52","src":"Biochimica II","q":"L'anion gap (AG) in biochimica clinica è dato da AG = [Na⁺] − ([Cl⁻] + [HCO₃⁻]). In presenza di lattato il valore dell'AG:","opts":["Rimane invariato","Aumenta","Diminuisce","Si annulla"],"ans":1,"why":"Il lattato è un anione non misurato: il bicarbonato cala per tamponare l'H⁺, quindi l'AG aumenta (acidosi lattica ad anion gap aumentato).","note":"L'anion gap non è nelle sbobine.","times":1,"pending":false,"level":"a"},{"id":"dhap-rid","topic":"m2-navette","page":"54","src":"Biochimica II","q":"Quale composto si forma dalla riduzione NADH dipendente del diidrossiacetone fosfato?","opts":["Non può essere ridotto","Gliceraldeide 3-P","Un alfachetoacido","Glicerolo fosfato"],"ans":3,"why":"Il chetone del DHAP si riduce ad alcol secondario: glicerolo 3-fosfato. È il primo passo della navetta del glicerolo fosfato.","note":"Sbobina di Biochimica II, p. 54: chiama il glicerolo 3-fosfato «3-fosfoglicerolo (3-PG)». Non confonderlo con il 3-fosfoglicerato, che altrove è abbreviato 3-PG.","times":2,"pending":false,"level":"m"},{"id":"navetta-fad","topic":"m2-navette","page":"54","src":"Biochimica II","q":"Nel sistema navetta del glicerolo fosfato:","opts":["Il FADH₂ è ossidato dal diidrossiacetone fosfato","Il NADH cede gli elettroni direttamente al FAD","Il glicerolo fosfato è ossidato dal FAD","Il FADH₂ cede gli elettroni direttamente all'ossigeno"],"ans":2,"why":"La glicerolo 3-fosfato deidrogenasi mitocondriale, FAD-dipendente, ossida il glicerolo fosfato a DHAP; il FADH₂ passa gli elettroni alla catena respiratoria (coenzima Q).","note":null,"times":1,"pending":false,"level":"m"},{"id":"navetta-atp","topic":"m2-navette","page":"47, 54","src":"Biochimica II","q":"Se la riossidazione del NADH produce 2,5 ATP e quella del FADH₂ 1,5 ATP, quante ATP si formano in totale da glucosio a piruvato se il sistema navetta è quello del glicerolo fosfato?","opts":["3","4","5","7"],"ans":2,"why":"2 ATP netti + 2 NADH citosolici che, con la navetta del glicerolo fosfato, diventano FADH₂: 2 + 2 × 1,5 = 5.","note":null,"times":1,"pending":false,"level":"a"}],"bank":[{"id":"m1c-01","topic":"m1-catabolismo","level":"f","page":"5","src":"Biochimica II","q":"Il catabolismo è:","opts":["La degradazione di molecole complesse in molecole più semplici, con produzione di energia","La sintesi di molecole complesse a partire da molecole semplici","L'insieme delle reazioni che consumano ATP","L'eliminazione dei metaboliti terminali con le urine"],"ans":0,"why":"Il catabolismo degrada nutrienti e componenti cellulari ricavando energia (ATP) e potere riducente; l'anabolismo fa il contrario.","note":null,"fixed":false},{"id":"m1c-02","topic":"m1-catabolismo","level":"f","page":"6–9","src":"Biochimica II","q":"Quali sono i metaboliti terminali del catabolismo?","opts":["Piruvato e acetil-CoA","CO₂, H₂O e NH₃ (eliminata come urea)","Glucosio e acidi grassi","ATP e NADH"],"ans":1,"why":"I metaboliti terminali non rientrano nel metabolismo: CO₂ si elimina con la respirazione, H₂O si unisce all'acqua corporea, NH₃ diventa urea.","note":null,"fixed":false},{"id":"m1c-03","topic":"m1-catabolismo","level":"f","page":"8–9","src":"Biochimica II","q":"Verso quali intermedi comuni convergono le vie cataboliche di carboidrati, lipidi e proteine?","opts":["Glucosio e glicerolo","Piruvato e acetil-CoA","Urea e CO₂","Ossalacetato e citrato"],"ans":1,"why":"Piruvato e acetil-CoA sono i metaboliti intermedi in cui convergono le vie cataboliche.","note":null,"fixed":false},{"id":"m1c-04","topic":"m1-catabolismo","level":"m","page":"9","src":"Biochimica II","q":"Che cosa distingue un metabolita intermedio da uno terminale?","opts":["Il metabolita intermedio può essere sia ossidato per dare energia sia usato per biosintesi","Il metabolita intermedio è sempre più ossidato di quello terminale","Il metabolita terminale entra nel ciclo di Krebs","Il metabolita intermedio viene eliminato con le urine"],"ans":0,"why":"L'acetil-CoA, ad esempio, può entrare nel ciclo di Krebs oppure diventare acidi grassi e colesterolo: la cellula decide in base alle sue necessità.","note":null,"fixed":false},{"id":"m1c-05","topic":"m1-catabolismo","level":"m","page":"6–7","src":"Biochimica II","q":"Perché l'anabolismo ha bisogno di potere riducente?","opts":["Perché le biosintesi sono in gran parte processi riduttivi","Perché l'anabolismo produce NADH","Perché il potere riducente sostituisce l'ATP","Perché tutte le biosintesi avvengono nel mitocondrio"],"ans":0,"why":"Il catabolismo è ossidativo e produce coenzimi ridotti; l'anabolismo è riduttivo e li consuma. Per le biosintesi il coenzima è soprattutto il NADPH.","note":"Sbobina di Biochimica II, p. 6–7: c'è scritto che il potere riducente per le biosintesi è «soprattutto NADH». Per le biosintesi riduttive (acidi grassi, colesterolo) il coenzima è il NADPH; il NADH serve soprattutto alla fosforilazione ossidativa.","fixed":false},{"id":"m1c-06","topic":"m1-catabolismo","level":"a","page":"8","src":"Biochimica II","q":"Nella sequenza glicolisi → ciclo di Krebs → fosforilazione ossidativa, dove si forma la maggior parte dell'ATP e perché?","opts":["Nella glicolisi, perché è la via più veloce","Nel ciclo di Krebs, perché ossida completamente l'acetil-CoA","Nella fosforilazione ossidativa, perché riossida i coenzimi ridotti cedendo gli elettroni all'O₂","In tutte e tre in quantità simile"],"ans":2,"why":"Glicolisi e Krebs producono poco ATP ma molti coenzimi ridotti; la riossidazione di NADH e FADH₂ con l'ossigeno nella fosforilazione ossidativa produce la gran parte dell'ATP.","note":null,"fixed":false},{"id":"m1c-07","topic":"m1-catabolismo","level":"a","page":"7","src":"Biochimica II","q":"L'acetil-CoA è precursore di tutte le seguenti molecole tranne:","opts":["Acidi grassi","Colesterolo","Ormoni steroidei","Glucosio (nell'uomo)"],"ans":3,"why":"Nell'uomo l'acetil-CoA non può diventare glucosio: la piruvato deidrogenasi è irreversibile e nel ciclo di Krebs i due carboni dell'acetile escono come CO₂.","note":"Il fatto che l'acetil-CoA non dia glucosio non è detto esplicitamente in questa parte della sbobina.","fixed":false},{"id":"m1c-08","topic":"m1-catabolismo","level":"l","page":"6","src":"Biochimica II","q":"Come si chiama la forma ossidata del nicotinammide adenin dinucleotide fosfato?","opts":["NADP⁺","NADPH","NAD⁺","FADP"],"ans":0,"why":"NADP⁺ è la forma ossidata, NADPH quella ridotta. Si distingue dal NAD⁺ per un fosfato sul 2' del ribosio legato all'adenina.","note":null,"fixed":false},{"id":"m1t-01","topic":"m1-termodinamica","level":"f","page":"10","src":"Biochimica II","q":"Che cosa dice la termodinamica di una reazione?","opts":["Se può avvenire spontaneamente","Quanto velocemente avviene","Quale enzima la catalizza","Quanta attivazione serve"],"ans":0,"why":"La termodinamica (ΔG) dice se una reazione è possibile; la velocità è oggetto della cinetica.","note":null,"fixed":false},{"id":"m1t-02","topic":"m1-termodinamica","level":"f","page":"11","src":"Biochimica II","q":"Se Keq > 1, il ΔG°' della reazione è:","opts":["Positivo","Negativo","Zero","Indeterminabile"],"ans":1,"why":"ΔG°' = −RT ln Keq: con Keq > 1 il logaritmo è positivo e il ΔG°' negativo, la reazione procede verso i prodotti.","note":"Sbobina di Biochimica II, p. 11: parla di «keq > 0», «keq = 0» e «keq < 0». La Keq è sempre positiva: i casi corretti sono Keq > 1, = 1 e < 1. Nella formula manca anche il logaritmo: ΔG°' = −RT ln Keq.","fixed":false},{"id":"m1t-03","topic":"m1-termodinamica","level":"m","page":"11","src":"Biochimica II","q":"Quali sono le condizioni standard biochimiche a cui si riferisce il ΔG°'?","opts":["pH 7, 25 °C, reagenti e prodotti 1 M","pH 7,4, 37 °C, concentrazioni cellulari","pH 0, 0 °C, 1 atm","pH 7, 37 °C, reagenti 1 mM"],"ans":0,"why":"pH 7, 298 K (25 °C) e tutte le specie a 1 M; per questo nella cellula il ΔG reale è diverso.","note":"Sbobina di Biochimica II, p. 10: c'è scritto «T = 273 °K (+25 °C)». 25 °C sono 298 K; 273 K sono 0 °C.","fixed":false},{"id":"m1t-04","topic":"m1-termodinamica","level":"m","page":"12","src":"Biochimica II","q":"In una serie A ⇌ B ⇌ C all'equilibrio, cosa succede se la cellula consuma C?","opts":["Si forma più A","Aumenta la trasformazione di A in B e di B in C","Non cambia nulla perché le reazioni sono all'equilibrio","La Keq aumenta"],"ans":1,"why":"Per il principio di Le Chatelier, sottrarre il prodotto sposta tutte le reazioni della serie verso destra.","note":null,"fixed":false},{"id":"m1t-05","topic":"m1-termodinamica","level":"a","page":"12","src":"Biochimica II","q":"Perché le reazioni regolate di una via metabolica hanno ΔG molto negativo?","opts":["Perché sono le più veloci","Perché sono praticamente irreversibili: lì la via si può accendere o spegnere senza che torni indietro","Perché non hanno bisogno di enzimi","Perché sono all'equilibrio"],"ans":1,"why":"Le reazioni vicine all'equilibrio vanno nei due sensi secondo le concentrazioni; quelle con ΔG molto negativo vanno in un solo senso e sono il punto in cui intervengono gli enzimi allosterici.","note":null,"fixed":false},{"id":"m1t-06","topic":"m1-termodinamica","level":"a","page":"12","src":"Biochimica II","q":"Una reazione ha ΔG°' = +5 kJ/mol. Nella cellula procede verso destra. Come è possibile?","opts":["Non è possibile: con ΔG°' positivo la reazione va sempre a sinistra","Perché il prodotto viene consumato e il rapporto prodotti/reagenti resta basso, rendendo il ΔG negativo","Perché l'enzima rende il ΔG°' negativo","Perché a 37 °C il ΔG°' cambia segno"],"ans":1,"why":"ΔG = ΔG°' + RT ln([P]/[R]): se il prodotto è basso il termine logaritmico è negativo e può superare il ΔG°'. È il caso dell'aldolasi nella glicolisi.","note":null,"fixed":false},{"id":"m1t-07","topic":"m1-termodinamica","level":"l","page":"11","src":"Biochimica II","q":"Nella formula ΔG°' = −RT ln Keq, che cosa indica l'apice (')?","opts":["Che il valore è riferito a pH 7","Che il valore è a 37 °C","Che è la seconda misura","Che è espresso in kcal"],"ans":0,"why":"L'apice distingue lo standard biochimico (pH 7) da quello chimico (attività dell'H⁺ = 1, pH 0).","note":"La distinzione tra ΔG° e ΔG°' non è esplicitata nella sbobina.","fixed":false},{"id":"m1a-01","topic":"m1-atp","level":"f","page":"13","src":"Biochimica II","q":"Quanto vale il ΔG°' di idrolisi dell'ATP ad ADP + Pi?","opts":["−30,5 kJ/mol (−7,3 kcal/mol)","−14 kJ/mol","−61 kJ/mol","+30 kJ/mol"],"ans":0,"why":"È il valore di riferimento per i composti ad alta energia.","note":"Sbobina di Biochimica II, p. 13: subito dopo il valore di −30 kJ/mol c'è scritto che il ΔG di idrolisi dell'ATP «è ampiamente positivo». È negativo: l'idrolisi è favorita.","fixed":false},{"id":"m1a-02","topic":"m1-atp","level":"f","page":"13","src":"Biochimica II","q":"Che legame unisce il fosfato α al ribosio nell'ATP?","opts":["Fosfoanidridico","Fosfoestere","N-glicosidico","Tioestere"],"ans":1,"why":"Ribosio (OH in 5') + fosfato = fosfoestere. Tra α-β e β-γ ci sono legami fosfoanidridici.","note":null,"fixed":false},{"id":"m1a-03","topic":"m1-atp","level":"f","page":"19","src":"Biochimica II","q":"Quale di questi composti ha un potenziale di trasferimento del fosfato maggiore dell'ATP?","opts":["Glucosio 6-fosfato","Fosfoenolpiruvato","Glicerolo 3-fosfato","AMP"],"ans":1,"why":"PEP, 1,3-bisfosfoglicerato e fosfocreatina superano l'ATP e possono cedergli il fosfato.","note":null,"fixed":false},{"id":"m1a-04","topic":"m1-atp","level":"m","page":"14","src":"Biochimica II","q":"Perché l'idrolisi dei legami fosfoanidridici dell'ATP libera molta energia?","opts":["Perché i prodotti sono più stabilizzati (risonanza, solvatazione) e si elimina la repulsione tra cariche negative vicine","Perché il legame P–O è molto più debole dei legami C–C","Perché si forma una molecola d'acqua","Perché il magnesio viene liberato"],"ans":0,"why":"Repulsione elettrostatica nel reagente e maggiore stabilizzazione per risonanza e solvatazione dei prodotti.","note":null,"fixed":false},{"id":"m1a-05","topic":"m1-atp","level":"m","page":"14","src":"Biochimica II","q":"La scissione ATP → AMP + PPi seguita dall'idrolisi del pirofosfato libera in tutto circa:","opts":["−30 kJ/mol","−45 kJ/mol","−60 kJ/mol","−90 kJ/mol"],"ans":2,"why":"Due legami fosfoanidridici scissi: circa −30 + −30. L'idrolisi del PPi rende irreversibili molte biosintesi.","note":null,"fixed":false},{"id":"m1a-06","topic":"m1-atp","level":"m","page":"15","src":"Biochimica II","q":"Qual è la forma dell'ATP che partecipa alle reazioni enzimatiche?","opts":["ATP libero","Mg-ATP","Ca-ATP","ATP protonato"],"ans":1,"why":"Il Mg²⁺ si lega ai fosfati, riduce la repulsione tra le cariche ed è la forma riconosciuta dagli enzimi ATP-dipendenti.","note":null,"fixed":false},{"id":"m1a-07","topic":"m1-atp","level":"m","page":"20","src":"Biochimica II","q":"Che cosa fa la creatina chinasi all'inizio di uno sforzo muscolare?","opts":["Trasferisce il fosfato della fosfocreatina all'ADP formando ATP","Trasferisce il fosfato dell'ATP alla creatina","Idrolizza la fosfocreatina liberando Pi","Converte la creatina in creatinina"],"ans":0,"why":"La fosfocreatina (ΔG°' ≈ −43 kJ/mol) rigenera ATP dall'ADP: è la prima riserva di energia del muscolo. La reazione è reversibile e dipende dalle concentrazioni.","note":"Sbobina di Biochimica II, p. 20: c'è scritto che la creatina fosfato è in grado di «fosforilare l'ATP per riformare ADP». È il contrario: fosforila l'ADP e riforma ATP.","fixed":false},{"id":"m1a-08","topic":"m1-atp","level":"a","page":"14–16","src":"Biochimica II","q":"Nel muscolo, dopo un digiuno prolungato, una rialimentazione ricca di carboidrati può causare:","opts":["Ipofosfatemia, perché il fosfato viene richiamato nelle cellule per fosforilare gli zuccheri","Iperfosfatemia per eccesso di ATP","Ipoglicemia per eccesso di insulina","Acidosi lattica immediata"],"ans":0,"why":"È la sindrome da rialimentazione: il fosfato plasmatico crolla perché finisce negli zuccheri fosforilati e nell'ATP, con rischio soprattutto per il cuore.","note":null,"fixed":false},{"id":"m1a-09","topic":"m1-atp","level":"a","page":"16–17","src":"Biochimica II","q":"Se la carica energetica di una cellula scende da 0,9 a 0,6:","opts":["Aumentano le vie che consumano ATP","Aumentano le vie che generano ATP e rallentano quelle che lo consumano","Catabolismo e anabolismo restano invariati","La cellula sintetizza più glicogeno"],"ans":1,"why":"Sotto 0,9 prevalgono le vie cataboliche; sopra prevalgono quelle anaboliche.","note":null,"fixed":false},{"id":"m1a-10","topic":"m1-atp","level":"a","page":"17–18","src":"Biochimica II","q":"Durante la sintesi proteica dopo un pasto, perché la nucleotide difosfato chinasi produce GTP solo quando serve?","opts":["Perché è regolata dall'insulina","Perché ha ΔG°' ≈ 0: il consumo di GTP sposta l'equilibrio verso la sua formazione","Perché è inibita dall'ATP","Perché è un enzima allosterico attivato dal GDP"],"ans":1,"why":"È un'azione di massa: più GTP viene consumato, più la reazione ATP + GDP ⇌ ADP + GTP va verso destra.","note":null,"fixed":false},{"id":"m1a-11","topic":"m1-atp","level":"l","page":"17","src":"Biochimica II","q":"Quale nucleotide trifosfato si usa soprattutto per la biosintesi dei lipidi complessi (fosfolipidi)?","opts":["UTP","GTP","CTP","TTP"],"ans":2,"why":"UTP per i carboidrati (UDP-glucosio), GTP per le proteine, CTP per i lipidi (CDP-diacilglicerolo, CDP-colina).","note":null,"fixed":false},{"id":"m1a-12","topic":"m1-atp","level":"l","page":"13","src":"Biochimica II","q":"Nell'ATP, l'adenina è legata al ribosio. Come si chiama correttamente la molecola adenina + ribosio?","opts":["Adenosina","Adenina","Adenilato","Desossiadenosina"],"ans":0,"why":"Adenina è la base, adenosina il nucleoside (base + ribosio), adenilato (AMP) il nucleotide.","note":"Sbobina di Biochimica II, p. 13: c'è scritto «la base azotata adenosina». La base è l'adenina; l'adenosina è il nucleoside.","fixed":false},{"id":"m1a-13","topic":"m1-atp","level":"l","page":"20","src":"Biochimica II","q":"Qual è l'isoenzima della creatina chinasi usato come marker precoce di infarto?","opts":["CK-MM","CK-BB","CK-MB","CK-MiMi"],"ans":2,"why":"CK-MB è l'isoenzima cardiaco; CK-MM è muscolare scheletrico, CK-BB cerebrale.","note":null,"fixed":false},{"id":"m1a-14","topic":"m1-atp","level":"l","page":"15","src":"Biochimica II","q":"Quale concentrazione plasmatica di fosfato è nel range normale nell'adulto?","opts":["Circa 3–4,5 mg/dl","Circa 30 mg/dl","Circa 0,3 mg/dl","Circa 100 mg/dl"],"ans":0,"why":"La fosfatemia normale nell'adulto è circa 2,5–4,5 mg/dl.","note":"Sbobina di Biochimica II, p. 15: indica una fosfatemia di «30 mg/decilitro». Il valore normale è circa 3–4,5 mg/dl. Il range non è nella sbobina: viene dai testi di riferimento.","fixed":false},{"id":"m1o-01","topic":"m1-coenzimi","level":"f","page":"23","src":"Biochimica II","q":"L'ossidazione di un alcol secondario produce:","opts":["Un'aldeide","Un chetone","Un acido carbossilico","Un estere"],"ans":1,"why":"Alcol primario → aldeide → acido; alcol secondario → chetone.","note":null,"fixed":false},{"id":"m1o-02","topic":"m1-coenzimi","level":"f","page":"21","src":"Biochimica II","q":"Da quali vitamine derivano NAD e FAD?","opts":["Niacina e riboflavina","Tiamina e piridossina","Biotina e acido folico","Cobalamina e acido pantotenico"],"ans":0,"why":"NAD da niacina (B3), FAD da riboflavina (B2).","note":null,"fixed":false},{"id":"m1o-03","topic":"m1-coenzimi","level":"m","page":"23","src":"Biochimica II","q":"Che cosa riceve il NAD⁺ quando si riduce?","opts":["Due atomi di idrogeno","Uno ione idruro (H⁻, cioè 2 elettroni)","Un protone","Un elettrone singolo"],"ans":1,"why":"Il NAD⁺ accetta un idruro; il secondo protone va in soluzione (NADH + H⁺). Il FAD invece accetta due atomi di idrogeno.","note":null,"fixed":false},{"id":"m1o-04","topic":"m1-coenzimi","level":"m","page":"23","src":"Biochimica II","q":"Il passaggio succinato → fumarato:","opts":["È un'idratazione","È un'ossidazione FAD-dipendente che crea un doppio legame C=C","È un'ossidazione NAD-dipendente","Non è una reazione redox"],"ans":1,"why":"Da due carboni saturi a un doppio legame si perdono 2 elettroni: il FAD è l'accettore adatto.","note":null,"fixed":false},{"id":"m1o-05","topic":"m1-coenzimi","level":"m","page":"24","src":"Biochimica II","q":"A pH 7,4 un acido carbossilico con pKa ≈ 3,5 si trova:","opts":["Quasi tutto protonato (–COOH)","Metà protonato e metà deprotonato","Quasi tutto deprotonato (–COO⁻)","Come estere"],"ans":2,"why":"Il pH è molto sopra il pKa: per questo nella cellula si dice piruvato, lattato, malato (suffisso -ato).","note":null,"fixed":false},{"id":"m1o-06","topic":"m1-coenzimi","level":"a","page":"22–23","src":"Biochimica II","q":"Ordina dal più ridotto al più ossidato il carbonio in: metano, metanolo, formaldeide, acido formico, CO₂.","opts":["Metano → metanolo → formaldeide → acido formico → CO₂","CO₂ → acido formico → formaldeide → metanolo → metano","Metanolo → metano → formaldeide → CO₂ → acido formico","Formaldeide → metanolo → metano → acido formico → CO₂"],"ans":0,"why":"Stati di ossidazione: −4, −2, 0, +2, +4. Ogni passaggio perde 2 elettroni.","note":null,"fixed":true},{"id":"m1o-07","topic":"m1-coenzimi","level":"a","page":"23","src":"Biochimica II","q":"Una reazione redox biochimica si scrive con quattro termini. Quali?","opts":["Donatore ridotto + accettore ossidato → donatore ossidato + accettore ridotto","Substrato + enzima → prodotto + enzima","Ossidante + riducente → acqua + energia","Reagente + ATP → prodotto + ADP"],"ans":0,"why":"Es. malato (donatore ridotto) + NAD⁺ (accettore ossidato) → ossalacetato + NADH + H⁺.","note":null,"fixed":false},{"id":"m1o-08","topic":"m1-coenzimi","level":"a","page":"22–23","src":"Biochimica II","q":"Il passaggio da aldeide a chetone isomerico (es. gliceraldeide 3-P → diidrossiacetone fosfato) è:","opts":["Un'ossidazione","Una riduzione","Un'isomerizzazione, senza cambiare lo stato di ossidazione complessivo","Una decarbossilazione"],"ans":2,"why":"Aldeide e chetone isomerici hanno lo stesso numero di elettroni: lo catalizza un'isomerasi, senza NAD.","note":null,"fixed":false},{"id":"m1o-09","topic":"m1-coenzimi","level":"l","page":"24","src":"Biochimica II","q":"Qual è il nome corretto della specie deprotonata dell'acido piruvico?","opts":["Piruvato","Piruvico","Piruvile","Piruvinato"],"ans":0,"why":"Suffisso -ico per l'acido protonato, -ato per la base coniugata, che è la forma presente a pH fisiologico.","note":null,"fixed":false},{"id":"m1o-10","topic":"m1-coenzimi","level":"l","page":"21","src":"Biochimica II","q":"Quale sigla indica la forma ridotta del flavin adenin dinucleotide?","opts":["FAD","FADH₂","FMN","FADH⁺"],"ans":1,"why":"Il FAD accetta due atomi di idrogeno (2 e⁻ + 2 H⁺) e diventa FADH₂. L'FMN è il flavin mononucleotide (complesso I).","note":null,"fixed":false},{"id":"m1e-01","topic":"m1-enzimologia","level":"f","page":"27","src":"Biochimica II","q":"Che cosa indica la KM?","opts":["La concentrazione di substrato a cui v = ½ Vmax","La velocità massima dell'enzima","La concentrazione dell'enzima","La costante di equilibrio"],"ans":0,"why":"Più la KM è bassa, maggiore è l'affinità dell'enzima per il substrato.","note":null,"fixed":false},{"id":"m1e-02","topic":"m1-enzimologia","level":"f","page":"28","src":"Biochimica II","q":"Che forma ha la curva v/[S] di un enzima allosterico cooperativo?","opts":["Iperbolica","Sigmoide","Lineare","Esponenziale decrescente"],"ans":1,"why":"Gli enzimi di Michaelis-Menten danno un'iperbole; gli allosterici una sigmoide, descritta dalla K0,5.","note":null,"fixed":false},{"id":"m1e-03","topic":"m1-enzimologia","level":"f","page":"28","src":"Biochimica II","q":"Nella forma R un enzima allosterico è:","opts":["Inattivo (teso)","Attivo (rilassato)","Denaturato","Fosforilato"],"ans":1,"why":"R = relaxed, attiva; T = tense, inattiva.","note":null,"fixed":false},{"id":"m1e-04","topic":"m1-enzimologia","level":"m","page":"27","src":"Biochimica II","q":"Due enzimi hanno la stessa Vmax e KM₁ < KM₂. Quale è più affine al substrato?","opts":["L'enzima 1","L'enzima 2","Sono ugualmente affini","Dipende dalla concentrazione dell'enzima"],"ans":0,"why":"KM più bassa = mezza velocità massima raggiunta a concentrazione di substrato più bassa = maggiore affinità.","note":null,"fixed":false},{"id":"m1e-05","topic":"m1-enzimologia","level":"m","page":"29","src":"Biochimica II","q":"Gli ormoni regolano gli enzimi soprattutto con:","opts":["Effettori allosterici","Modificazioni covalenti come la fosforilazione","Variazioni di pH","Variazioni di temperatura"],"ans":1,"why":"La regolazione allosterica è locale (cellula per cellula); gli ormoni agiscono con protein chinasi e fosfatasi.","note":null,"fixed":false},{"id":"m1e-06","topic":"m1-enzimologia","level":"a","page":"27–29","src":"Biochimica II","q":"Un farmaco abbassa la K0,5 di un enzima allosterico senza cambiare la Vmax. Come si comporta?","opts":["Da effettore allosterico positivo","Da effettore allosterico negativo","Da inibitore competitivo","Da denaturante"],"ans":0,"why":"La K0,5 più bassa sposta la sigmoide a sinistra: l'enzima lavora meglio a basse concentrazioni di substrato.","note":null,"fi
