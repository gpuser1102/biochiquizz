<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biochiquiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f4f6fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Biochiquiz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Layout: app a una schermata — feed a scroll verticale con snap, una card per schermata,
   tab bar blu notte fissa in basso con voce attiva a pillola corallo. Palette B: corallo e blu notte. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #f4f6fa;
  --line: #dde3ee;
  --ink: #0e1a33;
  --muted: #5a6782;
  --accent: #f24e2a;
  --accent-ink: #ffffff;
  --accent-soft: #ffe6df;
  --tabbar-bg: #0e1a33;
  --tabbar-ink: #8a97b3;
  --tabbar-on: #ffffff;
  --tile-rose: #ffe6df;
  --tile-peach: #e2f5f3;
  --tile-sage: #e2f4ea;
  --tile-sky: #e3ecfb;
  --tile-lilac: #ece8fb;
  --good: #16884a;
  --good-soft: #e3f6ea;
  --bad: #d23a2a;
  --bad-soft: #fde7e3;
  --warn: #5b3fd6;
  --warn-soft: #efebff;
  --patch: #ffe6df;
  --patch-line: #f24e2a;
  --young: #8ea3d6;
  --tile-ring: transparent;
  --key-bg: rgba(48, 82, 156, .74);
  --key-hi: rgba(255, 255, 255, .42);
  --key-ring: rgba(255, 255, 255, .5);
  --mol-ink: #0e1a33;
  --shadow: 0 1px 2px rgba(14, 26, 51, .05), 0 10px 28px rgba(14, 26, 51, .08);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r-card: 28px;
  --r-ctl: 16px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #050608; --surface: #0e1014; --surface-2: #15181e; --line: #2e333e;
    --ink: #f1f3f7; --muted: #9aa1b0; --accent: #ff6a47; --accent-ink: #ffffff; --accent-soft: #3a1a14;
    --tabbar-bg: #000000; --tabbar-ink: #7d8494; --tabbar-on: #ffffff;
    --tile-rose: #33171a; --tile-peach: #0f2a28; --tile-sage: #10291c; --tile-sky: #142035; --tile-lilac: #211c3a;
    --tile-ring: rgba(255, 255, 255, .14);
    --key-bg: rgba(150, 170, 220, .24); --key-hi: rgba(255, 255, 255, .24); --key-ring: rgba(255, 255, 255, .26);
    --good: #5ed493; --good-soft: #0f2a1b; --bad: #ff8575; --bad-soft: #33130f; --warn: #b9a8ff; --warn-soft: #1d1833;
    --patch: #3a1a14; --patch-line: #ff6a47; --young: #5f7bc0; --mol-ink: #f1f3f7;
    --shadow: 0 0 0 1px rgba(255,255,255,.04), 0 10px 28px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #050608; --surface: #0e1014; --surface-2: #15181e; --line: #2e333e;
    --ink: #f1f3f7; --muted: #9aa1b0; --accent: #ff6a47; --accent-ink: #ffffff; --accent-soft: #3a1a14;
    --tabbar-bg: #000000; --tabbar-ink: #7d8494; --tabbar-on: #ffffff;
    --tile-rose: #33171a; --tile-peach: #0f2a28; --tile-sage: #10291c; --tile-sky: #142035; --tile-lilac: #211c3a;
    --tile-ring: rgba(255, 255, 255, .14);
    --key-bg: rgba(150, 170, 220, .24); --key-hi: rgba(255, 255, 255, .24); --key-ring: rgba(255, 255, 255, .26);
    --good: #5ed493; --good-soft: #0f2a1b; --bad: #ff8575; --bad-soft: #33130f; --warn: #b9a8ff; --warn-soft: #1d1833;
    --patch: #3a1a14; --patch-line: #ff6a47; --young: #5f7bc0; --mol-ink: #f1f3f7;
    --shadow: 0 0 0 1px rgba(255,255,255,.04), 0 10px 28px rgba(0,0,0,.6);
    color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--font);
  -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

.app { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.view { flex: 1; min-height: 0; position: relative; }
.view[hidden] { display: none !important; }

/* ---------- Tab bar ---------- */
.tabbar {
  display: flex; justify-content: space-around; align-items: center; gap: 4px;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  background: var(--tabbar-bg);
}
.tab {
  flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: 0; padding: 4px 0; color: var(--tabbar-ink); font-size: 11px; font-weight: 600; cursor: pointer;
}
.tab .pill { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 999px; transition: background .2s; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--tabbar-on); }
.tab[aria-selected="true"] .pill { background: var(--accent); }

/* ---------- Pagine scrollabili (argomenti, statistiche, info) ---------- */
.page {
  height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
}
.page-inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.h1 { font: 800 30px/1.1 var(--font-display); letter-spacing: -.02em; margin: 6px 0 0; text-wrap: balance; }
.lead { color: var(--muted); margin: 0; font-size: 15px; }
.h2 { font: 700 13px/1.2 var(--font); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 4px 0; }

.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 6px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; min-width: 0; }
.row + .row { border-top: 1px solid var(--line); border-radius: 0; }
.tile { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); box-shadow: inset 0 0 0 1px var(--tile-ring); }
.tile svg { width: 21px; height: 21px; }
.t-rose { background: var(--tile-rose); } .t-peach { background: var(--tile-peach); } .t-sage { background: var(--tile-sage); }
.t-sky { background: var(--tile-sky); } .t-lilac { background: var(--tile-lilac); }
.row-text { flex: 1; min-width: 0; }
.row-title { font-weight: 700; font-size: 16px; }
.row-sub { color: var(--muted); font-size: 13px; margin-top: 1px; }

/* Argomenti */
.block-head { width: 100%; background: none; border: 0; text-align: left; cursor: pointer; }
.block-head .chev { transition: transform .2s; color: var(--muted); }
.block-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.topics { padding: 0 6px 6px 64px; display: flex; flex-direction: column; gap: 2px; }
.topic { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 14px; cursor: pointer; }
.topic input { position: absolute; opacity: 0; pointer-events: none; }
.check { flex: none; width: 24px; height: 24px; border-radius: 8px; border: 1.5px solid var(--line); display: grid; place-items: center; background: var(--surface); }
.check svg { width: 16px; height: 16px; opacity: 0; color: var(--accent-ink); }
.topic input:checked + .check { background: var(--accent); border-color: var(--accent); }
.topic input:checked + .check svg { opacity: 1; }
.topic input:focus-visible + .check { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.topic .tname { flex: 1; min-width: 0; font-size: 15px; }
.topic .tmeta { font-size: 12px; color: var(--muted); white-space: nowrap; }
.topic.soon { cursor: default; opacity: .5; }
.topic.soon .check { border-style: dashed; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.badge.new { background: var(--accent-soft); color: var(--accent); }

.switch-row { display: flex; align-items: center; gap: 12px; padding: 12px; }
.switch { position: relative; flex: none; width: 50px; height: 30px; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }

.seg { display: flex; background: var(--surface-2); border-radius: 14px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 6px; border-radius: 11px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r-ctl); padding: 14px 18px; font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: var(--bad-soft); color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: default; }

/* ---------- Feed ---------- */
.feed {
  height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
}
.slide {
  height: 100%; scroll-snap-align: start; scroll-snap-stop: always;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px; display: flex;
}
.card {
  flex: 1; max-width: 560px; margin: 0 auto; min-width: 0; min-height: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.card-body { flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 14px); }
.card-body > * { flex-shrink: 0; }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-kicker { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.card-topic { font-size: 13px; color: var(--muted); margin-top: 1px; }
.q { font: 800 clamp(18px, 2.6vh, 22px)/1.2 var(--font-display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }

.mol-box { background: var(--surface-2); border-radius: 22px; display: flex; align-items: center; justify-content: center; padding: 8px; position: relative; }
.card-body > .mol-box { flex: 1 1 0; min-height: 96px; }
.mol-box svg { width: 100%; height: 100%; max-height: 300px; display: block; }
.mol-box .fallback { color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }
.mol-tag { position: absolute; left: 12px; top: 10px; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

.options { display: flex; flex-direction: column; gap: clamp(5px, .9vh, 8px); }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: clamp(8px, 1.35vh, 12px) 12px; font-size: 15px; font-weight: 600;
}
.opt .key { flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--surface-2); color: var(--muted); }
.opt:not([disabled]):active { transform: scale(.99); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .key { background: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: var(--surface); }
.opt[disabled] { cursor: default; }

.write { display: flex; gap: 8px; }
.write input {
  flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 13px 14px; border-radius: var(--r-ctl);
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
}
.write input:focus { outline: none; border-color: var(--accent); }
.linkish { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 14px; padding: 4px 0; cursor: pointer; align-self: flex-start; }

/* Reazione da completare */
.rx { background: var(--surface-2); border-radius: 22px; padding: clamp(10px, 1.6vh, 16px) 14px; display: flex; flex-direction: column; gap: 10px; }
.rx-side { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rx-item { padding: 7px 11px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-weight: 650; font-size: 15px; }
.rx-item.cof { font-weight: 600; color: var(--muted); }
.rx-plus { color: var(--muted); font-weight: 700; }
.rx-arrow { display: flex; align-items: center; gap: 10px; padding-left: 4px; }
.rx-arrow .stem { flex: none; width: 2px; height: clamp(28px, 4.5vh, 46px); background: var(--ink); position: relative; margin-left: 10px; }
.rx-arrow .stem::after { content: ""; position: absolute; left: -5px; bottom: -2px; border: 6px solid transparent; border-top: 9px solid var(--ink); border-bottom: 0; }
.rx-arrow .stem.rev::before { content: ""; position: absolute; left: -5px; top: -2px; border: 6px solid transparent; border-bottom: 9px solid var(--ink); border-top: 0; }
.rx-enz { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rx-enz .enz { font-weight: 700; color: var(--accent); font-size: 15px; }
.rx-enz .co { font-size: 13px; color: var(--muted); }
.patch {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 12px; font-weight: 800; font-size: 15px;
  background: var(--patch); min-width: 64px; justify-content: center;
  border: 1.5px dashed var(--patch-line); color: var(--patch-line);
}
.patch.revealed { transform: none; background: var(--good-soft); border: 1.5px solid var(--good); color: var(--ink); }
.patch.revealed.miss { background: var(--bad-soft); border-color: var(--bad); }

.feedback { border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.feedback.ok { background: var(--good-soft); }
.feedback.ko { background: var(--bad-soft); }
.feedback .verdict { font-weight: 800; font-size: 17px; }
.feedback.ok .verdict { color: var(--good); }
.feedback.ko .verdict { color: var(--bad); }
.feedback .meta { color: var(--muted); font-size: 13px; }
.note { background: var(--warn-soft); border-radius: 18px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; }
.note b { color: var(--warn); }

.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px 12px 18px; border-top: 1px solid var(--line); }
.report { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 6px 0; text-decoration: none; }
.report svg { width: 16px; height: 16px; }
.next-hint { font-size: 13px; font-weight: 700; color: var(--accent); display: inline-flex; align-items: center; gap: 4px; opacity: 0; transition: opacity .3s; }
.answered .next-hint { opacity: 1; }
.next-hint svg { width: 16px; height: 16px; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

.empty { height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
.empty .box { padding: 26px 22px; max-width: 420px; display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* Statistiche */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px 12px; }
.stat .num { font: 800 26px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat .lbl { font-size: 12px; color: var(--muted); margin-top: 6px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* Benvenuto */
.welcome {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(20px, env(safe-area-inset-left, 0px));
}
.welcome-inner { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.hero-mark { width: 64px; height: 64px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.hero-mark svg { width: 36px; height: 36px; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 2px; }
.step { display: flex; gap: 12px; align-items: flex-start; padding: 12px; }
.step + .step { border-top: 1px solid var(--line); }
.step::before { counter-increment: s; content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 14px; }
.inline-ico { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; color: var(--accent); }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px);
}
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
.confirm .btns { display: flex; gap: 8px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  .feed { scroll-behavior: auto; }
}


/* Feedback a pop-up ancorato alla risposta */
.opt, .write { position: relative; }
.opt.has-pop, .write.has-pop { z-index: 3; }
.opt-label { flex: 1; min-width: 0; }
.write.right input { border-color: var(--good); background: var(--good-soft); }
.write.wrong input { border-color: var(--bad); background: var(--bad-soft); }
.pop {
  position: absolute; left: 10px; right: 10px; top: calc(100% - 4px); z-index: 4;
  display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: default;
  padding: 10px 12px; border-radius: 16px; border: 1.5px solid; font-size: 14px; font-weight: 500; line-height: 1.35;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .16); animation: pop-in .2s cubic-bezier(.2, .9, .3, 1.2) both; transform-origin: 24px 0;
}
.pop::before { content: ""; position: absolute; left: 18px; top: -7px; width: 12px; height: 12px; background: inherit; border: inherit; border-right: 0; border-bottom: 0; transform: rotate(45deg); }
.pop.up { top: auto; bottom: calc(100% - 4px); transform-origin: 24px 100%; }
.pop.up::before { top: auto; bottom: -7px; transform: rotate(225deg); }
.pop.ok { background: var(--good-soft); border-color: var(--good); }
.pop.ko { background: var(--bad-soft); border-color: var(--bad); }
.pop-verdict { font-weight: 800; font-size: 15px; }
.pop.ok .pop-verdict { color: var(--good); }
.pop.ko .pop-verdict { color: var(--bad); }
.pop-meta { color: var(--muted); font-size: 12.5px; }
.pop-note { margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--line); font-size: 13px; }
.pop-note b { color: var(--warn); }

@keyframes pop-in { from { opacity: 0; transform: scale(.94) translateY(-4px); } to { opacity: 1; transform: none; } }

/* Valutazione stile Anki dentro il pop-up */
.rate { display: flex; gap: 6px; margin-top: 6px; }
.rate-b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 4px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer; }
.rate-b small { font-size: 11px; font-weight: 600; color: var(--muted); }
.rate-b[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.rate-b[aria-pressed="true"] small { color: var(--surface); opacity: .75; }
.bar.two { display: flex; }
.bar.two i { border-radius: 0; }
.bar.two i.young { background: var(--young); }
.stats-grid .lbl { line-height: 1.25; }

/* Nessuna barra di scorrimento visibile: si scorre solo tra una card e l'altra */
.feed, .page { scrollbar-width: none; }
.feed::-webkit-scrollbar, .page::-webkit-scrollbar { display: none; }
/* card con molto testo su schermi bassi: si compatta invece di scorrere */
.card.tight .card-head { display: none; }
.card.tight .rx-item, .card.tight .patch { padding: 5px 9px; font-size: 14px; }
.card.tight .opt { padding-block: 7px; }
.card.tight .opt .key { width: 24px; height: 24px; }
/* crediti */
.credit { display: flex; align-items: center; gap: 14px; padding: 14px; }
.credit .mono { flex: none; width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 20px/1 var(--font-display); letter-spacing: .02em; box-shadow: inset 0 0 0 1px var(--tile-ring); }
.credit .who { font: 800 19px/1.15 var(--font-display); }
.credit .role { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* Domande verificate: testo lungo, opzioni su più righe */
.ex-q { font-size: clamp(17px, 2.4vh, 20px); line-height: 1.25; }
.ex-q u { text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--accent); }
.opt .opt-label { line-height: 1.3; }
.card.tight .ex-q { font-size: 16px; }
.card.tight .opt { font-size: 14px; }
.pop-note.info b { color: var(--muted); }

/* Segnalazione: foglio dal basso */
.sheet-wrap { position: fixed; inset: 0; z-index: 70; background: rgba(5, 8, 15, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease both; }
.sheet {
  width: 100%; max-width: 560px; background: var(--surface); border-radius: 26px 26px 0 0; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px; max-height: 92%; overflow-y: auto; scrollbar-width: none;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  animation: rise .22s cubic-bezier(.2, .9, .3, 1) both;
}
.sheet::-webkit-scrollbar { display: none; }
.sheet-grip { width: 40px; height: 5px; border-radius: 99px; background: var(--line); align-self: center; margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sheet textarea, .sheet input[type="text"], .copy-area { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: var(--r-ctl); border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); resize: none; }
.sheet textarea:focus, .sheet input[type="text"]:focus { outline: none; border-color: var(--accent); }
.sheet input.bad { border-color: var(--bad); }
.field-err { color: var(--bad); font-size: 13px; font-weight: 600; margin-top: -4px; }
.copy-area { margin: 0 12px 12px; width: calc(100% - 24px); height: 120px; font-size: 12px; }
.sheet-btns { display: flex; gap: 8px; }
.sheet-btns .btn { flex: 1; }
.update-bar {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 65;
  display: flex; align-items: center; gap: 12px; width: calc(100% - 28px); max-width: 520px;
  background: var(--ink); color: var(--bg); border-radius: 18px; padding: 8px 8px 8px 16px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow);
}
.update-bar span { flex: 1; min-width: 0; }
.update-bar .btn { padding: 9px 14px; font-size: 14px; }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>

"m2-glicolisi","m5-glicerolo"],"ga3p":["m2-glicolisi"],"bpg13":["m2-glicolisi"],"pg3":["m2-glicolisi"],"pg2":["m2-glicolisi"],"pep":["m2-glicolisi","m5-reazioni"],"pyr":["m2-glicolisi","m5-reazioni"],"oaa":["m5-reazioni"],"mal":["m5-reazioni"],"lac":["m5-reazioni"],"ala":["m5-reazioni"],"gly":["m5-glicerolo"],"gro3p":["m5-glicerolo"]},"cofactorPool":["ATP","ADP","AMP","GTP","GDP","NAD⁺","NADH + H⁺","NADP⁺","FAD","FADH₂","Pi","PPi","H₂O","CO₂","HCO₃⁻","Biotina","Tiamina pirofosfato","Coenzima A","Mg²⁺"],"extraEnzymes":["Glucosio 6-fosfato deidrogenasi","Glicogeno fosforilasi","Fosfoglucomutasi","Piruvato deidrogenasi","Citrato sintasi","Fosfofruttochinasi 2","Lattico deidrogenasi","Transaminasi"],"exam":[{"id":"eq","topic":"m1-termodinamica","page":"10–12","src":"Biochimica II","q":"La definizione migliore per una reazione vicina all'equilibrio è:","opts":["avviene sempre con una variazione di energia libera","ha una variazione di energia libera vicina a zero","di solito è un punto di controllo di una via metabolica","avviene molto lentamente"],"ans":1,"why":"Vicino all'equilibrio ΔG ≈ 0: la reazione è reversibile e il verso dipende solo dalle concentrazioni. I punti di controllo sono invece le reazioni con ΔG molto negativo.","note":null,"times":2,"pending":false},{"id":"dg-dg0","topic":"m1-termodinamica","page":"11–12","src":"Biochimica II","q":"Il ΔG differisce dal ΔG°' quando si ha:","opts":["una variazione della concentrazione di enzima","una variazione della concentrazione degli ioni divalenti","una variazione del Keq","una diversa concentrazione dei reagenti e prodotti"],"ans":3,"why":"ΔG = ΔG°' + RT ln([prodotti]/[reagenti]): cambia con le concentrazioni. L'enzima cambia solo la velocità e la Keq è una costante.","note":null,"times":2,"pending":false},{"id":"atp-ph","topic":"m1-atp","page":"15","src":"Biochimica II","q":"L'energia libera standard della scissione dell'ATP in ADP e fosfato è −30 kJ/mole. Al pH fisiologico questo valore:","opts":["diviene più negativo","diviene più positivo","resta invariato","dipende dalla concentrazione del magnesio"],"ans":0,"why":"Più alto è il pH, più l'idrolisi è favorita: a pH 7,4 il ΔG scende sotto −30 kJ/mol. Il magnesio stabilizza l'ATP, ma la domanda chiede l'effetto del pH.","note":null,"times":2,"pending":false},{"id":"atp-legami","topic":"m1-atp","page":"14, 25","src":"Biochimica II","q":"Quale di questi legami non è presente nell'ATP?","opts":["N-glicosidico","Emiacetalico","Fosfodiestere","Fosfoestere"],"ans":2,"why":"Nell'ATP ci sono il legame N-glicosidico (adenina–ribosio), il fosfoestere (ribosio–fosfato α) e due fosfoanidridici. Il fosfodiestere lega i nucleotidi negli acidi nucleici.","note":"Sbobina di Biochimica II, p. 25: dice che il legame emiacetalico si trova «nel ribosio e nell'ATP». Nell'ATP il C1' del ribosio è legato all'adenina, quindi è un N-glicoside e non più un emiacetale. All'esame la risposta attesa resta fosfodiestere.","times":2,"pending":false},{"id":"slp-def","topic":"m1-atp","page":"19, 44","src":"Biochimica II","q":"Che cos'è la fosforilazione dell'ATP a livello del substrato?","opts":["Il trasferimento del fosfato in gamma dell'ATP ad una molecola con formazione di un legame estere","La formazione dell'ATP dall'ADP e Pi mediante riossidazione del NADH","L'idrolisi dell'ATP","La formazione dell'ATP dall'ADP e Pi mediante energia rilasciata dalla scissione di un composto con un ΔG°' minore di −30 kJ/mole"],"ans":3,"why":"Un composto con potenziale di trasferimento più alto dell'ATP (1,3-BPG, PEP) cede il fosfato all'ADP. La B è la fosforilazione ossidativa, la A una normale reazione chinasica.","note":null,"times":2,"pending":false},{"id":"ndpk","topic":"m1-atp","page":"17–18","src":"Biochimica II","q":"Quale di queste affermazioni è falsa riguardo alla nucleotide difosfato chinasi?","opts":["Trasferisce il fosfato in gamma da un trinucleotide ad un dinucleotide","Ha un'energia libera standard vicina allo zero","La sua azione favorisce i processi catabolici","La reazione dipende dal consumo degli NTP"],"ans":2,"why":"Forma GTP, UTP e CTP per le biosintesi (proteine, zuccheri, lipidi): favorisce l'anabolismo. Ha ΔG°' ≈ 0 e va avanti perché gli NTP vengono consumati. «Trinucleotide/dinucleotide» sta per nucleoside trifosfato/difosfato.","note":null,"times":2,"pending":false},{"id":"carica","topic":"m1-atp","page":"16–17","src":"Biochimica II","q":"In una cellula le concentrazioni di ATP ed ADP sono equivalenti e quella dell'AMP è trascurabile. In queste condizioni:","opts":["Prevarrà il catabolismo","Prevarrà l'anabolismo","I due processi sono equivalenti","Il ΔG°' di idrolisi aumenta"],"ans":0,"why":"Carica energetica = ([ATP] + ½[ADP]) / ([ATP] + [ADP] + [AMP]) = 1,5/2 = 0,75. Sotto il valore normale di 0,9 aumentano le vie che generano ATP.","note":null,"times":2,"pending":false},{"id":"no-atp","topic":"m2-ingresso","page":"32–33","src":"Biochimica II","q":"Quale di questi processi non richiede ATP?","opts":["Fosforilazione del glucosio","Trasporto del glucosio dal sangue alle cellule","Pompa sodio potassio","Pompa del calcio"],"ans":1,"why":"I GLUT fanno diffusione facilitata secondo gradiente. Esochinasi, Na⁺/K⁺-ATPasi e Ca²⁺-ATPasi consumano ATP.","note":"Sbobina di Biochimica II, p. 32: l'SGLT1 (scritto «SGLUT1») è descritto prima come «trasportatore attivo che utilizza ATP» e poi come simporto senza ATP. È un trasporto attivo secondario: l'ATP lo consuma la pompa Na⁺/K⁺, non l'SGLT1.","times":2,"pending":false},{"id":"legami-energia","topic":"m1-atp","page":"19–20","src":"Biochimica II","q":"Ordina per energia libera, dalla più positiva alla più negativa, la scissione di: fosfoguanidinico della creatina fosfato (A), fosfoestere (B), tioestere (C), fosfoanidridico (D).","opts":["A-B-C-D","B-D-C-A","C-D-B-A","B-C-A-D"],"ans":1,"why":"ΔG°' di idrolisi: fosfoestere (es. glucosio 6-P) ≈ −14 kJ/mol, fosfoanidridico dell'ATP ≈ −30, tioestere dell'acetil-CoA −31,4, fosfocreatina ≈ −43.","note":null,"times":1,"pending":false},{"id":"pk-base","topic":"m1-coenzimi","page":"24","src":"Biochimica II","q":"La base B ha un pK pari a 9,0. A pH 9,0 in soluzione si avrà:","opts":["Uguale concentrazione di B e B⁻","Uguale concentrazione di B e B⁺","Prevalenza della forma B","Prevalenza della forma B⁺"],"ans":1,"why":"A pH = pK le due forme sono in uguale concentrazione. La base B accetta un protone e diventa BH⁺ (B⁺).","note":null,"times":2,"pending":false},{"id":"etanolo-nad","topic":"m1-coenzimi","page":"53","src":"Biochimica II","q":"L'etanolo, in presenza degli enzimi necessari, reagisce con due molecole di NAD⁺. Il prodotto finale è:","opts":["Etano","Acetaldeide","Acetato","Anidride carbonica"],"ans":2,"why":"Etanolo → acetaldeide (alcol deidrogenasi, 1 NAD⁺) → acetato (aldeide deidrogenasi, 1 NAD⁺).","note":null,"times":2,"pending":false},{"id":"chetoacido","topic":"m1-coenzimi","page":"23–24, 49","src":"Biochimica II","q":"La riduzione di un alfa-chetoacido produce:","opts":["un composto con un alcol primario e un gruppo aldeidico","un composto con alcol secondario e un gruppo carbossilico","un composto con un chetone ed un gruppo carbossilico","un composto con due gruppi carbossilici"],"ans":1,"why":"Il chetone in α si riduce ad alcol secondario e il carbossile resta: piruvato → lattato.","note":null,"times":2,"pending":false},{"id":"elettroni-glc","topic":"m1-coenzimi","page":"22","src":"Biochimica II","q":"Quanti elettroni vengono persi per la completa ossidazione della molecola di glucosio ad anidride carbonica ed acqua?","opts":["8","12","24","32"],"ans":2,"why":"Ogni carbonio del glucosio passa in media da 0 a +4: 6 × 4 = 24 elettroni, cioè le 12 coppie raccolte da 10 NADH e 2 FADH₂.","note":null,"times":1,"pending":false},{"id":"ox-carbossile","topic":"m1-coenzimi","page":"22","src":"Biochimica II","q":"Quale di queste affermazioni è vera riguardo l'ossidazione di un gruppo carbossilico?","opts":["Non è possibile","Riguarda solo la forma deprotonata","Viene rilasciato come CO₂","È una reazione reversibile"],"ans":2,"why":"Il carbonio carbossilico è il più ossidato di una molecola organica: l'ultimo passaggio possibile è la sua eliminazione come CO₂, come nelle decarbossilazioni del ciclo di Krebs.","note":null,"times":1,"pending":false},{"id":"elettroni-acoa","topic":"m1-coenzimi","page":"22","src":"Biochimica II","q":"L'acetil-CoA (CH₃COSCoA) viene ossidato nel ciclo di Krebs a 2 molecole di CO₂. Quanti elettroni vengono persi nell'ossidazione?","opts":["2","4","6","8"],"ans":3,"why":"I due carboni dell'acetile passano in totale da 0 a +8: 8 elettroni, raccolti da 3 NADH e 1 FADH₂ (4 coppie).","note":null,"times":1,"pending":false},{"id":"c-secondario","topic":"m1-coenzimi","page":"23","src":"Biochimica II","q":"Per ossidare un carbonio secondario saturo a chetone quali passaggi sono necessari?","opts":["Ossidazione NAD dipendente con aggiunta di una molecola d'acqua","Idratazione seguita da un'ossidazione","Ossidazione, idratazione ed un ulteriore ossidazione","Non è possibile la trasformazione"],"ans":2,"why":"Ossidazione FAD-dipendente a doppio legame (succinato → fumarato), idratazione ad alcol secondario (→ malato), ossidazione NAD-dipendente a chetone (→ ossalacetato).","note":null,"times":1,"pending":false},{"id":"no-acqua","topic":"m1-coenzimi","page":"25","src":"Biochimica II","q":"Quale tra questi legami non richiede la perdita di una molecola d'acqua per la sua formazione?","opts":["Estere","Fosfoanidridico","Emiacetalico","Glicosidico"],"ans":2,"why":"L'emiacetale si forma per addizione dell'OH al carbonile (C5–OH sul C1 del glucosio). Estere, fosfoanidride e glicoside sono condensazioni.","note":null,"times":1,"pending":false},{"id":"glc-fru","topic":"m1-enzimologia","page":"23, 40","src":"Biochimica II","q":"La trasformazione da glucosio a fruttosio è catalizzata da:","opts":["Idrolasi","Ossidoreduttasi","Chinasi","Isomerasi"],"ans":3,"why":"Glucosio (aldoso) e fruttosio (chetoso) sono isomeri: la conversione non cambia lo stato di ossidazione (es. fosfoesoso isomerasi, G6P → F6P).","note":null,"times":2,"pending":false},{"id":"idrolasi","topic":"m1-enzimologia","page":"31","src":"Biochimica II","q":"Quali di questi enzimi appartiene alla classe delle idrolasi?","opts":["Proteasi","Amilasi","Lipasi","Tutte e tre"],"ans":3,"why":"Proteasi, amilasi e lipasi scindono legami usando l'acqua: sono tutte idrolasi.","note":null,"times":1,"pending":false},{"id":"es-saturante","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"Se in una reazione enzimatica tutto l'enzima è nella forma ES vuol dire che:","opts":["Il substrato è uguale alla KM","La concentrazione dell'enzima è uguale a quella del substrato","Si è raggiunta metà della Vmax","Il substrato è saturante"],"ans":3,"why":"Con tutto l'enzima legato come ES si lavora a Vmax: il substrato è saturante.","note":null,"times":1,"pending":false},{"id":"primaria","topic":"m1-enzimologia","page":"25","src":"Biochimica I","q":"In quale livello di struttura di una proteina non intervengono legami deboli?","opts":["Primaria","Secondaria","Terziaria","Quaternaria"],"ans":0,"why":"La primaria è la sequenza unita da legami peptidici covalenti. Secondaria, terziaria e quaternaria dipendono da legami deboli (idrogeno, ionici, idrofobici).","note":null,"times":1,"pending":false},{"id":"piu-enzima","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"In una reazione enzimatica un ulteriore aumento dell'enzima provoca:","opts":["Aumento della KM","Aumento della Vmax","Diminuzione della KM","Aumento della kcat"],"ans":1,"why":"Vmax = k₂[E]: cresce con l'enzima. KM e kcat sono costanti.","note":null,"times":1,"pending":false},{"id":"km-unita","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"Le dimensioni della KM sono:","opts":["s⁻¹","M","s M⁻¹","M⁻¹"],"ans":1,"why":"La KM è la concentrazione di substrato a cui v = ½ Vmax: si misura in M.","note":null,"times":1,"pending":false},{"id":"k05-neg","topic":"m1-enzimologia","page":"28","src":"Biochimica II","q":"La K0,5 (KM apparente) di un enzima allosterico, in presenza di un effettore allosterico negativo:","opts":["Non subisce variazioni","Diminuisce","Aumenta","Dipende dalla concentrazione del substrato"],"ans":2,"why":"L'effettore negativo sposta l'equilibrio verso T: la sigmoide va a destra e la K0,5 aumenta.","note":null,"times":2,"pending":false},{"id":"t-r","topic":"m1-enzimologia","page":"28","src":"Biochimica II","q":"In un enzima allosterico la transizione dalla forma T alla forma R è inibita da:","opts":["Effettore omotropico negativo","Effettore eterotropico negativo","Effettore eterotropico positivo","Gli effettori allosterici non hanno influenza"],"ans":1,"why":"La inibisce un effettore negativo diverso dal substrato (eterotropico). L'effettore omotropico è il substrato stesso e di solito è positivo.","note":null,"times":1,"pending":false},{"id":"s-km","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"Quando la concentrazione di substrato è uguale alla KM:","opts":["La velocità è uguale alla velocità massima","Tutto l'enzima è legato al substrato","La velocità è metà della velocità massima","Diminuisce la formazione del prodotto"],"ans":2,"why":"È la definizione di KM: la concentrazione di substrato a cui v = ½ Vmax.","note":null,"times":1,"pending":false},{"id":"serina","topic":"m1-enzimologia","page":"29","src":"Biochimica II","q":"Quale tra questi residui aminoacidici si può trovare nel sito di fosforilazione di una proteina substrato di una protein chinasi?","opts":["Fenilalanina","Serina","Aspartato","Lisina"],"ans":1,"why":"Le protein chinasi fosforilano l'OH di serina e treonina (e tirosina).","note":null,"times":1,"pending":false},{"id":"lento","topic":"m1-enzimologia","page":"30","src":"Biochimica II","q":"Tra i meccanismi di regolazione, quale tra questi rientra in un meccanismo lento?","opts":["Controllo allosterico","Espressione dell'enzima","Fosforilazione dell'enzima","Nessuno dei tre"],"ans":1,"why":"Allosteria e fosforilazione sono rapide. Cambiare la quantità di enzima (sintesi o degradazione) richiede ore.","note":null,"times":1,"pending":false},{"id":"acqua-sub","topic":"m1-enzimologia","page":"146","src":"Biochimica II","q":"Quali tra questi enzimi ha l'acqua come substrato?","opts":["Isomerasi","Chinasi","Ossidoreduttasi (deidrogenasi)","Fosfatasi"],"ans":3,"why":"La fosfatasi idrolizza l'estere fosforico (es. glucosio 6-fosfatasi). Le chinasi usano ATP, le deidrogenasi NAD/FAD.","note":null,"times":1,"pending":false},{"id":"mutasi","topic":"m1-enzimologia","page":"45","src":"Biochimica II","q":"Enzimi che trasferiscono gruppi sostituenti in posizioni diverse della stessa molecola si chiamano:","opts":["Isomerasi","Fosforilasi","Chinasi","Mutasi"],"ans":3,"why":"Le mutasi spostano un gruppo nella stessa molecola: 3-fosfoglicerato → 2-fosfoglicerato.","note":null,"times":1,"pending":false},{"id":"glut-fegato","topic":"m2-ingresso","page":"32–33","src":"Biochimica II","q":"Quali sono i trasportatori di glucosio nell'epatocita?","opts":["GLUT1","GLUT2","GLUT3","GLUT4"],"ans":1,"why":"GLUT2: fegato, pancreas e membrana basolaterale dell'enterocita. Kt 17 mM, alta capacità: lavora dopo i pasti.","note":null,"times":1,"pending":false},{"id":"glut4","topic":"m2-ingresso","page":"33, 35","src":"Biochimica II","q":"In quali tra queste cellule l'insulina permette il trasferimento sulla superficie dei trasportatori GLUT4?","opts":["Neuroni","Globuli rossi","Epatociti","Adipociti"],"ans":3,"why":"GLUT4: muscolo scheletrico, cuore e tessuto adiposo.","note":null,"times":1,"pending":false},{"id":"glut-entero","topic":"m2-ingresso","page":"32","src":"Biochimica II","q":"Quale trasportatore del glucosio si trova sulla membrana basolaterale degli enterociti?","opts":["GLUT1","GLUT2","GLUT3","GLUT4"],"ans":1,"why":"Dal lume il glucosio entra con l'SGLT1, verso il sangue esce con il GLUT2 basolaterale.","note":null,"times":1,"pending":false},{"id":"glut-bidir","topic":"m2-ingresso","page":"33","src":"Biochimica II","q":"I trasportatori GLUT sono:","opts":["unidirezionali","bidirezionali","possono assumere una sola conformazione","sono tutti sotto controllo ormonale"],"ans":1,"why":"Diffusione facilitata: il verso dipende solo dal gradiente (il fegato a digiuno libera glucosio con il GLUT2). Hanno due conformazioni, T1 e T2, e solo il GLUT4 è sotto controllo ormonale.","note":null,"times":1,"pending":false},{"id":"glut-tumore","topic":"m2-ingresso","page":"64 e seguenti (pagine non numerate, effetto Warburg)","src":"Biochimica II","q":"In una cellula tumorale aumenta l'espressione di GLUT. Si tratterà di:","opts":["GLUT1","GLUT2","GLUT3","GLUT4"],"ans":0,"why":"Nelle cellule tumorali il fattore HIF è attivo anche con l'ossigeno e fa trascrivere enzimi glicolitici, LDH e trasportatori: soprattutto il GLUT1, ad alta affinità, che lavora già a glicemia basale (effetto Warburg).","note":"La sbobina cita sia GLUT1 sia GLUT3 tra i geni attivati da HIF: la risposta attesa è GLUT1. Se a lezione è stato detto diversamente, fallo presente segnalandolo.","times":1,"pending":false},{"id":"gr-insulina","topic":"m2-ingresso","page":"33","src":"Biochimica II","q":"Quale di queste cellule non ha il recettore per l'insulina?","opts":["Epatocita","Miocita","Adipocita","Globulo rosso"],"ans":3,"why":"Il globulo rosso prende il glucosio con il GLUT1, indipendente dall'insulina. Esistono pochi recettori anche sugli eritrociti, ma la risposta attesa è questa.","note":null,"times":1,"pending":false},{"id":"insulina-sec","topic":"m2-ingresso","page":"34","src":"Biochimica II","q":"Quali di questi eventi non è coinvolto nella secrezione dell'insulina?","opts":["Fosforilazione del glucosio per opera della glucochinasi","Fosforilazione ossidativa","Ingresso di ioni potassio","Ingresso del calcio"],"ans":2,"why":"L'ATP chiude i canali del K⁺: il potassio smette di uscire, la membrana si depolarizza, entra Ca²⁺ e partono le vescicole di insulina.","note":null,"times":1,"pending":false},{"id":"glut1-neonati","topic":"m2-ingresso","page":"33","src":"Biochimica II","q":"Quali di questi eventi è più probabile che avvengano in neonati che presentano mutazioni del gene che codifica per GLUT1? (E come intervenire?)","opts":["Ipoglicemia","Problemi neurologici","Insufficienza renale","Insufficienza cardiaca"],"ans":1,"why":"Il GLUT1 porta il glucosio oltre la barriera ematoencefalica: il deficit dà convulsioni e ritardo dello sviluppo con glicemia normale. Si interviene con la dieta chetogenica, perché i corpi chetonici entrano nel cervello con altri trasportatori.","note":"Il nome della sindrome (deficit di GLUT1) e la dieta chetogenica non sono nelle sbobine.","times":1,"pending":false},{"id":"glut-placenta","topic":"m2-ingresso","page":null,"src":"Biochimica II","q":"Quale trasportatore del glucosio vi aspettate di trovare nelle cellule della placenta?","opts":["GLUT1","GLUT2","GLUT3","GLUT4"],"ans":0,"why":"Nella placenta il trasportatore principale è il GLUT1: come nella barriera ematoencefalica, deve far passare glucosio già a glicemia basale.","note":"Non è nelle sbobine (Lehninger).","times":1,"pending":false},{"id":"peptide-c","topic":"m2-ingresso","page":"36","src":"Biochimica II","q":"Un paziente con iperglicemia presenta nel sangue valori normali del peptide C originato dal taglio della proinsulina. Questo dato indica che:","opts":["L'insulina non viene prodotta dalle cellule del pancreas","L'insulina non trasporta i GLUT4 sulle membrane delle cellule muscolari","Il trasporto del glucosio nel fegato è rallentato","La glucochinasi del pancreas è c… (fine illeggibile nella foto)"],"ans":1,"why":"Peptide C normale = l'insulina viene prodotta. L'iperglicemia dipende dall'insulino-resistenza: i GLUT4 non vengono esposti sulla membrana.","note":null,"times":1,"pending":false},{"id":"glc-atp","topic":"m2-fosforilazione","page":"37, 40","src":"Biochimica II","q":"Nella reazione: Glucosio + ATP → Glucosio 6P + ADP","opts":["Il fosfato in alfa dell'ATP è trasferito al glucosio","La scissione dell'ATP spinge la reazione verso destra","Si forma un legame anidridico","Il ΔG°' è ampiamente positivo"],"ans":1,"why":"Viene trasferito il fosfato γ e si forma un fosfoestere. La reazione è accoppiata all'idrolisi dell'ATP, che rende il ΔG negativo.","note":null,"times":2,"pending":false},{"id":"glucochinasi","topic":"m2-fosforilazione","page":"37","src":"Biochimica II","q":"Quale delle seguenti affermazioni è vera per la glucochinasi?","opts":["È un enzima ubiquitario","Trasforma il glucosio in glucosio 1-P","Ha una KM superiore a quella dell'esochinasi","Forma un legame fosfoanidridico tra il glucosio ed il fosfato"],"ans":2,"why":"La glucochinasi (esochinasi IV) è solo in fegato e pancreas, ha una KM circa 100 volte più alta dell'esochinasi e forma glucosio 6-P con un fosfoestere.","note":null,"times":1,"pending":false},{"id":"g6p-falsa","topic":"m2-fosforilazione","page":"38, 65","src":"Biochimica II","q":"Quale tra queste affermazioni non è vera per il glucosio 6P?","opts":["È il precursore del ribosio","Può essere immagazzinato sotto forma di glicogeno","Passa liberamente nel mitocondrio","Nell'epatocita può essere convertito in glucosio"],"ans":2,"why":"La membrana mitocondriale interna è impermeabile: il G6P resta nel citosol. Dà ribosio (pentoso fosfati), glicogeno e, nel fegato, glucosio libero (glucosio 6-fosfatasi).","note":null,"times":1,"pending":false},{"id":"bilancio-g6p","topic":"m2-glicolisi","page":"47","src":"Biochimica II","q":"Il bilancio della glicolisi a partire dal glucosio-6P dà:","opts":["La riduzione di una molecola di NAD⁺","La produzione di anidride carbonica","Un aumento del pH","La formazione di 3 molecole di ATP"],"ans":3,"why":"Partendo dal G6P non si spende l'ATP dell'esochinasi: 4 prodotti − 1 (PFK1) = 3 ATP. Si riducono 2 NAD⁺, non si forma CO₂ e il pH scende.","note":null,"times":1,"pending":false},{"id":"glut5","topic":"m2-glicolisi","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Le cellule testicolari posseggono trasportatori GLUT5. Quanti ATP si formano nella glicolisi?","opts":["1","2","3","4"],"ans":1,"why":"Il GLUT5 trasporta fruttosio. Nel muscolo il fruttosio diventa fruttosio 6-P con l'esochinasi; nel fegato fruttosio 1-P con la fruttochinasi, poi DHAP e gliceraldeide. In entrambi i casi il bilancio è di 2 ATP netti per esoso (4 prodotti, 2 spesi).","note":"Sbobina di Biochimica II, pagine non numerate dopo p. 64: la triosio chinasi fosforila la gliceraldeide a «gliceraldeide 2-fosfato». Il prodotto è la gliceraldeide 3-fosfato, come mostra anche la figura accanto.","times":1,"pending":false},{"id":"gapdh-legame","topic":"m2-glicolisi","page":"43","src":"Biochimica II","q":"Durante la catalisi della gliceraldeide 3P deidrogenasi quale legame non si forma?","opts":["Fosfoanidridico","Tioemiacetale","Fosfoestere","Tioestere"],"ans":2,"why":"Si formano il tioemiacetale (Cys–aldeide), il tioestere dopo l'ossidazione e il fosfoanidridico misto dell'1,3-BPG. Il fosfoestere in C3 c'era già nella GA3P.","note":"Sbobina di Biochimica II, p. 43: il meccanismo dice che va al NAD⁺ «l'H⁺ sotto forma di idruro» e che «la riduzione» trasforma l'aldeide. Va al NAD⁺ un idruro (H⁻), l'aldeide si ossida e si forma il tioestere con la cisteina.","times":1,"pending":false},{"id":"gapdh-cys","topic":"m2-glicolisi","page":"43","src":"Biochimica II","q":"Quale residuo aminoacidico è coinvolto nella catalisi della gliceraldeide 3-fosfato deidrogenasi?","opts":["Serina","Cisteina","Lisina","Metionina"],"ans":1,"why":"Il gruppo SH della cisteina attacca l'aldeide; per questo lo iodoacetato, che lo alchila, blocca la glicolisi.","note":null,"times":1,"pending":false},{"id":"gapdh-nadh","topic":"m2-glicolisi","page":"43","src":"Biochimica II","q":"Nella reazione GA3P + Pi + NAD⁺ ⇌ 1,3-BPG + NADH + H⁺, un aumento del NADH produce:","opts":["Una diminuzione del NAD⁺","Un aumento della GA3P","Una diminuzione del pH","Nessun cambiamento"],"ans":1,"why":"Più NADH sposta l'equilibrio a sinistra (Le Chatelier): si riforma GA3P e aumenta il NAD⁺.","note":null,"times":1,"pending":false},{"id":"slp-reazione","topic":"m2-glicolisi","page":"44","src":"Biochimica II","q":"Quale delle seguenti reazioni è una fosforilazione a livello del substrato?","opts":["Conversione della gliceraldeide in 1,3 bisfosfoglicerato","Conversione del 1,3 bisfosfoglicerato in 3-fosfoglicerato","Formazione del 2-fosfoglicerato","Formazione del fosfoenolpiruvato"],"ans":1,"why":"La fosfoglicerato chinasi: l'1,3-BPG cede il fosfato all'ADP. L'altra della glicolisi è la piruvato chinasi.","note":null,"times":1,"pending":false},{"id":"dg-negativo","topic":"m2-glicolisi","page":"47","src":"Biochimica II","q":"Quale delle seguenti reazioni della glicolisi procede con un ΔG negativo?","opts":["Conversione del glucosio 6P in fruttosio 6P","Reazione della gliceraldeide 3 fosfato deidrogenasi","Reazione dell'enolasi","Reazione della piruvato chinasi"],"ans":3,"why":"Le tre reazioni con ΔG fortemente negativo sono esochinasi/glucochinasi, PFK1 e piruvato chinasi. Le altre sono vicine all'equilibrio.","note":null,"times":2,"pending":false},{"id":"bpg-falsa","topic":"m2-glicolisi","page":"43–44","src":"Biochimica II","q":"Quale di queste affermazioni è falsa per l'1,3 bisfosfoglicerato?","opts":["Contiene un legame fosfoanidridico","Contiene un legame fosfoesterico","È meno ossidato del 3-fosfoglicerato","Ha un potenziale di trasferimento maggiore dell'ATP"],"ans":2,"why":"1,3-BPG e 3-fosfoglicerato hanno lo stesso stato di ossidazione (C1 a livello di acido): la fosfoglicerato chinasi sposta solo il fosfato.","note":null,"times":1,"pending":false},{"id":"non-glicolisi","topic":"m2-glicolisi","page":"39","src":"Biochimica II","q":"Quali tra questi composti non partecipa alla glicolisi?","opts":["Esteri fosforici","Esosi","Acidi dicarbossilici","Fosfoanidridi"],"ans":2,"why":"Nella glicolisi ci sono esosi, esteri fosforici e fosfoanidridi (ATP, 1,3-BPG). Gli acidi dicarbossilici (malato, ossalacetato, succinato) sono del ciclo di Krebs.","note":null,"times":1,"pending":false},{"id":"doppio-legame","topic":"m2-glicolisi","page":"45","src":"Biochimica II","q":"Quale dei seguenti composti della glicolisi ha un doppio legame?","opts":["2-fosfoglicerato","Fosfoenolpiruvato","Fruttosio 1,6-bisfosfato","Piruvato"],"ans":1,"why":"Il PEP ha un doppio legame C=C (forma enolica). Carbossili e chetoni hanno C=O, ma la domanda intende il doppio legame tra carboni.","note":null,"times":1,"pending":false},{"id":"ga3p-fbp","topic":"m2-glicolisi","page":"41","src":"Biochimica II","q":"Una soluzione contiene gliceraldeide 3-P. Quali enzimi bisogna aggiungere per formare fruttosio 1,6 bisfosfato?","opts":["Gliceraldeide 3-P deidrogenasi + aldolasi","Gliceraldeide 3-P deidrogenasi + aldolasi + triosofosfato isomerasi","Triosofosfato isomerasi + diidrossiacetone 3-P deidrogenasi","Aldolasi + triosofosfato isomerasi"],"ans":3,"why":"La trioso fosfato isomerasi forma DHAP da una parte della GA3P, poi l'aldolasi (reversibile) condensa DHAP + GA3P in FBP.","note":null,"times":1,"pending":false},{"id":"fbp-f6p","topic":"m2-glicolisi","page":"41, 146","src":"Biochimica II","q":"Una soluzione contiene gliceraldeide 3-P, aldolasi e triosofosfato isomerasi, quindi si forma fruttosio 1,6-bisfosfato. Quale ulteriore enzima della via glicolitica, aggiunto, permetterà la formazione del fruttosio 6-P?","opts":["Nessuno","Bastano quelli presenti","Fosfofruttochinasi 1","Fosfoesoso isomerasi"],"ans":0,"why":"Per FBP → F6P serve la fruttosio 1,6-bisfosfatasi, che è della gluconeogenesi. La PFK1 è irreversibile e la fosfoesoso isomerasi agisce su F6P/G6P.","note":"Nel foglio la domanda dice «alla soluzione precedente»: qui è collegata a quella sulla gliceraldeide 3-P. Se a lezione la soluzione era un'altra, fallo presente segnalandolo.","times":1,"pending":false},{"id":"ferm-irrev","topic":"m2-fermentazioni","page":"53","src":"Biochimica II","q":"La fermentazione etanolica non è un processo reversibile. Perché?","opts":["Perché avviene in due tappe","Non ci sono nei microrganismi gli enzimi per le reazioni inverse","La prima tappa della fermentazione alcolica è una decarbossilazione","L'acetaldeide si ossida velocemente in acetato"],"ans":2,"why":"Piruvato → acetaldeide + CO₂: la decarbossilazione è irreversibile. La riduzione ad etanolo (alcol deidrogenasi) invece è reversibile.","note":null,"times":1,"pending":false},{"id":"etanolo-vera","topic":"m2-fermentazioni","page":"53","src":"Biochimica II","q":"Quale di queste affermazioni è vera per l'etanolo?","opts":["La conversione in acetato richiede 1 NADH","La conversione in acetato richiede l'aldeide deidrogenasi","In eccesso di etanolo, diminuisce la formazione di lattato","È consigliabile assumere etanolo prima di una attività sportiva"],"ans":1,"why":"Etanolo → acetaldeide (alcol deidrogenasi) → acetato (aldeide deidrogenasi): si producono 2 NADH. L'NADH in eccesso spinge il piruvato a lattato, quindi il lattato aumenta.","note":null,"times":1,"pending":false},{"id":"etanolo-falsa","topic":"m2-fermentazioni","page":"53, 169","src":"Biochimica II","q":"Quale affermazione è falsa per l'etanolo?","opts":["Passa la barriera ematoencefalica","La sua conversione in acetato avviene nel fegato","La produzione di acido acetico è un processo fermentativo","L'alcol deidrogenasi è un enzima costitutivo"],"ans":2,"why":"Nel fegato l'etanolo viene ossidato con NAD⁺: è un'ossidazione, non una fermentazione (che serve a riossidare NADH). L'alcol deidrogenasi è costitutiva; inducibile è il citocromo P450.","note":null,"times":1,"pending":false},{"id":"ldh-falsa","topic":"m2-fermentazioni","page":"50","src":"Biochimica II","q":"Quale affermazione è falsa per la lattico deidrogenasi?","opts":["È un enzima a chiralità selettiva","È sempre un omotetramero","È un enzima dipendente dal pH","È presente nei globuli rossi"],"ans":1,"why":"È   const CARD = Object.fromEntries(CARDS.map(c => [c.id, c]));

  const activeTopics = () => {

  const eligible = () => { const a = new Set(activeTopics()); return CARDS.filter(c => c.topics.some(t => a.has(t))); };
  const cardsInTopic = id => CARDS.filter(c => c.topics.includes(id)).length;

  /* ---------------- Ripetizione spaziata: algoritmo di Anki (SM-2) ----------------
     Card nuove → passi di apprendimento (1 min, 10 min) → ripasso a giorni con intervallo × facilità.

  const MIN = 60e3, HOUR = 36e5, DAY = 864e5;
  const CFG = { learn: [1 * MIN, 10 * MIN], relearn: [10 * MIN], gradIvl: 1, easyIvl: 4, startEase: 2.5, minEase: 1.3,

  const dayStart = t => { const d = new Date(t - 4 * HOUR); d.setHours(4, 0, 0, 0); return d.getTime(); };
  const today = () => { const d = new Date(dayStart(Date.now())); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const newState = () => ({ type: "new", step: 0, ease: CFG.startEase, ivl: 0, due: 0, lapses: 0, right: 0, wrong: 0, seen: 0 });
  const fuzz = ivl => { if (ivl < 3) return ivl; const f = Math.max(1, Math.round(ivl * .05)); return ivl + Math.round((Math.random() * 2 - 1) * f); };
  // r: 1 = Di nuovo, 2 = Difficile, 3 = Buono, 4 = Facile
  function schedule(st, r, now, noFuzz) {
    const fz = noFuzz ? x => x : fuzz;

      const relearning = st.type === "relearn";
      const steps = relearning ? CFG.relearn : CFG.learn;
      if (st.type === "new") st.type = "learn";
      if (r === 1) { st.step = 0; st.due = now + steps[0]; return; }
      if (r === 2) { const cur = steps[st.step] || steps[0], nxt = steps[st.step + 1]; st.due = now + (nxt ? (cur + nxt) / 2 : cur * 1.5); return; }
      if (r === 3 && st.step + 1 < steps.length) { st.step++; st.due = now + steps[st.step]; return; }

      st.type = "review"; st.step = 0; st.due = dayStart(now) + st.ivl * DAY; return;
    }
    if (r === 1) { st.lapses++; st.ease = Math.max(CFG.minEase, st.ease - .2); st.ivl = 1; st.type = "relearn"; st.step = 0; st.due = now + CFG.relearn[0]; return; }

    if (r === 2) { ivl = Math.max(st.ivl + 1, st.ivl * CFG.hardMult); st.ease = Math.max(CFG.minEase, st.ease - .15); }
    else if (r === 3) ivl = Math.max(st.ivl + 1, st.ivl * st.ease);
    else { ivl = Math.max(st.ivl + 1, st.ivl * st.ease * CFG.easyBonus); st.ease += .15; }
    st.ivl = fz(Math.round(ivl)); st.due = dayStart(now) + st.ivl * DAY;
  }

  function grade(id, r, extra) {
    const prev = S.cards[id] ? Object.assign({}, S.cards[id]) : null;
    const now = Date.now();
    const wasNew = !prev || prev.type === "new";
    const apply = rr => {
      const st = Object.assign(newState(), prev || {});

      extra, rating: r,

  };

      "GDP": left ? "Quale nucleotide accetta il fosfato?" : "Quale nucleotide resta dopo il trasferimento del fosfato?",

      "Pi": left ? "Cosa viene incorporato nel prodotto senza consumare ATP?" : "Cosa viene liberato dall'idrolisi?",

      "CO₂": "Cosa viene liberato con la decarbossilazione?",
      "HCO₃⁻": "Da dove viene il carbonio aggiunto al piruvato?",
    };
    if (v === "ATP" && left && r.left.some(x => x[1] === "HCO₃⁻")) return "Quale nucleotide viene idrolizzato per attivare il bicarbonato?";
    return Q[v] || "Cosa manca per completare la reazione?";

    const repBox = h("div", { class: "box" }, h("div", { class: "row" }, h("div", { class: "tile t-rose" }, svgIcon("flag")),
      h("div", { class: "row-text" }, h("div", { class: "row-title" }, reps.length ? `${reps.length} ${reps.length === 1 ? "segnalazione" : "segnalazioni"} da questo telefono` : "Nessuna segnalazione"),
        h("div", { class: "row-sub" }, pending.length ? (REPORT_URL ? `${pending.length} in attesa di connessione` : `${pending.length} salvate qui: copiale e mandale a chi cura l'app`) : "Usa «Segnala errore» sotto ogni card"))));
    if (pending.length && !REPORT_URL) {
      const copy = h("button", { class: "btn btn-ghost", type: "button", style: "margin:0 12px 12px" }, "Copia segnalazioni");
      copy.addEventListener("click", async () => {
        const txt = JSON.stringify(pending, null, 1);
        try { await navigator.clipboard.writeText(txt); toast("Copiate negli appunti"); }
        catch (e) { const ta = h("textarea", { class: "copy-area", readonly: true, id: "copy-reports" }); ta.value = txt; repBox.append(ta); ta.select(); toast("Seleziona il testo e copialo"); }
      });
      repBox.append(copy);
    }
    root.append(repBox);
    root.append(h("div", { class: "h2" }, "Dati"));
    root.append(backupBox());
    const resetBox = h("div", { class: "box" });
    const askReset = () => {
      resetBox.innerHTML = "";
      resetBox.append(h("div", { class: "confirm" }, h("div", { class: "row-title" }, "Cancellare tutti i progressi?"), h("div", { class: "row-sub" }, "Argomenti spuntati, errori e statistiche di questo telefono. Non si può annullare."),
        h("div", { class: "btns" }, h("button", { class: "btn btn-danger", type: "button", onclick: () => { const keep = { welcomed: true, theme: S.theme }; S = Object.assign(blank(), keep); save(); applyTheme(); renderAll(); toast("Progressi cancellati"); } }, "Cancella tutto"),
          h("button", { class: "btn btn-ghost", type: "button", onclick: renderInfo }, "Annulla"))));
    };
    resetBox.append(h("button", { class: "row", type: "button", style: "width:100%;background:none;border:0;text-align:left;cursor:pointer", onclick: askReset },
      h("div", { class: "tile t-rose" }, svgIcon("flag")), h("div", { class: "row-text" }, h("div", { class: "row-title" }, "Azzera i progressi"), h("div", { class: "row-sub" }, "Tutto è salvato solo su questo telefono"))));
    root.append(resetBox,
      h("div", { class: "box credit" }, h("div", { class: "mono", "aria-hidden": "true" }, "GP"),
        h("div", { class: "row-text" }, h("div", { class: "role" }, "Creata da"), h("div", { class: "who" }, "Gabriele Polonio"),
          h("div", { class: "row-sub" }, `Corso di Laurea in Medicina e Chirurgia · Sapienza Università di Roma, Polo Pontino · 2026 · versione ${C.version}`))));
  }

  /* ---------------- Backup dei progressi ---------------- */
  const BACKUP_FIELDS = ["selected", "lastChecked", "onlyLast", "mode", "theme", "newPerDay", "cards", "days"];
  function backupBox() {
    const box = h("div", { class: "box" });
    const status = h("div", { class: "row-sub", style: "padding:0 12px 12px" }); status.hidden = true;
    const say = t => { status.textContent = t; status.hidden = false; };
    const exp = h("button", { class: "row", type: "button", style: "width:100%;background:none;border:0;text-align:left;cursor:pointer" },
      h("div", { class: "tile t-sky" }, svgIcon("share")), h("div", { class: "row-text" }, h("div", { class: "row-title" }, "Esporta i progressi"), h("div", { class: "row-sub" }, "Salva un file da riaprire su un altro telefono")));
    exp.addEventListener("click", async () => {
      const data = {}; BACKUP_FIELDS.forEach(k => data[k] = S[k]);
      const txt = JSON.stringify({ app: "biochiquiz", v: 1, date: new Date().toISOString(), data });
      const name = `biochiquiz-progressi-${today()}.json`;
      const file = typeof File === "function" ? new File([txt], name, { type: "application/json" }) : null;
      try {
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Progressi Biochiquiz" }); say("File pronto: salvalo in File o mandalo all'altro telefono."); return; }
      } catch (e) { if (e && e.name === "AbortError") return; }
      if (isHosted()) {
        const a = h("a", { href: URL.createObjectURL(new Blob([txt], { type: "application/json" })), download: name }); document.body.append(a); a.click(); a.remove();
        say("File scaricato: " + name);
      } else say("Il file si può salvare solo dall'app installata.");
    });
    const inp = h("input", { type: "file", accept: ".json,application/json", id: "import-file", class: "visually-hidden" });
    const imp = h("label", { class: "row", for: "import-file", style: "cursor:pointer;border-top:1px solid var(--line)" },
      h("div", { class: "tile t-lilac" }, svgIcon("feed")), h("div", { class: "row-text" }, h("div", { class: "row-title" }, "Importa i progressi"), h("div", { class: "row-sub" }, "Apri un file esportato: sostituisce i progressi di questo telefono")));
    inp.addEventListener("change", async () => {
      const f = inp.files && inp.files[0]; inp.value = ""; if (!f) return;
      try {
        const j = JSON.parse(await f.text());
        if (j.app !== "biochiquiz" || !j.data || typeof j.data.cards !== "object") throw new Error("formato");
        BACKUP_FIELDS.forEach(k => { if (k in j.data) S[k] = j.data[k]; });
        save(); applyTheme(); renderTopics(); resetFeed();
        toast(`Progressi importati: ${Object.keys(S.cards).length} card`); renderInfo();
      } catch (e) { say("Questo file non è un backup di Biochiquiz. Scegli il file che hai esportato."); }
    });
    box.append(exp, inp, imp, status);
    return box;
  }

  /* ---------------- Benvenuto ---------------- */
  function showWelcome() {
    const w = h("div", { class: "welcome", role: "dialog", "aria-modal": "true", "aria-label": "Benvenuto" });
    const inner = h("div", { class: "welcome-inner" });
    const pf = platform();
    inner.append(h("div", { class: "hero-mark", html: ICON.flask }),
      h("h1", { class: "h1" }, "Ripassa Biochimica dalle sbobine"),
      h("p", { class: "lead" }, "Una domanda per schermata: rispondi e scorri giù. Le card che sbagli tornano più spesso. I progressi restano solo sul tuo telefono, senza account."));
    if (!standalone()) {
      inner.append(h("div", { class: "h2" }, pf === "ios" ? "Installala su iPhone" : pf === "android" ? "Installala su Android" : "Installala sul telefono"), installSteps(pf));
      if (/claude\.(ai|site)|claudeusercontent/.test(location.hostname)) inner.append(h("p", { class: "lead", style: "font-size:13px" }, "Questa è l'anteprima di prova: l'installazione con funzionamento offline sarà attiva nella versione pubblicata."));
    }
    inner.append(h("button", { class: "btn btn-primary", type: "button", onclick: () => { S.welcomed = true; save(); w.remove(); go(S.selected.length ? "feed" : "topics"); } }, "Inizia"));
    w.append(inner); document.body.append(w);
  }

  /* ---------------- Navigazione e tema ---------------- */
  const VIEWS = ["feed", "topics", "stats", "info"];
  function go(v) {
    VIEWS.forEach(x => { $("#view-" + x).hidden = x !== v; $("#tab-" + x).setAttribute("aria-selected", String(x === v)); });
    if (v === "stats") renderStats();
    if (v === "info") renderInfo();
    if (v === "topics") renderTopics();
  }
  function applyTheme() {
    if (S.theme === "system") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = S.theme;
    const meta = $('meta[name="theme-color"]'); if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    redrawMolecules();
  }
  function renderAll() { renderTopics(); resetFeed(); go(S.selected.length ? "feed" : "topics"); }

  /* ---------------- Aggiornamenti (solo app installata / GitHub Pages) ---------------- */
  const isHosted = () => location.protocol === "https:" && !/claude/.test(location.hostname);
  let updateShown = false;
  async function checkUpdate() {
    if (!isHosted() || updateShown || !navigator.onLine) return;
    try {
      const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
      const v = (await r.json()).version;
      if (v && v !== C.version) {
        updateShown = true;
        const bar = h("div", { class: "update-bar", role: "status" }, h("span", {}, "Nuova versione con domande aggiornate"),
          h("button", { type: "button", class: "btn btn-primary", onclick: async () => {
            try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (e) { }
            location.reload();
          } }, "Aggiorna"));
        document.body.append(bar);
      }
    } catch (e) { }
  }

  function init() {
    const tabbar = $("#tabbar");
    [["feed", "Studia"], ["topics", "Argomenti"], ["stats", "Statistiche"], ["info", "Altro"]].forEach(([v, l]) => {
      tabbar.append(h("button", { class: "tab", id: "tab-" + v, type: "button", role: "tab", "aria-selected": "false", "aria-controls": "view-" + v, onclick: () => go(v) },
        h("span", { class: "pill", html: ICON[v] }), l));
    });
    feed().addEventListener("scroll", () => requestAnimationFrame(onFeedScroll), { passive: true });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (S.theme === "system") applyTheme(); });
    applyTheme();
    renderAll();
    if (!S.welcomed) showWelcome();
    if ("serviceWorker" in navigator && isHosted()) navigator.serviceWorker.register("sw.js").catch(() => { });
    flushReports(); checkUpdate();
    window.addEventListener("online", () => { flushReports(); checkUpdate(); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { flushReports(); checkUpdate(); } });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();

</script>
</body>
</html>
