on quello che si ha nella cellula"],"ans":0,"why":"ΔG = ΔG°' + RT ln([prodotti]/[reagenti]). Pesano soprattutto le concentrazioni; pH e temperatura incidono meno.","note":"Sbobina di Biochimica II, p. 10: le condizioni standard sono riportate come «T = 273 °K (+25 °C)». 273 K corrisponde a 0 °C; 25 °C sono 298 K.","fixed":false},{"id":"h1t-07","topic":"m1-termodinamica","level":"h","page":"18","src":"Biochimica II","q":"La fosforilazione del glucosio con Pi ha ΔG°' = +13,8 kJ/mol; l'idrolisi dell'ATP −30,5 kJ/mol. Quanto vale il ΔG°' della reazione esochinasica e perché?","opts":["Circa −16,7 kJ/mol: i ΔG°' di reazioni accoppiate si sommano","Circa +44 kJ/mol: le energie si sommano in valore assoluto","Circa −44 kJ/mol: l'ATP cede tutta la sua energia al glucosio","Circa +13,8 kJ/mol: l'ATP non partecipa al bilancio energetico","Circa 0 kJ/mol: l'enzima porta le due reazioni all'equilibrio"],"ans":0,"why":"+13,8 + (−30,5) ≈ −16,7 kJ/mol. Accoppiamento energetico: una reazione endoergonica è spinta da una esoergonica con un intermedio comune.","note":null,"fixed":false},{"id":"h1t-08","topic":"m1-termodinamica","level":"h","page":"11","src":"Biochimica II","q":"Qual è la relazione corretta tra ΔG°' e Keq e cosa implica per Keq = 1?","opts":["ΔG°' = −RT ln Keq; con Keq = 1, ΔG°' = 0","ΔG°' = RT ln Keq; con Keq = 1, ΔG°' = RT","ΔG°' = −RT · Keq; con Keq = 1, ΔG°' = −RT","ΔG°' = −nFΔE°' · Keq; con Keq = 1 è massimo","ΔG°' = ΔH − TΔS; con Keq = 1, ΔG°' = ΔH"],"ans":0,"why":"ln 1 = 0.","note":"Sbobina di Biochimica II, p. 10: la formula è scritta «ΔG0 = −RT · keq», senza logaritmo. La relazione corretta è ΔG°' = −RT ln Keq (come poi dice la stessa sbobina a p. 11).","fixed":false},{"id":"h1a-01","topic":"m1-atp","level":"h","page":"13–14","src":"Biochimica II","q":"Perché l'idrolisi del legame fosfoanidridico dell'ATP è molto esoergonica?","opts":["Per minor repulsione tra cariche e maggiore risonanza e solvatazione dei prodotti","Perché si rompe il legame fosfoestere tra ribosio e fosfato α, ricco di energia","Perché dall'ATP si forma un legame tioestere ad alta energia con il coenzima A","Perché la reazione consuma un protone e alcalinizza l'ambiente del citosol","Perché nella reazione l'adenina viene ossidata e cede elettroni"],"ans":0,"why":"ADP e Pi sono più stabilizzati (risonanza, solvatazione) dell'ATP, dove gli ossigeni carichi si respingono. Il fosfoestere tra ribosio e fosfato α è invece a bassa energia.","note":"Sbobina di Biochimica II, p. 13: c'è scritto che il ΔG dell'idrolisi ATP → ADP + Pi è «ampiamente positivo». È negativo (ΔG°' ≈ −30,5 kJ/mol; nella cellula circa −50 kJ/mol). Sempre a p. 13 l'adenosina è indicata come base azotata: la base è l'adenina; adenosina = adenina + ribosio.","fixed":false},{"id":"h1a-02","topic":"m1-atp","level":"h","page":"14","src":"Biochimica II","q":"Una reazione di attivazione scinde l'ATP in AMP + PPi e il PPi viene idrolizzato dalla pirofosfatasi. Perché è importante?","opts":["Si rompono due legami fosfoanidridici: la reazione diventa praticamente irreversibile","Si risparmia ATP rispetto alla scissione in ADP + Pi, perché l'AMP viene subito riciclato a ATP","Il PPi è un coenzima che resta legato all'enzima e partecipa alla catalisi","Si forma un legame fosfoestere ad alta energia sul substrato attivato, che lo stabilizza","L'AMP prodotto inibisce allostericamente la reazione inversa e la rende lenta"],"ans":0,"why":"ΔG°' complessivo ≈ −60 kJ/mol. Il consumo del PPi da parte della pirofosfatasi sottrae prodotto e spinge la reazione.","note":null,"fixed":false},{"id":"h1a-03","topic":"m1-atp","level":"h","page":"16","src":"Biochimica II","q":"Calcola la carica energetica di una cellula con ATP 4 mM, ADP 2 mM, AMP 2 mM. Che cosa si attiva?","opts":["0,625: carica bassa, si attivano le vie che producono ATP","0,9: carica normale, equilibrio tra catabolismo e anabolismo","0,5: carica bassa, si attivano le vie anaboliche","0,75: carica alta, prevalgono le vie anaboliche e di sintesi","0,75: carica abbastanza alta, prevalgono le vie anaboliche su quelle cataboliche"],"ans":0,"why":"CE = (ATP + ½ADP)/(ATP + ADP + AMP) = (4 + 1)/8 = 0,625. Il valore normale è circa 0,9.","note":null,"fixed":false},{"id":"h1a-04","topic":"m1-atp","level":"h","page":"15–16","src":"Biochimica II","q":"Quale fattore modifica di più il ΔG di idrolisi dell'ATP nella cellula rispetto al ΔG°'?","opts":["Le concentrazioni reali di ATP, ADP e Pi, che lo rendono più negativo","La temperatura corporea di 37 °C, che lo rende più vicino allo zero","Il pH citosolico, che lo rende positivo nella maggior parte delle cellule","Il magnesio, che neutralizza le cariche e lo rende quasi nullo","L'AMP, che compete con l'ADP e ne riduce la concentrazione libera"],"ans":0,"why":"Nella cellula il ΔG di idrolisi è circa −50 kJ/mol. PH e Mg²⁺ contano, ma meno delle concentrazioni.","note":"Sbobina di Biochimica II, p. 16: c'è scritto che con le concentrazioni cellulari il ΔG «diminuisce drasticamente» e che «il ΔG0' passa da −30 a −49». A cambiare è il ΔG reale, non il ΔG°' (che per definizione è standard), e diventa più negativo, cioè la reazione è ancora più favorita.","fixed":false},{"id":"h1a-05","topic":"m1-atp","level":"h","page":"15","src":"Biochimica II","q":"Qual è la forma dell'ATP che fa da substrato nelle reazioni ATP-dipendenti e perché?","opts":["Il complesso Mg²⁺-ATP, in cui il magnesio scherma le cariche dei fosfati","L'ATP libero, perché il magnesio legato ne bloccherebbe il trasferimento","Il complesso Ca²⁺-ATP, che è la forma prevalente nel citosol","L'ATP completamente protonato, privo di cariche negative","Il complesso Zn²⁺-ATP, perché lo zinco è il cofattore delle chinasi"],"ans":0,"why":"Il Mg²⁺ scherma le cariche e orienta il substrato nel sito attivo: per questo le chinasi richiedono magnesio.","note":null,"fixed":false},{"id":"h1a-06","topic":"m1-atp","level":"h","page":"17–18","src":"Biochimica II","q":"La nucleoside difosfato chinasi ha ΔG°' ≈ 0. Durante una sintesi proteica intensa che cosa succede?","opts":["La reazione si sposta a destra e rigenera GTP a spese dell'ATP","La reazione si blocca, perché non ha un ΔG sufficientemente negativo","Il GTP viene rigenerato direttamente dall'ATP sintasi mitocondriale","La reazione si sposta a sinistra e produce ATP a spese del GTP","Il GDP accumulato inibisce la sintesi proteica finché l'ATP non cala"],"ans":0,"why":"ATP + GDP ⇌ ADP + GTP: il GTP consumato sposta la reazione verso destra. Una reazione all'equilibrio segue le concentrazioni (Le Chatelier).","note":null,"fixed":false},{"id":"h1a-07","topic":"m1-atp","level":"h","page":"19–20","src":"Biochimica II","q":"Quale di questi composti NON può fosforilare l'ADP ad ATP in condizioni standard?","opts":["Glucosio 6-fosfato","Fosfoenolpiruvato","1,3-bisfosfoglicerato","Fosfocreatina","Nessuno: tutti e quattro possono farlo"],"ans":0,"why":"Il G6P ha un legame fosfoestere a bassa energia (≈ −14 kJ/mol), meno negativo dell'ATP. Gli altri tre hanno ΔG°' di idrolisi più negativo dell'ATP.","note":null,"fixed":false},{"id":"h1a-08","topic":"m1-atp","level":"h","page":"20","src":"Biochimica II","q":"All'inizio di uno scatto di 100 m, qual è la prima fonte che mantiene costante l'ATP muscolare?","opts":["La fosfocreatina, tramite la creatina chinasi","La β-ossidazione degli acidi grassi muscolari","Il glicogeno epatico, tramite la glicemia","La fosforilazione ossidativa mitocondriale","La gluconeogenesi epatica dal lattato"],"ans":0,"why":"La reazione della creatina chinasi è all'equilibrio: a riposo con molto ATP si forma fosfocreatina, sotto sforzo si riforma ATP.","note":null,"fixed":false},{"id":"h1o-01","topic":"m1-coenzimi","level":"h","page":"21–23","src":"Biochimica II","q":"Nella reazione malato + NAD⁺ → ossalacetato + NADH + H⁺, chi è il donatore ridotto e chi l'accettore ossidato?","opts":["Donatore ridotto: malato; accettore ossidato: NAD⁺","Donatore ridotto: NAD⁺; accettore ossidato: malato","Donatore ridotto: ossalacetato; accettore ossidato: NADH","Donatore ridotto: NADH; accettore ossidato: ossalacetato","Non è una redox, ma un'isomerizzazione del malato"],"ans":0,"why":"L'alcol secondario del malato si ossida a chetone cedendo un idruro al NAD⁺.","note":null,"fixed":false},{"id":"h1o-02","topic":"m1-coenzimi","level":"h","page":"21–23","src":"Biochimica II","q":"Qual è la differenza nel modo in cui NAD⁺ e FAD accettano gli elettroni?","opts":["Il NAD⁺ accetta un idruro; il FAD accetta due atomi di idrogeno","Il NAD⁺ accetta due atomi di idrogeno; il FAD accetta un idruro","Entrambi accettano un solo elettrone alla volta, come i citocromi","Il NAD⁺ accetta ossigeno, il FAD accetta idrogeno","Il FAD accetta quattro elettroni, il NAD⁺ due"],"ans":0,"why":"Idruro = 2 e⁻ + 1 H⁺; l'altro H⁺ va in soluzione, per questo si scrive NADH + H⁺. Il FAD diventa FADH₂.","note":null,"fixed":false},{"id":"h1o-03","topic":"m1-coenzimi","level":"h","page":"23","src":"Biochimica II","q":"La reazione succinato → fumarato è catalizzata da un enzima a FAD e non a NAD. Che tipo di ossidazione è?","opts":["Una deidrogenazione C–C: due carboni saturi formano un doppio legame","L'ossidazione di un alcol secondario a chetone, che è la reazione tipica dei coenzimi flavinici","L'ossidazione di un'aldeide ad acido carbossilico, tipica del FAD","Un'idratazione del doppio legame con aggiunta di una molecola d'acqua","Una decarbossilazione ossidativa con liberazione di CO₂"],"ans":0,"why":"Si perdono 2 elettroni come 2 atomi di H. Le deidrogenazioni C–C usano il FAD; quelle di alcoli e aldeidi in genere il NAD⁺.","note":null,"fixed":false},{"id":"h1o-04","topic":"m1-coenzimi","level":"h","page":"23","src":"Biochimica II","q":"Fumarato → malato è catalizzata dalla fumarasi. Qual è la natura della reazione?","opts":["È un'idratazione: non è un'ossidoriduzione netta","È un'ossidazione che richiede NAD⁺ come accettore","È una riduzione che richiede FADH₂ come donatore","È una decarbossilazione che libera CO₂","È un'isomerizzazione con spostamento di un fosfato"],"ans":0,"why":"Si aggiunge H₂O al doppio legame. Prepara l'alcol secondario che poi sarà ossidato dalla malato deidrogenasi.","note":null,"fixed":false},{"id":"h1o-05","topic":"m1-coenzimi","level":"h","page":"22–23","src":"Biochimica II","q":"Il passaggio da un'aldeide a un chetone con la stessa formula (es. GAP → DHAP) è:","opts":["Un'isomerizzazione: lo stato di ossidazione complessivo non cambia","Un'ossidazione: il chetone è più ossidato dell'aldeide e serve NAD⁺","Una riduzione: il carbonio chetonico è più ridotto di quello aldeidico, quindi serve NADH","Una decarbossilazione, perché cambia il numero di carboni","Un'idrolisi, perché richiede l'aggiunta di una molecola di acqua"],"ans":0,"why":"Come G6P → F6P e GAP ⇌ DHAP: nessun coenzima redox.","note":null,"fixed":false},{"id":"h1o-06","topic":"m1-coenzimi","level":"h","page":"22","src":"Biochimica II","q":"Quale sequenza ordina i composti a un carbonio dal più ridotto al più ossidato?","opts":["Metano → metanolo → formaldeide → acido formico → CO₂","CO₂ → acido formico → formaldeide → metanolo → metano","Metanolo → metano → formaldeide → CO₂ → acido formico","Formaldeide → metanolo → metano → acido formico → CO₂","Metano → formaldeide → metanolo → CO₂ → acido formico"],"ans":0,"why":"Da −4 (metano) a +4 (CO₂): 8 elettroni in totale.","note":"Sbobina di Biochimica II, p. 22: c'è scritto che l'azoto è «meno elettronegativo del carbonio». È il contrario: l'azoto è più elettronegativo del carbonio.","fixed":false},{"id":"h1o-07","topic":"m1-coenzimi","level":"h","page":"24","src":"Biochimica II","q":"Nella cellula si parla di «piruvato» e non di «acido piruvico» perché:","opts":["Il carbossile ha pKa ≈ 3,5: a pH 7,4 è quasi tutto deprotonato","L'acido piruvico è instabile e si decarbossila subito a acetaldeide","Il piruvato è la forma ridotta dell'acido piruvico, prodotta dalla LDH","Il piruvato nella cellula è sempre legato al coenzima A","Il carbossile ha pKa ≈ 9: a pH 7,4 è quasi tutto protonato"],"ans":0,"why":"Quando pH > pKa prevale la forma deprotonata (base coniugata, suffisso «-ato»).","note":null,"fixed":false},{"id":"h1o-08","topic":"m1-coenzimi","level":"h","page":"21","src":"Biochimica II","q":"Quale accoppiamento vitamina-coenzima è corretto?","opts":["Niacina → NAD; riboflavina → FAD; pantotenato → CoA","Riboflavina → NAD; niacina → FAD; tiamina → CoA","Tiamina → NAD; biotina → FAD; folato → CoA","Niacina → FAD; pantotenato → NAD; riboflavina → TPP","Cobalamina → NAD; niacina → CoA; riboflavina → biotina"],"ans":0,"why":"La tiamina dà il TPP, usato dalla piruvato deidrogenasi.","note":null,"fixed":false},{"id":"h1e-01","topic":"m1-enzimologia","level":"h","page":"26–27","src":"Biochimica II","q":"Raddoppiando la concentrazione di un enzima michaeliano (substrato in eccesso), che cosa cambia?","opts":["Raddoppia la Vmax, la KM resta invariata","Si dimezza la KM, la Vmax resta invariata","Raddoppiano sia la Vmax sia la KM insieme","Non cambiano né la Vmax né la KM dell'enzima","Aumenta l'affinità per il substrato"],"ans":0,"why":"Vmax = kcat·[E]. La KM è una costante dell'enzima; la Vmax dipende dalla quantità di enzima.","note":null,"fixed":false},{"id":"h1e-02","topic":"m1-enzimologia","level":"h","page":"27","src":"Biochimica II","q":"Un enzima ha KM = 0,1 mM e un isoenzima KM = 10 mM per lo stesso substrato. Con [S] = 0,1 mM e Vmax uguali:","opts":["Il primo lavora a ½ Vmax, il secondo a circa l'1% della Vmax","Lavorano entrambi a circa metà della propria Vmax massima","Il secondo è più veloce, perché ha la KM più alta del primo","Entrambi lavorano vicino alla propria Vmax massima","Il primo è a ½ Vmax, il secondo a circa il 50% della Vmax"],"ans":0,"why":"V = Vmax[S]/(KM + [S]): 0,1/0,2 = 0,5; 0,1/10,1 ≈ 0,01. È il caso esochinasi/glucochinasi.","note":null,"fixed":false},{"id":"h1e-03","topic":"m1-enzimologia","level":"h","page":"28","src":"Biochimica II","q":"Un effettore allosterico negativo che stabilizza la forma T come modifica la curva di un enzima allosterico?","opts":["Sposta la sigmoide a destra: aumenta la K0,5","Sposta la sigmoide a sinistra: diminuisce la K0,5","La trasforma in un'iperbole e raddoppia la Vmax","Riduce la Vmax lasciando invariata la K0,5","Non cambia la curva perché agisce sul sito catalitico"],"ans":0,"why":"La K0,5 è la KM apparente: serve più substrato per la stessa velocità. Effettore positivo → forma R, curva a sinistra; negativo → forma T, curva a destra.","note":null,"fixed":false},{"id":"h1e-04","topic":"m1-enzimologia","level":"h","page":"28","src":"Biochimica II","q":"Quale affermazione descrive correttamente un effettore omotropico?","opts":["È il substrato stesso che, legandosi, modifica l'affinità degli altri siti","È un effettore diverso dal substrato che si lega al sito allosterico e sposta l'equilibrio R/T","È sempre un inibitore, perché stabilizza la forma T a bassa affinità per il substrato","Si lega solo al sito catalitico, competendo con il substrato","È un ormone che fa fosforilare l'enzima su serine e treonine tramite la PKA"],"ans":0,"why":"Esempio: l'ATP per la PFK1 (cooperatività). Eterotropico = diverso dal substrato (es. AMP, citrato, F2,6BP sulla PFK1).","note":null,"fixed":false},{"id":"h1e-05","topic":"m1-enzimologia","level":"h","page":"29–30","src":"Biochimica II","q":"Il glucagone modifica l'attività di un enzima epatico nel giro di minuti. Quale meccanismo è più probabile?","opts":["Fosforilazione su Ser/Thr da una protein chinasi","Induzione della trascrizione del gene dell'enzima","Degradazione dell'enzima nel proteasoma","Legame di un effettore allosterico prodotto dalla via","Spostamento dell'enzima nel nucleo da parte di una proteina regolatrice"],"ans":0,"why":"Gli ormoni agiscono per lo più con modificazioni covalenti (minuti), revertite dalle fosfatasi; la sintesi di nuovo enzima richiede ore.","note":null,"fixed":false},{"id":"h1e-06","topic":"m1-enzimologia","level":"h","page":"27","src":"Biochimica II","q":"Quale definizione è corretta per la KM?","opts":["La [S] a cui V0 = ½ Vmax; vale (k₋₁ + k₂)/k₁","La velocità massima raggiungibile dall'enzima","La costante di formazione del complesso ES (k₁)","Un valore che aumenta all'aumentare dell'enzima","Il rapporto tra kcat e la concentrazione di enzima"],"ans":0,"why":"Solo se k₂ ≪ k₋₁ la KM approssima la costante di dissociazione di ES.","note":null,"fixed":false},{"id":"h1e-07","topic":"m1-enzimologia","level":"h","page":"42–43","src":"Biochimica II","q":"Un enzima ha kcat/KM ≈ 10⁸–10⁹ M⁻¹ s⁻¹ (es. trioso fosfato isomerasi). Che cosa significa?","opts":["Che la velocità è limitata solo dalla diffusione del substrato","Che è un enzima molto lento, limitato dalla tappa catalitica","Che ha una bassissima affinità per il proprio substrato","Che è un enzima allosterico con cinetica sigmoide e cooperativa","Che la reazione catalizzata è irreversibile e molto esoergonica"],"ans":0,"why":"Ha raggiunto la perfezione catalitica. kcat/KM è la costante di specificità.","note":null,"fixed":false},{"id":"h1e-08","topic":"m1-enzimologia","level":"h","page":"30","src":"Biochimica II","q":"Glicolisi e gluconeogenesi avvengono nello stesso compartimento con molti enzimi in comune. Come si evita un ciclo futile?","opts":["Le tappe irreversibili hanno enzimi diversi, regolati in modo reciproco","Le due vie avvengono in organi diversi e quindi nella stessa cellula non si sovrappongono mai","Gli enzimi in comune alle due vie sono tutti irreversibili","La gluconeogenesi avviene interamente nel mitocondrio e la glicolisi nel citosol","Le due vie usano coenzimi diversi (NAD⁺ e NADP⁺) che non si scambiano mai"],"ans":0,"why":"Se si attiva l'enzima catabolico si inibisce quello anabolico: è lo schema E3/E6 della sbobina.","note":null,"fixed":false},{"id":"h2i-01","topic":"m2-ingresso","level":"h","page":"31–32","src":"Biochimica II","q":"Perché l'assorbimento del glucosio da parte di SGLT1 è considerato un trasporto attivo secondario?","opts":["Sfrutta il gradiente di Na⁺ creato dalla Na⁺/K⁺-ATPasi, senza idrolizzare ATP","Idrolizza una molecola di ATP per ogni glucosio che porta dentro l'enterocita","Trasporta il glucosio secondo il suo gradiente, senza alcun costo energetico","È attivato dall'insulina, che lo porta sulla membrana apicale dopo il pasto","Trasporta il glucosio in simporto con il K⁺, che entra secondo gradiente"],"ans":0,"why":"Il glucosio entra contro gradiente, il Na⁺ secondo gradiente; l'ATP lo consuma la pompa Na⁺/K⁺ basolaterale.","note":"Sbobina di Biochimica II, p. 31: il trasportatore è chiamato «SGLUT1» e se ne dice prima che «utilizza ATP», poi che nel simporto «non c'è utilizzo di ATP». La sigla corretta è SGLT1, ed è un trasporto attivo secondario: l'ATP lo consuma la pompa Na⁺/K⁺, non SGLT1.","fixed":false},{"id":"h2i-02","topic":"m2-ingresso","level":"h","page":"33–34","src":"Biochimica II","q":"La glicemia passa da 5 mM (digiuno) a 15 mM (dopo un pasto). In quale tessuto aumenta di più, in proporzione, l'ingresso di glucosio, senza bisogno di insulina?","opts":["Fegato (GLUT2, Kt ≈ 17 mM), lontano dalla saturazione","Cervello (GLUT3, Kt ≈ 0,1 mM), che è il tessuto più avido","Eritrocita (GLUT1, Kt ≈ 3 mM), sempre esposto al plasma","Muscolo a riposo (GLUT4), indipendente dall'insulina","Tessuto adiposo (GLUT4), sensibile alla sola glicemia"],"ans":0,"why":"Un trasportatore con Kt alta lavora lontano dalla saturazione: il flusso cresce quasi in proporzione alla glicemia. Con Kt bassa è già quasi saturo a digiuno; GLUT4 dipende dall'insulina.","note":null,"fixed":false},{"id":"h2i-03","topic":"m2-ingresso","level":"h","page":"35–36","src":"Biochimica II","q":"Paziente iperglicemico con peptide C plasmatico normale-alto. L'ipotesi più probabile è:","opts":["Insulino-resistenza: l'insulina c'è ma non espone i GLUT4","Distruzione autoimmune delle cellule β (diabete tipo 1)","Eccesso di somatostatina che blocca la secrezione di insulina","Deficit di GLUT2 epatico che impedisce la captazione postprandiale","Insulinoma, che produce peptide C senza insulina attiva"],"ans":0,"why":"Il peptide C è secreto in quantità equimolare all'insulina endogena: indica che le cellule β la producono. È il quadro del diabete tipo 2.","note":null,"fixed":false},{"id":"h2i-04","topic":"m2-ingresso","level":"h","page":"34–35","src":"Biochimica II","q":"Nella cellula β, quale evento lega direttamente il metabolismo del glucosio alla secrezione di insulina?","opts":["L'aumento di ATP/ADP chiude i canali K⁺-ATP e depolarizza la cellula","Il glucosio si lega a un recettore di membrana accoppiato a proteina G","Il G6P apre i canali del Na⁺ e l'ingresso di Na⁺ causa l'esocitosi","Il glucagone delle cellule α vicine stimola direttamente l'esocitosi","L'AMP prodotto dalla glicolisi attiva la fusione delle vescicole"],"ans":0,"why":"Depolarizzazione → apertura dei canali del Ca²⁺ → esocitosi. Il glucosio entra con GLUT2 e la glucochinasi fa da sensore.","note":null,"fixed":false},{"id":"h2i-05","topic":"m2-ingresso","level":"h","page":"35","src":"Biochimica II","q":"Nella maturazione dell'insulina, quale sequenza è corretta?","opts":["Peptide segnale rimosso → ponti disolfuro → taglio del peptide C","Taglio del peptide C → ponti disolfuro → rimozione del peptide segnale","Ponti disolfuro → rimozione del peptide segnale → taglio della catena A","Taglio del peptide C → rimozione del peptide segnale → ponti disolfuro","Rimozione del peptide segnale → taglio del peptide C → ponti disolfuro"],"ans":0,"why":"Preproinsulina → proinsulina → insulina (catene A e B). I ponti si formano prima del taglio, quando il peptide C tiene vicine le due catene.","note":"Sbobina di Biochimica II, p. 35: c'è scritto «due ponti disolfuro intercatena e un ponte disolfuro intercatena». Sono due intercatena (tra A e B) e uno intracatena (dentro la catena A).","fixed":false},{"id":"h2i-06","topic":"m2-ingresso","level":"h","page":"36","src":"Biochimica II","q":"Il fruttosio della dieta raggiunge il fegato. Quale trasportatore NON lo trasporta efficacemente?","opts":["GLUT1","GLUT2","GLUT4","Tutti lo trasportano allo stesso modo","Nessuno: il fruttosio entra per diffusione"],"ans":0,"why":"Secondo la sbobina il fruttosio entra con GLUT2 e GLUT4, non con GLUT1. Non è nelle sbobine, ma il trasportatore specifico del fruttosio nell'intestino è GLUT5.","note":null,"fixed":false},{"id":"h2i-07","topic":"m2-ingresso","level":"h","page":"32","src":"Biochimica II","q":"Perché il cervello riceve glucosio anche quando la glicemia scende vicino a 3 mM?","opts":["GLUT1 della barriera e GLUT3 dei neuroni hanno Kt bassa","Il cervello usa GLUT2, che lavora meglio a glicemie basse","L'insulina aumenta i GLUT del cervello durante il digiuno","Il cervello produce glucosio con la gluconeogenesi","Il glucosio attraversa la barriera per semplice diffusione"],"ans":0,"why":"GLUT3 ha Kt ≈ 0,1 mM: è saturato anche a glicemie basse, così il neurone è protetto dalle variazioni di glicemia.","note":null,"fixed":false},{"id":"h2i-08","topic":"m2-ingresso","level":"h","page":"35","src":"Biochimica II","q":"Come agisce l'insulina sull'ingresso di glucosio nel muscolo?","opts":["Porta in membrana i GLUT4 contenuti in vescicole intracellulari","Attiva la trascrizione del gene GLUT1 nel muscolo, che diventa il trasportatore principale","Aumenta l'affinità dei GLUT4 già presenti in membrana","Fosforila il glucosio sulla faccia esterna della membrana, così il glucosio non può più uscire","Aumenta il gradiente di Na⁺ che il GLUT4 sfrutta per concentrare il glucosio"],"ans":0,"why":"Cambia il numero di trasportatori in membrana, non la loro Kt. Quando l'insulina cala i GLUT4 vengono reinternalizzati per endocitosi.","note":"Sbobina di Biochimica II, p. 34: c'è scritto che i GLUT4 hanno affinità molto alta per il glucosio e possono prenderlo «anche a livello basale», e che l'insulina ne favorisce «la presenza». Il punto chiave è che senza insulina i GLUT4 sono quasi tutti nelle vescicole, non in membrana.","fixed":false},{"id":"h2f-01","topic":"m2-fosforilazione","level":"h","page":"37","src":"Biochimica II","q":"Esochinasi (KM ≈ 0,1 mM) e glucochinasi (KM ≈ 10 mM) hanno Vmax simili. Con glicemia di 5 mM:","opts":["Esochinasi quasi saturata; glucochinasi a circa un terzo della Vmax","Entrambe lavorano vicino alla loro velocità massima, perché il glucosio è in eccesso","La glucochinasi è più veloce perché ha la KM più alta","L'esochinasi è inibita dal glucosio, mentre la glucochinasi lavora alla velocità massima","Entrambe lavorano a circa metà della loro Vmax, perché la glicemia è normale"],"ans":0,"why":"5/(10+5) ≈ 0,33. La glucochinasi accelera solo quando la glicemia sale dopo il pasto: il fegato capta glucosio quando ce n'è in eccesso.","note":"Sbobina di Biochimica II, p. 37: compare «Il glucosio viene definito come organo generoso». È il fegato a essere definito organo generoso.","fixed":false},{"id":"h2f-02","topic":"m2-fosforilazione","level":"h","page":"55–56","src":"Biochimica II","q":"Dopo un pasto ricco di carboidrati la glucochinasi epatica viene attivata. Qual è il meccanismo?","opts":["Il glucosio la libera dalla GKRP e l'enzima torna nel citosol","Il G6P la attiva allostericamente come effettore positivo","L'insulina la defosforila tramite la proteina fosfatasi 1 (PP1)","Il fruttosio 6-fosfato la porta dal nucleo al citosol","L'ATP ne riduce la KM come effettore omotropico positivo"],"ans":0,"why":"La GKRP la tratteneva inattiva nel nucleo. Il fruttosio 6-fosfato favorisce invece il legame con la GKRP e il sequestro nel nucleo.","note":"Sbobina di Biochimica II, p. 56: nel riepilogo delle differenze il glucosio è indicato come «effettore allosterico negativo» della glucochinasi, mentre una pagina prima è positivo. Per la glucochinasi il glucosio è un attivatore (stacca la GKRP); è un effettore negativo della sola GKRP.","fixed":false},{"id":"h2f-03","topic":"m2-fosforilazione","level":"h","page":"55","src":"Biochimica II","q":"Perché l'esochinasi è inibita dal G6P mentre la glucochinasi epatica no?","opts":["Il fegato deve fosforilare glucosio anche con G6P alto, per fare glicogeno","Perché la glucochinasi non produce G6P ma fruttosio 6-fosfato, che non inibisce l'enzima","Nel fegato il G6P esce subito dalla cellula con i GLUT2 e non si accumula","La glucochinasi è già inibita dal glucosio, quindi un secondo inibitore non serve","L'esochinasi lavora solo nel mitocondrio, dove il G6P non arriva mai a concentrazioni alte"],"ans":0,"why":"Dopo i pasti il fegato immagazzina glucosio; gli altri tessuti fosforilano solo quanto consumano. Regolazioni diverse riflettono ruoli diversi.","note":null,"fixed":false},{"id":"h2f-04","topic":"m2-fosforilazione","level":"h","page":"55","src":"Biochimica II","q":"Durante la catalisi l'esochinasi si chiude attorno a glucosio e ATP (adattamento indotto). Quale vantaggio dà?","opts":["Esclude l'acqua, evitando l'idrolisi improduttiva dell'ATP","Aumenta il ΔG°' della reazione rendendola più favorita","Permette di legare il G6P come attivatore allosterico","Fa entrare nel sito attivo il magnesio libero","Rende la reazione reversibile come quelle all'equilibrio"],"ans":0,"why":"L'acqua competerebbe con il glucosio come accettore del fosfato γ.","note":null,"fixed":false},{"id":"h2f-05","topic":"m2-fosforilazione","level":"h","page":"56","src":"Biochimica II","q":"Un soggetto con mutazione inattivante eterozigote della glucochinasi (MODY2). Che cosa ti aspetti?","opts":["Iperglicemia lieve a digiuno, per soglia di rilevazione più alta","Ipoglicemia grave per eccesso di secrezione di insulina","Nessuna alterazione della glicemia, perché l'esochinasi epatica compensa del tutto il difetto","Accumulo di glicogeno epatico con epatomegalia e ipoglicemia","Assenza totale di insulina fin dall'infanzia, come nel diabete tipo 1"],"ans":0,"why":"Non è nelle sbobine, ma segue dal ruolo della glucochinasi come sensore del glucosio in cellule β e fegato.","note":null,"fixed":false},{"id":"h2f-06","topic":"m2-fosforilazione","level":"h","page":"37","src":"Biochimica II","q":"Perché la fosforilazione intrappola il glucosio nella cellula?","opts":["Il G6P è carico e non è riconosciuto dai GLUT","Il G6P è troppo grande per passare dai GLUT","Il G6P si lega alla membrana plasmatica","Il G6P diventa subito glicogeno in tutte le cellule","Il G6P è insolubile e precipita nel citosol"],"ans":0,"why":"Può uscire solo dopo idrolisi da parte della glucosio 6-fosfatasi (fegato, rene). Per questo il muscolo non cede glucosio al sangue.","note":null,"fixed":false},{"id":"h2f-07","topic":"m2-fosforilazione","level":"h","page":"56","src":"Biochimica II","q":"Quale differenza di specificità tra esochinasi e glucochinasi crea un problema al fegato?","opts":["La glucochinasi è specifica per il glucosio: servono enzimi per fruttosio e galattosio","L'esochinasi è specifica per il glucosio: il muscolo non può usare il fruttosio della dieta","La glucochinasi fosforila il fruttosio in C6 e il galattosio in C1","Entrambe fosforilano solo il mannosio quando il glucosio è basso, e il fegato perde il fruttosio","Non ci sono differenze di specificità: entrambi fosforilano tutti gli esosi alla stessa velocità"],"ans":0,"why":"Fruttosio e galattosio arrivano al fegato con la vena porta e richiedono fruttochinasi e galattochinasi. L'esochinasi fosforila diversi esosi.","note":null,"fixed":false},{"id":"h2f-08","topic":"m2-fosforilazione","level":"h","page":"37","src":"Biochimica II","q":"Quale NON è un destino del G6P in un epatocita?","opts":["Uscire dalla cellula come G6P tramite GLUT2","Entrare nella glicolisi come fruttosio 6-P","Diventare glicogeno tramite glucosio 1-P","Entrare nella via dei pentoso fosfati","Essere idrolizzato a glucosio libero dalla glucosio 6-fosfatasi"],"ans":0,"why":"Il G6P è un crocevia; esce solo dopo essere stato defosforilato dalla glucosio 6-fosfatasi.","note":null,"fixed":false},{"id":"h2g-01","topic":"m2-glicolisi","level":"h","page":"43","src":"Biochimica II","q":"Lo iodoacetato alchila le cisteine. Quale tappa della glicolisi blocca e quale intermedio si accumula?","opts":["GAP deidrogenasi: si accumulano GAP e DHAP","Enolasi: si accumula 2-fosfoglicerato","Piruvato chinasi: si accumula fosfoenolpiruvato","Aldolasi: si accumula fruttosio 1,6-bisfosfato","Esochinasi: si accumula glucosio libero"],"ans":0,"why":"Il tiolato della cisteina del sito attivo attacca l'aldeide formando un tioemiacetale; se è alchilato la reazione si ferma e la cellula non produce ATP glicolitico netto.","note":null,"fixed":false},{"id":"h2g-02","topic":"m2-glicolisi","level":"h","page":"43–44","src":"Biochimica II","q":"L'arseniato (AsO₄³⁻) sostituisce il Pi nella reazione della GAP deidrogenasi formando 1-arseno-3-fosfoglicerato, che si idrolizza spontaneamente. Conseguenza?","opts":["Si forma NADH ma non l'ATP della fosfoglicerato chinasi","La glicolisi si blocca alla GAP deidrogenasi e si accumula la GAP","Si produce più ATP del normale, perché l'arseniato è più energetico","Non si forma NADH, ma si forma comunque l'ATP della fosfoglicerato chinasi","Si blocca la piruvato chinasi e si accumula il fosfoenolpiruvato"],"ans":0,"why":"Il guadagno netto di ATP diventa zero. Non è nelle sbobine, ma si ragiona sul meccanismo: l'energia del legame acil-fosfato va persa.","note":null,"fixed":false},{"id":"h2g-03","topic":"m2-glicolisi","level":"h","page":"39–45","src":"Biochimica II","q":"Quante reazioni della glicolisi sono ossidoriduzioni e quale ossida il glucosio?","opts":["Una sola: la GAP deidrogenasi","Due: GAP deidrogenasi e piruvato chinasi","Tre: esochinasi, PFK1 e piruvato chinasi","Nessuna: la glicolisi non ossida il glucosio","Una sola: l'enolasi"],"ans":0,"why":"La GAP deidrogenasi ossida l'aldeide ad acil-fosfato riducendo il NAD⁺. L'enolasi è una deidratazione, isomerasi e mutasi sono riarrangiamenti.","note":null,"fixed":false},{"id":"h2g-04","topic":"m2-glicolisi","level":"h","page":"41–42","src":"Biochimica II","q":"L'aldolasi ha ΔG°' ≈ +24 kJ/mol. Perché nella cellula la reazione procede verso i triosi?","opts":["I triosi sono consumati e restano bassi: il ΔG reale va a circa 0","L'aldolasi è regolata allostericamente dal fruttosio 2,6-bisfosfato","La reazione è accoppiata all'idrolisi di una molecola di ATP","L'enzima abbassa il ΔG°' fino a renderlo negativo","La PFK1 e l'aldolasi formano un'unica reazione accoppiata"],"ans":0,"why":"Inoltre da un reagente si formano due prodotti, quindi il termine di concentrazione abbassa molto il ΔG. Nell'eritrocita il ΔG reale è circa −0,2 kJ/mol.","note":null,"fixed":false},{"id":"h2g-05","topic":"m2-glicolisi","level":"h","page":"47","src":"Biochimica II","q":"Correggendo i ΔG°' con le concentrazioni reali dell'eritrocita, quale reazione che sembrava irreversibile risulta vicina all'equilibrio?","opts":["Fosfoglicerato chinasi","Esochinasi","Fosfofruttochinasi 1","Piruvato chinasi","Nessuna: le irreversibili restano quattro"],"ans":0,"why":"Ha ΔG°' negativo ma ΔG reale ≈ 0: per questo funziona anche nella gluconeogenesi.","note":null,"fixed":false},{"id":"h2g-06","topic":"m2-glicolisi","level":"h","page":"45–46","src":"Biochimica II","q":"Perché l'idrolisi del PEP ha un ΔG°' (≈ −62 kJ/mol) più negativo di quella dell'ATP?","opts":["L'enolpiruvato prodotto tautomerizza subito alla forma chetonica, più stabile","Il PEP contiene due legami fosfoanidridici in successione, come l'ATP","Il PEP contiene un legame tioestere tra il fosfato e il piruvato","Il piruvato ha più cariche negative del PEP e si stabilizza","La reazione è accoppiata all'idrolisi di una molecola di ATP che resta legata nel sito attivo"],"ans":0,"why":"È l'esempio A ⇒ B ⇒ C della sbobina: la forma enolica viene continuamente sottratta.","note":null,"fixed":false},{"id":"h2g-07","topic":"m2-glicolisi","level":"h","page":"45","src":"Biochimica II","q":"Una fosfoglicerato mutasi priva del fosfato sull'istidina del sito attivo è inattiva. Come viene riattivata?","opts":["Dal 2,3-bisfosfoglicerato, che le cede un fosfato","Dall'ATP, tramite una chinasi dedicata a lei","Dal GTP prodotto dalla succinil-CoA sintetasi","Dal fosfato inorganico presente nel citosol","Dal fosfoenolpiruvato tramite la piruvato chinasi"],"ans":0,"why":"L'enzima fosforilato passa il fosfato al C2 e lo riprende dal C3, attraverso il 2,3-BPG intermedio.","note":null,"fixed":false},{"id":"h2g-08","topic":"m2-glicolisi","level":"h","page":"47","src":"Biochimica II","q":"Qual è il bilancio netto della glicolisi per una molecola di glucosio?","opts":["Glucosio → 2 piruvato + 2 NADH + 2 ATP netti","Glucosio → 2 piruvato + 2 NADH + 4 ATP netti","Glucosio → 2 lattato + 2 NADH + 2 ATP netti","Glucosio → 2 piruvato + 2 NADPH + 2 ATP netti","Glucosio → 2 piruvato + 2 FADH₂ + 2 ATP netti"],"ans":0,"why":"Glucosio + 2 NAD⁺ + 2 ADP + 2 Pi → 2 piruvato + 2 NADH + 2 H⁺ + 2 ATP + 2 H₂O. 4 ATP prodotti, 2 investiti; i 2 H⁺ rendono la glicolisi acidificante.","note":null,"fixed":false},{"id":"h2m-01","topic":"m2-fermentazioni","level":"h","page":"49","src":"Biochimica II","q":"Perché la cellula in anaerobiosi deve trasformare il piruvato in lattato pur non guadagnando ATP da questa reazione?","opts":["Per rigenerare il NAD⁺ necessario alla GAP deidrogenasi","Per produrre ATP dalla riduzione del piruvato","Per eliminare il piruvato, che è tossico per la cellula","Per formare glucosio direttamente nel muscolo","Per produrre CO₂ come nella fermentazione alcolica"],"ans":0,"why":"Senza NAD⁺ la glicolisi si fermerebbe e con essa l'unica produzione di ATP. Nel citosol il rapporto NAD⁺/NADH è alto (circa 700).","note":null,"fixed":false},{"id":"h2m-02","topic":"m2-fermentazioni","level":"h","page":"50","src":"Biochimica II","q":"L'isoenzima H₄ della LDH (cuore) ha una KM per il piruvato più alta dell'M₄ (muscolo scheletrico). Che cosa comporta?","opts":["Il cuore tende a ossidare il lattato, il muscolo a produrlo","Il cuore produce più lattato del muscolo scheletrico","L'isoenzima H₄ è inattivo e il cuore non usa il lattato","L'isoenzima M₄ non riconosce il piruvato come substrato","Il cuore converte il piruvato in etanolo invece che in lattato"],"ans":0,"why":"Il cuore usa il lattato come combustibile; il muscolo riduce rapidamente il piruvato durante lo sforzo. Non è nelle sbobine che l'H₄ è inibito da alte concentrazioni di piruvato.","note":null,"fixed":false},{"id":"h2m-03","topic":"m2-fermentazioni","level":"h","page":"51","src":"Biochimica II","q":"Nel ciclo di Cori, quale enzima trasforma nel fegato il lattato in piruvato e quale processo lo riconverte in glucosio?","opts":["La LDH epatica (soprattutto M₄), poi la gluconeogenesi","La piruvato deidrogenasi epatica, poi la glicolisi","La LDH cardiaca (soprattutto H₄), poi la glicogenolisi","La piruvato carbossilasi, poi il ciclo di Krebs","La lattato ossidasi, poi la via dei pentoso fosfati"],"ans":0,"why":"Il fegato spende 6 legami ad alta energia per ogni glucosio riformato: il ciclo di Cori costa energia al fegato.","note":"Sbobina di Biochimica II, p. 50: c'è scritto che fegato e rene hanno isoenzimi «intermedi». Il fegato ha soprattutto LDH-5 (M₄), come dice la stessa sbobina a p. 51; il rene soprattutto LDH-1 e LDH-2. La reazione è all'equilibrio: nel fegato, dove il piruvato viene consumato dalla gluconeogenesi, anche M₄ ossida il lattato.","fixed":false},{"id":"h2m-04","topic":"m2-fermentazioni","level":"h","page":"51–52","src":"Biochimica II","q":"Secondo l'impostazione del corso, la reazione della LDH che cosa fa al pH della cellula muscolare?","opts":["Consuma un H⁺: contrasta l'acidificazione","Libera un H⁺: forma acido lattico","Non ha alcun effetto sul pH della cellula","Libera due H⁺ per ogni piruvato ridotto","Libera CO₂, che forma acido carbonico e acidifica la cellula"],"ans":0,"why":"Piruvato + NADH + H⁺ → lattato + NAD⁺. L'acidificazione deriva soprattutto dall'idrolisi dell'ATP. Il lattato esce poi con un H⁺ tramite l'MCT: acidifica il sangue, non la cellula.","note":null,"fixed":false},{"id":"h2m-05","topic":"m2-fermentazioni","level":"h","page":"52","src":"Biochimica II","q":"Un paziente in shock settico ha lattato plasmatico alto. Quale meccanismo è più coerente?","opts":["Ipossia tissutale: il NADH non viene riossidato e il piruvato diventa lattato","Eccesso di attività della PDH, che trasforma il piruvato in lattato direttamente nel mitocondrio","Aumento della gluconeogenesi muscolare, che rilascia lattato invece di glucosio","Deficit acquisito di LDH, che impedisce lo smaltimento del lattato nel fegato","Eccesso di ossigeno nei tessuti, che ossida il piruvato a lattato"],"ans":0,"why":"Ipossia, sepsi, anemia, intossicazione da CO e neoplasie sono cause di iperlattatemia.","note":null,"fixed":false},{"id":"h2m-06","topic":"m2-fermentazioni","level":"h","page":"53","src":"Biochimica II","q":"Perché la decarbossilazione del piruvato ad acetaldeide nel lievito è irreversibile?","opts":["Perché si libera CO₂, che si allontana","Perché consuma una molecola di ATP","Perché è un'ossidoriduzione con NAD⁺","Perché avviene nel mitocondrio del lievito","Perché l'acetaldeide è un metabolita terminale"],"ans":0,"why":"La seconda tappa (acetaldeide → etanolo, alcol deidrogenasi) è invece reversibile e rigenera il NAD⁺.","note":null,"fixed":false},{"id":"h2m-07","topic":"m2-fermentazioni","level":"h","page":"53","src":"Biochimica II","q":"Dopo un forte consumo di alcol, perché può comparire ipoglicemia a digiuno?","opts":["Il NADH alto dell'ossidazione dell'etanolo blocca lattato → piruvato","L'etanolo inibisce la secrezione di insulina dalle cellule β","L'acetaldeide attiva la glucochinasi e il fegato capta tutto il glucosio rimasto nel sangue","L'etanolo viene trasformato in glicogeno epatico e sottrae glucosio","L'etanolo blocca i GLUT4 del muscolo e il glucosio resta nel sangue"],"ans":0,"why":"Il rapporto NADH/NAD⁺ alto sposta lattato ⇌ piruvato verso il lattato e sottrae substrato alla gluconeogenesi.","note":null,"fixed":false},{"id":"h2m-08","topic":"m2-fermentazioni","level":"h","page":"50","src":"Biochimica II","q":"Un paziente ha LDH plasmatica alta con aumento dell'isoenzima LDH-1 (H₄) a 48 ore da un dolore toracico. Interpretazione?","opts":["Infarto del miocardio, con LDH-1 come marker tardivo","Strappo muscolare scheletrico, con LDH-5 come marker","Epatite acuta, con LDH-5 come marker precoce","Infarto del miocardio in atto da meno di due ore","Emolisi intravascolare, con LDH-5 come marker"],"ans":0,"why":"Troponina e CK-MB sono i marker precoci. La LDH nel sangue indica morte cellulare; il pattern isoenzimatico indica l'organo.","note":null,"fixed":false},{"id":"h2n-01","topic":"m2-navette","level":"h","page":"53–54","src":"Biochimica II","q":"Perché la navetta del glicerolo 3-fosfato rende meno ATP della navetta malato-aspartato?","opts":["Gli elettroni entrano al coenzima Q tramite FAD, saltando il complesso I","Consuma ATP per trasportare il glicerolo 3-fosfato nella matrice, abbassando la resa netta","Trasferisce un solo elettrone per ogni NADH citosolico invece di due","Riduce il NAD⁺ della matrice, che poi entra nel complesso II","Produce NADPH invece di NADH nella matrice, che non entra nella catena"],"ans":0,"why":"Circa 1,5 ATP invece di circa 2,5 per NADH citosolico.","note":null,"fixed":false},{"id":"h2n-02","topic":"m2-navette","level":"h","page":"54","src":"Biochimica II","q":"Nella navetta del glicerolo fosfato, quale reazione avviene nel citosol?","opts":["DHAP + NADH → glicerolo 3-fosfato + NAD⁺","Glicerolo 3-fosfato + FAD → DHAP + FADH₂","Malato + NAD⁺ → ossalacetato + NADH","GAP + NAD⁺ + Pi → 1,3-BPG + NADH","Glicerolo + ATP → glicerolo 3-fosfato + ADP"],"ans":0,"why":"La riossidazione a DHAP avviene sulla faccia esterna della membrana interna, con il FAD.","note":"Sbobina di Biochimica II, p. 54: c'è scritto che nella reazione della GAP deidrogenasi aumenta la produzione di GAP (in realtà la GAP si consuma) e il glicerolo 3-fosfato è abbreviato «3-PG», che è la sigla del 3-fosfoglicerato.","fixed":false},{"id":"h2n-03","topic":"m2-navette","level":"h","page":"53","src":"Biochimica II","q":"La membrana mitocondriale interna è impermeabile al NADH. Che cosa attraversa davvero la membrana nelle navette?","opts":["Gli elettroni, portati da molecole come glicerolo 3-P o malato","Il NADH stesso, tramite un trasportatore specifico della membrana interna","Il NAD⁺, scambiato con il NADH da un antiporto della membrana interna","Il FADH₂ prodotto nel citosol dalla glicerolo 3-P deidrogenasi","Il piruvato, che porta con sé gli elettroni del NADH nella matrice"],"ans":0,"why":"I pool di NAD citosolico e mitocondriale restano separati.","note":null,"fixed":false},{"id":"h2n-04","topic":"m2-navette","level":"h","page":"54","src":"Biochimica II","q":"Nella navetta malato-aspartato, perché l'ossalacetato rientra nel citosol come aspartato?","opts":["Non c'è un trasportatore per l'ossalacetato: esce come aspartato","L'ossalacetato è tossico nella matrice e va subito eliminato nel citosol","L'aspartato serve a sintetizzare l'urea nella matrice e nel citosol","È l'aspartato, e non il malato, a trasportare gli elettroni nel citosol","L'ossalacetato si decarbossila a piruvato prima di poter uscire dalla matrice"],"ans":0,"why":"Viene transaminato ad aspartato, che esce; nel citosol torna ossalacetato. Il dettaglio della navetta malato-aspartato non è nelle sbobine (Lehninger).","note":null,"fixed":false},{"id":"h2n-05","topic":"m2-navette","level":"h","page":"53–54","src":"Biochimica II","q":"In una cellula muscolare in esercizio aerobico, perché il NADH citosolico non si accumula?","opts":["Le navette ne trasferiscono gli elettroni al mitocondrio","Viene tutto riossidato dalla LDH, formando lattato","Attraversa liberamente la membrana mitocondriale interna","Viene consumato dalla piruvato deidrogenasi","In aerobiosi la glicolisi non produce più NADH"],"ans":0,"why":"La catena respiratoria cede gli elettroni all'O₂ e rigenera il NAD⁺. È il terzo modo (oltre a LDH e fermentazione alcolica) per far proseguire la glicolisi.","note":null,"fixed":false},{"id":"h2n-06","topic":"m2-navette","level":"h","page":"54","src":"Biochimica II","q":"Quale enzima della navetta del glicerolo fosfato contiene il FAD e dove si trova?","opts":["La glicerolo 3-P deidrogenasi mitocondriale, sulla faccia esterna della membrana interna","La glicerolo 3-P deidrogenasi citosolica, libera nel citosol vicino alla membrana esterna","La malato deidrogenasi mitocondriale, nella matrice accanto al complesso I","La succinato deidrogenasi, sulla faccia della membrana interna rivolta verso la matrice","La GAP deidrogenasi, nel citosol accanto alla membrana mitocondriale esterna"],"ans":0,"why":"L'isoforma citosolica usa il NADH; quella mitocondriale ha il FAD e cede gli elettroni al coenzima Q.","note":null,"fixed":false},{"id":"h2n-07","topic":"m2-navette","level":"h","page":"53–54","src":"Biochimica II","q":"Se la catena respiratoria è bloccata, le navette continuano a riossidare il NADH citosolico?","opts":["No: le navette si fermano e resta solo la LDH","Sì: sono indipendenti dalla catena respiratoria","Sì, ma solo la navetta del glicerolo fosfato","Sì, perché usano l'ATP glicolitico","No, perché la glicolisi si blocca prima"],"ans":0,"why":"Senza catena attiva FADH₂ e NADH mitocondriali non vengono riossidati. Per questo i veleni della catena respiratoria aumentano il lattato.","note":null,"fixed":false},{"id":"h2n-08","topic":"m2-navette","level":"h","page":"54","src":"Biochimica II","q":"Quale navetta prevale nel muscolo scheletrico e nel cervello, e quale nel fegato e nel cuore?","opts":["Glicerolo fosfato in muscolo e cervello; malato-aspartato in fegato e cuore","Malato-aspartato in muscolo e cervello; glicerolo fosfato in fegato e cuore","Malato-aspartato in tutti i tessuti, senza differenze tra muscolo e fegato","Glicerolo fosfato in tutti i tessuti, senza differenze","Nessuna navetta nel cuore, che usa solo lattato; glicerolo fosfato negli altri"],"ans":0,"why":"Non è nelle sbobine (Lehninger): la navetta del glicerolo fosfato è più rapida ma rende meno.","note":null,"fixed":false},{"id":"h2r-01","topic":"m2-regolazione","level":"h","page":"57–58","src":"Biochimica II","q":"Nella PFK1, che cosa cambia tra forma R e forma T nel sito di legame del F6P?","opts":["In R l'Arg 162 attira il F6P; in T il Glu 161 lo respinge","In R il Glu 161 attira il F6P; in T l'Arg 162 lo respinge","In T il sito attivo viene fosforilato dalla PKA","In T il sito attivo lega più ATP e meno F6P per affinità","Le due forme differiscono solo per la Vmax, non nel sito"],"ans":0,"why":"L'Arg è positiva, il Glu negativo; il F6P ha due cariche negative. Gli effettori allosterici spostano l'equilibrio R ⇌ T.","note":null,"fixed":false},{"id":"h2r-02","topic":"m2-regolazione","level":"h","page":"58–59","src":"Biochimica II","q":"Perché l'AMP è un segnale più sensibile dell'ATP per la PFK1?","opts":["Per l'adenilato chinasi, l'AMP varia molto più in percentuale dell'ATP","Perché nel citosol l'AMP è molto più abbondante dell'ATP, soprattutto nel muscolo a riposo","Perché l'AMP si lega al sito catalitico al posto del F6P","Perché l'AMP è prodotto direttamente dalla PFK1 a ogni reazione catalizzata","Perché l'ATP non ha alcun effetto sulla PFK1, né come substrato né come inibitore"],"ans":0,"why":"2 ADP ⇌ ATP + AMP. Nell'esempio della sbobina l'AMP passa da 0,02 a 0,07 mM (×3,5) mentre l'ATP scende solo del 5%.","note":null,"fixed":false},{"id":"h2r-03","topic":"m2-regolazione","level":"h","page":"57–58","src":"Biochimica II","q":"L'ATP è substrato della PFK1 ma anche suo inibitore. Come si conciliano le due cose?","opts":["Ha anche un sito allosterico a bassa affinità, occupato solo ad ATP alto","Inibisce solo quando è legato al magnesio, mentre come substrato è libero","È un inibitore competitivo del fruttosio 6-fosfato e ne occupa il sito di legame catalitico","Inibisce solo l'isoforma epatica dell'enzima, mentre è substrato di quella muscolare","Il sito allosterico ha alta affinità e lega l'ATP prima del sito catalitico"],"ans":0,"why":"Il sito catalitico ha alta affinità; quando l'ATP è alto occupa anche il sito allosterico e stabilizza la forma T. È un effettore omotropico.","note":null,"fixed":false},{"id":"h2r-04","topic":"m2-regolazione","level":"h","page":"59–60","src":"Biochimica II","q":"Quale è il più potente attivatore della PFK1 epatica e chi ne controlla la concentrazione?","opts":["Il F2,6BP, regolato da insulina e glucagone","Il F1,6BP, regolato dalla piruvato chinasi","L'AMP, regolato dal glucagone","Il citrato, regolato dall'insulina","Il glucosio, regolato dalla glucochinasi"],"ans":0,"why":"Il F2,6BP è attivo a concentrazioni micromolari. L'insulina ne aumenta la sintesi, il glucagone la riduce tramite la PFK2/FBPasi2.","note":null,"fixed":false},{"id":"h2r-05","topic":"m2-regolazione","level":"h","page":"60","src":"Biochimica II","q":"Perché il citrato citosolico inibisce la PFK1?","opts":["Esce dal mitocondrio quando ATP e NADH sono alti","È un prodotto diretto della glicolisi citosolica","Compete con il F6P nel sito catalitico","Attiva una fosfatasi che defosforila la PFK1","Riduce l'AMP tramite l'adenilato chinasi"],"ans":0,"why":"Il citrato si accumula quando il ciclo di Krebs è rallentato: segnala che non serve altro acetil-CoA dalla glicolisi.","note":null,"fixed":false},{"id":"h2r-06","topic":"m2-regolazione","level":"h","page":"60–61","src":"Biochimica II","q":"Il fruttosio 1,6-bisfosfato attiva la piruvato chinasi. Come si chiama questo tipo di regolazione e a che cosa serve?","opts":["Feed-forward: la tappa finale si prepara al flusso","Inibizione a feedback da parte del prodotto finale","Regolazione covalente tramite fosforilazione","Inibizione da prodotto: rallenta la PFK1 a monte","Effetto omotropico: il substrato prepara gli altri siti"],"ans":0,"why":"Quando la PFK1 è attiva, il F1,6BP attiva la piruvato chinasi ed evita l'accumulo di intermedi a valle.","note":null,"fixed":false},{"id":"h2r-07","topic":"m2-regolazione","level":"h","page":"61","src":"Biochimica II","q":"A digiuno il glucagone fa fosforilare dalla PKA la piruvato chinasi epatica. Qual è l'effetto e a che cosa serve?","opts":["La PK epatica si inattiva e il PEP resta per la gluconeogenesi","La PK epatica si attiva e la glicolisi del fegato produce più ATP per la gluconeogenesi","La glicolisi accelera per produrre glucosio","Si inattiva solo la PK muscolare, mentre quella epatica resta attiva","Il PEP viene trasformato direttamente in glicogeno nel fegato"],"ans":0,"why":"Si evita il ciclo futile PEP → piruvato → ossalacetato → PEP.","note":"Sbobina di Biochimica II, p. 61: c'è scritto che la fosforilazione della PK «rallenta la glicolisi e quindi riduce la produzione di glucosio». Riduce il consumo di glucosio e favorisce la sua produzione (gluconeogenesi). Inoltre a p. 62 ADP e acetil-CoA sono indicati come attivatori della PK, mentre a p. 60 l'acetil-CoA è un inibitore: l'acetil-CoA inibisce (Lehninger).","fixed":false},{"id":"h2r-08","topic":"m2-regolazione","level":"h","page":"54–60","src":"Biochimica II","q":"Quale delle tre tappe regolate è considerata il principale punto di controllo della glicolisi e perché?","opts":["La PFK1: il F1,6BP è il primo intermedio solo glicolitico","L'esochinasi, perché è la prima reazione della via e consuma il primo ATP","La piruvato chinasi, perché è l'ultima reazione della via","La GAP deidrogenasi, perché è l'unica reazione redox","L'aldolasi, perché scinde l'esoso in due triosi"],"ans":0,"why":"È la tappa di commissione. Il G6P invece ha altri destini (glicogeno, pentoso fosfati): controllare l'esochinasi non basta.","note":null,"fixed":false},{"id":"h2p-01","topic":"m2-pasteur","level":"h","page":"62–63","src":"Biochimica II","q":"Lieviti in anaerobiosi vengono esposti all'ossigeno e il consumo di glucosio crolla. Qual è il meccanismo indicato nel corso?","opts":["ATP e citrato citosolico aumentano e inibiscono la PFK1","L'ossigeno inattiva direttamente l'esochinasi ossidandone le cisteine","L'ossigeno ossida il glucosio prima che entri","Il NADH aumenta e attiva allostericamente l'esochinasi","L'AMP aumenta e blocca la piruvato chinasi del lievito"],"ans":0,"why":"La fosforilazione ossidativa produce molto ATP: da un glucosio se ne ricava molto di più, quindi ne serve meno.","note":"Sbobina di Biochimica II, p. 63: la PFK1 è definita «l'enzima che catalizza la prima reazione della glicolisi». È la terza reazione; è la prima tappa specifica (di commissione).","fixed":false},{"id":"h2p-02","topic":"m2-pasteur","level":"h","page":"62","src":"Biochimica II","q":"Le cellule tumorali consumano molto glucosio e producono lattato anche in presenza di ossigeno. Come si chiama il fenomeno?","opts":["Effetto Warburg","Effetto Pasteur","Effetto Bohr","Effetto Haldane","Ciclo di Cori"],"ans":0,"why":"Le cellule tumorali non mostrano l'effetto Pasteur. Vi contribuisce l'HIF, che aumenta la PDH chinasi e inibisce la PDH.","note":null,"fixed":false},{"id":"h2p-03","topic":"m2-pasteur","level":"h","page":"63","src":"Biochimica II","q":"In un paziente con deficit di piruvato chinasi eritrocitaria, che cosa succede alla curva di dissociazione dell'O₂ e perché?","opts":["A destra: si accumula 2,3-BPG","A sinistra: cala il 2,3-BPG","Non cambia","A destra: aumenta il lattato","A sinistra: aumenta l'ATP"],"ans":0,"why":"Il PEP si accumula, le reazioni a monte (all'equilibrio) aumentano l'1,3-BPG e quindi il 2,3-BPG, che riduce l'affinità dell'Hb per l'O₂.","note":null,"fixed":false},{"id":"h2p-04","topic":"m2-pasteur","level":"h","page":"63–64","src":"Biochimica II","q":"Perché il deficit di piruvato chinasi causa anemia emolitica?","opts":["Con poco ATP la pompa Na⁺/K⁺ cede e la cellula perde la forma","Si accumula lattato che acidifica la cellula e lisa la membrana dell'eritrocita","Manca il NADPH e il glutatione non viene ridotto, come nel favismo","Aumenta l'affinità dell'Hb per l'O₂ e la cellula muore","Si blocca la sintesi dell'eme nell'eritrocita maturo, che perde l'Hb"],"ans":0,"why":"L'eritrocita dipende solo dalla glicolisi: si rigonfia, perde la forma biconcava e viene eliminato dalla milza. È il deficit enzimatico glicolitico più frequente.","note":null,"fixed":false},{"id":"h2p-05","topic":"m2-pasteur","level":"h","page":"63","src":"Biochimica II","q":"Quale enzima dell'eritrocita forma il 2,3-BPG e da quale intermedio?","opts":["Bisfosfoglicerato mutasi, dall'1,3-BPG","Fosfoglicerato chinasi, dal 3-fosfoglicerato","Enolasi, dal fosfoenolpiruvato","GAP deidrogenasi, dalla gliceraldeide 3-P","Fosfoglicerato mutasi, dal 2-fosfoglicerato"],"ans":0,"why":"Il fosfato passa dal C1 al C2 (shunt di Rapoport-Luebering): l'eritrocita rinuncia a 1 ATP per ogni 1,3-BPG deviato.","note":null,"fixed":false},{"id":"h2p-06","topic":"m2-pasteur","level":"h","page":"63","src":"Biochimica II","q":"Nel deficit di esochinasi eritrocitaria, che cosa ti aspetti?","opts":["Meno 2,3-BPG e Hb più affine all'O₂","Più 2,3-BPG e Hb meno affine all'O₂","Accumulo di PEP e anemia emolitica","Aumento dell'ATP eritrocitario","Nessun effetto sull'emoglobina"],"ans":0,"why":"Se la glicolisi non parte si forma poco 1,3-BPG: curva a sinistra e minore cessione di O₂ ai tessuti.","note":null,"fixed":false},{"id":"h2p-07","topic":"m2-pasteur","level":"h","page":"64","src":"Biochimica II","q":"Il fruttosio entra nella glicolisi epatica a valle della PFK1 (via fruttosio 1-fosfato). Perché un eccesso di fruttosio favorisce la lipogenesi?","opts":["Salta la PFK1: i triosi si formano senza controllo","Inibisce la piruvato deidrogenasi epatica e devia il piruvato verso i lipidi","Attiva la PFK1 più del glucosio, saturandola","Non produce piruvato ma solo glicerolo","Entra solo in presenza di insulina, che attiva la lipogenesi"],"ans":0,"why":"I triosi forniscono acetil-CoA e glicerolo 3-fosfato per i trigliceridi. La sbobina riporta queste pagine solo come immagini; il metabolismo del fruttosio è nel Lehninger.","note":null,"fixed":false},{"id":"h2p-08","topic":"m2-pasteur","level":"h","page":"64","src":"Biochimica II","q":"Nella galattosemia classica (deficit di galattosio 1-fosfato uridiltransferasi), quale sostanza si accumula?","opts":["Galattosio 1-fosfato","Glucosio 6-fosfato","Fruttosio 1-fosfato","UDP-galattosio","Galattosio 6-fosfato"],"ans":0,"why":"Si accumula anche il galattitolo, che causa cataratta. La sbobina riporta queste pagine solo come immagini; il dettaglio è nel Lehninger.","note":null,"fixed":false},{"id":"h2d-01","topic":"m2-pdh","level":"h","page":"66–69","src":"Biochimica II","q":"Un paziente con grave carenza di tiamina (beriberi, alcolismo). Quali enzimi sono compromessi e che cosa si accumula?","opts":["PDH e α-chetoglutarato deidrogenasi: si accumulano piruvato e lattato","Solo la LDH, che usa la tiamina: si accumula piruvato ma non lattato","La citrato sintasi, che usa la tiamina: si accumula acetil-CoA","La piruvato carbossilasi, che usa la tiamina: si accumulano piruvato e alanina","La succinato deidrogenasi: si accumula succinato"],"ans":0,"why":"Il TPP è il coenzima di E1 di entrambi i complessi. Cala l'ATP aerobico, soprattutto nel sistema nervoso.","note":null,"fixed":false},{"id":"h2d-02","topic":"m2-pdh","level":"h","page":"69","src":"Biochimica II","q":"Perché nell'uomo gli acidi grassi non possono essere convertiti in glucosio netto?","opts":["La PDH è irreversibile e nel Krebs i 2 C dell'acetile escono come CO₂","Gli acidi grassi nel fegato non producono acetil-CoA ma solo corpi chetonici","Nell'uomo la gluconeogenesi non avviene nel fegato ma solo nel rene","Nell'uomo manca la piruvato carbossilasi, che serve a fare ossalacetato","L'acetil-CoA inibisce la fruttosio 1,6-bisfosfatasi"],"ans":0,"why":"L'acetil-CoA non può tornare a piruvato. Dagli zuccheri si fanno grassi, non il contrario (eccezione: il glicerolo dei trigliceridi).","note":null,"fixed":false},{"id":"h2d-03","topic":"m2-pdh","level":"h","page":"66–69","src":"Biochimica II","q":"Quale sequenza di eventi nella PDH è corretta?","opts":["E1 decarbossila; E2 trasferisce l'acetile al CoA; E3 riossida il lipoato","E1 trasferisce l'acetile al CoA; E2 decarbossila; E3 riduce il FAD","E3 decarbossila; E2 ossida il lipoato con il FAD; E1 trasferisce l'acetile al CoA","E1 riduce il NAD⁺; E2 decarbossila il piruvato; E3 trasferisce l'acetile","E2 decarbossila; E1 trasferisce l'acetile; E3 ossida il FADH₂"],"ans":0,"why":"E1 (TPP): decarbossilazione; E2 (lipoammide): transacetilazione; E3 (FAD): ossidoriduzione, con riduzione finale del NAD⁺.","note":"Sbobina di Biochimica II, pp. 68 e 70: la sbobina indica «Acido lipoico = E2» e «coenzima A (CoA-SH) (E3)» e descrive E2 come trimero ed E3 come «dimero αβ». Il CoA accetta l'acetile su E2 (transacetilasi), non su E3; E2 forma il nucleo del complesso (24 o più subunità organizzate in trimeri) ed E3 è un omodimero.","fixed":false},{"id":"h2d-04","topic":"m2-pdh","level":"h","page":"69","src":"Biochimica II","q":"Qual è il vantaggio del braccio flessibile lipoil-lisina di E2?","opts":["Trasporta l'intermedio tra E1, E2 ed E3 senza che diffonda","Lega il piruvato dal citosol e lo porta direttamente al sito attivo di E1","Fosforila E1 per regolare l'attività del complesso","Cede gli elettroni direttamente al NAD⁺","Rende la reazione reversibile a seconda dei bisogni"],"ans":0,"why":"È un channeling: reazione più veloce e intermedi reattivi protetti. Il lipoato è legato con legame ammidico a una lisina.","note":null,"fixed":false},{"id":"h2d-05","topic":"m2-pdh","level":"h","page":"71–72","src":"Biochimica II","q":"Nel muscolo che inizia a contrarsi, il Ca²⁺ attiva la PDH. Come?","opts":["Attiva la PDH fosfatasi, che defosforila E1","Attiva la PDH chinasi, che fosforila E1","Inibisce l'ingresso di piruvato nel mitocondrio","Si lega al TPP di E1 e lo attiva","Riossida il NADH della matrice per E3"],"ans":0,"why":"Il segnale della contrazione anticipa il fabbisogno di ATP.","note":null,"fixed":false},{"id":"h2d-06","topic":"m2-pdh","level":"h","page":"72","src":"Biochimica II","q":"In quale condizione la PDH chinasi è massimamente attiva (PDH inattiva)?","opts":["ATP/ADP, NADH/NAD⁺ e acetil-CoA/CoA alti, come a digiuno","Alti livelli di piruvato e di ADP nella matrice","Alto Ca²⁺ nel muscolo durante la contrazione intensa","Alta insulina dopo un pasto ricco di carboidrati, con molto piruvato disponibile","Ipoglicemia con AMP alto in tutte le cellule del corpo"],"ans":0,"why":"Durante l'ossidazione di acidi grassi la PDH viene spenta: si risparmiano piruvato e glucosio per la gluconeogenesi.","note":"Sbobina di Biochimica II, p. 72: c'è scritto che l'AMP inibisce la PDH chinasi e il GTP la attiva. Nei testi il principale inibitore della chinasi è l'ADP (con piruvato), gli attivatori sono ATP, NADH e acetil-CoA. Non sono sicuro che il prof abbia detto «AMP» a lezione: all'esame meglio ragionare in termini di carica energetica.","fixed":false},{"id":"h2d-07","topic":"m2-pdh","level":"h","page":"73","src":"Biochimica II","q":"Un bambino con acidosi lattica congenita, atassia e ritardo psicomotorio. Quale deficit enzimatico è più probabile?","opts":["Deficit della piruvato deidrogenasi (subunità E1)","Deficit di lattato deidrogenasi (subunità M)","Deficit di glucosio 6-fosfatasi epatica (von Gierke)","Deficit di GLUT4 nel muscolo e nel tessuto adiposo","Deficit di glicogeno fosforilasi muscolare (McArdle)"],"ans":0,"why":"Il piruvato non viene ossidato e viene ridotto a lattato; il cervello, dipendente dal glucosio, è il più colpito. Non è nelle sbobine che si tratta con dieta chetogenica.","note":null,"fixed":false},{"id":"h2d-08","topic":"m2-pdh","level":"h","page":"73","src":"Biochimica II","q":"In un tumore ipossico, l'HIF aumenta la PDH chinasi. Quale conseguenza è corretta?","opts":["La PDH si inattiva e il piruvato diventa lattato","La PDH si attiva e aumenta la produzione di CO₂","Aumenta la β-ossidazione degli acidi grassi nel mitocondrio","La glicolisi viene inibita e cala il consumo di glucosio","Aumenta la fosforilazione ossidativa e il consumo di O₂"],"ans":0,"why":"La PDH chinasi fosforila e inattiva la PDH. È uno dei meccanismi dell'effetto Warburg.","note":null,"fixed":false},{"id":"h3k-01","topic":"m3-krebs","level":"h","page":"79–80","src":"Biochimica II","q":"La citrato sintasi lega prima l'ossalacetato e poi l'acetil-CoA (meccanismo sequenziale ordinato). Perché è vantaggioso?","opts":["Si evita l'idrolisi improduttiva dell'acetil-CoA quando manca l'ossalacetato","L'acetil-CoA è un inibitore dell'enzima e deve legarsi solo per ultimo","L'ossalacetato è molto più abbondante dell'acetil-CoA nella matrice mitocondriale","Così la reazione diventa reversibile e segue le concentrazioni dei substrati","L'enzima deve prima legare l'ATP, che si trova nello stesso sito dell'ossalacetato"],"ans":0,"why":"L'ossalacetato è scarso e instabile; il tioestere dell'acetil-CoA è ciò che spinge la reazione. Anche la chiusura del sito attivo (adattamento indotto) tiene fuori l'acqua finché non si forma il citril-CoA.","note":null,"fixed":false},{"id":"h3k-02","topic":"m3-krebs","level":"h","page":"84","src":"Biochimica II","q":"Un acetil-CoA marcato su entrambi i carboni entra nel ciclo. Al primo giro, quanta marcatura si ritrova nella CO₂ liberata?","opts":["Nessuna: al primo giro escono carboni dell'ossalacetato","Tutta: entrambi i carboni marcati escono come CO₂","Metà: un carbonio marcato esce all'isocitrato deidrogenasi","Metà: un carbonio marcato esce alla succinato deidrogenasi","Tutta: i due carboni escono all'α-chetoglutarato deidrogenasi"],"ans":0,"why":"I carboni dell'acetile escono solo nei giri successivi. Il ciclo ossida l'equivalente di un acetile per giro, ma non gli stessi atomi.","note":null,"fixed":false},{"id":"h3k-03","topic":"m3-krebs","level":"h","page":"80–81","src":"Biochimica II","q":"Un paziente ha una grave carenza di ferro. Oltre all'anemia, quale enzima del ciclo di Krebs rischia di funzionare meno?","opts":["L'aconitasi, che ha un centro ferro-zolfo","La citrato sintasi, che contiene un gruppo eme","La fumarasi, che usa il rame come cofattore","La malato deidrogenasi, che contiene zinco","L'isocitrato deidrogenasi, che usa il ferro come coenzima"],"ans":0,"why":"Se l'aconitasi (4Fe-4S) perde un ferro si inattiva e si accumula citrato. Senza ferro, l'aconitasi citosolica regola l'mRNA di recettore della transferrina e ferritina: è un sensore del ferro («moonlighting protein»).","note":null,"fixed":false},{"id":"h3k-04","topic":"m3-krebs","level":"h","page":"81","src":"Biochimica II","q":"Perché la reazione dell'isocitrato deidrogenasi è molto esoergonica mentre altre deidrogenazioni non lo sono?","opts":["È anche una decarbossilazione: la CO₂ liberata rende il ΔG molto negativo","Consuma una molecola di ATP che spinge la deidrogenazione","Usa il FAD, che ha un potenziale più positivo del NAD⁺ e accetta meglio gli elettroni","Rompe un legame tioestere ad alta energia del substrato, come la succinil-CoA sintetasi","Avviene nel citosol, dove il rapporto NAD⁺/NADH è molto alto e favorisce l'ossidazione"],"ans":0,"why":"È una decarbossilazione ossidativa, irreversibile: è uno dei principali punti di regolazione del ciclo.","note":null,"fixed":false},{"id":"h3k-05","topic":"m3-krebs","level":"h","page":"82","src":"Biochimica II","q":"Che cosa hanno in comune e in che cosa differiscono il complesso della PDH e quello dell'α-chetoglutarato deidrogenasi?","opts":["Stessi coenzimi ed E3 identico; diversi E1 ed E2; niente regolazione covalente","Sono identici in tutte le subunità e differiscono solo per il substrato","L'α-chetoglutarato deidrogenasi non usa la tiamina pirofosfato","Entrambi sono regolati dalla stessa chinasi e dalla stessa fosfatasi, come risposta all'insulina","La PDH produce GTP, mentre l'α-chetoglutarato deidrogenasi produce NADH"],"ans":0,"why":"Coenzimi: TPP, lipoato, CoA, FAD, NAD⁺. L'α-KGDH non è regolata per fosforilazione ma è inibita dai suoi prodotti (succinil-CoA, NADH).","note":null,"fixed":false},{"id":"h3k-06","topic":"m3-krebs","level":"h","page":"82","src":"Biochimica II","q":"Nella reazione della succinil-CoA sintetasi, quale sequenza di intermedi porta al GTP?","opts":["Succinil-fosfato, poi istidina fosforilata dell'enzima, poi GDP","Succinato e CO₂, poi il fosfato inorganico passa direttamente al GDP","Il CoA cede il fosfato al GDP senza intermedi enzimatici","Il GTP fosforila il succinato per formare succinil-CoA e poi il GDP","Il FADH₂ della succinato deidrogenasi fosforila il GDP legato all'enzima"],"ans":0,"why":"Succinil-CoA + Pi → succinil-fosfato (+ CoA) → fosfato su un'istidina → GTP. È l'unica fosforilazione a livello del substrato del ciclo.","note":"Sbobina di Biochimica II, p. 78: l'enzima è chiamato «succinil-CoA sintasi». Il nome corretto è succinil-CoA sintetasi (lo usa la stessa sbobina a p. 82): per la convenzione della sbobina, «sintetasi» indica gli enzimi che usano un nucleoside trifosfato, come qui nella reazione inversa.","fixed":false},{"id":"h3k-07","topic":"m3-krebs","level":"h","page":"84–85","src":"Biochimica II","q":"Durante l'esercizio, il ciclo di Krebs muscolare accelera. Quali segnali sono responsabili?","opts":["ADP e Ca²⁺ alti e NADH/NAD⁺ basso","ATP e NADH alti nella matrice","Accumulo di succinil-CoA","Accumulo di citrato nella matrice","Insulina che defosforila la citrato sintasi"],"ans":0,"why":"Attivano isocitrato deidrogenasi e α-chetoglutarato deidrogenasi. È la «regolazione da parte dell'accettore»: l'ADP segnala bisogno di ATP.","note":null,"fixed":false},{"id":"h3k-08","topic":"m3-krebs","level":"h","page":"87–89","src":"Biochimica II","q":"Un soggetto mangia molti grassi ma pochissimi carboidrati. Perché l'ossidazione degli acidi grassi può essere limitata?","opts":["L'ossalacetato viene soprattutto dal piruvato, quindi dal glucosio","Gli acidi grassi inibiscono la citrato sintasi e bloccano il ciclo","Senza glucosio il mitocondrio non può rigenerare il NAD⁺ ossidato","La β-ossidazione funziona solo in presenza di insulina","L'acetil-CoA in eccesso viene trasformato in glucosio dal fegato"],"ans":0,"why":"L'acetil-CoA entra nel ciclo solo condensandosi con l'ossalacetato. La piruvato carbossilasi (biotina) è la principale reazione anaplerotica ed è attivata dall'acetil-CoA.","note":null,"fixed":false},{"id":"h3c-01","topic":"m3-catena","level":"h","page":"90–91","src":"Biochimica II","q":"Ossidando completamente una molecola di glucosio, quanti elettroni vengono ceduti e quanti coenzimi ridotti si formano?","opts":["24 elettroni, in 10 NADH e 2 FADH₂","12 elettroni, in 6 NADH e 0 FADH₂","24 elettroni, in 12 NADH e 0 FADH₂","36 elettroni, in 18 coenzimi","24 elettroni, in 8 NADH e 4 FADH₂"],"ans":0,"why":"Ogni coenzima accetta 2 elettroni: 12 coenzimi ridotti.","note":null,"fixed":false},{"id":"h3c-02","topic":"m3-catena","level":"h","page":"92–93","src":"Biochimica II","q":"Perché nella catena respiratoria il flusso di elettroni va dal NADH all'O₂ e non al contrario?","opts":["I trasportatori hanno potenziali di riduzione crescenti fino all'O₂","L'O₂ è più ridotto del NADH e attira i suoi protoni lungo la membrana interna","L'ATP sintasi tira gli elettroni verso il complesso IV","Ogni complesso consuma ATP per spingere gli elettroni verso il successivo","Il NADH ha un potenziale più positivo dell'O₂ e cede elettroni per questo"],"ans":0,"why":"Da −0,32 V (NAD⁺/NADH) a +0,82 V (O₂/H₂O): ogni passaggio ha ΔE positivo e quindi ΔG negativo (ΔG°' = −nFΔE°').","note":null,"fixed":false},{"id":"h3c-03","topic":"m3-catena","level":"h","page":"99","src":"Biochimica II","q":"Calcola il ΔG°' dell'ossidazione del NADH da parte dell'O₂ (E°' NAD⁺/NADH = −0,32 V; O₂/H₂O = +0,82 V; n = 2; F ≈ 96,5 kJ/V·mol).","opts":["Circa −220 kJ/mol","Circa −96 kJ/mol","Circa +220 kJ/mol","Circa −30 kJ/mol","Circa −490 kJ/mol"],"ans":0,"why":"ΔE°' = 0,82 − (−0,32) = 1,14 V; ΔG°' = −2 × 96,5 × 1,14 ≈ −220 kJ/mol.","note":"Sbobina di Biochimica II, p. 99: la formula è scritta «nF[(0,81 − (0,32)]», senza il segno meno del NAD e senza il meno davanti. Corretto: ΔG°' = −nF[0,81 − (−0,32)].","fixed":false},{"id":"h3c-04","topic":"m3-catena","level":"h","page":"104","src":"Biochimica II","q":"In mitocondri isolati si aggiunge antimicina A (inibitore del complesso III). In che stato saranno coenzima Q e citocromo c?","opts":["Q ridotto, citocromo c ossidato","Entrambi ridotti","Entrambi ossidati","Q ossidato, citocromo c ridotto","Invariati, perché il complesso II bypassa il III"],"ans":0,"why":"I trasportatori a monte del blocco restano ridotti, quelli a valle ossidati.","note":null,"fixed":false},{"id":"h3c-05","topic":"m3-catena","level":"h","page":"94–95","src":"Biochimica II","q":"Il succinato rende circa 1,5 ATP e il NADH circa 2,5. Perché?","opts":["Entrano dal complesso II, che non pompa protoni, e saltano il complesso I","Il succinato cede gli elettroni direttamente all'O₂ senza passare dalla catena","Il FADH₂ porta un solo elettrone invece dei due del NADH","Il complesso II consuma una parte dell'ATP per trasferire gli elettroni","Il FADH₂ cede gli elettroni direttamente al complesso III"],"ans":0,"why":"Gli elettroni arrivano direttamente al coenzima Q. Il ΔE tra fumarato/succinato e Q è troppo piccolo per pompare protoni.","note":null,"fixed":false},{"id":"h3c-06","topic":"m3-catena","level":"h","page":"95","src":"Biochimica II","q":"Quale caratteristica rende il coenzima Q adatto a raccogliere elettroni da più fonti (complesso I, II, glicerolo 3-P deidrogenasi, β-ossidazione)?","opts":["È piccolo e liposolubile, mobile nella membrana, e accetta 1 o 2 elettroni","È una proteina solubile dello spazio intermembrana che lega un eme di tipo c","Contiene un eme che accetta un solo elettrone alla volta, come i citocromi","È legato covalentemente al complesso III e ruota con esso nella membrana","Accetta elettroni solo dal NADH tramite il FMN del complesso I"],"ans":0,"why":"La coda isoprenica lo tiene nella membrana interna. Il citocromo c invece è una proteina solubile dello spazio intermembrana.","note":null,"fixed":false},{"id":"h3c-07","topic":"m3-catena","level":"h","page":"96–97","src":"Biochimica II","q":"A che cosa serve il ciclo Q nel complesso III?","opts":["A passare un elettrone alla volta al citocromo c pompando più protoni","A ridurre direttamente l'O₂ ad acqua nel complesso III, senza il complesso IV","A trasferire gli elettroni dal NADH al FMN del complesso I","A sintetizzare ATP accoppiando il trasporto di elettroni alla rotazione dell'anello c","A portare gli elettroni del NADH citosolico all'interno della matrice"],"ans":0,"why":"Il QH₂ cede 2 elettroni ma il citocromo c ne accetta uno: uno va a c₁ e c, l'altro tramite bL e bH riduce un altro Q. Il risultato netto è l'ossidazione di QH₂.","note":null,"fixed":false},{"id":"h3c-08","topic":"m3-catena","level":"h","page":"98–99","src":"Biochimica II","q":"Nel complesso IV, quale affermazione sui protoni è corretta per ogni O₂ ridotto?","opts":["8 H⁺ prelevati dalla matrice: 4 formano H₂O, 4 sono pompati","8 H⁺ pompati tutti nello spazio intermembrana","Nessun protone pompato: il complesso IV forma solo acqua","2 H⁺ pompati e 2 usati per formare una molecola d'acqua","4 H⁺ prelevati dallo spazio intermembrana per formare l'acqua"],"ans":0,"why":"Entrambi i processi contribuiscono al gradiente: anche i protoni «chimici» sono sottratti alla matrice.","note":"Sbobina di Biochimica II, p. 99: c'è scritto «8 protoni in totale vengono pompati». Gli 8 H⁺ sono prelevati dalla matrice, ma ne vengono pompati solo 4; gli altri 4 si combinano con l'O₂.","fixed":false},{"id":"h3s-01","topic":"m3-atpsintasi","level":"h","page":"100","src":"Biochimica II","q":"Quali due componenti formano la forza motrice protonica?","opts":["Un gradiente elettrico e un gradiente di pH","Un gradiente di ATP e uno di ADP tra i due lati","Un gradiente di Na⁺ e uno di K⁺ attraverso la membrana","Solo un gradiente di pH tra i due lati della membrana","Un gradiente di O₂ e uno di CO₂ tra matrice e citosol"],"ans":0,"why":"Lato P positivo e più acido, matrice negativa e più basica. È il nucleo dell'ipotesi chemiosmotica di Mitchell.","note":"Sbobina di Biochimica II, p. 100: l'ipotesi alternativa degli intermedi ad alta energia è attribuita a Koshland. Nei testi è l'ipotesi chimica (Slater); l'ipotesi chemiosmotica di Mitchell è del 1961 (Nobel 1978).","fixed":false},{"id":"h3s-02","topic":"m3-atpsintasi","level":"h","page":"101–102","src":"Biochimica II","q":"Nella F₀, che cosa ruota e che cosa resta fermo?","opts":["Ruotano l'anello c, γ ed ε; restano fermi a, b₂, δ e α₃β₃","Ruota la subunità a; restano fermi l'anello c, lo statore e l'esamero α₃β₃","Ruota l'esamero α₃β₃; l'anello c resta fermo","Ruota tutta l'ATP sintasi insieme alla membrana","Non ruota nulla: c'è solo un cambio di conformazione"],"ans":0,"why":"I protoni entrano dal semicanale di a, protonano l'Asp di una subunità c e l'anello ruota; lo statore (b₂, δ) blocca α₃β₃.","note":"Sbobina di Biochimica II, p. 101: c'è scritto che «la proteina a è un rotore che gira». La subunità a è ferma (fa parte dello statore); a ruotare è l'anello delle subunità c, come la stessa sbobina descrive a p. 102.","fixed":false},{"id":"h3s-03","topic":"m3-atpsintasi","level":"h","page":"102–103","src":"Biochimica II","q":"Secondo il meccanismo di Boyer (cambio di legame), quale passaggio richiede la maggior parte dell'energia del gradiente?","opts":["Il rilascio dell'ATP dalla subunità β in conformazione T","La formazione del legame fosfoanidridico nel sito T","Il legame di ADP e Pi alla subunità in conformazione L","La rotazione della subunità a attorno all'anello c","L'ingresso del fosfato nella matrice con il simporto"],"ans":0,"why":"Nel sito T l'ATP si forma con ΔG ≈ 0; è il distacco (T → O) a costare energia.","note":"Sbobina di Biochimica II, p. 102: la conformazione L è chiamata «light». Nei testi è «loose» (allentata).","fixed":false},{"id":"h3s-04","topic":"m3-atpsintasi","level":"h","page":"105","src":"Biochimica II","q":"In mitocondri isolati con succinato si aggiunge oligomicina e poi 2,4-dinitrofenolo. Che cosa succede al consumo di O₂?","opts":["Si ferma con l'oligomicina e riparte con il DNP, senza ATP","Aumenta con l'oligomicina e si ferma del tutto con il DNP","Resta costante in entrambi i casi, perché c'è succinato","Si ferma con l'oligomicina e resta fermo anche dopo l'aggiunta del DNP","Aumenta in entrambi i casi, con produzione di ATP"],"ans":0,"why":"Con l'oligomicina il gradiente non viene scaricato e il trasporto di elettroni rallenta; il DNP scarica il gradiente. È la prova dell'accoppiamento.","note":null,"fixed":false},{"id":"h3s-05","topic":"m3-atpsintasi","level":"h","page":"105–106","src":"Biochimica II","q":"Perché il 2,4-dinitrofenolo, usato in passato come dimagrante, provoca ipertermia potenzialmente letale?","opts":["Riporta i protoni nella matrice scavalcando l'ATP sintasi: l'energia diventa calore","Blocca il complesso IV e l'energia degli elettroni rimasti nella catena si libera come calore","Inibisce la glicolisi e costringe la cellula a bruciare solo grassi, che scaldano","Aumenta la sintesi di ATP e l'eccesso di ATP idrolizzato produce molto calore","Attiva la termogenina in tutti i tessuti, non solo nel grasso bruno"],"ans":0,"why":"È un acido debole liposolubile (disaccoppiante): la cellula ossida più nutrienti per compensare. Il dosaggio era difficile da controllare.","note":"Sbobina di Biochimica II, p. 105: c'è scritto che il DNP «passa la membrana plasmatica» rilasciando il H⁺; si intende la membrana mitocondriale interna.","fixed":false},{"id":"h3s-06","topic":"m3-atpsintasi","level":"h","page":"106–107","src":"Biochimica II","q":"Nel neonato, come produce calore il tessuto adiposo bruno?","opts":["La termogenina fa rientrare i protoni senza produrre ATP","Idrolizza ATP con le pompe ioniche della membrana","Fermenta il glucosio a lattato, producendo calore nel citosol","Blocca il complesso IV e accumula elettroni che producono calore","Aumenta la sintesi di ATP con l'ATP sintasi e la idrolizza"],"ans":0,"why":"La termogenina (UCP1) è nella membrana interna: la catena lavora senza sintesi di ATP e l'energia si libera come calore. È un disaccoppiamento fisiologico.","note":"Sbobina di Biochimica II, p. 106: il tessuto adiposo bruno serve per riscaldare «il feto». Il riscaldamento serve al neonato, dopo la nascita (il feto è riscaldato dalla madre). La termogenina è UCP1, non «UP1».","fixed":false},{"id":"h3s-07","topic":"m3-atpsintasi","level":"h","page":"104","src":"Biochimica II","q":"Lo scambio ATP⁴⁻ (fuori) / ADP³⁻ (dentro) della ATP/ADP traslocasi è elettrogenico. Da dove prende l'energia?","opts":["Dal potenziale di membrana, che favorisce l'uscita dell'ATP⁴⁻","Dall'idrolisi di una molecola di ATP per ogni scambio","Dal gradiente di Na⁺ mantenuto dalla pompa Na⁺/K⁺ della membrana plasmatica","Da nessuna fonte: lo scambio è elettricamente neutro e spontaneo","Dal GTP prodotto dalla succinil-CoA sintetasi nel ciclo di Krebs"],"ans":0,"why":"Esce una carica negativa in più verso il lato P, positivo; il Pi entra con un H⁺. Parte della forza motrice protonica serve quindi al trasporto.","note":null,"fixed":false},{"id":"h3s-08","topic":"m3-atpsintasi","level":"h","page":"101–104","src":"Biochimica II","q":"Qual è il costo in protoni per ogni ATP che arriva nel citosol, e come si ricavano i valori 2,5 e 1,5?","opts":["Circa 4 H⁺ per ATP: NADH 10 H⁺ (2,5), FADH₂ 6 H⁺ (1,5)","3 H⁺ per ATP, senza costo di trasporto: NADH 3,3 e FADH₂ 2 ATP","Circa 8 H⁺ per ATP: NADH 10 H⁺ (1,25), FADH₂ 6 H⁺ (0,75)","2 H⁺ per ATP sintetizzato: NADH 5 ATP, FADH₂ 3 ATP","Nessun protone: l'ATP si forma dal NADH"],"ans":0,"why":"3 H⁺ per la sintesi + 1 per il trasporto. Non è nelle sbobine nel dettaglio: con 8 subunità c servono 8 H⁺ per 3 ATP.","note":null,"fixed":false},{"id":"h3r-01","topic":"m3-radicali","level":"h","page":"
