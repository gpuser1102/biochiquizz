a ΔG e la concentrazione dei reagenti e dei prodotti?","opts":["ΔG = ΔG°' + RT ln([prodotti]/[reagenti])","ΔG = ΔG°' − RT ln([prodotti]/[reagenti])","ΔG = −nFΔE + RT","ΔG = ΔH + TΔS","ΔG = ΔG°' × Keq"],"ans":0,"why":"Con il rapporto pari a Keq, ΔG = 0 (equilibrio).","note":null,"fixed":false},{"id":"x1e-01","topic":"m1-enzimologia","level":"a","page":"27","src":"Biochimica II","q":"Un inibitore competitivo come modifica KM e Vmax?","opts":["Aumenta la KM apparente, Vmax invariata","Diminuisce la Vmax, KM invariata","Diminuisce sia la KM sia la Vmax apparenti","Aumenta sia KM sia Vmax","Diminuisce la KM, Vmax invariata"],"ans":0,"why":"Aumentando il substrato si supera l'inibizione.","note":null,"fixed":false},{"id":"x1e-02","topic":"m1-enzimologia","level":"a","page":"29–30","src":"Biochimica II","q":"Qual è la differenza tra regolazione allosterica e controllo della quantità di enzima?","opts":["L'allosterica agisce in secondi; sintesi o degradazione dell'enzima in ore","Sono ugualmente rapide, perché entrambe agiscono sul sito attivo","L'allosterica è lenta, perché richiede la trascrizione di nuovi geni","La quantità di enzima non è regolabile: dipende solo dal genoma","Il controllo della quantità agisce in secondi; l'allosterica in giorni"],"ans":0,"why":"La modificazione covalente (fosforilazione) sta in mezzo: minuti.","note":null,"fixed":false},{"id":"x2f-01","topic":"m2-fosforilazione","level":"a","page":"37–38","src":"Biochimica II","q":"Perché il glucosio 6-fosfato inibisce l'esochinasi ma non la glucochinasi?","opts":["Il fegato deve fosforilare il glucosio dopo il pasto per immagazzinarlo, anche con G6P alto","La glucochinasi non lega il glucosio 6-fosfato perché ha un sito attivo troppo piccolo","Il glucosio 6-fosfato non si forma nel fegato, perché viene subito defosforilato","La glucochinasi è mitocondriale e il glucosio 6-fosfato resta nel citosol","Il glucosio 6-fosfato attiva la glucochinasi invece di inibirla"],"ans":0,"why":"La glucochinasi è invece regolata dalla proteina regolatrice, che la sequestra nel nucleo.","note":null,"fixed":false},{"id":"x2f-02","topic":"m2-fosforilazione","level":"l","page":"55–56","src":"Biochimica II","q":"Dove porta la glucochinasi la sua proteina regolatrice (GKRP) in presenza di fruttosio 6-fosfato?","opts":["Nel nucleo, dove resta inattiva","Nel mitocondrio, dove fosforila il glucosio","Sulla membrana plasmatica, accanto al GLUT2","Nel reticolo endoplasmatico, accanto alla glucosio 6-fosfatasi","Nel lisosoma, dove viene degradata"],"ans":0,"why":"Il glucosio alto la libera e la fa tornare nel citosol.","note":null,"fixed":false},{"id":"x2n-01","topic":"m2-navette","level":"a","page":"53–54","src":"Biochimica II","q":"Perché il NADH prodotto nel citosol dalla glicolisi non entra direttamente nel mitocondrio?","opts":["La membrana mitocondriale interna è impermeabile al NADH: entrano solo i suoi elettroni","Il NADH citosolico viene distrutto dalle deidrogenasi prima di arrivare al mitocondrio","Il NADH citosolico si ossida da solo a NAD⁺ a contatto con l'ossigeno","Entra liberamente, ma la sbobina usa le navette per semplificare","La membrana mitocondriale esterna è impermeabile al NADH"],"ans":0,"why":"Gli elettroni passano tramite molecole trasportatrici (glicerolo 3-P, malato).","note":null,"fixed":false},{"id":"x2n-02","topic":"m2-navette","level":"a","page":"54","src":"Biochimica II","q":"Nella navetta malato-aspartato, quale molecola attraversa la membrana interna portando gli elettroni?","opts":["Il malato","L'ossalacetato","Il NADH","Il glicerolo 3-fosfato","L'aspartato"],"ans":0,"why":"L'ossalacetato non attraversa la membrana: torna fuori come aspartato dopo una transaminazione. Il dettaglio della navetta malato-aspartato non è nelle sbobine.","note":null,"fixed":false},{"id":"x2n-03","topic":"m2-navette","level":"l","page":"54","src":"Biochimica II","q":"Quale abbreviazione è corretta per il glicerolo 3-fosfato della navetta?","opts":["Gro3P (o G3P)","3-PG","3-PG (o 3PG)","DHAP","Glc3P"],"ans":0,"why":"3-PG è la sigla del 3-fosfoglicerato, un intermedio diverso della glicolisi.","note":"Sbobina di Biochimica II, p. 54: il glicerolo 3-fosfato è abbreviato «3-PG», che è la sigla del 3-fosfoglicerato. Attenzione a non confonderli.","fixed":false},{"id":"x2n-04","topic":"m2-navette","level":"l","page":"54","src":"Biochimica II","q":"Dove si trova la glicerolo 3-fosfato deidrogenasi mitocondriale?","opts":["Sulla faccia esterna della membrana interna, e cede elettroni al Q tramite FAD","Nella matrice mitocondriale, dove riduce il NAD⁺ e cede gli elettroni al complesso I","Nel citosol, legata alla membrana mitocondriale esterna","Nella membrana esterna, dove cede elettroni al citocromo c","Sulla faccia interna della membrana interna, dentro il complesso I"],"ans":0,"why":"Per questo il glicerolo 3-P non deve entrare nella matrice.","note":null,"fixed":false},{"id":"x3r-01","topic":"m3-radicali","level":"a","page":"109","src":"Biochimica II","q":"Come viene rigenerato il glutatione ridotto dopo l'azione della glutatione perossidasi?","opts":["Dalla glutatione reduttasi, che usa NADPH","Dalla catalasi, che usa H₂O₂","Dalla superossido dismutasi, che usa il superossido","Dal NADH della catena respiratoria, direttamente","Dalla glutatione perossidasi stessa, che usa il selenio"],"ans":0,"why":"Per questo la via dei pentoso fosfati è fondamentale contro lo stress ossidativo.","note":null,"fixed":false},{"id":"x3r-02","topic":"m3-radicali","level":"a","page":"110","src":"Biochimica II","q":"Che cosa fa il fattore HIF nelle cellule tumorali ipossiche?","opts":["Aumenta enzimi glicolitici, LDH e PDH chinasi, e sostituisce COX4-1 con COX4-2","Aumenta la β-ossidazione, la sintesi di nuovi mitocondri e la PDH fosfatasi","Inibisce la glicolisi e spinge la cellula verso la respirazione","Attiva la piruvato deidrogenasi e il ciclo di Krebs","Aumenta la PDH fosfatasi e la sintesi di ATP mitocondriale"],"ans":0,"why":"Spinge la cellula verso la glicolisi e riduce la produzione di radicali.","note":null,"fixed":false},{"id":"x3r-03","topic":"m3-radicali","level":"l","page":"109","src":"Biochimica II","q":"Perché la glutatione perossidasi ha la selenocisteina invece della cisteina?","opts":["Il selenolato (Se⁻) è più ionizzato e più reattivo verso i perossidi del tiolato","Il selenio lega l'ossigeno molecolare e lo trasforma direttamente in acqua","La selenocisteina è più stabile e non si ossida mai","Il selenio trasporta elettroni dalla catena respiratoria al glutatione","La selenocisteina lega il NADPH e lo trasferisce al perossido"],"ans":0,"why":"Il selenio sta nello stesso gruppo di O e S e cede più facilmente l'H⁺.","note":null,"fixed":false},{"id":"x3r-04","topic":"m3-radicali","level":"l","page":"108","src":"Biochimica II","q":"Quali vitamine sono classicamente considerate antiossidanti?","opts":["C, E e il β-carotene (provitamina A)","K e B12","B1 e B2","D e K","K, B12 e acido folico (provitamine)"],"ans":0,"why":"La vitamina E protegge le membrane, la C agisce in ambiente acquoso.","note":"Sbobina di Biochimica II, p. 108: tra le vitamine antiossidanti è inclusa anche la K. Le antiossidanti classiche sono C, E e A/β-carotene; la K serve alla coagulazione.","fixed":false},{"id":"x3m-01","topic":"m3-malattie","level":"a","page":"112","src":"Biochimica II","q":"Nella cellula β, qual è la sequenza che porta alla secrezione di insulina?","opts":["Glucosio (GLUT2) → glicolisi e Krebs → ATP ↑ → chiusura canali K⁺ → depolarizzazione → Ca²⁺ → esocitosi","Glucosio → recettore di membrana accoppiato a Gs → cAMP ↑ → PKA → apertura dei canali Ca²⁺ → esocitosi","Glucosio (GLUT4) → glicolisi → ATP ↓ → apertura canali K⁺ → iperpolarizzazione → esocitosi","Glucosio (GLUT2) → glicolisi → ATP ↑ → apertura canali K⁺ → ingresso di Na⁺ → esocitosi","Insulina → GLUT4 → glucosio → ATP ↑ → chiusura canali Ca²⁺ → esocitosi"],"ans":0,"why":"Se l'ATP cala (es. per UCP2), la secrezione si riduce.","note":null,"fixed":false},{"id":"x3m-02","topic":"m3-malattie","level":"a","page":"112","src":"Biochimica II","q":"Perché la gravità delle malattie mitocondriali varia tra i figli della stessa madre?","opts":["Per l'eteroplasmia: ogni figlio riceve una quota diversa di mitocondri mutati","Il padre trasmette mitocondri sani ad alcuni figli e non ad altri","Ogni figlio ha mutazioni nucleari diverse che modificano il fenotipo","Il mtDNA si ricombina con quello paterno in modo diverso in ogni figlio","La madre trasmette il mtDNA mutato solo ai figli maschi"],"ans":0,"why":"Sotto una soglia di mitocondri mutati i sintomi possono mancare.","note":null,"fixed":false},{"id":"x3m-03","topic":"m3-malattie","level":"l","page":"113","src":"Biochimica II","q":"Il DNA mitocondriale è più esposto al danno ossidativo del DNA nucleare. Perché?","opts":["È vicino alla catena respiratoria, non ha istoni e si ripara poco","È lineare, molto lungo, e le sue estremità sono esposte agli ossidanti del citosol","È molto più lungo del DNA nucleare e offre più bersagli","È avvolto negli istoni, che producono radicali","Si replica solo una volta nella vita della cellula"],"ans":0,"why":"Questa è la base dell'ipotesi mitocondriale dell'invecchiamento.","note":"Sbobina di Biochimica II, p. 113: c'è scritto che il DNA mitocondriale «non può ripararsi». È una semplificazione: ha meccanismi di riparazione, ma più limitati di quelli nucleari.","fixed":false},{"id":"x4d-01","topic":"m4-degradazione","level":"a","page":"116–117","src":"Biochimica II","q":"La glicogeno fosforilasi lavora finché trova un punto di ramificazione. A quanti residui si ferma?","opts":["A 4 residui dal punto di ramificazione","A 1 residuo dal punto di ramificazione","A 10 residui dal punto di ramificazione","Non si ferma: stacca anche il residuo α-1,6","A 7 residui, la lunghezza di un ramo"],"ans":0,"why":"Resta una «destrina limite» che va sistemata dall'enzima deramificante.","note":null,"fixed":false},{"id":"x4d-02","topic":"m4-degradazione","level":"l","page":"116","src":"Biochimica II","q":"Perché la fosforolisi del glicogeno nel muscolo rende più ATP per glucosio rispetto al glucosio del sangue?","opts":["Il glucosio 1-P diventa G6P senza l'ATP dell'esochinasi: 3 ATP netti invece di 2","La fosforolisi produce più NADH, che il muscolo usa nella catena respiratoria","Il glucosio del glicogeno salta la fosfofruttochinasi e quindi un ATP","Non è vero: la resa è identica, 2 ATP per glucosio in entrambi i casi","Il glucosio 1-P produce due molecole di 1,3-BPG in più"],"ans":0,"why":"È un vantaggio della fosforolisi rispetto all'idrolisi.","note":null,"fixed":false},{"id":"x4d-03","topic":"m4-degradazione","level":"l","page":"115","src":"Biochimica II","q":"Che tipo di legami ha il glicogeno nelle catene e nelle ramificazioni?","opts":["α-1,4 nelle catene e α-1,6 nelle ramificazioni","β-1,4 nelle catene e α-1,6 nelle ramificazioni","α-1,4 nelle catene e β-1,6 nelle ramificazioni","Solo α-1,4, senza ramificazioni","α-1,6 nelle catene e α-1,4 nelle ramificazioni"],"ans":0,"why":"Un'unica estremità riducente (legata alla glicogenina) e tante estremità non riducenti.","note":null,"fixed":false},{"id":"x4s-01","topic":"m4-sintesi","level":"a","page":"122–123","src":"Biochimica II","q":"Perché la sintesi e la degradazione del glicogeno usano enzimi diversi?","opts":["Così le due vie sono regolate separatamente e in modo reciproco, senza ciclo futile","La fosforilasi non può funzionare al contrario, nemmeno in vitro con alte concentrazioni di glucosio 1-P","Sintesi e degradazione avvengono in organelli diversi della cellula","È un caso dell'evoluzione, senza vantaggi per la cellula","La sintasi lavora solo nel fegato e la fosforilasi solo nel muscolo"],"ans":0,"why":"Lo stesso principio vale per glicolisi e gluconeogenesi.","note":null,"fixed":false},{"id":"x4s-02","topic":"m4-sintesi","level":"l","page":"122","src":"Biochimica II","q":"Su quale estremità del glicogeno lavora la glicogeno sintasi?","opts":["Sulle estremità non riducenti","Sull'estremità riducente","Sui punti di ramificazione","Sulla glicogenina","Su entrambe le estremità di ogni catena"],"ans":0,"why":"Anche la fosforilasi lavora sulle estremità non riducenti: più rami = più velocità.","note":null,"fixed":false},{"id":"x4s-03","topic":"m4-sintesi","level":"l","page":"122","src":"Biochimica II","q":"Quale nucleotide viene rigenerato dall'UDP con un ATP dopo la sintesi del glicogeno?","opts":["UTP, dalla nucleoside difosfato chinasi","GTP, dalla succinil-CoA sintetasi","CTP, dalla CTP sintetasi","ATP, dall'adenilato chinasi","UTP, dalla UDP-glucosio pirofosforilasi"],"ans":0,"why":"UDP + ATP → UTP + ADP. Il nome dell'enzima non è nelle sbobine.","note":null,"fixed":false},{"id":"x4o-01","topic":"m4-ormoni","level":"a","page":"129–131","src":"Biochimica II","q":"Perché la cascata del glucagone amplifica il segnale?","opts":["Ogni enzima attivato (adenilato ciclasi, PKA, fosforilasi chinasi) attiva molte molecole a valle","Il glucagone circola a concentrazioni molto alte e satura tutti i recettori epatici","Il glucagone entra nella cellula e attiva direttamente tutte le fosforilasi","Il glucagone agisce sul DNA e aumenta la sintesi della glicogeno fosforilasi","Ogni recettore attivato produce una sola molecola di cAMP, che basta per tutta la cellula"],"ans":0,"why":"Poche molecole di ormone liberano moltissimo glucosio.","note":null,"fixed":false},{"id":"x4o-02","topic":"m4-ormoni","level":"a","page":"132","src":"Biochimica II","q":"Come porta l'insulina allo stoccaggio di glicogeno nel muscolo?","opts":["Aumenta GLUT4 in membrana e, tramite PKB, inattiva GSK3: la sintasi resta attiva","Attiva la glicogeno fosforilasi tramite la fosforilasi chinasi e aumenta il glucosio 6-P disponibile","Aumenta il cAMP, che attiva la sintasi tramite PKA","Inibisce l'esochinasi, così il glucosio resta libero per la sintasi","Aumenta GLUT2 in membrana e attiva GSK3, che fosforila la sintasi"],"ans":0,"why":"Attiva anche la PP1.","note":null,"fixed":false},{"id":"x4o-03","topic":"m4-ormoni","level":"l","page":"129–130","src":"Biochimica II","q":"Quale proteina G accoppia il recettore del glucagone all'adenilato ciclasi?","opts":["Gs","Gi","Gq","Gt (transducina)","G12"],"ans":0,"why":"I recettori α1 dell'adrenalina usano Gq (fosfolipasi C, IP₃, Ca²⁺).","note":null,"fixed":false},{"id":"x4e-01","topic":"m4-attivita","level":"a","page":"135","src":"Biochimica II","q":"Che cos'è la supercompensazione del glicogeno?","opts":["Dopo averlo esaurito con lo sforzo, una dieta ricca di carboidrati lo porta sopra i livelli iniziali","Il fegato produce glicogeno dai grassi quando il muscolo lo ha esaurito, e lo cede al muscolo stesso","Il glicogeno resta sempre alto, qualunque sia la dieta o lo sforzo","È una malattia da accumulo di glicogeno nel muscolo degli atleti","Dopo lo sforzo, a digiuno, il glicogeno torna da solo sopra i livelli iniziali"],"ans":0,"why":"A digiuno o con una dieta povera di carboidrati il glicogeno non si ricostituisce.","note":null,"fixed":false},{"id":"x4e-02","topic":"m4-attivita","level":"a","page":"134","src":"Biochimica II","q":"In uno sforzo leggero e prolungato, quanto glicogeno muscolare si consuma?","opts":["Poco: il muscolo usa soprattutto acidi grassi e glucosio del sangue","Tutto in pochi minuti, come nello sprint, perché il muscolo lavora sempre in anaerobiosi","Solo quello epatico, mentre quello muscolare resta intatto","Nessuno, perché lo sforzo leggero usa solo fosfocreatina","Molto: è la fonte principale di qualsiasi sforzo prolungato"],"ans":0,"why":"Sforzo moderato e soprattutto intenso consumano invece molto glicogeno.","note":null,"fixed":false},{"id":"x4e-03","topic":"m4-attivita","level":"l","page":"135","src":"Biochimica II","q":"Quando conviene assumere carboidrati per recuperare dopo lo sforzo?","opts":["Subito dopo lo sforzo e poi a intervalli regolari nelle 24 ore successive","Solo il giorno dopo, quando la glicogeno sintasi torna attiva e l'insulina risale","Solo prima dello sforzo, perché dopo non vengono più assorbiti","Mai, perché bastano le proteine a ricostituire il glicogeno","Solo la sera, perché di notte la sintesi è più rapida"],"ans":0,"why":"Subito dopo l'esercizio la sintesi del glicogeno muscolare è più rapida.","note":null,"fixed":false},{"id":"x4e-04","topic":"m4-attivita","level":"l","page":"133","src":"Biochimica II","q":"Il grafico delle fonti di energia nello sforzo mostra la quota di metabolismo aerobio e anaerobio. Come si chiamano correttamente?","opts":["Metabolismo aerobio e anaerobio (catabolismo)","Anabolismo aerobio e anaerobio (sintesi)","Gluconeogenesi aerobia e anaerobia (muscolare)","Glicogenosintesi aerobia e anaerobia","Lipogenesi aerobia e anaerobia"],"ans":0,"why":"Sono vie che producono energia: catabolismo.","note":"Sbobina di Biochimica II, p. 133: le curve sono chiamate «anabolismo aerobio» e «anabolismo anaerobio». Sono vie cataboliche: metabolismo (o catabolismo) aerobio e anaerobio.","fixed":false},{"id":"x4g-01","topic":"m4-glicogenosi","level":"a","page":"137","src":"Biochimica II","q":"Nella von Gierke, perché il glucagone non alza la glicemia?","opts":["La glicogenolisi epatica dà glucosio 6-P, che senza glucosio 6-fosfatasi non diventa glucosio","Il fegato non ha recettori per il glucagone in questa malattia, e il cAMP non sale","Il fegato non contiene glicogeno, perché manca anche la glicogeno sintasi, e il glucagone non ha substrato","Il glucagone non viene prodotto perché le cellule α sono distrutte","Il glucagone attiva la glicolisi invece della glicogenolisi"],"ans":0,"why":"Anzi: il G6P accumulato alimenta lattato, lipidi e acido urico.","note":null,"fixed":false},{"id":"x5f-01","topic":"m5-fonti","level":"a","page":"140","src":"Biochimica II","q":"Circa quanto glucosio consuma l'organismo al giorno e quanto ne usa il cervello?","opts":["Circa 160 g, di cui circa il 70% dal cervello","Circa 50 g, quasi tutto dal muscolo","Circa 500 g, metà dal fegato","Circa 20 g, tutto dagli eritrociti","Circa 160 g, di cui circa il 70% dal muscolo"],"ans":0,"why":"Il glicogeno epatico non basta per più di circa un giorno: serve la gluconeogenesi.","note":null,"fixed":false},{"id":"x5f-02","topic":"m5-fonti","level":"a","page":"141","src":"Biochimica II","q":"Tra mezzanotte e colazione, come cambiano glicogenolisi e gluconeogenesi?","opts":["La gluconeogenesi aumenta, la glicogenolisi cala man mano che il glicogeno finisce","Entrambe si azzerano, perché di notte il consumo di glucosio è nullo","Aumenta solo la glicogenolisi, mentre la gluconeogenesi resta spenta","Si attiva la sintesi di glicogeno, che continua fino alla colazione","La glicogenolisi aumenta, la gluconeogenesi cala man mano che il glicogeno finisce"],"ans":0,"why":"Dopo i pasti la gluconeogenesi si azzera e riparte la glicogeno sintesi.","note":null,"fixed":false},{"id":"x5f-03","topic":"m5-fonti","level":"l","page":"142","src":"Biochimica II","q":"Come agisce il cortisolo sulla gluconeogenesi?","opts":["È uno steroide: lega un recettore intracellulare che va nel nucleo e aumenta la trascrizione degli enzimi","Lega un recettore di membrana accoppiato a Gs, attiva l'adenilato ciclasi e la PKA fosforila gli enzimi","Fosforila direttamente la PFK2 e abbassa il fruttosio 2,6-bisfosfato","Inibisce l'insulina nel sangue legandola e impedendole di agire","Lega un recettore tirosin-chinasico e attiva la PKB"],"ans":0,"why":"Sul muscolo ha effetto catabolico: libera amminoacidi come substrati.","note":"Sbobina di Biochimica II, p. 142: il cortisolo è definito «ormone anabolizzante». Stimola la sintesi di enzimi epatici, ma a livello dell'organismo è catabolico (degrada le proteine muscolari, come dice la sbobina a p. 157).","fixed":false},{"id":"x5f-04","topic":"m5-fonti","level":"l","page":"140","src":"Biochimica II","q":"Quale percentuale della gluconeogenesi avviene nel rene secondo la sbobina?","opts":["Circa il 10%","Circa il 50%","Circa il 90%","Nessuna","Circa il 30%"],"ans":0,"why":"Il resto (circa 90%) avviene nel fegato. Nel digiuno prolungato la quota renale aumenta (questo non è nelle sbobine).","note":null,"fixed":false},{"id":"x5g-01","topic":"m5-glicerolo","level":"a","page":"141, 147","src":"Biochimica II","q":"Quali due enzimi portano il glicerolo a diidrossiacetone fosfato?","opts":["Glicerolo chinasi e glicerolo 3-fosfato deidrogenasi","Esochinasi e aldolasi, come per gli altri zuccheri","Trioso fosfato isomerasi e PEPCK","Glicerolo fosfatasi e aldolasi","Glicerolo chinasi e trioso fosfato isomerasi"],"ans":0,"why":"Il DHAP entra poi nella gluconeogenesi a livello dei triosi.","note":null,"fixed":false},{"id":"x5g-02","topic":"m5-glicerolo","level":"a","page":"147","src":"Biochimica II","q":"Da quale tappa della gluconeogenesi entra il glicerolo?","opts":["Dai triosi fosfati (DHAP), saltando le reazioni del piruvato e del PEP","Dal piruvato, come il lattato e l'alanina, passando per la piruvato carbossilasi","Dall'ossalacetato, tramite la PEPCK","Dal glucosio 6-P, saltando la fruttosio 1,6-bisfosfatasi","Dal fosfoenolpiruvato, saltando la piruvato carbossilasi"],"ans":0,"why":"Non servono piruvato carbossilasi e PEPCK.","note":null,"fixed":false},{"id":"x5g-03","topic":"m5-glicerolo","level":"l","page":"147","src":"Biochimica II","q":"Il propionil-CoA (dagli acidi grassi a numero dispari di carboni) è glucogenico perché:","opts":["Diventa succinil-CoA e quindi ossalacetato","Diventa acetil-CoA e poi citrato","Diventa glicerolo","Diventa glicerolo e poi diidrossiacetone fosfato","Diventa piruvato tramite la LDH"],"ans":0,"why":"Gli acidi grassi a numero pari invece non danno glucosio. Il passaggio per il succinil-CoA non è nella sbobina in questo punto.","note":null,"fixed":false},{"id":"x5g-04","topic":"m5-glicerolo","level":"l","page":"148","src":"Biochimica II","q":"Perché il lattato si forma nel muscolo e diventa glucosio nel fegato?","opts":["Nel muscolo sotto sforzo NAD⁺/NADH è basso (lattato); nel fegato è alto e la LDH lo riossida","Il fegato non ha LDH, quindi il lattato non può tornare a piruvato e va riossidato dal muscolo stesso","Il muscolo ha la glucosio 6-fosfatasi, quindi rilascia glucosio e non lattato","Il lattato non entra nel muscolo, quindi va per forza al fegato","Nel fegato NAD⁺/NADH è basso, e la LDH riduce il piruvato a lattato"],"ans":0,"why":"È il ciclo di Cori. Il cuore usa invece il lattato come combustibile (LDH1).","note":null,"fixed":false},{"id":"x5a-01","topic":"m5-approfondimenti","level":"a","page":"157","src":"Biochimica II","q":"Perché nel digiuno prolungato i corpi chetonici «salvano» le proteine muscolari?","opts":["Il cervello li usa come combustibile, quindi serve meno glucosio da amminoacidi muscolari","I corpi chetonici si trasformano in glucosio nel fegato e nel rene tramite la PEPCK","Inibiscono direttamente la proteolisi muscolare legando il proteasoma","Attivano la sintesi proteica nel muscolo durante il digiuno","Il muscolo li usa al posto delle proteine come fonte di azoto"],"ans":0,"why":"Per questo dopo alcuni giorni la gluconeogenesi si dimezza.","note":null,"fixed":false},{"id":"x5a-02","topic":"m5-approfondimenti","level":"a","page":"158","src":"Biochimica II","q":"L'alcol inibisce la gluconeogenesi. Quali due reazioni vengono bloccate dall'aumento di NADH?","opts":["Lattato → piruvato (LDH) e malato → ossalacetato (malato DH citosolica)","PEP → piruvato (piruvato chinasi) e G6P → glucosio (glucosio 6-fosfatasi)","Piruvato → acetil-CoA (PDH) e citrato → isocitrato (aconitasi)","Glicerolo → DHAP (glicerolo chinasi) e F6P → F1,6BP (PFK1)","Piruvato → ossalacetato (piruvato carbossilasi) e OAA → PEP (PEPCK)"],"ans":0,"why":"Entrambe richiedono NAD⁺.","note":null,"fixed":false},{"id":"x5a-03","topic":"m5-approfondimenti","level":"l","page":"153","src":"Biochimica II","q":"I topi con PEPCK sovraespressa nel muscolo, oltre a correre di più, avevano:","opts":["Più mitocondri, più uso di acidi grassi, meno lattato e più sensibilità all'insulina","Più lattato, più tessuto adiposo, meno mitocondri e insulino-resistenza marcata","Meno mitocondri, ma muscoli più grandi e più glicogeno","Diabete di tipo 2 con iperglicemia a digiuno","Meno acidi grassi usati e accumulo di trigliceridi nel muscolo"],"ans":0,"why":"La sbobina la cita per mostrare che un solo enzima può cambiare tutto il metabolismo.","note":null,"fixed":false},{"id":"x5a-04","topic":"m5-approfondimenti","level":"l","page":"159","src":"Biochimica II","q":"Che cosa succede alla zonazione del lobulo epatico in caso di danno?","opts":["È un gradiente plastico: gli epatociti di una zona possono assumere le funzioni di un'altra","È fissa e non cambia: ogni epatocita ha un ruolo definito alla nascita e non può riconvertirsi","Il lobulo smette di fare gluconeogenesi finché il danno non si ripara","Gli epatociti perivenosi muoiono e vengono sostituiti da tessuto fibroso","Le cellule di Kupffer prendono il posto degli epatociti periportali"],"ans":0,"why":"Non è una divisione netta ma un gradiente tra vena porta e vena centrale.","note":null,"fixed":false},{"id":"x6g-01","topic":"m6-regolazione","level":"a","page":"165","src":"Biochimica II","q":"Se la cellula sintetizza acidi grassi, che cosa succede alla via dei pentoso fosfati?","opts":["Accelera: la sintesi consuma NADPH, sale il NADP⁺ e la G6PD si attiva","Si blocca, perché gli acidi grassi e il malonil-CoA inibiscono allostericamente la G6PD","Non cambia, perché la via dipende solo dal glucosio","Diventa gluconeogenesi, per fornire glicerolo ai trigliceridi","Accelera solo la fase non ossidativa, per produrre ribosio"],"ans":0,"why":"Se il NADPH non viene consumato si accumula e blocca la G6PD.","note":null,"fixed":false},{"id":"x6g-02","topic":"m6-regolazione","level":"a","page":"165","src":"Biochimica II","q":"In una cellula in divisione che ha bisogno sia di ribosio sia di NADPH, quale modalità prevale?","opts":["Fase ossidativa completa: il ribulosio 5-P diventa ribosio 5-P, con 2 NADPH per G6P","Solo la fase non ossidativa, partendo dai triosi della glicolisi e senza produrre NADPH","Solo la glicolisi, che fornisce sia ribosio sia NADPH","Il riciclo completo del glucosio a CO₂, con 12 NADPH","Solo la G6PD, che produce ribosio senza la 6-fosfogluconato DH"],"ans":0,"why":"Le altre modalità servono quando prevale il bisogno di uno solo dei due prodotti.","note":null,"fixed":false},{"id":"x6g-03","topic":"m6-regolazione","level":"l","page":"165","src":"Biochimica II","q":"Quale enzima, oltre alla G6PD, produce NADPH nel citosol per la sintesi degli acidi grassi?","opts":["L'enzima malico","La lattato deidrogenasi","La gliceraldeide 3-P deidrogenasi","La piruvato carbossilasi","La glucosio 6-fosfatasi"],"ans":0,"why":"Malato + NADP⁺ → piruvato + CO₂ + NADPH. Anche l'isocitrato deidrogenasi citosolica usa NADP⁺. L'enzima malico non è in questa parte della sbobina.","note":null,"fixed":false},{"id":"x6g-04","topic":"m6-regolazione","level":"l","page":"159","src":"Biochimica II","q":"Che cosa distingue strutturalmente il NADPH dal NADH?","opts":["Un fosfato sul 2' del ribosio dell'adenosina","Un fosfato sul 5' della nicotinammide","Un anello aromatico in più nella nicotinammide","Un atomo di zolfo al posto dell'ossigeno","Un fosfato sul 3' del ribosio della nicotinammide"],"ans":0,"why":"Il fosfato fa sì che gli enzimi distinguano nettamente i due coenzimi.","note":null,"fixed":false}]}};</script>
<script>
/* Biochiquiz — logica dell'app. Dati in window.BQ_DATA = {molecules, content}. */
(function () {
  "use strict";
  const D = window.BQ_DATA;
  const MOL = Object.fromEntries(D.molecules.map(m => [m.id, m]));
  const C = D.content;
  // Indirizzo della web app di Google Apps Script che scrive le segnalazioni nel foglio Google.
  // Vuoto = le segnalazioni restano sul telefono e si possono copiare da Altro.
  const REPORT_URL = "https://script.google.com/macros/s/AKfycbx201q-0i5Qu-i0NqqgYbbw6YqdEmhC2zHkL0TAYYYj_l8PksMI1V5xpO2wg7bJxSxKOw/exec";
  const REPORT_KEY = "bq.reports";
  const STORE_KEY = "bq.v1";
  const $ = (s, el = document) => el.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
    return el;
  };
  const ICON = {
    feed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="4"/><path d="M9 9h6M9 13h4"/></svg>',
    topics: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h2M4 12h2M4 18h2M10 6h10M10 12h10M10 18h10"/></svg>',
    stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    chev: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
    flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
    flask: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 18.5A2 2 0 006.2 21.5h11.6a2 2 0 001.7-3L14 9V3"/><path d="M7.5 15h9"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
    hex: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/></svg>',
    rxn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h14M13 8l4 4-4 4"/><path d="M20 6v12"/></svg>',
    path: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v4a4 4 0 004 4h4a4 4 0 014 4"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>',
    dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19V5M8 7h7"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>',
    board: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21l4-4 4 4M7 9h6M7 12h9"/></svg>',
    pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  };
  ICON.flame = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 01-10 0c0-2.2 1-3.7 2-4.8.3 1.8 1.2 2.8 2.3 2.8C11 8.5 11 6 12 3z"/></svg>';
  const svgIcon = n => { const s = h("span", { html: ICON[n] }); return s.firstChild; };

  /* ---------------- Stato locale ---------------- */
  const blank = () => ({ selected: [], lastChecked: null, onlyLast: false, mode: "write", theme: "system", welcomed: false, newPerDay: 20, device: "", levels: { f: true, m: true, a: true, l: true }, progressive: true, study: "", hardStats: {}, cards: {}, days: {} });
  let S = blank();
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) { /* storage non disponibile */ }
  // dal vecchio sistema a scatole: quelle card ripartono come nuove
  Object.keys(S.cards).forEach(k => { if (!S.cards[k].type) delete S.cards[k]; });
  // modalità di studio: graduale (sblocco al 70%), libera (scegli i livelli), hard (solo domande toste, si scrive)
  if (!["grad", "free", "hard"].includes(S.study)) S.study = S.progressive === false ? "free" : "grad";
  if (!S.hardStats) S.hardStats = {};
  // codice casuale del telefono: raggruppa le segnalazioni della stessa persona senza sapere chi è
  if (!S.device) S.device = "T-" + Math.random().toString(36).slice(2, 6).toUpperCase() + Math.random().toString(36).slice(2, 4).toUpperCase();
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } };

  /* ---------------- Argomenti ---------------- */
  const TOPICS = {};
  C.topics.forEach(sub => sub.blocks.forEach(b => b.topics.forEach(t => { TOPICS[t.id] = Object.assign({ subject: sub.subject, block: b.name }, t); })));

  /* ---------------- Mazzo di card ---------------- */
  const CARDS = [];
  const MOL_PATHS_IDS = "glc g6p f6p fbp dhap ga3p bpg13 pg3 pg2 pep pyr oaa mal lac ala gly gro3p cit icit akg suc fum g1p fru gal man r5p ru5p xu5p pg6 e4p s7p acal etoh asp glu".split(" ");
  D.molecules.forEach(m => CARDS.push({ id: "mol:" + m.id, kind: "mol", mol: m.id, topics: C.moleculeTopics[m.id] || [], level: "f" }));
  // seconda card per molecola: dalla struttura alla via in cui si incontra
  D.molecules.forEach(m => { if ((C.moleculeTopics[m.id] || []).length && MOL_PATHS_IDS.includes(m.id)) CARDS.push({ id: "mv:" + m.id, kind: "mv", mol: m.id, topics: C.moleculeTopics[m.id], level: "m" }); });
  C.reactions.forEach(r => CARDS.push({ id: "rx:" + r.id, kind: "rx", rx: r, topics: [r.topic], level: "m" }));
  (C.exam || []).forEach(x => CARDS.push({ id: "ex:" + x.id, kind: "ex", ex: x, topics: [x.topic], level: x.level || "m" }));
  (C.bank || []).forEach(x => CARDS.push({ id: "q:" + x.id, kind: "ex", ex: x, bank: true, topics: [x.topic], level: x.level }));
  C.pathways.forEach(p => p.steps.forEach((st, i) => CARDS.push({ id: `nx:${p.id}:${i}`, kind: "nx", path: p, step: st, idx: i, topics: [st.topic || p.topic], level: "m" })));
  const CARD = Object.fromEntries(CARDS.map(c => [c.id, c]));

  const activeTopics = () => {
    if (S.onlyLast && S.lastChecked && S.selected.includes(S.lastChecked)) return [S.lastChecked];
    return S.selected.filter(t => TOPICS[t] && TOPICS[t].ready);
  };
  /* ---------------- Livelli ----------------
     Facile → Medio → Alta → 30 e lode. In modalità progressiva, per ogni argomento il livello successivo si sblocca
     quando almeno il 70% delle card del livello precedente è stato imparato (passato in ripasso). */
  const LEVELS = ["f", "m", "a", "l"];
  const LEVEL_NAME = { f: "Facile", m: "Medio", a: "Alta", l: "30 e lode", h: "Hard" };
  const STUDY_NAME = { grad: "Graduale", free: "Libera", hard: "Hard mode" };
  const isHard = () => S.study === "hard";
  // in hard mode: domande Alta e 30 e lode (anche verificate) + molecole e reazioni da scrivere senza opzioni
  const inHard = c => c.kind === "mol" || c.kind === "rx" || (c.kind === "ex" && (c.level === "a" || c.level === "l"));
  const UNLOCK = 0.7;
  const learned = c => { const x = S.cards[c.id]; return !!x && (x.type === "review" || (x.type === "relearn")); };
  function topicLevelState(tid) {
    const cs = CARDS.filter(c => c.topics.includes(tid));
    const by = {}; LEVELS.forEach(l => { const a = cs.filter(c => c.level === l); by[l] = { n: a.length, ok: a.filter(learned).length }; });
    let open = 0; // indice del livello più alto sbloccato
    for (let i = 0; i < LEVELS.length - 1; i++) {
      const cur = by[LEVELS[i]];
      if (cur.n === 0 || cur.ok / cur.n >= UNLOCK) open = i + 1; else break;
    }
    return { by, open };
  }
  const levelAllowed = (c, unlockCache) => {
    if (isHard()) return inHard(c);
    if (!S.levels[c.level]) return false;
    if (S.study !== "grad") return true;
    return c.topics.some(t => { const st = unlockCache[t] || (unlockCache[t] = topicLevelState(t)); return LEVELS.indexOf(c.level) <= st.open; });
  };
  const eligible = () => {
    const a = new Set(activeTopics()), cache = {};
    return CARDS.filter(c => c.topics.some(t => a.has(t)) && levelAllowed(c, cache));
  };
  const cardsInTopic = id => CARDS.filter(c => c.topics.includes(id)).length;
  const topicMeta = id => {
    if (isHard()) { const n = CARDS.filter(c => c.topics.includes(id) && inHard(c)).length; return `${n} card in hard mode`; }
    if (S.study !== "grad") return `${cardsInTopic(id)} card`;
    const st = topicLevelState(id);
    return `${cardsInTopic(id)} card · ${LEVEL_NAME[LEVELS[st.open]]}`;
  };

  /* ---------------- Ripetizione spaziata: algoritmo SM-2 ----------------
     Card nuove → passi di apprendimento (1 min, 10 min) → ripasso a giorni con intervallo × facilità.
     Errore su una card imparata = "lapse": facilità −20%, intervallo azzerato a 1 giorno, ripasso tra 10 min.
     La giornata inizia alle 4 di mattina. */
  const MIN = 60e3, HOUR = 36e5, DAY = 864e5;
  const CFG = { learn: [1 * MIN, 10 * MIN], relearn: [10 * MIN], gradIvl: 1, easyIvl: 4, startEase: 2.5, minEase: 1.3,
    easyBonus: 1.3, hardMult: 1.2, learnAhead: 20 * MIN, leech: 8, mature: 21, hardRelearn: [1 * MIN, 10 * MIN] };
  const dayStart = t => { const d = new Date(t - 4 * HOUR); d.setHours(4, 0, 0, 0); return d.getTime(); };
  const today = () => { const d = new Date(dayStart(Date.now())); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const newState = () => ({ type: "new", step: 0, ease: CFG.startEase, ivl: 0, due: 0, lapses: 0, right: 0, wrong: 0, seen: 0 });
  const fuzz = ivl => { if (ivl < 3) return ivl; const f = Math.max(1, Math.round(ivl * .05)); return ivl + Math.round((Math.random() * 2 - 1) * f); };
  // r: 1 = Di nuovo, 2 = Difficile, 3 = Buono, 4 = Facile
  function schedule(st, r, now, noFuzz) {
    const fz = noFuzz ? x => x : fuzz;
    if (st.type !== "review") {

    const pop = h("div", { class: "pop " + (ok ? "ok" : "ko") + (last ? " up" : ""), role: "status" },
      h("div", { class: "pop-verdict" }, ok ? "Giusto" : "Sbagliato"),

        : h("div", { class: "pop-note info" }, h("b", {}, "Nota · "), note)) : null,
      rate);
    anchor.classList.add("has-pop");
    anchor.append(pop);

    const body = card.querySelector(".card-body");
    if (body) {
      const pr = pop.getBoundingClientRect(), br = body.getBoundingClientRect(), ar = anchor.getBoundingClientRect();
      if (pr.bottom > br.bottom - 4 && ar.top - br.top > br.bottom - ar.bottom) pop.classList.add("up");
    }
  }
  function optionList(opts, correct, onDone) {
    const wrap = h("div", { class: "options", role: "group" });
    opts.forEach((o, i) => {
      const b = h("button", { class: "opt", type: "button" }, h("span", { class: "key" }, "ABCDE"[i]), h("span", { class: "opt-label" }, o));
      b.addEventListener("click", () => {
        const ok = o === correct;
        wrap.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.querySelector(".opt-label").textContent === correct) x.classList.add("right"); });
        if (!ok) b.classList.add("wrong");

  // vie metaboliche in cui compare ogni molecola: "si" = compare, "forse" = escluso dai distrattori perché discutibile
  const PATHS = ["Glicolisi", "Gluconeogenesi", "Ciclo di Krebs", "Via dei pentoso fosfati", "Metabolismo del glicogeno", "Fermentazione alcolica",
    "Navetta malato-aspartato", "Navetta del glicerolo fosfato", "Ciclo di Cori", "Ciclo dell'urea", "β-ossidazione degli acidi grassi", "Chetogenesi"];
  const [GLI, GNG, TCA, PPP, GLY, FALC, NMA, NGP, CORI, UREA] = PATHS;
  const MOL_PATHS = {
    glc: [[GLI, GNG, GLY, CORI], [PPP]], g6p: [[GLI, GNG, GLY, PPP], [CORI]], f6p: [[GLI, GNG, PPP], [CORI]], fbp: [[GLI, GNG], [CORI]],
    dhap: [[GLI, GNG, NGP], [CORI]], ga3p: [[GLI, GNG, PPP], [CORI]], bpg13: [[GLI, GNG], [CORI]], pg3: [[GLI, GNG], [CORI]], pg2: [[GLI, GNG], [CORI]],
    pep: [[GLI, GNG], [CORI]], pyr: [[GLI, GNG, FALC, CORI], [TCA]], oaa: [[TCA, GNG, NMA], [UREA, CORI]], mal: [[TCA, GNG, NMA], [CORI]],
    lac: [[CORI, GNG], [GLI]], ala: [[GNG], [UREA]], gly: [[GNG], []], gro3p: [[NGP, GNG], []],
    cit: [[TCA], []], icit: [[TCA], []], akg: [[TCA], [NMA, UREA, GNG]], suc: [[TCA], []], fum: [[TCA, UREA], []],
    g1p: [[GLY], [GNG]], fru: [[GLI], [GNG, GLY]], gal: [[GLI], [GLY]], man: [[GLI], []],
    r5p: [[PPP], []], ru5p: [[PPP], []], xu5p: [[PPP], []], pg6: [[PPP], []], e4p: [[PPP], []], s7p: [[PPP], []],
    acal: [[FALC], []], etoh: [[FALC], []], asp: [[NMA, UREA], [GNG, TCA]], glu: [[NMA], [UREA, GNG, TCA]],
  };
  function mvCard(c) {
    const m = MOL[c.mol];
    const { card, body } = shell(c, "Riconosci la molecola", "t-rose", "hex");
    body.append(h("h2", { class: "q" }, "In quale di queste vie compare questa molecola?"), molBox(m.id));
    const [yes, maybe] = MOL_PATHS[m.id];
    const answer = yes[Math.floor(Math.random() * yes.length)];
    const pool = PATHS.filter(p => !yes.includes(p) && !maybe.includes(p));
    const opts = shuffle([answer, ...shuffle(pool).slice(0, 4)]);
    body.append(optionList(opts, answer, (ok, btn) => {
      const g = grade(c.id, ok ? 3 : 1, c.extra);
      finish(card, btn, ok, `È ${m.name}.`, "Compare in: " + yes.join(", ") + ".", null, g);
    }));
    return card;
  }
  function molCard(c) {
    const m = MOL[c.mol];
    const { card, body } = shell(c, "Riconosci la molecola", "t-rose", "hex");
    body.append(h("h2", { class: "q" }, "Che molecola è?"), molBox(m.id));
    const detail = `${m.formula} · PubChem CID ${m.cid}`;
    const done = (ok, anchor) => { const g = grade(c.id, ok ? 3 : 1, c.extra); finish(card, anchor, ok, ok ? m.name : `È ${m.name}.`, detail, null, g); };
    // distrattori: prima le molecole dello stesso argomento, poi le altre
    const near = shuffle(D.molecules.filter(x => x.id !== m.id && (C.moleculeTopics[x.id] || []).some(t => c.topics.includes(t))).map(x => x.name));
    const far = shuffle(D.molecules.filter(x => x.id !== m.id && !near.includes(x.name)).map(x => x.name));
    const opts = shuffle([m.name, ...near.concat(far).slice(0, 4)]);
    const showOptions = () => body.append(optionList(opts, m.name, done));
    if (S.mode === "choice" && !isHard()) showOptions();
    else {
      const inp = h("input", { type: "text", id: "ans-" + c.id.replace(/\W/g, "-") + "-" + shown, placeholder: "Scrivi il nome (va bene anche la sigla)", autocomplete: "off", autocapitalize: "off", spellcheck: "false", enterkeyhint: "done", "aria-label": "Nome della molecola" });
      const go = h("button", { class: "btn btn-primary", type: "button" }, "Verifica");
      const form = h("div", { class: "write" }, inp, go);
      const help = h("button", { class: "linkish", type: "button" }, "Non mi viene: mostra 5 opzioni");
      const check = () => {
        if (!inp.value.trim()) { inp.focus(); return; }
        const ok = matchName(inp.value, m); inp.disabled = go.disabled = true; help.remove(); inp.blur();
        form.classList.add(ok ? "right" : "wrong");
        done(ok, form);
      };
      go.addEventListener("click", check);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
      help.addEventListener("click", () => { form.remove(); help.remove(); showOptions(); });
      if (isHard()) { body.append(form); help.remove(); } else body.append(form, help);
    }
    return card;
  }

  // Domanda specifica in base a cosa manca nella reazione
  function rxQuestion(r, hid) {
    if (hid.kind === "enz") return "Quale enzima catalizza questa reazione?";
    if (hid.kind === "co") return "Quale coenzima usa questo enzima?";
    const left = hid.side === "left", v = hid.val;
    if (hid.kind === "mol") {
      const sameSide = (left ? r.left : r.right).filter(x => x[0] === "m").length;
      if (left) return sameSide > 1 ? "Quale altro substrato manca?" : "Qual è il substrato di questa reazione?";
      return sameSide > 1 ? "Qual è l'altro prodotto della scissione?" : "Qual è il prodotto di questa reazione?";
    }
    const Q = {
      "ATP": left ? "Quale nucleotide cede il fosfato?" : "Quale nucleotide si forma?",
      "GTP": left ? "Quale nucleotide cede il fosfato?" : "Quale nucleotide si forma?",
      "ADP": left ? "Quale nucleotide accetta il fosfato?" : "Quale nucleotide resta dopo il trasferimento del fosfato?",
      "GDP": left ? "Quale nucleotide accetta il fosfato?" : "Quale nucleotide resta dopo il trasferimento del fosfato?",
      "NAD⁺": left ? "Quale coenzima accetta gli elettroni (si riduce)?" : "In che forma torna il coenzima dopo aver ceduto gli elettroni?",
      "NADH + H⁺": left ? "Quale coenzima cede gli elettroni (si ossida)?" : "In che forma esce il coenzima ridotto?",
      "Pi": left ? "Cosa viene incorporato nel prodotto senza consumare ATP?" : "Cosa viene liberato dall'idrolisi?",
      "H₂O": left ? "Quale molecola serve per l'idrolisi?" : "Quale molecola viene eliminata?",
      "CO₂": "Cosa viene liberato con la decarbossilazione?",
      "HCO₃⁻": "Da dove viene il carbonio aggiunto al piruvato?",
    };
    if (v === "ATP" && left && r.left.some(x => x[1] === "HCO₃⁻")) return "Quale nucleotide viene idrolizzato per attivare il bicarbonato?";
    return Q[v] || "Cosa manca per completare la reazione?";
  }
  const eqText = r => {
    const t = x => x[0] === "m" ? molName(x[1]) : x[1];
    return `${r.left.map(t).join(" + ")} ${r.irreversible ? "→" : "⇌"} ${r.right.map(t).join(" + ")}`;
  };
  function rxCard(c) {
    const r = c.rx;
    const { card, body } = shell(c, "Completa la reazione", "t-peach", "rxn");
    // elementi nascondibili: molecole, cofattori, enzima, coenzima
    const slots = [];
    r.left.forEach((x, i) => slots.push({ side: "left", i, kind: x[0] === "m" ? "mol" : "cof", val: x[1] }));
    r.right.forEach((x, i) => slots.push({ side: "right", i, kind: x[0] === "m" ? "mol" : "cof", val: x[1] }));
    slots.push({ kind: "enz", val: r.enzyme });
    if (r.coenzyme) slots.push({ kind: "co", val: r.coenzyme });
    // in hard mode si nasconde solo una molecola o l'enzima, e la risposta va scritta
    const hidable = isHard() ? slots.filter(s => s.kind === "mol" || s.kind === "enz") : slots;
    const hid = hidable[Math.floor(Math.random() * hidable.length)];
    const question = rxQuestion(r, hid);
    const label = s => s.kind === "mol" ? molName(s.val) : s.val;
    const answer = label(hid);
    const patch = h("span", { class: "patch" }, "?");
    const side = (arr, sideName) => {
      const row = h("div", { class: "rx-side" });
      arr.forEach((x, i) => {
        if (i) row.append(h("span", { class: "rx-plus" }, "+"));
        const isHid = hid.side === sideName && hid.i === i;
        row.append(isHid ? patch : h("span", { class: "rx-item" + (x[0] === "c" ? " cof" : "") }, x[0] === "m" ? molName(x[1]) : x[1]));
      });
      return row;
    };
    const enz = hid.kind === "enz" ? patch : h("span", { class: "enz" }, r.enzyme);
    const co = r.coenzyme ? h("span", { class: "co" }, "coenzima: ", hid.kind === "co" ? patch : r.coenzyme) : null;
    const where = r.where ? h("span", { class: "co" }, "sede: ", r.where) : null;
    body.append(
      h("h2", { class: "q" }, question),
      h("div", { class: "rx" }, side(r.left, "left"),
        h("div", { class: "rx-arrow" }, h("span", { class: "stem" + (r.irreversible ? "" : " rev"), "aria-label": r.irreversible ? "irreversibile" : "reversibile" }), h("div", { class: "rx-enz" }, enz, co, where)),
        side(r.right, "right")));
    let pool;
    if (hid.kind === "mol") pool = D.molecules.map(m => m.name);
    else if (hid.kind === "enz") pool = ALL_ENZYMES;
    else pool = C.cofactorPool;
    const present = slots.filter(s => s !== hid).map(label);
    const opts = shuffle([answer, ...sample(pool, 4, [answer, ...present])]);
    let note = r.note || null;
    if (hid.kind === "enz" && r.enzymeNotInNotes && !note) note = "Il nome dell'enzima non è nelle sbobine.";
    const done = (ok, btn) => {
      const g = grade(c.id, ok ? 3 : 1, c.extra);
      patch.textContent = answer; patch.classList.add("revealed"); if (!ok) patch.classList.add("miss");
      finish(card, btn, ok, `${r.enzyme}: ${eqText(r)}`, ref(subjectOf(r.topic), r.page), note, g);
    };
    if (isHard()) body.append(writeBox(c, hid.kind === "mol" ? "Scrivi il nome della molecola" : "Scrivi il nome dell'enzima",
      v => hid.kind === "mol" ? matchName(v, MOL[hid.val]) : matchText(v, answer), done));
    else body.append(optionList(opts, answer, done));
    return card;
  }

  function nxCard(c) {
    const p = c.path, st = c.step;
    const { card, body } = shell(c, "Cosa succede dopo", "t-sage", "path");
    const askEnzyme = Math.random() < .4;
    const where = st.where ? ` ${st.where}` : "";
    const withTxt = st.with ? ` (insieme al ${MOL[st.with].name.toLowerCase()})` : "";
    const pathName = p.name.charAt(0).toUpperCase() + p.name.slice(1);
    body.append(
      h("h2", { class: "q" }, askEnzyme
        ? `${pathName}: quale enzima agisce ${prep("su", st.from)}${where}?`
        : `${pathName}: cosa si forma ${prep("da", st.from)}${withTxt}${where}?`),
      molBox(st.from));
    const answer = askEnzyme ? st.enzyme : st.to.map(molName).join(" + ");
    let pool;
    if (askEnzyme) pool = ALL_ENZYMES;
    else {
      const inPath = [...new Set(p.steps.flatMap(s => [s.from, ...s.to]))].map(molName);
      pool = [...new Set([...inPath, ...D.molecules.map(m => m.name)])];
      if (st.to.length > 1) pool = ["2 Piruvato", "Glucosio 6-fosfato + Pi", "Fosfoenolpiruvato + Gliceraldeide 3-fosfato", "Diidrossiacetone fosfato + 3-fosfoglicerato", "2 Gliceraldeide 3-fosfato + ATP"];
    }
    const opts = shuffle([answer, ...sample(pool, 4, [answer, molName(st.from)])]);
    body.append(optionList(opts, answer, (ok, btn) => {
      const g = grade(c.id, ok ? 3 : 1, c.extra);
      const full = `${molName(st.from)} → ${st.to.map(molName).join(" + ")} · ${st.enzyme}`;
      const tp = st.topic || p.topic;
      finish(card, btn, ok, full, [ok ? null : `Risposta giusta: ${answer}`, ref(subjectOf(tp), (TOPICS[tp] || {}).pages)].filter(Boolean).join(" · ") || null, st.note || null, g);
    }));
    return card;
  }

  // Domanda verificata (proposta a lezione): opzioni nell'ordine originale (alcune rimandano alle altre: "Tutte e tre", "Nessuno")
  function examCard(c) {
    const x = c.ex;
    const kicker = c.bank ? (x.level === "l" ? "Rifinitura da 30 e lode" : "Domanda") : (x.times > 1 ? `Domanda verificata · uscita ${x.times} volte` : "Domanda verificata");
    const { card, body } = shell(c, kicker, c.bank ? (x.level === "l" ? "t-lilac" : "t-rose") : "t-sky", c.bank ? (x.level === "l" ? "star" : "hex") : "board");
    const qEl = h("h2", { class: "q ex-q" });
    // evidenzia le negazioni, come si fa a penna sul compito
    x.q.split(/(\bnon\b|\bfalsa\b|\btranne\b)/i).forEach(part => qEl.append(/^(non|falsa|tranne)$/i.test(part) ? h("u", {}, part) : part));
    body.append(qEl);
    const correct = x.opts[x.ans];
    const opts = c.bank && !x.fixed ? shuffle(x.opts) : x.opts;
    const letter = "ABCDE"[opts.indexOf(correct)];
    body.append(optionList(opts, correct, (ok, btn) => {
      const g = grade(c.id, ok ? 3 : 1, c.extra);
      finish(card, btn, ok, ok ? x.why : `Risposta: ${letter}. ${x.why}`, x.page ? ref(x.src || subjectOf(x.topic), x.page) : "Non è nelle sbobine", x.note, g);
    }));
    return card;
  }

  /* ---------------- Feed ---------------- */
  const feed = () => $("#feed");
  function emptyFeed() {

  function doneSlide() {

  /* ---------------- Modalità di studio ---------------- */

  function resetFeed() {

  function onFeedScroll() {

  const VIEWS = ["feed", "topics", "stats", "info"];
  function go(v) {
    VIEWS.forEach(x => { $("#view-" + x).hidden = x !== v; $("#tab-" + x).setAttribute("aria-selected", String(x === v)); });
    if (v === "stats") renderStats();
    if (v === "info") renderInfo();
    if (v === "topics") renderTopics();
  }
  function applyTheme() {
    if (S.theme === "system") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = S.theme;
    const meta = $('meta[name="theme-color"]'); if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    redrawMolecules();
  }
  function renderAll() { renderModebar(); renderTopics(); resetFeed(); go(S.selected.length ? "feed" : "topics"); }

  /* ---------------- Aggiornamenti (solo app installata / GitHub Pages) ---------------- */
  const isHosted = () => location.protocol === "https:" && !/claude/.test(location.hostname);
  let updateShown = false;
  async function checkUpdate() {
    if (!isHosted() || updateShown || !navigator.onLine) return;
    try {
      const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
      const v = (await r.json()).version;
      if (v && v !== C.version) {
        updateShown = true;
        const bar = h("div", { class: "update-bar", role: "status" }, h("span", {}, "Nuova versione con domande aggiornate"),
          h("button", { type: "button", class: "btn btn-primary", onclick: async () => {
            try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (e) { }
            location.reload();
          } }, "Aggiorna"));
        document.body.append(bar);
      }
    } catch (e) { }
  }

  function init() {
    const tabbar = $("#tabbar");
    [["feed", "Studia"], ["topics", "Argomenti"], ["stats", "Statistiche"], ["info", "Altro"]].forEach(([v, l]) => {
      tabbar.append(h("button", { class: "tab", id: "tab-" + v, type: "button", role: "tab", "aria-selected": "false", "aria-controls": "view-" + v, onclick: () => go(v) },
        h("span", { class: "pill", html: ICON[v] }), l));
    });
    feed().addEventListener("scroll", () => requestAnimationFrame(onFeedScroll), { passive: true });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (S.theme === "system") applyTheme(); });
    applyTheme();
    renderAll();
    if (!S.welcomed) showWelcome();
    if ("serviceWorker" in navigator && isHosted()) navigator.serviceWorker.register("sw.js").catch(() => { });
    flushReports(); checkUpdate(); pingUsage();
    window.addEventListener("online", () => { flushReports(); checkUpdate(); pingUsage(); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { flushReports(); checkUpdate(); pingUsage(); } });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();

</script>
</body>
</html>
