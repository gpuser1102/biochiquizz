si e colesterolo: la cellula decide in base alle sue necessità.","note":null,"fixed":false},{"id":"m1c-05","topic":"m1-catabolismo","level":"m","page":"6–7","src":"Biochimica II","q":"Perché l'anabolismo ha bisogno di potere riducente?","opts":["Perché le biosintesi sono in gran parte processi riduttivi","Perché l'anabolismo produce NADH che deve essere riossidato","Perché il potere riducente sostituisce l'ATP nelle biosintesi","Perché tutte le biosintesi avvengono all'interno del mitocondrio","Perché le biosintesi sono reazioni di ossidazione dei substrati"],"ans":0,"why":"Il catabolismo è ossidativo e produce coenzimi ridotti; l'anabolismo è riduttivo e li consuma. Per le biosintesi il coenzima è soprattutto il NADPH.","note":"Sbobina di Biochimica II, p. 6–7: c'è scritto che il potere riducente per le biosintesi è «soprattutto NADH». Per le biosintesi riduttive (acidi grassi, colesterolo) il coenzima è il NADPH; il NADH serve soprattutto alla fosforilazione ossidativa.","fixed":false},{"id":"m1c-06","topic":"m1-catabolismo","level":"a","page":"8","src":"Biochimica II","q":"Nella sequenza glicolisi → ciclo di Krebs → fosforilazione ossidativa, dove si forma la maggior parte dell'ATP e perché?","opts":["Nella fosforilazione ossidativa, che riossida i coenzimi ridotti cedendo elettroni all'O₂","Nella glicolisi, perché è la via più veloce e lavora anche senza ossigeno","Nel ciclo di Krebs, perché ossida completamente l'acetil-CoA a due molecole di CO₂","In tutte e tre in quantità simile, circa un terzo dell'ATP totale per ciascuna via","Nella glicolisi, perché produce direttamente ATP con le fosforilazioni a livello del substrato"],"ans":0,"why":"Glicolisi e Krebs producono poco ATP ma molti coenzimi ridotti; la riossidazione di NADH e FADH₂ con l'ossigeno nella fosforilazione ossidativa produce la gran parte dell'ATP.","note":null,"fixed":false},{"id":"m1c-07","topic":"m1-catabolismo","level":"a","page":"7","src":"Biochimica II","q":"L'acetil-CoA è precursore di tutte le seguenti molecole tranne:","opts":["Acidi grassi (a catena lunga)","Colesterolo (nel fegato)","Ormoni steroidei","Glucosio (nell'uomo)","Corpi chetonici (nel fegato)"],"ans":3,"why":"Nell'uomo l'acetil-CoA non può diventare glucosio: la piruvato deidrogenasi è irreversibile e nel ciclo di Krebs i due carboni dell'acetile escono come CO₂.","note":"Il fatto che l'acetil-CoA non dia glucosio non è detto esplicitamente in questa parte della sbobina.","fixed":false},{"id":"m1c-08","topic":"m1-catabolismo","level":"l","page":"6","src":"Biochimica II","q":"Come si chiama la forma ossidata del nicotinammide adenin dinucleotide fosfato?","opts":["NADP⁺","NADPH","NADH⁺","FADP","FADPH"],"ans":0,"why":"NADP⁺ è la forma ossidata, NADPH quella ridotta. Si distingue dal NAD⁺ per un fosfato sul 2' del ribosio legato all'adenina.","note":null,"fixed":false},{"id":"m1t-01","topic":"m1-termodinamica","level":"f","page":"10","src":"Biochimica II","q":"Che cosa dice la termodinamica di una reazione?","opts":["Se può avvenire spontaneamente","Quanto velocemente avviene","Quale enzima la catalizza e come","Quanta energia di attivazione serve","Quanta energia serve per superare lo stato di transizione"],"ans":0,"why":"La termodinamica (ΔG) dice se una reazione è possibile; la velocità è oggetto della cinetica.","note":null,"fixed":false},{"id":"m1t-02","topic":"m1-termodinamica","level":"f","page":"11","src":"Biochimica II","q":"Se Keq > 1, il ΔG°' della reazione è:","opts":["Positivo","Negativo","Zero","Indeterminabile","Uguale alla Keq"],"ans":1,"why":"ΔG°' = −RT ln Keq: con Keq > 1 il logaritmo è positivo e il ΔG°' negativo, la reazione procede verso i prodotti.","note":"Sbobina di Biochimica II, p. 11: parla di «keq > 0», «keq = 0» e «keq < 0». La Keq è sempre positiva: i casi corretti sono Keq > 1, = 1 e < 1. Nella formula manca anche il logaritmo: ΔG°' = −RT ln Keq.","fixed":false},{"id":"m1t-03","topic":"m1-termodinamica","level":"m","page":"11","src":"Biochimica II","q":"Quali sono le condizioni standard biochimiche a cui si riferisce il ΔG°'?","opts":["pH 7, 25 °C, reagenti e prodotti 1 M","pH 7,4, 37 °C, concentrazioni cellulari","pH 0, 25 °C, reagenti e prodotti 1 M","pH 7, 37 °C, reagenti e prodotti 1 mM","pH 7,4, 25 °C, reagenti e prodotti 0,1 M"],"ans":0,"why":"pH 7, 298 K (25 °C) e tutte le specie a 1 M; per questo nella cellula il ΔG reale è diverso.","note":"Sbobina di Biochimica II, p. 10: c'è scritto «T = 273 °K (+25 °C)». 25 °C sono 298 K; 273 K sono 0 °C.","fixed":false},{"id":"m1t-04","topic":"m1-termodinamica","level":"m","page":"12","src":"Biochimica II","q":"In una serie A ⇌ B ⇌ C all'equilibrio, cosa succede se la cellula consuma C?","opts":["Aumenta la trasformazione di A in B e di B in C","Si forma più A, perché l'equilibrio si sposta a sinistra","Non cambia nulla, perché le reazioni sono già all'equilibrio","La Keq delle due reazioni aumenta per compensare","Si accumula B, perché solo la seconda reazione accelera"],"ans":0,"why":"Per il principio di Le Chatelier, sottrarre il prodotto sposta tutte le reazioni della serie verso destra.","note":null,"fixed":false},{"id":"m1t-05","topic":"m1-termodinamica","level":"a","page":"12","src":"Biochimica II","q":"Perché le reazioni regolate di una via metabolica hanno ΔG molto negativo?","opts":["Sono praticamente irreversibili: lì la via si accende o si spegne senza tornare indietro","Sono le più veloci della via: il loro enzima ha la kcat più alta e fissa da solo il flusso","Non hanno bisogno di enzimi, perché procedono spontaneamente in modo rapido","Sono all'equilibrio, quindi piccole variazioni di substrato bastano a regolarle","Consumano sempre ATP, e il ΔG negativo deriva soltanto dall'idrolisi dell'ATP"],"ans":0,"why":"Le reazioni vicine all'equilibrio vanno nei due sensi secondo le concentrazioni; quelle con ΔG molto negativo vanno in un solo senso e sono il punto in cui intervengono gli enzimi allosterici.","note":null,"fixed":false},{"id":"m1t-06","topic":"m1-termodinamica","level":"a","page":"12","src":"Biochimica II","q":"Una reazione ha ΔG°' = +5 kJ/mol. Nella cellula procede verso destra. Come è possibile?","opts":["Il prodotto viene consumato e il rapporto prodotti/reagenti resta basso: il ΔG diventa negativo","Non è possibile: con ΔG°' positivo la reazione procede sempre verso sinistra nella cellula","L'enzima abbassa l'energia di attivazione, e con essa diventa negativo anche il ΔG°' della reazione","A 37 °C il ΔG°' cambia segno, perché il valore tabulato è definito a 25 °C e pH 7","La reazione è accoppiata all'idrolisi di ATP, che rende negativo il ΔG°' tabulato"],"ans":0,"why":"ΔG = ΔG°' + RT ln([P]/[R]): se il prodotto è basso il termine logaritmico è negativo e può superare il ΔG°'. È il caso dell'aldolasi nella glicolisi.","note":null,"fixed":false},{"id":"m1t-07","topic":"m1-termodinamica","level":"l","page":"11","src":"Biochimica II","q":"Nella formula ΔG°' = −RT ln Keq, che cosa indica l'apice (')?","opts":["Che il valore è riferito a pH 7","Che il valore è a 37 °C","Che è la seconda misura fatta","Che è espresso in kcal/mol","Che il valore è misurato in vivo"],"ans":0,"why":"L'apice distingue lo standard biochimico (pH 7) da quello chimico (attività dell'H⁺ = 1, pH 0).","note":"La distinzione tra ΔG° e ΔG°' non è esplicitata nella sbobina.","fixed":false},{"id":"m1a-01","topic":"m1-atp","level":"f","page":"13","src":"Biochimica II","q":"Quanto vale il ΔG°' di idrolisi dell'ATP ad ADP + Pi?","opts":["−30,5 kJ/mol (−7,3 kcal/mol)","−61 kJ/mol (−14,6 kcal/mol)","+30,5 kJ/mol (+7,3 kcal/mol)","−7,3 kJ/mol (−1,7 kcal/mol)","−45,6 kJ/mol (−10,9 kcal/mol)"],"ans":0,"why":"È il valore di riferimento per i composti ad alta energia.","note":"Sbobina di Biochimica II, p. 13: subito dopo il valore di −30 kJ/mol c'è scritto che il ΔG di idrolisi dell'ATP «è ampiamente positivo». È negativo: l'idrolisi è favorita.","fixed":false},{"id":"m1a-02","topic":"m1-atp","level":"f","page":"13","src":"Biochimica II","q":"Che legame unisce il fosfato α al ribosio nell'ATP?","opts":["Fosfoanidridico","Fosfoestere","N-glicosidico","Tioestere","Glicosidico"],"ans":1,"why":"Ribosio (OH in 5') + fosfato = fosfoestere. Tra α-β e β-γ ci sono legami fosfoanidridici.","note":null,"fixed":false},{"id":"m1a-03","topic":"m1-atp","level":"f","page":"19","src":"Biochimica II","q":"Quale di questi composti ha un potenziale di trasferimento del fosfato maggiore dell'ATP?","opts":["Fosfoenolpiruvato","Glucosio 6-fosfato","Glicerolo 3-fosfato","Fruttosio 6-fosfato","Glucosio 1-fosfato"],"ans":0,"why":"PEP, 1,3-bisfosfoglicerato e fosfocreatina superano l'ATP e possono cedergli il fosfato.","note":null,"fixed":false},{"id":"m1a-04","topic":"m1-atp","level":"m","page":"14","src":"Biochimica II","q":"Perché l'idrolisi dei legami fosfoanidridici dell'ATP libera molta energia?","opts":["I prodotti sono più stabilizzati (risonanza, solvatazione) e cala la repulsione tra cariche","Il legame P–O è molto più debole dei legami C–C, e la sua rottura libera l'energia di legame accumulata","Si forma una molecola d'acqua, e la sua formazione libera molta energia","Il magnesio legato all'ATP viene liberato e rilascia la sua energia di legame (Mg–O)","L'adenina cambia conformazione e cede la sua energia al gruppo fosfato terminale"],"ans":0,"why":"Repulsione elettrostatica nel reagente e maggiore stabilizzazione per risonanza e solvatazione dei prodotti.","note":null,"fixed":false},{"id":"m1a-05","topic":"m1-atp","level":"m","page":"14","src":"Biochimica II","q":"La scissione ATP → AMP + PPi seguita dall'idrolisi del pirofosfato libera in tutto circa:","opts":["−30 kJ/mol","−45 kJ/mol","−60 kJ/mol","−90 kJ/mol","−15 kJ/mol"],"ans":2,"why":"Due legami fosfoanidridici scissi: circa −30 + −30. L'idrolisi del PPi rende irreversibili molte biosintesi.","note":null,"fixed":false},{"id":"m1a-06","topic":"m1-atp","level":"m","page":"15","src":"Biochimica II","q":"Qual è la forma dell'ATP che partecipa alle reazioni enzimatiche?","opts":["ATP libero","Mg-ATP","Ca-ATP","ATP protonato","K-ATP"],"ans":1,"why":"Il Mg²⁺ si lega ai fosfati, riduce la repulsione tra le cariche ed è la forma riconosciuta dagli enzimi ATP-dipendenti.","note":null,"fixed":false},{"id":"m1a-07","topic":"m1-atp","level":"m","page":"20","src":"Biochimica II","q":"Che cosa fa la creatina chinasi all'inizio di uno sforzo muscolare?","opts":["Trasferisce il fosfato della fosfocreatina all'ADP, formando ATP","Trasferisce il fosfato dell'ATP alla creatina, formando fosfocreatina","Idrolizza la fosfocreatina liberando fosfato inorganico e calore","Converte la creatina in creatinina, che viene eliminata con le urine","Trasferisce il fosfato dell'ADP all'AMP, formando due ATP"],"ans":0,"why":"La fosfocreatina (ΔG°' ≈ −43 kJ/mol) rigenera ATP dall'ADP: è la prima riserva di energia del muscolo. La reazione è reversibile e dipende dalle concentrazioni.","note":"Sbobina di Biochimica II, p. 20: c'è scritto che la creatina fosfato è in grado di «fosforilare l'ATP per riformare ADP». È il contrario: fosforila l'ADP e riforma ATP.","fixed":false},{"id":"m1a-08","topic":"m1-atp","level":"a","page":"14–16","src":"Biochimica II","q":"Nel muscolo, dopo un digiuno prolungato, una rialimentazione ricca di carboidrati può causare:","opts":["Ipofosfatemia, perché il fosfato entra nelle cellule per fosforilare gli zuccheri","Iperfosfatemia, perché l'eccesso di ATP prodotto libera fosfato inorganico nel sangue","Ipoglicemia grave, perché l'insulina blocca subito la glicogenolisi nel fegato","Acidosi lattica immediata, perché il muscolo fermenta tutto il glucosio che riceve","Ipercalcemia, perché il fosfato in eccesso mobilizza il calcio dalle ossa verso il sangue"],"ans":0,"why":"È la sindrome da rialimentazione: il fosfato plasmatico crolla perché finisce negli zuccheri fosforilati e nell'ATP, con rischio soprattutto per il cuore.","note":null,"fixed":false},{"id":"m1a-09","topic":"m1-atp","level":"a","page":"16–17","src":"Biochimica II","q":"Se la carica energetica di una cellula scende da 0,9 a 0,6:","opts":["Accelerano le vie che generano ATP e rallentano quelle che lo consumano","Accelerano le vie che consumano ATP, per riportare la carica a 0,9","Catabolismo e anabolismo restano invariati, perché non dipendono dall'ATP","La cellula accelera la sintesi di glicogeno per immagazzinare energia","Rallentano sia le vie cataboliche sia quelle anaboliche"],"ans":0,"why":"Sotto 0,9 prevalgono le vie cataboliche; sopra prevalgono quelle anaboliche.","note":null,"fixed":false},{"id":"m1a-10","topic":"m1-atp","level":"a","page":"17–18","src":"Biochimica II","q":"Durante la sintesi proteica dopo un pasto, perché la nucleotide difosfato chinasi produce GTP solo quando serve?","opts":["Ha ΔG°' ≈ 0: è il consumo di GTP a spostare l'equilibrio verso la sua formazione","È regolata dall'insulina, che la attiva dopo il pasto tramite fosforilazione","È inibita dall'ATP alto, quindi lavora solo quando la carica energetica scarseggia","È un enzima allosterico attivato dal GDP che si accumula durante la traduzione","La sua sintesi viene indotta solo quando i ribosomi in attività richiedono GTP"],"ans":0,"why":"È un'azione di massa: più GTP viene consumato, più la reazione ATP + GDP ⇌ ADP + GTP va verso destra.","note":null,"fixed":false},{"id":"m1a-11","topic":"m1-atp","level":"l","page":"17","src":"Biochimica II","q":"Quale nucleotide trifosfato si usa soprattutto per la biosintesi dei lipidi complessi (fosfolipidi)?","opts":["UTP","GTP","CTP","TTP","ATP"],"ans":2,"why":"UTP per i carboidrati (UDP-glucosio), GTP per le proteine, CTP per i lipidi (CDP-diacilglicerolo, CDP-colina).","note":null,"fixed":false},{"id":"m1a-12","topic":"m1-atp","level":"l","page":"13","src":"Biochimica II","q":"Nell'ATP, l'adenina è legata al ribosio. Come si chiama correttamente la molecola adenina + ribosio?","opts":["Adenosina","Adenina","Adenilato","Desossiadenosina","Adenosina monofosfato"],"ans":0,"why":"Adenina è la base, adenosina il nucleoside (base + ribosio), adenilato (AMP) il nucleotide.","note":"Sbobina di Biochimica II, p. 13: c'è scritto «la base azotata adenosina». La base è l'adenina; l'adenosina è il nucleoside.","fixed":false},{"id":"m1a-13","topic":"m1-atp","level":"l","page":"20","src":"Biochimica II","q":"Qual è l'isoenzima della creatina chinasi usato come marker precoce di infarto?","opts":["CK-MM","CK-BB","CK-MB","CK-MiMi","Troponina-CK"],"ans":2,"why":"CK-MB è l'isoenzima cardiaco; CK-MM è muscolare scheletrico, CK-BB cerebrale.","note":null,"fixed":false},{"id":"m1a-14","topic":"m1-atp","level":"l","page":"15","src":"Biochimica II","q":"Quale concentrazione plasmatica di fosfato è nel range normale nell'adulto?","opts":["Circa 3–4,5 mg/dl","Circa 30–45 mg/dl","Circa 0,3–0,5 mg/dl","Circa 100 mg/dl","Circa 10–12 mg/dl"],"ans":0,"why":"La fosfatemia normale nell'adulto è circa 2,5–4,5 mg/dl.","note":"Sbobina di Biochimica II, p. 15: indica una fosfatemia di «30 mg/decilitro». Il valore normale è circa 3–4,5 mg/dl. Il range non è nella sbobina: viene dai testi di riferimento.","fixed":false},{"id":"m1o-01","topic":"m1-coenzimi","level":"f","page":"23","src":"Biochimica II","q":"L'ossidazione di un alcol secondario produce:","opts":["Un'aldeide","Un chetone","Un acido carbossilico","Un estere","Un etere"],"ans":1,"why":"Alcol primario → aldeide → acido; alcol secondario → chetone.","note":null,"fixed":false},{"id":"m1o-02","topic":"m1-coenzimi","level":"f","page":"21","src":"Biochimica II","q":"Da quali vitamine derivano NAD e FAD?","opts":["Niacina e riboflavina","Tiamina e piridossina","Biotina e acido folico","Cobalamina e acido pantotenico","Retinolo e calciferolo"],"ans":0,"why":"NAD da niacina (B3), FAD da riboflavina (B2).","note":null,"fixed":false},{"id":"m1o-03","topic":"m1-coenzimi","level":"m","page":"23","src":"Biochimica II","q":"Che cosa riceve il NAD⁺ quando si riduce?","opts":["Uno ione idruro (H⁻), cioè due elettroni","Due atomi di idrogeno, cioè due protoni e due elettroni","Un protone dal substrato ossidato","Un elettrone singolo, come i citocromi","Un atomo di ossigeno dall'acqua"],"ans":0,"why":"Il NAD⁺ accetta un idruro; il secondo protone va in soluzione (NADH + H⁺). Il FAD invece accetta due atomi di idrogeno.","note":null,"fixed":false},{"id":"m1o-04","topic":"m1-coenzimi","level":"m","page":"23","src":"Biochimica II","q":"Il passaggio succinato → fumarato:","opts":["È un'ossidazione FAD-dipendente che crea un doppio legame C=C","È un'idratazione che aggiunge acqua al doppio legame","È un'ossidazione NAD-dipendente che forma un gruppo carbonilico","Non è una reazione redox, ma un'isomerizzazione cis-trans","È una decarbossilazione ossidativa che libera CO₂"],"ans":0,"why":"Da due carboni saturi a un doppio legame si perdono 2 elettroni: il FAD è l'accettore adatto.","note":null,"fixed":false},{"id":"m1o-05","topic":"m1-coenzimi","level":"m","page":"24","src":"Biochimica II","q":"A pH 7,4 un acido carbossilico con pKa ≈ 3,5 si trova:","opts":["Quasi tutto protonato (–COOH)","Metà protonato e metà deprotonato","Quasi tutto deprotonato (–COO⁻)","Come estere","Legato al sodio come sale insolubile"],"ans":2,"why":"Il pH è molto sopra il pKa: per questo nella cellula si dice piruvato, lattato, malato (suffisso -ato).","note":null,"fixed":false},{"id":"m1o-06","topic":"m1-coenzimi","level":"a","page":"22–23","src":"Biochimica II","q":"Ordina dal più ridotto al più ossidato il carbonio in: metano, metanolo, formaldeide, acido formico, CO₂.","opts":["Metano → metanolo → formaldeide → acido formico → CO₂","CO₂ → acido formico → formaldeide → metanolo → metano","Metanolo → metano → formaldeide → CO₂ → acido formico","Formaldeide → metanolo → metano → acido formico → CO₂","Metano → formaldeide → metanolo → CO₂ → acido formico"],"ans":0,"why":"Stati di ossidazione: −4, −2, 0, +2, +4. Ogni passaggio perde 2 elettroni.","note":null,"fixed":true},{"id":"m1o-07","topic":"m1-coenzimi","level":"a","page":"23","src":"Biochimica II","q":"Una reazione redox biochimica si scrive con quattro termini. Quali?","opts":["Donatore ridotto + accettore ossidato → donatore ossidato + accettore ridotto","Donatore ossidato + accettore ridotto → donatore ridotto + accettore ossidato","Substrato + enzima → complesso enzima-substrato → prodotto + enzima","Ossidante + riducente → acqua + energia libera + calore dissipato","Reagente ridotto + ATP → prodotto fosforilato + ADP + Pi"],"ans":0,"why":"Es. malato (donatore ridotto) + NAD⁺ (accettore ossidato) → ossalacetato + NADH + H⁺.","note":null,"fixed":false},{"id":"m1o-08","topic":"m1-coenzimi","level":"a","page":"22–23","src":"Biochimica II","q":"Il passaggio da aldeide a chetone isomerico (es. gliceraldeide 3-P → diidrossiacetone fosfato) è:","opts":["Un'isomerizzazione, senza cambiare lo stato di ossidazione complessivo","Un'ossidazione, perché si forma un carbonile chetonico più ossidato","Una riduzione, perché il C1 perde il gruppo aldeidico e acquista idrogeni","Una decarbossilazione, perché il C1 viene eliminato come CO₂","Una fosforilazione, perché il fosfato passa dal C3 al C1 della molecola"],"ans":0,"why":"Aldeide e chetone isomerici hanno lo stesso numero di elettroni: lo catalizza un'isomerasi, senza NAD.","note":null,"fixed":false},{"id":"m1o-09","topic":"m1-coenzimi","level":"l","page":"24","src":"Biochimica II","q":"Qual è il nome corretto della specie deprotonata dell'acido piruvico?","opts":["Piruvato","Piruvico","Piruvile","Piruvinato","Piruvoile"],"ans":0,"why":"Suffisso -ico per l'acido protonato, -ato per la base coniugata, che è la forma presente a pH fisiologico.","note":null,"fixed":false},{"id":"m1o-10","topic":"m1-coenzimi","level":"l","page":"21","src":"Biochimica II","q":"Quale sigla indica la forma ridotta del flavin adenin dinucleotide?","opts":["FADH₂","FAD","FMNH₂","NADH","FADH⁺"],"ans":0,"why":"Il FAD accetta due atomi di idrogeno (2 e⁻ + 2 H⁺) e diventa FADH₂. L'FMN è il flavin mononucleotide (complesso I).","note":null,"fixed":false},{"id":"m1e-01","topic":"m1-enzimologia","level":"f","page":"27","src":"Biochimica II","q":"Che cosa indica la KM?","opts":["La concentrazione di substrato a cui v = ½ Vmax","La velocità massima raggiunta a substrato saturante","La concentrazione di enzima necessaria per metà reazione","La costante di equilibrio della reazione catalizzata","Il numero di molecole trasformate al secondo da un enzima"],"ans":0,"why":"Più la KM è bassa, maggiore è l'affinità dell'enzima per il substrato.","note":null,"fixed":false},{"id":"m1e-02","topic":"m1-enzimologia","level":"f","page":"28","src":"Biochimica II","q":"Che forma ha la curva v/[S] di un enzima allosterico cooperativo?","opts":["Iperbolica","Sigmoide","Lineare","Esponenziale decrescente","A campana"],"ans":1,"why":"Gli enzimi di Michaelis-Menten danno un'iperbole; gli allosterici una sigmoide, descritta dalla K0,5.","note":null,"fixed":false},{"id":"m1e-03","topic":"m1-enzimologia","level":"f","page":"28","src":"Biochimica II","q":"Nella forma R un enzima allosterico è:","opts":["Inattivo (teso)","Attivo (rilassato)","Denaturato (aperto)","Fosforilato (teso)","Legato all'inibitore"],"ans":1,"why":"R = relaxed, attiva; T = tense, inattiva.","note":null,"fixed":false},{"id":"m1e-04","topic":"m1-enzimologia","level":"m","page":"27","src":"Biochimica II","q":"Due enzimi hanno la stessa Vmax e KM₁ < KM₂. Quale è più affine al substrato?","opts":["L'enzima 1","L'enzima 2","Sono ugualmente affini","Dipende dalla concentrazione dell'enzima","Non si può dire senza la kcat"],"ans":0,"why":"KM più bassa = mezza velocità massima raggiunta a concentrazione di substrato più bassa = maggiore affinità.","note":null,"fixed":false},{"id":"m1e-05","topic":"m1-enzimologia","level":"m","page":"29","src":"Biochimica II","q":"Gli ormoni regolano gli enzimi soprattutto con:","opts":["Modificazioni covalenti come la fosforilazione","Effettori allosterici che entrano nella cellula","Variazioni del pH intracellulare nel citosol","Variazioni locali della temperatura del tessuto","Variazioni della forza ionica del citoplasma"],"ans":0,"why":"La regolazione allosterica è locale (cellula per cellula); gli ormoni agiscono con protein chinasi e fosfatasi.","note":null,"fixed":false},{"id":"m1e-06","topic":"m1-enzimologia","level":"a","page":"27–29","src":"Biochimica II","q":"Un farmaco abbassa la K0,5 di un enzima allosterico senza cambiare la Vmax. Come si comporta?","opts":["Da effettore allosterico positivo","Da effettore allosterico negativo","Da inibitore competitivo reversibile","Da inibitore incompetitivo puro","Da inibitore non competitivo misto"],"ans":0,"why":"La K0,5 più bassa sposta la sigmoide a sinistra: l'enzima lavora meglio a basse concentrazioni di substrato.","note":null,"fixed":false},{"id":"m1e-07","topic":"m1-enzimologia","level":"a","page":"29","src":"Biochimica II","q":"Perché le reazioni vicine all'equilibrio non sono buoni punti di regolazione?","opts":["Il flusso netto dipende dai rapporti tra reagenti e prodotti: cambiare l'enzima non ne sposta il verso","I loro enzimi sono troppo lenti per rispondere ai segnali ormonali e non hanno siti allosterici disponibili","Non usano coenzimi né cofattori, quindi non possono essere modulate da effettori allosterici","Avvengono solo nella matrice mitocondriale, dove i segnali ormonali e gli effettori non arrivano","Hanno tutte ΔG°' fortemente positivo e quindi non procedono senza l'accoppiamento con l'ATP"],"ans":0,"why":"Il controllo del flusso si esercita sulle tappe lontane dall'equilibrio, catalizzate da enzimi allosterici.","note":null,"fixed":false},{"id":"m1e-08","topic":"m1-enzimologia","level":"l","page":"27","src":"Biochimica II","q":"Come si chiama la costante k₂ in Vmax = k₂[E]?","opts":["Costante catalitica (kcat)","Costante di Michaelis (KM)","Costante di dissociazione","Costante di specificità","Costante di Hill (nH)"],"ans":0,"why":"kcat è il numero di molecole di substrato trasformate per sito attivo al secondo. kcat/KM è la costante di specificità.","note":null,"fixed":false},{"id":"m1e-09","topic":"m1-enzimologia","level":"l","page":"42","src":"Biochimica II","q":"Un enzima con kcat/KM vicino a 10⁸–10⁹ M⁻¹ s⁻¹ si dice:","opts":["A perfezione catalitica (limitato dalla diffusione)","Allosterico (con cooperatività positiva tra le subunità)","Saturato (con tutti i siti attivi occupati dal substrato)","Cooperativo (con cinetica sigmoide e coefficiente di Hill > 1)","Ad attività minima (limitato dal rilascio del prodotto)"],"ans":0,"why":"È il caso della trioso fosfato isomerasi: il limite è l'incontro tra enzima e substrato.","note":null,"fixed":false},{"id":"m1e-10","topic":"m1-enzimologia","level":"l","page":"29","src":"Biochimica II","q":"Quali residui hanno l'ossidrile usato dalle serina/treonina chinasi per legare il fosfato?","opts":["Serina e treonina","Tirosina e triptofano","Cisteina e metionina","Aspartato e glutammato","Istidina e lisina"],"ans":0,"why":"Si forma un fosfoestere con l'OH della catena laterale. Esistono anche tirosina chinasi (recettori per l'insulina).","note":null,"fixed":false},{"id":"m2i-01","topic":"m2-ingresso","level":"f","page":"31","src":"Biochimica II","q":"Quale enzima digerisce l'amido nella bocca e nell'intestino?","opts":["α-amilasi","β-amilasi","Lattasi","Glicogeno fosforilasi","Saccarasi"],"ans":0,"why":"L'α-amilasi salivare e pancreatica scinde i legami α1-4; l'uomo non ha enzimi per i legami β della cellulosa.","note":null,"fixed":false},{"id":"m2i-02","topic":"m2-ingresso","level":"f","page":"33","src":"Biochimica II","q":"Quale trasportatore è richiamato sulla membrana dall'insulina?","opts":["GLUT1","GLUT2","GLUT3","GLUT4","SGLT1"],"ans":3,"why":"Muscolo scheletrico, cuore e tessuto adiposo: i GLUT4 stanno in vescicole e l'insulina ne fa fondere le vescicole con la membrana.","note":null,"fixed":false},{"id":"m2i-03","topic":"m2-ingresso","level":"f","page":"33","src":"Biochimica II","q":"Quanti segmenti transmembrana hanno i trasportatori GLUT?","opts":["12","7","14","24","10"],"ans":0,"why":"Struttura comune a 12 eliche transmembrana, con due conformazioni (T1 verso l'esterno, T2 verso l'interno).","note":null,"fixed":false},{"id":"m2i-04","topic":"m2-ingresso","level":"m","page":"32","src":"Biochimica II","q":"Come entra il glucosio dal lume intestinale nell'enterocita?","opts":["In simporto con Na⁺ tramite SGLT1, grazie al gradiente della pompa Na⁺/K⁺","Per diffusione facilitata con GLUT2 sulla membrana apicale dell'enterocita","Per endocitosi mediata da recettore, insieme ai frammenti di amido","Con un'ATPasi specifica per il glucosio, che lo pompa contro gradiente","In antiporto con K⁺ tramite GLUT5, sfruttando il potenziale di membrana"],"ans":0,"why":"È un trasporto attivo secondario: l'SGLT1 non consuma ATP, lo consuma la Na⁺/K⁺-ATPasi.","note":"Sbobina di Biochimica II, p. 32: chiama il trasportatore «SGLUT1» e lo descrive prima come «trasportatore attivo che utilizza ATP». Il nome corretto è SGLT1 ed è attivo secondario.","fixed":false},{"id":"m2i-05","topic":"m2-ingresso","level":"m","page":"34","src":"Biochimica II","q":"Perché il cervello riceve glucosio anche a glicemia bassa?","opts":["GLUT1 (barriera ematoencefalica) e GLUT3 (neuroni) hanno Kt molto basse","Il cervello usa GLUT2, ad alta capacità, e quindi il trasporto non dipende dalla glicemia","È insulino-dipendente e riceve glucosio grazie al GLUT4 dei neuroni","Usa SGLT1 (neuroni) e SGLT2 (barriera), che concentrano il glucosio","Il glucosio attraversa la barriera per semplice diffusione"],"ans":0,"why":"GLUT3 ha Kt ≈ 0,1 mM: lavora vicino alla saturazione anche con poco glucosio.","note":null,"fixed":false},{"id":"m2i-06","topic":"m2-ingresso","level":"m","page":"34","src":"Biochimica II","q":"Che cosa innesca la secrezione di insulina nella cellula β?","opts":["L'aumento di ATP, che chiude i canali K⁺, depolarizza e fa entrare Ca²⁺","L'apertura dei canali K⁺, che iperpolarizza la cellula e libera i granuli","Il legame del glucosio a un recettore di membrana accoppiato a proteina G","L'aumento di AMP ciclico prodotto in risposta al glucagone","Il calo di ATP, che apre i canali Ca²⁺ della membrana"],"ans":0,"why":"Glucosio → GLUT2 → glucochinasi → glicolisi e fosforilazione ossidativa → ATP ↑ → canali K⁺ chiusi → Ca²⁺ in entrata → esocitosi.","note":null,"fixed":false},{"id":"m2i-07","topic":"m2-ingresso","level":"a","page":"33–34","src":"Biochimica II","q":"Dopo un pasto la glicemia passa da 4,5 a 9 mM. Quale trasportatore aumenta di più il suo flusso?","opts":["GLUT2 (Kt 17 mM)","GLUT1 (Kt 3 mM)","GLUT3 (Kt 0,1 mM)","GLUT4 (Kt 5 mM)","Aumentano tutti nella stessa proporzione"],"ans":0,"why":"Con Kt alta il GLUT2 è lontano dalla saturazione e il flusso cresce quasi in proporzione alla glicemia: per questo fegato e pancreas «sentono» il pasto.","note":null,"fixed":false},{"id":"m2i-08","topic":"m2-ingresso","level":"a","page":"36","src":"Biochimica II","q":"Paziente con iperglicemia e peptide C assente. Che cosa indica?","opts":["Mancata produzione di insulina (deficit delle cellule β)","Insulino-resistenza con produzione normale di insulina","Eccesso di glucagone prodotto dalle cellule α del pancreas","Difetto dei GLUT2 epatici con secrezione insulinica normale","Eccesso di cortisolo da iperplasia della corticale del surrene"],"ans":0,"why":"Il peptide C si libera dal taglio della proinsulina: se manca, l'insulina non viene prodotta. Se è normale con iperglicemia, il problema è la resistenza (GLUT4).","note":null,"fixed":false},{"id":"m2i-09","topic":"m2-ingresso","level":"l","page":"31","src":"Biochimica II","q":"Quale enzima dell'orletto a spazzola scinde i frammenti di amido con legami α1-6 (destrine limite)?","opts":["Isomaltasi","Saccarasi","Lattasi","Maltasi acida","Glucoamilasi lisosomiale"],"ans":0,"why":"L'isomaltasi (α-destrinasi) completa la digestione dell'amilopectina; saccarasi e lattasi agiscono su saccarosio e lattosio.","note":null,"fixed":false},{"id":"m2i-10","topic":"m2-ingresso","level":"l","page":"33","src":"Biochimica II","q":"Che cosa indica la Kt di un GLUT?","opts":["La concentrazione di glucosio a cui il trasporto è a metà della velocità massima","Il numero di molecole di glucosio trasportate al secondo da un trasportatore","La costante di equilibrio tra glucosio extracellulare e intracellulare","La concentrazione intracellulare di glucosio a cui il trasporto si ferma del tutto","Il numero di trasportatori presenti per micrometro quadrato di membrana"],"ans":0,"why":"È l'equivalente della KM per un trasportatore: più è bassa, più il trasportatore è affine.","note":null,"fixed":false},{"id":"m2f-01","topic":"m2-fosforilazione","level":"f","page":"37","src":"Biochimica II","q":"Quale enzima fosforila il glucosio negli epatociti?","opts":["Glucochinasi (esochinasi IV)","Esochinasi I (ubiquitaria)","Fosfoglucomutasi (epatica)","Glucosio 6-fosfatasi (microsomiale)","Esochinasi II (muscolare)"],"ans":0,"why":"Fegato e cellule β del pancreas usano la glucochinasi, a bassa affinità.","note":null,"fixed":false},{"id":"m2f-02","topic":"m2-fosforilazione","level":"f","page":"38","src":"Biochimica II","q":"Perché il glucosio fosforilato resta intrappolato nella cellula?","opts":["Il G6P è carico negativamente e non ha trasportatori di membrana","Si lega alle proteine del citosol e non riesce più a diffondere","Viene subito polimerizzato in glicogeno in tutte le cellule del corpo","È più grande del glucosio e non riesce a passare attraverso i GLUT","Viene ossidato subito a CO₂ nel mitocondrio prima di poter uscire"],"ans":0,"why":"Le cariche negative del fosfato impediscono l'uscita attraverso i GLUT.","note":null,"fixed":false},{"id":"m2f-03","topic":"m2-fosforilazione","level":"m","page":"55","src":"Biochimica II","q":"Come viene regolata l'esochinasi ubiquitaria?","opts":["È inibita dal suo prodotto, il glucosio 6-fosfato","È attivata dall'insulina tramite fosforilazione","È inibita allostericamente dall'ATP e dal citrato","È sequestrata nel nucleo da una proteina regolatrice","È attivata dal fruttosio 2,6-bisfosfato"],"ans":0,"why":"Il G6P si lega a un sito allosterico e la inibisce.","note":null,"fixed":false},{"id":"m2f-04","topic":"m2-fosforilazione","level":"m","page":"55–56","src":"Biochimica II","q":"Come viene regolata la glucochinasi epatica?","opts":["È sequestrata nel nucleo da una proteina regolatrice e torna attiva nel citosol","È inibita dal suo prodotto, il glucosio 6-fosfato, come l'esochinasi muscolare","È fosforilata dalla PKA e inattivata nel citosol quando arriva il glucagone","Non è regolata da altri fattori: dipende solo dalla concentrazione di glucosio","È attivata allostericamente dall'AMP quando la carica energetica scarseggia"],"ans":0,"why":"Molto glucosio libera la glucochinasi dalla proteina regolatrice; il fruttosio 6-P la riporta nel nucleo.","note":null,"fixed":false},{"id":"m2f-05","topic":"m2-fosforilazione","level":"m","page":"40","src":"Biochimica II","q":"Perché l'esochinasi chiude il sito attivo quando legano glucosio e ATP (adattamento indotto)?","opts":["Per escludere l'acqua ed evitare l'idrolisi improduttiva dell'ATP","Per aumentare la KM per il glucosio quando la glicemia sale molto","Per legare il Mg²⁺, che può entrare solo quando il sito attivo è chiuso","Per far uscire più in fretta il glucosio 6-fosfato appena formato","Per legare un secondo glucosio nel sito allosterico della subunità"],"ans":0,"why":"Il fosfato γ deve andare sul C6 del glucosio, non all'acqua.","note":null,"fixed":false},{"id":"m2f-06","topic":"m2-fosforilazione","level":"a","page":"37–38","src":"Biochimica II","q":"Perché il fegato usa un enzima con KM alta per il glucosio?","opts":["Per fosforilare il glucosio solo a glicemia alta, lasciandolo prima agli altri organi","Perché così consuma meno ATP per ogni molecola di glucosio fosforilata durante il digiuno","Perché la glucochinasi è più veloce dell'esochinasi a ogni concentrazione","Per inibire la glicolisi epatica durante il pasto e risparmiare glucosio per il sangue","Perché il fegato non ha GLUT e deve trattenere il glucosio appena entrato nella cellula"],"ans":0,"why":"A digiuno la glucochinasi lavora poco e il glucosio resta disponibile per cervello ed eritrociti; dopo il pasto il fegato immagazzina l'eccesso.","note":null,"fixed":false},{"id":"m2f-07","topic":"m2-fosforilazione","level":"a","page":"38","src":"Biochimica II","q":"Il glucosio 6-fosfato è un crocevia. Quale via non parte da lui?","opts":["Glicolisi","Via dei pentoso fosfati","Sintesi del glicogeno","β-ossidazione","Sintesi dell'UDP-glucosio"],"ans":3,"why":"Il G6P va in glicolisi, pentoso fosfati, glicogeno o (nel fegato) torna glucosio.","note":null,"fixed":false},{"id":"m2f-08","topic":"m2-fosforilazione","level":"l","page":"37","src":"Biochimica II","q":"Come si chiama anche la glucochinasi?","opts":["Esochinasi IV","Esochinasi II","Fruttochinasi","Fosfoesoso chinasi","Esochinasi I"],"ans":0,"why":"È l'isoenzima IV della famiglia delle esochinasi.","note":null,"fixed":false},{"id":"m2f-09","topic":"m2-fosforilazione","level":"l","page":"37","src":"Biochimica II","q":"Quanto vale circa la KM dell'esochinasi per il glucosio secondo la sbobina?","opts":["0,1 mM","10 mM","1,0 mM","0,5 mM","0,01 mM"],"ans":0,"why":"Esochinasi ≈ 0,1 mM, glucochinasi ≈ 10 mM: circa 100 volte di differenza.","note":null,"fixed":false},{"id":"m2g-01","topic":"m2-glicolisi","level":"f","page":"38","src":"Biochimica II","q":"Dove avviene la glicolisi?","opts":["Nel citosol","Nella matrice mitocondriale","Nel reticolo endoplasmatico","Nel nucleo","Nei perossisomi"],"ans":0,"why":"È una via citosolica e non richiede ossigeno.","note":null,"fixed":false},{"id":"m2g-02","topic":"m2-glicolisi","level":"f","page":"47","src":"Biochimica II","q":"Bilancio netto della glicolisi per una molecola di glucosio:","opts":["2 piruvato, 2 ATP, 2 NADH","2 piruvato, 4 ATP, 2 NADH","2 lattato, 2 ATP, 0 NADH","2 acetil-CoA, 2 ATP, 2 NADH","2 piruvato, 2 ATP, 2 FADH₂"],"ans":0,"why":"4 ATP prodotti − 2 spesi = 2 netti; 2 NADH dalla gliceraldeide 3-P deidrogenasi.","note":null,"fixed":false},{"id":"m2g-03","topic":"m2-glicolisi","level":"f","page":"39","src":"Biochimica II","q":"Quale enzima scinde il fruttosio 1,6-bisfosfato in due triosi?","opts":["Aldolasi","Trioso fosfato isomerasi","Enolasi","Fosfofruttochinasi 1","Fosfoglicerato mutasi"],"ans":0,"why":"Si formano diidrossiacetone fosfato e gliceraldeide 3-fosfato.","note":null,"fixed":false},{"id":"m2g-04","topic":"m2-glicolisi","level":"f","page":"44","src":"Biochimica II","q":"Quante reazioni di fosforilazione a livello del substrato ci sono nella glicolisi?","opts":["Una","Due","Tre","Quattro","Nessuna"],"ans":1,"why":"Fosfoglicerato chinasi e piruvato chinasi.","note":null,"fixed":false},{"id":"m2g-05","topic":"m2-glicolisi","level":"m","page":"41","src":"Biochimica II","q":"Perché la reazione dell'aldolasi procede verso destra pur avendo ΔG°' positivo?","opts":["I triosi vengono consumati subito e il ΔG reale diventa vicino a zero","È accoppiata all'idrolisi di ATP, che rende negativo il ΔG complessivo","È irreversibile, quindi procede verso destra in qualsiasi condizione","È attivata dall'AMP, che sposta l'equilibrio verso la formazione dei triosi","Il FBP è un composto ad alta energia che si scinde spontaneamente"],"ans":0,"why":"Per legge di azione di massa: nelle concentrazioni cellulari il ΔG è circa −0,2 kJ/mol.","note":null,"fixed":false},{"id":"m2g-06","topic":"m2-glicolisi","level":"m","page":"43","src":"Biochimica II","q":"Che cosa succede nella reazione della gliceraldeide 3-fosfato deidrogenasi?","opts":["L'aldeide viene ossidata e il Pi forma un'anidride mista ad alta energia","Viene consumato ATP per fosforilare il C1 della gliceraldeide, formando un fosfoestere","Il C1 viene eliminato come CO₂, con riduzione contemporanea del NAD⁺","Viene ridotto il FAD legato all'enzima e si forma un doppio legame C=C","Il fosfato passa dal C3 al C2 tramite un'istidina fosforilata"],"ans":0,"why":"È l'unica ossidoriduzione della glicolisi: si forma 1,3-BPG e NADH.","note":null,"fixed":false},{"id":"m2g-07","topic":"m2-glicolisi","level":"m","page":"45","src":"Biochimica II","q":"Perché la piruvato chinasi è così esoergonica?","opts":["La forma enolica del piruvato tautomerizza subito nella forma chetonica, più stabile","Consuma due molecole di ATP e accoppia la loro idrolisi alla formazione del piruvato","Libera CO₂, che esce subito dalla cellula e sposta l'equilibrio verso il piruvato","Il piruvato viene subito ridotto a lattato dalla LDH, che lo sottrae all'equilibrio","Il PEP è stabilizzato dalla risonanza del fosfato, che rende la sua idrolisi molto lenta"],"ans":0,"why":"L'idrolisi del PEP (−62 kJ/mol) basta a formare ATP (+30) con ΔG°' complessivo di circa −32 kJ/mol.","note":null,"fixed":false},{"id":"m2g-08","topic":"m2-glicolisi","level":"m","page":"47","src":"Biochimica II","q":"La glicolisi è un processo:","opts":["Acidificante, perché produce 2 H⁺","Alcalinizzante, perché consuma 2 H⁺","Neutro, perché non libera né consuma H⁺","Acidificante, perché produce 2 CO₂","Alcalinizzante, perché produce 2 OH⁻"],"ans":0,"why":"Glucosio + 2 NAD⁺ + 2 ADP + 2 Pi → 2 piruvato + 2 NADH + 2 H⁺ + 2 ATP + 2 H₂O.","note":null,"fixed":false},{"id":"m2g-09","topic":"m2-glicolisi","level":"a","page":"43","src":"Biochimica II","q":"Lo iodoacetato blocca la glicolisi. Su quale enzima agisce e come?","opts":["Gliceraldeide 3-P deidrogenasi, alchilando la cisteina del sito attivo","Piruvato chinasi, competendo con il fosfoenolpiruvato nel sito attivo","Aldolasi, legando il fruttosio 1,6-bisfosfato in modo irreversibile","Esochinasi, sostituendo l'ATP nel sito di legame del nucleotide","Enolasi, sottraendo il Mg²⁺ necessario alla catalisi"],"ans":0,"why":"Il gruppo SH della cisteina catalitica viene legato covalentemente e l'enzima perde l'attività.","note":null,"fixed":false},{"id":"m2g-10","topic":"m2-glicolisi","level":"a","page":"47","src":"Biochimica II","q":"Se in una soluzione con tutti gli enzimi glicolitici manca il NAD⁺, dove si ferma la via?","opts":["Alla gliceraldeide 3-fosfato","Al fruttosio 1,6-bisfosfato","Al fosfoenolpiruvato (PEP)","All'1,3-bisfosfoglicerato","Non si ferma: arriva a lattato"],"ans":0,"why":"La gliceraldeide 3-P deidrogenasi richiede NAD⁺: per questo il NADH va sempre riossidato (fermentazione o navette).","note":null,"fixed":false},{"id":"m2g-11","topic":"m2-glicolisi","level":"a","page":"47","src":"Biochimica II","q":"Delle reazioni della glicolisi, quale ha ΔG°' negativo ma ΔG reale vicino a zero nella cellula?","opts":["Fosfoglicerato chinasi","Piruvato chinasi","Fosfofruttochinasi 1","Esochinasi","Gliceraldeide 3-P deidrogenasi"],"ans":0,"why":"Con le concentrazioni reali la fosfoglicerato chinasi è all'equilibrio, per questo non è un punto di regolazione.","note":null,"fixed":false},{"id":"m2g-12","topic":"m2-glicolisi","level":"a","page":"45","src":"Biochimica II","q":"Come funziona la fosfoglicerato mutasi?","opts":["Un'istidina fosforilata cede il fosfato al C2 (intermedio 2,3-BPG), poi riprende quello in C3","Sposta direttamente il fosfato dal C3 al C2, senza intermedi e senza residui fosforilati","Usa ATP per fosforilare il C2, poi una fosfatasi separata rimuove il fosfato in C3","Idrolizza il fosfato in C3 e lo riattacca al C2 sfruttando l'energia del NADH","Una serina fosforilata cede il fosfato al C1, formando 1,3-bisfosfoglicerato come prodotto"],"ans":0,"why":"L'enzima va attivato con il 2,3-bisfosfoglicerato, che lo fosforila.","note":null,"fixed":false},{"id":"m2g-13","topic":"m2-glicolisi","level":"l","page":"40","src":"Biochimica II","q":"Nella glicolisi, come si chiama l'enzima che converte il glucosio 6-fosfato in fruttosio 6-fosfato?","opts":["Fosfoesoso isomerasi (fosfoglucosio isomerasi)","Fosfoglucomutasi (glucosio 6-fosfato mutasi)","Fosfomannosio isomerasi (mannosio isomerasi)","Glucosio 6-fosfato deidrogenasi (G6PDH)","Fosfofruttochinasi 1 (fosfoesoso chinasi)"],"ans":0,"why":"Aldoso → chetoso. Non va confusa con la fosfoglucomutasi (G1P ⇌ G6P).","note":null,"fixed":false},{"id":"m2g-14","topic":"m2-glicolisi","level":"l","page":"39","src":"Biochimica II","q":"Nell'aldolasi, quali carboni del fruttosio 1,6-bisfosfato diventano il diidrossiacetone fosfato?","opts":["C1–C3","C4–C6","C2–C4","C1, C2, C6","C3–C5"],"ans":0,"why":"La scissione è tra C3 e C4: C1–C3 → DHAP, C4–C6 → gliceraldeide 3-P.","note":null,"fixed":false},{"id":"m2g-15","topic":"m2-glicolisi","level":"l","page":"40","src":"Biochimica II","q":"Il prodotto della gliceraldeide 3-P deidrogenasi si chiama:","opts":["1,3-bisfosfoglicerato","2,3-bisfosfoglicerato","3-fosfoglicerato (3PG)","Glicerolo 3-fosfato","Fosfoenolpiruvato (PEP)"],"ans":0,"why":"Il fosfato aggiunto è in C1 (anidride mista), quello in C3 era già presente.","note":null,"fixed":false},{"id":"m2g-16","topic":"m2-glicolisi","level":"l","page":"41","src":"Biochimica II","q":"Nella glicolisi la reazione della PFK1 forma quale legame?","opts":["Fosfoestere sul C1 del fruttosio 6-P","Fosfoanidridico tra il C1 e il fosfato β dell'ATP","Fosfoestere sul C6 del fruttosio 1-P","Glicosidico tra il C1 e il C2 del fruttosio","Fosfoanidridico sul C1 del fruttosio 6-P"],"ans":0,"why":"Il fosfato γ dell'ATP esterifica l'OH del C1.","note":null,"fixed":false},{"id":"m2r-01","topic":"m2-fermentazioni","level":"f","page":"49","src":"Biochimica II","q":"Qual è lo scopo della fermentazione lattica?","opts":["Rigenerare NAD⁺ per la glicolisi","Produrre ATP oltre a quello della glicolisi","Eliminare il piruvato in eccesso dalla cellula","Produrre glucosio per gli altri tessuti","Ridurre il FAD per la catena respiratoria"],"ans":0,"why":"Senza NAD⁺ la gliceraldeide 3-P deidrogenasi si ferma; la LDH riossida il NADH riducendo il piruvato.","note":null,"fixed":false},{"id":"m2r-02","topic":"m2-fermentazioni","level":"f","page":"49","src":"Biochimica II","q":"Quali cellule fanno sempre fermentazione lattica?","opts":["Eritrociti","Epatociti periportali","Cardiomiociti","Neuroni corticali","Adipociti"],"ans":0,"why":"Non hanno mitocondri.","note":null,"fixed":false},{"id":"m2r-03","topic":"m2-fermentazioni","level":"m","page":"50","src":"Biochimica II","q":"Quanti isoenzimi della LDH esistono e perché?","opts":["5, dalle combinazioni di subunità H e M nel tetramero","2, una per il cuore (H) e una per il muscolo (M)","4, uno per ciascuna delle subunità del tetramero","3, uno per ciascun tessuto: cuore, muscolo e fegato","6, dalle combinazioni di tre tipi di subunità nel dimero"],"ans":0,"why":"H4, H3M, H2M2, HM3, M4.","note":null,"fixed":false},{"id":"m2r-04","topic":"m2-fermentazioni","level":"m","page":"53","src":"Biochimica II","q":"Nella fermentazione alcolica, quali sono le due tappe?","opts":["Decarbossilazione del piruvato ad acetaldeide, poi sua riduzione a etanolo con NADH","Riduzione del piruvato a lattato, poi decarbossilazione del lattato a etanolo","Ossidazione del piruvato ad acetil-CoA, poi riduzione dell'acetil-CoA a etanolo","Carbossilazione del piruvato a ossalacetato, poi sua riduzione a etanolo con NADH","Riduzione del piruvato ad acetaldeide con NADH, poi decarbossilazione a etanolo"],"ans":0,"why":"La prima è irreversibile (si perde CO₂), la seconda reversibile (alcol deidrogenasi).","note":null,"fixed":false},{"id":"m2r-05","topic":"m2-fermentazioni","level":"a","page":"52","src":"Biochimica II","q":"Secondo la sbobina, perché la riduzione del piruvato a lattato non acidifica la cellula?","opts":["La LDH consuma un H⁺ (NADH + H⁺) e il lattato esce con un H⁺ dal trasportatore MCT","Il lattato è un acido debole che a pH 7 resta quasi tutto in forma protonata","La reazione libera ioni OH⁻ che neutralizzano i protoni prodotti dalla glicolisi","Il lattato viene subito ossidato a CO₂ nel mitocondrio della stessa cellula muscolare","L'anidrasi carbonica tampona tutti i protoni prodotti dalla reazione della LDH"],"ans":0,"why":"L'acidificazione muscolare viene soprattutto dall'idrolisi dell'ATP; il lattato esce con un protone verso il sangue.","note":"Il ruolo del lattato nell'acidosi è dibattuto: alcuni testi (Lehninger) attribuiscono l'acidificazione all'acido lattico. All'esame segui l'impostazione della sbobina.","fixed":false},{"id":"m2r-06","topic":"m2-fermentazioni","level":"a","page":"53","src":"Biochimica II","q":"Perché l'assunzione di molto etanolo può dare ipoglicemia e acidosi lattica?","opts":["L'ossidazione dell'etanolo produce NADH: piruvato → lattato e gluconeogenesi bloccata","L'etanolo inibisce la secrezione di insulina e stimola quella di glucagone dal pancreas","L'acetaldeide blocca la glicolisi epatica inattivando la fosfofruttochinasi 1","L'etanolo consuma tutto il NADH del fegato, bloccando la catena respiratoria mitocondriale","L'etanolo viene trasformato direttamente in lattato dalla LDH, che consuma il glucosio"],"ans":0,"why":"Con rapporto NADH/NAD⁺ alto il fegato non può ossidare il lattato a piruvato.","note":null,"fixed":false},{"id":"m2r-07","topic":"m2-fermentazioni","level":"l","page":"49","src":"Biochimica II","q":"Quale stereoisomero del lattato si forma nell'uomo?","opts":["L-lattato (S)","D-lattato (R)","Una miscela racemica","Meso-lattato","Una miscela di L e D in rapporto 3:1"],"ans":0,"why":"La LDH umana è stereospecifica e forma L-lattato.","note":"Sbobina di Biochimica II, p. 49: c'è scritto che si forma l'isomero «R». L'L-lattato è (S).","fixed":false},{"id":"m2r-08","topic":"m2-fermentazioni","level":"l","page":"53","src":"Biochimica II","q":"Quale metallo contiene l'alcol deidrogenasi?","opts":["Zinco","Ferro","Magnesio","Rame","Manganese"],"ans":0,"why":"È uno dei motivi per cui lo zinco è necessario nella dieta.","note":null,"fixed":false},{"id":"m2r-09","topic":"m2-fermentazioni","level":"l","page":"52","src":"Biochimica II","q":"L'isoenzima LDH1 corrisponde a:","opts":["H4 (cardiaco)","M4 (muscolare)","H2M2 (polmonare)","H3M (ibrido)","M3H (ibrido)"],"ans":0,"why":"LDH1 = H4, LDH5 = M4.","note":null,"fixed":false},{"id":"m2n-01","topic":"m2-navette","level":"f","page":"53","src":"Biochimica II","q":"Perché servono i sistemi navetta?","opts":["La membrana mitocondriale interna è impermeabile al NADH","Il NADH è instabile nel citosol e si degrada in pochi secondi","Servono per portare l'ATP dal citosol dentro la matrice","Servono per portare il piruvato dal citosol nel mitocondrio","La membrana mitocondriale esterna è impermeabile al NAD⁺"],"ans":0,"why":"Si trasferiscono gli elettroni del NADH citosolico, non la molecola.","note":null,"fixed":false},{"id":"m2n-02","topic":"m2-navette","level":"m","page":"54","src":"Biochimica II","q":"Nella navetta del glicerolo fosfato, a chi cede gli elettroni il glicerolo 3-fosfato?","opts":["Al FAD della glicerolo 3-P deidrogenasi mitocondriale","Al NAD⁺ della matrice tramite la malato deidrogenasi","Direttamente all'O₂ del complesso IV, saltando la catena","Al citocromo c nello spazio intermembrana mitocondriale","All'FMN del complesso I sul lato della matrice"],"ans":0,"why":"Poi passano al coenzima Q: si formano circa 1,5 ATP per NADH citosolico.","note":null,"fixed":false},{"id":"m2n-03","topic":"m2-navette","level":"a","page":"54","src":"Biochimica II","q":"Perché con la navetta malato-aspartato si ricava più ATP che con quella del glicerolo fosfato?","opts":["Gli elettroni arrivano al NAD⁺ mitocondriale ed entrano dal complesso I","Trasporta due NADH per ogni giro, uno come malato e uno come aspartato","Non consuma ATP, mentre la navetta del glicerolo fosfato sì","Produce anche GTP nella matrice, oltre a trasferire gli elettroni del NADH","Gli elettroni arrivano al FAD mitocondriale ed entrano dal complesso II"],"ans":0,"why":"NADH mitocondriale ≈ 2,5 ATP contro FADH₂ ≈ 1,5.","note":"La sbobina descrive in dettaglio solo la navetta del glicerolo fosfato.","fixed":false},{"id":"m2n-04","topic":"m2-navette","level":"l","page":"54","src":"Biochimica II","q":"Nella navetta del glicerolo fosfato, l'enzima citosolico usa NADH; quello mitocondriale usa FAD. Come si chiamano?","opts":["Glicerolo 3-fosfato deidrogenasi citosolica e mitocondriale","Glicerolo chinasi citosolica e glicerolo fosfatasi mitocondriale","Malato deidrogenasi citosolica e malato deidrogenasi mitocondriale","Trioso fosfato isomerasi citosolica e aldolasi mitocondriale","Gliceraldeide 3-P deidrogenasi citosolica e mitocondriale"],"ans":0,"why":"Sono due isoenzimi della glicerolo 3-fosfato deidrogenasi.","note":"Sbobina di Biochimica II, p. 54: il glicerolo 3-fosfato è chiamato «3-fosfoglicerolo (3-PG)». Non va confuso con il 3-fosfoglicerato.","fixed":false},{"id":"m2reg-01","topic":"m2-regolazione","level":"f","page":"57","src":"Biochimica II","q":"Qual è il principale punto di regolazione della glicolisi?","opts":["Fosfofruttochinasi 1","Fosfoglicerato chinasi","Trioso fosfato isomerasi","Fosfoglicerato mutasi","Fosfoglucosio isomerasi"],"ans":0,"why":"È il primo passaggio di non ritorno specifico della glicolisi.","note":null,"fixed":false},{"id":"m2reg-02","topic":"m2-regolazione","level":"f","page":"58","src":"Biochimica II","q":"Quali sono gli effettori allosterici positivi della PFK1?","opts":["AMP e fruttosio 2,6-bisfosfato","ATP e citrato ad alta concentrazione","Acetil-CoA e NADH mitocondriale","Glucosio 6-fosfato e insulina","Fosfoenolpiruvato e alanina"],"ans":0,"why":"Negativi: ATP e citrato.","note":null,"fixed":false},{"id":"m2reg-03","topic":"m2-regolazione","level":"m","page":"59","src":"Biochimica II","q":"Perché l'AMP è un segnale così sensibile della carica energetica?","opts":["Con l'adenilato chinasi (2 ADP ⇌ ATP + AMP) un piccolo calo di ATP fa salire molto l'AMP in percentuale","È il più abbondante dei tre nucleotidi adenilici nel citosol, quindi le sue variazioni assolute sono le più grandi","Inibisce direttamente l'ATP sintasi, quindi segnala subito quando la sintesi di ATP rallenta","Viene prodotto dall'adenilato ciclasi in risposta a glucagone e adrenalina durante il digiuno","Si forma solo quando l'ATP cellulare è esaurito del tutto, quindi indica uno stato di emergenza"],"ans":0,"why":"Con ATP 1 mM e AMP 0,02 mM, consumare 0,1 mM di ATP fa salire l'AMP a circa 0,07 mM (+300%).","note":null,"fixed":false},{"id":"m2reg-04","topic":"m2-regolazione","level":"m","page":"60","src":"Biochimica II","q":"Che cosa significa che il fruttosio 1,6-bisfosfato attiva la piruvato chinasi «a feed-forward»?","opts":["Il prodotto di un enzima a monte attiva un enzima a valle, preparando la via al flusso in arrivo","Il prodotto finale della via inibisce il primo enzima, così la via non accumula intermedi inutili","L'enzima è attivato dal suo stesso substrato, con cinetica cooperativa sigmoide","L'enzima viene fosforilato dalla PKA quando arriva il glucagone nel fegato, e si attiva","Un enzima a valle produce un attivatore per l'enzima che sta a monte, accelerando l'ingresso"],"ans":0,"why":"Se la PFK1 è attiva, la piruvato chinasi viene accelerata per smaltire gli intermedi.","note":null,"fixed":false},{"id":"m2reg-05","topic":"m2-regolazione","level":"m","page":"61","src":"Biochimica II","q":"Che effetto ha la fosforilazione della piruvato chinasi epatica indotta dal glucagone?","opts":["La inattiva, così il PEP prodotto dalla gluconeogenesi non torna a piruvato","La attiva, perché il fegato a digiuno ha bisogno di produrre più ATP dal glucosio","Non cambia la sua attività catalitica, ma ne accelera la degradazione nel proteasoma","La sposta nel mitocondrio, dove lavora insieme alla piruvato carbossilasi","La rende sensibile all'insulina, che poi la attiva allostericamente dopo il pasto"],"ans":0,"why":"Evita il ciclo futile PEP → piruvato → OAA → PEP durante la gluconeogenesi.","note":"Sbobina di Biochimica II, p. 61: c'è scritto che la fosforilazione «rallenta la glicolisi e quindi riduce la produzione di glucosio». Al contrario, favorisce la produzione di glucosio (gluconeogenesi) perché evita il ciclo futile.","fixed":false},{"id":"m2reg-06","topic":"m2-regolazione","level":"a","page":"58","src":"Biochimica II","q":"Nella PFK1, che cosa cambia tra forma R e forma T nel sito attivo?","opts":["In R c'è Arg162 positiva che attira il F6P; in T arriva Glu161 negativo che lo respinge","In R c'è una cisteina che lega il F6P; in T una serina che lega l'ATP al suo posto","In T il sito attivo è occupato dall'ATP, mentre in R dall'AMP che sposta l'ATP dal sito","Non cambia nulla nel sito attivo: tra le due forme cambia soltanto la Vmax dell'enzima","In R c'è Glu161 che lega il Mg²⁺ dell'ATP; in T arriva Arg162 che lega il citrato"],"ans":0,"why":"Il cambio di residuo spiega la diversa affinità per il fruttosio 6-fosfato.","note":null,"fixed":false},{"id":"m2reg-07","topic":"m2-regolazione","level":"a","page":"60","src":"Biochimica II","q":"Nel fegato, quale effettore della PFK1 è il più potente e perché?","opts":["Il fruttosio 2,6-bisfosfato, perché agisce a concentrazioni micromolari","L'ATP, perché è il più abbondante e lega sia il sito attivo sia quello allosterico","Il citrato, perché è il più stabile e arriva direttamente dal mitocondrio","L'AMP, perché è anche substrato dell'enzima e ne aumenta la Vmax","Il glucagone, perché lega direttamente l'enzima nel citosol"],"ans":0,"why":"Poi viene l'AMP; ATP e citrato agiscono a concentrazioni più alte.","note":null,"fixed":false},{"id":"m2reg-08","topic":"m2-regolazione","level":"a","page":"56","src":"Biochimica II","q":"Perché la glucochinasi viene riportata nel nucleo quando si accumula fruttosio 6-fosfato?","opts":["Se la glicolisi è ferma a valle è inutile continuare a fosforilare glucosio","Il fruttosio 6-fosfato è tossico e la glucochinasi lo produrrebbe in eccesso","Per favorire la gluconeogenesi a partire dal fruttosio della dieta","Il fruttosio 6-fosfato degrada l'enzima se questo resta libero nel citosol","Per lasciare il glucosio alla sintesi di glicogeno che avviene nel nucleo"],"ans":0,"why":"Il F6P attiva la proteina regolatrice, che sequestra la glucochinasi.","note":null,"fixed":false},{"id":"m2reg-09","topic":"m2-regolazione","level":"l","page":"58","src":"Biochimica II","q":"Quale residuo della PFK1 compare nel sito attivo nella forma R?","opts":["Arginina 162","Glutammato 161","Lisina 162","Istidina 161","Serina 161"],"ans":0,"why":"Arg162 (positiva) in R, Glu161 (negativo) in T.","note":null,"fixed":false},{"id":"m2reg-10","topic":"m2-regolazione","level":"l","page":"59","src":"Biochimica II","q":"L'enzima che interconverte ATP, ADP e AMP si chiama:","opts":["Adenilato chinasi (miochinasi)","Nucleotide difosfato chinasi","AMP deaminasi (adenilato deaminasi)","Adenilato ciclasi (di membrana)","Creatina chinasi (fosfocreatina chinasi)"],"ans":0,"why":"2 ADP ⇌ ATP + AMP. Da non confondere con l'adenilato ciclasi, che forma cAMP.","note":null,"fixed":false},{"id":"m2reg-11","topic":"m2-regolazione","level":"l","page":"60","src":"Biochimica II","q":"Quali sono gli effettori allosterici negativi della piruvato chinasi secondo la sbobina?","opts":["ATP e acetil-CoA","AMP e fruttosio 1,6-BP","Citrato e AMP","ADP e NADH citosolico","Alanina e glucagone"],"ans":0,"why":"Positivi: AMP e fruttosio 1,6-bisfosfato.","note":"Sbobina di Biochimica II, p. 60 e 62: a p. 60 l'acetil-CoA è un effettore negativo, a p. 62 c'è scritto che «l'ADP e l'acetil-CoA la attivano». La versione corretta è quella di p. 60: l'acetil-CoA inibisce.","fixed":false},{"id":"m2p-01","topic":"m2-pasteur","level":"f","page":"62","src":"Biochimica II","q":"Che cos'è l'effetto Pasteur?","opts":["Il calo del consumo di glucosio quando la cellula passa da anaerobiosi ad aerobiosi","L'aumento della glicolisi quando la cellula passa da anaerobiosi ad aerobiosi","La fermentazione alcolica dei lieviti quando l'ossigeno viene a mancare del tutto","L'inibizione della respirazione mitocondriale da parte di un eccesso di glucosio","La glicolisi aerobia delle cellule tumorali anche in presenza di molto ossigeno"],"ans":0,"why":"In aerobiosi la fosforilazione ossidativa produce molto ATP e la glicolisi rallenta.","note":null,"fixed":false},{"id":"m2p-02","topic":"m2-pasteur","level":"m","page":"63","src":"Biochimica II","q":"Su quale enzima agisce soprattutto il citrato nell'effetto Pasteur?","opts":["Fosfofruttochinasi 1","Esochinasi I","Piruvato chinasi","Piruvato deidrogenasi","Fosfoglicerato chinasi"],"ans":0,"why":"Il citrato esce dal mitocondrio quando l'ATP è abbondante e inibisce la PFK1.","note":"Sbobina di Biochimica II, p. 63: la PFK1 è definita «l'enzima che catalizza la prima reazione della glicolisi». È la terza reazione; è però il primo passaggio specifico e irreversibile della via.","fixed":false},{"id":"m2p-03","topic":"m2-pasteur","level":"m","page":"63","src":"Biochimica II","q":"Negli eritrociti, quale metabolita della glicolisi abbassa l'affinità dell'emoglobina per l'O₂?","opts":["2,3-bisfosfoglicerato","1,3-bisfosfoglicerato","Fosfoenolpiruvato","Fruttosio 1,6-bisfosfato","3-fosfoglicerato"],"ans":0,"why":"Deriva dall'1,3-BPG tramite la bisfosfoglicerato mutasi (shunt di Rapoport-Luebering).","note":null,"fixed":false},{"id":"m2p-04","topic":"m2-pasteur","level":"a","page":"63–64","src":"Biochimica II","q":"In un deficit di piruvato chinasi negli eritrociti, la curva di dissociazione dell'emoglobina si sposta:","opts":["A destra, perché si accumulano intermedi a monte e aumenta il 2,3-BPG","A sinistra, perché manca il 2,3-BPG e l'emoglobina lega più saldamente l'ossigeno","Non si sposta, perché l'eritrocita compensa aumentando l'attività dell'esochinasi","A destra, perché aumenta il lattato prodotto dall'eritrocita","A sinistra, perché il pH intracellulare diventa più basico e l'Hb lega meglio l'O₂"],"ans":0,"why":"L'Hb cede più O₂, ma la cellula ha poco ATP: la pompa Na⁺/K⁺ funziona male, l'eritrocita si gonfia e viene eliminato (anemia emolitica).","note":null,"fixed":false},{"id":"m2p-05","topic":"m2-pasteur","level":"a","page":"63","src":"Biochimica II","q":"In un deficit di esochinasi negli eritrociti, la curva di dissociazione dell'emoglobina si sposta:","opts":["A sinistra: c'è poco 2,3-BPG e l'Hb diventa più affine all'O₂","A destra: si accumula 2,3-BPG e l'Hb cede più ossigeno","Non cambia nulla, perché il 2,3-BPG dipende dalla piruvato chinasi","A destra, perché l'eritrocita produce più lattato e acidifica","A sinistra, perché si accumula glucosio libero nell'eritrocita"],"ans":0,"why":"Se la glicolisi non parte si forma poco 1,3-BPG e quindi poco 2,3-BPG.","note":null,"fixed":false},{"id":"m2p-06","topic":"m2-pasteur","level":"a","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Nell'intolleranza ereditaria al fruttosio, perché il fegato va in sofferenza?","opts":["Manca l'aldolasi B: il fruttosio 1-P si accumula, sequestra fosfato e l'ATP crolla","Manca la fruttochinasi: il fruttosio non viene fosforilato e passa nelle urine","Manca il GLUT5 intestinale: il fruttosio fermenta nel colon e dà diarrea e dolore","Il fruttosio 1-P inibisce la glucochinasi e blocca del tutto l'ingresso del glucosio","Manca la fruttosio 1,6-bisfosfatasi: si blocca la sintesi di glicogeno nel fegato"],"ans":0,"why":"La fruttosuria essenziale (deficit di fruttochinasi) è invece benigna.","note":null,"fixed":false},{"id":"m2p-07","topic":"m2-pasteur","level":"a","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Perché un eccesso di fruttosio favorisce la steatosi epatica?","opts":["Nel fegato entra nella glicolisi a valle della PFK1, saltando il principale punto di controllo","Inibisce la β-ossidazione mitocondriale, quindi gli acidi grassi si accumulano come trigliceridi","Non viene fosforilato nel fegato e si accumula come tale negli epatociti, che si rigonfiano","Stimola la secrezione di glucagone, che a sua volta attiva la lipogenesi","Viene trasformato in glicerolo dalla fruttosio reduttasi del fegato e poi esterificato"],"ans":0,"why":"Il flusso non regolato verso piruvato e acetil-CoA alimenta la sintesi di acidi grassi.","note":"Sbobina di Biochimica II, pagine non numerate dopo p. 64: nel paragrafo sugli sciroppi c'è scritto «glucosio» dove si intende fruttosio («sciroppo di glucosio (miscela formata prevalentemente da fruttosio)», «consumo eccessivo di glucosio... tossico»). Il riferimento corretto è allo sciroppo ad alto contenuto di fruttosio.","fixed":false},{"id":"m2p-08","topic":"m2-pasteur","level":"m","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Come entra il galattosio nella glicolisi?","opts":["Galattosio → galattosio 1-P → (scambio con UDP-glucosio) glucosio 1-P → glucosio 6-P","Galattosio → galattosio 6-P → (fosfoesoso isomerasi) fruttosio 6-P → glicolisi","Galattosio → galattosio 1-P → (aldolasi B) diidrossiacetone fosfato + gliceraldeide","Galattosio → glucosio libero per epimerizzazione diretta al C4 → esochinasi","Galattosio → UDP-galattosio → (glicogeno sintasi) glicogeno → glucosio 1-P"],"ans":0,"why":"Galattochinasi, galattosio 1-P uridiltrasferasi, UDP-galattosio 4-epimerasi, fosfoglucomutasi.","note":null,"fixed":false},{"id":"m2p-09","topic":"m2-pasteur","level":"l","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Quale enzima manca nella forma più frequente di galattosemia?","opts":["Galattosio 1-fosfato uridiltrasferasi","Galattochinasi (galattosio chinasi)","UDP-galattosio 4-epimerasi (forma epatica)","Lattasi intestinale (β-galattosidasi)","Aldolasi B (fruttosio 1-P aldolasi)"],"ans":0,"why":"Il galattosio si accumula; nel cristallino viene ridotto a galattitolo e causa cataratta.","note":null,"fixed":false},{"id":"m2p-10","topic":"m2-pasteur","level":"l","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Nel fegato la triosio chinasi fosforila la gliceraldeide a:","opts":["Gliceraldeide 3-fosfato","Gliceraldeide 2-fosfato","Diidrossiacetone fosfato","Glicerolo 3-fosfato","Gliceraldeide 1-fosfato"],"ans":0,"why":"Poi la GA3P prosegue nella glicolisi.","note":"Sbobina di Biochimica II, pagine non numerate dopo p. 64: c'è scritto «gliceraldeide 2-fosfato». Il prodotto è la gliceraldeide 3-fosfato.","fixed":false},{"id":"m2p-11","topic":"m2-pasteur","level":"l","page":"63","src":"Biochimica II","q":"Come si chiama l'enzima eritrocitario che forma il 2,3-BPG?","opts":["Bisfosfoglicerato mutasi","Fosfoglicerato chinasi","Fosfoglicerato mutasi","2,3-BPG sintasi mitocondriale","Bisfosfoglicerato fosfatasi"],"ans":0,"why":"Sposta il fosfato dal C1 al C2 dell'1,3-BPG.","note":"Sbobina di Biochimica II, p. 63: c'è scritto «tramite una mutazione». Si intende tramite una mutasi.","fixed":false},{"id":"m2p-12","topic":"m2-pasteur","level":"l","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Il fruttosio 1-fosfato viene scisso da quale isoenzima dell'aldolasi?","opts":["Aldolasi B","Aldolasi A","Aldolasi C","Fruttosio 1,6-bisfosfatasi","Fruttochinasi"],"ans":0,"why":"L'aldolasi B (fegato) scinde F1P in DHAP e gliceraldeide.","note":null,"fixed":false},{"id":"m2d-01","topic":"m2-pdh","level":"f","page":"65","src":"Biochimica II","q":"Che cosa produce la piruvato deidrogenasi?","opts":["Acetil-CoA, CO₂ e NADH","Ossalacetato e ATP","Lattato, CO₂ e NAD⁺","Acetaldeide, CO₂ e NADH","Acetil-CoA, CO₂ e FADH₂"],"ans":0,"why":"Piruvato + CoA + NAD⁺ → acetil-CoA + CO₂ + NADH.","note":null,"fixed":false},{"id":"m2d-02","topic":"m2-pdh","level":"f","page":"66","src":"Biochimica II","q":"Quanti e quali coenzimi usa il complesso della piruvato deidrogenasi?","opts":["Cinque: TPP, lipoato, CoA, FAD, NAD⁺","Tre: NAD⁺, FAD e coenzima A","Quattro: TPP, biotina, NAD⁺, FAD","Cinque: TPP, biotina, CoA, FMN, NADP⁺","Quattro: TPP, lipoato, NADP⁺, FMN"],"ans":0,"why":"Derivano da tiamina (B1), acido lipoico, pantotenato (B5), riboflavina (B2) e niacina (B3).","note":null,"fixed":false},{"id":"m2d-03","topic":"m2-pdh","level":"f","page":"65","src":"Biochimica II","q":"Dove si trova il complesso della piruvato deidrogenasi?","opts":["Nella matrice mitocondriale","Nel citosol","Nella membrana plasmatica","Nel reticolo endoplasmatico","Nello spazio intermembrana"],"ans":0,"why":"Il piruvato entra nel mitocondrio con un trasportatore specifico, insieme a un protone.","note":null,"fixed":false},{"id":"m2d-04","topic":"m2-pdh","level":"m","page":"71","src":"Biochimica II","q":"Come viene regolata covalentemente la PDH?","opts":["La PDH chinasi la fosforila e la inattiva; la PDH fosfatasi la defosforila e la attiva","La PDH chinasi la fosforila e la attiva; la PDH fosfatasi la defosforila e la inattiva","Non è regolata covalentemente: solo da NADH e acetil-CoA come effettori allosterici","La PKA la fosforila e la attiva quando arriva il glucagone nel fegato","La PDH viene acetilata dall'acetil-CoA in eccesso e così si inattiva"],"ans":0,"why":"La fosforilazione avviene sull'E1 e blocca tutto il complesso.","note":null,"fixed":false},{"id":"m2d-05","topic":"m2-pdh","level":"m","page":"70","src":"Biochimica II","q":"Quali prodotti inibiscono la PDH (inibizione da prodotto)?","opts":["Acetil-CoA e NADH","CO₂ e NAD⁺ ridotto","ATP e AMP ciclico","Piruvato e CoA-SH","Succinil-CoA e NAD⁺"],"ans":0,"why":"L'acetil-CoA inibisce E2, il NADH inibisce E3.","note":null,"fixed":false},{"id":"m2d-06","topic":"m2-pdh","level":"m","page":"66–67","src":"Biochimica II","q":"Quali sono i vantaggi di un complesso multienzimatico?","opts":["Il prodotto passa subito all'enzima successivo e gli intermedi reattivi non si disperdono","Usa meno coenzimi, perché più enzimi condividono lo stesso NAD⁺ legato al complesso","Non ha bisogno di regolazione, perché lavora sempre alla sua velocità massima possibile","Funziona anche senza NAD⁺, perché gli elettroni restano legati al lipoato del complesso","Consuma meno ATP per ogni molecola di substrato trasformata rispetto a enzimi separati"],"ans":0,"why":"Si supera il limite della diffusione e si regola tutto bloccando E1.","note":null,"fixed":false},{"id":"m2d-07","topic":"m2-pdh","level":"a","page":"69","src":"Biochimica II","q":"Perché nell'uomo i grassi non possono diventare zuccheri?","opts":["La reazione della PDH è irreversibile: l'acetil-CoA non può tornare piruvato","Gli acidi grassi non producono acetil-CoA ma solo corpi chetonici","Nell'uomo manca la glucochinasi necessaria a fosforilare il glucosio","L'acetil-CoA inibisce la gluconeogenesi bloccando la piruvato carbossilasi","La β-ossidazione avviene nei perossisomi, lontano dagli enzimi della gluconeogenesi"],"ans":0,"why":"Gli zuccheri possono diventare grassi (via acetil-CoA), non il contrario. Fa eccezione il glicerolo dei trigliceridi.","note":null,"fixed":false},{"id":"m2d-08","topic":"m2-pdh","level":"a","page":"72","src":"Biochimica II","q":"Nel muscolo che si contrae, perché aumenta l'attività della PDH?","opts":["Il Ca²⁺ attiva la PDH fosfatasi, mentre ADP e piruvato inibiscono la chinasi","L'ATP prodotto dalla contrazione attiva allostericamente la PDH e ne aumenta la Vmax","Il NADH che si accumula nella contrazione attiva la PDH fosfatasi","L'insulina fa fosforilare la PDH dalla chinasi e ne aumenta l'attività","Il lattato prodotto dalla contrazione attiva la PDH chinasi e la fosfatasi"],"ans":0,"why":"Il calcio favorisce il legame della fosfatasi al complesso.","note":null,"fixed":false},{"id":"m2d-09","topic":"m2-pdh","level":"a","page":"73","src":"Biochimica II","q":"Un neonato con deficit di E1 della PDH presenterà soprattutto:","opts":["Acidosi lattica e problemi neurologici","Ipoglicemia isolata senza acidosi","Iperammoniemia e vomito ricorrente","Anemia emolitica e ittero neonatale","Epatomegalia da accumulo di glicogeno"],"ans":0,"why":"Il piruvato non viene ossidato: il NADH si riossida solo con la fermentazione lattica; il cervello, che dipende dal glucosio, è il più colpito.","note":null,"fixed":false},{"id":"m2d-10","topic":"m2-pdh","level":"a","page":"73","src":"Biochimica II","q":"In ipossia, come agisce HIF sulla PDH?","opts":["Aumenta la PDH chinasi: la PDH viene fosforilata e inibita","Attiva la PDH fosfatasi: la PDH viene defosforilata e attivata","Aumenta la sintesi della subunità E1 della PDH","Non ha effetti sulla PDH, agisce solo sulla glicolisi","Sposta la PDH dal mitocondrio al citosol"],"ans":0,"why":"Il piruvato viene dirottato verso il lattato: è uno dei meccanismi dell'effetto Warburg.","note":null,"fixed":false},{"id":"m2d-11","topic":"m2-pdh","level":"l","page":"66","src":"Biochimica II","q":"Come si chiama l'enzima E2 della PDH?","opts":["Diidrolipoil transacetilasi","Diidrolipoil deidrogenasi","Piruvato decarbossilasi","Lipoamide sintasi","Diidrolipoil transsuccinilasi"],"ans":0,"why":"E1 piruvato deidrogenasi (decarbossilazione), E2 transacetilasi (trasferimento al CoA), E3 diidrolipoil deidrogenasi (riossida il lipoato con FAD → NAD⁺).","note":"Sbobina di Biochimica II, p. 68: lo scambio dell'acetile tra lipoato e CoA è attribuito all'«E3». Il trasferimento al CoA lo fa l'E2 (transacetilasi); l'E3 riossida il lipoato.","fixed":false},{"id":"m2d-12","topic":"m2-pdh","level":"l","page":"68","src":"Biochimica II","q":"Come si chiama l'intermedio legato alla TPP dopo la decarbossilazione del piruvato?","opts":["Idrossietil-TPP","Acetil-TPP","Carbossietil-TPP","Lattil-TPP","Acetaldeide libera"],"ans":0,"why":"Poi viene ossidato e trasferito all'acido lipoico come acetile (acetil-diidrolipoamide).","note":null,"fixed":false},{"id":"m2d-13","topic":"m2-pdh","level":"l","page":"67","src":"Biochimica II","q":"Il lipoato è legato covalentemente all'E2 tramite:","opts":["Un legame ammidico con una lisina (lipoamide)","Un ponte disolfuro con una cisteina dell'E2 (lipoil-S-S-Cys)","Un legame estere con una serina (lipoil-O-Ser)","Un legame glicosidico con un'asparagina","Un legame tioestere con il CoA dell'E2 (acetil-lipoile)"],"ans":0,"why":"Il lungo braccio lisina-lipoato oscilla tra E1 ed E3.","note":null,"fixed":false},{"id":"m2d-14","topic":"m2-pdh","level":"l","page":"67","src":"Biochimica II","q":"Il carbonio reattivo della tiamina pirofosfato si trova:","opts":["Nell'anello tiazolico, tra N e S","Nell'anello pirimidinico, accanto all'ammina","Nel pirofosfato, sull'ultimo fosfato","Nella catena laterale, tra i due anelli","Nell'anello tiazolico, sullo zolfo"],"ans":0,"why":"Il C2 del tiazolo si deprotona (carbanione/ilide) e attacca il carbonile del piruvato.","note":"Sbobina di Biochimica II, p. 67: c'è scritto «derivata dall'enzima B1». Si intende la vitamina B1 (tiamina).","fixed":false},{"id":"m3k-01","topic":"m3-krebs","level":"f","page":"74","src":"Biochimica II","q":"Dove avviene il ciclo di Krebs?","opts":["Nella matrice mitocondriale","Nel citosol","Nello spazio intermembrana","Nel reticolo endoplasmatico","Nella membrana mitocondriale esterna"],"ans":0,"why":"Tutti gli enzimi sono nella matrice tranne la succinato deidrogenasi, che è nella membrana interna.","note":null,"fixed":false},{"id":"m3k-02","topic":"m3-krebs","level":"f","page":"76","src":"Biochimica II","q":"Quale enzima unisce acetil-CoA e ossalacetato?","opts":["Citrato sintasi","Aconitasi","Isocitrato deidrogenasi","Piruvato carbossilasi","Malato deidrogenasi"],"ans":0,"why":"È una condensazione di Claisen che forma citrato e libera CoA.","note":null,"fixed":false},{"id":"m3k-03","topic":"m3-krebs","level":"f","page":"74","src":"Biochimica II","q":"Che cosa produce un giro del ciclo di Krebs per acetil-CoA?","opts":["3 NADH, 1 FADH₂, 1 GTP, 2 CO₂","2 NADH, 2 FADH₂, 1 ATP, 2 CO₂","4 NADH, 1 GTP, 1 CO₂","3 NADH, 1 FADH₂, 2 ATP","3 NADH, 2 FADH₂, 1 GTP, 1 CO₂"],"ans":0,"why":"NADH da isocitrato DH, α-chetoglutarato DH e malato DH; FADH₂ dalla succinato DH; GTP dalla succinil-CoA sintetasi.","note":null,"fixed":false},{"id":"m3k-04","topic":"m3-krebs","level":"f","page":"83","src":"Biochimica II","q":"Quale enzima del ciclo di Krebs è anche il complesso II della catena respiratoria?","opts":["Succinato deidrogenasi","Malato deidrogenasi","Fumarasi (fumarato idratasi)","Isocitrato deidrogenasi","Aconitasi (aconitato idratasi)"],"ans":0,"why":"È l'unico enzima del ciclo integrato nella membrana mitocondriale interna.","note":null,"fixed":false},{"id":"m3k-05","topic":"m3-krebs","level":"m","page":"79","src":"Biochimica II","q":"Perché la citrato sintasi lega prima l'ossalacetato e poi l'acetil-CoA (meccanismo sequenziale ordinato)?","opts":["L'ossalacetato è presente in quantità minime: l'enzima si assicura che ci sia prima di usare l'acetil-CoA","L'acetil-CoA è più grande e il sito attivo può accoglierlo solo dopo il cambio di forma indotto dall'ATP","L'ossalacetato è il prodotto della reazione e deve uscire dal sito prima che entri l'acetil-CoA","Così l'enzima consuma meno ATP per ogni molecola di citrato prodotta nella matrice mitocondriale","L'acetil-CoA inibisce l'enzima se arriva per primo, quindi deve aspettare il secondo sito"],"ans":0,"why":"L'adattamento indotto evita anche l'idrolisi improduttiva del tioestere dell'acetil-CoA.","note":null,"fixed":false},{"id":"m3k-06","topic":"m3-krebs","level":"m","page":"84","src":"Biochimica II","q":"Quali sono le tre reazioni del ciclo con ΔG fortemente negativo, quindi regolate?","opts":["Citrato sintasi, isocitrato deidrogenasi, α-chetoglutarato deidrogenasi","Aconitasi, fumarasi e malato deidrogenasi, tutte mitocondriali","Succinil-CoA sintetasi, succinato deidrogenasi, fumarasi","Citrato sintasi, aconitasi, succinato deidrogenasi, malato deidrogenasi","Isocitrato deidrogenasi, succinil-CoA sintetasi, malato deidrogenasi"],"ans":0,"why":"Le altre sono vicine all'equilibrio.","note":null,"fixed":false},{"id":"m3k-07","topic":"m3-krebs","level":"m","page":"84–85","src":"Biochimica II","q":"Come viene regolato il ciclo di Krebs?","opts":["NADH e ATP lo rallentano, ADP e Ca²⁺ lo accelerano","Lo regola solo l'insulina, attivando la citrato sintasi","NADH e ATP lo accelerano, ADP e Ca²⁺ lo rallentano","Non è regolato: dipende solo dall'arrivo di acetil-CoA","Lo regola il glucagone tramite fosforilazione della PKA"],"ans":0,"why":"È il controllo «da parte dell'accettore»: se c'è ADP la cellula ha bisogno di ATP.","note":null,"fixed":false},{"id":"m3k-08","topic":"m3-krebs","level":"m","page":"87","src":"Biochimica II","q":"Qual è la reazione anaplerotica più importante?","opts":["Piruvato → ossalacetato (piruvato carbossilasi)","Citrato → isocitrato (aconitasi mitocondriale)","Malato → ossalacetato (malato deidrogenasi)","Acetil-CoA → citrato (citrato sintasi)","Glutammato → α-chetoglutarato (transaminasi)"],"ans":0,"why":"Riempie il ciclo di intermedi; è attivata dall'acetil-CoA.","note":null,"fixed":false},{"id":"m3k-09","topic":"m3-krebs","level":"a","page":"84","src":"Biochimica II","q":"Le due CO₂ che escono in un giro del ciclo provengono dai carboni dell'acetil-CoA appena entrato?","opts":["No: vengono dall'ossalacetato; i carboni dell'acetile escono nei giri successivi","Sì, entrambe vengono dai due carboni dell'acetile appena entrato, ossidati nello stesso giro","Una sì e una no: una viene dall'acetile appena entrato, l'altra dall'ossalacetato","No: vengono dal CoA, che si stacca dall'acetile nella prima reazione","Sì, ma solo se il ciclo lavora alla massima velocità e l'ossalacetato è abbondante"],"ans":0,"why":"Per eliminare completamente i carboni di un acetile servono due giri.","note":"Sbobina di Biochimica II, p. 77: dopo la seconda decarbossilazione c'è scritto che «abbiamo così ossidato l'acetato». A p. 84 la stessa sbobina chiarisce che le CO₂ escono dai carboni dell'ossalacetato.","fixed":false},{"id":"m3k-10","topic":"m3-krebs","level":"a","page":"86","src":"Biochimica II","q":"Perché il beri-beri colpisce soprattutto sistema nervoso e cuore?","opts":["La TPP serve a PDH (cervello, che usa glucosio) e ad α-chetoglutarato DH (cuore, che usa il ciclo di Krebs)","La tiamina serve alla sintesi di acetilcolina nei neuroni e alla contrazione delle fibre del miocardio","La tiamina è un antiossidante e protegge soprattutto i neuroni e le fibre cardiache","Manca il NAD, che serve alla catena respiratoria dei tessuti a più alto consumo di ossigeno","La TPP serve alla glicogeno fosforilasi del cuore e all'aldolasi della glicolisi nei neuroni"],"ans":0,"why":"Senza TPP si bloccano le due decarbossilazioni ossidative.","note":null,"fixed":false},{"id":"m3k-11","topic":"m3-krebs","level":"a","page":"86","src":"Biochimica II","q":"Come agiscono arsenico e mercurio sul metabolismo energetico?","opts":["Legano i gruppi SH del lipoato, bloccando PDH e α-chetoglutarato DH","Inibiscono l'ATP sintasi legando la subunità c dell'F₀ e bloccando la rotazione","Bloccano il complesso IV legando il ferro dell'eme a3 come il cianuro","Ossidano il NADH della matrice a NAD⁺ senza produrre ATP","Legano la TPP della PDH, impedendo la decarbossilazione del piruvato"],"ans":0,"why":"I composti con ditioli possono liberare l'enzima legando l'arsenico.","note":null,"fixed":false},{"id":"m3k-12","topic":"m3-krebs","level":"a","page":"89","src":"Biochimica II","q":"Perché per ossidare completamente gli acidi grassi serve anche il glucosio?","opts":["L'acetil-CoA ha bisogno di ossalacetato, che si forma dal piruvato","Gli acidi grassi si ossidano solo nel citosol, dove serve la glicolisi","La β-ossidazione consuma glucosio per attivare gli acidi grassi","Servono i GLUT per far entrare gli acidi grassi nelle cellule","Il glucosio fornisce il CoA necessario alla β-ossidazione"],"ans":0,"why":"Si dice che i grassi «bruciano al fuoco dei carboidrati».","note":null,"fixed":false},{"id":"m3k-13","topic":"m3-krebs","level":"a","page":"85","src":"Biochimica II","q":"Pellagra: quale coenzima manca e perché in Veneto era endemica?","opts":["NAD (niacina, B3): si mangiava soprattutto mais, la cui niacina non è disponibile senza trattamento alcalino","FAD (riboflavina, B2): l'alimentazione era povera di latte e derivati, unica fonte della vitamina nella dieta","TPP (tiamina, B1): si mangiava soprattutto riso brillato, privato della cuticola ricca di tiamina","CoA (acido pantotenico, B5): la ca
