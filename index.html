108–109","src":"Biochimica II","q":"Quale sequenza di enzimi elimina il superossido fino ad acqua?","opts":["SOD (→ H₂O₂ + O₂), poi catalasi o glutatione perossidasi","Catalasi (→ H₂O₂ + O₂), poi superossido dismutasi (→ H₂O)","Glutatione reduttasi, poi superossido dismutasi","Citocromo c ossidasi (→ H₂O₂), poi catalasi","SOD da sola (→ H₂O), senza bisogno di altri enzimi"],"ans":0,"why":"La SOD produce H₂O₂, che va eliminato da catalasi o glutatione perossidasi.","note":null,"fixed":false},{"id":"h3r-02","topic":"m3-radicali","level":"h","page":"109","src":"Biochimica II","q":"Un soggetto con deficit di glucosio 6-fosfato deidrogenasi assume un farmaco ossidante. Perché i suoi eritrociti vanno in emolisi?","opts":["Senza NADPH il glutatione non si rigenera e i perossidi ossidano la cellula","Senza G6PD l'eritrocita non produce ATP e la pompa Na⁺/K⁺ si ferma del tutto","Senza G6PD la superossido dismutasi non viene sintetizzata","Senza G6PD si accumula lattato che acidifica e lisa la membrana dell'eritrocita","Senza G6PD aumenta il 2,3-BPG e l'emoglobina precipita nei corpi di Heinz"],"ans":0,"why":"La glutatione reduttasi usa NADPH; senza GSH la glutatione perossidasi non elimina i perossidi. L'eritrocita ha solo la via dei pentoso fosfati come fonte di NADPH.","note":null,"fixed":false},{"id":"h3r-03","topic":"m3-radicali","level":"h","page":"109","src":"Biochimica II","q":"Perché la glutatione perossidasi contiene selenocisteina e non cisteina?","opts":["Il selenolato è più reattivo verso i perossidi del tiolato","Il selenio lega l'ossigeno molecolare come il ferro dell'eme","Il selenio è un donatore di NADPH per la reazione","La selenocisteina forma ponti diselenuro più stabili dei ponti disolfuro","Il selenio è un metallo di transizione redox come il ferro"],"ans":0,"why":"Il selenolo è più acido (Se⁻ a pH fisiologico); viene riportato a Se⁻ da due molecole di GSH. Il selenio va assunto con la dieta, ma in eccesso è tossico.","note":null,"fixed":false},{"id":"h3r-04","topic":"m3-radicali","level":"h","page":"109","src":"Biochimica II","q":"Quale associazione tra superossido dismutasi e metallo è corretta?","opts":["Citosolica Cu/Zn; mitocondriale Mn","Citosolica Fe; mitocondriale Se","Citosolica Mn; mitocondriale Cu/Zn","Tutte le SOD contengono un eme","Citosolica Zn; mitocondriale Mg"],"ans":0,"why":"Mutazioni della SOD1 (Cu/Zn) sono associate ad alcune forme di SLA.","note":null,"fixed":false},{"id":"h3r-05","topic":"m3-radicali","level":"h","page":"110","src":"Biochimica II","q":"In quale condizione la catena respiratoria produce più superossido?","opts":["Con poco O₂ o catena molto ridotta: un elettrone passa all'O₂","Con O₂ abbondante e catena completamente ossidata","Quando l'ATP sintasi lavora alla massima velocità e scarica il gradiente","Quando nella matrice c'è molto ADP disponibile per l'ATP sintasi","Solo quando il complesso IV è iperattivo e consuma troppo O₂"],"ans":0,"why":"Gli elettroni restano su trasportatori come il semichinone e vengono ceduti a un O₂ uno alla volta: la riduzione monoelettronica dell'O₂ dà superossido.","note":null,"fixed":false},{"id":"h3r-06","topic":"m3-radicali","level":"h","page":"110–111","src":"Biochimica II","q":"Come riduce l'HIF la produzione di radicali nella cellula ipossica?","opts":["Sposta verso glicolisi e lattato e sostituisce COX4-1 con COX4-2","Aumenta la β-ossidazione e il flusso di elettroni nella catena","Attiva la PDH e riduce la produzione di lattato nel citosol","Inibisce la glicolisi per ridurre il consumo di glucosio","Aumenta la sintesi di ubichinone e di citocromo c nella membrana"],"ans":0,"why":"Più enzimi glicolitici, LDH e PDH chinasi; COX4-2 è più affine all'O₂. Meno flusso di elettroni nel mitocondrio, meno superossido.","note":null,"fixed":false},{"id":"h3r-07","topic":"m3-radicali","level":"h","page":"110","src":"Biochimica II","q":"Secondo lo studio del 2017 citato a lezione, che effetto hanno gli antiossidanti sui tumori già formati?","opts":["Potrebbero favorire le metastasi","Fanno sempre regredire il tumore","Non hanno alcun effetto misurabile","Aumentano lo stress ossidativo nel tumore","Bloccano le metastasi ma non il tumore primario"],"ans":0,"why":"Aiuterebbero le cellule tumorali a sopportare lo stress ossidativo che normalmente le limita. Il prof sottolinea che il risultato è discusso e non confermato.","note":null,"fixed":false},{"id":"h3r-08","topic":"m3-radicali","level":"h","page":"108","src":"Biochimica II","q":"Quali vitamine sono considerate antiossidanti classiche?","opts":["C, E e A/β-carotene","B1, B2, B6 e niacina","K, D e B12","B12 e folato","C, E e K (la K protegge le membrane)"],"ans":0,"why":"La vitamina E protegge le membrane, la C agisce in ambiente acquoso.","note":"Sbobina di Biochimica II, p. 108: tra le antiossidanti è inclusa anche la vitamina K. La K serve alla carbossilazione dei fattori della coagulazione, non è un antiossidante classico.","fixed":false},{"id":"h3m-01","topic":"m3-malattie","level":"h","page":"112","src":"Biochimica II","q":"Una donna con una malattia del DNA mitocondriale (omoplasmia) ha un figlio maschio e una figlia. Che cosa ti aspetti?","opts":["Entrambi la ereditano; solo la figlia la trasmette","Solo la figlia è a rischio, con probabilità del 50%","Solo il figlio maschio, perché l'X è materno","Nessuno dei due, perché il mtDNA si ricombina","Entrambi hanno il 25% di probabilità di ereditarla"],"ans":0,"why":"Lo zigote riceve i mitocondri solo dall'ovocita.","note":"Sbobina di Biochimica II, p. 112: c'è scritto che «le figlie hanno il 50% di probabilità, mentre i figli non sono a rischio». È sbagliato: tutti i figli di una madre omoplasmica ereditano il mtDNA mutato, maschi e femmine; i maschi però non lo trasmettono.","fixed":false},{"id":"h3m-02","topic":"m3-malattie","level":"h","page":"112","src":"Biochimica II","q":"Perché due fratelli con la stessa mutazione del mtDNA possono avere quadri clinici molto diversi?","opts":["Per l'eteroplasmia: la quota di mitocondri mutati varia","Perché uno dei due ha ereditato il mtDNA del padre","Perché la mutazione mitocondriale è recessiva","Perché il loro mtDNA ha istoni diversi","Perché le malattie mitocondriali colpiscono solo i maschi"],"ans":0,"why":"La proporzione di mtDNA mutato varia tra individui e tessuti, e i sintomi compaiono sopra una soglia. Omoplasmia: tutti i mitocondri mutati.","note":null,"fixed":false},{"id":"h3m-03","topic":"m3-malattie","level":"h","page":"111","src":"Biochimica II","q":"Il mtDNA codifica 13 proteine. A quale funzione appartengono?","opts":["Subunità dei complessi della fosforilazione ossidativa","Enzimi del ciclo di Krebs e della piruvato deidrogenasi","Enzimi della β-ossidazione degli acidi grassi","Proteine della membrana esterna (porine, TOM)","DNA polimerasi e fattori di trascrizione mitocondriali"],"ans":0,"why":"Es. le subunità maggiori del complesso IV. Il resto delle proteine mitocondriali è codificato dal DNA nucleare; il mtDNA codifica anche rRNA e tRNA.","note":null,"fixed":false},{"id":"h3m-04","topic":"m3-malattie","level":"h","page":"112–113","src":"Biochimica II","q":"Secondo l'ipotesi presentata a lezione, come può lo stress ossidativo ridurre la secrezione di insulina nel diabete tipo 2?","opts":["Il superossido induce UCP2: meno ATP e meno secrezione di insulina","Il superossido degrada direttamente l'insulina nel sangue","Lo stress ossidativo aumenta l'ATP e blocca l'esocitosi dei granuli di insulina","UCP2 aumenta la sintesi di ATP, che inibisce i canali del Ca²⁺ e l'esocitosi","I radicali bloccano il GLUT4 delle cellule β e riducono l'ingresso del glucosio"],"ans":0,"why":"Con meno ATP i canali K⁺ restano aperti e la cellula β non risponde al glucosio. Insulino-resistenza + disfunzione β = diabete tipo 2.","note":null,"fixed":false},{"id":"h3m-05","topic":"m3-malattie","level":"h","page":"113","src":"Biochimica II","q":"Perché il mtDNA è considerato più vulnerabile del DNA nucleare ai radicali liberi?","opts":["È vicino alla catena respiratoria, senza istoni e con riparazione meno efficiente","È un DNA lineare a singolo filamento, quindi più esposto alle esonucleasi della matrice","Si trova nel citosol, dove la concentrazione di radicali è più alta","È a singolo filamento e non ha un filamento stampo per la riparazione","Non viene mai replicato dopo la nascita, quindi accumula danni nel tempo"],"ans":0,"why":"La catena respiratoria è la sede principale della produzione di superossido. Su questo si basa una delle ipotesi mitocondriali dell'invecchiamento.","note":"Sbobina di Biochimica II, p. 113: c'è scritto che il DNA mitocondriale «non può ripararsi». I mitocondri hanno sistemi di riparazione (es. riparazione per escissione di basi), solo meno completi di quelli nucleari.","fixed":false},{"id":"h3m-06","topic":"m3-malattie","level":"h","page":"112","src":"Biochimica II","q":"In una cellula β con una mutazione mitocondriale che riduce la produzione di ATP, che cosa succede ai canali del potassio e alla secrezione di insulina?","opts":["I canali K-ATP restano aperti e l'insulina non viene secreta","I canali K-ATP si chiudono e la secrezione di insulina aumenta","Si aprono direttamente i canali del Ca²⁺ e la secrezione aumenta","La cellula β secerne glucagone al posto dell'insulina","Non cambia nulla, perché la glicolisi compensa del tutto il deficit"],"ans":0,"why":"Con poco ATP la membrana non si depolarizza e il Ca²⁺ non entra. Esiste un diabete mitocondriale a trasmissione materna (es. m.3243A>G).","note":null,"fixed":false},{"id":"h3m-07","topic":"m3-malattie","level":"h","page":"113–114","src":"Biochimica II","q":"Quale ipotesi sull'invecchiamento viene presentata come più razionale a lezione?","opts":["Il danno progressivo al mtDNA riduce l'efficienza della catena","L'accorciamento progressivo dei telomeri presenti sul DNA mitocondriale","La perdita progressiva del DNA nucleare a ogni divisione","L'aumento eccessivo della sintesi di ATP con l'età","La riduzione dei radicali liberi con l'età"],"ans":0,"why":"Il danno (o un difetto della divisione mitocondriale) è favorito da radicali e infiammazione. Tutte le ipotesi concordano sul ruolo centrale del mitocondrio.","note":null,"fixed":false},{"id":"h3m-08","topic":"m3-malattie","level":"h","page":"111","src":"Biochimica II","q":"Quali tessuti sono più colpiti nelle malattie mitocondriali e perché?","opts":["Sistema nervoso, muscolo e cuore","Pelle, capelli e mucose orali","Eritrociti, piastrine e linfociti","Tessuto adiposo bianco e osso","Tutti i tessuti allo stesso modo"],"ans":0,"why":"Dipendono molto dalla fosforilazione ossidativa. L'eritrocita maturo non ha mitocondri.","note":null,"fixed":false},{"id":"h4d-01","topic":"m4-degradazione","level":"h","page":"116","src":"Biochimica II","q":"Perché la glicogeno fosforilasi usa il Pi invece dell'acqua (fosforolisi invece di idrolisi)?","opts":["Si forma G1P già fosforilato: si risparmia l'ATP dell'esochinasi","L'acqua non può entrare nel sito attivo per motivi sterici","Si forma glucosio libero, che esce più facilmente dalla cellula","La fosforolisi produce direttamente una molecola di ATP","Il Pi stabilizza la forma R dell'enzima e lo rende più veloce"],"ans":0,"why":"Il G1P carico resta nella cellula. Nel muscolo la glicolisi da glicogeno rende 3 ATP netti per unità di glucosio invece di 2.","note":null,"fixed":false},{"id":"h4d-02","topic":"m4-degradazione","level":"h","page":"115–116","src":"Biochimica II","q":"La glicogeno fosforilasi si ferma a 4 residui da una ramificazione. Quale sequenza completa la degradazione del ramo?","opts":["La transferasi sposta 3 residui; l'α-1,6-glucosidasi libera l'ultimo come glucosio","La fosforilasi taglia anche il legame α-1,6 e libera glucosio 1-fosfato dal punto di ramificazione","L'α-1,6-glucosidasi stacca tutti e 4 i residui del ramo come glucosio 1-fosfato","La transferasi idrolizza il legame α-1,6 e la glucosidasi sposta i residui","La glicogenina rimuove il ramo intero e lo trasferisce su una nuova catena in crescita"],"ans":0,"why":"Transferasi e glucosidasi sono due attività dello stesso enzima deramificante. Dal punto di ramificazione esce glucosio libero (circa il 10% dei residui), non G1P.","note":"Sbobina di Biochimica II, pp. 115–116: prima c'è scritto che la fosforilasi si ferma a 4 residui dalla ramificazione, poi che la transferasi interviene «a 3 residui dal glucosio con legame α-1,6». I residui rimasti sono 4: 3 vengono trasferiti, 1 resta legato in α-1,6.","fixed":false},{"id":"h4d-03","topic":"m4-degradazione","level":"h","page":"117","src":"Biochimica II","q":"Perché il muscolo non può cedere glucosio al sangue dopo aver degradato il proprio glicogeno?","opts":["Non ha la glucosio 6-fosfatasi","Non ha la glicogeno fosforilasi","Il suo glicogeno non ha ramificazioni","Non ha trasportatori GLUT in membrana","Non converte il G1P in G6P"],"ans":0,"why":"Il G6P resta nella cellula e va solo in glicolisi: il glicogeno muscolare ha funzione energetica locale, quello epatico mantiene la glicemia.","note":null,"fixed":false},{"id":"h4d-04","topic":"m4-degradazione","level":"h","page":"117","src":"Biochimica II","q":"Dove avviene la reazione della glucosio 6-fosfatasi e quale conseguenza ha un difetto del trasportatore del G6P?","opts":["Nel lume del reticolo; un difetto del trasportatore del G6P dà la glicogenosi Ib","Nel citosol; un difetto del trasportatore del G6P non ha conseguenze","Nel mitocondrio; un difetto del trasportatore del G6P dà la glicogenosi di tipo II (Pompe)","Nel lisosoma; un difetto del trasportatore dà la malattia di Pompe","Sulla membrana plasmatica; un difetto del trasportatore aumenta la glicemia"],"ans":0,"why":"Servono tre trasportatori: G6P (dentro), Pi e glucosio (fuori). Il difetto del trasportatore T1 dà lo stesso quadro del deficit enzimatico.","note":null,"fixed":false},{"id":"h4d-05","topic":"m4-degradazione","level":"h","page":"118–119","src":"Biochimica II","q":"Quale ruolo ha il piridossal fosfato (vitamina B6) nella glicogeno fosforilasi?","opts":["Il suo fosfato fa da catalizzatore acido-base per il Pi","Lega il glucosio con una base di Schiff sull'aldeide","Trasporta elettroni come il FAD nelle deidrogenasi","Fornisce il fosfato che finisce nel glucosio 1-fosfato","Lega l'AMP allosterico nella forma b dell'enzima"],"ans":0,"why":"Aiuta il Pi a cedere il protone al legame glicosidico; non usa il gruppo aldeidico come nelle transaminasi. È legato a una lisina dell'enzima.","note":null,"fixed":false},{"id":"h4d-06","topic":"m4-degradazione","level":"h","page":"116","src":"Biochimica II","q":"La fosfoglucomutasi converte G1P in G6P. Qual è il suo meccanismo?","opts":["Una serina fosforilata passa il fosfato al C6 (glucosio 1,6-bisfosfato)","L'ATP fosforila il C6 e poi un'idrolasi separata stacca il fosfato dal C1","Il fosfato migra spontaneamente dal C1 al C6 senza intermedi","Un'istidina fosforilata cede il fosfato al C1 del glucosio 6-P e lo riprende dal C6","L'UTP trasferisce il fosfato al C6 formando UDP-glucosio come intermedio"],"ans":0,"why":"Poi l'enzima riprende il fosfato dal C1. Meccanismo analogo alla fosfoglicerato mutasi (che usa un'istidina).","note":null,"fixed":false},{"id":"h4d-07","topic":"m4-degradazione","level":"h","page":"117","src":"Biochimica II","q":"Perché la struttura molto ramificata del glicogeno è utile al fegato?","opts":["Moltiplica le estremità non riducenti su cui agisce la fosforilasi","Rende il glicogeno insolubile e quindi osmoticamente inerte","Aumenta la pressione osmotica e richiama acqua nell'epatocita","Permette alla fosforilasi di partire anche dall'estremità riducente","Rallenta la degradazione e protegge le riserve tra i pasti"],"ans":0,"why":"Si libera rapidamente molto glucosio, e solo con alte concentrazioni i GLUT2 (bassa affinità) lo portano fuori. Un polimero ramificato si allunga e si accorcia più in fretta di uno lineare.","note":null,"fixed":false},{"id":"h4d-08","topic":"m4-degradazione","level":"h","page":"115","src":"Biochimica II","q":"Perché il glucosio viene immagazzinato come glicogeno e non come glucosio libero?","opts":["Il glucosio libero aumenterebbe enormemente la pressione osmotica","Il glucosio libero è tossico per il fegato e per il muscolo","Il glicogeno contiene più energia per grammo dei trigliceridi","Il glicogeno è insolubile e non lega acqua","Il glucosio libero uscirebbe comunque dalla cellula con i GLUT"],"ans":0,"why":"Un polimero è osmoticamente quasi inerte. I grassi restano la riserva più concentrata di energia.","note":null,"fixed":false},{"id":"h4s-01","topic":"m4-sintesi","level":"h","page":"124","src":"Biochimica II","q":"Qual è il donatore di glucosio per la glicogeno sintasi e come si forma?","opts":["UDP-glucosio, da glucosio 1-fosfato + UTP","Glucosio 6-fosfato, legato direttamente","Glucosio 1-fosfato, attivato con ATP","GDP-glucosio, da glucosio 1-fosfato + GTP","CDP-glucosio, da glucosio 6-fosfato + CTP"],"ans":0,"why":"La UDP-glucosio pirofosforilasi forma UDP-glucosio + PPi; l'idrolisi del PPi rende la reazione irreversibile. L'UTP è il nucleotide delle biosintesi dei carboidrati.","note":null,"fixed":false},{"id":"h4s-02","topic":"m4-sintesi","level":"h","page":"124","src":"Biochimica II","q":"Che cosa fa la glicogenina?","opts":["Si autoglucosila su una tirosina e forma il primer per la sintasi","Crea le ramificazioni α-1,6 nelle catene in crescita prodotte dalla sintasi","Degrada il glicogeno all'interno dei lisosomi insieme all'α-glucosidasi","Attiva la glicogeno fosforilasi trasformandola in forma a","Trasporta il glucosio 6-fosfato dentro il reticolo endoplasmatico"],"ans":0,"why":"Lega il primo glucosio da UDP-glucosio e allunga da sola un breve primer (circa 7 residui), poi resta al centro della molecola. La glicogeno sintasi non sa iniziare una catena da zero.","note":null,"fixed":false},{"id":"h4s-03","topic":"m4-sintesi","level":"h","page":"124","src":"Biochimica II","q":"Quali nucleosidi trifosfato si consumano per inserire nel glicogeno un glucosio che entra nella cellula come glucosio libero?","opts":["1 ATP (esochinasi/glucochinasi) e 1 UTP (che dà UDP + PPi; il PPi viene poi idrolizzato)","Solo 1 UTP, perché il glucosio 1-fosfato si forma dal glucosio libero senza consumo di ATP","1 ATP (esochinasi/glucochinasi) e 1 GTP (che dà GDP + Pi nella glicogeno sintasi)","2 ATP (esochinasi e fosfoglucomutasi) e nessun UTP, perché l'UDP-glucosio non è richiesto","Nessuno: la glicogeno sintasi usa l'energia del legame glicosidico già presente nel glicogeno"],"ans":0,"why":"Il glucosio 1-fosfato viene dal G6P (fosfoglucomutasi, all'equilibrio). L'UDP si ricarica a UTP con ATP (nucleoside difosfato chinasi).","note":null,"fixed":false},{"id":"h4s-04","topic":"m4-sintesi","level":"h","page":"124","src":"Biochimica II","q":"Quale enzima crea le ramificazioni del glicogeno?","opts":["L'enzima ramificante (amilo-1,4→1,6-transglicosilasi)","La glicogeno sintasi, quando cambia conformazione","La glicogenina, nelle fasi iniziali della sintesi","L'α-1,6-glucosidasi, che lavora anche in senso inverso","La fosfoglucomutasi, che sposta il legame dal C1 al C6"],"ans":0,"why":"Sposta un segmento di catena su un legame α-1,6; la sintasi allunga poi entrambe le catene.","note":null,"fixed":false},{"id":"h4s-05","topic":"m4-sintesi","level":"h","page":"125","src":"Biochimica II","q":"Il G6P attiva la glicogeno sintasi b (fosforilata). A che cosa serve?","opts":["Avvia la sintesi di glicogeno anche prima che agisca l'insulina","Inattiva la glicogeno sintasi a quando il G6P è in eccesso","Attiva la glicogeno fosforilasi per bilanciare il flusso","Blocca la glicolisi epatica per deviare tutto il G6P verso la sintesi del glicogeno","Fa uscire il glucosio dal fegato tramite i GLUT2"],"ans":0,"why":"È un effettore allosterico eterotropico positivo della forma b (fosforilata), uguale in fegato e muscolo.","note":null,"fixed":false},{"id":"h4s-06","topic":"m4-sintesi","level":"h","page":"135","src":"Biochimica II","q":"Perché una dieta ricca di grassi e povera di carboidrati non ricostituisce il glicogeno muscolare dopo uno sforzo?","opts":["L'acetil-CoA dei grassi non può tornare a piruvato","Gli acidi grassi inibiscono direttamente la glicogeno sintasi","Il glicogeno si forma solo a partire dalle proteine","Gli acidi grassi inibiscono la glicogenina","Senza carboidrati l'insulina non viene mai secreta"],"ans":0,"why":"La PDH è irreversibile: non c'è sintesi netta di glucosio dai grassi. Servono carboidrati, meglio subito dopo lo sforzo.","note":"Sbobina di Biochimica II, p. 135: c'è scritto che dall'acetil-CoA non si riottiene il piruvato perché «la reazione della piruvato carbossilasi è irreversibile». L'irreversibile in questione è la piruvato deidrogenasi (piruvato → acetil-CoA).","fixed":false},{"id":"h4s-07","topic":"m4-sintesi","level":"h","page":"124–125","src":"Biochimica II","q":"Quale coppia di enzimi va regolata in modo reciproco per evitare un ciclo futile nel metabolismo del glicogeno?","opts":["Glicogeno sintasi e glicogeno fosforilasi","Glicogeno sintasi e glicogenina","Fosfoglucomutasi e glucosio 6-fosfatasi","Enzima ramificante e enzima deramificante","Esochinasi e UDP-glucosio pirofosforilasi"],"ans":0,"why":"Quando una è attiva l'altra deve essere inattiva: le fosforilazioni ormonali hanno effetti opposti sui due enzimi.","note":null,"fixed":false},{"id":"h4s-08","topic":"m4-sintesi","level":"h","page":"124","src":"Biochimica II","q":"In quale direzione la glicogeno sintasi allunga la catena e quale legame forma?","opts":["All'estremità non riducente, con legame α-1,4","All'estremità riducente, con legame α-1,6","All'estremità non riducente, con legame β-1,4","All'estremità riducente, con legame α-1,4","In entrambe le direzioni, con legame α-1,4"],"ans":0,"why":"Le estremità non riducenti sono anche quelle su cui lavora la fosforilasi.","note":null,"fixed":false},{"id":"h4r-01","topic":"m4-regolazione","level":"h","page":"119","src":"Biochimica II","q":"Qual è la relazione tra le forme a/b e gli stati R/T della glicogeno fosforilasi?","opts":["La forma a è soprattutto in R; la b soprattutto in T","La forma a è sempre in T e la b è sempre in R","La forma b è quella fosforilata, ed è la più attiva nello stato R","Le forme a e b non hanno stati conformazionali","La forma a è inattiva in T e la b è attiva in R"],"ans":0,"why":"La fosforilasi a è fosforilata, la b defosforilata ma può passare in R con effettori allosterici: regolazione covalente e allosterica si sommano.","note":null,"fixed":false},{"id":"h4r-02","topic":"m4-regolazione","level":"h","page":"119–120","src":"Biochimica II","q":"Un muscolo si contrae senza adrenalina in circolo. Quale segnale attiva la fosforilasi b?","opts":["L'AMP, che sposta la fosforilasi b in R","Il glucagone, tramite il cAMP","Il glucosio, che si lega al sito allosterico","L'insulina, tramite la PKB","Il citrato, che esce dal mitocondrio"],"ans":0,"why":"L'AMP aumenta quando cala l'ATP; ATP e G6P riportano la fosforilasi b in T. Nel fegato l'AMP non attiva la fosforilasi.","note":null,"fixed":false},{"id":"h4r-03","topic":"m4-regolazione","level":"h","page":"120","src":"Biochimica II","q":"Nel fegato, quale effettore allosterico inattiva la fosforilasi a e perché ha senso?","opts":["Il glucosio, che ferma la glicogenolisi dopo il pasto","L'AMP, che nel fegato segnala un eccesso di energia dopo il pasto","Il Ca²⁺, rilasciato dal reticolo dopo il pasto","Il cAMP, che si lega al sito catalitico dopo il pasto","L'adrenalina, che si lega al sito allosterico dell'enzima"],"ans":0,"why":"Il fegato smette subito di degradare glicogeno, prima ancora che arrivi l'insulina: è un sensore della glicemia.","note":null,"fixed":false},{"id":"h4r-04","topic":"m4-regolazione","level":"h","page":"130","src":"Biochimica II","q":"Nel fegato, come fa il glucosio ad attivare anche la sintesi del glicogeno?","opts":["La fosforilasi a in T libera la PP1, che attiva la glicogeno sintasi","Il glucosio attiva direttamente la glicogeno sintasi chinasi 3, che attiva la sintasi","Il glucosio fosforila la glicogeno sintasi rendendola attiva","Il glucosio blocca la PP1 e così la sintasi resta fosforilata","Il glucosio attiva la PKA, che defosforila la glicogeno sintasi"],"ans":0,"why":"La fosforilasi a in R lega e inibisce la PP1; il glucosio la porta in T, la PP1 si libera, la defosforila (→ b) e poi defosforila la glicogeno sintasi.","note":null,"fixed":false},{"id":"h4r-05","topic":"m4-regolazione","level":"h","page":"126","src":"Biochimica II","q":"Come agisce l'insulina sulla glicogeno sintasi?","opts":["Attiva la PKB, che inattiva la GSK3: la sintasi resta defosforilata","Attiva la GSK3, che fosforila la glicogeno sintasi e la porta nella forma attiva","Attiva la PKA, che fosforila direttamente la glicogeno sintasi","Inibisce la PP1, così la sintasi resta fosforilata e attiva","Aumenta il cAMP, che si lega alla glicogeno sintasi"],"ans":0,"why":"La PKB fosforila e inattiva la GSK3; la PP1 rimuove i fosfati residui. La glicogeno sintasi è attiva quando è defosforilata.","note":"Sbobina di Biochimica II, p. 126: c'è scritto che la GSK3 fosforila la glicogeno sintasi «attivandola» e, poco dopo, che così «la glicogeno fosforilasi rimanga nella forma defosforilata, attiva». La fosforilazione da parte della GSK3 inattiva la glicogeno sintasi, ed è la sintasi (non la fosforilasi) che l'insulina mantiene defosforilata e attiva.","fixed":false},{"id":"h4r-06","topic":"m4-regolazione","level":"h","page":"127–128","src":"Biochimica II","q":"Perché durante la glicogenolisi indotta da ormoni la PP1 deve essere inibita?","opts":["Per evitare un ciclo futile di fosforilazioni e defosforilazioni","Perché la PP1 degrada direttamente il glicogeno","Perché la PP1 attiva la glicogeno fosforilasi e ne raddoppia l'effetto","Perché la PP1 sintetizza cAMP e prolungherebbe troppo il segnale dell'adrenalina","Perché la PP1 consuma il glucosio 1-fosfato liberato dalla fosforilasi"],"ans":0,"why":"Altrimenti defosforilerebbe subito fosforilasi a e fosforilasi chinasi, sprecando ATP. Nel muscolo l'adrenalina stacca la PP1 da GM e fosforila un suo inibitore.","note":null,"fixed":false},{"id":"h4r-07","topic":"m4-regolazione","level":"h","page":"126–127","src":"Biochimica II","q":"Perché la GSK3 può fosforilare la glicogeno sintasi solo dopo un'altra chinasi?","opts":["Riconosce un fosfato già messo dalla caseina chinasi 2","È attivata solo dal cAMP prodotto dal glucagone","Lavora solo sulla forma a della glicogeno fosforilasi","Richiede l'insulina per essere attivata dalla PKB","Usa il GTP invece dell'ATP come donatore di fosfato"],"ans":0,"why":"È un priming: la glicogeno sintasi ha più siti di fosforilazione. A riposo il sito di riconoscimento della GSK3 è occupato da uno pseudosubstrato.","note":null,"fixed":false},{"id":"h4r-08","topic":"m4-regolazione","level":"h","page":"128–130","src":"Biochimica II","q":"Quale ruolo hanno le proteine GM (muscolo) e GL (fegato)?","opts":["Ancorano al glicogeno la PP1 e gli enzimi del suo metabolismo","Sono le isoforme muscolare ed epatica della glicogeno sintasi","Sono i recettori di membrana di glucagone e adrenalina","Sono i trasportatori del G6P nel reticolo endoplasmatico","Sono inibitori della glicogenina nei due tessuti"],"ans":0,"why":"Formano un'unità operativa; la loro fosforilazione decide se la PP1 è legata e attiva. L'insulina fosforila GM sul sito 1 (PP1 attiva), l'adrenalina sul sito 2 (PP1 si stacca).","note":null,"fixed":false},{"id":"h4o-01","topic":"m4-ormoni","level":"h","page":"120–121","src":"Biochimica II","q":"Quale sequenza descrive l'azione del glucagone sul glicogeno epatico?","opts":["Gs → adenilato ciclasi → cAMP → PKA → fosforilasi chinasi → fosforilasi a","Recettore tirosin-chinasico → PKB → GSK3 → fosforilasi chinasi → fosforilasi a","Gi → calo del cAMP → PKA inattiva → PP1 inattiva → fosforilasi a","Recettore nucleare → trascrizione del gene della fosforilasi","Gq → PLC → IP₃ → Ca²⁺ → calmodulina → glicogeno sintasi attiva"],"ans":0,"why":"Il recettore ha 7 eliche transmembrana. La PKA fosforila anche la glicogeno sintasi, inattivandola.","note":"Sbobina di Biochimica II, p. 131: c'è scritto che il glucagone aumenta i livelli di «AMP» nel fegato; è il cAMP (AMP ciclico).","fixed":false},{"id":"h4o-02","topic":"m4-ormoni","level":"h","page":"123","src":"Biochimica II","q":"Perché la cascata del cAMP è considerata un sistema di amplificazione?","opts":["Perché ogni tappa è enzimatica e moltiplica il segnale","Perché il glucagone si moltiplica nel sangue dopo il primo legame","Perché ogni recettore lega molte molecole di ormone insieme","Perché il cAMP è un enzima che degrada direttamente il glicogeno","Perché il glicogeno degradato attiva di nuovo il proprio recettore"],"ans":0,"why":"Pochi ormoni attivano molte adenilato ciclasi, ogni PKA molte fosforilasi chinasi, e così via: da poche molecole di ormone si ottengono 10.000 e più molecole di glucosio.","note":null,"fixed":false},{"id":"h4o-03","topic":"m4-ormoni","level":"h","page":"121","src":"Biochimica II","q":"Come viene completamente attivata la fosforilasi chinasi muscolare?","opts":["Con fosforilazione (PKA) e Ca²⁺ sulla subunità δ","Solo con il cAMP legato direttamente alla subunità γ","Solo con l'insulina, tramite la PKB e la PP1","Con il glucosio legato al sito allosterico","Con l'AMP legato alla subunità α e nessuna fosforilazione"],"ans":0,"why":"La subunità δ è una calmodulina; ciascun segnale da solo dà un'attivazione parziale. Il Ca²⁺ della contrazione collega il lavoro muscolare alla glicogenolisi.","note":null,"fixed":false},{"id":"h4o-04","topic":"m4-ormoni","level":"h","page":"122","src":"Biochimica II","q":"Durante una camminata, senza adrenalina in circolo, che cosa attiva la glicogenolisi muscolare?","opts":["Il Ca²⁺ del reticolo sarcoplasmatico, che attiva la fosforilasi chinasi","Il glucagone, che si lega ai recettori della fibra muscolare e attiva la PKA","L'insulina, che aumenta durante l'attività fisica leggera","Il cortisolo, che induce la sintesi della fosforilasi muscolare","Il glucosio plasmatico, che si lega alla fosforilasi muscolare b"],"ans":0,"why":"Il Ca²⁺ è liberato con lo stimolo nervoso; anche l'AMP attiva la fosforilasi b. Il muscolo non ha recettori per il glucagone.","note":null,"fixed":false},{"id":"h4o-05","topic":"m4-ormoni","level":"h","page":"121–122","src":"Biochimica II","q":"L'adrenalina ha effetti diversi su fegato e muscolo. Quale affermazione è corretta?","opts":["Fegato: glicemia ↑; muscolo: glucosio per la glicolisi locale","Muscolo: glucosio ceduto al sangue; fegato: nessun effetto","Fegato: glicogenolisi bloccata; muscolo: glicogenolisi attivata","Agisce solo sul tessuto adiposo e non sul glicogeno","Attiva la glicogeno sintasi in entrambi i tessuti"],"ans":0,"why":"In entrambi stimola la glicogenolisi (ormone dell'attacco o fuga), ma il glucosio ha destini diversi.","note":null,"fixed":false},{"id":"h4o-06","topic":"m4-ormoni","level":"h","page":"131–132","src":"Biochimica II","q":"Un paziente con insulinoma (eccesso di insulina) a digiuno. Che cosa succede al glicogeno epatico e alla glicemia?","opts":["Il fegato non rilascia glucosio: ipoglicemia","La fosforilasi si attiva e la glicemia sale","Il glicogeno si esaurisce e la glicemia aumenta","Nessun effetto, perché prevale il glucagone","Il glicogeno muscolare passa nel sangue"],"ans":0,"why":"PKB e PP1 restano attive: la glicogeno sintasi lavora e la fosforilasi è spenta. L'insulina è l'unico ormone ipoglicemizzante.","note":null,"fixed":false},{"id":"h4o-07","topic":"m4-ormoni","level":"h","page":"131","src":"Biochimica II","q":"Perché il glucosio da solo blocca la glicogenolisi epatica prima che arrivi l'insulina?","opts":["La secrezione di insulina richiede tempo, il glucosio portale agisce subito","Il glucosio inibisce il recettore del glucagone sugli epatociti","Il glucosio attiva la PKA degli epatociti, che inattiva direttamente la fosforilasi a","Il glucosio agisce come un ormone sul recettore dell'insulina degli epatociti","L'insulina non ha alcun effetto sul glicogeno del fegato, solo sul muscolo"],"ans":0,"why":"Nella cellula β servono glicolisi, Krebs, fosforilazione ossidativa ed esocitosi. Il glucosio della vena porta agisce subito sulla fosforilasi a: il glicogeno epatico viene preservato appena si mangia.","note":"Sbobina di Biochimica II, p. 131: c'è scritto che l'insulina è «propriamente anabolica, quindi di distruzione del glicogeno». Va letto «di costruzione».","fixed":false},{"id":"h4o-08","topic":"m4-ormoni","level":"h","page":"132","src":"Biochimica II","q":"Dopo un pasto, che cosa fa la maggior parte del glucosio che entra nell'epatocita, secondo il corso?","opts":["La maggior parte entra nella glicolisi, stimolata dall'insulina","Esce subito dal fegato tramite i GLUT2 e torna nel sangue periferico","Diventa tutto glicogeno epatico, perché la glicolisi è inibita dall'insulina","Viene ossidato a lattato e ceduto al sangue per il ciclo di Cori","Viene convertito in corpi chetonici e ceduto al cervello e al muscolo"],"ans":0,"why":"In parte inibisce la fosforilasi e attiva la PP1 (sintesi di glicogeno). Dalla glicolisi epatica deriva anche acetil-CoA per la lipogenesi.","note":null,"fixed":false},{"id":"h4a-01","topic":"m4-attivita","level":"h","page":"133","src":"Biochimica II","q":"In uno scatto di 10 secondi, in quale ordine intervengono le fonti di ATP?","opts":["ATP → fosfocreatina → glicolisi anaerobia","β-ossidazione → fosfocreatina → glicolisi","Metabolismo aerobio → fosfocreatina → ATP","Gluconeogenesi → glicogeno → fosfocreatina","Glicolisi dal glucosio plasmatico soltanto"],"ans":0,"why":"La glicolisi anaerobia usa il glicogeno; il metabolismo aerobio cresce dopo. Negli sforzi lunghi prevale il metabolismo aerobio, sempre più di acidi grassi.","note":"Sbobina di Biochimica II, p. 133: le curve del grafico sono chiamate «anabolismo aerobio» e «anabolismo anaerobio»; si intende metabolismo (catabolismo) aerobio e anaerobio.","fixed":false},{"id":"h4a-02","topic":"m4-attivita","level":"h","page":"134","src":"Biochimica II","q":"In quale tipo di sforzo il glicogeno muscolare NON viene praticamente consumato?","opts":["Sforzo leggero (circa 25% del VO₂max)","Sforzo intenso di breve durata (circa 85% del VO₂max)","Sforzo moderato e prolungato (65% VO₂max)","Scatto alla massima intensità","Sollevamento pesi ripetuto (anaerobico)"],"ans":0,"why":"È sostenuto soprattutto da acidi grassi e glucosio plasmatico. Lo sforzo intenso esaurisce il glicogeno in poco tempo.","note":null,"fixed":false},{"id":"h4a-03","topic":"m4-attivita","level":"h","page":"135","src":"Biochimica II","q":"Qual è la strategia migliore per ricostituire il glicogeno dopo una gara?","opts":["Carboidrati subito dopo e a intervalli regolari nelle 24 ore","Digiuno per 24 ore per stimolare la gluconeogenesi","Solo proteine, che il muscolo trasforma direttamente in glicogeno","Solo grassi, con una dieta chetogenica per risparmiare glucosio","Carboidrati solo dopo 48 ore di riposo, quando la sintasi è attiva"],"ans":0,"why":"Subito dopo lo sforzo la sintesi di glicogeno è particolarmente attiva.","note":null,"fixed":false},{"id":"h4a-04","topic":"m4-attivita","level":"h","page":"135","src":"Biochimica II","q":"Che cos'è la supercompensazione del glicogeno?","opts":["Il glicogeno, dopo l'esaurimento, sale oltre i valori iniziali con molti carboidrati","La sintesi di glicogeno muscolare a partire dagli acidi grassi della dieta dopo uno sforzo","La degradazione molto rapida del glicogeno muscolare durante lo sforzo intenso","Il trasferimento diretto di glicogeno dal fegato al muscolo dopo lo sforzo","L'aumento della glicemia durante lo sforzo per effetto dell'adrenalina"],"ans":0,"why":"Con una dieta ricca di carboidrati succede in circa due giorni; a digiuno o con dieta povera di carboidrati il glicogeno non si ricostituisce.","note":null,"fixed":false},{"id":"h4a-05","topic":"m4-attivita","level":"h","page":"135","src":"Biochimica II","q":"Perché le proteine sono una fonte poco efficiente per ricostituire il glicogeno?","opts":["Pochi amminoacidi sono glucogenici e servono soprattutto per l'energia","Le proteine non contengono atomi di carbonio utilizzabili","Nessun amminoacido può essere convertito in glucosio nel fegato","Le proteine inibiscono direttamente la glicogeno sintasi e bloccano la glicogenina","Le proteine bloccano la secrezione di insulina e quindi la sintasi"],"ans":0,"why":"Dopo lo sforzo gli amminoacidi coprono soprattutto il deficit energetico: il contributo al glicogeno è minimo. Secondo il prof servono carboidrati complessi.","note":null,"fixed":false},{"id":"h4a-06","topic":"m4-attivita","level":"h","page":"133","src":"Biochimica II","q":"Nel corso di uno sforzo intenso, perché aumenta la quota di metabolismo aerobio?","opts":["Fosfocreatina finita e glicolisi poco efficiente; cresce l'apporto di O₂","La glicolisi si arresta per mancanza di ADP nel citosol e resta solo la via aerobia","Il lattato attiva direttamente la catena respiratoria","L'adrenalina blocca la glicolisi muscolare dopo pochi secondi di sforzo","Il glicogeno non può essere degradato in anaerobiosi oltre il primo minuto"],"ans":0,"why":"Le riserve di fosfocreatina finiscono in pochi secondi; man mano si adeguano apporto di O₂ e attività mitocondriale.","note":null,"fixed":false},{"id":"h4a-07","topic":"m4-attivita","level":"h","page":"133–134","src":"Biochimica II","q":"Durante uno sforzo, quale fonte di glucosio entra nel muscolo oltre al glicogeno?","opts":["Il glucosio plasmatico, che entra con i GLUT4","Il glucosio prodotto dal muscolo con la gluconeogenesi","Il glucosio derivato dagli acidi grassi","Nessuna: il muscolo usa solo il proprio glicogeno","Il glucosio ceduto dal cuore al muscolo"],"ans":0,"why":"Viene dal glicogeno epatico e dalla gluconeogenesi. Non è nelle sbobine che anche la contrazione, indipendentemente dall'insulina, porta i GLUT4 in membrana.","note":null,"fixed":false},{"id":"h4a-08","topic":"m4-attivita","level":"h","page":"134","src":"Biochimica II","q":"Perché un maratoneta che esaurisce il glicogeno muscolare deve rallentare («muro»)?","opts":["Gli acidi grassi da soli sostengono solo intensità moderate","Gli acidi grassi non possono produrre ATP nel muscolo scheletrico","Il lattato si azzera e la glicolisi muscolare si ferma del tutto","Manca l'insulina e il glucosio del sangue non entra più nel muscolo","Si blocca la catena respiratoria per accumulo di acetil-CoA"],"ans":0,"why":"L'ossidazione degli acidi grassi è più lenta e richiede più O₂ per ATP prodotto rispetto al glucosio. Non è nelle sbobine nel dettaglio, ma segue dal grafico sulle fonti energetiche.","note":null,"fixed":false},{"id":"h4g-01","topic":"m4-glicogenosi","level":"h","page":"136–138","src":"Biochimica II","q":"Un bambino ha ipoglicemia a digiuno grave, epatomegalia, lattato alto, iperlipidemia e iperuricemia. Glicogeno epatico abbondante e di struttura normale. Diagnosi?","opts":["Glicogenosi I (von Gierke)","Glicogenosi II (Pompe)","Glicogenosi III (Cori-Forbes)","Glicogenosi V (McArdle)","Glicogenosi VI (Hers)"],"ans":0,"why":"Deficit di glucosio 6-fosfatasi: il G6P da glicogenolisi e gluconeogenesi non diventa glucosio e viene deviato verso glicolisi e lattato.","note":null,"fixed":false},{"id":"h4g-02","topic":"m4-glicogenosi","level":"h","page":"137–138","src":"Biochimica II","q":"Perché nella glicogenosi di tipo I l'ipoglicemia è più grave che nella glicogenosi di tipo III?","opts":["Nella I sono bloccate sia glicogenolisi sia gluconeogenesi","Nella III manca la glicogeno sintasi e il glicogeno non si forma","Nella I manca anche l'insulina, che non viene più secreta","Nella III il glicogeno si accumula nei lisosomi e non nel citosol","Nella I è colpito solo il muscolo, nella III anche il fegato"],"ans":0,"why":"La glucosio 6-fosfatasi è la via finale comune. Nella III la gluconeogenesi funziona e il glicogeno è parzialmente degradabile.","note":null,"fixed":false},{"id":"h4g-03","topic":"m4-glicogenosi","level":"h","page":"137","src":"Biochimica II","q":"Perché nella glicogenosi di tipo I si somministra amido di mais crudo?","opts":["È digerito lentamente e rilascia glucosio per ore","Contiene glucosio 6-fosfatasi vegetale attiva","È ricco di fruttosio, che non richiede l'enzima mancante","Stimola la gluconeogenesi epatica tramite il glucagone","Inibisce la glicolisi epatica e lascia più glucosio libero"],"ans":0,"why":"Il rilascio graduale copre le ore senza pasti e previene l'ipoglicemia notturna. La sbobina sottolinea la ricchezza di amilopectina.","note":"Sbobina di Biochimica II, p. 137: c'è scritto che l'amido di mais crudo libera «grosse quantità di glucosio» con «ingresso massiccio». Il motivo per cui si usa crudo è il contrario: la digestione lenta dà un rilascio graduale per diverse ore e previene l'ipoglicemia notturna.","fixed":false},{"id":"h4g-04","topic":"m4-glicogenosi","level":"h","page":"138","src":"Biochimica II","q":"Un giovane ha crampi e mioglobinuria durante esercizi intensi, glicemia normale e nessun aumento di lattato durante lo sforzo. Diagnosi?","opts":["Glicogenosi V (McArdle)","Glicogenosi I (von Gierke)","Glicogenosi II (Pompe)","Deficit di carnitina","Deficit di LDH-H"],"ans":0,"why":"Deficit di fosforilasi muscolare: senza glicogenolisi il muscolo non produce lattato; il fegato (fosforilasi normale) mantiene la glicemia.","note":"Sbobina di Biochimica II, p. 138: la mioglobinuria è definita «presenza di mioglobina nel sangue»; è la presenza di mioglobina nelle urine.","fixed":false},{"id":"h4g-05","topic":"m4-glicogenosi","level":"h","page":"138","src":"Biochimica II","q":"Perché nella malattia di Pompe (tipo II) il glicogeno si accumula pur essendo normali gli enzimi citosolici?","opts":["Manca l'α-1,4-glucosidasi acida dei lisosomi","Manca la glicogeno fosforilasi muscolare","Manca l'enzima ramificante del citosol","Manca la glucosio 6-fosfatasi del reticolo","Manca la glicogenina al centro del granulo"],"ans":0,"why":"Il glicogeno che arriva nei lisosomi (autofagia) non viene degradato e si accumula, soprattutto in cuore e muscolo. È anche una malattia da accumulo lisosomiale.","note":null,"fixed":false},{"id":"h4g-06","topic":"m4-glicogenosi","level":"h","page":"138","src":"Biochimica II","q":"Nella glicogenosi di tipo III (Cori), quale struttura avrà il glicogeno?","opts":["Anomala, con ramificazioni corte residue","Normale nella struttura, ma in quantità enorme","Lineare, perché mancano le ramificazioni","Con legami β-1,4 al posto degli α","Assente sia nel fegato sia nel muscolo"],"ans":0,"why":"La fosforilasi si ferma vicino ai punti di ramificazione (destrina limite). Nel deficit dell'enzima ramificante (tipo IV, non nelle sbobine) le catene sono invece lunghe e poco ramificate.","note":null,"fixed":false},{"id":"h4g-07","topic":"m4-glicogenosi","level":"h","page":"137","src":"Biochimica II","q":"Che cosa distingue la glicogenosi Ia dalla Ib?","opts":["Ia: deficit dell'enzima; Ib: del trasportatore del G6P","Ia: forma muscolare dell'enzima; Ib: forma epatica dell'enzima","Ia: deficit della fosforilasi; Ib: della sintasi","Ia: ereditarietà autosomica; Ib: ereditarietà mitocondriale","Ia: forma lisosomiale; Ib: forma citosolica dell'enzima"],"ans":0,"why":"Il risultato metabolico è lo stesso. Non è nelle sbobine che la Ib dà anche neutropenia.","note":null,"fixed":false},{"id":"h4g-08","topic":"m4-glicogenosi","level":"h","page":"138","src":"Biochimica II","q":"Perché nella glicogenosi di tipo I compare iperuricemia?","opts":["Più purine dai pentosi, più degradazione dei nucleotidi, meno escrezione","Manca la xantina ossidasi epatica e l'acido urico non viene trasformato in urea","Aumenta il glicogeno renale, che viene degradato direttamente ad acido urico","L'acido urico deriva dal glicogeno accumulato, ossidato dai perossisomi","Aumenta l'insulina, che riduce l'escrezione renale di acido urico"],"ans":0,"why":"Il G6P accumulato alimenta la via dei pentoso fosfati (più ribosio 5-P e sintesi di purine); il calo di Pi e ATP aumenta la degradazione dei nucleotidi; il lattato compete con l'urato per l'escrezione renale. Nella sbobina c'è solo che l'acido urico aumenta quando le cellule soffrono.","note":null,"fixed":false},{"id":"h5f-01","topic":"m5-fonti","level":"h","page":"141","src":"Biochimica II","q":"Dalle 22 a mezzogiorno del giorno dopo, senza colazione, come cambiano le fonti di glucosio ematico?","opts":["Il glicogeno epatico cala e la gluconeogenesi diventa la fonte principale","Il glicogeno muscolare sostiene la glicemia per tutta la notte e la mattina","La gluconeogenesi si ferma di notte e riparte solo al risveglio","La glicemia è sostenuta solo dal glucosio assorbito con la cena","Il glicogeno epatico aumenta di notte grazie al cortisolo e poi si consuma al mattino"],"ans":0,"why":"Dopo ogni pasto la gluconeogenesi si azzera e riparte la sintesi di glicogeno.","note":null,"fixed":false},{"id":"h5f-02","topic":"m5-fonti","level":"h","page":"140","src":"Biochimica II","q":"Perché la gluconeogenesi è indispensabile anche se abbiamo riserve di glicogeno?","opts":["Il glicogeno epatico finisce in meno di un giorno; serve anche a riciclare il lattato","Il glicogeno muscolare non contiene glucosio ma solo glucosio 6-fosfato","Il cervello usa solo glucosio di origine gluconeogenica, non quello del glicogeno","Il glicogeno epatico si forma solo di notte e non è disponibile di giorno","La gluconeogenesi produce ATP netto, indispensabile al fegato durante il digiuno"],"ans":0,"why":"Il cervello consuma circa 120 g di glucosio al giorno e il glicogeno epatico è circa 100 g; il glicogeno muscolare non può dare glucosio al sangue. Sulle cifre la sbobina parla di 160 g/die di glucosio, per il 70% al cervello.","note":null,"fixed":false},{"id":"h5f-03","topic":"m5-fonti","level":"h","page":"140–141","src":"Biochimica II","q":"Quali sono i principali precursori della gluconeogenesi e da dove vengono?","opts":["Lattato, amminoacidi (soprattutto alanina) e glicerolo","Acidi grassi a catena pari, acetil-CoA e corpi chetonici","Solo il lattato prodotto da muscolo ed eritrociti","Glicogeno muscolare, urea e acetoacetato","Colesterolo, glicerolo e acidi grassi a catena pari"],"ans":0,"why":"Il lattato viene da eritrociti e muscolo, l'alanina dalle proteine muscolari, il glicerolo dai trigliceridi del tessuto adiposo. Gli acidi grassi a catena pari non danno glucosio netto.","note":null,"fixed":false},{"id":"h5f-04","topic":"m5-fonti","level":"h","page":"140","src":"Biochimica II","q":"Dove avviene la gluconeogenesi?","opts":["Fegato (circa 90%) e rene (circa 10%)","Muscolo scheletrico e cuore","Cervello (90%) e midollo spinale (10%)","Solo negli eritrociti e nel cervello","Tessuto adiposo e intestino, in parti uguali"],"ans":0,"why":"Serve la glucosio 6-fosfatasi, presente in fegato e rene; il contributo renale aumenta nel digiuno prolungato.","note":null,"fixed":false},{"id":"h5f-05","topic":"m5-fonti","level":"h","page":"142","src":"Biochimica II","q":"Perché il cortisolo è legato al ritmo della gluconeogenesi?","opts":["Ha un picco al mattino e induce la trascrizione di enzimi come la PEPCK","Si lega a un recettore di membrana e attiva la PKA come il glucagone","Inibisce la glicogenolisi di notte e la riattiva al mattino","Viene secreto solo dopo i pasti, quando la glicemia è alta","Aumenta la secrezione notturna di insulina e quindi la sintesi di glicogeno"],"ans":0,"why":"Ha un minimo verso mezzanotte. Come ormone steroideo agisce tramite un recettore nucleare sulla trascrizione: effetti lenti.","note":"Sbobina di Biochimica II, p. 142: il cortisolo è definito «ormone anabolizzante» perché fa sintetizzare proteine. Nel metabolismo il cortisolo è catabolico per le proteine muscolari (le degrada per dare amminoacidi alla gluconeogenesi, come dice la stessa sbobina a p. 149); induce la sintesi di specifici enzimi epatici.","fixed":false},{"id":"h5f-06","topic":"m5-fonti","level":"h","page":"149","src":"Biochimica II","q":"Su quali tessuti agisce il cortisolo per favorire la gluconeogenesi?","opts":["Fegato, muscolo e tessuto adiposo","Solo fegato, sugli enzimi","Pancreas e cervello","Muscolo, cervello e pancreas","Rene e intestino soltanto, dove avviene la gluconeogenesi"],"ans":0,"why":"Fegato: enzimi gluconeogenici; muscolo: proteolisi e rilascio di alanina; tessuto adiposo: glicerolo dai trigliceridi. Per questo una terapia cortisonica prolungata riduce la massa muscolare e può dare iperglicemia.","note":null,"fixed":false},{"id":"h5f-07","topic":"m5-fonti","level":"h","page":"139","src":"Biochimica II","q":"Un neonato prematuro va spesso in ipoglicemia grave dopo il parto. Perché?","opts":["Il glicogeno si accumula nell'ultimo trimestre: le riserve sono scarse","Ha troppo glucagone, che consuma il glicogeno ancora prima del parto","Non produce insulina e quindi non può usare il glucosio del sangue","Il suo glicogeno ha una struttura anomala che la fosforilasi non riconosce","Assorbe troppo glucosio dal latte e va in ipoglicemia reattiva"],"ans":0,"why":"Quando cessa l'apporto dalla placenta, il prematuro non ha riserve sufficienti. Lo stesso succede con malnutrizione materna.","note":null,"fixed":false},{"id":"h5f-08","topic":"m5-fonti","level":"h","page":"139","src":"Biochimica II","q":"Il figlio di una madre con diabete mal controllato può avere ipoglicemia dopo la nascita. Perché?","opts":["Ha iperinsulinemia, che blocca glicogenolisi e gluconeogenesi","Ha poco glicogeno, perché la madre diabetica non gli cede glucosio","Ha un deficit congenito di glucosio 6-fosfatasi epatica","Non produce glucagone, perché le cellule α sono soppresse","Ha ricevuto attraverso la placenta l'insulina della madre"],"ans":0,"why":"Esposto a molto glucosio in utero, ha iperplasia delle cellule β. L'insulina materna non attraversa la placenta; il glucosio sì.","note":null,"fixed":false},{"id":"h5r-01","topic":"m5-reazioni","level":"h","page":"143","src":"Biochimica II","q":"Quali tre tappe della glicolisi devono essere aggirate dalla gluconeogenesi e con quali enzimi?","opts":["PK → piruvato carbossilasi + PEPCK; PFK1 → FBPasi1; esochinasi → G6Pasi","Aldolasi, enolasi e fosfoglicerato chinasi, che hanno ΔG°' positivo","Esochinasi, aldolasi e piruvato chinasi, sostituite da fosfatasi specifiche","GAP deidrogenasi, PFK1 e PDH, sostituite da enzimi mitocondriali","Solo la piruvato chinasi, perché le altre tappe sono reversibili"],"ans":0,"why":"Le altre sette reazioni sono all'equilibrio e vengono usate in senso inverso.","note":null,"fixed":false},{"id":"h5r-02","topic":"m5-reazioni","level":"h","page":"144–145","src":"Biochimica II","q":"Perché per trasformare il piruvato in PEP servono due enzimi e due nucleotidi?","opts":["Il PEP è molto energetico: serve carbossilare e poi decarbossilare","Il piruvato deve prima entrare nel nucleo per essere attivato","La piruvato chinasi è reversibile ma troppo lenta nel fegato","Serve NADPH per ridurre il piruvato prima di fosforilarlo","Il PEP si forma nel citosol ma deve essere attivato nel mitocondrio da due chinasi"],"ans":0,"why":"Piruvato → ossalacetato (piruvato carbossilasi, ATP, biotina); poi la decarbossilazione dell'ossalacetato spinge la sintesi del PEP (PEPCK, GTP). La CO₂ entra e poi esce: è lo stesso carbonio a rendere la reazione possibile.","note":"Sbobina di Biochimica II, p. 145: tra i prodotti della PEP carbossichinasi compare l'«ADP». Con il GTP si forma GDP. Inoltre a p. 144 si legge che l'acetil-CoA attiva la «piruvato decarbossilazione»: è la piruvato carbossilazione.","fixed":false},{"id":"h5r-03","topic":"m5-reazioni","level":"h","page":"145","src":"Biochimica II","q":"Perché l'ossalacetato prodotto nel mitocondrio (da alanina) esce come malato?","opts":["Non c'è un trasportatore per l'ossalacetato; il malato porta anche NADH","Il malato è più energetico e spinge la reazione della PEPCK verso il PEP","Il malato è il vero substrato della PEPCK citosolica, non l'ossalacetato","L'ossalacetato è tossico nel citosol e va mascherato come malato","Il malato attiva la glucosio 6-fosfatasi del reticolo e accelera l'uscita del glucosio"],"ans":0,"why":"Viene ridotto a malato (MDH mitocondriale), esce e viene riossidato nel citosol, producendo il NADH che serve alla GAP deidrogenasi.","note":null,"fixed":false},{"id":"h5r-04","topic":"m5-reazioni","level":"h","page":"150","src":"Biochimica II","q":"Se il precursore è il lattato, perché l'ossalacetato non ha bisogno di uscire come malato?","opts":["Il NADH viene già dal lattato; il PEP si forma nel mitocondrio ed esce","Il lattato entra direttamente nella glicolisi come fosfoenolpiruvato","Il lattato non passa per il piruvato ma diventa subito ossalacetato","Il lattato attiva la piruvato chinasi e salta il primo bypass","Il lattato produce NADPH, che sostituisce il NADH nella GAP deidrogenasi citosolica"],"ans":0,"why":"La conversione lattato → piruvato produce già il NADH citosolico; la PEPCK mitocondriale trasforma l'ossalacetato in PEP, che esce con un trasportatore. È uno dei motivi per cui esistono due isoforme di PEPCK.","note":null,"fixed":false},{"id":"h5r-05","topic":"m5-reazioni","level":"h","page":"147","src":"Biochimica II","q":"Confronta il bilancio della gluconeogenesi con quello di un'ipotetica glicolisi inversa.","opts":["Gluconeogenesi: 4 ATP + 2 GTP, ΔG°' ≈ −38; inversa: 2 ATP, ΔG°' ≈ +84","Hanno lo stesso costo, ma la gluconeogenesi è più veloce","La gluconeogenesi produce 2 ATP netti, la glicolisi inversa ne consuma 2","La glicolisi inversa sarebbe favorita, ma è inibita dall'insulina","Gluconeogenesi: 2 ATP, ΔG°' ≈ +84; inversa: 6 ATP, ΔG°' ≈ −38"],"ans":0,"why":"Entrambe usano 2 NADH. I 4 legami ad alta energia in più sono il prezzo per rendere la via irreversibile.","note":null,"fixed":false},{"id":"h5r-06","topic":"m5-reazioni","level":"h","page":"146","src":"Biochimica II","q":"Che cosa ha in comune la fruttosio 1,6-bisfosfatasi con la glucosio 6-fosfatasi?","opts":["Idrolizzano un fosfoestere con acqua, senza riformare ATP","Entrambe producono ATP trasferendo il fosfato all'ADP","Entrambe si trovano nel lume del reticolo endoplasmatico","Entrambe richiedono la biotina come coenzima","Entrambe sono attivate allostericamente dal fruttosio 2,6-bisfosfato"],"ans":0,"why":"Sono reazioni esoergoniche che aggirano due chinasi irreversibili. Solo la glucosio 6-fosfatasi è nel lume del reticolo.","note":null,"fixed":false},{"id":"h5r-07","topic":"m5-reazioni","level":"h","page":"146","src":"Biochimica II","q":"Un paziente con glicogenosi di tipo I. Quale delle due vie per mantenere la glicemia funziona?","opts":["Nessuna delle due","Solo la gluconeogenesi","Solo la glicogenolisi","Entrambe, ma più lentamente","Solo la gluconeogenesi renale, che non ha bisogno della glucosio 6-fosfatasi"],"ans":0,"why":"Glicogenolisi e gluconeogenesi producono entrambe G6P, che senza glucosio 6-fosfatasi non diventa glucosio. Un deficit della sola fosforilasi epatica sarebbe meno grave.","note":"Sbobina di Biochimica II, p. 146: c'è scritto «malattia di tipo 1 di diabete mellito»; si intende la glicogenosi di tipo I (von Gierke).","fixed":false},{"id":"h5r-08","topic":"m5-reazioni","level":"h","page":"143–147","src":"Biochimica II","q":"Quante molecole di piruvato servono per un glucosio e quante tappe sono in comune con la glicolisi?","opts":["2 piruvati; 7 reazioni comuni e 3 tappe specifiche","1 piruvato; tutte e 10 le reazioni sono comuni","2 piruvati; nessuna reazione in comune con la glicolisi","3 piruvati; 5 reazioni comuni e 5 specifiche","2 piruvati; 3 reazioni comuni e 7 tappe specifiche con enzimi propri"],"ans":0,"why":"Le 3 tappe specifiche usano 4 enzimi: il primo bypass ne usa due (piruvato carbossilasi e PEPCK).","note":null,"fixed":false},{"id":"h5g-01","topic":"m5-glicerolo","level":"h","page":"147","src":"Biochimica II","q":"Da quale punto entra il glicerolo nella gluconeogenesi e perché è una via più semplice?","opts":["Come DHAP, a livello dei triosi: salta il bypass piruvato → PEP","Come piruvato, dopo la transaminazione nel mitocondrio epatico","Come acetil-CoA, che attiva la piruvato carbossilasi nel mitocondrio","Come ossalacetato, dopo la carbossilazione del glicerolo","Come glucosio 6-fosfato, dopo la condensazione di due molecole di glicerolo"],"ans":0,"why":"Glicerolo → glicerolo 3-fosfato (glicerolo chinasi, nel fegato) → DHAP (glicerolo 3-fosfato deidrogenasi).","note":"Sbobina di Biochimica II, p. 141: il glicerolo viene fosforilato a «glicerolo 1-P». Il prodotto della glicerolo chinasi è il glicerolo 3-fosfato (come la sbobina scrive a p. 147).","fixed":false},{"id":"h5g-02","topic":"m5-glicerolo","level":"h","page":"149","src":"Biochimica II","q":"Perché l'adipocita non può riutilizzare il glicerolo liberato dalla lipolisi?","opts":["Ha poca glicerolo chinasi","Il glicerolo è tossico per l'adipocita","L'adipocita non ha GLUT4","Il glicerolo viene trasformato in acidi grassi","L'adipocita lo ossida completamente a CO₂ nei mitocondri"],"ans":0,"why":"Il glicerolo esce nel sangue e viene fosforilato nel fegato. Non è nelle sbobine: l'adipocita ricava il glicerolo 3-P dalla glicolisi o dalla gliceroneogenesi.","note":null,"fixed":false},{"id":"h5g-03","topic":"m5-glicerolo","level":"h","page":"147","src":"Biochimica II","q":"Perché il glicerolo dei trigliceridi può dare glucosio mentre gli acidi grassi a catena pari no?","opts":["Il glicerolo dà DHAP; gli acidi grassi danno solo acetil-CoA","Il glicerolo contiene più carbonio degli acidi grassi","Gli acidi grassi non vengono ossidati nel fegato ma solo nel muscolo","Il glicerolo entra nel Krebs come succinato e dà ossalacetato","Gli acidi grassi inibiscono la PEPCK e bloccano la gluconeogenesi nel fegato"],"ans":0,"why":"Il DHAP è un intermedio a 3 C della gluconeogenesi; l'acetil-CoA non può diventare piruvato. Il glicerolo è però una piccola parte della massa dei trigliceridi.","note":null,"fixed":false},{"id":"h5g-04","topic":"m5-glicerolo","level":"h","page":"147","src":"Biochimica II","q":"Quale altro substrato «lipidico» può fornire glucosio netto?","opts":["Il propionil-CoA, che diventa succinil-CoA","L'acetoacetato, che diventa ossalacetato","Il colesterolo, che diventa piruvato","Il palmitato, che diventa malato","L'acetil-CoA, che si condensa con un altro acetil-CoA e diventa succinato"],"ans":0,"why":"Il propionil-CoA viene da acidi grassi a catena dispari e da alcuni amminoacidi; il passaggio metilmalonil-CoA → succinil-CoA richiede vitamina B12.","note":null,"fixed":false},{"id":"h5g-05","topic":"m5-glicerolo","level":"h","page":"149","src":"Biochimica II","q":"A digiuno notturno, da dove deriva il glicerolo usato dal fegato?","opts":["Dalla lipolisi dei trigliceridi del tessuto adiposo","Dalla degradazione del glicogeno epatico","Dai fosfolipidi delle membrane degli epatociti","Dal lattato prodotto dal muscolo durante la notte","Dai trigliceridi della cena, ancora presenti nei chilomicroni circolanti"],"ans":0,"why":"La lipolisi è favorita da cortisolo, glucagone e adrenalina; il cortisolo sfavorisce anche la riesterificazione dei trigliceridi.","note":null,"fixed":false},{"id":"h5g-06","topic":"m5-glicerolo","level":"h","page":"148","src":"Biochimica II","q":"Perché il lattato si forma nel muscolo ma viene usato per la gluconeogenesi nel fegato?","opts":["Il rapporto NAD⁺/NADH è basso nel muscolo e alto nel fegato","Il muscolo non ha la lattato deidrogenasi","Il fegato non ha la piruvato chinasi","Il lattato è prodotto solo dal fegato e poi ceduto al muscolo","Nel muscolo il lattato viene ossidato a CO₂ e nel fegato viene ridotto a glucosio"],"ans":0,"why":"Sotto sforzo la LDH muscolare riduce il piruvato; nel fegato ossida il lattato a piruvato. La stessa reazione all'equilibrio va in direzioni opposte secondo le concentrazioni.","note":null,"fixed":false},{"id":"h5g-07","topic":"m5-glicerolo","level":"h","page":"148","src":"Biochimica II","q":"Che cosa fa il cuore con il lattato prodotto dal muscolo scheletrico?","opts":["Lo ossida a piruvato con la LDH-1 e lo usa nel Krebs","Lo trasforma in glucosio con la gluconeogenesi","Lo accumula come glicogeno cardiaco di riserva","Lo elimina con le urine attraverso il rene","Lo trasforma in corpi chetonici, che poi cede al cervello durante il digiuno"],"ans":0,"why":"Il lattato è anche un combustibile, non solo uno scarto.","note":null,"fixed":false},{"id":"h5g-08","topic":"m5-glicerolo","level":"h","page":"141","src":"Biochimica II","q":"Qual è il percorso dell'alanina muscolare fino al glucosio?","opts":["Al fegato, dove la transaminazione dà piruvato per la gluconeogenesi","Viene ossidata nel muscolo a CO₂ e il carbonio non arriva al fegato","Diventa direttamente glicerolo nel tessuto adiposo","Entra nel fegato come acetil-CoA e attiva la piruvato carbossilasi","Diventa lattato nel muscolo, che poi viene ossidato dal cuore"],"ans":0,"why":"Il gruppo amminico va all'urea. È il ciclo glucosio-alanina (dettaglio con il metabolismo degli amminoacidi).","note":null,"fixed":false},{"id":"h5n-01","topic":"m5-regolazione","level":"h","page":"153–154","src":"Biochimica II","q":"Come agisce l'enzima bifunzionale PFK2/FBPasi2 dopo un pasto e a digiuno?","opts":["Pasto: defosforilato, sale il F2,6BP; digiuno: fosforilato, cala il F2,6BP","Pasto: fosforilato, degrada il F2,6BP; digiuno: defosforilato, lo produce","A digiuno produce più F2,6BP, che sostiene la gluconeogenesi nel fegato","È regolato solo dal glucosio, non da insulina e glucagone, in entrambe le fasi","Produce fruttosio 1,6-bisfosfato, che attiva la PFK1 dopo il pasto"],"ans":0,"why":"Dopo il pasto (insulina) lavora il dominio chinasico e prevale la glicolisi; a digiuno (glucagone, PKA) lavora il dominio fosfatasico e prevale la gluconeogenesi. Il F2,6BP attiva la PFK1 e inibisce la FBPasi1.","note":"Sbobina di Biochimica II, p. 154: c'è scritto che con l'insulina si attiva il dominio fosfatasico (N-terminale) e con il glucagone quello chinasico (C-terminale). È il contrario, come dice la stessa sbobina una pagina prima (p. 153): l'insulina attiva la chinasi (più F2,6BP), il glucagone la fosfatasi. Inoltre nel fegato il dominio chinasico è N-terminale e quello fosfatasico C-terminale.","fixed":false},{"id":"h5n-02","topic":"m5-regolazione","level":"h","page":"151–152","src":"Biochimica II","q":"Come fa l'insulina a ridurre la quantità di PEPCK nel fegato?","opts":["Tramite la PKB fa degradare FOXO1, che attiva il gene della PEPCK","Defosforila la PEPCK con la PP1 e la rende inattiva nel citosol","Inibisce allostericamente la PEPCK tramite il fruttosio 2,6-bisfosfato","Aumenta il cAMP, che tramite CREB reprime il gene della PEPCK","Attiva il GRE del promotore della PEPCK insieme al cortisolo"],"ans":0,"why":"La PKB fosforila FOXO1, che viene degradato (ubiquitina-proteasoma). La PEPCK è regolata soprattutto a livello di trascrizione.","note":"Sbobina di Biochimica II, p. 151: il fattore è chiamato «FOX1»; il nome corretto è FOXO1.","fixed":false},{"id":"h5n-03","topic":"m5-regolazione","level":"h","page":"151","src":"Biochimica II","q":"Quali elementi di risposta del promotore della PEPCK aumentano la sua trascrizione?","opts":["GRE, TRE e CRE","IRE, SRE e HRE","GRE, IRE e SRE","Solo il CRE","Nessuno: la PEPCK non è regolata a livello genico ma solo allostericamente"],"ans":0,"why":"GRE: glucocorticoidi; TRE: ormoni tiroidei; CRE: cAMP (glucagone). L'IRE (insulina) la riduce.","note":null,"fixed":false},{"id":"h5n-04","topic":"m5-regolazione","level":"h","page":"152","src":"Biochimica II","q":"Perché nel fegato la piruvato chinasi deve essere inibita durante la gluconeogenesi?","opts":["Per evitare il ciclo futile PEP → piruvato → PEP","Perché la piruvato chinasi produce glucosio","Perché la PK consuma il PEP solo nel muscolo e non nel fegato","Perché la PK attiva la PEPCK e la consuma","Non serve inibirla, perché nel fegato la PK non è espressa"],"ans":0,"why":"Il ciclo futile consumerebbe ATP e GTP. Il glucagone fosforila e inattiva la PK epatica (forma L); le altre cellule non fanno gluconeogenesi e la loro PK non risponde al glucagone.","note":null,"fixed":false},{"id":"h5n-05","topic":"m5-regolazione","level":"h","page":"155","src":"Biochimica II","q":"Quali effettori regolano allostericamente la fruttosio 1,6-bisfosfatasi?","opts":["È inibita da F2,6BP e AMP","È attivata da F2,6BP e AMP","È inibita dal citrato e dall'acetil-CoA","È attivata dall'insulina tramite la PKB","È inibita dal glucagone tramite la PKA, che la fosforila"],"ans":0,"why":"Quando servono glicolisi o energia, la gluconeogenesi si ferma: regolazione reciproca rispetto alla PFK1.","note":null,"fixed":false},{"id":"h5n-06","topic":"m5-regolazione","level":"h","page":"144–155","src":"Biochimica II","q":"Perché l'acetil-CoA prodotto dalla β-ossidazione notturna favorisce la gluconeogenesi epatica?","opts":["Attiva la piruvato carbossilasi e inibisce la PDH","Viene convertito direttamente in glucosio","Attiva la piruvato chinasi epatica e la PDH","Inibisce la PEPCK e attiva la PDH","Aumenta il F2,6BP e attiva la PFK1 nel fegato durante la notte"],"ans":0,"why":"Il piruvato viene indirizzato verso ossalacetato e glucosio invece che verso acetil-CoA. Gli acidi grassi danno al fegato l'energia per la gluconeogenesi, non il carbonio.","note":"Sbobina di Biochimica II, p. 155: il primo enzima regolato è chiamato «piruvato carbossichinasi»; è la piruvato carbossilasi.","fixed":false},{"id":"h5n-07","topic":"m5-regolazione","level":"h","page":"156–157","src":"Biochimica II","q":"Il glucagone aumenta la glicemia agendo contemporaneamente su più enzimi epatici. Quale combinazione è corretta?","opts":["Fosforilasi ↑, sintasi ↓, F2,6BP ↓, PK epatica ↓, PEPCK ↑","Fosforilasi ↓, sintasi ↑, PK epatica ↑, F2,6BP ↑","F2,6BP ↑ e PFK1 ↑, con glicolisi epatica attiva","Fosforilasi ↑, sintasi ↑, PEPCK ↓, glicolisi ↑","Agisce solo sulla glicogeno fosforilasi e non tocca la gluconeogenesi"],"ans":0,"why":"Tutti gli effetti partono da cAMP e PKA: fosforilazione di fosforilasi chinasi, glicogeno sintasi, PFK2/FBPasi2 e piruvato chinasi, più la trascrizione della PEPCK tramite CREB.","note":null,"fixed":false},{"id":"h5n-08","topic":"m5-regolazione","level":"h","page":"156","src":"Biochimica II","q":"Quali fattori stimolano e quali inibiscono la secrezione di glucagone?","opts":["Stimolano ipoglicemia, amminoacidi e catecolamine; inibiscono iperglicemia e insulina","Stimolano iperglicemia e insulina; inibiscono ipoglicemia, amminoacidi e catecolamine","Stimolano acidi grassi e corpi chetonici; inibiscono gli amminoacidi e l'ipoglicemia","Stimolano somatostatina e insulina; inibiscono adrenalina, noradrenalina e amminoacidi","Il glucagone viene secreto in modo costante, indipendentemente dalla glicemia"],"ans":0,"why":"Gli amminoacidi stimolano sia insulina sia glucagone: così un pasto proteico non causa ipoglicemia.","note":null,"fixed":false},{"id":"h5a-01","topic":"m5-approfondimenti","level":"h","page":"158","src":"Biochimica II","q":"Una persona a digiuno beve molto alcol la sera e va in ipoglicemia. Quale meccanismo?","opts":["Il NADH prodotto dall'etanolo blocca lattato → piruvato e malato → ossalacetato","L'etanolo stimola la secrezione di insulina dalle cellule β anche a digiuno","L'etanolo attiva la glicogeno sintasi e sottrae glucosio al sangue durante la notte","L'acetaldeide inibisce la glucosio 6-fosfatasi del reticolo","L'etanolo viene trasformato in glicogeno e il fegato smette di liberare glucosio nel sangue"],"ans":0,"why":"L'ossidazione dell'etanolo (alcol e aldeide deidrogenasi) aumenta il NADH citosolico e la gluconeogenesi si ferma. A digiuno il glicogeno è già esaurito.","note":"Sbobina di Biochimica II, p. 158: c'è scritto che l'acetaldeide «viene ulteriormente ossidata ad ossalacetato». Viene ossidata ad acetato.","fixed":false},{"id":"h5a-02","topic":"m5-approfondimenti","level":"h","page":"157","src":"Biochimica II","q":"Nel digiuno prolungato (oltre alcuni giorni) la gluconeogenesi diminuisce. Perché e come si compensa?","opts":["Per risparmiare le proteine muscolari; il cervello usa i corpi chetonici","Perché finisce il glicerolo e la gluconeogenesi non ha substrati","Perché aumenta l'insulina, che blocca la PEPCK; il cervello usa lattato","Perché il cervello smette di consumare glucosio; il muscolo usa acidi grassi","Perché il glicogeno epatico si ricostituisce e sostituisce la gluconeogenesi"],"ans":0,"why":"Le proteine muscolari sono la principale fonte di substrati; il fegato produce corpi chetonici che il cervello impara a usare. Nell'anoressia grave questo risparmio non riesce.","note":null,"fixed":false},{"id":"h5a-03","topic":"m5-approfondimenti","level":"h","page":"158–159","src":"Biochimica II","q":"Quale distribuzione metabolica nel lobulo epatico è corretta secondo il corso?","opts":["Periportali: β-ossidazione, gluconeogenesi, urea; perivenosi: glicolisi, lipogenesi","Tutti gli epatociti fanno le stesse vie con la stessa intensità, senza zonazione","Periportali: glicolisi e lipogenesi; perivenosi: gluconeogenesi e urea","Solo i perivenosi fanno gluconeogenesi e urea, perché ricevono più ossigeno","Perivenosi: urea e β-ossidazione; periportali: sintesi di glutammina e lipoproteine"],"ans":0,"why":"I periportali ricevono più O₂; i perivenosi sintetizzano anche glutammina. È un gradiente plastico: in caso di danno le zone possono cambiare funzione.","note":null,"fixed":false},{"id":"h5a-04","topic":"m5-approfondimenti","level":"h","page":"153","src":"Biochimica II","q":"Nel topo transgenico con PEPCK sovraespressa nel muscolo, quale fenotipo è stato osservato?","opts":["Corsa molto più lunga, più acidi grassi, meno lattato, ma aggressività","Ipoglicemia grave e incapacità di correre per esaurimento del glucosio","Obesità e diabete per eccesso di gluconeogenesi nel muscolo","Incapacità di correre a lungo per accumulo di lattato nel muscolo","Accumulo di glicogeno muscolare e ridotta sensibilità all'insulina"],"ans":0,"why":"Avevano anche più mitocondri e più sensibilità all'insulina. Un singolo enzima può cambiare l'intero metabolismo.","note":null,"fixed":false},{"id":"h5a-05","topic":"m5-approfondimenti","level":"h","page":"156","src":"Biochimica II","q":"Nei primi giorni di jet lag, che cosa succede alla regolazione notturna della glicemia?","opts":["La PEPCK resta sull'orario di partenza: glicemia notturna meno regolata","La gluconeogenesi si blocca definitivamente dopo il viaggio","La glicemia aumenta di notte per un eccesso di insulina circolante","Il glicogeno epatico non viene più usato durante la notte","Non cambia nulla, perché la melatonina regola subito anche la PEPCK"],"ans":0,"why":"La sintesi circadiana di PEPCK è guidata dal cortisolo. Il consiglio della sbobina è spostare la cena più tardi nei primi giorni.","note":null,"fixed":false},{"id":"h5a-06","topic":"m5-approfondimenti","level":"h","page":"149","src":"Biochimica II","q":"Un paziente diabetico inizia una terapia con cortisone ad alte dosi. Che cosa ti aspetti sulla glicemia e perché?","opts":["Peggiora: più gluconeogenesi e meno sensibilità all'insulina","Migliora, per l'effetto antinfiammatorio sulle isole del pancreas","Ipoglicemia, per aumento della secrezione di insulina dalle cellule β","Nessun effetto sulla glicemia, solo sull'infiammazione","Cala per aumento della glicogenolisi muscolare, che consuma glucosio"],"ans":0,"why":"Il cortisone è un farmaco «da maneggiare con cura» nei diabetici.","note":null,"fixed":false},{"id":"h5a-07","topic":"m5-approfondimenti","level":"h","page":"156","src":"Biochimica II","q":"Perché le cellule α del pancreas, con GLUT1, aumentano la secrezione di glucagone quando la glicemia cala?","opts":["Un flusso costante di glucosio inibisce il glucagone; se cala, la cellula α si attiva","Il GLUT1 trasporta il glucagone fuori dalla cellula α quando la glicemia cala","Le cellule α hanno GLUT2 e si comportano come le β, ma con segnale invertito","L'insulina attiva le cellule α durante l'ipoglicemia tramite il recettore tirosin-chinasico","Le cellule α sono insensibili al glucosio e rispondono solo alle catecolamine"],"ans":0,"why":"È l'ipotesi del corso. Si è visto anche che, se le cellule β sono danneggiate, alcune cellule α possono trasformarsi in β.","note":null,"fixed":false},{"id":"h5a-08","topic":"m5-approfondimenti","level":"h","page":"157","src":"Biochimica II","q":"Perché una terapia cortisonica prolungata (es. in un paziente oncologico) porta a perdita di massa muscolare?","opts":["Mantiene una gluconeogenesi continua dalle proteine muscolari","Inibisce la sintesi di glicogeno muscolare, che viene degradato","Blocca la β-ossidazione nel muscolo, che consuma allora le proteine","Aumenta l'insulina e la lipogenesi, sottraendo amminoacidi al muscolo","Inibisce la PEPCK epatica e costringe il muscolo a produrre glucosio"],"ans":0,"why":"È lo stesso meccanismo del digiuno prolungato senza risparmio proteico.","note":null,"fixed":false},{"id":"h6r-01","topic":"m6-reazioni","level":"h","page":"160","src":"Biochimica II","q":"Quale sequenza descrive la fase ossidativa della via dei pentoso fosfati?","opts":["G6PD → lattonasi → 6-fosfogluconato deidrogenasi","Isomerasi → G6PD → lattonasi","Lattonasi → G6PD → 6-fosfogluconato deidrogenasi","Fosfoglucoisomerasi → G6PD → transchetolasi","Transchetolasi → transaldolasi → G6PD, con produzione di 2 NADPH"],"ans":0,"why":"G6P → 6-fosfogluconolattone (NADPH) → 6-fosfogluconato → ribulosio 5-P + CO₂ (NADPH). Per ogni G6P: 2 NADPH e 1 CO₂.","note":null,"fixed":false},{"id":"h6r-02","topic":"m6-reazioni","level":"h","page":"162","src":"Biochimica II","q":"Quale bilancio corrisponde alla completa ossidazione di 6 G6P tramite la via dei pentoso fosfati con ricircolo (fase ricombinativa + gluconeogenesi)?","opts":["5 G6P + 6 CO₂ + 12 NADPH","6 ribosio 5-P + 6 NADPH","5 G6P + 1 CO₂ + 2 NADPH","12 piruvato + 12 NADPH","6 CO₂ + 6 NADPH, senza G6P residuo"],"ans":0,"why":"6 G6P + 12 NADP⁺ → 5 G6P + 6 CO₂ + 12 NADPH: in pratica un G6P è ossidato a 6 CO₂.","note":"Sbobina di Biochimica II, p. 162: c'è scritto che delle 6 molecole di glucosio «se ne perde una sottoforma di anidride carbonica». Più precisamente si liberano 6 CO₂ (una per ciascun G6P entrato), che equivalgono a un glucosio.","fixed":false},{"id":"h6r-03","topic":"m6-reazioni","level":"h","page":"162–163","src":"Biochimica II","q":"Quale enzima della fase ricombinativa usa la tiamina pirofosfato e che cosa trasferisce?","opts":["Transchetolasi: unità a 2 C","Transaldolasi: unità a 3 C","Ribosio 5-P isomerasi: unità a 1 C","G6PD: unità a 2 C","Lattonasi: unità a 3 C, con apertura dell'anello"],"ans":0,"why":"La transchetolasi trasferisce unità a 2 C da un chetoso (es. xilulosio 5-P) a un aldoso. La transaldolasi (unità a 3 C) non ha coenzimi.","note":null,"fixed":false},{"id":"h6r-04","topic":"m6-reazioni","level":"h","page":"162–163","src":"Biochimica II","q":"Un alcolista con carenza di tiamina. Quale attività della via dei pentoso fosfati si riduce e come si può dosare?","opts":["La transchetolasi, dosabile negli eritrociti","La G6PD, dosabile con il NADPH negli eritrociti","La transaldolasi, dosabile nel plasma","La 6-fosfogluconato deidrogenasi, dosabile nel fegato","La lattonasi, dosabile nelle urine come 6-fosfogluconato"],"ans":0,"why":"La transchetolasi è TPP-dipendente. Il test della transchetolasi eritrocitaria non è nelle sbobine (Lehninger).","note":null,"fixed":false},{"id":"h6r-05","topic":"m6-reazioni","level":"h","page":"164","src":"Biochimica II","q":"Una cellula in rapida divisione ha bisogno di molto ribosio 5-P ma di poco NADPH. Quale percorso usa?","opts":["Usa al contrario la fase non ossidativa partendo da F6P e GAP","Fa solo la fase ossidativa e scarta il NADPH prodotto","Converte il NADPH in eccesso in ribosio 5-fosfato con una reduttasi","Usa la gluconeogenesi per ottenere il ribosio dal piruvato","Ossida il ribosio a CO₂ per smaltire il NADPH e poi lo risintetizza dal G6P"],"ans":0,"why":"Salta la fase ossidativa: le reazioni di transchetolasi e transaldolasi sono reversibili.","note":null,"fixed":false},{"id":"h6r-06","topic":"m6-reazioni","level":"h","page":"164","src":"Biochimica II","q":"Una cellula ha bisogno sia di NADPH sia di ribosio 5-P in proporzioni simili. Quale parte della via è attiva?","opts":["Solo la fase ossidativa","Solo la fase ricombinativa","Tutta la via con ricircolo","Solo la glicolisi","La gluconeogenesi, che produce sia NADPH sia ribosio dal lattato"],"ans":0,"why":"Il ribulosio 5-P viene isomerizzato a ribosio 5-P e usato per i nucleotidi. È la seconda finalità della via nella sbobina.","note":null,"fixed":false},{"id":"h6r-07","topic":"m6-reazioni","level":"h","page":"164","src":"Biochimica II","q":"Un adipocita sta sintetizzando acidi grassi e ha bisogno solo di NADPH. Che fine fanno i pentosi?","opts":["Tornano F6P e GAP con la fase ricombinativa","Si accumulano come ribosio 5-fosfato nel citosol","Vengono eliminati come ribosio libero","Diventano glicogeno nell'adipocita","Vengono ossidati a CO₂ nella fase ricombinativa, producendo altro NADPH"],"ans":0,"why":"F6P e GAP rientrano in glicolisi o, nel fegato, possono tornare a G6P (ricircolo).","note":"Sbobina di Biochimica II, p. 164: il ritorno da F6P e GAP a G6P viene chiamato «gluconeogenesi» e si dice che avviene solo nel fegato. Usa gli enzimi della gluconeogenesi (es. FBPasi1), ma la gluconeogenesi in senso stretto parte da precursori non glucidici.","fixed":false},{"id":"h6r-08","topic":"m6-reazioni","level":"h","page":"160","src":"Biochimica II","q":"Che cosa distingue il NADPH dal NADH e perché è importante?","opts":["Un fosfato in 2' sul ribosio: gli enzimi distinguono i due pool","Il NADPH ha un'adenina in più che lega le reduttasi","Il NADPH porta 4 elettroni invece di 2: serve alle biosintesi","Il NADPH si trova solo nel mitocondrio: i pool sono separati","Non ci sono differenze funzionali: gli enzimi usano indifferentemente NADH e NADPH"],"ans":0,"why":"Il pool NADPH (anabolico) è soprattutto ridotto, il pool NAD⁺ (catabolico) soprattutto ossidato.","note":null,"fixed":false},{"id":"h6g-01","topic":"m6-regolazione","level":"h","page":"165","src":"Biochimica II","q":"Qual è il principale punto di controllo della via dei pentoso fosfati?","opts":["La G6PD, controllata dal rapporto NADP⁺/NADPH","La transchetolasi, inibita dalla tiamina","La transaldolasi, attivata dal F6P","La ribosio 5-P isomerasi, inibita dall'ATP","La 6-fosfogluconato deidrogenasi, inibita dal ribosio 5-fosfato"],"ans":0,"why":"Il NADPH la inibisce, il NADP⁺ prodotto dalle biosintesi la attiva: il flusso segue il consumo di NADPH.","note":null,"fixed":false},{"id":"h6g-02","topic":"m6-regolazione","level":"h","page":"165","src":"Biochimica II","q":"In un epatocita dopo un pasto ricco di carboidrati, la sintesi di acidi grassi è molto attiva. Che cosa succede alla via dei pentoso fosfati?","opts":["Il NADP⁺ aumenta e la G6PD accelera","Il NADPH è alto e la via si blocca","La via si sposta nel mitocondrio","La via produce NADH invece di NADPH","Non cambia nulla, perché la via è regolata solo dagli ormoni"],"ans":0,"why":"Il NADPH viene consumato dalla sintesi degli acidi grassi e il flusso del G6P nella via aumenta. Non è nelle sbobine che l'insulina aumenta anche la sintesi di G6PD.","note":null,"fixed":false},{"id":"h6g-03","topic":"m6-regolazione","level":"h","page":"159","src":"Biochimica II","q":"In quali tessuti la via dei pentoso fosfati è particolarmente attiva e perché?","opts":["Fegato, adiposo, mammella, surrene, eritrociti, tessuti proliferanti","Solo muscolo scheletrico e cuore, per l'alto consumo di ATP","Solo cervello e retina, che dipendono dal glucosio e dal NADPH","Solo i tessuti che fanno gluconeogenesi, cioè fegato e rene","Solo gli eritrociti, perché non hanno mitocondri e altre vie per il NADPH"],"ans":0,"why":"Biosintesi di lipidi e steroid
