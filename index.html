xed":false},{"id":"m1e-07","topic":"m1-enzimologia","level":"a","page":"29","src":"Biochimica II","q":"Perché le reazioni vicine all'equilibrio non sono buoni punti di regolazione?","opts":["Perché i loro enzimi sono troppo lenti","Perché il flusso netto dipende dalle concentrazioni di reagenti e prodotti: cambiare l'enzima non sposta il verso","Perché non hanno bisogno di coenzimi","Perché avvengono solo nel mitocondrio"],"ans":1,"why":"Il controllo del flusso si esercita sulle tappe lontane dall'equilibrio, catalizzate da enzimi allosterici.","note":null,"fixed":false},{"id":"m1e-08","topic":"m1-enzimologia","level":"l","page":"27","src":"Biochimica II","q":"Come si chiama la costante k₂ in Vmax = k₂[E]?","opts":["Costante catalitica (kcat)","Costante di Michaelis","Costante di dissociazione","Costante di specificità"],"ans":0,"why":"kcat è il numero di molecole di substrato trasformate per sito attivo al secondo. kcat/KM è la costante di specificità.","note":null,"fixed":false},{"id":"m1e-09","topic":"m1-enzimologia","level":"l","page":"42","src":"Biochimica II","q":"Un enzima con kcat/KM vicino a 10⁸–10⁹ M⁻¹ s⁻¹ si dice:","opts":["A perfezione catalitica (limitato dalla diffusione)","Allosterico","Saturato","Inibito"],"ans":0,"why":"È il caso della trioso fosfato isomerasi: il limite è l'incontro tra enzima e substrato.","note":null,"fixed":false},{"id":"m1e-10","topic":"m1-enzimologia","level":"l","page":"29","src":"Biochimica II","q":"Quali residui hanno l'ossidrile usato dalle serina/treonina chinasi per legare il fosfato?","opts":["Serina e treonina","Tirosina e triptofano","Cisteina e metionina","Aspartato e glutammato"],"ans":0,"why":"Si forma un fosfoestere con l'OH della catena laterale. Esistono anche tirosina chinasi (recettori per l'insulina).","note":null,"fixed":false},{"id":"m2i-01","topic":"m2-ingresso","level":"f","page":"31","src":"Biochimica II","q":"Quale enzima digerisce l'amido nella bocca e nell'intestino?","opts":["α-amilasi","β-amilasi","Lattasi","Glicogeno fosforilasi"],"ans":0,"why":"L'α-amilasi salivare e pancreatica scinde i legami α1-4; l'uomo non ha enzimi per i legami β della cellulosa.","note":null,"fixed":false},{"id":"m2i-02","topic":"m2-ingresso","level":"f","page":"33","src":"Biochimica II","q":"Quale trasportatore è richiamato sulla membrana dall'insulina?","opts":["GLUT1","GLUT2","GLUT3","GLUT4"],"ans":3,"why":"Muscolo scheletrico, cuore e tessuto adiposo: i GLUT4 stanno in vescicole e l'insulina ne fa fondere le vescicole con la membrana.","note":null,"fixed":false},{"id":"m2i-03","topic":"m2-ingresso","level":"f","page":"33","src":"Biochimica II","q":"Quanti segmenti transmembrana hanno i trasportatori GLUT?","opts":["7","12","4","24"],"ans":1,"why":"Struttura comune a 12 eliche transmembrana, con due conformazioni (T1 verso l'esterno, T2 verso l'interno).","note":null,"fixed":false},{"id":"m2i-04","topic":"m2-ingresso","level":"m","page":"32","src":"Biochimica II","q":"Come entra il glucosio dal lume intestinale nell'enterocita?","opts":["Per diffusione facilitata con GLUT2","In simporto con Na⁺ tramite SGLT1, sfruttando il gradiente mantenuto dalla pompa Na⁺/K⁺","Per endocitosi","Con un'ATPasi specifica per il glucosio"],"ans":1,"why":"È un trasporto attivo secondario: l'SGLT1 non consuma ATP, lo consuma la Na⁺/K⁺-ATPasi.","note":"Sbobina di Biochimica II, p. 32: chiama il trasportatore «SGLUT1» e lo descrive prima come «trasportatore attivo che utilizza ATP». Il nome corretto è SGLT1 ed è attivo secondario.","fixed":false},{"id":"m2i-05","topic":"m2-ingresso","level":"m","page":"34","src":"Biochimica II","q":"Perché il cervello riceve glucosio anche a glicemia bassa?","opts":["Perché usa GLUT2, ad alta capacità","Perché GLUT1 (barriera ematoencefalica) e GLUT3 (neuroni) hanno Kt molto basse","Perché è insulino-dipendente","Perché usa SGLT1"],"ans":1,"why":"GLUT3 ha Kt ≈ 0,1 mM: lavora vicino alla saturazione anche con poco glucosio.","note":null,"fixed":false},{"id":"m2i-06","topic":"m2-ingresso","level":"m","page":"34","src":"Biochimica II","q":"Che cosa innesca la secrezione di insulina nella cellula β?","opts":["L'aumento di ATP, che chiude i canali K⁺, depolarizza e fa entrare Ca²⁺","L'apertura dei canali K⁺","Il legame del glucosio a un recettore di membrana","L'aumento di AMP ciclico da glucagone"],"ans":0,"why":"Glucosio → GLUT2 → glucochinasi → glicolisi e fosforilazione ossidativa → ATP ↑ → canali K⁺ chiusi → Ca²⁺ in entrata → esocitosi.","note":null,"fixed":false},{"id":"m2i-07","topic":"m2-ingresso","level":"a","page":"33–34","src":"Biochimica II","q":"Dopo un pasto la glicemia passa da 4,5 a 9 mM. Quale trasportatore aumenta di più il suo flusso?","opts":["GLUT1 (Kt 3 mM)","GLUT2 (Kt 17 mM)","GLUT3 (Kt 0,1 mM)","Aumentano tutti in proporzione uguale"],"ans":1,"why":"Con Kt alta il GLUT2 è lontano dalla saturazione e il flusso cresce quasi in proporzione alla glicemia: per questo fegato e pancreas «sentono» il pasto.","note":null,"fixed":false},{"id":"m2i-08","topic":"m2-ingresso","level":"a","page":"36","src":"Biochimica II","q":"Paziente con iperglicemia e peptide C assente. Che cosa indica?","opts":["Insulino-resistenza con produzione normale di insulina","Mancata produzione di insulina (deficit delle cellule β)","Eccesso di glucagone","Difetto dei GLUT2 epatici"],"ans":1,"why":"Il peptide C si libera dal taglio della proinsulina: se manca, l'insulina non viene prodotta. Se è normale con iperglicemia, il problema è la resistenza (GLUT4).","note":null,"fixed":false},{"id":"m2i-09","topic":"m2-ingresso","level":"l","page":"31","src":"Biochimica II","q":"Quale enzima dell'orletto a spazzola scinde i frammenti di amido con legami α1-6 (destrine limite)?","opts":["Isomaltasi","Saccarasi","Lattasi","Maltasi acida"],"ans":0,"why":"L'isomaltasi (α-destrinasi) completa la digestione dell'amilopectina; saccarasi e lattasi agiscono su saccarosio e lattosio.","note":null,"fixed":false},{"id":"m2i-10","topic":"m2-ingresso","level":"l","page":"33","src":"Biochimica II","q":"Che cosa indica la Kt di un GLUT?","opts":["La concentrazione di glucosio a cui il trasporto è a metà della velocità massima","Il numero di glucosi trasportati al secondo","La costante di equilibrio del trasporto","La concentrazione intracellulare di glucosio"],"ans":0,"why":"È l'equivalente della KM per un trasportatore: più è bassa, più il trasportatore è affine.","note":null,"fixed":false},{"id":"m2f-01","topic":"m2-fosforilazione","level":"f","page":"37","src":"Biochimica II","q":"Quale enzima fosforila il glucosio negli epatociti?","opts":["Esochinasi I","Glucochinasi (esochinasi IV)","Fosfoglucomutasi","Glucosio 6-fosfatasi"],"ans":1,"why":"Fegato e cellule β del pancreas usano la glucochinasi, a bassa affinità.","note":null,"fixed":false},{"id":"m2f-02","topic":"m2-fosforilazione","level":"f","page":"38","src":"Biochimica II","q":"Perché il glucosio fosforilato resta intrappolato nella cellula?","opts":["Perché il G6P è carico negativamente e non ha trasportatori","Perché si lega alle proteine","Perché viene subito polimerizzato","Perché è più grande"],"ans":0,"why":"Le cariche negative del fosfato impediscono l'uscita attraverso i GLUT.","note":null,"fixed":false},{"id":"m2f-03","topic":"m2-fosforilazione","level":"m","page":"55","src":"Biochimica II","q":"Come viene regolata l'esochinasi ubiquitaria?","opts":["È inibita dal suo prodotto, il glucosio 6-fosfato","È attivata dall'insulina","È inibita dall'ATP","È sequestrata nel nucleo"],"ans":0,"why":"Il G6P si lega a un sito allosterico e la inibisce.","note":null,"fixed":false},{"id":"m2f-04","topic":"m2-fosforilazione","level":"m","page":"55–56","src":"Biochimica II","q":"Come viene regolata la glucochinasi epatica?","opts":["Per compartimentazione: legata a una proteina regolatrice nel nucleo è inattiva, nel citosol è attiva","Per inibizione da glucosio 6-fosfato","Per fosforilazione da PKA","Non è regolata"],"ans":0,"why":"Molto glucosio libera la glucochinasi dalla proteina regolatrice; il fruttosio 6-P la riporta nel nucleo.","note":null,"fixed":false},{"id":"m2f-05","topic":"m2-fosforilazione","level":"m","page":"40","src":"Biochimica II","q":"Perché l'esochinasi chiude il sito attivo quando legano glucosio e ATP (adattamento indotto)?","opts":["Per escludere l'acqua ed evitare l'idrolisi improduttiva dell'ATP","Per aumentare la KM","Per legare il Mg²⁺","Per far uscire il G6P"],"ans":0,"why":"Il fosfato γ deve andare sul C6 del glucosio, non all'acqua.","note":null,"fixed":false},{"id":"m2f-06","topic":"m2-fosforilazione","level":"a","page":"37–38","src":"Biochimica II","q":"Perché il fegato usa un enzima con KM alta per il glucosio?","opts":["Per fosforilare il glucosio solo quando la glicemia è alta, lasciandolo prima agli altri organi","Perché così consuma meno ATP","Perché la glucochinasi è più veloce dell'esochinasi a ogni concentrazione","Per inibire la glicolisi"],"ans":0,"why":"A digiuno la glucochinasi lavora poco e il glucosio resta disponibile per cervello ed eritrociti; dopo il pasto il fegato immagazzina l'eccesso.","note":null,"fixed":false},{"id":"m2f-07","topic":"m2-fosforilazione","level":"a","page":"38","src":"Biochimica II","q":"Il glucosio 6-fosfato è un crocevia. Quale via non parte da lui?","opts":["Glicolisi","Via dei pentoso fosfati","Sintesi del glicogeno","β-ossidazione"],"ans":3,"why":"Il G6P va in glicolisi, pentoso fosfati, glicogeno o (nel fegato) torna glucosio.","note":null,"fixed":false},{"id":"m2f-08","topic":"m2-fosforilazione","level":"l","page":"37","src":"Biochimica II","q":"Come si chiama anche la glucochinasi?","opts":["Esochinasi IV","Esochinasi II","Fruttochinasi","Fosfoesoso chinasi"],"ans":0,"why":"È l'isoenzima IV della famiglia delle esochinasi.","note":null,"fixed":false},{"id":"m2f-09","topic":"m2-fosforilazione","level":"l","page":"37","src":"Biochimica II","q":"Quanto vale circa la KM dell'esochinasi per il glucosio secondo la sbobina?","opts":["0,1 mM","10 mM","1 mM","17 mM"],"ans":0,"why":"Esochinasi ≈ 0,1 mM, glucochinasi ≈ 10 mM: circa 100 volte di differenza.","note":null,"fixed":false},{"id":"m2g-01","topic":"m2-glicolisi","level":"f","page":"38","src":"Biochimica II","q":"Dove avviene la glicolisi?","opts":["Nel citosol","Nella matrice mitocondriale","Nel reticolo endoplasmatico","Nel nucleo"],"ans":0,"why":"È una via citosolica e non richiede ossigeno.","note":null,"fixed":false},{"id":"m2g-02","topic":"m2-glicolisi","level":"f","page":"47","src":"Biochimica II","q":"Bilancio netto della glicolisi per una molecola di glucosio:","opts":["2 piruvato, 2 ATP, 2 NADH","2 piruvato, 4 ATP, 2 NADH","2 lattato, 2 ATP","2 acetil-CoA, 2 ATP, 2 NADH"],"ans":0,"why":"4 ATP prodotti − 2 spesi = 2 netti; 2 NADH dalla gliceraldeide 3-P deidrogenasi.","note":null,"fixed":false},{"id":"m2g-03","topic":"m2-glicolisi","level":"f","page":"39","src":"Biochimica II","q":"Quale enzima scinde il fruttosio 1,6-bisfosfato in due triosi?","opts":["Aldolasi","Trioso fosfato isomerasi","Enolasi","Fosfofruttochinasi 1"],"ans":0,"why":"Si formano diidrossiacetone fosfato e gliceraldeide 3-fosfato.","note":null,"fixed":false},{"id":"m2g-04","topic":"m2-glicolisi","level":"f","page":"44","src":"Biochimica II","q":"Quante reazioni di fosforilazione a livello del substrato ci sono nella glicolisi?","opts":["Una","Due","Tre","Quattro"],"ans":1,"why":"Fosfoglicerato chinasi e piruvato chinasi.","note":null,"fixed":false},{"id":"m2g-05","topic":"m2-glicolisi","level":"m","page":"41","src":"Biochimica II","q":"Perché la reazione dell'aldolasi procede verso destra pur avendo ΔG°' positivo?","opts":["Perché i triosi vengono consumati subito e il ΔG reale diventa vicino a zero","Perché è accoppiata all'idrolisi di ATP","Perché è irreversibile","Perché è attivata dall'AMP"],"ans":0,"why":"Per legge di azione di massa: nelle concentrazioni cellulari il ΔG è circa −0,2 kJ/mol.","note":null,"fixed":false},{"id":"m2g-06","topic":"m2-glicolisi","level":"m","page":"43","src":"Biochimica II","q":"Che cosa succede nella reazione della gliceraldeide 3-fosfato deidrogenasi?","opts":["L'aldeide viene ossidata e il fosfato inorganico forma un legame anidridico misto ad alta energia","Viene consumato ATP","Si forma CO₂","Viene ridotto il FAD"],"ans":0,"why":"È l'unica ossidoriduzione della glicolisi: si forma 1,3-BPG e NADH.","note":null,"fixed":false},{"id":"m2g-07","topic":"m2-glicolisi","level":"m","page":"45","src":"Biochimica II","q":"Perché la piruvato chinasi è così esoergonica?","opts":["Perché la forma enolica del piruvato tautomerizza subito nella forma chetonica, molto più stabile","Perché consuma due ATP","Perché libera CO₂","Perché il PEP è un tioestere"],"ans":0,"why":"L'idrolisi del PEP (−62 kJ/mol) basta a formare ATP (+30) con ΔG°' complessivo di circa −32 kJ/mol.","note":null,"fixed":false},{"id":"m2g-08","topic":"m2-glicolisi","level":"m","page":"47","src":"Biochimica II","q":"La glicolisi è un processo:","opts":["Acidificante, perché produce 2 H⁺","Alcalinizzante","Neutro","Che consuma protoni"],"ans":0,"why":"Glucosio + 2 NAD⁺ + 2 ADP + 2 Pi → 2 piruvato + 2 NADH + 2 H⁺ + 2 ATP + 2 H₂O.","note":null,"fixed":false},{"id":"m2g-09","topic":"m2-glicolisi","level":"a","page":"43","src":"Biochimica II","q":"Lo iodoacetato blocca la glicolisi. Su quale enzima agisce e come?","opts":["Gliceraldeide 3-P deidrogenasi, alchilando la cisteina del sito attivo","Piruvato chinasi, competendo con il PEP","Aldolasi, legando il FBP","Esochinasi, sostituendo l'ATP"],"ans":0,"why":"Il gruppo SH della cisteina catalitica viene legato covalentemente e l'enzima perde l'attività.","note":null,"fixed":false},{"id":"m2g-10","topic":"m2-glicolisi","level":"a","page":"47","src":"Biochimica II","q":"Se in una soluzione con tutti gli enzimi glicolitici manca il NAD⁺, dove si ferma la via?","opts":["Alla gliceraldeide 3-fosfato","Al fruttosio 1,6-bisfosfato","Al fosfoenolpiruvato","Non si ferma"],"ans":0,"why":"La gliceraldeide 3-P deidrogenasi richiede NAD⁺: per questo il NADH va sempre riossidato (fermentazione o navette).","note":null,"fixed":false},{"id":"m2g-11","topic":"m2-glicolisi","level":"a","page":"47","src":"Biochimica II","q":"Delle reazioni della glicolisi, quale ha ΔG°' negativo ma ΔG reale vicino a zero nella cellula?","opts":["Fosfoglicerato chinasi","Piruvato chinasi","Fosfofruttochinasi 1","Esochinasi"],"ans":0,"why":"Con le concentrazioni reali la fosfoglicerato chinasi è all'equilibrio, per questo non è un punto di regolazione.","note":null,"fixed":false},{"id":"m2g-12","topic":"m2-glicolisi","level":"a","page":"45","src":"Biochimica II","q":"Come funziona la fosfoglicerato mutasi?","opts":["Un'istidina fosforilata cede il fosfato al C2 (intermedio 2,3-BPG), poi riprende quello in C3","Sposta direttamente il fosfato dal C3 al C2 senza intermedi","Usa ATP per fosforilare il C2","Idrolizza il fosfato in C3"],"ans":0,"why":"L'enzima va attivato con il 2,3-bisfosfoglicerato, che lo fosforila.","note":null,"fixed":false},{"id":"m2g-13","topic":"m2-glicolisi","level":"l","page":"40","src":"Biochimica II","q":"Nella glicolisi, come si chiama l'enzima che converte il glucosio 6-fosfato in fruttosio 6-fosfato?","opts":["Fosfoesoso isomerasi (fosfoglucosio isomerasi)","Fosfoglucomutasi","Trioso fosfato isomerasi","Fosfofruttochinasi 2"],"ans":0,"why":"Aldoso → chetoso. Non va confusa con la fosfoglucomutasi (G1P ⇌ G6P).","note":null,"fixed":false},{"id":"m2g-14","topic":"m2-glicolisi","level":"l","page":"39","src":"Biochimica II","q":"Nell'aldolasi, quali carboni del fruttosio 1,6-bisfosfato diventano il diidrossiacetone fosfato?","opts":["C1–C3","C4–C6","C2–C4","C1, C2, C6"],"ans":0,"why":"La scissione è tra C3 e C4: C1–C3 → DHAP, C4–C6 → gliceraldeide 3-P.","note":null,"fixed":false},{"id":"m2g-15","topic":"m2-glicolisi","level":"l","page":"40","src":"Biochimica II","q":"Il prodotto della gliceraldeide 3-P deidrogenasi si chiama:","opts":["1,3-bisfosfoglicerato","2,3-bisfosfoglicerato","3-fosfoglicerato","Glicerolo 3-fosfato"],"ans":0,"why":"Il fosfato aggiunto è in C1 (anidride mista), quello in C3 era già presente.","note":null,"fixed":false},{"id":"m2g-16","topic":"m2-glicolisi","level":"l","page":"41","src":"Biochimica II","q":"Nella glicolisi la reazione della PFK1 forma quale legame?","opts":["Fosfoestere sul C1 del fruttosio 6-P","Fosfoanidridico","Glicosidico","Tioestere"],"ans":0,"why":"Il fosfato γ dell'ATP esterifica l'OH del C1.","note":null,"fixed":false},{"id":"m2r-01","topic":"m2-fermentazioni","level":"f","page":"49","src":"Biochimica II","q":"Qual è lo scopo della fermentazione lattica?","opts":["Rigenerare NAD⁺ per la glicolisi","Produrre ATP aggiuntivo","Eliminare il piruvato in eccesso","Produrre glucosio"],"ans":0,"why":"Senza NAD⁺ la gliceraldeide 3-P deidrogenasi si ferma; la LDH riossida il NADH riducendo il piruvato.","note":null,"fixed":false},{"id":"m2r-02","topic":"m2-fermentazioni","level":"f","page":"49","src":"Biochimica II","q":"Quali cellule fanno sempre fermentazione lattica?","opts":["Eritrociti","Epatociti","Cardiomiociti","Neuroni"],"ans":0,"why":"Non hanno mitocondri.","note":null,"fixed":false},{"id":"m2r-03","topic":"m2-fermentazioni","level":"m","page":"50","src":"Biochimica II","q":"Quanti isoenzimi della LDH esistono e perché?","opts":["5, dalle combinazioni di subunità H e M nel tetramero","2, H e M","4, uno per subunità","3, cuore, muscolo e fegato"],"ans":0,"why":"H4, H3M, H2M2, HM3, M4.","note":null,"fixed":false},{"id":"m2r-04","topic":"m2-fermentazioni","level":"m","page":"53","src":"Biochimica II","q":"Nella fermentazione alcolica, quali sono le due tappe?","opts":["Decarbossilazione del piruvato ad acetaldeide, poi riduzione ad etanolo con NADH","Riduzione del piruvato a lattato, poi decarbossilazione","Ossidazione dell'acetaldeide ad acetato","Carbossilazione del piruvato"],"ans":0,"why":"La prima è irreversibile (si perde CO₂), la seconda reversibile (alcol deidrogenasi).","note":null,"fixed":false},{"id":"m2r-05","topic":"m2-fermentazioni","level":"a","page":"52","src":"Biochimica II","q":"Secondo la sbobina, perché la riduzione del piruvato a lattato non acidifica la cellula?","opts":["Perché la LDH consuma un H⁺ (NADH + H⁺) e il lattato esce con un H⁺ dal trasportatore dei monocarbossilati","Perché il lattato è un acido debole","Perché la reazione libera OH⁻","Perché il lattato viene subito ossidato"],"ans":0,"why":"L'acidificazione muscolare viene soprattutto dall'idrolisi dell'ATP; il lattato esce con un protone verso il sangue.","note":"Il ruolo del lattato nell'acidosi è dibattuto: alcuni testi (Lehninger) attribuiscono l'acidificazione all'acido lattico. All'esame segui l'impostazione della sbobina.","fixed":false},{"id":"m2r-06","topic":"m2-fermentazioni","level":"a","page":"53","src":"Biochimica II","q":"Perché l'assunzione di molto etanolo può dare ipoglicemia e acidosi lattica?","opts":["Perché l'ossidazione dell'etanolo produce NADH: piruvato → lattato e la gluconeogenesi da lattato si blocca","Perché l'etanolo inibisce l'insulina","Perché l'acetaldeide blocca la glicolisi","Perché l'etanolo consuma NADH"],"ans":0,"why":"Con rapporto NADH/NAD⁺ alto il fegato non può ossidare il lattato a piruvato.","note":null,"fixed":false},{"id":"m2r-07","topic":"m2-fermentazioni","level":"l","page":"49","src":"Biochimica II","q":"Quale stereoisomero del lattato si forma nell'uomo?","opts":["L-lattato (S)","D-lattato (R)","Una miscela racemica","Meso-lattato"],"ans":0,"why":"La LDH umana è stereospecifica e forma L-lattato.","note":"Sbobina di Biochimica II, p. 49: c'è scritto che si forma l'isomero «R». L'L-lattato è (S).","fixed":false},{"id":"m2r-08","topic":"m2-fermentazioni","level":"l","page":"53","src":"Biochimica II","q":"Quale metallo contiene l'alcol deidrogenasi?","opts":["Zinco","Ferro","Magnesio","Rame"],"ans":0,"why":"È uno dei motivi per cui lo zinco è necessario nella dieta.","note":null,"fixed":false},{"id":"m2r-09","topic":"m2-fermentazioni","level":"l","page":"52","src":"Biochimica II","q":"L'isoenzima LDH1 corrisponde a:","opts":["H4 (cardiaco)","M4 (muscolare)","H2M2","M3H"],"ans":0,"why":"LDH1 = H4, LDH5 = M4.","note":null,"fixed":false},{"id":"m2n-01","topic":"m2-navette","level":"f","page":"53","src":"Biochimica II","q":"Perché servono i sistemi navetta?","opts":["Perché la membrana mitocondriale interna è impermeabile al NADH","Perché il NADH è instabile nel citosol","Per trasportare ATP","Per portare il piruvato nel mitocondrio"],"ans":0,"why":"Si trasferiscono gli elettroni del NADH citosolico, non la molecola.","note":null,"fixed":false},{"id":"m2n-02","topic":"m2-navette","level":"m","page":"54","src":"Biochimica II","q":"Nella navetta del glicerolo fosfato, a chi cede gli elettroni il glicerolo 3-fosfato?","opts":["Al FAD della glicerolo 3-P deidrogenasi mitocondriale","Al NAD⁺ mitocondriale","Direttamente all'O₂","Al citocromo c"],"ans":0,"why":"Poi passano al coenzima Q: si formano circa 1,5 ATP per NADH citosolico.","note":null,"fixed":false},{"id":"m2n-03","topic":"m2-navette","level":"a","page":"54","src":"Biochimica II","q":"Perché con la navetta malato-aspartato si ricava più ATP che con quella del glicerolo fosfato?","opts":["Perché gli elettroni arrivano al NAD⁺ mitocondriale ed entrano dal complesso I","Perché trasporta due NADH","Perché non consuma ATP","Perché produce GTP"],"ans":0,"why":"NADH mitocondriale ≈ 2,5 ATP contro FADH₂ ≈ 1,5.","note":"La sbobina descrive in dettaglio solo la navetta del glicerolo fosfato.","fixed":false},{"id":"m2n-04","topic":"m2-navette","level":"l","page":"54","src":"Biochimica II","q":"Nella navetta del glicerolo fosfato, l'enzima citosolico usa NADH; quello mitocondriale usa FAD. Come si chiamano?","opts":["Glicerolo 3-fosfato deidrogenasi citosolica e mitocondriale","Glicerolo chinasi e glicerolo fosfatasi","Malato deidrogenasi citosolica e mitocondriale","Trioso fosfato isomerasi e aldolasi"],"ans":0,"why":"Sono due isoenzimi della glicerolo 3-fosfato deidrogenasi.","note":"Sbobina di Biochimica II, p. 54: il glicerolo 3-fosfato è chiamato «3-fosfoglicerolo (3-PG)». Non va confuso con il 3-fosfoglicerato.","fixed":false},{"id":"m2reg-01","topic":"m2-regolazione","level":"f","page":"57","src":"Biochimica II","q":"Qual è il principale punto di regolazione della glicolisi?","opts":["Fosfofruttochinasi 1","Aldolasi","Enolasi","Fosfoglicerato chinasi"],"ans":0,"why":"È il primo passaggio di non ritorno specifico della glicolisi.","note":null,"fixed":false},{"id":"m2reg-02","topic":"m2-regolazione","level":"f","page":"58","src":"Biochimica II","q":"Quali sono gli effettori allosterici positivi della PFK1?","opts":["AMP e fruttosio 2,6-bisfosfato","ATP e citrato","Acetil-CoA e NADH","Glucosio 6-P e insulina"],"ans":0,"why":"Negativi: ATP e citrato.","note":null,"fixed":false},{"id":"m2reg-03","topic":"m2-regolazione","level":"m","page":"59","src":"Biochimica II","q":"Perché l'AMP è un segnale così sensibile della carica energetica?","opts":["Perché l'adenilato chinasi (2 ADP ⇌ ATP + AMP) amplifica: una piccola diminuzione di ATP fa aumentare di molto l'AMP in percentuale","Perché è il più abbondante dei tre nucleotidi","Perché inibisce direttamente l'ATP sintasi","Perché viene prodotto dal glucagone"],"ans":0,"why":"Con ATP 1 mM e AMP 0,02 mM, consumare 0,1 mM di ATP fa salire l'AMP a circa 0,07 mM (+300%).","note":null,"fixed":false},{"id":"m2reg-04","topic":"m2-regolazione","level":"m","page":"60","src":"Biochimica II","q":"Che cosa significa che il fruttosio 1,6-bisfosfato attiva la piruvato chinasi «a feed-forward»?","opts":["Che il prodotto di un enzima a monte attiva un enzima a valle, preparando la via al flusso in arrivo","Che il prodotto finale inibisce il primo enzima","Che l'enzima è attivato dal suo substrato","Che l'enzima è fosforilato"],"ans":0,"why":"Se la PFK1 è attiva, la piruvato chinasi viene accelerata per smaltire gli intermedi.","note":null,"fixed":false},{"id":"m2reg-05","topic":"m2-regolazione","level":"m","page":"61","src":"Biochimica II","q":"Che effetto ha la fosforilazione della piruvato chinasi epatica indotta dal glucagone?","opts":["La inattiva, così il PEP prodotto dalla gluconeogenesi non torna a piruvato","La attiva, per produrre più ATP","Non cambia la sua attività","La sposta nel mitocondrio"],"ans":0,"why":"Evita il ciclo futile PEP → piruvato → OAA → PEP durante la gluconeogenesi.","note":"Sbobina di Biochimica II, p. 61: c'è scritto che la fosforilazione «rallenta la glicolisi e quindi riduce la produzione di glucosio». Al contrario, favorisce la produzione di glucosio (gluconeogenesi) perché evita il ciclo futile.","fixed":false},{"id":"m2reg-06","topic":"m2-regolazione","level":"a","page":"58","src":"Biochimica II","q":"Nella PFK1, che cosa cambia tra forma R e forma T nel sito attivo?","opts":["In R c'è Arg162 positiva che attira il F6P; in T compare Glu161 negativo che lo respinge","In R c'è una cisteina, in T una serina","In T il sito attivo è occupato dall'ATP","Non cambia nulla, cambia solo la Vmax"],"ans":0,"why":"Il cambio di residuo spiega la diversa affinità per il fruttosio 6-fosfato.","note":null,"fixed":false},{"id":"m2reg-07","topic":"m2-regolazione","level":"a","page":"60","src":"Biochimica II","q":"Nel fegato, quale effettore della PFK1 è il più potente e perché?","opts":["Il fruttosio 2,6-bisfosfato, perché agisce a concentrazioni micromolari","L'ATP, perché è il più abbondante","Il citrato, perché è il più stabile","L'AMP, perché è un substrato"],"ans":0,"why":"Poi viene l'AMP; ATP e citrato agiscono a concentrazioni più alte.","note":null,"fixed":false},{"id":"m2reg-08","topic":"m2-regolazione","level":"a","page":"56","src":"Biochimica II","q":"Perché la glucochinasi viene riportata nel nucleo quando si accumula fruttosio 6-fosfato?","opts":["Perché se la glicolisi è ferma a valle è inutile continuare a fosforilare glucosio","Perché il fruttosio 6-P è tossico","Per favorire la gluconeogenesi da fruttosio","Perché il F6P degrada l'enzima"],"ans":0,"why":"Il F6P attiva la proteina regolatrice, che sequestra la glucochinasi.","note":null,"fixed":false},{"id":"m2reg-09","topic":"m2-regolazione","level":"l","page":"58","src":"Biochimica II","q":"Quale residuo della PFK1 compare nel sito attivo nella forma R?","opts":["Arginina 162","Glutammato 161","Lisina 162","Istidina 161"],"ans":0,"why":"Arg162 (positiva) in R, Glu161 (negativo) in T.","note":null,"fixed":false},{"id":"m2reg-10","topic":"m2-regolazione","level":"l","page":"59","src":"Biochimica II","q":"L'enzima che interconverte ATP, ADP e AMP si chiama:","opts":["Adenilato chinasi (miochinasi)","Nucleotide difosfato chinasi","AMP deaminasi","Adenilato ciclasi"],"ans":0,"why":"2 ADP ⇌ ATP + AMP. Da non confondere con l'adenilato ciclasi, che forma cAMP.","note":null,"fixed":false},{"id":"m2reg-11","topic":"m2-regolazione","level":"l","page":"60","src":"Biochimica II","q":"Quali sono gli effettori allosterici negativi della piruvato chinasi secondo la sbobina?","opts":["ATP e acetil-CoA","AMP e F1,6BP","Citrato e AMP","ADP e NADH"],"ans":0,"why":"Positivi: AMP e fruttosio 1,6-bisfosfato.","note":"Sbobina di Biochimica II, p. 60 e 62: a p. 60 l'acetil-CoA è un effettore negativo, a p. 62 c'è scritto che «l'ADP e l'acetil-CoA la attivano». La versione corretta è quella di p. 60: l'acetil-CoA inibisce.","fixed":false},{"id":"m2p-01","topic":"m2-pasteur","level":"f","page":"62","src":"Biochimica II","q":"Che cos'è l'effetto Pasteur?","opts":["La diminuzione del consumo di glucosio quando una cellula passa da anaerobiosi ad aerobiosi","L'aumento della glicolisi in presenza di ossigeno","La fermentazione alcolica nei lieviti","L'inibizione della respirazione da parte del glucosio"],"ans":0,"why":"In aerobiosi la fosforilazione ossidativa produce molto ATP e la glicolisi rallenta.","note":null,"fixed":false},{"id":"m2p-02","topic":"m2-pasteur","level":"m","page":"63","src":"Biochimica II","q":"Su quale enzima agisce soprattutto il citrato nell'effetto Pasteur?","opts":["Fosfofruttochinasi 1","Esochinasi","Piruvato chinasi","Piruvato deidrogenasi"],"ans":0,"why":"Il citrato esce dal mitocondrio quando l'ATP è abbondante e inibisce la PFK1.","note":"Sbobina di Biochimica II, p. 63: la PFK1 è definita «l'enzima che catalizza la prima reazione della glicolisi». È la terza reazione; è però il primo passaggio specifico e irreversibile della via.","fixed":false},{"id":"m2p-03","topic":"m2-pasteur","level":"m","page":"63","src":"Biochimica II","q":"Negli eritrociti, quale metabolita della glicolisi abbassa l'affinità dell'emoglobina per l'O₂?","opts":["2,3-bisfosfoglicerato","1,3-bisfosfoglicerato","Fosfoenolpiruvato","Lattato"],"ans":0,"why":"Deriva dall'1,3-BPG tramite la bisfosfoglicerato mutasi (shunt di Rapoport-Luebering).","note":null,"fixed":false},{"id":"m2p-04","topic":"m2-pasteur","level":"a","page":"63–64","src":"Biochimica II","q":"In un deficit di piruvato chinasi negli eritrociti, la curva di dissociazione dell'emoglobina si sposta:","opts":["A destra, perché si accumulano intermedi a monte e aumenta il 2,3-BPG","A sinistra, perché manca il 2,3-BPG","Non si sposta","A destra, perché aumenta il lattato"],"ans":0,"why":"L'Hb cede più O₂, ma la cellula ha poco ATP: la pompa Na⁺/K⁺ funziona male, l'eritrocita si gonfia e viene eliminato (anemia emolitica).","note":null,"fixed":false},{"id":"m2p-05","topic":"m2-pasteur","level":"a","page":"63","src":"Biochimica II","q":"E in un deficit di esochinasi eritrocitaria?","opts":["La curva si sposta a sinistra: poco 2,3-BPG, Hb più affine all'O₂","La curva si sposta a destra","Non cambia nulla","L'eritrocita produce più lattato"],"ans":0,"why":"Se la glicolisi non parte si forma poco 1,3-BPG e quindi poco 2,3-BPG.","note":null,"fixed":false},{"id":"m2p-06","topic":"m2-pasteur","level":"a","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Nell'intolleranza ereditaria al fruttosio, perché il fegato va in sofferenza?","opts":["Manca l'aldolasi B: il fruttosio 1-P si accumula e sequestra fosfato, l'ATP crolla","Manca la fruttochinasi: il fruttosio passa nelle urine","Manca il GLUT5","Il fruttosio inibisce la glucochinasi"],"ans":0,"why":"La fruttosuria essenziale (deficit di fruttochinasi) è invece benigna.","note":null,"fixed":false},{"id":"m2p-07","topic":"m2-pasteur","level":"a","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Perché un eccesso di fruttosio favorisce la steatosi epatica?","opts":["Perché nel fegato entra nella glicolisi a valle della PFK1, saltando il principale punto di controllo","Perché inibisce la β-ossidazione","Perché non viene fosforilato","Perché stimola il glucagone"],"ans":0,"why":"Il flusso non regolato verso piruvato e acetil-CoA alimenta la sintesi di acidi grassi.","note":"Sbobina di Biochimica II, pagine non numerate dopo p. 64: nel paragrafo sugli sciroppi c'è scritto «glucosio» dove si intende fruttosio («sciroppo di glucosio (miscela formata prevalentemente da fruttosio)», «consumo eccessivo di glucosio... tossico»). Il riferimento corretto è allo sciroppo ad alto contenuto di fruttosio.","fixed":false},{"id":"m2p-08","topic":"m2-pasteur","level":"m","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Come entra il galattosio nella glicolisi?","opts":["Galattosio → galattosio 1-P → (scambio con UDP-glucosio) glucosio 1-P → glucosio 6-P","Galattosio → fruttosio 6-P","Galattosio → gliceraldeide 3-P","Galattosio → glucosio libero per epimerizzazione diretta"],"ans":0,"why":"Galattochinasi, galattosio 1-P uridiltrasferasi, UDP-galattosio 4-epimerasi, fosfoglucomutasi.","note":null,"fixed":false},{"id":"m2p-09","topic":"m2-pasteur","level":"l","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Quale enzima manca nella forma più frequente di galattosemia?","opts":["Galattosio 1-fosfato uridiltrasferasi","Galattochinasi","UDP-galattosio 4-epimerasi","Lattasi"],"ans":0,"why":"Il galattosio si accumula; nel cristallino y":"Derivano da tiamina (B1), acido lipoico, pantotenato (B5), riboflavina (B2) e niacina (B3).","note":null,"fixed":false},{"id":"m2d-03","topic":"m2-pdh","level":"f","page":"65","src":"Biochimica II","q":"Dove si trova il complesso della piruvato deidrogenasi?","opts":["Nella matrice mitocondriale","Nel citosol","Nella membrana plasmatica","Nel reticolo endoplasmatico"],"ans":0,"why":"Il piruvato entra nel mitocondrio con un trasportatore specifico, insieme a un protone.","note":null,"fixed":false},{"id":"m2d-04","topic":"m2-pdh","level":"m","page":"71","src":"Biochimica II","q":"Come viene regolata covalentemente la PDH?","opts":["La PDH chinasi la fosforila e la inattiva; la PDH fosfatasi la defosforila e la attiva","La fosforilazione la attiva","È regolata solo allostericamente","La PKA la attiva in risposta al glucagone"],"ans":0,"why":"La fosforilazione avviene sull'E1 e blocca tutto il complesso.","note":null,"fixed":false},{"id":"m2d-05","topic":"m2-pdh","level":"m","page":"70","src":"Biochimica II","q":"Quali prodotti inibiscono la PDH (inibizione da prodotto)?","opts":["Acetil-CoA e NADH","CO₂ e NADH","ATP e AMP","Piruvato e CoA"],"ans":0,"why":"L'acetil-CoA inibisce E2, il NADH inibisce E3.","note":null,"fixed":false},{"id":"m2d-06","topic":"m2-pdh","level":"m","page":"66–67","src":"Biochimica II","q":"Quali sono i vantaggi di un complesso multienzimatico?","opts":["Il prodotto passa subito all'enzima successivo, gli intermedi reattivi non si disperdono, e basta regolare un enzima per controllare tutto","Usa meno coenzimi","Non ha bisogno di regolazione","Funziona anche senza NAD⁺"],"ans":0,"why":"Si supera il limite della diffusione e si regola tutto bloccando E1.","note":null,"fixed":false},{"id":"m2d-07","topic":"m2-pdh","level":"a","page":"69","src":"Biochimica II","q":"Perché nell'uomo i grassi non possono diventare zuccheri?","opts":["Perché la reazione della PDH è irreversibile: l'acetil-CoA non può tornare piruvato","Perché gli acidi grassi non producono acetil-CoA","Perché manca la glucochinasi","Perché l'acetil-CoA inibisce la gluconeogenesi"],"ans":0,"why":"Gli zuccheri possono diventare grassi (via acetil-CoA), non il contrario. Fa eccezione il glicerolo dei trigliceridi.","note":null,"fixed":false},{"id":"m2d-08","topic":"m2-pdh","level":"a","page":"72","src":"Biochimica II","q":"Nel muscolo che si contrae, perché aumenta l'attività della PDH?","opts":["Il Ca²⁺ attiva la PDH fosfatasi, e l'ADP/piruvato inibiscono la chinasi","L'ATP attiva la PDH","Il NADH attiva la fosfatasi","L'insulina fosforila la PDH"],"ans":0,"why":"Il calcio favorisce il legame della fosfatasi al complesso.","note":null,"fixed":false},{"id":"m2d-09","topic":"m2-pdh","level":"a","page":"73","src":"Biochimica II","q":"Un neonato con deficit di E1 della PDH presenterà soprattutto:","opts":["Acidosi lattica e problemi neurologici","Ipoglicemia isolata","Iperammoniemia","Anemia emolitica"],"ans":0,"why":"Il piruvato non viene ossidato: il NADH si riossida solo con la fermentazione lattica; il cervello, che dipende dal glucosio, è il più colpito.","note":null,"fixed":false},{"id":"m2d-10","topic":"m2-pdh","level":"a","page":"73","src":"Biochimica II","q":"In ipossia, come agisce HIF sulla PDH?","opts":["Aumenta l'espressione della PDH chinasi: la PDH viene fosforilata e inibita","Attiva la PDH fosfatasi","Aumenta la sintesi di E1","Non ha effetti sulla PDH"],"ans":0,"why":"Il piruvato viene dirottato verso il lattato: è uno dei meccanismi dell'effetto Warburg.","note":null,"fixed":false},{"id":"m2d-11","topic":"m2-pdh","level":"l","page":"66","src":"Biochimica II","q":"Come si chiama l'enzima E2 della PDH?","opts":["Diidrolipoil transacetilasi","Diidrolipoil deidrogenasi","Piruvato decarbossilasi","Lipoamide sintasi"],"ans":0,"why":"E1 piruvato deidrogenasi (decarbossilazione), E2 transacetilasi (trasferimento al CoA), E3 diidrolipoil deidrogenasi (riossida il lipoato con FAD → NAD⁺).","note":"Sbobina di Biochimica II, p. 68: lo scambio dell'acetile tra lipoato e CoA è attribuito all'«E3». Il trasferimento al CoA lo fa l'E2 (transacetilasi); l'E3 riossida il lipoato.","fixed":false},{"id":"m2d-12","topic":"m2-pdh","level":"l","page":"68","src":"Biochimica II","q":"Come si chiama l'intermedio legato alla TPP dopo la decarbossilazione del piruvato?","opts":["Idrossietil-TPP","Acetil-TPP","Carbossietil-TPP","Lattil-TPP"],"ans":0,"why":"Poi viene ossidato e trasferito all'acido lipoico come acetile (acetil-diidrolipoamide).","note":null,"fixed":false},{"id":"m2d-13","topic":"m2-pdh","level":"l","page":"67","src":"Biochimica II","q":"Il lipoato è legato covalentemente all'E2 tramite:","opts":["Un legame ammidico con una lisina (lipoamide)","Un ponte disolfuro con una cisteina","Un estere con una serina","Un legame glicosidico"],"ans":0,"why":"Il lungo braccio lisina-lipoato oscilla tra E1 ed E3.","note":null,"fixed":false},{"id":"m2d-14","topic":"m2-pdh","level":"l","page":"67","src":"Biochimica II","q":"Il carbonio reattivo della tiamina pirofosfato si trova:","opts":["Nell'anello tiazolico, tra N e S","Nell'anello pirimidinico","Nel pirofosfato","Nella catena laterale"],"ans":0,"why":"Il C2 del tiazolo si deprotona (carbanione/ilide) e attacca il carbonile del piruvato.","note":"Sbobina di Biochimica II, p. 67: c'è scritto «derivata dall'enzima B1». Si intende la vitamina B1 (tiamina).","fixed":false},{"id":"m3k-01","topic":"m3-krebs","level":"f","page":"74","src":"Biochimica II","q":"Dove avviene il ciclo di Krebs?","opts":["Nella matrice mitocondriale","Nel citosol","Nello spazio intermembrana","Nel reticolo endoplasmatico"],"ans":0,"why":"Tutti gli enzimi sono nella matrice tranne la succinato deidrogenasi, che è nella membrana interna.","note":null,"fixed":false},{"id":"m3k-02","topic":"m3-krebs","level":"f","page":"76","src":"Biochimica II","q":"Quale enzima unisce acetil-CoA e ossalacetato?","opts":["Citrato sintasi","Aconitasi","Isocitrato deidrogenasi","Piruvato carbossilasi"],"ans":0,"why":"È una condensazione di Claisen che forma citrato e libera CoA.","note":null,"fixed":false},{"id":"m3k-03","topic":"m3-krebs","level":"f","page":"74","src":"Biochimica II","q":"Che cosa produce un giro del ciclo di Krebs per acetil-CoA?","opts":["3 NADH, 1 FADH₂, 1 GTP, 2 CO₂","2 NADH, 2 FADH₂, 1 ATP, 2 CO₂","4 NADH, 1 GTP, 1 CO₂","3 NADH, 1 FADH₂, 2 ATP"],"ans":0,"why":"NADH da isocitrato DH, α-chetoglutarato DH e malato DH; FADH₂ dalla succinato DH; GTP dalla succinil-CoA sintetasi.","note":null,"fixed":false},{"id":"m3k-04","topic":"m3-krebs","level":"f","page":"83","src":"Biochimica II","q":"Quale enzima del ciclo di Krebs è anche il complesso II della catena respiratoria?","opts":["Succinato deidrogenasi","Malato deidrogenasi","Fumarasi","Isocitrato deidrogenasi"],"ans":0,"why":"È l'unico enzima del ciclo integrato nella membrana mitocondriale interna.","note":null,"fixed":false},{"id":"m3k-05","topic":"m3-krebs","level":"m","page":"79","src":"Biochimica II","q":"Perché la citrato sintasi lega prima l'ossalacetato e poi l'acetil-CoA (meccanismo sequenziale ordinato)?","opts":["Perché l'ossalacetato è presente in quantità minime: l'enzima si assicura che ci sia prima di usare l'acetil-CoA","Perché l'acetil-CoA è più grande","Perché l'ossalacetato è il prodotto","Perché così consuma meno ATP"],"ans":0,"why":"L'adattamento indotto evita anche l'idrolisi improduttiva del tioestere dell'acetil-CoA.","note":null,"fixed":false},{"id":"m3k-06","topic":"m3-krebs","level":"m","page":"84","src":"Biochimica II","q":"Quali sono le tre reazioni del ciclo con ΔG fortemente negativo, quindi regolate?","opts":["Citrato sintasi, isocitrato deidrogenasi, α-chetoglutarato deidrogenasi","Aconitasi, fumarasi, malato deidrogenasi","Succinil-CoA sintetasi, succinato DH, fumarasi","Tutte le otto reazioni"],"ans":0,"why":"Le altre sono vicine all'equilibrio.","note":null,"fixed":false},{"id":"m3k-07","topic":"m3-krebs","level":"m","page":"84–85","src":"Biochimica II","q":"Come viene regolato il ciclo di Krebs?","opts":["NADH e ATP lo rallentano, ADP e Ca²⁺ lo accelerano","Solo dall'insulina","È attivato dal NADH","Non è regolato"],"ans":0,"why":"È il controllo «da parte dell'accettore»: se c'è ADP la cellula ha bisogno di ATP.","note":null,"fixed":false},{"id":"m3k-08","topic":"m3-krebs","level":"m","page":"87","src":"Biochimica II","q":"Qual è la reazione anaplerotica più importante?","opts":["Piruvato → ossalacetato (piruvato carbossilasi)","Citrato → isocitrato","Malato → ossalacetato","Acetil-CoA → citrato"],"ans":0,"why":"Riempie il ciclo di intermedi; è attivata dall'acetil-CoA.","note":null,"fixed":false},{"id":"m3k-09","topic":"m3-krebs","level":"a","page":"84","src":"Biochimica II","q":"Le due CO₂ che escono in un giro del ciclo provengono dai carboni dell'acetil-CoA appena entrato?","opts":["No: vengono dall'ossalacetato; i carboni dell'acetile escono nei giri successivi","Sì, entrambe","Una sì e una no","No, vengono dal CoA"],"ans":0,"why":"Per eliminare completamente i carboni di un acetile servono due giri.","note":"Sbobina di Biochimica II, p. 77: dopo la seconda decarbossilazione c'è scritto che «abbiamo così ossidato l'acetato». A p. 84 la stessa sbobina chiarisce che le CO₂ escono dai carboni dell'ossalacetato.","fixed":false},{"id":"m3k-10","topic":"m3-krebs","level":"a","page":"86","src":"Biochimica II","q":"Perché il beri-beri colpisce soprattutto sistema nervoso e cuore?","opts":["La TPP serve a PDH (cervello, che usa glucosio) e ad α-chetoglutarato DH (cuore, che dipende dal ciclo di Krebs)","Perché la tiamina serve alla sintesi di acetilcolina","Perché la tiamina è un antiossidante","Perché manca il NAD"],"ans":0,"why":"Senza TPP si bloccano le due decarbossilazioni ossidative.","note":null,"fixed":false},{"id":"m3k-11","topic":"m3-krebs","level":"a","page":"86","src":"Biochimica II","q":"Come agiscono arsenico e mercurio sul metabolismo energetico?","opts":["Legano i gruppi SH del lipoato, bloccando PDH e α-chetoglutarato DH","Inibiscono l'ATP sintasi","Bloccano il complesso IV","Ossidano il NADH"],"ans":0,"why":"I composti con ditioli possono liberare l'enzima legando l'arsenico.","note":null,"fixed":false},{"id":"m3k-12","topic":"m3-krebs","level":"a","page":"89","src":"Biochimica II","q":"Perché per ossidare completamente gli acidi grassi serve anche il glucosio?","opts":["Perché l'acetil-CoA ha bisogno di ossalacetato, che si forma dal piruvato","Perché gli acidi grassi si ossidano solo nel citosol","Perché la β-ossidazione consuma glucosio","Perché servono i GLUT"],"ans":0,"why":"Si dice che i grassi «bruciano al fuoco dei carboidrati».","note":null,"fixed":false},{"id":"m3k-13","topic":"m3-krebs","level":"a","page":"85","src":"Biochimica II","q":"Pellagra: quale coenzima manca e perché in Veneto era endemica?","opts":["NAD (niacina, B3): l'alimentazione si basava sul mais, in cui la niacina non è disponibile senza trattamento alcalino","FAD (riboflavina): carenza di latte","TPP (tiamina): riso brillato","CoA (B5): carenza di carne"],"ans":0,"why":"In America Latina la nixtamalizzazione (calce viva) rendeva disponibile la niacina. Sintomi: dermatite, diarrea, demenza.","note":null,"fixed":false},{"id":"m3k-14","topic":"m3-krebs","level":"l","page":"78, 82","src":"Biochimica II","q":"Come si chiama correttamente l'enzima che forma GTP dal succinil-CoA?","opts":["Succinil-CoA sintetasi","Succinil-CoA sintasi","Succinato chinasi","Succinato deidrogenasi"],"ans":0,"why":"Si chiama sintetasi perché la reazione coinvolge un nucleotide trifosfato.","note":"Sbobina di Biochimica II, p. 78: l'enzima è chiamato «succinil-CoA sintasi (perché utilizziamo GDP)», contro la definizione data poco prima. A p. 82 è chiamato correttamente sintetasi.","fixed":false},{"id":"m3k-15","topic":"m3-krebs","level":"l","page":"80","src":"Biochimica II","q":"Qual è l'intermedio della reazione dell'aconitasi?","opts":["cis-Aconitato","trans-Aconitato","Citril-CoA","Ossalsuccinato"],"ans":0,"why":"Deidratazione e reidratazione: citrato → cis-aconitato → isocitrato.","note":null,"fixed":false},{"id":"m3k-16","topic":"m3-krebs","level":"l","page":"80","src":"Biochimica II","q":"Che tipo di centro ha l'aconitasi nel sito attivo?","opts":["Un centro 4Fe-4S","Un eme","Un atomo di zinco","Un centro rame"],"ans":0,"why":"Se perde un ferro diventa inattiva; l'isoforma citosolica è la IRP1, che regola ferritina e recettore della transferrina.","note":null,"fixed":false},{"id":"m3k-17","topic":"m3-krebs","level":"l","page":"82","src":"Biochimica II","q":"Come si chiama l'E2 del complesso dell'α-chetoglutarato deidrogenasi?","opts":["Diidrolipoil transsuccinilasi","Diidrolipoil transacetilasi","Succinil-CoA sintetasi","Diidrolipoil deidrogenasi"],"ans":0,"why":"Trasferisce un gruppo succinile invece che acetile; l'E3 è uguale a quello della PDH.","note":null,"fixed":false},{"id":"m3k-18","topic":"m3-krebs","level":"l","page":"83","src":"Biochimica II","q":"Quale stereoisomero del malato forma la fumarasi?","opts":["L-malato","D-malato","Meso-malato","Racemo"],"ans":0,"why":"L'idratazione del fumarato è stereospecifica.","note":null,"fixed":false},{"id":"m3c-01","topic":"m3-catena","level":"f","page":"90","src":"Biochimica II","q":"Qual è l'accettore finale degli elettroni nella catena respiratoria?","opts":["O₂","NAD⁺","Coenzima Q","Citocromo c"],"ans":0,"why":"L'ossigeno viene ridotto ad acqua nel complesso IV.","note":null,"fixed":false},{"id":"m3c-02","topic":"m3-catena","level":"f","page":"91","src":"Biochimica II","q":"Dove si trova la catena respiratoria?","opts":["Nella membrana mitocondriale interna","Nella membrana esterna","Nella matrice","Nel citosol"],"ans":0,"why":"Le creste aumentano la superficie disponibile.","note":null,"fixed":false},{"id":"m3c-03","topic":"m3-catena","level":"f","page":"95","src":"Biochimica II","q":"Quale complesso non pompa protoni?","opts":["Complesso II","Complesso I","Complesso III","Complesso IV"],"ans":0,"why":"Il ΔE tra succinato e coenzima Q è troppo piccolo.","note":null,"fixed":false},{"id":"m3c-04","topic":"m3-catena","level":"m","page":"90","src":"Biochimica II","q":"Quanti ATP si ottengono circa dalla riossidazione di un NADH e di un FADH₂?","opts":["2,5 e 1,5","3 e 2","1,5 e 2,5","2 e 1"],"ans":0,"why":"Il FADH₂ entra al coenzima Q, saltando il complesso I.","note":null,"fixed":false},{"id":"m3c-05","topic":"m3-catena","level":"m","page":"92","src":"Biochimica II","q":"Come sono disposti i trasportatori della catena?","opts":["In ordine di potenziale di riduzione crescente, dal NADH (−0,32 V) all'O₂ (+0,81 V)","In ordine di massa","In ordine casuale","In ordine di potenziale decrescente"],"ans":0,"why":"Gli elettroni scendono «in discesa» verso l'accettore più affine.","note":null,"fixed":false},{"id":"m3c-06","topic":"m3-catena","level":"m","page":"95","src":"Biochimica II","q":"Da quali fonti il coenzima Q riceve elettroni?","opts":["Complesso I, complesso II, glicerolo 3-P deidrogenasi della navetta, β-ossidazione","Solo dal complesso I","Dal citocromo c","Dal complesso IV"],"ans":0,"why":"Convoglia gli elettroni di tutti gli enzimi flavinici.","note":null,"fixed":false},{"id":"m3c-07","topic":"m3-catena","level":"a","page":"104","src":"Biochimica II","q":"Se blocchi il complesso III con antimicina A, in che stato saranno i trasportatori?","opts":["Ridotti quelli a monte (NADH, complesso I, Q), ossidati quelli a valle (citocromo c, complesso IV)","Tutti ossidati","Tutti ridotti","Ossidati a monte, ridotti a valle"],"ans":0,"why":"È il metodo con cui è stata ricostruita la sequenza dei trasportatori.","note":null,"fixed":false},{"id":"m3c-08","topic":"m3-catena","level":"a","page":"96–97","src":"Biochimica II","q":"A che cosa serve il ciclo del Q nel complesso III?","opts":["A passare da un trasportatore a 2 elettroni (QH₂) a uno a 1 elettrone (citocromo c), un elettrone per volta","A produrre ATP","A ridurre l'ossigeno","A trasportare NADH"],"ans":0,"why":"Un elettrone va al citocromo c1 → c, l'altro torna attraverso i citocromi b a un Q.","note":null,"fixed":false},{"id":"m3c-09","topic":"m3-catena","level":"a","page":"99","src":"Biochimica II","q":"Quanta energia libera si libera nel trasferimento di 2 elettroni dal NADH all'O₂?","opts":["Circa −218 kJ/mol","Circa −30 kJ/mol","Circa −61 kJ/mol","Circa −1000 kJ/mol"],"ans":0,"why":"ΔG°' = −nFΔE°' con ΔE°' = 0,81 − (−0,32) = 1,13 V.","note":null,"fixed":false},{"id":"m3c-10","topic":"m3-catena","level":"a","page":"104","src":"Biochimica II","q":"Il cianuro blocca il complesso IV. Cosa succede ai trasportatori?","opts":["Restano tutti ridotti","Restano tutti ossidati","Si riduce solo il citocromo c","Il coenzima Q si ossida"],"ans":0,"why":"Gli elettroni non possono uscire verso l'ossigeno. Lo stesso fanno CO e sodio azide.","note":null,"fixed":false},{"id":"m3c-11","topic":"m3-catena","level":"l","page":"92","src":"Biochimica II","q":"Come si chiama il complesso I secondo la nomenclatura usata nella sbobina?","opts":["NADH-Q reduttasi","NADH ossidasi","Ubichinone deidrogenasi","Citocromo b reduttasi"],"ans":0,"why":"Si scrive prima chi si ossida, poi chi si riduce, poi «reduttasi». Il complesso IV sarebbe correttamente citocromo c-ossigeno reduttasi.","note":null,"fixed":false},{"id":"m3c-12","topic":"m3-catena","level":"l","page":"93","src":"Biochimica II","q":"Quale gruppo prostetico flavinico contiene il complesso I?","opts":["FMN (flavin mononucleotide)","FAD","Biotina","Lipoato"],"ans":0,"why":"L'FMN prende due elettroni dal NADH e li cede uno alla volta ai centri Fe-S.","note":null,"fixed":false},{"id":"m3c-13","topic":"m3-catena","level":"l","page":"96","src":"Biochimica II","q":"Come si chiama la proteina Fe-S del complesso III, con due cisteine e due istidine?","opts":["Proteina di Rieske","Adrenodossina","Ferredossina","Citocromo c1"],"ans":0,"why":"A differenza delle Fe-S classiche, due ligandi del ferro sono istidine.","note":null,"fixed":false},{"id":"m3c-14","topic":"m3-catena","level":"l","page":"98","src":"Biochimica II","q":"Quali sono i centri metallici del complesso IV?","opts":["Eme a, eme a3, CuA e CuB","Eme b e c1","Solo eme a3","Fe-S e FMN"],"ans":0,"why":"L'ossigeno viene ridotto nel centro binucleare eme a3–CuB.","note":null,"fixed":false},{"id":"m3c-15","topic":"m3-catena","level":"l","page":"97","src":"Biochimica II","q":"Che cosa coordina il ferro del citocromo c nella sesta posizione?","opts":["Lo zolfo di una metionina","Un'istidina distale","L'ossigeno","Una cisteina"],"ans":0,"why":"Ferro coordinato da 4 N della porfirina, un'istidina e una metionina: tutte le posizioni sono occupate e non lega O₂.","note":null,"fixed":false},{"id":"m3c-16","topic":"m3-catena","level":"l","page":"94","src":"Biochimica II","q":"Il coenzima Q si trova:","opts":["Nella membrana mitocondriale interna","Nella membrana plasmatica","Nella matrice","Nello spazio intermembrana"],"ans":0,"why":"Ha una coda di 10 unità isopreniche che lo tiene nel doppio strato.","note":"Sbobina di Biochimica II, p. 94: c'è scritto che il coenzima Q è presente «nella membrana plasmatica». Si trova nella membrana mitocondriale interna.","fixed":false},{"id":"m3s-01","topic":"m3-atpsintasi","level":"f","page":"100","src":"Biochimica II","q":"Come si chiama la teoria che spiega la sintesi di ATP nel mitocondrio?","opts":["Teoria chemiosmotica di Mitchell","Teoria dell'adattamento indotto","Teoria chiave-serratura","Teoria del cambio di legame di Michaelis"],"ans":0,"why":"Il gradiente protonico creato dalla catena alimenta l'ATP sintasi.","note":null,"fixed":false},{"id":"m3s-02","topic":"m3-atpsintasi","level":"f","page":"100","src":"Biochimica II","q":"Da quali parti è formata l'ATP sintasi?","opts":["F₀ nella membrana e F₁ verso la matrice","F₁ nella membrana e F₀ nella matrice","Solo F₁","Complessi I e IV"],"ans":0,"why":"F₀ è il canale e rotore per i protoni, F₁ catalizza la sintesi di ATP.","note":null,"fixed":false},{"id":"m3s-03","topic":"m3-atpsintasi","level":"m","page":"100","src":"Biochimica II","q":"Da quali due componenti è formata la forza motrice protonica?","opts":["Gradiente elettrico (potenziale di membrana) e gradiente chimico (ΔpH)","Gradiente di Na⁺ e K⁺","ATP e ADP","Temperatura e pressione"],"ans":0,"why":"I protoni pompati fuori rendono il lato P positivo e più acido.","note":null,"fixed":false},{"id":"m3s-04","topic":"m3-atpsintasi","level":"m","page":"102","src":"Biochimica II","q":"Come funziona il meccanismo di «cambio di legame» delle subunità β?","opts":["Le tre β passano a turno per le conformazioni L (lega ADP + Pi), T (forma ATP) e O (rilascia ATP)","Ogni β sintetizza ATP indipendentemente","Le β ruotano con l'anello c","Le α fanno la catalisi"],"ans":0,"why":"La rotazione di γ cambia la conformazione delle β; il passaggio che costa più energia è il rilascio dell'ATP.","note":null,"fixed":false},{"id":"m3s-05","topic":"m3-atpsintasi","level":"m","page":"103–104","src":"Biochimica II","q":"Che cosa fa l'ATP/ADP traslocasi?","opts":["Scambia ATP della matrice con ADP del citosol, sfruttando il potenziale di membrana","Sintetizza ATP","Trasporta fosfato","Trasporta NADH"],"ans":0,"why":"ATP⁴⁻ esce e ADP³⁻ entra: si sposta una carica negativa netta verso l'esterno.","note":null,"fixed":false},{"id":"m3s-06","topic":"m3-atpsintasi","level":"a","page":"105","src":"Biochimica II","q":"Che effetto ha il 2,4-dinitrofenolo?","opts":["Riporta protoni nella matrice scavalcando l'ATP sintasi: gli elettroni fluiscono ma l'energia diventa calore","Blocca il complesso IV","Blocca l'ATP sintasi","Aumenta la sintesi di ATP"],"ans":0,"why":"È un disaccoppiante; usato in passato come dimagrante, con molti decessi.","note":null,"fixed":false},{"id":"m3s-07","topic":"m3-atpsintasi","level":"a","page":"105","src":"Biochimica II","q":"Con l'oligomicina, che succede al consumo di ossigeno?","opts":["Diminuisce: il gradiente non si scarica e il trasporto di elettroni rallenta","Aumenta","Non cambia","Si azzera la glicolisi"],"ans":0,"why":"Trasporto di elettroni e sintesi di ATP sono accoppiati.","note":null,"fixed":false},{"id":"m3s-08","topic":"m3-atpsintasi","level":"a","page":"106","src":"Biochimica II","q":"A che cosa serve la termogenina (UCP1) nel tessuto adiposo bruno?","opts":["Lascia rientrare i protoni nella matrice producendo calore invece di ATP","Sintetizza ATP","Trasporta acidi grassi","Pompa protoni fuori"],"ans":0,"why":"È un disaccoppiante fisiologico, importante per la termoregolazione del neonato.","note":null,"fixed":false},{"id":"m3s-09","topic":"m3-atpsintasi","level":"a","page":"101–102","src":"Biochimica II","q":"Nell'anello c dell'F₀, perché l'aspartato si protona e si deprotona?","opts":["Si protona nel semicanale verso lo spazio intermembrana (pH acido) e cede il protone nel semicanale verso la matrice (pH basico): così l'anello ruota","Perché viene fosforilato","Perché lega ATP","Perché ossida il NADH"],"ans":0,"why":"Ogni protone che entra fa avanzare il rotore di una subunità c.","note":null,"fixed":false},{"id":"m3s-10","topic":"m3-atpsintasi","level":"l","page":"102","src":"Biochimica II","q":"Che cosa significano le sigle O, L e T delle subunità β?","opts":["Open, Loose, Tight","Open, Light, Tight","Oxidized, Loaded, Taut","Open, Locked, Tense"],"ans":0,"why":"L = loose: lega ADP e Pi in modo lasso.","note":"Sbobina di Biochimica II, p. 102: la L è sciolta come «light». La sigla sta per loose.","fixed":false},{"id":"m3s-11","topic":"m3-atpsintasi","level":"l","page":"101–102","src":"Biochimica II","q":"Nell'ATP sintasi, quale parte ruota e quale fa da statore?","opts":["Ruotano l'anello c con γ ed ε; la subunità a, b₂ e δ sono lo statore","Ruota la subunità a","Ruotano le α e β","Non ruota nulla"],"ans":0,"why":"Le α3β3 stanno ferme, tenute dal braccio periferico.","note":"Sbobina di Biochimica II, p. 101: c'è scritto che «la proteina a è un rotore che gira». Ruota l'anello delle subunità c; la a fa parte dello statore.","fixed":false},{"id":"m3s-12","topic":"m3-atpsintasi","level":"l","page":"100","src":"Biochimica II","q":"La prima ipotesi sul meccanismo dell'ATP sintasi prevedeva intermedi ad alta energia (accoppiamento chimico). Chi è il premio Nobel della teoria chemiosmotica?","opts":["Peter Mitchell","Hans Krebs","Daniel Koshland","Carl Cori"],"ans":0,"why":"Mitchell la propose nel 1961 e ricevette il Nobel nel 1978.","note":"Sbobina di Biochimica II, p. 100: l'ipotesi dell'accoppiamento chimico è attribuita a Koshland e quella di Mitchell agli anni '70–'80. L'ipotesi chimica è di Slater (1953); Mitchell propose la teoria chemiosmotica nel 1961. Le date non sono nella sbobina, vengono dai testi di riferimento.","fixed":false},{"id":"m3r-01","topic":"m3-radicali","level":"f","page":"108","src":"Biochimica II","q":"Quale enzima trasforma l'anione superossido in perossido di idrogeno?","opts":["Superossido dismutasi","Catalasi","Glutatione perossidasi","NADPH ossidasi"],"ans":0,"why":"La catalasi poi scinde H₂O₂ in acqua e ossigeno.","note":null,"fixed":false},{"id":"m3r-02","topic":"m3-radicali","level":"m","page":"109","src":"Biochimica II","q":"Che cosa fa la glutatione perossidasi?","opts":["Riduce i perossidi ossidando due glutatione (GSH → GSSG)","Riduce il glutatione ossidato","Produce superossido","Ossida il NADPH"],"ans":0,"why":"Il GSSG viene poi ridotto dalla glutatione reduttasi con il NADPH.","note":null,"fixed":false},{"id":"m3r-03","topic":"m3-radicali","level":"m","page":"110","src":"Biochimica II","q":"Quando la catena respiratoria produce più radicali?","opts":["Quando l'ossigeno è scarso: gli elettroni si fermano sui trasportatori (es. ubichinone) e possono ridurre l'O₂ a superossido","Quando c'è molto ossigeno","Quando c'è molto ADP","Mai, la catena è perfetta"],"ans":0,"why":"HIF sostituisce la subunità COX4-1 con COX4-2, più affine all'ossigeno.","note":null,"fixed":false},{"id":"m3r-04","topic":"m3-radicali","level":"a","page":"109","src":"Biochimica II","q":"Perché il selenio è importante n te":null,"fixed":false},{"id":"m4o-03","topic":"m4-ormoni","level":"m","page":"130","src":"Biochimica II","q":"Perché il glucagone non agisce sul muscolo?","opts":["Il muscolo non ha recettori per il glucagone","Il muscolo non ha cAMP","Il muscolo non ha glicogeno","Il glucagone è degradato nel sangue"],"ans":0,"why":"Il muscolo risponde invece all'adrenalina.","note":null,"fixed":false},{"id":"m4o-04","topic":"m4-ormoni","level":"a","page":"131","src":"Biochimica II","q":"Come agisce l'adrenalina sui recettori α1 epatici?","opts":["Via IP₃ e Ca²⁺, attivando la fosforilasi chinasi","Via cAMP","Via tirosin-chinasi","Inibendo la PKA"],"ans":0,"why":"Ca²⁺ si lega alla calmodulina della fosforilasi chinasi.","note":null,"fixed":false},{"id":"m4o-05","topic":"m4-ormoni","level":"a","page":"131","src":"Biochimica II","q":"Nel fegato, che effetto ha il glucagone sulla glicogeno sintasi?","opts":["Aumenta il cAMP; la PKA fosforila e inattiva la sintasi, mentre attiva la degradazione","La attiva tramite PKB","Non ha effetto sulla sintasi","La defosforila tramite PP1"],"ans":0,"why":"Sintesi e degradazione sono regolate in modo reciproco: non girano mai insieme a pieno regime.","note":"Sbobina di Biochimica II, p. 131: c'è scritto che il glucagone aumenta «i livelli di AMP» dove si intende cAMP, e si parla di inibizione «della distruzione del glicogeno» dove si intende la sintesi.","fixed":false},{"id":"m4o-06","topic":"m4-ormoni","level":"l","page":"132","src":"Biochimica II","q":"Che cosa sono PKB e Akt?","opts":["Due nomi della stessa chinasi attivata dall'insulina","Una proteasi e una chinasi","Due fosfatasi","Recettori dell'insulina"],"ans":0,"why":"La PKB/Akt è una serina/treonina chinasi.","note":"Sbobina di Biochimica II, p. 132: la PKB è chiamata «proteasi». È una chinasi.","fixed":false},{"id":"m4e-01","topic":"m4-attivita","level":"f","page":"134","src":"Biochimica II","q":"Durante uno sprint, da dove ricava energia il muscolo?","opts":["Dal glicogeno muscolare via glicolisi anaerobia","Dagli acidi grassi","Dai corpi chetonici","Dalle proteine"],"ans":0,"why":"Lo sforzo intenso e breve usa la fermentazione lattica.","note":null,"fixed":false},{"id":"m4e-02","topic":"m4-attivita","level":"m","page":"134–135","src":"Biochimica II","q":"Nella maratona, che cosa cambia rispetto allo sprint?","opts":["Il metabolismo è aerobio e usa sempre più acidi grassi, risparmiando glicogeno","Usa solo glicogeno","Usa solo creatina fosfato","Produce più lattato"],"ans":0,"why":"Quando il glicogeno si esaurisce si ha il «muro».","note":null,"fixed":false},{"id":"m4e-03","topic":"m4-attivita","level":"a","page":"135","src":"Biochimica II","q":"Perché con una dieta ricca di grassi e povera di carboidrati il glicogeno non si ricostituisce dopo lo sforzo?","opts":["Gli acidi grassi danno acetil-CoA, ma la piruvato deidrogenasi è irreversibile: dall'acetil-CoA non si torna al piruvato e quindi al glucosio","Perché i grassi inibiscono la glicogeno sintasi","Perché gli acidi grassi non entrano nel muscolo","Perché i grassi consumano tutto l'ATP"],"ans":0,"why":"Serve mangiare carboidrati, subito dopo lo sforzo e poi a intervalli regolari nelle 24 ore successive.","note":"Sbobina di Biochimica II, p. 135: c'è scritto che «la reazione della piruvato carbossilasi è irreversibile». L'enzima irreversibile tra piruvato e acetil-CoA è la piruvato deidrogenasi.","fixed":false},{"id":"m4e-04","topic":"m4-attivita","level":"l","page":"134","src":"Biochimica II","q":"Quanto dura indicativamente la riserva di fosfocreatina in uno sforzo massimale?","opts":["Pochi secondi","Circa 10 minuti","Circa un'ora","Un giorno"],"ans":0,"why":"Dopo pochi secondi subentra la glicolisi anaerobia.","note":null,"fixed":false},{"id":"m4g-01","topic":"m4-glicogenosi","level":"f","page":"136","src":"Biochimica II","q":"Che cosa sono le glicogenosi?","opts":["Malattie da difetti enzimatici del metabolismo del glicogeno","Infezioni del fegato","Forme di diabete","Malattie del glucagone"],"ans":0,"why":"Sono malattie ereditarie, quasi tutte autosomiche recessive.","note":null,"fixed":false},{"id":"m4g-02","topic":"m4-glicogenosi","level":"m","page":"137","src":"Biochimica II","q":"Quale enzima manca nella malattia di von Gierke (tipo I)?","opts":["Glucosio 6-fosfatasi","Fosforilasi muscolare","Enzima deramificante","α-glucosidasi lisosomiale"],"ans":0,"why":"Ipoglicemia grave a digiuno, epatomegalia, acidosi lattica.","note":null,"fixed":false},{"id":"m4g-03","topic":"m4-glicogenosi","level":"m","page":"138","src":"Biochimica II","q":"Quale enzima manca nella malattia di McArdle (tipo V)?","opts":["Glicogeno fosforilasi muscolare","Glucosio 6-fosfatasi","Enzima ramificante","Fosfofruttochinasi epatica"],"ans":0,"why":"Crampi e intolleranza all'esercizio; la glicemia è normale.","note":null,"fixed":false},{"id":"m4g-04","topic":"m4-glicogenosi","level":"a","page":"137","src":"Biochimica II","q":"Perché nella von Gierke si dà amido di mais crudo?","opts":["Viene digerito lentamente e libera glucosio in modo graduale, evitando l'ipoglicemia notturna","Perché contiene fruttosio","Perché blocca la glicolisi","Perché fornisce glucosio 6-fosfatasi"],"ans":0,"why":"Si danno anche pasti frequenti.","note":"Sbobina di Biochimica II, p. 137: c'è scritto che l'amido crudo rilascia glucosio in modo massiccio. Il senso è l'opposto: lo rilascia lentamente e a lungo.","fixed":false},{"id":"m4g-05","topic":"m4-glicogenosi","level":"a","page":"137","src":"Biochimica II","q":"Perché nella von Gierke c'è iperuricemia e iperlipidemia?","opts":["Il glucosio 6-P accumulato va in glicolisi e nella via dei pentoso fosfati: più lattato, acetil-CoA (grassi) e ribosio 5-P (purine → acido urico)","Perché manca l'insulina","Perché il rene non filtra","Perché c'è troppo glucagone"],"ans":0,"why":"Anche il lattato compete con l'urato per l'escrezione renale.","note":null,"fixed":false},{"id":"m4g-06","topic":"m4-glicogenosi","level":"a","page":"138","src":"Biochimica II","q":"Nella McArdle, che cosa succede al lattato durante lo sforzo?","opts":["Non aumenta, perché il muscolo non può usare il glicogeno","Aumenta molto","Diventa glucosio","Si accumula nel fegato"],"ans":0,"why":"È alla base del test da sforzo ischemico dell'avambraccio.","note":null,"fixed":false},{"id":"m4g-07","topic":"m4-glicogenosi","level":"l","page":"138","src":"Biochimica II","q":"Che cos'è la mioglobinuria che si vede nella McArdle?","opts":["Presenza di mioglobina nelle urine dopo danno muscolare","Mioglobina nel sangue","Carenza di mioglobina","Mioglobina nel fegato"],"ans":0,"why":"Le urine diventano scure dopo sforzi intensi.","note":"Sbobina di Biochimica II, p. 138: la mioglobinuria è definita «presenza di mioglobina nel sangue». È la presenza di mioglobina nelle urine (la mioglobina nel sangue è la mioglobinemia).","fixed":false},{"id":"m4g-08","topic":"m4-glicogenosi","level":"l","page":"136","src":"Biochimica II","q":"Come si chiama la glicogenosi di tipo II e quale enzima manca?","opts":["Malattia di Pompe, α-glucosidasi acida lisosomiale","Malattia di Cori, deramificante","Malattia di Andersen, ramificante","Malattia di Hers, fosforilasi epatica"],"ans":0,"why":"È anche una malattia da accumulo lisosomiale.","note":null,"fixed":false},{"id":"m5f-01","topic":"m5-fonti","level":"f","page":"140","src":"Biochimica II","q":"Quali sono i precursori non glucidici della gluconeogenesi?","opts":["Lattato, amminoacidi (alanina), glicerolo","Acidi grassi a catena pari","Acetil-CoA e corpi chetonici","Colesterolo e glicerolo"],"ans":0,"why":"Dagli acidi grassi a catena pari non si forma glucosio; il propionil-CoA dei grassi dispari sì.","note":null,"fixed":false},{"id":"m5f-02","topic":"m5-fonti","level":"f","page":"140","src":"Biochimica II","q":"Dove avviene la gluconeogenesi?","opts":["Soprattutto nel fegato (circa 90%) e nel rene","Nel muscolo scheletrico","Nel cervello","Negli eritrociti"],"ans":0,"why":"Il rene contribuisce soprattutto di notte e nel digiuno
