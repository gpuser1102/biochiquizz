a²⁺ dentro la cellula dall'esterno","Il Ca²⁺ blocca l'antiporto Na⁺/Ca²⁺ in modo permanente, così tutto quello rilasciato resta nel citosol a lungo","La calmodulina rilascia tutto il Ca²⁺ che aveva legato a riposo, raddoppiando subito la concentrazione libera","Il mitocondrio smette di accumulare Ca²⁺ e rilascia anche quello della matrice, amplificando il segnale"],"ans":0,"why":"Anche la calmodulina-Ca²⁺ può riaprire i recettori per la rianodina.","note":null,"fixed":false},{"id":"b4m-01","topic":"bm4-calmodulina","level":"f","page":"lezione 4","src":"Biologia molecolare","q":"Quanti ioni Ca²⁺ lega la calmodulina?","opts":["4","2","1","7"],"ans":0,"why":"Due domini a mano EF, ciascuno con due siti, separati da una lunga α-elica.","note":null,"fixed":false},{"id":"b4m-02","topic":"bm4-calmodulina","level":"f","page":"lezione 4","src":"Biologia molecolare","q":"Com'è fatto un dominio a mano EF?","opts":["Due α-eliche unite da un loop che coordina il Ca²⁺","Un foglietto β a barile che lega il Ca²⁺ al centro","Un dito di zinco che lega il Ca²⁺ al posto dello Zn²⁺","Due foglietti β uniti da un'elica che lega il Mg²⁺","Un'α-elica avvolta su sé stessa con due cisteine"],"ans":0,"why":"Il Ca²⁺ forma 7 legami di coordinazione con residui acidi (bipiramide pentagonale).","note":null,"fixed":false},{"id":"b4m-03","topic":"bm4-calmodulina","level":"m","page":"lezione 4","src":"Biologia molecolare","q":"Che cosa succede alla calmodulina quando lega il Ca²⁺?","opts":["Cambia conformazione, si richiude e lega e attiva proteine bersaglio come la CaM chinasi","Viene degradata nel proteasoma, liberando le proteine bersaglio che teneva inibite nel citosol","Entra nel reticolo endoplasmatico e chiude i recettori per l'IP₃, spegnendo il rilascio di Ca²⁺","Si lega direttamente al DNA nel nucleo e attiva la trascrizione dei geni con sequenze CRE","Si apre e perde affinità per le proteine bersaglio, che restano inattive finché il Ca²⁺ non scende"],"ans":0,"why":"Modula anche fosfodiesterasi, adenilato ciclasi, Ca²⁺-ATPasi e chinasi delle catene leggere della miosina.","note":null,"fixed":false},{"id":"b4m-04","topic":"bm4-calmodulina","level":"a","page":"lezione 4","src":"Biologia molecolare","q":"Come il Ca²⁺ favorisce la degradazione del glicogeno nel muscolo?","opts":["Ca²⁺-calmodulina attiva la fosforilasi chinasi, che fosforila e attiva la glicogeno fosforilasi","Il Ca²⁺ attiva la glicogeno sintasi, che libera glucosio 1-P dalle estremità del glicogeno","Il Ca²⁺ inibisce la fosforilasi chinasi, così la PKA può attivare da sola la fosforilasi","Il Ca²⁺ attiva la PP1, che defosforila la glicogeno fosforilasi portandola nella forma a","Ca²⁺-calmodulina attiva la PKA, che fosforila e attiva direttamente la glicogeno fosforilasi"],"ans":0,"why":"Contemporaneamente viene bloccata la sintesi del glicogeno.","note":null,"fixed":false},{"id":"b4m-05","topic":"bm4-calmodulina","level":"a","page":"lezione 4","src":"Biologia molecolare","q":"Come può il Ca²⁺ cambiare l'espressione genica?","opts":["Ca²⁺-calmodulina attiva la CaM chinasi, che fosforila fattori di trascrizione come CREB","Il Ca²⁺ si lega direttamente al DNA e cambia la conformazione dei promotori dei geni bersaglio","Il Ca²⁺ attiva STAT tramite JAK, che dimerizza ed entra nel nucleo con il Ca²⁺ legato","Il Ca²⁺ inibisce la RNA polimerasi II, riducendo la trascrizione di tutti i geni della cellula","Ca²⁺-calmodulina attiva la PKA, che fosforila fattori di trascrizione come STAT e Smad"],"ans":0,"why":"CREB è fosforilato anche dalla PKA.","note":null,"fixed":false},{"id":"b4m-06","topic":"bm4-calmodulina","level":"l","page":"lezione 4","src":"Biologia molecolare","q":"Quale stato della glicogeno sintasi e della glicogeno fosforilasi corrisponde alla fosforilazione?","opts":["Sintasi fosforilata inattiva, fosforilasi fosforilata attiva","Entrambe attive quando sono fosforilate","Entrambe inattive quando sono fosforilate","Sintasi fosforilata attiva, fosforilasi fosforilata inattiva","Sintasi fosforilata attiva, fosforilasi fosforilata attiva"],"ans":0,"why":"Così una stessa cascata di fosforilazioni favorisce la degradazione e blocca la sintesi.","note":null,"fixed":false},{"id":"bh4m-01","topic":"bm4-calmodulina","level":"h","page":"lezione 4","src":"Biologia molecolare","q":"Durante la contrazione il Ca²⁺ sale nel muscolo. Quale effetto coordinato ha sul glicogeno?","opts":["Attiva la fosforilasi chinasi (degradazione) e una chinasi che inattiva la glicogeno sintasi: più glucosio per la glicolisi","Attiva la glicogeno sintasi e inibisce la fosforilasi chinasi: il muscolo riforma le sue riserve durante lo sforzo","Non ha effetti diretti sul glicogeno: il Ca²⁺ agisce solo sulla troponina C e sulla contrazione dei filamenti di actina","Attiva la PP1, che defosforila sia la sintasi sia la fosforilasi: degradazione e sintesi procedono insieme","Blocca la glicolisi per risparmiare ATP e attiva la sintasi: il glucosio 6-P viene accumulato come glicogeno"],"ans":0,"why":"Il muscolo che si contrae ha bisogno di ATP dalla glicolisi.","note":null,"fixed":false},{"id":"b4p-01","topic":"bm4-fosfoinositidi","level":"f","page":"lezione 4","src":"Biologia molecolare","q":"Che cosa libera la fosfolipasi C dal PIP₂?","opts":["IP₃ e DAG","Acido arachidonico","Acido fosfatidico","PIP₃"],"ans":0,"why":"Il DAG resta in membrana; l'IP₃ diffonde fino al reticolo endoplasmatico.","note":null,"fixed":false},{"id":"b4p-02","topic":"bm4-fosfoinositidi","level":"f","page":"lezione 4","src":"Biologia molecolare","q":"Quale fosfolipasi libera di solito l'acido arachidonico?","opts":["Fosfolipasi A2","Fosfolipasi A1","Fosfolipasi C","Fosfolipasi D"],"ans":0,"why":"Taglia l'estere in posizione 2 del glicerolo; la D libera l'acido fosfatidico.","note":null,"fixed":false},{"id":"b4p-03","topic":"bm4-fosfoinositidi","level":"m","page":"lezione 4","src":"Biologia molecolare","q":"Quale isoforma di PLC è attivata dai GPCR e quale dagli RTK?","opts":["PLCβ da Gq, PLCγ da RTK","PLCγ da Gq, PLCβ da RTK","PLCδ da entrambi","Solo PLCβ da entrambi"],"ans":0,"why":"La PLCβ può essere attivata anche dalle βγ delle proteine Gi.","note":null,"fixed":false},{"id":"b4p-04","topic":"bm4-fosfoinositidi","level":"m","page":"lezione 4","src":"Biologia molecolare","q":"Che cosa serve per attivare la PKC?","opts":["DAG e Ca²⁺ (più fosfatidilserina di membrana)","cAMP e Ca²⁺ (più fosfatidilcolina di membrana)","IP₃ e Ca²⁺ (più fosfatidiletanolammina)","cGMP e calmodulina (più colesterolo di membrana)","PIP₃ e Mg²⁺ (più sfingomielina)"],"ans":0,"why":"Il Ca²⁺ porta la PKC in membrana sulla fosfatidilserina, il DAG scopre il sito catalitico.","note":null,"fixed":false},{"id":"b4p-05","topic":"bm4-fosfoinositidi","level":"a","page":"lezione 4","src":"Biologia molecolare","q":"Quale di questi processi è attivato dall'aumento di Ca²⁺ via IP₃?","opts":["La secrezione di enzimi digestivi pancreatici indotta dall'acetilcolina","La sintesi di glicogeno epatico indotta dall'insulina dopo il pasto","La produzione di cGMP da NO nella muscolatura liscia dei vasi","La degradazione del cAMP da parte della fosfodiesterasi nel fegato","La traslocazione dei GLUT4 nel muscolo indotta dall'insulina tramite PKB"],"ans":0,"why":"Anche secrezione di amilasi salivare e di insulina, contrazione della muscolatura liscia, glicogenolisi epatica.","note":null,"fixed":false},{"id":"b4p-06","topic":"bm4-fosfoinositidi","level":"a","page":"lezione 4","src":"Biologia molecolare","q":"Che cosa produce la PI3-chinasi e che cosa attiva?","opts":["PIP₃ (fosfato in posizione 3), che attiva la PKB","IP₃, che apre i canali del Ca²⁺ del RE","DAG, che attiva la PKC in membrana","PIP₂ (fosfato in posizione 4), che attiva la PKA","PIP₃ (fosfato in posizione 5), che attiva la PKC"],"ans":0,"why":"Il PIP₃ non è substrato della PLC; la PKB favorisce sopravvivenza, captazione di glucosio e sintesi di glicogeno.","note":null,"fixed":false},{"id":"b4p-07","topic":"bm4-fosfoinositidi","level":"l","page":"lezione 4","src":"Biologia molecolare","q":"Dove taglia la fosfolipasi C?","opts":["Tra il carbonio 3 del glicerolo e il gruppo fosfato","Tra il carbonio 1 del glicerolo e l'acido grasso","Tra il fosfato e la testa polare (inositolo)","Tra il carbonio 2 del glicerolo e l'acido grasso","Tra il carbonio 3 dell'inositolo e il suo fosfato"],"ans":0,"why":"Così si stacca la testa polare (IP₃) con il suo fosfato.","note":null,"fixed":false},{"id":"b4p-08","topic":"bm4-fosfoinositidi","level":"l","page":"lezione 4","src":"Biologia molecolare","q":"Quali proteine attivate dalla PKB controllano la proliferazione secondo la sbobina?","opts":["c-Myc, Bcl-2, Bad","fos, jun e Myc","Smad2, Smad4","STAT3 e STAT5","CREB, CBP, p300"],"ans":0,"why":"fos e jun sono a valle della MAP chinasi.","note":null,"fixed":false},{"id":"bh4p-01","topic":"bm4-fosfoinositidi","level":"h","page":"lezione 4","src":"Biologia molecolare","q":"Un ormone lega un GPCR accoppiato a Gq. Quale sequenza è corretta?","opts":["Gq-GTP → PLCβ → PIP₂ → IP₃ (rilascio di Ca²⁺ dal RE) + DAG → Ca²⁺ e DAG attivano la PKC","Gq-GTP → adenilato ciclasi → cAMP → PKA → fosforilazione dei canali del Ca²⁺ → Ca²⁺ e cAMP attivano la PKC","Gq-GTP → PI3K → PIP₂ → PIP₃ (rilascio di Ca²⁺ dal RE) + DAG → Ca²⁺ e PIP₃ attivano la PKB","Gq-GTP → PLCγ → PIP₃ → IP₄ (rilascio di Ca²⁺ dal mitocondrio) + DAG → Ca²⁺ e DAG attivano la PKA","Gq-GTP → PLCβ → PIP₂ → DAG (rilascio di Ca²⁺ dal RE) + IP₃ → Ca²⁺ e IP₃ attivano la PKC in membrana"],"ans":0,"why":"Lo stesso esito (PLC → IP₃ + DAG) si ottiene da un RTK attraverso la PLCγ.","note":null,"fixed":false},{"id":"bh4p-02","topic":"bm4-fosfoinositidi","level":"h","page":"lezione 4","src":"Biologia molecolare","q":"In una cellula manca la PI3-chinasi. Quale via dell'insulina resta più compromessa?","opts":["Quella Ras-indipendente: niente PIP₃, niente PKB, quindi meno traslocazione di GLUT4 e meno sintesi di glicogeno","Quella Ras-MAPK: niente PIP₃, niente SOS, quindi meno espressione genica e meno proliferazione cellulare","Quella del cAMP: niente PIP₃, niente fosfodiesterasi, quindi la PKA resta attiva e prevale la glicogenolisi","Quella JAK-STAT: niente PIP₃, niente STAT fosforilate, quindi meno trascrizione dei geni della lipogenesi","Nessuna: il PIP₂ basta ad attivare la PKB, quindi traslocazione dei GLUT4 e sintesi di glicogeno restano"],"ans":0,"why":"Gli effetti immediati dell'insulina passano per IRS1 → PI3K → PIP₃ → PKB.","note":null,"fixed":false},{"id":"b4a-01","topic":"bm4-asse","level":"f","page":"lezione 4","src":"Biologia molecolare","q":"Dove agiscono gli ormoni di rilascio prodotti dall'ipotalamo?","opts":["Sull'ipofisi anteriore","Direttamente sui tessuti bersaglio","Sul pancreas","Sulla midollare del surrene"],"ans":0,"why":"L'ipofisi anteriore produce poi ACTH, TSH, LH, FSH, GH.","note":null,"fixed":false},{"id":"b4a-02","topic":"bm4-asse","level":"f","page":"lezione 4","src":"Biologia molecolare","q":"Quali ormoni rilascia l'ipofisi posteriore?","opts":["Ossitocina e vasopressina","ACTH e TSH","Insulina e glucagone","Ormone luteinizzante e FSH","GH e prolattina"],"ans":0,"why":"L'ossitocina agisce su utero e ghiandola mammaria, la vasopressina sul riassorbimento renale di acqua.","note":"Sbobina di Biologia molecolare, lezione 4: dice che la vasopressina controlla il riassorbimento di acqua «a livello delle arteriole renali»; agisce sui tubuli distali e sui dotti collettori (acquaporine).","fixed":false},{"id":"b4a-03","topic":"bm4-asse","level":"m","page":"lezione 4","src":"Biologia molecolare","q":"Che cosa sono i feedback ultrabreve, breve e lungo?","opts":["L'ormone ipotalamico inibisce l'ipotalamo; l'ormone ipofisario inibisce l'ipotalamo; l'ormone periferico inibisce ipofisi e ipotalamo","Tre ormoni tiroidei diversi (T3, T4 e rT3) che inibiscono rispettivamente l'ipotalamo, l'ipofisi e la tiroide stessa","Tre tempi di risposta degli steroidi: secondi (effetti di membrana), minuti (citosol) e ore (effetti sul nucleo)","L'ormone periferico inibisce l'ipotalamo; l'ormone ipofisario inibisce la ghiandola periferica; l'ipotalamo inibisce l'ipofisi","L'ormone ipofisario inibisce l'ipofisi; l'ormone ipotalamico inibisce la ghiandola periferica; l'ormone periferico la stimola"],"ans":0,"why":"Esempio: T3 e T4 inibiscono TSH e TRH.","note":null,"fixed":false},{"id":"b4a-04","topic":"bm4-asse","level":"m","page":"lezione 4","src":"Biologia molecolare","q":"In una tiroidite con T3 e T4 bassi, come sarà il TSH?","opts":["Alto, perché manca il feedback negativo","Basso, perché la tiroide non lo stimola","Normale, perché il TSH non dipende da T3 e T4","Assente, perché la tiroidite distrugge l'ipofisi","Basso, perché manca il feedback positivo"],"ans":0,"why":"È uno dei criteri diagnostici.","note":null,"fixed":false},{"id":"b4a-05","topic":"bm4-asse","level":"a","page":"lezione 4","src":"Biologia molecolare","q":"Com'è fatto il TRH?","opts":["Tripeptide: piroglutammato, istidina, prolina ammidata al C-terminale","Dipeptide di glicina e tirosina iodata, con il carbossile libero","Proteina di 51 aa con due catene unite da ponti disolfuro","Derivato del colesterolo con un anello aromatico, come gli estrogeni","Tripeptide: glutammato, istidina, prolina con carbossile libero"],"ans":0,"why":"La sua identificazione valse il Nobel a Guillemin e Schally: gli ormoni di rilascio sono prodotti in quantità di nanogrammi.","note":null,"fixed":false},{"id":"b4a-06","topic":"bm4-asse","level":"a","page":"lezione 4","src":"Biologia molecolare","q":"Come funziona un dosaggio radioimmunologico di un ormone?","opts":["L'ormone non marcato del campione compete con quello radioattivo per l'anticorpo; con una curva standard si ricava la concentrazione","Si misura direttamente la radioattività dell'ormone endogeno, che è naturalmente marcato con iodio radioattivo, senza anticorpi","Si conta il numero di recettori marcati con un ligando radioattivo e si ricava l'ormone circolante","Si misura l'assorbanza del campione a 280 nm, dovuta ai residui aromatici, e la si confronta con una curva di ormone purificato","L'ormone marcato del campione compete con quello non marcato per il recettore; la radioattività legata è proporzionale all'ormone"],"ans":0,"why":"Più ormone non marcato c'è, meno ormone marcato resta legato all'anticorpo.","note":null,"fixed":false},{"id":"b4a-07","topic":"bm4-asse","level":"l","page":"lezione 4","src":"Biologia molecolare","q":"Nel test ELISA, che cosa rivela la presenza dell'ormone?","opts":["Un anticorpo secondario coniugato a un enzima che trasforma un substrato in un prodotto colorato","La radioattività di un anticorpo secondario marcato con iodio, misurata con un contatore γ","La fluorescenza naturale dell'ormone, eccitata con luce ultravioletta e misurata dallo strumento","Il precipitato di proteine che si forma quando l'ormone lega l'anticorpo primario nel pozzetto","Un anticorpo primario coniugato a un fluoroforo, che emette luce quando lega il recettore dell'ormone"],"ans":0,"why":"L'intensità del colore è proporzionale alla quantità di ormone.","note":null,"fixed":false},{"id":"b4a-08","topic":"bm4-asse","level":"l","page":"lezione 4","src":"Biologia molecolare","q":"Come si dosa l'acetilcolina con enzimi accoppiati?","opts":["Acetilcolinesterasi → colina; colina ossidasi → betaina + H₂O₂; perossidasi usa H₂O₂ per un prodotto colorato","Con un anticorpo anti-acetilcolina marcato con un enzima, che dà un prodotto colorato proporzionale al legame","Misurando il pH del campione: l'acetilcolinesterasi libera acido acetico e il calo del pH dà la concentrazione","Colina acetiltransferasi → acetil-CoA; citrato sintasi → citrato; aconitasi → prodotto colorato misurato","Acetilcolinesterasi → acetato; acetato chinasi → acetil fosfato; fosfatasi usa il fosfato per un prodotto colorato"],"ans":0,"why":"Il colore è proporzionale all'H₂O₂ e quindi all'acetilcolina.","note":null,"fixed":false},{"id":"bh4a-01","topic":"bm4-asse","level":"h","page":"lezione 4","src":"Biologia molecolare","q":"Un paziente ha TSH molto basso e T3/T4 alti. Quale interpretazione è coerente con l'asse?","opts":["Eccesso di ormoni tiroidei di origine tiroidea che, con il feedback negativo, sopprime TSH e TRH","Deficit di TRH ipotalamico che, senza stimolo sull'ipofisi, riduce il TSH e lascia la tiroide senza freno","Tiroidite con distruzione della ghiandola, che libera ormoni e poi blocca la produzione ipofisaria di TSH","Recettori ipofisari del TRH iperattivi, che aumentano gli ormoni tiroidei consumando tutto il TSH prodotto","Mancanza di iodio nella dieta, che riduce il TSH e costringe la tiroide a produrre più T3 e T4 per compenso"],"ans":0,"why":"Se il problema fosse ipofisario (TSH alto) avremmo TSH e ormoni tiroidei entrambi alti.","note":null,"fixed":false},{"id":"b5i-01","topic":"bm5-insulina","level":"f","page":"lezione 5","src":"Biologia molecolare","q":"Quali cellule producono l'insulina?","opts":["Cellule β delle isole di Langerhans","Cellule α delle isole di Langerhans","Cellule δ delle isole di Langerhans","Cellule acinose del pancreas esocrino","Cellule duttali del pancreas esocrino"],"ans":0,"why":"Le α producono glucagone, le δ somatostatina.","note":null,"fixed":false},{"id":"b5i-02","topic":"bm5-insulina","level":"f","page":"lezione 5","src":"Biologia molecolare","q":"Da quanti amminoacidi è formata l'insulina matura?","opts":["51 (21 + 30)","29 (catena unica)","86 (31 + 55)","110 (24 + 86)","51 (catena unica)"],"ans":0,"why":"PM ≈ 5808. Il glucagone ha 29 aa.","note":null,"fixed":false},{"id":"b5i-03","topic":"bm5-insulina","level":"m","page":"lezione 5","src":"Biologia molecolare","q":"Come matura l'insulina?","opts":["Preproinsulina → (taglio del peptide segnale nel RE) proinsulina → (taglio del peptide C) insulina","Proinsulina → (taglio del peptide segnale nel Golgi) preproinsulina → (taglio del peptide C) insulina","Viene sintetizzata già matura sui ribosomi liberi e poi accumulata nei granuli di secrezione","Preproinsulina → (taglio del peptide C nel RE) proinsulina → (taglio del peptide segnale) insulina","Insulina → (glicosilazione nel Golgi) proinsulina → (aggiunta del peptide C nei granuli) forma attiva"],"ans":0,"why":"Il taglio avviene vicino ad amminoacidi basici.","note":null,"fixed":false},{"id":"b5i-04","topic":"bm5-insulina","level":"m","page":"lezione 5","src":"Biologia molecolare","q":"Quali fattori stimolano la secrezione di insulina?","opts":["Glucosio, amminoacidi (arginina), acidi grassi, ormoni gastrointestinali, parasimpatico, sulfoniluree","Adrenalina, noradrenalina, simpatico, somatostatina, glucagone, digiuno prolungato e ipoglicemia","Solo il glucosio, che entra con i GLUT2 e chiude i canali K⁺ ATP-dipendenti della cellula β","Glucagone, cortisolo, ormone della crescita e ipoglicemia, come risposta allo stress","Glucosio, amminoacidi, adrenalina, simpatico, somatostatina e apertura dei canali K⁺ ATP-dipendenti"],"ans":0,"why":"Simpatico e adrenalina (stress) la inibiscono.","note":null,"fixed":false},{"id":"b5i-05","topic":"bm5-insulina","level":"m","page":"lezione 5","src":"Biologia molecolare","q":"Qual è la proteina bersaglio fosforilata dal recettore dell'insulina, comune alle due vie?","opts":["IRS1 (substrato 1 del recettore dell'insulina)","SOS (fattore di scambio del nucleotide di Ras)","PKA (protein chinasi cAMP-dipendente)","STAT5 (trasduttore del segnale e attivatore)","GRB2 (proteina adattatrice con SH2)"],"ans":0,"why":"Da IRS1 partono la via Ras-dipendente e quella Ras-indipendente.","note":null,"fixed":false},{"id":"b5i-06","topic":"bm5-insulina","level":"a","page":"lezione 5","src":"Biologia molecolare","q":"Che differenza c'è tra effetti immediati e tardivi dell'insulina?","opts":["Immediati (minuti, 10⁻⁹–10⁻¹⁰ M): GLUT4 ed enzimi del glicogeno. Tardivi (ore, 10⁻⁸ M): espressione genica (meno gluconeogenesi, più sintesi di trigliceridi)","Sono identici: entrambi compaiono in pochi minuti alle stesse concentrazioni di insulina, ma i tardivi durano di più nel tempo","Immediati (ore, 10⁻⁸ M): espressione genica (meno gluconeogenesi). Tardivi (minuti, 10⁻⁹–10⁻¹⁰ M): GLUT4 ed enzimi del glicogeno","Immediati (minuti, 10⁻⁸ M): richiedono più insulina e agiscono sui GLUT2. Tardivi (giorni, 10⁻⁶ M): passano per il cAMP e la PKA nel nucleo","Immediati (secondi, 10⁻⁶ M): apertura dei canali K⁺. Tardivi (minuti, 10⁻⁹ M): GLUT4, enzimi del glicogeno muscolare e trascrizione"],"ans":0,"why":"I tardivi usano la via Ras-MAPK, gli immediati la via PI3K-PKB.","note":null,"fixed":false},{"id":"b5i-07","topic":"bm5-insulina","level":"a","page":"lezione 5","src":"Biologia molecolare","q":"Come la PKB favorisce la sintesi di glicogeno?","opts":["Fosforila e inattiva la GSK3, così la glicogeno sintasi resta defosforilata e attiva","Fosforila e attiva direttamente la glicogeno sintasi, che passa nella forma a più attiva","Attiva la glicogeno fosforilasi, che in presenza di glucosio lavora al contrario e sintetizza","Aumenta il cAMP, che attiva la PKA e quindi la glicogeno sintasi fosforilata","Attiva la GSK3, che defosforila la glicogeno sintasi e la mantiene nella forma attiva"],"ans":0,"why":"In più attiva la PP1 e la traslocazione dei GLUT4.","note":null,"fixed":false},{"id":"b5i-08","topic":"bm5-insulina","level":"a","page":"lezione 5","src":"Biologia molecolare","q":"Come l'insulina contrasta l'azione del glucagone sulla PKA?","opts":["Attiva una fosfodiesterasi che abbassa il cAMP","Blocca il recettore del glucagone legandosi al suo posto","Fosforila la PKA e la stacca dalle subunità regolatrici","Aumenta l'adenilato ciclasi, che consuma l'ATP disponibile","Inibisce la fosfodiesterasi, così il cAMP viene sequestrato"],"ans":0,"why":"Con meno cAMP la PKA è meno attiva.","note":null,"fixed":false},{"id":"b5i-09","topic":"bm5-insulina","level":"l","page":"lezione 5","src":"Biologia molecolare","q":"Come riconosce la GSK3 il suo substrato?","opts":["Lega una fosfoserina di innesco (priming) introdotta dalla caseina chinasi II e poi fosforila le serine successive","Lega il glucosio 6-fosfato come attivatore allosterico e fosforila tutte le serine della sintasi contemporaneamente","Riconosce una sequenza ricca di prolina sul substrato tramite un dominio SH3, come le chinasi della via di Ras","Lega l'UDP-glucosio legato alla sintasi e fosforila solo le molecole di enzima che stanno già allungando il glicogeno","Lega una fosfotirosina di innesco introdotta dal recettore dell'insulina e poi fosforila le tirosine successive"],"ans":0,"why":"La PKB fosforila un sito di pseudosubstrato all'N-terminale della GSK3, che si ripiega su sé stessa e si inattiva.","note":null,"fixed":false},{"id":"b5i-10","topic":"bm5-insulina","level":"l","page":"lezione 5","src":"Biologia molecolare","q":"Quale proteina nel muscolo, fosforilata dall'insulina, porta la PP1 sul granulo di glicogeno?","opts":["GM","IRS1","AKAP","Calmodulina","GL"],"ans":0,"why":"La PKA (adrenalina) fosforila la GM in un altro sito e la PP1 si stacca; un inibitore fosforilato dalla PKA la blocca.","note":null,"fixed":false},{"id":"b5i-11","topic":"bm5-insulina","level":"l","page":"lezione 5","src":"Biologia molecolare","q":"Perché il dosaggio del peptide C è utile in un diabetico trattato con insulina?","opts":["L'insulina farmaco non ha peptide C: il peptide C misura solo l'insulina endogena","Il peptide C abbassa la glicemia da solo e serve per dosare correttamente l'insulina da somministrare","Il peptide C è la forma attiva dell'insulina: misura quanta insulina farmaco agisce davvero sui tessuti","Il peptide C misura la resistenza all'insulina, perché sale solo quando i recettori sono internalizzati","L'insulina farmaco contiene peptide C: il dosaggio misura quanta insulina esogena è in circolo"],"ans":0,"why":"È prodotto in quantità equimolare all'insulina endogena.","note":null,"fixed":false},{"id":"bh5i-01","topic":"bm5-insulina","level":"h","page":"lezione 5","src":"Biologia molecolare","q":"Dopo un pasto, nel muscolo, la glicogeno sintasi è attiva e la fosforilasi inattiva. Quale combinazione di eventi dovuti all'insulina lo spiega?","opts":["PKB inattiva la GSK3 e la PP1 (portata da GM) defosforila sia la sintasi (attivandola) sia la fosforilasi (inattivandola)","La PKA fosforila entrambi gli enzimi: la sintasi fosforilata è attiva e la fosforilasi fosforilata è inattiva","Il Ca²⁺ attiva la fosforilasi chinasi (portata da GM), che fosforila la sintasi (attivandola) e la fosforilasi (inattivandola)","La GSK3 attivata dalla PKB fosforila la sintasi (attivandola), mentre la PP1 defosforila la fosforilasi","Il cAMP sale e attiva la PP1 (portata da GM), che fosforila sia la sintasi (attivandola) sia la fosforilasi (inattivandola)"],"ans":0,"why":"Sintasi attiva da defosforilata, fosforilasi attiva da fosforilata: la PP1 sposta entrambe verso la sintesi.","note":"Sbobina di Biologia molecolare, lezione 5: in un passaggio scrive «la glicogeno sintasi è defosforilata (inattiva)»: defosforilata è attiva, come dice la sbobina stessa poco prima.","fixed":false},{"id":"bh5i-02","topic":"bm5-insulina","level":"h","page":"lezione 5","src":"Biologia molecolare","q":"Un paziente ha glicemia alta, insulina alta e peptide C alto. Quale meccanismo è più probabile?","opts":["Resistenza all'insulina, per esempio per ridotta espressione o internalizzazione del recettore","Deficit di secrezione delle cellule β, per esempio per distruzione autoimmune delle isole di Langerhans","Eccesso di somatostatina, che blocca il recettore dell'insulina sui tessuti periferici","Insulina esogena in eccesso, somministrata per errore in una dose troppo alta","Mutazione del peptide C, che non viene tagliato e resta legato all'insulina circolante nel plasma"],"ans":0,"why":"Nel diabete di tipo 2 l'insulina c'è ma i tessuti non rispondono; nel tipo 1 manca la secrezione.","note":null,"fixed":false},{"id":"bh5i-03","topic":"bm5-insulina","level":"h","page":"lezione 5","src":"Biologia molecolare","q":"Quale via mediata dall'insulina porta alla trascrizione di geni per glicolisi, glicogeno e acidi grassi?","opts":["IRS1 → Grb2 → SOS → Ras → Raf → MEK → MAP chinasi → fattori di trascrizione","IRS1 → PI3K → PIP₃ → PKB → GSK3 → MAP chinasi → fattori di trascrizione","Recettore → Gs → adenilato ciclasi → cAMP → PKA → CREB → geni bersaglio","Recettore → JAK → STAT fosforilata → dimero di STAT → geni bersaglio","IRS1 → PLCγ → IP₃ → Ca²⁺ → calmodulina → CaM chinasi → fattori di trascrizione"],"ans":0,"why":"È la via Ras-dipendente, responsabile degli effetti anabolici a lungo termine.","note":null,"fixed":false},{"id":"bh5i-04","topic":"bm5-insulina","level":"h","page":"lezione 5","src":"Biologia molecolare","q":"Perché le sulfoniluree aumentano la secrezione di insulina?","opts":["Chiudono i canali K⁺-ATP della cellula β, depolarizzando la membrana e facendo entrare Ca²⁺","Attivano direttamente il recettore dell'insulina sulla cellula β, che si autoregola aumentando la secrezione","Inibiscono la secrezione di glucagone dalle cellule α, che normalmente frena le cellule β vicine","Aprono i canali K⁺-ATP della cellula β, iperpolarizzando la membrana e facendo uscire Ca²⁺","Aumentano i GLUT2 della cellula β, così entra più glucosio e si produce più ATP"],"ans":0,"why":"La sbobina cita le sulfoniluree tra i farmaci che stimolano la secrezione.","note":"Il meccanismo sui canali K⁺-ATP non è spiegato nella sbobina, ma è lo stesso passaggio che usa il glucosio (ATP → chiusura dei canali K⁺ → depolarizzazione → Ca²⁺).","fixed":false},{"id":"d1c-01","topic":"d1-chimica","level":"f","page":"6","src":"Biochimica I","q":"Quali sono i quattro elementi più abbondanti negli organismi viventi?","opts":["H, O, N, C","C, O, P, S","H, O, Na, K","C, N, Fe, Ca"],"ans":0,"why":"Insieme sono circa il 99% della massa cellulare: sono i più leggeri e formano rispettivamente 1, 2, 3 e 4 legami.","note":null,"fixed":false},{"id":"d1c-02","topic":"d1-chimica","level":"f","page":"7","src":"Biochimica I","q":"Che cosa si ottiene ossidando un alcol secondario?","opts":["Un chetone","Un'aldeide","Un acido carbossilico","Un estere"],"ans":0,"why":"L'alcol primario dà aldeide (e poi acido carbossilico); il secondario dà chetone.","note":null,"fixed":false},{"id":"d1c-03","topic":"d1-chimica","level":"m","page":"7","src":"Biochimica I","q":"Che fine fanno gli elettroni persi da un carbonio che si ossida nel metabolismo?","opts":["Passano a NAD⁺ o FAD, poi alla catena respiratoria e infine all'O₂, che diventa acqua","Vengono ceduti direttamente all'O₂ nel citosol, che si riduce ad acqua senza bisogno di coenzimi","Restano sul carbonio come carica negativa, finché il carbonio non viene eliminato come CO₂","Vengono usati per sintetizzare ATP nella glicolisi, legandosi direttamente all'ADP nel citosol","Passano a NADP⁺ o FMN, poi alla catena respiratoria e infine alla CO₂, che diventa bicarbonato"],"ans":0,"why":"Ogni ossidazione toglie 2 elettroni, raccolti dai cofattori e portati fino alla citocromo ossidasi.","note":null,"fixed":false},{"id":"d1c-04","topic":"d1-chimica","level":"m","page":"8","src":"Biochimica I","q":"Qual è la differenza tra configurazione e conformazione?","opts":["La configurazione cambia solo rompendo legami; la conformazione cambia per rotazione attorno ai legami singoli","La conformazione cambia solo rompendo legami; la configurazione cambia per rotazione attorno ai legami singoli","Sono sinonimi: entrambe indicano la disposizione spaziale degli atomi e cambiano solo rompendo legami","La configurazione riguarda solo i doppi legami; la conformazione riguarda solo i centri chirali della molecola","Entrambe cambiano per rotazione attorno ai legami singoli; la configurazione solo a temperature elevate"],"ans":0,"why":"Configurazione: doppi legami (cis-trans) e centri chirali. Conformazione: disposizioni dovute alla libera rotazione.","note":null,"fixed":false},{"id":"d1c-05","topic":"d1-chimica","level":"a","page":"8","src":"Biochimica I","q":"Quanti stereoisomeri può avere una molecola con 3 centri chirali?","opts":["8","6","3","9"],"ans":0,"why":"Con n centri chirali gli stereoisomeri sono 2ⁿ: 2³ = 8.","note":null,"fixed":false},{"id":"d1c-06","topic":"d1-chimica","level":"l","page":"8","src":"Biochimica I","q":"Acido maleico e acido fumarico sono:","opts":["Isomeri geometrici (cis-trans)","Enantiomeri (immagini speculari)","Isomeri di struttura (di posizione)","Conformeri (rotameri)","Diastereoisomeri ottici (epimeri)"],"ans":0,"why":"Differiscono per la disposizione dei sostituenti rispetto a un doppio legame che non ruota: maleico è cis, fumarico è trans.","note":null,"fixed":false},{"id":"d1c-07","topic":"d1-chimica","level":"l","page":"7","src":"Biochimica I","q":"Quale estremità di un polisaccaride si chiama \"riducente\"?","opts":["Quella con il carbonio carbonilico (anomerico) libero","Quella con più gruppi alcolici liberi in posizione 4","Quella legata covalentemente alle proteine di membrana","Quella che contiene il legame glicosidico α1→6","Quella con il carbonio anomerico impegnato nel legame"],"ans":0,"why":"Le macromolecole hanno una polarità: 5'/3' negli acidi nucleici, N/C nelle proteine, riducente/non riducente nei polisaccaridi.","note":null,"fixed":false},{"id":"d1h-01","topic":"d1-chimica","level":"h","page":"6–8","src":"Biochimica I","q":"Una molecola ha 2 centri chirali. Due suoi stereoisomeri non sono immagini speculari tra loro. Come si definiscono?","opts":["Diastereoisomeri","Enantiomeri","Isomeri geometrici","Conformeri sfalsati","Racemi"],"ans":0,"why":"Gli enantiomeri sono immagini speculari non sovrapponibili; gli stereoisomeri non speculari sono diastereoisomeri. Su 4 stereoisomeri possibili (2²) si formano 2 coppie di enantiomeri.","note":null,"fixed":false},{"id":"d1a-01","topic":"d1-acqua","level":"f","page":"8","src":"Biochimica I","q":"Con quante molecole d'acqua può formare legami a idrogeno una molecola d'acqua (es. nel ghiaccio)?","opts":["4","2","3","6"],"ans":0,"why":"La disposizione quasi tetraedrica degli orbitali dell'ossigeno permette 4 legami a H.","note":null,"fixed":false},{"id":"d1a-02","topic":"d1-acqua","level":"f","page":"9","src":"Biochimica I","q":"Perché i gas come O₂ e CO₂ sono poco solubili in acqua?","opts":["Sono apolari","Sono troppo grandi","Sono carichi","Reagiscono con l'acqua"],"ans":0,"why":"Per questo l'O₂ è trasportato da emoglobina e mioglobina e la CO₂ soprattutto come bicarbonato.","note":null,"fixed":false},{"id":"d1a-03","topic":"d1-acqua","level":"m","page":"9","src":"Biochimica I","q":"Che cos'è un clatrato?","opts":["La gabbia ordinata di molecole d'acqua attorno a un soluto apolare","Un aggregato di molecole anfipatiche con le code apolari rivolte verso l'acqua","Un legame a idrogeno condiviso tra tre atomi di ossigeno vicini","Una micella con il core polare e la superficie apolare esposta","La sfera di idratazione disordinata attorno a uno ione carico"],"ans":0,"why":"È una struttura termodinamicamente sfavorita: l'acqua perde entropia.","note":null,"fixed":false},{"id":"d1a-04","topic":"d1-acqua","level":"a","page":"9","src":"Biochimica I","q":"Perché la formazione spontanea delle membrane biologiche è termodinamicamente favorita?","opts":["Perché l'aggregazione delle code apolari libera l'acqua dei clatrati, aumentandone l'entropia","Perché si formano molti legami covalenti tra i fosfolipidi vicini, che liberano energia","Perché le teste polari si respingono e spingono le code apolari a unirsi al centro","Perché l'acqua si lega alle code apolari e le ordina, diminuendo l'entalpia del sistema","Perché l'aggregazione delle teste polari libera i controioni, diminuendo l'entropia dell'acqua"],"ans":0,"why":"È l'effetto idrofobico: lo stesso principio spiega micelle, legame enzima-substrato e ripiegamento delle proteine.","note":null,"fixed":false},{"id":"d1a-05","topic":"d1-acqua","level":"l","page":"8","src":"Biochimica I","q":"Qual è la caratteristica geometrica che rende più forte un legame a idrogeno?","opts":["I tre atomi coinvolti allineati su una retta","Un angolo di 90° tra donatore e accettore","La presenza di un doppio legame vicino","La distanza massima tra i due atomi elettronegativi"],"ans":0,"why":"Il legame a idrogeno è direzionale: è massimo quando l'H sta tra i due atomi elettronegativi in linea.","note":null,"fixed":false},{"id":"d1h-02","topic":"d1-acqua","level":"h","page":"9–10","src":"Biochimica I","q":"Un enzima e il suo substrato si legano anche se il legame non forma interazioni particolarmente forti. Quale contributo termodinamico favorisce il complesso?","opts":["L'aumento di entropia delle molecole d'acqua liberate dalle superfici a contatto","La diminuzione di entropia del complesso, che diventa più ordinato e quindi più stabile","La formazione di legami covalenti transitori tra il sito attivo e il substrato legato","L'aumento di entalpia dovuto alla rottura dei legami a H tra l'acqua e le due superfici","La riduzione del numero di molecole d'acqua libere, che diventano più ordinate"],"ans":0,"why":"Separati, enzima e substrato ordinano l'acqua intorno a sé; legandosi ne liberano una parte, che guadagna disordine.","note":null,"fixed":false},{"id":"d1m-01","topic":"d1-metabolismo","level":"f","page":"10","src":"Biochimica I","q":"Dove si accumula il glucosio come riserva negli animali?","opts":["Come glicogeno in fegato e muscolo","Come amido nel fegato e nel rene","Come trigliceridi nel muscolo scheletrico","Come cellulosa nel tessuto adiposo","Come glicogeno nel tessuto adiposo"],"ans":0,"why":"I lipidi di riserva stanno invece nel tessuto adiposo.","note":null,"fixed":false},{"id":"d1m-02","topic":"d1-metabolismo","level":"m","page":"10","src":"Biochimica I","q":"Quale ruolo hanno soprattutto gli amminoacidi nel metabolismo secondo la sbobina?","opts":["Sintesi delle proteine; come fonte di energia sono secondari","Fonte principale di energia per tutti i tessuti","Riserva energetica a lungo termine, accumulata nel muscolo","Componente principale delle membrane, insieme ai fosfolipidi","Precursori del glucosio; nella sintesi proteica sono secondari"],"ans":0,"why":"Le principali fonti di energia sono carboidrati e lipidi.","note":null,"fixed":false},{"id":"d1m-03","topic":"d1-metabolismo","level":"a","page":"10","src":"Biochimica I","q":"Quale di questi è un lavoro cellulare che consuma ATP per mantenere la vitalità della cellula?","opts":["Il mantenimento del potenziale di membrana","La diffusione dell'O₂ attraverso la membrana","La formazione dei legami a idrogeno dell'acqua","La rotazione attorno ai legami singoli"],"ans":0,"why":"L'ATP serve a contrazione muscolare, biosintesi e mantenimento dei gradienti ionici.","note":null,"fixed":false},{"id":"d1m-04","topic":"d1-metabolismo","level":"l","page":"7","src":"Biochimica I","q":"Come si chiama l'insieme delle molecole contenenti carboidrati di una cellula?","opts":["Glicoma","Lipidoma","Proteoma","Metaboloma"],"ans":0,"why":"Proteoma = proteine, genoma = DNA, glicoma = carboidrati, lipidoma = lipidi.","note":null,"fixed":false},{"id":"d2s-01","topic":"d2-strutturali","level":"f","page":"11","src":"Biochimica I","q":"Quale amminoacido non ha un carbonio α chirale?","opts":["Glicina","Alanina","Prolina","Serina"],"ans":0,"why":"La catena laterale della glicina è un H: il carbonio α ha due sostituenti uguali.","note":null,"fixed":false},{"id":"d2s-02","topic":"d2-strutturali","level":"f","page":"11","src":"Biochimica I","q":"A quale serie appartengono gli amminoacidi delle proteine?","opts":["L","D","Sia L sia D in egual misura","Nessuna delle due"],"ans":0,"why":"I D-amminoacidi si trovano solo in piccoli peptidi (parete batterica, antibiotici), sintetizzati senza ribosomi.","note":null,"fixed":false},{"id":"d2s-03","topic":"d2-strutturali","level":"m","page":"12","src":"Biochimica I","q":"Gli L-amminoacidi sono tutti levogiri?","opts":["No, non c'è relazione tra serie D/L e verso di rotazione della luce polarizzata","Sì, per definizione: la lettera L indica proprio la rotazione a sinistra della luce","Sì, tutti tranne la glicina, che non ha centri chirali e non ruota la luce polarizzata","No, sono tutti destrogiri: la serie L corrisponde sempre alla rotazione verso destra","Sì, perché hanno tutti la stessa configurazione della L-gliceraldeide, che è levogira"],"ans":0,"why":"D/L è una convenzione basata sulla gliceraldeide; il segno +/− si misura al polarimetro.","note":null,"fixed":false},{"id":"d2s-04","topic":"d2-strutturali","level":"m","page":"13","src":"Biochimica I","q":"Nel sistema R/S, gli L-amminoacidi sono quasi tutti S. Qual è l'eccezione?","opts":["L-cisteina (R)","L-prolina (R)","L-serina (R)","L-treonina (R)"],"ans":0,"why":"Lo zolfo della catena laterale ha priorità sul carbossile, quindi la sequenza dei sostituenti risulta in verso orario.","note":null,"fixed":false},{"id":"d2s-05","topic":"d2-strutturali","level":"a","page":"14","src":"Biochimica I","q":"Quali amminoacidi hanno due centri chirali?","opts":["Isoleucina e treonina","Leucina e valina","Serina e cisteina","Prolina e istidina","Isoleucina e leucina"],"ans":0,"why":"Oltre al carbonio α è chirale il carbonio β; esistono i diastereoisomeri L-alloisoleucina e L-allotreonina.","note":null,"fixed":false},{"id":"d2s-06","topic":"d2-strutturali","level":"a","page":"15","src":"Biochimica I","q":"La talidomide è un esempio di:","opts":["Enantiomeri con effetti diversi: R sedativo, S teratogeno","Diastereoisomeri con la stessa attività sedativa","Farmaco attivo solo come miscela racemica dei due isomeri","Isomeri geometrici del legame peptidico con effetti diversi","Enantiomeri con effetti diversi: R teratogeno, S sedativo"],"ans":0,"why":"Eutomero = enantiomero attivo, distomero = inattivo o con effetti indesiderati. Oggi è usata nel mieloma multiplo.","note":null,"fixed":false},{"id":"d2s-07","topic":"d2-strutturali","level":"l","page":"15","src":"Biochimica I","q":"Come si chiama l'enantiomero di un farmaco biologicamente attivo?","opts":["Eutomero","Distomero","Racemo","Anomero"],"ans":0,"why":"Il distomero è quello inattivo o dannoso.","note":null,"fixed":false},{"id":"d2h-01","topic":"d2-strutturali","level":"h","page":"12–13","src":"Biochimica I","q":"Un campione di alanina non ruota il piano della luce polarizzata. La spiegazione più probabile è:","opts":["È una miscela racemica di D- e L-alanina in parti uguali","È L-alanina pura, che non è otticamente attiva perché ha la configurazione L","L'alanina non ha centri chirali, come la glicina, e non ruota mai la luce","È D-alanina pura, che a differenza della L non ruota la luce polarizzata","Il polarimetro misura solo i D-amminoacidi e non rileva la L-alanina"],"ans":0,"why":"D- e L-alanina ruotano la luce dello stesso angolo in verso opposto: in un racemo le rotazioni si annullano.","note":null,"fixed":false},{"id":"d2c-01","topic":"d2-classificazione","level":"f","page":"16","src":"Biochimica I","q":"Quale amminoacido è un \"imminoacido\"?","opts":["Prolina","Istidina","Triptofano","Glicina"],"ans":0,"why":"La catena laterale si richiude sul gruppo amminico, che resta senza H.","note":null,"fixed":false},{"id":"d2c-02","topic":"d2-classificazione","level":"f","page":"16","src":"Biochimica I","q":"Quale amminoacido assorbe di più a 280 nm?","opts":["Triptofano","Fenilalanina","Tirosina","Istidina"],"ans":0,"why":"Assorbono gli aromatici: triptofano più di tirosina, la fenilalanina meno.","note":null,"fixed":false},{"id":"d2c-03","topic":"d2-classificazione","level":"m","page":"16","src":"Biochimica I","q":"Perché la metionina si comporta da amminoacido apolare pur contenendo zolfo?","opts":["Lo zolfo è all'interno della catena (tioetere), non è un gruppo polare libero","Lo zolfo è sempre ossidato a solfossido, che non forma legami a idrogeno con l'acqua","Forma ponti disolfuro con altre metionine, che nascondono lo zolfo all'interno della proteina","Ha un anello aromatico che contiene lo zolfo e rende apolare tutta la catena laterale","Lo zolfo è all'estremità della catena (tio ambi ruotati in senso antiorario (negativi).","note":null,"fixed":false},{"id":"d3h-02","topic":"d3-secondaria","level":"h","page":"29–31","src":"Biochimica I","q":"Una sequenza ricca di prolina e glicina è più probabile che formi:","opts":["Ripiegamenti β o regioni senza struttura regolare","Un'α-elica lunga e stabile, con molti legami a H","Un foglietto β parallelo ideale e molto regolare","Il nucleo idrofobico compatto della proteina","Una superelica coiled coil come nella cheratina"],"ans":0,"why":"Entrambi destabilizzano l'α-elica; la prolina in cis e la glicina flessibile sono invece tipiche dei β-turn.","note":null,"fixed":false},{"id":"d3c-01","topic":"d3-collagene","level":"f","page":"35","src":"Biochimica I","q":"Qual è l'unità tripeptidica ripetuta del collagene?","opts":["Gly-X-Y (X spesso Pro, Y spesso 4-Hyp)","Ala-Gly-Ser (X spesso Pro, Y spesso Lys)","Pro-Pro-Gly-Cys (con ponti disolfuro)","Lys-X-Y (X spesso Gly, Y spesso 5-Hyl)","Gly-X-Y (X spesso Cys, Y spesso Trp)"],"ans":0,"why":"Mancano cisteina e triptofano.","note":null,"fixed":false},{"id":"d3c-02","topic":"d3-collagene","level":"f","page":"36","src":"Biochimica I","q":"Quale vitamina serve all'idrossilazione della prolina del collagene?","opts":["Vitamina C","Vitamina K","Vitamina B12","Vitamina D"],"ans":0,"why":"L'acido ascorbico riporta il ferro dell'enzima da Fe³⁺ a Fe²⁺.","note":null,"fixed":false},{"id":"d3c-03","topic":"d3-collagene","level":"m","page":"35","src":"Biochimica I","q":"Com'è avvolta la tripla elica del collagene?","opts":["Tre catene sinistrorse avvolte tra loro in una superelica destrorsa","Tre α-eliche destrorse avvolte tra loro in una superelica sinistrorsa","Due catene β antiparallele avvolte tra loro, stabilizzate da ponti disolfuro","Tre catene destrorse avvolte tra loro in una superelica anch'essa destrorsa","Tre catene sinistrorse avvolte tra loro in una superelica sinistrorsa"],"ans":0,"why":"Ogni catena ha ~3,3 residui per giro; è diversa dall'α-elica.","note":null,"fixed":false},{"id":"d3c-04","topic":"d3-collagene","level":"m","page":"36","src":"Biochimica I","q":"Perché serve una glicina ogni tre residui?","opts":["È l'unico residuo abbastanza piccolo da stare al centro della tripla elica","È il residuo che forma i legami crociati covalenti tra le molecole vicine","È il residuo che viene idrossilato dalla prolil-idrossilasi nel RE","È il residuo su cui si legano glucosio e galattosio nel Golgi","È l'unico residuo abbastanza grande da riempire il centro della tripla elica"],"ans":0,"why":"I suoi N–H formano i legami a H tra le tre catene.","note":null,"fixed":false},{"id":"d3c-05","topic":"d3-collagene","level":"a","page":"37","src":"Biochimica I","q":"Nella reazione della prolil-idrossilasi, che fine fa l'α-chetoglutarato?","opts":["Viene decarbossilato e ossidato a succinato + CO₂","Viene ridotto a glutammato con il gruppo amminico della prolina","Si lega covalentemente alla prolina idrossilata come gruppo prostetico","Non partecipa alla reazione: è solo un effettore allosterico","Viene carbossilato e ridotto a citrato consumando CO₂"],"ans":0,"why":"Un atomo dell'O₂ va sulla prolina, l'altro sull'α-chetoglutarato.","note":"Sbobina di Biochimica I, p. 40: dice che l'α-chetoglutarato viene «ridotto» ad acido succinico; è una decarbossilazione ossidativa.","fixed":false},{"id":"d3c-06","topic":"d3-collagene","level":"a","page":"39","src":"Biochimica I","q":"Perché lo scorbuto dà gengive sanguinanti e ferite che si riaprono?","opts":["Senza vitamina C il collagene non viene idrossilato e la tripla elica è instabile","Senza vitamina K i fattori della coagulazione non vengono carbossilati e il sangue non coagula","Senza vitamina C si accumulano troppi legami crociati e il collagene diventa fragile","Senza vitamina C il collagene non viene secreto e resta accumulato nei fibroblasti","Senza vitamina C il collagene non viene glicosilato e la tripla elica si srotola"],"ans":0,"why":"Senza idrossiprolina il collagene si denatura ciati di allisina"],"ans":0,"why":"Due α-eliche destrorse in coiled coil sinistrorso; la permanente rompe e riforma i ponti disolfuro.","note":null,"fixed":false},{"id":"d3h-03","topic":"d3-collagene","level":"h","page":"44","src":"Biochimica I","q":"Un bambino ha fratture multiple da traumi minimi; un altro ha articolazioni ipermobili e pelle iperestensibile. Entrambi hanno probabilmente:","opts":["Difetti genetici del collagene: osteogenesi imperfetta il primo, Ehlers-Danlos il secondo","Scorbuto da carenza di vitamina C: fragilità ossea il primo, lassità dei legamenti il secondo","Latirismo da β-amminopropionitrile: fratture il primo, iperestensibilità della pelle il secondo","Deficit di elastina: fragilità ossea il primo, sindrome di Marfan con lassità il secondo","Carenza di vitamina D in entrambi: rachitismo il primo, ipotonia muscolare il secondo"],"ans":0,"why":"Le malattie ereditarie del collagene; scorbuto e latirismo dipendono invece dalla dieta.","note":null,"fixed":false},{"id":"d3h-04","topic":"d3-collagene","level":"h","page":"42","src":"Biochimica I","q":"Con l'età tendini e articolazioni diventano più rigidi. Il meccanismo molecolare principale è:","opts":["L'accumulo di legami crociati covalenti tra le molecole di collagene","La perdita progressiva delle glicine della tripla elica","La riduzione dell'idrossiprolina per minore attività della prolil-idrossilasi","La sostituzione progressiva del collagene con fibre di elastina","L'aumento della glicosilazione delle idrossilisine del collagene"],"ans":0,"why":"I legami crociati tra allisine (o allisina e lisina) aumentano col tempo e irrigidiscono le fibre.","note":null,"fixed":false},{"id":"d3h-05","topic":"d3-collagene","level":"h","page":"36–37","src":"Biochimica I","q":"La prolil-idrossilasi a volte lavora senza prolina. Cosa succede e perché serve la vitamina C?","opts":["L'α-chetoglutarato viene decarbossilato lo stesso e il ferro resta Fe³⁺: l'ascorbato lo riporta a Fe²⁺","L'enzima idrossila un' »; sono 540 Å.","fixed":false},{"id":"d3t-04","topic":"d3-terziaria","level":"l","page":"47","src":"Biochimica I","q":"Come si chiama la struttura formata da più cappi β-α-β ripetuti che si richiudono su sé stessi?","opts":["Barile α/β","Chiave greca","Coiled coil","Foglietto β piatto"],"ans":0,"why":"La chiave greca è fatta solo di filamenti β.","note":null,"fixed":false},{"id":"d3h-06","topic":"d3-terziaria","level":"h","page":"33","src":"Biochimica I","q":"Una soluzione proteica ha A₂₈₀ = 0,5 in una cuvetta da 1 cm. In una cuvetta da 2 cm l'assorbanza sarebbe:","opts":["1,0","0,25","0,5","2,0","0,75"],"ans":0,"why":"A = ε·c·l: raddoppiando il cammino ottico l'assorbanza raddoppia.","note":"Sbobina di Biochimica I, p. 33: definisce l'assorbanza come log del rapporto «trasmessa/incidente»; è log(I₀/I), incidente su trasmessa (la formula riportata è corretta).","fixed":false},{"id":"d3f-01","topic":"d3-folding","level":"f","page":"55","src":"Biochimica I","q":"Con quale proteina Anfinsen studiò il folding?","opts":["Ribonucleasi A","Mioglobina","Lisozima C","Insulina","Citocromo c"],"ans":0,"why":"Piccolo enzima monomerico di 124 aa con 4 ponti disolfuro.","note":null,"fixed":false},{"id":"d3f-02","topic":"d3-folding","level":"f","page":"55","src":"Biochimica I","q":"A cosa serve il β-mercaptoetanolo nell'esperimento di Anfinsen?","opts":["Riduce i ponti disolfuro","Denatura rompendo le interazioni idrofobiche","Ossida le cisteine","Idrolizza i legami peptidici"],"ans":0,"why":"L'urea (agente caotropico) denatura; il β-mercaptoetanolo riduce.","note":null,"fixed":false},{"id":"d3f-03","topic":"d3-folding","level":"m","page":"55","src":"Biochimica I","q":"Che cosa dimostrò Anfinsen rimuovendo insieme urea e β-mercaptoetanolo?","opts":["La ribonucleasi si ripiega da sola e riacquista tutta l'attività: la sequenza contiene l'informazione del folding","La ribonucleasi si ripiega solo con l'aiuto dei chaperoni: senza di loro la sequenza non basta a dare la struttura","I ponti disolfuro si formano a caso: la ribonucleasi recupera solo l'1% dell'attività, come atteso statisticamente","La ribonucleasi resta inattiva: una volta denaturata, una proteina non può più riacquistare la sua struttura","La ribonucleasi riacquista l'attività solo se si aggiunge ATP, che fornisce l'energia per il ripiegamento"],"ans":0,"why":"Nobel 1972: la struttura nativa è la più stabile termodinamicamente.","note":null,"fixed":false},{"id":"d3f-04","topic":"d3-folding","level":"m","page":"54","src":"Biochimica I","q":"Che cosa afferma il paradosso di Levinthal?","opts":["Esplorando a caso tutte le conformazioni il folding richiederebbe un tempo incompatibile con la vita","Le proteine non si ripiegano mai da sole: serve sempre l'intervento delle chaperonine con ATP","Il folding non è spontaneo, perché la catena ripiegata ha meno entropia di quella distesa","Il folding avviene solo nel ribosoma, mentre la catena viene ancora sintetizzata dal C-terminale","Esplorando a caso tutte le conformazioni il folding avverrebbe in pochi nanosecondi, troppo in fretta"],"ans":0,"why":"Il ripiegamento segue vie dirette, determinate dalla sequenza.","note":null,"fixed":false},{"id":"d3f-05","topic":"d3-folding","level":"m","page":"58","src":"Biochimica I","q":"Quale coppia di chaperonine forma la camera di ripiegamento in E. coli?","opts":["GroEL (14 subunità) e GroES (7 subunità)","DnaK (Hsp70) e DnaJ (Hsp40)","Hsp90 (2 subunità) e Hsp70 (1 subunità)","PDI (2 subunità) e GrpE (2 subunità)","GroES (14 subunità) e GroEL (7 subunità)"],"ans":0,"why":"GroES fa da coperchio alla camera di GroEL.","note":null,"fixed":false},{"id":"d3f-06","topic":"d3-folding","level":"a","page":"49–50","src":"Biochimica I","q":"Il folding riduce il disordine della catena. Perché è comunque spontaneo?","opts":["Il collasso idrofobico libera l'acqua ordinata attorno alle catene apolari, aumentandone l'entropia","Si formano molti ponti disolfuro, ciascuno dei quali libera molta energia e compensa l'ordine della catena","I residui polari liberano energia legandosi tra loro all'interno della proteina ripiegata","Il folding consuma ATP, che fornisce l'energia libera necessaria a ordinare la catena","Il collasso idrofobico ordina l'acqua attorno alle catene apolari, diminuendone l'entalpia e l'entropia"],"ans":0,"why":"Il contributo dei residui polari è circa nullo.","note":null,"fixed":false},{"id":"d3f-07","topic":"d3-folding","level":"a","page":"57","src":"Biochimica I","q":"Con 8 cisteine, quante combinazioni di 4 ponti disolfuro sono possibili?","opts":["105","28","16","840"],"ans":0,"why":"7 × 5 × 3 × 1 = 105, di cui una sola corretta: il folding è deterministico.","note":null,"fixed":false},{"id":"d3f-08","topic":"d3-folding","level":"a","page":"58","src":"Biochimica I","q":"Nel ciclo di Hsp70, che cosa fanno DnaJ e GrpE?","opts":["DnaJ stimola l'idrolisi dell'ATP (DnaK si chiude sulla proteina); GrpE scambia ADP con ATP (DnaK la rilascia)","DnaJ scambia ADP con ATP (DnaK si chiude sulla proteina); GrpE stimola l'idrolisi dell'ATP (DnaK la rilascia)","Sono le due subunità di GroEL: DnaJ forma l'anello inferiore della camera, GrpE quello superiore","Degradano le proteine misfoldate: DnaJ le marca con l'ubiquitina, GrpE le porta al proteasoma 26S","DnaJ lega la proteina nascente e la porta a GroEL; GrpE fa da coperchio alla camera al posto di GroES"],"ans":0,"why":"DnaK-ADP è la forma chiusa ad alta affinità.","note":null,"fixed":false},{"id":"d3f-09","topic":"d3-folding","level":"l","page":"59","src":"Biochimica I","q":"Quale percentuale delle proteine neosintetizzate richiede anche GroEL/GroES secondo la sbobina?","opts":["≈ 15%","≈ 85%","≈ 50%","≈ 1%"],"ans":0,"why":"L'85% si ripiega da sola o con Hsp70.","note":null,"fixed":false},{"id":"d3f-10","topic":"d3-folding","level":"l","page":"56","src":"Biochimica I","q":"Che effetto ha lo iodoacetato sulle cisteine?","opts":["Le carbossimetila covalentemente","Le ossida ad acido cisteico (−SO₃⁻)","Riduce i ponti disolfuro tra cisteine","Le trasforma in serine per idrolisi","Forma nuovi ponti disolfuro tra cisteine"],"ans":0,"why":"L'acido performico invece le ossida ad acido cisteico (−SO₃⁻).","note":null,"fixed":false},{"id":"d3f-11","topic":"d3-folding","level":"l","page":"60","src":"Biochimica I","q":"Dove agisce la proteina disolfuro isomerasi?","opts":["Nel reticolo endoplasmatico","Nel citosol, sui ribosomi liberi","Nella matrice dei mitocondri","Nel nucleo, sulle proteine istoniche","Nei lisosomi, prima della degradazione"],"ans":0,"why":"Rompe e riforma i ponti disolfuro finché non si ottengono quelli corretti.","note":null,"fixed":false},{"id":"d3h-07","topic":"d3-folding","level":"h","page":"55","src":"Biochimica I","q":"Anfinsen riossida la ribonucleasi denaturata lasciando l'urea. Ottiene un enzima inattivo. Cosa lo riattiva?","opts":["Togliere l'urea e aggiungere tracce di β-mercaptoetanolo, che rimescola i ponti disolfuro finché si formano quelli giusti","Aggiungere altra urea e più β-mercaptoetanolo, che rompe definitivamente tutti i ponti disolfuro e libera la catena","Aggiungere chaperoni GroEL e GroES con ATP, che ripiegano la proteina anche se i ponti disolfuro restano quelli sbagliati","Riscaldare a 90 °C senza riducente, così i ponti disolfuro sbagliati si sciolgono e quelli giusti si riformano da soli","Togliere l'urea e aggiungere iodoacetato, che blocca le cisteine libere e stabilizza i ponti disolfuro già formati"],"ans":0,"why":"I ponti disolfuro formati a caso bloccano la proteina «rimescolata»; con poco riducente si rompono e riformano nella configurazione nativa, più stabile.","note":null,"fixed":false},{"id":"d3h-08","topic":"d3-folding","level":"h","page":"62","src":"Biochimica I","q":"Perché nelle malattie da aggregati (Alzheimer, Parkinson, prioni) è difficile intervenire una volta iniziata la malattia?","opts":["I controlli funzionano prima dell'oligomerizzazione: formati gli oligomeri di foglietti β, la crescita delle fibrille accelera","Le proteine aggregate sono troppo piccole per essere riconosciute: gli oligomeri sfuggono sia ai chaperoni sia al proteasoma","Il proteasoma degrada solo le fibrille mature: gli oligomeri iniziali restano nella cellula e continuano a crescere senza controllo","Le fibrille sono fatte di α-eliche molto stabili, che nessun sistema cellulare riesce a srotolare e degradare","Le proteine coinvolte non hanno una sequenza nota: non è possibile capire quale conformazione prendano"],"ans":0,"why":"Il passaggio chiave è la conversione verso strutture piatte ricche di foglietti β che si impilano.","note":null,"fixed":false},{"id":"d3h-09","topic":"d3-folding","level":"h","page":"62","src":"Biochimica I","q":"Una proteina non si ripiega nonostante Hsp70 e GroEL/ES. Qual è il suo destino normale?","opts":["Marcatura con ubiquitina e degradazione nel proteasoma o per autofagia","Secrezione all'esterno della cellula, dove viene ripiegata dalle proteasi extracellulari","Ritorno al ribosoma per essere riletta e sintetizzata di nuovo con la sequenza corretta","Trasferimento nel reticolo endoplasmatico, dove resta in modo permanente legata alla PDI","Accumulo nei mitocondri, dove viene ripiegata dalle chaperonine mitocondriali Hsp60"],"ans":0,"why":"Se l'eliminazione fallisce si formano oligomeri e aggregati.","note":"Sbobina di Biochimica I, p. 62: dice che l'ubiquitina «riconosce» le proteine misfoldate; la riconoscono gli enzimi della via di ubiquitinazione (E3 ligasi), che poi attaccano l'ubiquitina. Semplificazione accettabile.","fixed":false},{"id":"d3q-01","topic":"d3-quaternaria","level":"f","page":"64","src":"Biochimica I","q":"Che cos'è la struttura quaternaria?","opts":["L'associazione di due o più catene polipeptidiche (subunità) in un complesso","Il ripiegamento tridimensionale di una singola catena polipeptidica nello spazio","La sequenza degli amminoacidi di tutte le catene di un complesso proteico","L'insieme di α-eliche e foglietti β che formano i domini di una sola catena","L'associazione di più domini della stessa catena polipeptidica in un'unità compatta"],"ans":0,"why":"Le subunità sono tenute insieme da interazioni deboli, interazioni idrofobiche e talvolta ponti disolfuro.","note":null,"fixed":false},{"id":"d3q-02","topic":"d3-quaternaria","level":"f","page":"67","src":"Biochimica I","q":"Come si chiama una proteina formata da più subunità uguali?","opts":["Omo-oligomero","Etero-oligomero","Protomero","Monomero"],"ans":0,"why":"Se le subunità sono diverse è un etero-oligomero (es. l'anticorpo).","note":null,"fixed":false},{"id":"d3q-03","topic":"d3-quaternaria","level":"m","page":"66","src":"Biochimica I","q":"Quali sono i vantaggi della struttura quaternaria?","opts":["Stabilità, economia genetica, siti attivi tra subunità, cooperatività","Solo una maggiore solubilità in acqua rispetto ai monomeri isolati","Maggiore velocità di traduzione di un gene lungo, con meno errori","Resistenza alle proteasi e alla denaturazione, ma nient'altro","Meno geni da trascrivere, ma minore stabilità e nessuna cooperatività"],"ans":0,"why":"Un gene per 100 aa è più piccolo e si trascrive e traduce in modo più efficiente di uno per 700 aa.","note":null,"fixed":false},{"id":"d3q-04","topic":"d3-quaternaria","level":"m","page":"66","src":"Biochimica I","q":"Che cos'è la cooperatività in una proteina multimerica?","opts":["Il cambio conformazionale di una subunità si trasmette alle altre tramite i contatti tra subunità","La capacità di legare più substrati diversi contemporaneamente sullo stesso sito attivo della proteina","La formazione di ponti disolfuro tra subunità diverse, che le rendono un'unica catena","La polimerizzazione delle subunità in fibre lunghe, come accade per la tubulina","Il legame del substrato a una subunità, che blocca sempre le altre subunità dell'intero complesso"],"ans":0,"why":"È alla base del comportamento dell'emoglobina.","note":null,"fixed":false},{"id":"d3q-05","topic":"d3-quaternaria","level":"a","page":"65","src":"Biochimica I","q":"Perché una proteina fatta di L-amminoacidi non può avere subunità disposte come immagini speculari?","opts":["L'immagine speculare richiederebbe una subunità fatta di D-amminoacidi","I ponti disolfuro tra le subunità impediscono qualsiasi tipo di simmetria","Le subunità di una proteina multimerica sono sempre diverse tra loro","La simmetria ciclica è vietata per tutte le proteine fatte di L-amminoacidi","L'immagine speculare richiederebbe legami peptidici in conformazione cis"],"ans":0,"why":"Sono possibili solo simmetrie di rotazione (ciclica, diedrica), non di inversione o riflessione.","note":null,"fixed":false},{"id":"d3q-06","topic":"d3-quaternaria","level":"a","page":"67","src":"Biochimica I","q":"Perché i microtubuli polimerizzano e depolimerizzano molto rapidamente?","opts":["I protomeri di tubulina (dimeri αβ) sono associati in modo stabile ma non covalente","Le tubuline sono unite da ponti disolfuro che si rompono e si riformano molto rapidamente","La tubulina è una proteina fibrosa a tripla elica, che si avvolge e si srotola in continuazione","Ogni protomero è un monomero di tubulina α o β, legato covalentemente a quello successivo","I protomeri di tubulina (dimeri αβ) sono uniti da legami covalenti che si idrolizzano facilmente"],"ans":0,"why":"Il protomero è l'unità che si ripete: per la tubulina è il dimero αβ.","note":null,"fixed":false},{"id":"d3q-07","topic":"d3-quaternaria","level":"l","page":"64","src":"Biochimica I","q":"In quale tipo di associazione due subunità si affacciano con la stessa superficie in modo complementare?","opts":["Isologa","Eterologa","Eterologa aperta","Diedrica"],"ans":0,"why":"Nell'eterologa le subunità si concatenano traslando lungo un asse; due associazioni isologhe ruotate danno il tetramero isologo.","note":null,"fixed":false},{"id":"d3q-08","topic":"d3-quaternaria","level":"l","page":"67","src":"Biochimica I","q":"Quante subunità ha GroES e come si definisce?","opts":["7, è un eptamero a simmetria ciclica","14, è un tetradecamero a simmetria diedrica","4, è un tetramero a simmetria diedrica","2, è un dimero isologo a simmetria ciclica","7, è un eptamero a simmetria diedrica"],"ans":0,"why":"Visto dal basso forma un coperchio regolare: esempio di simmetria ciclica.","note":null,"fixed":false},{"id":"dh3q-01","topic":"d3-quaternaria","level":"h","page":"65","src":"Biochimica I","q":"Un tetramero di subunità identiche ha due assi di rotazione di ordine 2 perpendicolari tra loro. Che simmetria ha?","opts":["Diedrica D2, la più comune nei tetrameri","Ciclica C4, tipica dei tetrameri","Speculare, per riflessione su un piano","Elicoidale, come i polimeri","Diedrica D4, come i tetrameri planari"],"ans":0,"why":"La simmetria diedrica si ha quando un asse di rotazione è perpendicolare a un asse doppio: tipica dei tetrameri.","note":null,"fixed":false},{"id":"dh3q-02","topic":"d3-quaternaria","level":"h","page":"66","src":"Biochimica I","q":"Un anticorpo è formato da 2 catene pesanti e 2 leggere unite da ponti disolfuro. Come si classifica?","opts":["Etero-oligomero tetramerico, con ponti disolfuro intermolecolari che ne impediscono la dissociazione","Omo-tetramero a simmetria ciclica, con subunità identiche unite da ponti disolfuro intramolecolari","Proteina monomerica con quattro domini, uniti da ponti disolfuro all'interno della stessa catena","Dimero isologo di due catene uguali, con ponti disolfuro che legano i domini di ciascuna catena","Polimero di protomeri come la tubulina, con legami non covalenti che ne permettono la dissociazione"],"ans":0,"why":"Le catene sono diverse a due a due; i ponti disolfuro stabilizzano anche i singoli domini, tipico delle proteine extracellulari.","note":null,"fixed":false},{"id":"d3x-01","topic":"d3-tecniche","level":"f","page":"53","src":"Biochimica I","q":"Che cos'è il proteoma?","opts":["L'insieme delle proteine espresse da una cellula in un dato momento","L'insieme dei geni di una cellula, uguale in tutti i tessuti dell'organismo","L'insieme delle proteine di tutti i tessuti, sempre uguale nel corso della vita","La sequenza completa degli amminoacidi di una proteina e le sue modificazioni","L'insieme degli mRNA trascritti da una cellula in un dato momento"],"ans":0,"why":"Cambia con il tipo cellulare, lo sviluppo e il ciclo cellulare: è l'espressione funzionale del genoma.","note":null,"fixed":false},{"id":"d3x-02","topic":"d3-tecniche","level":"f","page":"53","src":"Biochimica I","q":"Su quali proprietà si basano le strategie di purificazione delle proteine?","opts":["Solubilità, carica, dimensione, capacità di legare altre molecole","Solo la sequenza amminoacidica, determinata prima della purificazione","Solo il colore e l'assorbanza nel visibile delle diverse proteine","Il numero di ponti disolfuro e la temperatura di denaturazione","Il punto di fusione, la viscosità e l'indice di rifrazione della proteina"],"ans":0,"why":"Si parte da un estratto cellulare totale e si separa sfruttando queste differenze.","note":null,"fixed":false},{"id":"d3x-03","topic":"d3-tecniche","level":"m","page":"53","src":"Biochimica I","q":"Che rapporto c'è tra purezza e resa in una purificazione?","opts":["Più alta è la purezza richiesta, più bassa è la resa","Purezza e resa crescono insieme a ogni passaggio","La resa è sempre il 100% se si lavora a 4 °C","Non c'è relazione: dipendono da fattori diversi","Più alta è la purezza richiesta, più alta è la resa"],"ans":0,"why":"A ogni passaggio si perde un po' di proteina; per la cristallografia serve una purezza altissima.","note":null,"fixed":false},{"id":"d3x-04","topic":"d3-tecniche","level":"m","page":"54","src":"Biochimica I","q":"Che cosa si separa con una centrifugazione a bassa velocità (500 g per 10 min) dell'omogenato?","opts":["Cellule non lisate e frammenti grossolani, che vanno sul fondo","I ribosomi e i polisomi, che vanno sul fondo della provetta","Le proteine solubili del citosol, che precipitano sul fondo","I microsomi (frammenti di RE), che formano il pellet compatto","I mitocondri e i lisosomi, mentre i nuclei restano sospesi in alto"],"ans":0,"why":"Nel sopranatante restano membrane, organuli più piccoli e molecole solubili.","note":null,"fixed":false},{"id":"d3x-05","topic":"d3-tecniche","level":"a","page":"54","src":"Biochimica I","q":"Perché per la cristallografia ai raggi X serve una proteina estremamente pura?","opts":["Un cristallo si ottiene solo da sostanze molto pure","Le impurità assorbono i raggi X e coprono il segnale della proteina","La proteina va prima denaturata e le impurità lo impediscono","Serve una grande resa, che si ottiene solo con proteine pure","Le impurità cambiano la sequenza della proteina nel cristallo"],"ans":0,"why":"Il grado di purezza dipende dagli studi che si vogliono fare.","note":null,"fixed":false},{"id":"d3x-06","topic":"d3-tecniche","level":"l","page":"54","src":"Biochimica I","q":"Che caratteristiche ha un'ultracentrifuga?","opts":["Fino a ~80.000 rpm e 600.000 g, camera sotto vuoto, refrigerata e blindata","Fino a ~3000 rpm, a temperatura ambiente, senza vuoto né refrigerazione","Usa un campo elettrico al posto della forza centrifuga per separare le molecole","Funziona solo con proteine già precipitate con solfato d'ammonio","Fino a ~8.000 rpm e 6.000 g, aperta all'aria, usata per cellule e batteri"],"ans":0,"why":"Si usa per separare organuli e macromolecole; le centrifughe comuni per cellule, batteri e precipitati con solfato d'ammonio.","note":null,"fixed":false},{"id":"d3x-07","topic":"d3-tecniche","level":"l","page":"54","src":"Biochimica I","q":"In quale ordine sedimentano le frazioni con centrifugazioni via via più forti?","opts":["Nuclei e cellule intere → mitocondri → microsomi → citosol (sopranatante finale)","Microsomi → mitocondri → nuclei e cellule intere → citosol (sopranatante finale)","Citosol → nuclei e cellule intere → mitocondri → microsomi (sopranatante finale)","Tutte le frazioni sedimentano insieme a 500 g: si separano poi per densità","Mitocondri → nuclei e cellule intere → microsomi → citosol (sopranatante finale)"],"ans":0,"why":"È il principio della centrifugazione differenziale.","note":"Sbobina di Biochimica I, p. 54: indica 100.000 g per separare i mitocondri. Di norma i mitocondri sedimentano già a ~10.000–20.000 g; a 100.000 g si raccoglie la frazione microsomiale.","fixed":false},{"id":"dh3x-01","topic":"d3-tecniche","level":"h","page":"53–54","src":"Biochimica I","q":"Vuoi studiare un enzima della matrice mitocondriale. Quale primo passaggio ha più senso dopo l'omogeneizzazione?","opts":["Centrifugazione differenziale per isolare la frazione mitocondriale, poi purificazione per carica, dimensione o affinità","Cristallizzare subito l'omogenato, poi identificare l'enzima nella struttura ottenuta con la diffrazione ai raggi X","Ultracentrifugare l'omogenato a 600.000 g e usare il sopranatante, dove restano gli enzimi della matrice mitocondriale","Precipitare tutte le proteine con urea 8 M, poi separarle per carica e dimensione con le cromatografie","Ridurre i ponti disolfuro con β-mercaptoetanolo, poi purificare per affinità dall'omogenato totale"],"ans":0,"why":"Separare prima l'organulo riduce molto il numero di proteine da cui purificare; l'urea denaturerebbe l'enzima.","note":null,"fixed":false},{"id":"h1c-01","topic":"m1-catabolismo","level":"h","page":"6–9","src":"Biochimica II","q":"Un nutriente viene completamente ossidato a CO₂ e H₂O. Quale affermazione sui suoi atomi di carbonio e sugli elettroni ceduti è corretta?","opts":["Gli elettroni passano a NAD⁺/FAD e poi all'O₂; la CO₂ nasce dalle decarbossilazioni","Il carbonio reagisce con l'O₂ nella catena respiratoria e forma direttamente CO₂","Gli elettroni vanno all'O₂ già nella glicolisi, che per questo richiede ossigeno","L'H₂O si forma nel ciclo di Krebs, mentre la CO₂ si forma nel complesso IV","NADH e FADH₂ sono i metaboliti terminali e vengono eliminati con le urine"],"ans":0,"why":"L'O₂ è solo l'accettore finale degli elettroni (forma H₂O); la CO₂ nasce dalle decarbossilazioni ossidative (PDH, isocitrato e α-chetoglutarato deidrogenasi).","note":null,"fixed":false},{"id":"h1c-02","topic":"m1-catabolismo","level":"h","page":"8–9","src":"Biochimica II","q":"Perché l'acetil-CoA è definito metabolita intermedio e non terminale?","opts":["Perché può essere ossidato nel Krebs oppure usato per biosintesi, secondo lo stato energetico","Perché deriva solo dai carboidrati e non può essere prodotto da altri nutrienti","Perché non può più dare energia e serve soltanto come precursore per le biosintesi","Perché viene eliminato con la respirazione, insieme alla CO₂ prodotta dal ciclo di Krebs","Perché nell'uomo può essere riconvertito in glucosio quando la glicemia si abbassa a digiuno"],"ans":0,"why":"Un metabolita terminale (CO₂, H₂O, urea) non rientra nel metabolismo. L'acetil-CoA è precursore di acidi grassi e colesterolo; nell'uomo non può dare glucosio netto.","note":null,"fixed":false},{"id":"h1c-03","topic":"m1-catabolismo","level":"h","page":"6–7","src":"Biochimica II","q":"Una cellula si sta preparando a dividersi. Quale combinazione descrive correttamente il suo fabbisogno metabolico?","opts":["Catabolismo per ATP e NADPH, più precursori per sintetizzare DNA e fosfolipidi","Solo anabolismo, perché durante la mitosi il catabolismo si arresta del tutto","Solo catabolismo, perché la divisione consuma le molecole complesse esistenti","Solo ATP, perché le biosintesi di DNA e membrane non richiedono potere riducente","Potere riducente sotto forma di NAD⁺ ossidato, ceduto dalle vie anaboliche"],"ans":0,"why":"Servono basi azotate, acidi grassi, glicerolo e teste polari. Le biosintesi sono riduttive e consumano ATP: catabolismo e anabolismo sono accoppiati.","note":"Sbobina di Biochimica II, pp. 6–7: il potere riducente per le biosintesi è indicato come «soprattutto NADH». Per le biosintesi riduttive il coenzima è il NADPH (Lehninger).","fixed":false},{"id":"h1c-04","topic":"m1-catabolismo","level":"h","page":"8","src":"Biochimica II","q":"Perché la glicolisi è considerata un processo ossidativo, pur non consumando ossigeno?","opts":["Perché il glucosio cede elettroni al NAD⁺ nella reazione della GAP deidrogenasi","Perché libera CO₂ nella reazione dell'aldolasi, come le decarbossilazioni ossidative","Perché consuma ATP nella fase preparatoria, cedendo energia all'ambiente","Perché avviene in parte nel mitocondrio, dove si trovano gli enzimi ossidativi","Perché riduce il piruvato a lattato, ossidando in parallelo il NADH a NAD⁺"],"ans":0,"why":"Ossidazione significa perdita di elettroni, non reazione con l'O₂. L'ossigeno interviene solo sul destino del NADH e del piruvato.","note":null,"fixed":false},{"id":"h1c-05","topic":"m1-catabolismo","level":"h","page":"8","src":"Biochimica II","q":"Da quale processo la cellula ricava la maggior parte dell'ATP ottenuto dall'ossidazione completa del glucosio?","opts":["Dalla fosforilazione ossidativa, che riossida NADH e FADH₂","Dalla glicolisi, grazie alle due fosforilazioni a livello del substrato","Dal ciclo di Krebs, grazie al GTP prodotto dalla succinil-CoA sintetasi","Dalla piruvato deidrogenasi, che forma il legame tioestere dell'acetil-CoA","In parti uguali da glicolisi, ciclo di Krebs e fosforilazione ossidativa"],"ans":0,"why":"Glicolisi e Krebs danno poco ATP diretto (2 + 2): il loro prodotto principale sono i coenzimi ridotti, riossidati nella catena respiratoria (circa 28 ATP).","note":null,"fixed":false},{"id":"h1c-06","topic":"m1-catabolismo","level":"h","page":"6–8","src":"Biochimica II","q":"Come viene eliminato l'azoto degli amminoacidi e perché non come NH₃ libera?","opts":["Viene organicata e trasformata nel fegato in urea, poi eliminata con le urine","Viene espirata come NH₃ insieme alla CO₂ prodotta dalle decarbossilazioni","Viene ossidata a nitrato dalla catena respiratoria e poi filtrata dal rene","Viene immagazzinata come glutammato nel tessuto adiposo fino al pasto successivo","Viene eliminata come acido urico, il principale prodotto azotato nell'uomo"],"ans":0,"why":"L'NH₃ è tossica: viene unita al bicarbonato e trasformata in urea, non tossica. L'acido urico deriva dalle purine, non è la via principale dell'azoto amminoacidico.","note":null,"fixed":false},{"id":"h1c-07","topic":"m1-catabolismo","level":"h","page":"7–8","src":"Biochimica II","q":"Le vie cataboliche di carboidrati, lipidi e proteine sono dette convergenti perché:","opts":["Portano a pochi intermedi comuni (piruvato, acetil-CoA) che entrano nel Krebs","Avvengono tutte nel citosol, dove si trovano gli enzimi della glicolisi e della β-ossidazione","Sono catalizzate dagli stessi enzimi, indipendentemente dal nutriente","Producono tutte urea come prodotto finale, che viene eliminata dal rene","Richiedono tutte l'insulina per far entrare il nutriente nella cellula"],"ans":0,"why":"Le vie anaboliche invece divergono da pochi precursori verso molte molecole complesse.","note":null,"fixed":false},{"id":"h1c-08","topic":"m1-catabolismo","level":"h","page":"6","src":"Biochimica II","q":"Perché vitamine e sali minerali sono indispensabili anche se non forniscono energia?","opts":["Perché da molte vitamine derivano i coenzimi delle reazioni del catabolismo","Perché vengono ossidati nel ciclo di Krebs fino a CO₂, liberando energia","Perché sono la principale riserva di fosfato per la sintesi dell'ATP","Perché sono metaboliti terminali che regolano l'eliminazione delle scorie","Perché forniscono lo scheletro carbonioso dell'acetil-CoA nei tessuti"],"ans":0,"why":"Niacina → NAD, riboflavina → FAD, pantotenato → CoA. Sono micronutrienti: servono in piccole quantità e vengono riciclati.","note":null,"fixed":false},{"id":"h1t-01","topic":"m1-termodinamica","level":"h","page":"11–12","src":"Biochimica II","q":"Una reazione A ⇌ B ha ΔG°' = +7 kJ/mol. Nella cellula B viene consumato rapidamente dalla reazione successiva. Che cosa succede?","opts":["Il rapporto [B]/[A] resta basso e il ΔG reale diventa negativo: procede verso B","Non può avvenire, perché un ΔG°' positivo indica che la reazione è impossibile","Procede solo se l'enzima abbassa il ΔG°' della reazione rendendolo negativo","Procede verso A, perché sottraendo il prodotto la reazione torna indietro","Il ΔG°' diventa negativo, perché il consumo di B cambia le condizioni standard"],"ans":0,"why":"Il termine RT ln([B]/[A]) è negativo quando B è sottratto. È il caso di aldolasi e trioso fosfato isomerasi: decide il ΔG reale, non il ΔG°'.","note":null,"fixed":false},{"id":"h1t-02","topic":"m1-termodinamica","level":"h","page":"11","src":"Biochimica II","q":"Se la Keq di una reazione è 0,01, quale affermazione è corretta?","opts":["ΔG°' è positivo: in condizioni standard prevalgono i reagenti","ΔG°' è negativo e la reazione procede spontaneamente verso i prodotti","ΔG°' è zero, perché la Keq è molto vicina allo zero","La Keq è negativa, quindi la reazione procede verso sinistra","La reazione non può mai avvenire nella cellula, a nessuna concentrazione"],"ans":0,"why":"ΔG°' = −RT ln Keq: ln 0,01 < 0, quindi ΔG°' > 0. Con le concentrazioni cellulari la reazione può comunque procedere.","note":"Sbobina di Biochimica II, p. 11: si parla di Keq «negativa» o «uguale a 0». La Keq è un rapporto di concentrazioni: è sempre positiva; per ΔG°' = 0 vale 1, e per reazioni sfavorite è compresa tra 0 e 1.","fixed":false},{"id":"h1t-03","topic":"m1-termodinamica","level":"h","page":"12–13","src":"Biochimica II","q":"Perché gli enzimi regolati di una via metabolica catalizzano reazioni con ΔG molto negativo?","opts":["Perché sono tappe irreversibili: controllandole si decide flusso e verso della via","Perché solo le reazioni con ΔG negativo hanno bisogno di un enzima per avvenire","Perché l'enzima regolato è quello che rende negativo il ΔG della reazione","Perché le reazioni all'equilibrio sono troppo lente per essere regolate da ormoni","Perché sono le uniche reazioni della via che producono o consumano ATP e GTP"],"ans":0,"why":"Le reazioni con ΔG ≈ 0 seguono le concentrazioni e vanno nei due sensi. Gli enzimi non cambiano il ΔG: cambiano la velocità.","note":null,"fixed":false},{"id":"h1t-04","topic":"m1-termodinamica","level":"h","page":"10","src":"Biochimica II","q":"Una reazione ha ΔG molto negativo nella cellula ma procede lentissima senza enzima. Come si spiega?","opts":["La termodinamica dice se può avvenire, non la velocità: serve un enzima","Il ΔG è stato calcolato male: una reazione favorita è sempre veloce","La reazione è all'equilibrio, quindi la sua velocità netta è zero","Un ΔG molto negativo indica sempre una reazione intrinsecamente lenta","Manca l'ATP, che è necessario per tutte le reazioni con ΔG negativo"],"ans":0,"why":"Termodinamica = possibilità; cinetica = velocità. L'enzima abbassa l'energia di attivazione.","note":null,"fixed":false},{"id":"h1t-05","topic":"m1-termodinamica","level":"h","page":"12","src":"Biochimica II","q":"In una sequenza A ⇌ B ⇌ C di reazioni all'equilibrio, si aggiunge molto C. Che cosa succede?","opts":["Le reazioni si spostano a sinistra: C forma B e B forma A","Aumenta la formazione di C, perché la via è già all'equilibrio","Non succede nulla, perché reazioni all'equilibrio non rispondono","Si blocca solo la seconda reazione, mentre la prima resta invariata","Aumenta A, mentre B resta costante perché è un intermedio"],"ans":0,"why":"Principio di Le Chatelier applicato a reazioni in serie (azione di massa).","note":null,"fixed":false},{"id":"h1t-06","topic":"m1-termodinamica","level":"h","page":"11–12","src":"Biochimica II","q":"Perché il ΔG°' (pH 7, 25 °C, 1 M) va corretto per descrivere una reazione nella cellula?","opts":["Perché nella cellula le concentrazioni sono millimolari e diverse tra loro","Perché nel citosol il pH è circa 4, molto diverso da quello delle condizioni standard","Perché la temperatura corporea annulla il contributo del ΔG°'","Perché gli enzimi della cellula modificano il valore del ΔG°'","Non va corretto: il ΔG°' coincide c
