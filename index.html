a davanti a lei, in modo indipendente","Le tre β ruotano insieme all'anello c e catalizzano a turno durante la rotazione","Le α fanno la catalisi, mentre le β servono solo a legare il fosfato inorganico e l'ADP","Le tre β sono sempre nella stessa conformazione e lavorano tutte insieme a ogni giro di γ"],"ans":0,"why":"La rotazione di γ cambia la conformazione delle β; il passaggio che costa più energia è il rilascio dell'ATP.","note":null,"fixed":false},{"id":"m3s-05","topic":"m3-atpsintasi","level":"m","page":"103–104","src":"Biochimica II","q":"Che cosa fa l'ATP/ADP traslocasi?","opts":["Scambia ATP della matrice con ADP del citosol, sfruttando il potenziale di membrana","Sintetizza ATP dall'ADP citosolico usando il gradiente di protoni della membrana interna","Trasporta il fosfato inorganico nella matrice insieme a un protone","Scambia ADP della matrice con ATP del citosol, consumando ATP per ogni scambio","Trasporta il NADH citosolico dentro la matrice, scambiandolo con il NAD⁺"],"ans":0,"why":"ATP⁴⁻ esce e ADP³⁻ entra: si sposta una carica negativa netta verso l'esterno.","note":null,"fixed":false},{"id":"m3s-06","topic":"m3-atpsintasi","level":"a","page":"105","src":"Biochimica II","q":"Che effetto ha il 2,4-dinitrofenolo?","opts":["Riporta protoni nella matrice scavalcando l'ATP sintasi: l'energia diventa calore","Blocca il complesso IV legando l'eme a3, come il cianuro, e ferma il consumo di O₂","Blocca l'ATP sintasi legando la subunità c del canale F₀, come l'oligomicina","Aumenta la sintesi di ATP perché accelera il trasporto di elettroni","Inibisce l'ATP/ADP traslocasi, bloccando l'uscita dell'ATP verso il citosol"],"ans":0,"why":"È un disaccoppiante; usato in passato come dimagrante, con molti decessi.","note":null,"fixed":false},{"id":"m3s-07","topic":"m3-atpsintasi","level":"a","page":"105","src":"Biochimica II","q":"Con l'oligomicina, che succede al consumo di ossigeno?","opts":["Diminuisce: il gradiente non si scarica e il trasporto di elettroni rallenta","Aumenta: la catena lavora più in fretta per compensare la mancanza di ATP","Non cambia: trasporto di elettroni e sintesi di ATP sono indipendenti","Si azzera solo la glicolisi, mentre la catena respiratoria continua al massimo","Aumenta, perché i protoni rientrano liberamente nella matrice attraverso l'F₀"],"ans":0,"why":"Trasporto di elettroni e sintesi di ATP sono accoppiati.","note":null,"fixed":false},{"id":"m3s-08","topic":"m3-atpsintasi","level":"a","page":"106","src":"Biochimica II","q":"A che cosa serve la termogenina (UCP1) nel tessuto adiposo bruno?","opts":["Lascia rientrare i protoni nella matrice producendo calore invece di ATP","Sintetizza ATP in più usando il gradiente dei protoni del tessuto bruno","Trasporta gli acidi grassi nella matrice al posto della carnitina","Pompa protoni fuori dalla matrice per aumentare il gradiente elettrochimico","Blocca il complesso IV per far accumulare il calore nel mitocondrio"],"ans":0,"why":"È un disaccoppiante fisiologico, importante per la termoregolazione del neonato.","note":null,"fixed":false},{"id":"m3s-09","topic":"m3-atpsintasi","level":"a","page":"101–102","src":"Biochimica II","q":"Nell'anello c dell'F₀, perché l'aspartato si protona e si deprotona?","opts":["Si protona nel semicanale verso lo spazio intermembrana e si deprotona in quello verso la matrice","Viene fosforilato dall'ATP prodotto e defosforilato quando la subunità β rilascia l'ATP nella matrice","Lega una molecola di ATP a ogni giro dell'anello e la cede direttamente alla subunità γ del rotore","Ossida il NADH della matrice e usa l'energia liberata per far ruotare l'anello c","Si protona nel semicanale verso la matrice e si deprotona in quello verso lo spazio intermembrana"],"ans":0,"why":"Ogni protone che entra fa avanzare il rotore di una subunità c.","note":null,"fixed":false},{"id":"m3s-10","topic":"m3-atpsintasi","level":"l","page":"102","src":"Biochimica II","q":"Che cosa significano le sigle O, L e T delle subunità β?","opts":["Open, Loose, Tight","Open, Light, Tight","Oxidized, Loaded, Taut","Open, Locked, Tense","Ordered, Loose, Taut"],"ans":0,"why":"L = loose: lega ADP e Pi in modo lasso.","note":"Sbobina di Biochimica II, p. 102: la L è sciolta come «light». La sigla sta per loose.","fixed":false},{"id":"m3s-11","topic":"m3-atpsintasi","level":"l","page":"101–102","src":"Biochimica II","q":"Nell'ATP sintasi, quale parte ruota e quale fa da statore?","opts":["Ruotano l'anello c con γ ed ε; a, b₂ e δ fanno da statore","Ruota la subunità a; l'anello c e le β fanno da statore","Ruotano le α e le β; l'anello c resta fermo","Ruotano γ e le tre β insieme; la subunità a fa da statore","Non ruota nulla: le β cambiano forma senza movimento"],"ans":0,"why":"Le α3β3 stanno ferme, tenute dal braccio periferico.","note":"Sbobina di Biochimica II, p. 101: c'è scritto che «la proteina a è un rotore che gira». Ruota l'anello delle subunità c; la a fa parte dello statore.","fixed":false},{"id":"m3s-12","topic":"m3-atpsintasi","level":"l","page":"100","src":"Biochimica II","q":"La prima ipotesi sul meccanismo dell'ATP sintasi prevedeva intermedi ad alta energia (accoppiamento chimico). Chi è il premio Nobel della teoria chemiosmotica?","opts":["Peter Mitchell","Hans Krebs","Daniel Koshland","Carl Cori","Albert Lehninger"],"ans":0,"why":"Mitchell la propose nel 1961 e ricevette il Nobel nel 1978.","note":"Sbobina di Biochimica II, p. 100: l'ipotesi dell'accoppiamento chimico è attribuita a Koshland e quella di Mitchell agli anni '70–'80. L'ipotesi chimica è di Slater (1953); Mitchell propose la teoria chemiosmotica nel 1961. Le date non sono nella sbobina, vengono dai testi di riferimento.","fixed":false},{"id":"m3r-01","topic":"m3-radicali","level":"f","page":"108","src":"Biochimica II","q":"Quale enzima trasforma l'anione superossido in perossido di idrogeno?","opts":["Superossido dismutasi","Catalasi perossisomiale","Glutatione perossidasi","NADPH ossidasi","Mieloperossidasi"],"ans":0,"why":"La catalasi ca II","q":"Quali metalli contengono le isoforme della superossido dismutasi?","opts":["Cu-Zn nel citosol, Mn nel mitocondrio","Fe nel citosol, Cu nel mitocondrio","Solo Zn, in tutti i compartimenti","Se nel citosol, Fe nel mitocondrio","Mn nel citosol, Cu-Zn nel mitocondrio"],"ans":0,"why":"Mutazioni della SOD1 (Cu-Zn) sono associate a forme di SLA.","note":null,"fixed":false},{"id":"m3r-06","topic":"m3-radicali","level":"l","page":"109","src":"Biochimica II","q":"Come si chiama il glutatione ossidato?","opts":["GSSG (disolfuro di glutatione)","GSH (glutatione ridotto)","GS-SeH (selenoglutatione)","Glutatione perossido (GS-OOH)","GSOH (glutatione sulfenico)"],"ans":0,"why":"Due GSH legati da un ponte disolfuro tra le cisteine.","note":null,"fixed":false},{"id":"m3m-01","topic":"m3-malattie","level":"f","page":"111","src":"Biochimica II","q":"Da chi si eredita il DNA mitocondriale?","opts":["Solo dalla madre","Solo dal padre","Da entrambi i genitori in parti uguali","Dipende dal sesso del figlio","Dalla madre per le figlie, dal padre per i figli"],"ans":0,"why":"I mitocondri dello spermatozoo non vengono trasmessi allo zigote.","note":null,"fixed":false},{"id":"m3m-02","topic":"m3-malattie","level":"m","page":"111","src":"Biochimica II","q":"Quante proteine codifica il DNA mitocondriale umano?","opts":["13","37","1000","Nessuna","2"],"ans":0,"why":"Tutte subunità della catena respiratoria e dell'ATP sintasi, più rRNA e tRNA.","note":null,"fixed":false},{"id":"m3m-03","topic":"m3-malattie","level":"m","page":"112","src":"Biochimica II","q":"Che cosa si intende per eteroplasmia?","opts":["Coesistenza in una cellula di mitocondri mutati e sani in proporzione variabile","Presenza di soli mitocondri mutati in tutte le cellule dell'organismo","Presenza nello zigote di mitocondri di origine paterna oltre a quelli materni","Mutazione del DNA nucleare che codifica le proteine mitocondriali","Presenza di due copie identiche di DNA mitocondriale per ogni mitocondrio"],"ans":0,"why":"L'omoplasmia è quando tutti i mitocondri sono uguali (tutti mutati o tutti sani).","note":null,"fixed":false},{"id":"m3m-04","topic":"m3-malattie","level":"a","page":"112","src":"Biochimica II","q":"Una donna ha una malattia da mutazione del mtDNA. Chi tra i suoi figli può ereditarla?","opts":["Sia i figli maschi sia le femmine","Solo le figlie, con il 50% di probabilità","Solo i figli maschi","Nessuno, perché il mtDNA non si trasmette","Metà dei figli, come una malattia dominante"],"ans":0,"why":"Tutti i figli ricevono i mitocondri materni; la gravità dipende dalla quota di mitocondri mutati. Solo le figlie la trasmettono alla generazione successiva.","note":"Sbobina di Biochimica II, p. 112: c'è scritto che «le figlie hanno il 50% di probabilità di ereditare la malattia, mentre i figli non sono a rischio». Il mtDNA va a tutti i figli, maschi e femmine; sono i maschi a non trasmetterlo.","fixed":false},{"id":"m3m-05","topic":"m3-malattie","level":"a","page":"112","src":"Biochimica II","q":"Come può l'aumento di UCP2 nelle cellule β contribuire al diabete di tipo 2?","opts":["Scarica il gradiente protonico: meno ATP e quindi meno secrezione di insulina","Aumenta la secrezione di glucagone dalle cellule α vicine, alzando la glicemia","Blocca i GLUT4 delle cellule β e impedisce l'ingresso del glucosio","Inibisce la glucochinasi della cellula β legandola e sequestrandola nel nucleo","Aumenta l'ATP e quindi apre i canali K⁺ della cellula β, che si iperpolarizza"],"ans":0,"why":"L'aumento dei radicali (superossido) induce UCP2: meno ATP, canali K⁺ meno chiusi, meno insulina.","note":null,"fixed":false},{"id":"m3m-06","topic":"m3-malattie","level":"l","page":"113","src":"Biochimica II","q":"Qual è l'ipotesi mitocondriale dell'invecchiamento descritta nella sbobina?","opts":["I radicali danneggiano il mtDNA, poco riparato, e la catena respiratoria perde efficienza","I telomeri del DNA mitocondriale si accorciano a ogni divisione del mitocondrio","I mitocondri di origine paterna si accumulano con l'età e competono con quelli materni","L'ATP sintasi viene degradata dal proteasoma e non è più risintetizzata dal genoma nucleare","I mitocondri smettono di dividersi con l'età e la cellula ne resta progressivamente priva"],"ans":0,"why":"È una delle ipotesi; un'altra chiama in causa difetti della divisione mitocondriale.","note":null,"fixed":false},{"id":"m4d-01","topic":"m4-degradazione","level":"f","page":"115","src":"Biochimica II","q":"Dove si trova soprattutto il glicogeno nell'organismo?","opts":["Fegato e muscolo scheletrico","Cervello e rene","Tessuto adiposo bruno e rene","Eritrociti e muscolo cardiaco","Intestino tenue e pancreas"],"ans":0,"why":"Il glicogeno epatico serve alla glicemia, quello muscolare al muscolo stesso.","note":null,"fixed":false},{"id":"m4d-02","topic":"m4-degradazione","level":"f","page":"116","src":"Biochimica II","q":"Quale enzima stacca le unità di glucosio dal glicogeno?","opts":["Glicogeno fosforilasi","Glicogeno sintasi (reazione inversa)","α-amilasi salivare","Glucosio 6-fosfatasi","Fosfoglucomutasi"],"ans":0,"why":"È una fosforolisi: il legame α-1,4 viene scisso dal fosfato inorganico.","note":null,"fixed":false},{"id":"m4d-03","topic":"m4-degradazione","level":"f","page":"116","src":"Biochimica II","q":"Che prodotto libera la glicogeno fosforilasi?","opts":["Glucosio 1-fosfato","Glucosio libero","Glucosio 6-fosfato","UDP-glucosio","Glucosio 1,6-bisfosfato"],"ans":0,"why":"La fosforolisi conserva l'energia del legame sotto forma di estere fosforico.","note":null,"fixed":false},{"id":"m4d-04","topic":"m4-degradazione","level":"m","page":"116","src":"Biochimica II","q":"Che vantaggio ha la fosforolisi rispetto all'idrolisi?","opts":["Il glucosio esce già fosforilato, senza spendere ATP, e non può lasciare la cellula","Libera più molecole di glucosio per ogni legame rotto rispetto all'idrolisi","È più veloce perché non ha bisogno del piridossal fosfato come cofattore dell'enzima","Non richiede enzimi, perché il fosfato attacca il legame glicosidico spontaneamente","Il glucosio esce libero e può passare subito nel sangue attraverso i GLUT2"],"ans":0,"why":"Nel muscolo si risparmia l'ATP dell'esochinasi.","note":null,"fixed":false},{"id":"m4d-05","topic":"m4-degradazione","level":"m","page":"116","src":"Biochimica II","q":"Quale enzima trasforma il glucosio 1-fosfato in glucosio 6-fosfato?","opts":["Fosfoglucomutasi","Fosfoglucoisomerasi","Glucosio 6-fosfatasi","Esochinasi","Glucochinasi"],"ans":0,"why":"Passa per il glucosio 1,6-bisfosfato.","note":"Sbobina di Biochimica II, p. 116: l'enzima è chiamato «mutazione». Il nome corretto è fosfoglucomutasi.","fixed":false},{"id":"m4d-06","topic":"m4-degradazione","level":"m","page":"117","src":"Biochimica II","q":"Perché il muscolo non può rilasciare glucosio nel sangue?","opts":["Non ha la glucosio 6-fosfatasi","Non ha la glicogeno fosforilasi","Non ha trasportatori GLUT in membrana","Non ha la fosfoglucomutasi","Non ha l'enzima deramificante"],"ans":0,"why":"Il glucosio 6-P del muscolo entra in glicolisi.","note":null,"fixed":false},{"id":"m4d-07","topic":"m4-degradazione","level":"m","page":"117–118","src":"Biochimica II","q":"Che cosa fa l'enzima deramificante?","opts":["Sposta tre residui di un ramo su una catena vicina e idrolizza l'ultimo, legato in α-1,6","Forma i nuovi legami α-1,6 staccando segmenti di sette residui dalle catene in crescita","Stacca glucosio 1-fosfato dai rami con la fosforolisi dei legami α-1,6 dei punti di ramo","Sintetizza la glicogenina e la lega alla prima catena di glucosio del granulo","Idrolizza tutti i legami α-1,4 dei rami fino al punto di ramificazione"],"ans":0,"why":"La fosforilasi si ferma a 4 residui dal punto di ramificazione.","note":null,"fixed":false},{"id":"m4d-08","topic":"m4-degradazione","level":"a","page":"117","src":"Biochimica II","q":"Dove si trova la glucosio 6-fosfatasi e quali organi la possiedono?","opts":["Nel lume del reticolo endoplasmatico; fegato e rene","Nel citosol, libera; soltanto nel fegato adulto","Nel citosol, legata al glicogeno; fegato e muscolo","Nel lume dei lisosomi; in tutti i tessuti del corpo","Sulla membrana plasmatica; fegato e cervello"],"ans":0,"why":"Il G6P entra nel RE tramite un trasportatore (T1); il glucosio esce con GLUT.","note":"Sbobina di Biochimica II, p. 117: la glucosio 6-fosfatasi è definita «esclusiva del fegato». È presente anche nel rene (e nell'intestino), come la stessa sbobina dice a p. 137.","fixed":false},{"id":"m4d-09","topic":"m4-degradazione","level":"a","page":"116","src":"Biochimica II","q":"Quale cofattore usa la glicogeno fosforilasi?","opts":["Piridossal fosfato","Tiamina pirofosfato","Biotina (vitamina H)","Flavin mononucleotide","Acido lipoico"],"ans":0,"why":"Il PLP qui agisce col gruppo fosfato come catalizzatore acido-base, non con la base di Schiff.","note":null,"fixed":false},{"id":"m4d-10","topic":"m4-degradazione","level":"a","page":"118","src":"Biochimica II","q":"Quale percentuale circa del glicogeno viene liberata come glucosio libero e non come glucosio 1-P?","opts":["Circa il 10%","Circa il 50%","Circa il 90%","Nessuna","Circa il 30%"],"ans":0,"why":"Corrisponde ai residui legati in α-1,6 nei punti di ramificazione.","note":null,"fixed":false},{"id":"m4d-11","topic":"m4-degradazione","level":"l","page":"118","src":"Biochimica II","q":"Quale legame idrolizza l'attività α-1,6-glucosidasi del deramificante?","opts":["Il legame α-1,6 del residuo rimasto al punto di ramificazione","I legami α-1,4 dei residui terminali di ogni catena","Il legame tra il primo glucosio e la tirosina della glicogenina","I legami β-1,4 presenti tra i residui delle catene interne","Il legame α-1,4 tra i tre residui spostati dalla transferasi"],"ans":0,"why":"È un'unica proteina con due attività: transferasi e glucosidasi.","note":null,"fixed":false},{"id":"m4s-01","topic":"m4-sintesi","level":"f","page":"122","src":"Biochimica II","q":"Qual è il donatore di glucosio nella sintesi del glicogeno?","opts":["UDP-glucosio","Glucosio 1-fosfato","ADP-glucosio","Glucosio 6-fosfato","CDP-glucosio"],"ans":0,"why":"Nelle piante il donatore per l'amido è l'ADP-glucosio.","note":null,"fixed":false},{"id":"m4s-02","topic":"m4-sintesi","level":"f","page":"122","src":"Biochimica II","q":"Quale enzima allunga le catene del glicogeno con legami α-1,4?","opts":["Glicogeno sintasi","Glicogeno fosforilasi","Enzima ramificante","UDP-glucosio pirofosforilasi","Glicogenina"],"ans":0,"why":"Aggiunge glucosio all'estremità non riducente.","note":null,"fixed":false},{"id":"m4s-03","topic":"m4-sintesi","level":"m","page":"122","src":"Biochimica II","q":"Perché la formazione di UDP-glucosio è irreversibile?","opts":["Il pirofosfato prodotto viene idrolizzato dalla pirofosfatasi inorganica","La reazione consuma GTP, che ha un ΔG di idrolisi più negativo dell'ATP","Avviene nel reticolo endoplasmatico, da cui l'UDP-glucosio non può uscire","L'UTP in eccesso inibisce la reazione inversa legandosi al sito dell'enzima","L'UDP-glucosio viene subito fosforilato dalla glicogeno sintasi nel citosol"],"ans":0,"why":"Un trucco comune nelle biosintesi: si sposta l'equilibrio eliminando un prodotto.","note":null,"fixed":false},{"id":"m4s-04","topic":"m4-sintesi","level":"m","page":"123","src":"Biochimica II","q":"Che cosa fa la glicogenina?","opts":["Fa da innesco: si autoglicosila su una tirosina formando una corta catena di glucosio","Ramifica il glicogeno spostando segmenti di sette residui all'interno con legami α-1,6","Degrada il glicogeno nei lisosomi insieme all'α-glucosidasi acida","Trasporta il glucosio dentro l'epatocita insieme al GLUT2 e lo fosforila subito","Lega la glicogeno fosforilasi e la tiene attiva sulla particella di glicogeno"],"ans":0,"why":"La glicogeno sintasi non può partire da zero, ha bisogno di un primer.","note":null,"fixed":false},{"id":"m4s-05","topic":"m4-sintesi","level":"m","page":"123","src":"Biochimica II","q":"Come lavora l'enzima ramificante?","opts":["Stacca un segmento di circa 7 residui e lo riattacca con legame α-1,6 più all'interno","Aggiunge un singolo glucosio con legame α-1,6 usando direttamente l'UDP-glucosio","Idrolizza i legami α-1,6 dei rami e lascia catene lineari più facili da allungare","Forma legami β-1,4 tra catene vicine per rendere il glicogeno compatto","Stacca un segmento di 3 residui e lo sposta su una catena vicina con legame α-1,4"],"ans":0,"why":"Le ramificazioni aumentano solubilità ed estremità non riducenti per sintesi e degradazione rapide.","note":null,"fixed":false},{"id":"m4s-06","topic":"m4-sintesi","level":"a","page":"122","src":"Biochimica II","q":"Quanti legami fosfoanidridici costa aggiungere un glucosio al glicogeno partendo da glucosio 6-P?","opts":["Due (UTP → UDP + PPi, poi PPi → 2 Pi)","Uno (UTP → UDP + PPi)","Tre (ATP per la fosforilazione più UTP e PPi)","Nessuno, perché la sintasi usa il glucosio 6-P","Quattro (due ATP e due UTP)"],"ans":0,"why":"L'UDP poi viene rifosforilato a UTP spendendo un ATP.","note":null,"fixed":false},{"id":"m4s-07","topic":"m4-sintesi","level":"a","page":"123","src":"Biochimica II","q":"A quale residuo della glicogenina si lega il primo glucosio?","opts":["Tirosina","Serina","Treonina","Asparagina","Lisina"],"ans":0,"why":"Il legame si forma con l'ossidrile fenolico della Tyr194.","note":null,"fixed":false},{"id":"m4s-08","topic":"m4-sintesi","level":"l","page":"122","src":"Biochimica II","q":"Qual è il nome esatto dell'enzima che forma UDP-glucosio?","opts":["UDP-glucosio pirofosforilasi","UDP-glucosio sintasi","Glucosio 1-P uridilchinasi","Glicogeno sintasi (forma a)","UTP-glucosio fosforilasi"],"ans":0,"why":"Il nome viene dalla reazione inversa (pirofosforolisi).","note":null,"fixed":false},{"id":"m4s-09","topic":"m4-sintesi","level":"l","page":"123","src":"Biochimica II","q":"Come si chiama il nome tecnico dell'enzima ramificante?","opts":["Amilo-(1,4→1,6)-transglicosilasi","Amilo-(1,6)-glucosidasi","Oligo-(1,4→1,4)-glucantransferasi","α-amilasi (1,4-glucanoidrolasi)","Glicogeno ramificasi (1,4→1,4)"],"ans":0,"why":"Sposta un segmento da un legame 1,4 a un legame 1,6.","note":null,"fixed":false},{"id":"m4r-01","topic":"m4-regolazione","level":"f","page":"124","src":"Biochimica II","q":"La glicogeno fosforilasi è più attiva quando è:","opts":["Fosforilata (forma a)","Defosforilata (forma b)","Legata all'UDP-glucosio","Legata al glucosio libero","Legata all'insulina"],"ans":0,"why":"La fosforilasi chinasi la fosforila su una serina.","note":null,"fixed":false},{"id":"m4r-02","topic":"m4-regolazione","level":"f","page":"126","src":"Biochimica II","q":"La glicogeno sintasi è più attiva quando è:","opts":["Defosforilata","Fosforilata dalla PKA","Legata al cAMP","Legata all'AMP","Fosforilata dalla GSK3"],"ans":0,"why":"Fosforilazione e defosforilazione hanno effetti opposti su sintasi e fosforilasi.","note":null,"fixed":false},{"id":"m4r-03","topic":"m4-regolazione","level":"m","page":"125","src":"Biochimica II","q":"Nel muscolo, quale regolatore allosterico attiva la fosforilasi b anche senza fosforilazione?","opts":["AMP","ATP","Glucosio 6-fosfato","Glucosio","Ca²⁺ da solo"],"ans":0,"why":"AMP alto = poca energia. ATP e glucosio 6-P la inibiscono.","note":null,"fixed":false},{"id":"m4r-04","topic":"m4-regolazione","level":"m","page":"125","src":"Biochimica II","q":"Nel fegato, quale molecola inattiva la fosforilasi a?","opts":["Glucosio","Ca²⁺","AMP","cAMP","Glucagone"],"ans":0,"why":"Il glucosio la porta nello stato T ed espone le serine alla fosfatasi PP1: il fegato è un sensore della glicemia.","note":null,"fixed":false},{"id":"m4r-05","topic":"m4-regolazione","level":"m","page":"126","src":"Biochimica II","q":"Come agisce l'insulina sulla glicogeno sintasi?","opts":["Attiva PKB, che fosforila e inattiva GSK3: la sintasi resta defosforilata e attiva","Fosforila direttamente la sintasi sul recettore tirosin-chinasico e la attiva","Attiva la PKA, che fosforila la sintasi nella sua forma attiva","Inibisce la PP1, così la sintasi resta fosforilata e attiva","Attiva PKB, che fosforila e attiva GSK3: la sintasi viene fosforilata e attivata"],"ans":0,"why":"Inoltre attiva la PP1.","note":"Sbobina di Biochimica II, p. 126: c'è scritto che la PKB fosforila GSK3 «attivandola» e che così «la glicogeno fosforilasi rimanga defosforilata». La PKB inattiva GSK3 e a restare defosforilata (attiva) è la glicogeno sintasi.","fixed":false},{"id":"m4r-06","topic":"m4-regolazione","level":"a","page":"124–125","src":"Biochimica II","q":"Quali stimoli attivano la fosforilasi chinasi?","opts":["Fosforilazione da PKA e Ca²⁺ legato alla subunità δ (calmodulina)","Solo il glucosio, che si lega alla subunità α e la porta in forma R","L'insulina, tramite la PKB, e il glucosio 6-fosfato","Il glucosio 6-fosfato e l'insulina, come per la glicogeno sintasi","La defosforilazione da parte della PP1 e l'ATP alto nel muscolo a riposo"],"ans":0,"why":"Nel muscolo il Ca²⁺ della contrazione accoppia contrazione e glicogenolisi.","note":null,"fixed":false},{"id":"m4r-07","topic":"m4-regolazione","level":"a","page":"126","src":"Biochimica II","q":"Perché il glucosio 6-fosfato attiva la glicogeno sintasi?","opts":["Rende la sintasi fosforilata un buon substrato della fosfatasi e la attiva allostericamente","È il donatore diretto di glucosio per la catena di glicogeno in crescita sulla glicogenina","Inibisce la secrezione di insulina e quindi la fosforilazione della sintasi","Attiva la PKA, che a sua volta fosforila la sintasi e la porta nella forma attiva a","Viene trasformato in UDP-glucosio dalla sintasi stessa e poi aggiunto alla catena"],"ans":0,"why":"Se c'è tanto G6P conviene immagazzinarlo.","note":null,"fixed":false},{"id":"m4r-08","topic":"m4-regolazione","level":"a","page":"127","src":"Biochimica II","q":"Che ruolo ha la PP1 legata al glicogeno?","opts":["Defosforila fosforilasi, fosforilasi chinasi e sintasi: spegne la degradazione e accende la sintesi","Fosforila la sintasi e la fosforilasi: spegne la sintesi e accende la degradazione del glicogeno","Degrada il glicogeno nei lisosomi insieme all'α-glucosidasi acida, quando il glicogeno è in eccesso","Sintetizza cAMP a partire dall'ATP quando arriva il glucagone, attivando la PKA sul glicogeno","Defosforila soltanto la fosforilasi, senza alcun effetto sulla sintasi e sulla fosforilasi chinasi"],"ans":0,"why":"La subunità GM la ancora al glicogeno; l'insulina ne favorisce l'attività.","note":null,"fixed":false},{"id":"m4r-09","topic":"m4-regolazione","level":"l","page":"124","src":"Biochimica II","q":"Quale residuo viene fosforilato nella glicogeno fosforilasi?","opts":["Ser14","Tyr194","Ser641","Thr172","Thr197"],"ans":0,"why":"Una sola serina per subunità basta a passare da b ad a.","note":null,"fixed":false},{"id":"m4r-10","topic":"m4-regolazione","level":"l","page":"126","src":"Biochimica II","q":"Che significa la sigla GSK3?","opts":["Glicogeno sintasi chinasi 3","Glucosio sensore chinasi 3","Glicogeno sintasi kinasi attivata da glucosio","Guanosina sintasi chinasi 3","Glicogeno sintasi kinasi fosfatasi 3"],"ans":0,"why":"Fosforila la sintasi in tre serine dopo un innesco dato dalla CKII (caseina chinasi II).","note":null,"fixed":false},{"id":"m4o-01","topic":"m4-ormoni","level":"f","page":"129","src":"Biochimica II","q":"Quale ormone stimola la degradazione del glicogeno nel fegato a digiuno?","opts":["Glucagone","Insulina","Leptina","Ossitocina","Cortisolo"],"ans":0,"why":"Il glucagone agisce sul fegato, non sul muscolo.","note":null,"fixed":false},{"id":"m4o-02","topic":"m4-ormoni","level":"m","page":"129–130","src":"Biochimica II","q":"Quale secondo messaggero media l'effetto del glucagone e dell'adrenalina (via β)?","opts":["cAMP","cGMP","IP₃","NO","Ca²⁺ da solo"],"ans":0,"why":"Il cAMP attiva la PKA, che fosforila la fosforilasi chinasi.","note":null,"fixed":false},{"id":"m4o-03","topic":"m4-ormoni","level":"m","page":"130","src":"Biochimica II","q":"Perché il glucagone non agisce sul muscolo?","opts":["Il muscolo non ha recettori per il glucagone","Il muscolo non produce cAMP","Il muscolo non contiene glicogeno","Il glucagone viene degradato nel sangue prima di arrivare","Il muscolo ha recettori, ma la PKA muscolare è inattiva"],"ans":0,"why":"Il muscolo risponde invece all'adrenalina.","note":null,"fixed":false},{"id":"m4o-04","topic":"m4-ormoni","level":"a","page":"131","src":"Biochimica II","q":"Come agisce l'adrenalina sui recettori α1 epatici?","opts":["Via IP₃ e Ca²⁺, attivando la fosforilasi chinasi","Via cAMP e PKA, esattamente come i recettori β","Via tirosin-chinasi e PKB, come l'insulina","Inibendo la PKA e attivando la PP1 sul glicogeno","Via cGMP e PKG, attivando la glicogeno sintasi"],"ans":0,"why":"Ca²⁺ si lega alla calmodulina della fosforilasi chinasi.","note":null,"fixed":false},{"id":"m4o-05","topic":"m4-ormoni","level":"a","page":"131","src":"Biochimica II","q":"Nel fegato, che effetto ha il glucagone sulla glicogeno sintasi?","opts":["Aumenta il cAMP; la PKA fosforila e inattiva la sintasi e attiva la degradazione","La attiva tramite PKB, che inattiva la GSK3 e lascia la sintasi defosforilata","Non ha effetto sulla sintasi, agisce solo sulla glicogeno fosforilasi","La defosforila tramite la PP1 e accende la sintesi di glicogeno anche a digiuno","Aumenta il Ca²⁺, che attiva la sintasi tramite la calmodulina e la CaM chinasi"],"ans":0,"why":"Sintesi e degradazione sono regolate in modo reciproco: non girano mai insieme a pieno regime.","note":"Sbobina di Biochimica II, p. 131: c'è scritto che il glucagone aumenta «i livelli di AMP» dove si intende cAMP, e si parla di inibizione «della distruzione del glicogeno» dove si intende la sintesi.","fixed":false},{"id":"m4o-06","topic":"m4-ormoni","level":"l","page":"132","src":"Biochimica II","q":"Che cosa sono PKB e Akt?","opts":["Due nomi della stessa chinasi attivata dall'insulina","Una proteasi e una chinasi della via dell'insulina","Due fosfatasi che defosforilano la glicogeno sintasi","Il recettore dell'insulina e il suo substrato IRS-1","Due isoforme della PKA presenti nel fegato"],"ans":0,"why":"La PKB/Akt è una serina/treonina chinasi.","note":"Sbobina di Biochimica II, p. 132: la PKB è chiamata «proteasi». È una chinasi.","fixed":false},{"id":"m4e-01","topic":"m4-attivita","level":"f","page":"134","src":"Biochimica II","q":"Durante uno sprint, da dove ricava energia il muscolo?","opts":["Dal glicogeno muscolare via glicolisi anaerobia","Dagli acidi grassi via β-ossidazione","Dai corpi chetonici prodotti dal fegato","Dalle proteine muscolari via transaminazione","Dal glucosio del sangue via respirazione aerobia"],"ans":0,"why":"Lo sforzo intenso e breve usa la fermentazione lattica.","note":null,"fixed":false},{"id":"m4e-02","topic":"m4-attivita","level":"m","page":"134–135","src":"Biochimica II","q":"Nella maratona, che cosa cambia rispetto allo sprint?","opts":["Il metabolismo è aerobio e usa sempre più acidi grassi, risparmiando glicogeno","Usa solo glicogeno muscolare, che basta per tutta la durata della corsa","Usa soprattutto creatina fosfato, che si rigenera continuamente durante lo sforzo","Produce molto più lattato, perché lo sforzo dura più a lungo e il glicogeno si esaurisce","Usa soprattutto proteine muscolari come fonte principale di energia per la contrazione"],"ans":0,"why":"Quando il glicogeno si esaurisce si ha il «muro».","note":null,"fixed":false},{"id":"m4e-03","topic":"m4-attivita","level":"a","page":"135","src":"Biochimica II","q":"Perché con una dieta ricca di grassi e povera di carboidrati il glicogeno non si ricostituisce dopo lo sforzo?","opts":["Gli acidi grassi danno acetil-CoA, e dall'acetil-CoA non si torna al glucosio","I grassi inibiscono la glicogeno sintasi tramite la PKA muscolare attivata","Gli acidi grassi non entrano nel muscolo senza insulina e il muscolo resta a secco","I grassi consumano tutto l'ATP necessario alla sintesi di glicogeno","I grassi bloccano i GLUT4 e impediscono l'ingresso del glucosio nel muscolo"],"ans":0,"why":"Serve mangiare carboidrati, subito dopo lo sforzo e poi a intervalli regolari nelle 24 ore successive.","note":"Sbobina di Biochimica II, p. 135: c'è scritto che «la reazione della piruvato carbossilasi è irreversibile». L'enzima irreversibile tra piruvato e acetil-CoA è la piruvato deidrogenasi.","fixed":false},{"id":"m4e-04","topic":"m4-attivita","level":"l","page":"134","src":"Biochimica II","q":"Quanto dura indicativamente la riserva di fosfocreatina in uno sforzo massimale?","opts":["Pochi secondi","Circa 10 minuti","Circa un'ora","Un giorno","Circa 2 minuti"],"ans":0,"why":"Dopo pochi secondi subentra la glicolisi anaerobia.","note":null,"fixed":false},{"id":"m4g-01","topic":"m4-glicogenosi","level":"f","page":"136","src":"Biochimica II","q":"Che cosa sono le glicogenosi?","opts":["Malattie da difetti enzimatici del metabolismo del glicogeno","Infezioni virali del fegato che causano accumulo di glicogeno","Forme di diabete con eccesso di glicogeno epatico e muscolare","Malattie endocrine da eccesso di glucagone in circolo","Malattie autoimmuni dirette contro la glicogeno sintasi"],"ans":0,"why":"Sono malattie ereditarie, quasi tutte autosomiche recessive.","note":null,"fixed":false},{"id":"m4g-02","topic":"m4-glicogenosi","level":"m","page":"137","src":"Biochimica II","q":"Quale enzima manca nella malattia di von Gierke (tipo I)?","opts":["Glucosio 6-fosfatasi","Glicogeno fosforilasi muscolare","Enzima deramificante","α-glucosidasi acida lisosomiale","Enzima ramificante"],"ans":0,"why":"Ipoglicemia grave a digiuno, epatomegalia, acidosi lattica.","note":null,"fixed":false},{"id":"m4g-03","topic":"m4-glicogenosi","level":"m","page":"138","src":"Biochimica II","q":"Quale enzima manca nella malattia di McArdle (tipo V)?","opts":["Glicogeno fosforilasi muscolare","Glucosio 6-fosfatasi epatica","Enzima ramificante (amilo-transglicosilasi)","Fosfofruttochinasi muscolare","Glicogeno fosforilasi epatica"],"ans":0,"why":"Crampi e intolleranza all'esercizio; la glicemia è normale.","note":null,"fixed":false},{"id":"m4g-04","topic":"m4-glicogenosi","level":"a","page":"137","src":"Biochimica II","q":"Perché nella von Gierke si dà amido di mais crudo?","opts":["Viene digerito lentamente e libera glucosio poco per volta, evitando l'ipoglicemia","Contiene fruttosio, che entra nella glicolisi senza passare dal glucosio 6-fosfato","Blocca la glicolisi epatica e lascia così più glucosio 6-fosfato disponibile per il sangue","Fornisce una glucosio 6-fosfatasi vegetale che l'intestino assorbe e porta al fegato","Viene trasformato direttamente in glicogeno nell'intestino, che poi lo rilascia nel sangue"],"ans":0,"why":"Si danno anche pasti frequenti.","note":"Sbobina di Biochimica II, p. 137: c'è scritto che l'amido crudo rilascia glucosio in modo massiccio. Il senso è l'opposto: lo rilascia lentamente e a lungo.","fixed":false},{"id":"m4g-05","topic":"m4-glicogenosi","level":"a","page":"137","src":"Biochimica II","q":"Perché nella von Gierke c'è iperuricemia e iperlipidemia?","opts":["Il G6P accumulato alimenta glicolisi e pentosi: più acetil-CoA (grassi) e ribosio 5-P (purine → urato)","Manca l'insulina, quindi la lipolisi del tessuto adiposo resta sempre attiva e il rene trattiene l'urato","Il rene non filtra né l'acido urico né i trigliceridi per un danno glomerulare da glicogeno","Il glucagone alto stimola insieme, tramite la PKA, la sintesi di purine e quella di trigliceridi","Il glicogeno accumulato viene trasformato direttamente in grassi e acido urico"],"ans":0,"why":"Anche il lattato compete con l'urato per l'escrezione renale.","note":null,"fixed":false},{"id":"m4g-06","topic":"m4-glicogenosi","level":"a","page":"138","src":"Biochimica II","q":"Nella McArdle, che cosa succede al lattato durante lo sforzo?","opts":["Non aumenta, perché il muscolo non può usare il glicogeno","Aumenta molto, perché il muscolo va subito in anaerobiosi","Diventa glucosio nel muscolo stesso con la gluconeogenesi","Si accumula nel fegato invece che nel sangue periferico","Aumenta solo a riposo e cala durante lo sforzo"],"ans":0,"why":"È alla base del test da sforzo ischemico dell'avambraccio.","note":null,"fixed":false},{"id":"m4g-07","topic":"m4-glicogenosi","level":"l","page":"138","src":"Biochimica II","q":"Che cos'è la mioglobinuria che si vede nella McArdle?","opts":["Presenza di mioglobina nelle urine dopo danno muscolare","Presenza di mioglobina nel sangue dopo lo sforzo","Carenza ereditaria di mioglobina nel muscolo scheletrico","Accumulo di mioglobina nel fegato dopo danno muscolare","Presenza di mioglobina nel sangue, senza passaggio nelle urine"],"ans":0,"why":"Le urine diventano scure dopo sforzi intensi.","note":"Sbobina di Biochimica II, p. 138: la mioglobinuria è definita «presenza di mioglobina nel sangue». È la presenza di mioglobina nelle urine (la mioglobina nel sangue è la mioglobinemia).","fixed":false},{"id":"m4g-08","topic":"m4-glicogenosi","level":"l","page":"136","src":"Biochimica II","q":"Come si chiama la glicogenosi di tipo II e quale enzima manca?","opts":["Malattia di Pompe, α-glucosidasi acida lisosomiale","Malattia di Cori, enzima deramificante","Malattia di Andersen, enzima ramificante epatico","Malattia di Hers, glicogeno fosforilasi epatica","Malattia di Tarui, fosfofruttochinasi muscolare"],"ans":0,"why":"È anche una malattia da accumulo lisosomiale.","note":null,"fixed":false},{"id":"m3m-07","topic":"m3-malattie","level":"f","page":"112","src":"Biochimica II","q":"Come si chiama la condizione in cui tutti i mitocondri di una cellula sono mutati?","opts":["Omoplasmia","Eteroplasmia","Aneuploidia","Mosaicismo nucleare"],"ans":0,"why":"Con una proporzione variabile di mitocondri mutati e sani si parla di eteroplasmia.","note":null,"fixed":false},{"id":"m3m-08","topic":"m3-malattie","level":"f","page":"111","src":"Biochimica II","q":"Perché lo zigote non contiene mitocondri paterni?","opts":["Lo spermatozoo ne ha pochi e vengono degradati subito dopo la fecondazione","Lo spermatozoo non ha mitocondri: l'energia per il flagello viene solo dalla glicolisi","I mitocondri paterni vengono espulsi insieme al secondo corpo polare dopo la fecondazione","Il DNA mitocondriale paterno è identico a quello materno, quindi non si distingue","I mitocondri restano nella coda dello spermatozoo, che non entra mai nell'ovocita"],"ans":0,"why":"Per questo l'eredità del mtDNA è esclusivamente materna.","note":null,"fixed":false},{"id":"m3m-09","topic":"m3-malattie","level":"m","page":"111","src":"Biochimica II","q":"Oltre alle 13 proteine, che cosa codifica il DNA mitocondriale?","opts":["rRNA e tRNA","Le porine","Gli istoni","Il citocromo c","Le DNA polimerasi"],"ans":0,"why":"Le malattie mitocondriali possono dipendere anche da geni nucleari che regolano la funzione dei mitocondri.","note":null,"fixed":false},{"id":"m3m-10","topic":"m3-malattie","level":"m","page":"112","src":"Biochimica II","q":"Nella cellula β, perché serve tanto ATP per secernere insulina?","opts":["L'ATP chiude i canali K⁺, la membrana si depolarizza ed entra Ca²⁺ che fa uscire l'insulina","L'ATP serve a fosforilare la proinsulina, che solo così viene tagliata nei granuli","L'ATP apre i GLUT2, che fanno entrare più glucosio e stimolano così la trascrizione","L'ATP attiva i canali Ca²⁺ del reticolo, che rilasciano l'insulina già legata alle membrane","L'ATP apre i canali K⁺, la membrana si iperpolarizza ed esce Ca²⁺ che spinge fuori l'insulina"],"ans":0,"why":"Glucosio → GLUT2 → glicolisi e Krebs → ATP → chiusura dei canali K⁺ → Ca²⁺ → esocitosi.","note":null,"fixed":false},{"id":"m3m-11","topic":"m3-malattie","level":"a","page":"113","src":"Biochimica II","q":"Secondo la sbobina, come insulino-resistenza e disfunzione β si collegano nel diabete di tipo 2?","opts":["L'insulino-resistenza aumenta i radicali, che inducono UCP2 nelle cellule β: meno ATP e meno secrezione di insulina","L'insulino-resistenza distrugge le cellule β per autoimmunità, con anticorpi contro le isole e calo della secrezione","L'insulino-resistenza riduce i radicali, che inibiscono UCP2 nelle cellule β: più ATP e secrezione eccessiva di insulina","I radicali aumentano la secrezione di insulina, che a lungo andare desensibilizza i recettori del muscolo e del fegato","L'UCP2 indotta nelle cellule β aumenta la sintesi di ATP, che chiude i canali K⁺ in modo permanente e le esaurisce"],"ans":0,"why":"La somma di disfunzione β e insulino-resistenza produce il diabete di tipo 2.","note":null,"fixed":false},{"id":"m3m-12","topic":"m3-malattie","level":"a","page":"114","src":"Biochimica II","q":"Perché nell'anziano si pensa che aumentino i radicali liberi?","opts":["Aumenta l'infiammazione generale (parametri infiammatori più alti), che produce radicali","Diminuisce il numero di mitocondri fino a zero, quindi l'ossigeno non viene più ridotto ad acqua","Si attiva il mtDNA paterno rimasto silente, che codifica complessi respiratori meno efficienti","Cala l'ossigeno nel sangue per la ridotta funzione polmonare, e l'ipossia genera radicali","Diminuisce la produzione di UCP2 e di catalasi, perché il genoma nucleare smette di trascriverle"],"ans":0,"why":"Per questo con l'età si consiglia di aumentare gli antiossidanti.","note":null,"fixed":false},{"id":"m3m-13","topic":"m3-malattie","level":"l","page":"113","src":"Biochimica II","q":"Qual è l'ipotesi alternativa a quella del danno al mtDNA per spiegare l'invecchiamento?","opts":["Un difetto della divisione dei mitocondri","L'accumulo di mitocondri paterni non degradati","La perdita progressiva dell'ATP sintasi di membrana","Un eccesso di UCP1 nel tessuto adiposo bruno","Un difetto della fusione dei perossisomi"],"ans":0,"why":"Tutte le ipotesi concordano sul ruolo centrale del mitocondrio.","note":null,"fixed":false},{"id":"m3m-14","topic":"m3-malattie","level":"l","page":"111","src":"Biochimica II","q":"Quali sintomi possono dare le malattie mitocondriali?","opts":["Disturbi neurologici, disabilità fisiche, problemi di crescita, disturbi metabolici e di fertilità","Solo anemia e disturbi della coagulazione, perché colpiscono soprattutto gli eritrociti","Solo cecità e sordità, perché i mitocondri difettosi sono presenti solo negli organi di senso","Solo infezioni ricorrenti, perché i mitocondri servono soprattutto ai linfociti e ai macrofagi","Nessun sintomo fino all'età adulta, perché il mtDNA mutato si attiva solo dopo la pubertà"],"ans":0,"why":"Possono colpire qualsiasi organo; non c'è una cura, si gestiscono i sintomi.","note":null,"fixed":false},{"id":"m4d-12","topic":"m4-degradazione","level":"f","page":"115","src":"Biochimica II","q":"Che tipo di polisaccaride è il glicogeno?","opts":["Omopolisaccaride ramificato di glucosio","Eteropolisaccaride di glucosio e galattosio","Omopolisaccaride lineare di fruttosio","Eteropolisaccaride ramificato di glucosio","Omopolisaccaride lineare di glucosio"],"ans":0,"why":"Legami α-1,4 nelle catene e α-1,6 nelle ramificazioni; al centro c'è la glicogenina.","note":null,"fixed":false},{"id":"m4d-13","topic":"m4-degradazione","level":"f","page":"116","src":"Biochimica II","q":"Da quale estremità la glicogeno fosforilasi stacca il glucosio?","opts":["Estremità non riducenti","Estremità riducente","Dal centro della molecola","Dalla glicogenina"],"ans":0,"why":"Ogni ramificazione termina con un'estremità non riducente: tanti punti d'attacco.","note":null,"fixed":false},{"id":"m4d-14","topic":"m4-degradazione","level":"m","page":"115","src":"Biochimica II","q":"Quali sono i tre enzimi della degradazione del glicogeno?","opts":["Glicogeno fosforilasi, transferasi, α-1,6-glucosidasi","Glicogeno sintasi, enzima ramificante, glicogenina","α-amilasi, maltasi, lattasi (dell'orletto a spazzola)","Esochinasi, glucochinasi, fosfoglucomutasi","Glicogeno fosforilasi, enzima ramificante, glicogenina"],"ans":0,"why":"Transferasi e α-1,6-glucosidasi sono le due attività dell'enzima deramificante.","note":null,"fixed":false},{"id":"m4d-15","topic":"m4-degradazione","level":"m","page":"117","src":"Biochimica II","q":"Che cosa succede al glucosio 6-P nel muscolo e nel fegato dopo la glicogenolisi?","opts":["Muscolo: solo glicolisi. Fegato: diventa glucosio libero che va nel sangue","In entrambi diventa glucosio libero che va nel sangue tramite i GLUT2","Muscolo: diventa glucosio e va nel sangue. Fegato: viene usato nella glicolisi","In entrambi diventa UDP-glucosio e viene subito riconvertito in glicogeno","Muscolo: entra nella via dei pentoso fosfati. Fegato: va solo in glicolisi"],"ans":0,"why":"Il glicogeno muscolare ha funzione energetica, quello epatico mantiene la glicemia.","note":null,"fixed":false},{"id":"m4d-16","topic":"m4-degradazione","level":"a","page":"117","src":"Biochimica II","q":"Perché le cellule extraepatiche, anche con una glucosio 6-fosfatasi, non riuscirebbero a esportare glucosio?","opts":["L'esochinasi, a Km molto bassa, rifosforilerebbe subito il glucosio libero","Non hanno GLUT nella membrana plasmatica, quindi il glucosio libero non può uscire","Il glucosio libero è tossico per queste cellule e viene subito ossidato a CO₂","La glicogeno fosforilasi non funziona fuori dal fegato e non forma glucosio 1-P","La glucochinasi, a Km alta, rifosforilerebbe subito tutto il glucosio libero"],"ans":0,"why":"Nel fegato la glucochinasi fosforila il glucosio solo quando la sua concentrazione è alta.","note":null,"fixed":false},{"id":"m4d-17","topic":"m4-degradazione","level":"a","page":"117","src":"Biochimica II","q":"Come lavora il sistema della glucosio 6-fosfatasi nel reticolo endoplasmatico?","opts":["T1 porta dentro il G6P, l'enzima lo idrolizza nel lume, T2 fa uscire il fosfato e T3 il glucosio","L'enzima lavora nel citosol senza trasportatori, poi il glucosio passa nel RE con i GLUT4","T1 porta dentro il glucosio, l'enzima lo fosforila nel lume e T2 fa uscire il G6P nel citosol","Il G6P entra nel mitocondrio, dove viene idrolizzato e il glucosio esce con i GLUT2","L'enzima è sulla faccia citosolica del RE e libera il glucosio senza bisogno di trasportatori"],"ans":0,"why":"Il glucosio esce poi dall'epatocita con i GLUT2.","note":null,"fixed":false},{"id":"m4d-18","topic":"m4-degradazione","level":"l","page":"118","src":"Biochimica II","q":"Com'è fatta la glicogeno fosforilasi e come è legato il suo coenzima?","opts":["Omodimero; il piridossal fosfato è legato a un residuo di lisina","Monomero; il piridossal fosfato è legato a una serina fosforilata","Tetramero αβγδ; il piridossal fosfato è libero nel sito attivo","Omodimero; il FAD è legato covalentemente a un residuo di cisteina","Omotetramero; la tiamina pirofosfato è legata a un residuo di istidina"],"ans":0,"why":"Qui il PLP usa il suo gruppo fosfato come catalizzatore acido-base, non il gruppo aldeidico.","note":null,"fixed":false},{"id":"m4d-19","topic":"m4-degradazione","level":"l","page":"117","src":"Biochimica II","q":"Perché la glicogenolisi deve produrre molto glucosio per farlo uscire dal fegato?","opts":["I GLUT2 hanno bassa affinità: funzionano solo con glucosio intracellulare abbondante","I GLUT2 consumano ATP: servono molte molecole di glucosio per giustificare la spesa","Il glucosio esce per esocitosi in vescicole, che si formano solo con glucosio abbondante","Serve a saturare prima l'esochinasi epatica, che altrimenti lo rifosforila subito","I GLUT2 hanno alta affinità e trattengono il glucosio finché non è in forte eccesso"],"ans":0,"why":"È uno dei motivi delle tante ramificazioni.","note":null,"fixed":false},{"id":"m4s-10","topic":"m4-sintesi","level":"f","page":"123","src":"Biochimica II","q":"Quali sono i tre enzimi della sintesi del glicogeno?","opts":["Glicogeno sintasi, enzima ramificante, glicogenina","Glicogeno fosforilasi, transferasi, α-1,6-glucosidasi","Esochinasi, fosfoglucomutasi, glucosio 6-fosfatasi","UDP-glucosio pirofosforilasi, PP1, fosforilasi chinasi","Glicogeno sintasi, enzima deramificante, glucochinasi"],"ans":0,"why":"La glicogeno sintasi è l'enzima principale e quello regolato.","note":null,"fixed":false},{"id":"m4s-11","topic":"m4-sintesi","level":"f","page":"124","src":"Biochimica II","q":"Quale nucleotide fornisce l'energia per aggiungere glucosio al glicogeno?","opts":["UTP","ATP","GTP","CTP"],"ans":0,"why":"UTP + glucosio 1-P → UDP-glucosio + PPi.","note":null,"fixed":false},{"id":"m4s-12","topic":"m4-sintesi","level":"m","page":"124","src":"Biochimica II","q":"Che legame forma la glicogeno sintasi?","opts":["α-1,4","α-1,6","β-1,4","β-1,6"],"ans":0,"why":"I legami α-1,6 delle ramificazioni li forma l'enzima ramificante.","note":null,"fixed":false},{"id":"m4s-13","topic":"m4-sintesi","level":"m","page":"124","src":"Biochimica II","q":"Perché la glicogeno sintasi ha bisogno della glicogenina?","opts":["Non può iniziare una catena da zero: serve un primer, che la glicogenina costruisce su sé stessa","La glicogenina fornisce l'UTP necessario ad attivare il glucosio 1-fosfato in UDP-glucosio nel citosol","La glicogenina forma i legami α-1,6 delle ramificazioni, che la sintasi da sola non è in grado di fare","La glicogenina fosforila la sintasi e la porta nella forma a, più attiva nel citosol","Non sa formare legami α-1,4: è la glicogenina ad allungare tutte le catene esterne"],"ans":0,"why":"La glicogenina aggiunge circa 7 glucosi alla propria tirosina e poi resta al centro, senza attività catalitica.","note":null,"fixed":false},{"id":"m4s-14","topic":"m4-sintesi","level":"a","page":"124","src":"Biochimica II","q":"Perché una struttura ramificata è vantaggiosa per la sintesi e la degradazione?","opts":["Le tante estremità permettono di aggiungere o staccare molti glucosi contemporaneamente","Rende il glicogeno meno solubile in acqua, così precipita in granuli stabili nel citosol","I rami contengono UTP legato, che fornisce subito l'energia per aggiungere nuovi glucosi","Ogni ramo contiene una molecola di glicogenina, che fa da innesco per la sintesi e la degradazione","Le ramificazioni proteggono i legami α-1,4 dalla fosforilasi, rallentando la degradazione"],"ans":0,"why":"Inoltre accumulare glucosio libero creerebbe una pressione osmotica enorme.","note":null,"fixed":false},{"id":"m4s-15","topic":"m4-sintesi","level":"a","page":"123","src":"Biochimica II","q":"In quali situazioni il glicogeno deve essere riformato?","opts":["Dopo l'attività fisica (muscolo) e dopo la notte o tra i pasti (fegato), quando arriva glucosio","Solo durante il digiuno prolungato, quando il fegato produce glucosio con la gluconeogenesi","Solo durante lo sforzo intenso, perché il muscolo ricostruisce il glicogeno mentre lo consuma","Mai nel muscolo, che lo riceve già pronto dal fegato; nel fegato solo di notte, durante il sonno","Solo quando la glicemia scende, perché l'ipoglicemia attiva la glicogeno sintasi tramite glucagone"],"ans":0,"why":"La sintesi è stimolata dall'insulina dopo i pasti.","note":null,"fixed":false},{"id":"m4s-16","topic":"m4-sintesi","level":"l","page":"124","src":"Biochimica II","q":"Dove si era già incontrato l'UDP-glucosio nel corso?","opts":["Nel metabolismo del galattosio","Nella via dei pentoso fosfati","Nel ciclo di Krebs (succinil-CoA)","Nella β-ossidazione mitocondriale","Nel metabolismo del fruttosio"],"ans":0,"why":"Lì serve all'UDP-galattosio 4-epimerasi e alla uridiltransferasi.","note":null,"fixed":false},{"id":"m4r-11","topic":"m4-regolazione","level":"f","page":"119","src":"Biochimica II","q":"Come si chiamano le due forme della glicogeno fosforilasi?","opts":["Fosforilasi a (fosforilata, più attiva) e b (defosforilata, meno attiva)","Fosforilasi a (defosforilata, più attiva) e b (fosforilata, meno attiva)","Fosforilasi R e T, entrambe fosforilate e ugualmente attive nel muscolo","Fosforilasi I (indipendente) e D (dipendente dal glucosio 6-fosfato)","Fosforilasi a (fosforilata, meno attiva) e b (defosforilata, più attiva)"],"ans":0,"why":"Ogni forma esiste negli stati R (attivo) e T (meno attivo).","note":null,"fixed":false},{"id":"m4r-12","topic":"m4-regolazione","level":"f","page":"125","src":"Biochimica II","q":"Che effetto ha il glucosio 6-fosfato sulla glicogeno sintasi?","opts":["La attiva (effettore allosterico positivo)","La inibisce (effettore allosterico negativo)","La fosforila (tramite la GSK3 attivata)","Nessuno: agisce solo sulla fosforilasi","La inattiva legandosi al sito catalitico"],"ans":0,"why":"Sposta la sintasi b dallo stato T allo stato R.","note":null,"fixed":false},{"id":"m4r-13","topic":"m4-regolazione","level":"m","page":"120","src":"Biochimica II","q":"Quali molecole inibiscono la fosforilasi b muscolare riportandola nello stato T?","opts":["ATP e glucosio 6-P","AMP e Ca²⁺","cAMP e glucagone","Glucosio 1-P e UTP"],"ans":0,"why":"Con tanto ATP la glicolisi è inutile; con tanto G6P è inutile degradare il glicogeno.","note":null,"fixed":false},{"id":"m4r-14","topic":"m4-regolazione","level":"m","page":"125","src":"Biochimica II","q":"Quale forma della glicogeno sintasi è attiva?","opts":["Forma a, defosforilata","Forma b, fosforilata","Forma a, fosforilata","Entrambe allo stesso modo"],"ans":0,"why":"È l'opposto della fosforilasi: la stessa fosforilazione spegne la sintesi e accende la degradazione.","note":null,"fixed":false},{"id":"m4r-15","topic":"m4-regolazione","level":"a","page":"126","src":"Biochimica II","q":"Da che cosa è attivata e da che cosa è inibita la PP1?","opts":["Attivata da insulina, glucosio 6-P e glucosio; inibita da glucagone e adrenalina","Attivata da glucagone e adrenalina; inibita da insulina, glucosio 6-P e glucosio","Attivata da AMP e Ca²⁺; inibita da ATP e glucosio 6-P, come la fosforilasi","Attivata da Ca²⁺ e cAMP; inibita da glucosio e insulina nel fegato e nel muscolo","Attivata da insulina e adrenalina; inibita da glucagone e glucosio 6-fosfato"],"ans":0,"why":"La PP1 defosforila fosforilasi a, fosforilasi chinasi e glicogeno sintasi.","note":null,"fixed":false},{"id":"m4r-16","topic":"m4-regolazione","level":"a","page":"127","src":"Biochimica II","q":"Che differenza c'è tra glicogeno sintasi e fosforilasi nei siti di fosforilazione?","opts":["La sintasi ha siti multipli (più serine fosforilate), la fosforilasi uno solo","La fosforilasi ha siti multipli (più serine fosforilate), la sintasi uno solo","Nessuna delle due viene fosforilata: sono regolate solo allostericamente","Hanno gli stessi siti, fosforilati sempre insieme dalla stessa chinasi","La sintasi è fosforilata su tirosine, la fosforilasi solo su treonine"],"ans":0,"why":"La GSK3 fosforila in sequenza più serine dopo l'innesco della caseina chinasi 2.","note":null,"fixed":false},{"id":"m4r-17","topic":"m4-regolazione","level":"a","page":"130","src":"Biochimica II","q":"Nel fegato, perché la fosforilasi a nello stato R blocca la sintesi del glicogeno?","opts":["Lega e inibisce la PP1 sulla GL: finché è in R la PP1 non può attivare la sintasi","Consuma tutto l'UDP-glucosio del citosol, che non resta disponibile per la sintasi","Fosforila direttamente la sintasi e la porta nella forma b, meno attiva","Degrada la glicogenina al centro del granulo, eliminando il primer per la sintesi","Lega e attiva la PKA sulla GL: finché è in R la sintasi resta fosforilata dalla PKA"],"ans":0,"why":"Il glucosio la porta in T, la PP1 si libera e defosforila prima la fosforilasi e poi la sintasi.","note":null,"fixed":false},{"id":"m4r-18","topic":"m4-regolazione","level":"l","page":"129","src":"Biochimica II","q":"Quali siti di GM vengono fosforilati e con quale effetto?","opts":["P1 (chinasi insulino-sensibile): attiva la PP1. P2 (adrenalina/PKA): la PP1 si stacca","P1 e P2 dalla GSK3: inattivano la sintasi e staccano la PP1 dal glicogeno","Solo P1, dall'adrenalina tramite PKA: la PP1 si lega più saldamente al glicogeno","P2 dall'insulina: attiva la fosforilasi. P1 (PKA): la PP1 viene degradata","P1 (adrenalina/PKA): attiva la PP1. P2 (chinasi insulino-sensibile): la PP1 si stacca"],"ans":0,"why":"L'adrenalina fosforila anche un inibitore che si lega alla PP1 e la blocca del tutto.","note":null,"fixed":false},{"id":"m4r-19","topic":"m4-regolazione","level":"l","page":"119","src":"Biochimica II","q":"Fosforilasi muscolare ed epatica sono:","opts":["Isoenzimi: stessa reazione, geni diversi, diversa localizzazione e regolazione","Lo stesso enzima, codificato da un solo gene, con la stessa localizzazione e la stessa regolazione","Enzimi con reazioni diverse: fosforolisi nel muscolo, idrolisi nel fegato","Le forme a e b dello stesso gene, prodotte per splicing alternativo nei due tessuti","Isoenzimi: stesso gene, ma regolati entrambi allo stesso modo dall'AMP"],"ans":0,"why":"L'AMP attiva solo la muscolare, il glucosio inibisce solo l'epatica.","note":null,"fixed":false},{"id":"m4o-07","topic":"m4-ormoni","level":"f","page":"120","src":"Biochimica II","q":"Quanti amminoacidi ha il glucagone e chi lo produce?","opts":["29, cellule α del pancreas","51, cellule β del pancreas","14, cellule δ del pancreas","9, ipofisi posteriore","29, cellule β del pancreas"],"ans":0,"why":"È prodotto in ipoglicemia, lontano dai pasti.","note":null,"fixed":false},{"id":"m4o-08","topic":"m4-ormoni","level":"f","page":"121","src":"Biochimica II","q":"Chi produce l'adrenalina?","opts":["La midollare del surrene","La corticale del surrene","Il pancreas endocrino","L'ipofisi anteriore","La tiroide (cellule C)"],"ans":0,"why":"È l'ormone dell'attacco e della fuga; è un ormone di natura amminoacidica.","note":null,"fixed":false},{"id":"m4o-09","topic":"m4-ormoni","level":"m","page":"120","src":"Biochimica II","q":"Che tipo di recettore ha il glucagone?","opts":["Recettore a 7 eliche transmembrana accoppiato a proteine G","Recettore tirosin-chinasico dimerico che si autofosforila","Recettore intracellulare che agisce come fattore di trascrizione","Canale ionico regolato dal ligando sulla membrana plasmatica","Recettore a 7 eliche transmembrana con attività guanilato ciclasi"],"ans":0,"why":"Gα-GTP attiva l'adenilato ciclasi → cAMP → PKA.","note":null,"fixed":false},{"id":"m4o-10","topic":"m4-ormoni","level":"m","page":"121","src":"Biochimica II","q":"Di quali subunità è formata la fosforilasi chinasi?","opts":["(αβγδ)₄","α₂β₂","Un solo monomero","(αβγ)₂"],"ans":0,"why":"La δ è simile alla calmodulina e lega il Ca²⁺ con mani EF.","note":null,"fixed":false},{"id":"m4o-11","topic":"m4-ormoni","level":"a","page":"121","src":"Biochimica II","q":"Che cosa serve per la completa attivazione della fosforilasi chinasi muscolare?","opts":["Sia la fosforilazione da PKA sia il Ca²⁺: ciascuno da solo la attiva solo parzialmente","Solo il cAMP, che si lega direttamente alla subunità catalitica e la attiva del tutto","Solo l'AMP, che segnala la contrazione e la attiva allostericamente in modo completo","Solo il Ca²⁺ della contrazione, mentre la fosforilazione da PKA la inibisce parzialmente","Solo l'insulina, che la fa defosforilare dalla PP1 e la porta nella forma più attiva"],"ans":0,"why":"Il Ca²⁺ rilasciato con la contrazione basta per gli sforzi leggeri, senza adrenalina.","note":null,"fixed":false},{"id":"m4o-12","topic":"m4-ormoni","level":"a","page":"121–122","src":"Biochimica II","q":"Oltre al metabolismo, che cosa fa l'adrenalina per preparare all'azione?","opts":["Vasocostrizione cutanea e splancnica, che ridistribuisce il sangue verso i muscoli","Vasodilatazione cutanea e splancnica, che disperde il calore prodotto dai muscoli","Abbassa la glicemia, perché fa entrare tutto il glucosio nel muscolo tramite GLUT4","Blocca la glicolisi muscolare, perché il muscolo deve usare solo acidi grassi","Bradicardia e broncocostrizione, che riducono il consumo di ossigeno in attesa dello sforzo"],"ans":0,"why":"Aumenta energia, ossigeno e zucchero disponibili; nel fegato attiva la glicogenolisi.","note":null,"fixed":false},{"id":"m4o-13","topic":"m4-ormoni","level":"a","page":"132","src":"Biochimica II","q":"Come l'insulina riduce la degradazione del glicogeno?","opts":["Attiva la PP1, che defosforila e spegne fosforilasi chinasi e glicogeno fosforilasi","Attiva la PKA, che fosforila e spegne fosforilasi chinasi e glicogeno fosforilasi","Aumenta il cAMP, che lega la fosforilasi e la blocca nello stato T meno attivo","Fosforila la fosforilasi tramite la PKB, portandola nella forma b inattiva","Attiva la GSK3, che fosforila e spegne direttamente la glicogeno fosforilasi"],"ans":0,"why":"In parallelo la PKB inibisce la GSK3 e la sintasi resta attiva.","note":"Sbobina di Biochimica II, p. 132: la «proteina chinasi insulino sensibile» che attiva la PP1 è chiamata PI3K. La PI3K è una chinasi lipidica (produce PIP₃) a monte della PKB; la chinasi che fosforila GM nel sito 1 è un'altra proteina. Non è nelle sbobine, ma è la versione del Lehninger.","fixed":false},{"id":"m4o-14","topic":"m4-ormoni","level":"l","page":"123","src":"Biochimica II","q":"Che cosa illustra lo schema della cascata glucagone → glucosio nel sangue?","opts":["L'amplificazione: poche molecole di ormone producono 10.000 e più molecole di glucosio","Un ciclo futile: il glucosio prodotto dal glicogeno viene subito riconvertito in glicogeno","Un feedback negativo: il glucosio prodotto spegne la secrezione di glucagone dal pancreas","Una via senza enzimi: il glucagone stacca direttamente il glucosio dal glicogeno epatico","Una conversione 1:1: ogni molecola di ormone libera una molecola di glucosio nel sangue"],"ans":0,"why":"Ogni enzima attivato ne attiva molti al passaggio successivo.","note":null,"fixed":false},{"id":"m4o-15","topic":"m4-ormoni","level":"l","page":"132","src":"Biochimica II","q":"Quando c'è glucagone, oltre a degradare il glicogeno, che cosa fa il fegato con la glicolisi?","opts":["La diminuisce: il glucosio formato deve uscire e non essere usato dall'epatocita","La aumenta: il glucosio formato serve a produrre l'ATP per la glicogenolisi","Non cambia: glicolisi e glicogenolisi sono regolate in modo indipendente","La trasferisce nel mitocondrio, dove il glucosio viene ossidato più in fretta","La aumenta solo nel fegato, mentre la riduce nel muscolo per risparmiare glucosio"],"ans":0,"why":"Il fegato in ipoglicemia lavora per il resto dell'organismo.","note":null,"fixed":false},{"id":"m5f-01","topic":"m5-fonti","level":"f","page":"140","src":"Biochimica II","q":"Quali sono i precursori non glucidici della gluconeogenesi?","opts":["Lattato, amminoacidi (alanina), glicerolo","Acidi grassi a catena pari, acetil-CoA","Acetil-CoA e corpi chetonici","Colesterolo, glicerolo, urea","Lattato, acidi grassi a catena pari, acetone"],"ans":0,"why":"Dagli acidi grassi a catena pari non si forma glucosio; il propionil-CoA dei grassi dispari sì.","note":null,"fixed":false},{"id":"m5f-02","topic":"m5-fonti","level":"f","page":"140","src":"Biochimica II","q":"Dove avviene la gluconeogenesi?","opts":["Soprattutto nel fegato (circa 90%) e nel rene","Soprattutto nel muscolo scheletrico e nel cuore","Soprattutto nel cervello e nel midollo spinale","Negli eritrociti e nel tessuto adiposo","Soprattutto nell'intestino (circa 90%) e nel fegato"],"ans":0,"why":"Il rene contribuisce soprattutto di notte e nel digiuno prolungato.","note":null,"fixed":false},{"id":"m5f-03","topic":"m5-fonti","level":"m","page":"141","src":"Biochimica II","q":"Quali sono le tre fonti di glucosio ematico durante la giornata?","opts":["Dieta, glicogenolisi, gluconeogenesi","Dieta, β-ossidazione, chetogenesi","Glicolisi, glicogenolisi, lipolisi","Solo dieta e glicogeno epatico","Dieta, gluconeogenesi, via dei pentosi"],"ans":0,"why":"Dopo i pasti prevale la dieta, tra un pasto e l'altro la glicogenolisi, di notte cresce la gluconeogenesi.","note":null,"fixed":false},{"id":"m5f-04","topic":"m5-fonti","level":"m","page":"142","src":"Biochimica II","q":"Quale ormone, con ritmo circadiano, sostiene la gluconeogenesi notturna?","opts":["Cortisolo","Insulina","Melatonina","Ossitocina","Glucagone"],"ans":0,"why":"Il cortisolo ha il minimo verso mezzanotte e il picco al mattino.","note":null,"fixed":false},{"id":"m5f-05","topic":"m5-fonti","level":"a","page":"149","src":"Biochimica II","q":"Su quali tessuti agisce il cortisolo per favorire la gluconeogenesi?","opts":["Fegato (enzimi), muscolo (libera alanina), tessuto adiposo (rende disponibile il glicerolo)","Solo fegato, dove aumenta la sintesi di PEPCK e di glucosio 6-fosfatasi agendo sui geni nel nucleo","Pancreas (inibisce l'insulina) e cervello (riduce il consumo di glucosio da parte dei neuroni)","Rene (aumenta il riassorbimento di glucosio) e intestino (aumenta l'assorbimento)","Muscolo (stimola la glicogenolisi) e fegato (inibisce la glicolisi tramite la PFK2)"],"ans":0,"why":"Per questo una terapia cortisonica può peggiorare la glicemia dei diabetici e far perdere massa muscolare.","note":null,"fixed":false},{"id":"m5f-06","topic":"m5-fonti","level":"a","page":"157","src":"Biochimica II","q":"Nel digiuno prolungato la gluconeogenesi a un certo punto si riduce. Perché?","opts":["Per risparmiare le proteine muscolari: il cervello usa sempre più corpi chetonici","Perché finisce il glicogeno epatico, che è il precursore della gluconeogenesi","Perché il cortisolo scende quasi a zero dopo i primi giorni di digiuno prolungato","Perché il lattato prodotto dal muscolo si esaurisce e manca il substrato principale","Perché il fegato perde la glucosio 6-fosfatasi dopo alcuni giorni di digiuno"],"ans":0,"why":"Dopo il picco (circa 24–48 ore) la chetogenesi copre il fabbisogno e protegge la massa muscolare.","note":null,"fixed":false},{"id":"m5f-07","topic":"m5-fonti","level":"l","page":"140","src":"Biochimica II","q":"Quale enzima, senza cui il fegato non libera glucosio, è legato al reticolo endoplasmatico?","opts":["Glucosio 6-fosfatasi","Glucochinasi","Fruttosio 1,6-bisfosfatasi","Fosfoglucomutasi","Glicerolo chinasi"],"ans":0,"why":"Il G6P entra nel RE (trasportatore T1), viene idrolizzato e il glucosio esce (T3).","note":null,"fixed":false},{"id":"m5r-01","topic":"m5-reazioni","level":"f","page":"143","src":"Biochimica II","q":"Quali tappe della glicolisi la gluconeogenesi deve aggirare?","opts":["Esochinasi, PFK1, piruvato chinasi","Aldolasi, enolasi, fosfoglicerato chinasi","GAPDH, trioso fosfato isomerasi, fosfoglicerato mutasi","Solo la piruvato chinasi","Esochinasi, aldolasi, enolasi"],"ans":0,"why":"Sono le tre reazioni con ΔG molto negativo; le altre sono reversibili e usate al contrario.","note":null,"fixed":false},{"id":"m5r-02","topic":"m5-reazioni","level":"f","page":"144","src":"Biochimica II","q":"Quale coenzima usa la piruvato carbossilasi?","opts":["Biotina","Tiamina pirofosfato","Piridossal fosfato","Lipoato","Acido folico"],"ans":0,"why":"La biotina trasporta il carbossile dal bicarbonato al piruvato.","note":null,"fixed":false},{"id":"m5r-03","topic":"m5-reazioni","level":"m","page":"145","src":"Biochimica II","q":"Perché l'ossalacetato esce dal mitocondrio come malato?","opts":["Non ha un trasportatore nella membrana mitocondriale interna","Il malato è più energetico dell'ossalacetato e conserva il potere riducente","Per consumare NADH nel citosol, dove serve a ridurre il piruvato a lattato","L'ossalacetato è instabile e si decarbossila spontaneamente nella matrice","Il malato serve per produrre ATP nel citosol tramite l'enzima malico"],"ans":0,"why":"La malato deidrogenasi mitocondriale lo riduce, quella citosolica lo riossida: così esce anche il NADH che serve alla GAPDH.","note":null,"fixed":false},{"id":"m5r-04","topic":"m5-reazioni","level":"m","page":"147","src":"Biochimica II","q":"Bilancio energetico della gluconeogenesi da 2 piruvato:","opts":["4 ATP + 2 GTP + 2 NADH","2 ATP + 2 NADH","6 ATP e nessun NADH","2 ATP + 2 GTP","4 ATP + 2 GTP + 2 FADH₂"],"ans":0,"why":"6 legami ad alta energia per un glucosio; il ΔG°' complessivo è circa −38 kJ/mol, mentre la glicolisi inversa sarebbe +84.","note":null,"fixed":false},{"id":"m5r-05","topic":"m5-reazioni","level":"m","page":"145","src":"Biochimica II","q":"Che cosa spinge la reazione della PEPCK verso la formazione del fosfoenolpiruvato?","opts":["La decarbossilazione: esce la CO₂ aggiunta dalla piruvato carbossilasi","L'idrolisi di due molecole di ATP nello stesso sito attivo dell'enzima","L'ossidazione del NADH citosolico accoppiata direttamente alla reazione","Il trasporto del PEP dentro il mitocondrio appena si forma","La riduzione del GTP a GDP, con liberazione di energia libera nel sito attivo"],"ans":0,"why":"Formare il PEP costa in tutto due nucleotidi (ATP nella carbossilazione, GTP nella PEPCK).","note":null,"fixed":false},{"id":"m5r-06","topic":"m5-reazioni","level":"a","page":"150","src":"Biochimica II","q":"Se la gluconeogenesi parte dal lattato invece che dall'alanina, come cambia la via?","opts":["Il NADH citosolico viene dalla LDH, quindi l'OAA diventa PEP già nel mitocondrio","Il lattato entra direttamente come PEP, senza passare dal piruvato né dall'ossalacetato","Serve più biotina, perché il lattato va carbossilato due volte prima di diventare PEP","Non cambia nulla: lattato e alanina seguono esattamente la stessa via","Il lattato salta la piruvato carbossilasi ed entra nel mitocondrio direttamente come malato"],"ans":0,"why":"Dall'alanina il NADH citosolico si ottiene facendo uscire il malato; dal lattato lo fornisce già la LDH.","note":null,"fixed":false},{"id":"m5r-07","topic":"m5-reazioni","level":"a","page":"146","src":"Biochimica II","q":"Un paziente con deficit di glucosio 6-fosfatasi (glicogenosi di tipo I) ha ipoglicemia grave. Perché?","opts":["Né la glicogenolisi né la gluconeogenesi epatiche possono liberare glucosio nel sangue","Non può fare glicolisi, quindi il fegato consuma tutto il glucosio presente nel sangue","Non produce insulina, quindi il glucosio non entra nel fegato e viene perso con le urine","Non assorbe glucosio dall'intestino per un difetto associato dei trasportatori SGLT1","Il fegato trasforma tutto il glucosio 6-fosfato in acido urico e lattato da eliminare"],"ans":0,"why":"Entrambe le vie finiscono nel G6P, che senza la fosfatasi non diventa glucosio libero.","note":"Sbobina di Biochimica II, p. 146: c'è scritto «malattia di tipo 1 di diabete mellito». Dal contesto (nessuna via di ripristino della glicemia funziona) si tratta della glicogenosi di tipo I (malattia di von Gierke).","fixed":false},{"id":"m5r-08","topic":"m5-reazioni","level":"a","page":"152","src":"Biochimica II","q":"Durante la gluconeogenesi epatica, perché la piruvato chinasi va bloccata?","opts":["Per non riconvertire il PEP in piruvato, in un ciclo futile che sprecherebbe ATP e GTP","Perché consuma il NADH che serve alla gliceraldeide 3-fosfato deidrogenasi citosolica","Perché produce lattato in eccesso, che acidificherebbe l'epatocita durante il digiuno","Perché inibisce la PEPCK quando le due sono attive insieme nel citosol dell'epatocita","Perché consuma il GTP prodotto dal ciclo di Krebs, che serve alla PEPCK mitocondriale"],"ans":0,"why":"Il glucagone la fa fosforilare dalla PKA, ed è l'isoforma epatica (L) a essere regolata così.","note":null,"fixed":false},{"id":"m5r-09","topic":"m5-reazioni","level":"l","page":"145","src":"Biochimica II","q":"Quale nucleotide usa la PEPCK citosolica?","opts":["GTP","ATP","UTP","CTP","NAD⁺"],"ans":0,"why":"OAA + GTP → PEP + GDP + CO₂.","note":"Sbobina di Biochimica II, p. 145: c'è scritto che si formano PEP, «ADP» e CO₂. Si forma GDP.","fixed":false},{"id":"m5r-10","topic":"m5-reazioni","level":"l","page":"144","src":"Biochimica II","q":"Quale molecola attiva allostericamente la piruvato carbossilasi?","opts":["Acetil-CoA","ADP","Fruttosio 2,6-bisfosfato","Citrato","Malonil-CoA"],"ans":0,"why":"Di notte la β-ossidazione epatica produce acetil-CoA, che indirizza il piruvato verso l'ossalacetato.","note":"Sbobina di Biochimica II, p. 144: c'è scritto che l'acetil-CoA attiva la «piruvato decarbossilazione». Attiva la piruvato carbossilasi.","fixed":false},{"id":"m5r-11","topic":"m5-reazioni","level":"l","page":"146","src":"Biochimica II","q":"Nella gluconeogenesi, quale enzima converte il fruttosio 1,6-bisfosfato in fruttosio 6-fosfato?","opts":["Fruttosio 1,6-bisfosfatasi","Fosfofruttochinasi 1 (PFK1)","Fruttosio 2,6-bisfosfatasi","Aldolasi A (fruttosio bisfosfato)","Fosfoglucosio isomerasi"],"ans":0,"why":"Idrolizza il fosfato in C1. Non va confusa con la fruttosio 2,6-bisfosfatasi (dominio della PFK2).","note":null,"fixed":false},{"id":"m5g-01","topic":"m5-glicerolo","level":"f","page":"147","src":"Biochimica II","q":"Da dove viene il glicerolo usato nella gluconeogenesi?","opts":["Dalla lipolisi dei trigliceridi del tessuto adiposo","Dalla glicolisi muscolare, come diidrossiacetone fosfato","Dagli amminoacidi glucogenici del muscolo","Dai corpi chetonici prodotti nel fegato","Dalla digestione dei fosfolipidi di membrana dei globuli rossi"],"ans":0,"why":"Arriva al fegato col sangue.","note":null,"fixed":false},{"id":"m5g-02","topic":"m5-glicerolo","level":"m","page":"147","src":"Biochimica II","q":"Perché la via del glicerolo è «più semplice» della gluconeogenesi dal piruvato?","opts":["Entra come diidrossiacetone fosfato, saltando il bypass piruvato → PEP","Non consuma ATP in nessuna delle sue tappe e non richiede NAD⁺","Non avviene nel fegato, ma nel tessuto adiposo stesso, che ha la glicerolo chinasi","Non serve NAD⁺ per ossidare il glicerolo 3-fosfato a triosio fosfato","Entra come piruvato, saltando la fruttosio 1,6-bisfosfatasi e la G6Pasi"],"ans":0,"why":"Glicerolo → glicerolo 3-P → DHAP, poi la via prosegue verso il fruttosio 1,6-bisfosfato.","note":null,"fixed":false},{"id":"m5g-03","topic":"m5-glicerolo","level":"a","page":"149","src":"Biochimica II","q":"Perché il tessuto adiposo non può usare da sé il glicerolo dei trigliceridi?","opts":["Non ha la glicerolo chinasi: il glicerolo deve andare al fegato","Lo consuma tutto nella β-ossidazione insieme agli acidi grassi","Il glicerolo è tossico per l'adipocita e viene espulso","Gli manca la glicerolo 3-fosfato deidrogenasi, non la chinasi","Lo trasforma tutto in lattato prima di rilasciarlo nel sangue"],"ans":0,"why":"Per questo il glicerolo liberato dalla lipolisi è un substrato gluconeogenico epatico.","note":"L'assenza della glicerolo chinasi nell'adipocita non è nella sbobina (Lehninger).","fixed":false},{"id":"m5g-04","topic":"m5-glicerolo","level":"l","page":"141, 147","src":"Biochimica II","q":"Il glicerolo 3-fosfato della sbobina è chiamato anche glicerolo 1-fosfato. Perché?","opts":["Per la numerazione: è lo stesso composto (sn-glicerolo 3-fosfato = L-glicerolo 3-fosfato)","Perché sono due isomeri diversi, uno prodotto nel fegato e l'altro nel muscolo scheletrico","Perché il glicerolo 1-fosfato si forma dalla lipolisi e il 3-fosfato dalla glicolisi","È un errore della sbobina: il glicerolo 1-fosfato non esiste nelle cellule umane","Perché uno ha il fosfato sul carbonio centrale (C2) e l'altro su quello terminale"],"ans":0,"why":"La numerazione stereospecifica (sn) dà sn-glicerolo 3-fosfato.","note":null,"fixed":false},{"id":"m5reg-01","topic":"m5-regolazione","level":"f","page":"150","src":"Biochimica II","q":"Come viene regolata soprattutto la PEPCK?","opts":["Variando la quantità di enzima (sintesi)","Per fosforilazione da parte della PKA epatica","Allostericamente dall'AMP e dall'ADP","Per sequestro nel nucleo, come la glucochinasi","Allostericamente dall'acetil-CoA"],"ans":0,"why":"È un meccanismo lento: elementi di risposta nel promotore controllano la trascrizione.","note":null,"fixed":false},{"id":"m5reg-02","topic":"m5-regolazione","level":"f","page":"153","src":"Biochimica II","q":"Il fruttosio 2,6-bisfosfato:","opts":["Attiva la PFK1 e inibisce la fruttosio 1,6-bisfosfatasi","Inibisce la PFK1 e attiva la fruttosio 1,6-bisfosfatasi","Attiva sia la PFK1 sia la fruttosio 1,6-bisfosfatasi","È un intermedio della glicolisi tra F6P e FBP","Inibisce sia la PFK1 sia la fruttosio 1,6-bisfosfatasi"],"ans":0,"why":"Quando c'è si fa glicolisi, quando manca si fa gluconeogenesi.","note":null,"fixed":false},{"id":"m5reg-03","topic":"m5-regolazione","level":"m","page":"151","src":"Biochimica II","q":"Quali elementi del promotore della PEPCK ne stimolano la sintesi?","opts":["GRE (glucocorticoidi), TRE (ormoni tiroidei), CRE (cAMP/glucagone)","IRE (insulina), SRE (steroli), HRE (ipossia, tramite HIF-1α)","SRE (steroli), CRE (cAMP/glucagone), ERE (estrogeni e progestinici)","HRE (ipossia), IRE (insulina), TRE (ormoni tiroidei)","ARE (androgeni), GRE (glucocorticoidi), IRE (insulina e IGF-1)"],"ans":0,"why":"L'insulina invece riduce la sintesi.","note":null,"fixed":false},{"id":"m5reg-04","topic":"m5-regolazione","level":"m","page":"153","src":"Biochimica II","q":"Come agisce il glucagone sulla PFK2 epatica?","opts":["La fa fosforilare: prevale l'attività fosfatasica, scende il F2,6BP e parte la gluconeogenesi","La fa defosforilare: prevale l'attività chinasica, sale il F2,6BP e parte la glicolisi","La fa degradare dal proteasoma, così il F2,6BP non viene più prodotto","La sposta nel nucleo insieme alla glucochinasi, dove resta inattiva","La fa fosforilare: prevale l'attività chinasica, sale il F2,6BP e si blocca la gluconeogenesi"],"ans":0,"why":"L'insulina fa l'opposto: defosforila, prevale la chinasi, sale il F2,6BP.","note":"Sbobina di Biochimica II, p. 154: c'è scritto che con l'insulina «si attiva il dominio fosfatasico (N terminale)» e con il glucagone «il dominio chinasico (C terminale)». È il contrario, come dice la stessa sbobina a p. 153: l'insulina attiva la chinasi (N-terminale), il glucagone la fosfatasi (C-terminale).","fixed":false},{"id":"m5reg-05","topic":"m5-regolazione","level":"a","page":"152","src":"Biochimica II","q":"Come fa l'insulina a ridurre la sintesi della PEPCK?","opts":["Attiva la PKB, che fosforila FOXO1: il fattore viene degradato e non attiva più il gene","Il recettore dell'insulina entra nel nucleo e lega direttamente il promotore della PEPCK","Attiva la PKA, che fosforila la PEPCK e ne blocca il sito attivo legando il GTP","Aumenta il cAMP, che lega il CRE e reprime la trascrizione del gene","Attiva la PP1, che defosforila la PEPCK e la rende inattiva senza ridurne la quantità"],"ans":0,"why":"È il meccanismo con cui l'IRE risponde all'insulina.","note":"Sbobina di Biochimica II, p. 152: il fattore è chiamato «FOX1». Il nome corretto è FOXO1.","fixed":false},{"id":"m5reg-06","topic":"m5-regolazione","level":"a","page":"156–157","src":"Biochimica II","q":"Il glucagone nel fegato aumenta la glicemia agendo su più enzimi. Quale effetto è sbagliato?","opts":["Attiva la glicogeno sintasi","Attiva la glicogeno fosforilasi","Abbassa il fruttosio 2,6-bisfosfato","Inattiva la piruvato chinasi","Aumenta la sintesi della PEPCK"],"ans":0,"why":"La PKA inattiva la glicogeno sintasi: tutto converge sul liberare glucosio.","note":null,"fixed":false},{"id":"m5reg-07","topic":"m5-regolazione","level":"a","page":"155","src":"Biochimica II","q":"La fruttosio 1,6-bisfosfatasi è inibita da F2,6BP e da AMP. Che senso ha l'AMP?","opts":["AMP alto segnala fame energetica: la cellula non deve spendere ATP per fare glucosio","L'AMP è un prodotto della gluconeogenesi e ne frena la velocità per feedback negativo","L'AMP attiva la PEPCK, quindi serve a coordinare i due enzimi della gluconeogenesi","Non ha un senso fisiologico: è un effetto osservato solo in vitro con enzima purificato","AMP alto segnala abbondanza di energia: la cellula può permettersi di fare glucosio"],"ans":0,"why":"Lo stesso AMP attiva la PFK1: le due vie sono regolate in modo reciproco.","note":"Sbobina di Biochimica II, p. 155: si parla del «fruttosio 1,6 bisfosfato inibito da F2,6BP e AMP». Si intende la fruttosio 1,6-bisfosfatasi.","fixed":false},{"id":"m5reg-08","topic":"m5-regolazione","level":"l","page":"154","src":"Biochimica II","q":"Perché la PFK2 si definisce un enzima «tandem» (bifunzionale)?","opts":["Ha due attività opposte (chinasi e fosfatasi) su un'unica catena, in due domini","È formato da due subunità diverse, una regolatrice e una catalitica, sempre unite","Lavora in coppia con la PFK1, a cui passa direttamente il prodotto per canalizzazione","Usa due molecole di ATP per ogni molecola di fruttosio 2,6-bisfosfato prodotta","Ha due siti attivi che fanno entrambi la stessa reazione di chinasi"],"ans":0,"why":"PFK-2/FBPase-2: la fosforilazione decide quale dominio lavora.","note":null,"fixed":false},{"id":"m5reg-09","topic":"m5-regolazione","level":"l","page":"151","src":"Biochimica II","q":"Come si chiama il fattore di trascrizione inibito dall'insulina che stimola la PEPCK?","opts":["FOXO1","CREB","SREBP","HIF-1α","NF-κB"],"ans":0,"why":"PKB/Akt lo fosforila e ne causa l'esclusione dal nucleo e la degradazione.","note":null,"fixed":false},{"id":"m5reg-10","topic":"m5-regolazione","level":"l","page":"155","src":"Biochimica II","q":"Quale effetto ha l'ADP sulla PEPCK?","opts":["La inibisce","La attiva","Nessun effetto","La sposta nel mitocondrio","La attiva solo nel rene"],"ans":0,"why":"Con poca energia non conviene spendere GTP per fare PEP.","note":"Sbobina di Biochimica II, p. 155: c'è scritto che la PEPCK è favorita dall'ADP, con un dubbio aggiunto da chi ha sbobinato. Nei testi di riferimento l'ADP inibisce la PEPCK. Se a lezione è stato detto diversamente, fallo presente segnalandolo.","fixed":false},{"id":"m5a-01","topic":"m5-approfondimenti","level":"f","page":"158","src":"Biochimica II","q":"Perché bere alcol a digiuno può causare ipoglicemia?","opts":["L'ossidazione dell'etanolo aumenta il NADH e blocca lattato → piruvato e malato → ossalacetato","L'etanolo stimola fortemente la secrezione di insulina dalle cellule β e il glucosio entra nei tessuti","L'etanolo viene ossidato consumando glucosio come fonte di elettroni per l'alcol deidrogenasi","L'etanolo blocca l'assorbimento intestinale del glucosio inibendo gli SGLT1 degli enterociti","L'etanolo diventa acetaldeide, che inibisce direttamente la glucosio 6-fosfatasi"],"ans":0,"why":"Senza NAD⁺ i precursori non entrano nella gluconeogenesi.","note":"Sbobina di Biochimica II, p. 158: c'è scritto che l'acetaldeide viene «ulteri
