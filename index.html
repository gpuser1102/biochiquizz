tasi","Glucochinasi","Fruttosio 1,6-bisfosfatasi","Fosfoglucomutasi"],"ans":0,"why":"Il G6P entra nel RE (trasportatore T1), viene idrolizzato e il glucosio esce (T3).","note":null,"fixed":false},{"id":"m5r-01","topic":"m5-reazioni","level":"f","page":"143","src":"Biochimica II","q":"Quali tappe della glicolisi la gluconeogenesi deve aggirare?","opts":["Esochinasi, PFK1, piruvato chinasi","Aldolasi, enolasi, PGK","GAPDH, TPI, PGM","Solo la piruvato chinasi"],"ans":0,"why":"Sono le tre reazioni con ΔG molto negativo; le altre sono reversibili e usate al contrario.","note":null,"fixed":false},{"id":"m5r-02","topic":"m5-reazioni","level":"f","page":"144","src":"Biochimica II","q":"Quale coenzima usa la piruvato carbossilasi?","opts":["Biotina","Tiamina pirofosfato","Piridossal fosfato","Lipoato"],"ans":0,"why":"La biotina trasporta il carbossile dal bicarbonato al piruvato.","note":null,"fixed":false},{"id":"m5r-03","topic":"m5-reazioni","level":"m","page":"145","src":"Biochimica II","q":"Perché l'ossalacetato esce dal mitocondrio come malato?","opts":["Perché non ha un trasportatore nella membrana mitocondriale interna","Perché il malato è più energetico","Per consumare NADH nel citosol","Perché l'ossalacetato è instabile"],"ans":0,"why":"La malato deidrogenasi mitocondriale lo riduce, quella citosolica lo riossida: così esce anche il NADH che serve alla GAPDH.","note":null,"fixed":false},{"id":"m5r-04","topic":"m5-reazioni","level":"m","page":"147","src":"Biochimica II","q":"Bilancio energetico della gluconeogenesi da 2 piruvato:","opts":["4 ATP + 2 GTP + 2 NADH","2 ATP + 2 NADH","6 ATP","2 ATP + 2 GTP"],"ans":0,"why":"6 legami ad alta energia per un glucosio; il ΔG°' complessivo è circa −38 kJ/mol, mentre la glicolisi inversa sarebbe +84.","note":null,"fixed":false},{"id":"m5r-05","topic":"m5-reazioni","level":"m","page":"145","src":"Biochimica II","q":"Che cosa spinge la reazione della PEPCK verso la formazione del fosfoenolpiruvato?","opts":["La decarbossilazione: esce la CO₂ aggiunta dalla piruvato carbossilasi","L'idrolisi di due ATP","L'ossidazione del NADH","Il trasporto nel mitocondrio"],"ans":0,"why":"Formare il PEP costa in tutto due nucleotidi (ATP nella carbossilazione, GTP nella PEPCK).","note":null,"fixed":false},{"id":"m5r-06","topic":"m5-reazioni","level":"a","page":"150","src":"Biochimica II","q":"Se la gluconeogenesi parte dal lattato invece che dall'alanina, come cambia la via?","opts":["Il NADH citosolico viene dalla LDH: l'OAA viene trasformato in PEP già nel mitocondrio dalla PEPCK mitocondriale","Il lattato entra direttamente come PEP","Serve più biotina","Non cambia nulla"],"ans":0,"why":"Dall'alanina il NADH citosolico si ottiene facendo uscire il malato; dal lattato lo fornisce già la LDH.","note":null,"fixed":false},{"id":"m5r-07","topic":"m5-reazioni","level":"a","page":"146","src":"Biochimica II","q":"Un paziente con deficit di glucosio 6-fosfatasi (glicogenosi di tipo I) ha ipoglicemia grave. Perché?","opts":["Perché né la glicogenolisi né la gluconeogenesi epatiche possono liberare glucosio nel sangue","Perché non può fare glicolisi","Perché non produce insulina","Perché non assorbe glucosio"],"ans":0,"why":"Entrambe le vie finiscono nel G6P, che senza la fosfatasi non diventa glucosio libero.","note":"Sbobina di Biochimica II, p. 146: c'è scritto «malattia di tipo 1 di diabete mellito». Dal contesto (nessuna via di ripristino della glicemia funziona) si tratta della glicogenosi di tipo I (malattia di von Gierke).","fixed":false},{"id":"m5r-08","topic":"m5-reazioni","level":"a","page":"152","src":"Biochimica II","q":"Durante la gluconeogenesi epatica, perché la piruvato chinasi va bloccata?","opts":["Per non riconvertire il PEP in piruvato in un ciclo futile che sprecherebbe ATP e GTP","Perché consuma NADH","Perché produce lattato","Perché inibisce la PEPCK"],"ans":0,"why":"Il glucagone la fa fosforilare dalla PKA, ed è l'isoforma epatica (L) a essere regolata così.","note":null,"fixed":false},{"id":"m5r-09","topic":"m5-reazioni","level":"l","page":"145","src":"Biochimica II","q":"Quale nucleotide usa la PEPCK citosolica?","opts":["GTP","ATP","UTP","CTP"],"ans":0,"why":"OAA + GTP → PEP + GDP + CO₂.","note":"Sbobina di Biochimica II, p. 145: c'è scritto che si formano PEP, «ADP» e CO₂. Si forma GDP.","fixed":false},{"id":"m5r-10","topic":"m5-reazioni","level":"l","page":"144","src":"Biochimica II","q":"Quale molecola attiva allostericamente la piruvato carbossilasi?","opts":["Acetil-CoA","ADP","Fruttosio 2,6-bisfosfato","Citrato"],"ans":0,"why":"Di notte la β-ossidazione epatica produce acetil-CoA, che indirizza il piruvato verso l'ossalacetato.","note":"Sbobina di Biochimica II, p. 144: c'è scritto che l'acetil-CoA attiva la «piruvato decarbossilazione». Attiva la piruvato carbossilasi.","fixed":false},{"id":"m5r-11","topic":"m5-reazioni","level":"l","page":"146","src":"Biochimica II","q":"Nella gluconeogenesi, quale enzima converte il fruttosio 1,6-bisfosfato in fruttosio 6-fosfato?","opts":["Fruttosio 1,6-bisfosfatasi","Fosfofruttochinasi 2","Fruttosio 2,6-bisfosfatasi","Aldolasi"],"ans":0,"why":"Idrolizza il fosfato in C1. Non va confusa con la fruttosio 2,6-bisfosfatasi (dominio della PFK2).","note":null,"fixed":false},{"id":"m5g-01","topic":"m5-glicerolo","level":"f","page":"147","src":"Biochimica II","q":"Da dove viene il glicerolo usato nella gluconeogenesi?","opts":["Dalla lipolisi dei trigliceridi del tessuto adiposo","Dalla glicolisi muscolare","Dagli amminoacidi","Dai corpi chetonici"],"ans":0,"why":"Arriva al fegato col sangue.","note":null,"fixed":false},{"id":"m5g-02","topic":"m5-glicerolo","level":"m","page":"147","src":"Biochimica II","q":"Perché la via del glicerolo è «più semplice» della gluconeogenesi dal piruvato?","opts":["Perché entra come diidrossiacetone fosfato, saltando il bypass piruvato → PEP","Perché non consuma ATP","Perché non avviene nel fegato","Perché non serve NAD⁺"],"ans":0,"why":"Glicerolo → glicerolo 3-P → DHAP, poi la via prosegue verso il fruttosio 1,6-bisfosfato.","note":null,"fixed":false},{"id":"m5g-03","topic":"m5-glicerolo","level":"a","page":"149","src":"Biochimica II","q":"Perché il tessuto adiposo non può usare da sé il glicerolo dei trigliceridi?","opts":["Perché non ha la glicerolo chinasi: il glicerolo deve andare al fegato","Perché lo consuma tutto nella β-ossidazione","Perché è tossico","Perché manca la glicerolo 3-P deidrogenasi"],"ans":0,"why":"Per questo il glicerolo liberato dalla lipolisi è un substrato gluconeogenico epatico.","note":"L'assenza della glicerolo chinasi nell'adipocita non è nella sbobina (Lehninger).","fixed":false},{"id":"m5g-04","topic":"m5-glicerolo","level":"l","page":"141, 147","src":"Biochimica II","q":"Il glicerolo 3-fosfato della sbobina è chiamato anche glicerolo 1-fosfato. Perché?","opts":["Per la numerazione: è lo stesso composto (sn-glicerolo 3-fosfato = L-glicerolo 3-fosfato)","Perché sono due isomeri diversi","Perché uno è nel fegato e l'altro nel muscolo","È un errore: il glicerolo 1-fosfato non esiste"],"ans":0,"why":"La numerazione stereospecifica (sn) dà sn-glicerolo 3-fosfato.","note":null,"fixed":false},{"id":"m5reg-01","topic":"m5-regolazione","level":"f","page":"150","src":"Biochimica II","q":"Come viene regolata soprattutto la PEPCK?","opts":["Variando la quantità di enzima (sintesi)","Per fosforilazione","Allostericamente dall'AMP","Per compartimentazione nel nucleo"],"ans":0,"why":"È un meccanismo lento: elementi di risposta nel promotore controllano la trascrizione.","note":null,"fixed":false},{"id":"m5reg-02","topic":"m5-regolazione","level":"f","page":"153","src":"Biochimica II","q":"Il fruttosio 2,6-bisfosfato:","opts":["Attiva la PFK1 e inibisce la fruttosio 1,6-bisfosfatasi","Inibisce la PFK1 e attiva la fruttosio 1,6-bisfosfatasi","Attiva entrambe","È un intermedio della glicolisi"],"ans":0,"why":"Quando c'è si fa glicolisi, quando manca si fa gluconeogenesi.","note":null,"fixed":false},{"id":"m5reg-03","topic":"m5-regolazione","level":"m","page":"151","src":"Biochimica II","q":"Quali elementi del promotore della PEPCK ne stimolano la sintesi?","opts":["GRE (glucocorticoidi), TRE (ormoni tiroidei), CRE (cAMP/glucagone)","IRE (insulina)","SRE (steroli)","HRE (ipossia)"],"ans":0,"why":"L'insulina invece riduce la sintesi.","note":null,"fixed":false},{"id":"m5reg-04","topic":"m5-regolazione","level":"m","page":"153","src":"Biochimica II","q":"Come agisce il glucagone sulla PFK2 epatica?","opts":["La fa fosforilare: prevale l'attività fosfatasica, scende il F2,6BP e parte la gluconeogenesi","La defosforila: sale il F2,6BP","La degrada","La sposta nel nucleo"],"ans":0,"why":"L'insulina fa l'opposto: defosforila, prevale la chinasi, sale il F2,6BP.","note":"Sbobina di Biochimica II, p. 154: c'è scritto che con l'insulina «si attiva il dominio fosfatasico (N terminale)» e con il glucagone «il dominio chinasico (C terminale)». È il contrario, come dice la stessa sbobina a p. 153: l'insulina attiva la chinasi (N-terminale), il glucagone la fosfatasi (C-terminale).","fixed":false},{"id":"m5reg-05","topic":"m5-regolazione","level":"a","page":"152","src":"Biochimica II","q":"Come fa l'insulina a ridurre la sintesi della PEPCK?","opts":["Attiva la PKB, che fosforila FOXO1: il fattore viene degradato dal proteasoma e non attiva più il gene","Lega direttamente il DNA","Fosforila la PEPCK","Aumenta il cAMP"],"ans":0,"why":"È il meccanismo con cui l'IRE risponde all'insulina.","note":"Sbobina di Biochimica II, p. 152: il fattore è chiamato «FOX1». Il nome corretto è FOXO1.","fixed":false},{"id":"m5reg-06","topic":"m5-regolazione","level":"a","page":"156–157","src":"Biochimica II","q":"Il glucagone nel fegato aumenta la glicemia agendo su più enzimi. Quale effetto è sbagliato?","opts":["Attiva la glicogeno sintasi","Attiva la glicogeno fosforilasi","Abbassa il fruttosio 2,6-bisfosfato","Inattiva la piruvato chinasi"],"ans":0,"why":"La PKA inattiva la glicogeno sintasi: tutto converge sul liberare glucosio.","note":null,"fixed":false},{"id":"m5reg-07","topic":"m5-regolazione","level":"a","page":"155","src":"Biochimica II","q":"La fruttosio 1,6-bisfosfatasi è inibita da F2,6BP e da AMP. Che senso ha l'AMP?","opts":["AMP alto segnala fame energetica: la cellula deve fare glicolisi, non spendere ATP per fare glucosio","L'AMP è un prodotto della gluconeogenesi","L'AMP attiva la PEPCK","Non ha senso fisiologico"],"ans":0,"why":"Lo stesso AMP attiva la PFK1: le due vie sono regolate in modo reciproco.","note":"Sbobina di Biochimica II, p. 155: si parla del «fruttosio 1,6 bisfosfato inibito da F2,6BP e AMP». Si intende la fruttosio 1,6-bisfosfatasi.","fixed":false},{"id":"m5reg-08","topic":"m5-regolazione","level":"l","page":"154","src":"Biochimica II","q":"Perché la PFK2 si definisce un enzima «tandem» (bifunzionale)?","opts":["Perché ha due attività opposte (chinasi e fosfatasi) su un'unica catena, in due domini diversi","Perché è formato da due subunità identiche","Perché lavora in coppia con la PFK1","Perché usa due ATP"],"ans":0,"why":"PFK-2/FBPase-2: la fosforilazione decide quale dominio lavora.","note":null,"fixed":false},{"id":"m5reg-09","topic":"m5-regolazione","level":"l","page":"151","src":"Biochimica II","q":"Come si chiama il fattore di trascrizione inibito dall'insulina che stimola la PEPCK?","opts":["FOXO1","CREB","SREBP","HIF-1α"],"ans":0,"why":"PKB/Akt lo fosforila e ne causa l'esclusione dal nucleo e la degradazione.","note":null,"fixed":false},{"id":"m5reg-10","topic":"m5-regolazione","level":"l","page":"155","src":"Biochimica II","q":"Quale effetto ha l'ADP sulla PEPCK?","opts":["La inibisce","La attiva","Nessun effetto","La sposta nel mitocondrio"],"ans":0,"why":"Con poca energia non conviene spendere GTP per fare PEP.","note":"Sbobina di Biochimica II, p. 155: c'è scritto che la PEPCK è favorita dall'ADP, con un dubbio aggiunto da chi ha sbobinato. Nei testi di riferimento l'ADP inibisce la PEPCK. Se a lezione è stato detto diversamente, fallo presente segnalandolo.","fixed":false},{"id":"m5a-01","topic":"m5-approfondimenti","level":"f","page":"158","src":"Biochimica II","q":"Perché bere alcol a digiuno può causare ipoglicemia?","opts":["L'ossidazione dell'etanolo aumenta il NADH e blocca lattato → piruvato e malato → ossalacetato","L'etanolo stimola l'insulina","L'etanolo consuma glucosio","L'etanolo blocca l'assorbimento intestinale"],"ans":0,"why":"Senza NAD⁺ i precursori non entrano nella gluconeogenesi.","note":"Sbobina di Biochimica II, p. 158: c'è scritto che l'acetaldeide viene «ulteriormente ossidata ad ossalacetato». Viene ossidata ad acetato.","fixed":false},{"id":"m5a-02","topic":"m5-approfondimenti","level":"m","page":"156","src":"Biochimica II","q":"Quali stimoli aumentano la secrezione di glucagone?","opts":["Ipoglicemia, amminoacidi, catecolammine","Iperglicemia e insulina","Acidi grassi e corpi chetonici","Cortisolo e melatonina"],"ans":0,"why":"È inibita da iperglicemia e insulina.","note":null,"fixed":false},{"id":"m5a-03","topic":"m5-approfondimenti","level":"m","page":"156","src":"Biochimica II","q":"Con il jet lag, che cosa succede alla gluconeogenesi nei primi giorni?","opts":["La PEPCK resta espressa con il vecchio ritmo: c'è di giorno e manca di notte, e la glicemia notturna è meno regolata","La gluconeogenesi si blocca","La PEPCK raddoppia","Non cambia nulla"],"ans":0,"why":"Il ritmo si riallinea in pochi giorni con il cortisolo.","note":null,"fixed":false},{"id":"m5a-04","topic":"m5-approfondimenti","level":"a","page":"159","src":"Biochimica II","q":"Nel lobulo epatico, dove prevale la gluconeogenesi?","opts":["Negli epatociti periportali","Negli epatociti perivenosi (centrolobulari)","In modo uniforme","Nelle cellule di Kupffer"],"ans":0,"why":"Periportale: gluconeogenesi, ossidazione degli acidi grassi, urea. Perivenoso: glicolisi, lipogenesi, sintesi di glutammina.","note":null,"fixed":false},{"id":"m5a-05","topic":"m5-approfondimenti","level":"a","page":"153","src":"Biochimica II","q":"Topi con PEPCK espressa in modo costitutivo nel muscolo:","opts":["Correvano molto più a lungo, usavano più acidi grassi e producevano meno lattato","Erano obesi e sedentari","Avevano ipoglicemia grave","Non mostravano differenze"],"ans":0,"why":"Mostravano anche più mitocondri e più sensibilità all'insulina, ma erano aggressivi.","note":null,"fixed":false},{"id":"m5a-06","topic":"m5-approfondimenti","level":"l","page":"157","src":"Biochimica II","q":"Nella cascata del glucagone, quale enzima attiva la glicogeno fosforilasi?","opts":["Fosforilasi chinasi","Protein chinasi A direttamente","Adenilato ciclasi","Glicogeno sintasi chinasi 3"],"ans":0,"why":"Glucagone → cAMP → PKA → fosforilasi chinasi → fosforilasi a.","note":"Sbobina di Biochimica II, p. 156: c'è scritto che il cAMP «fosforila enzimi chiave come la PKA». Il cAMP attiva la PKA legandosi alle subunità regolatrici; a fosforilare è la PKA.","fixed":false},{"id":"m6r-01","topic":"m6-reazioni","level":"f","page":"159","src":"Biochimica II","q":"Quali sono i due prodotti principali della via dei pentoso fosfati?","opts":["NADPH e ribosio 5-fosfato","ATP e NADH","Lattato e CO₂","Acetil-CoA e FADH₂"],"ans":0,"why":"Il NADPH serve alle biosintesi riduttive e alla difesa antiossidante; il ribosio 5-P ai nucleotidi.","note":null,"fixed":false},{"id":"m6r-02","topic":"m6-reazioni","level":"f","page":"159","src":"Biochimica II","q":"Dove avviene la via dei pentoso fosfati?","opts":["Nel citosol","Nella matrice mitocondriale","Nel reticolo endoplasmatico","Nel nucleo"],"ans":0,"why":"Come la glicolisi, con cui condivide intermedi.","note":null,"fixed":false},{"id":"m6r-03","topic":"m6-reazioni","level":"f","page":"160","src":"Biochimica II","q":"Quale enzima catalizza la prima reazione della via?","opts":["Glucosio 6-fosfato deidrogenasi","Transchetolasi","Esochinasi","6-fosfogluconato deidrogenasi"],"ans":0,"why":"Ossida il glucosio 6-P a 6-fosfoglucono-δ-lattone, riducendo NADP⁺.","note":null,"fixed":false},{"id":"m6r-04","topic":"m6-reazioni","level":"m","page":"160–161","src":"Biochimica II","q":"Quanti NADPH produce la fase ossidativa per glucosio 6-fosfato?","opts":["2","1","3","4"],"ans":0,"why":"Uno dalla G6PD, uno dalla 6-fosfogluconato deidrogenasi; si libera anche una CO₂.","note":null,"fixed":false},{"id":"m6r-05","topic":"m6-reazioni","level":"m","page":"162","src":"Biochimica II","q":"Che cosa trasferisce la transchetolasi?","opts":["Un frammento di 2 atomi di carbonio","Un frammento di 3 atomi di carbonio","Un gruppo fosfato","Un'unità di CO₂"],"ans":0,"why":"La transaldolasi trasferisce invece 3 carboni.","note":null,"fixed":false},{"id":"m6r-06","topic":"m6-reazioni","level":"m","page":"162","src":"Biochimica II","q":"Quale coenzima usa la transchetolasi?","opts":["Tiamina pirofosfato","Piridossal fosfato","Biotina","NADP⁺"],"ans":0,"why":"Per questo l'attività della transchetolasi eritrocitaria si usa per valutare la carenza di tiamina.","note":null,"fixed":false},{"id":"m6r-07","topic":"m6-reazioni","level":"a","page":"161","src":"Biochimica II","q":"Quale enzima converte il ribulosio 5-P in ribosio 5-P?","opts":["Ribosio 5-fosfato isomerasi","Ribulosio 5-fosfato epimerasi","Transaldolasi","Fosfopentosio mutasi"],"ans":0,"why":"L'epimerasi forma invece lo xilulosio 5-P.","note":null,"fixed":false},{"id":"m6r-08","topic":"m6-reazioni","level":"a","page":"163","src":"Biochimica II","q":"Se la cellula ha bisogno solo di NADPH e non di ribosio, che cosa succede ai pentosi?","opts":["Transchetolasi e transaldolasi li riconvertono in fruttosio 6-P e gliceraldeide 3-P, che possono rigenerare glucosio 6-P","Vengono escreti","Si accumulano","Vanno nel ciclo di Krebs direttamente"],"ans":0,"why":"Riciclando, in teoria tutto il glucosio può essere ossidato a CO₂ producendo 12 NADPH.","note":null,"fixed":false},{"id":"m6r-09","topic":"m6-reazioni","level":"a","page":"164","src":"Biochimica II","q":"Se la cellula ha bisogno di ribosio e non di NADPH?","opts":["Usa solo la fase non ossidativa al contrario, partendo da fruttosio 6-P e gliceraldeide 3-P della glicolisi","Non può produrre ribosio","Usa la gluconeogenesi","Usa solo la G6PD"],"ans":0,"why":"La fase non ossidativa è completamente reversibile.","note":"Sbobina di Biochimica II, p. 164: c'è scritto che «questa via è detta gluconeogenesi». Riformare glucosio 6-P dai pentosi non è la gluconeogenesi vera e propria, che parte da precursori non glucidici.","fixed":false},{"id":"m6r-10","topic":"m6-reazioni","level":"l","page":"160","src":"Biochimica II","q":"Come si chiama il prodotto della glucosio 6-fosfato deidrogenasi?","opts":["6-Fosfoglucono-δ-lattone","6-Fosfogluconato","Ribulosio 5-fosfato","Gluconolattone 1-fosfato"],"ans":0,"why":"Una lattonasi lo idrolizza poi a 6-fosfogluconato.","note":null,"fixed":false},{"id":"m6r-11","topic":"m6-reazioni","level":"l","page":"160","src":"Biochimica II","q":"Quale enzima idrolizza il lattone in 6-fosfogluconato?","opts":["6-Fosfogluconolattonasi","Glucosio 6-fosfatasi","Lattato deidrogenasi","6-Fosfogluconato deidrogenasi"],"ans":0,"why":"La reazione avverrebbe anche spontaneamente, ma più lentamente.","note":null,"fixed":false},{"id":"m6r-12","topic":"m6-reazioni","level":"l","page":"162","src":"Biochimica II","q":"Quale zucchero a 7 atomi di carbonio si forma nella fase non ossidativa?","opts":["Sedoeptulosio 7-fosfato","Eritrosio 7-fosfato","Xilulosio 7-fosfato","Ribulosio 7-fosfato"],"ans":0,"why":"L'eritrosio 4-P invece ha 4 carboni ed è precursore degli amminoacidi aromatici nelle piante.","note":null,"fixed":false},{"id":"m6g-01","topic":"m6-regolazione","level":"f","page":"165","src":"Biochimica II","q":"Qual è l'enzima regolatore della via dei pentoso fosfati?","opts":["Glucosio 6-fosfato deidrogenasi","Transaldolasi","Ribosio 5-P isomerasi","Transchetolasi"],"ans":0,"why":"Catalizza la prima reazione, irreversibile.","note":null,"fixed":false},{"id":"m6g-02","topic":"m6-regolazione","level":"m","page":"165","src":"Biochimica II","q":"Che cosa regola principalmente la G6PD?","opts":["Il rapporto NADP⁺/NADPH","Il livello di ATP","Il glucagone","Il calcio"],"ans":0,"why":"Il NADPH la inibisce; quando viene consumato, il NADP⁺ la attiva.","note":null,"fixed":false},{"id":"m6g-03","topic":"m6-regolazione","level":"a","page":"165","src":"Biochimica II","q":"In quali tessuti la via dei pentoso fosfati è particolarmente attiva?","opts":["Fegato, tessuto adiposo, ghiandola mammaria in lattazione, surrene, eritrociti","Muscolo scheletrico","Cervello","Osso"],"ans":0,"why":"Sono tessuti con molta sintesi di acidi grassi o steroidi, o con forte stress ossidativo.","note":null,"fixed":false},{"id":"m6g-04","topic":"m6-regolazione","level":"a","page":"165","src":"Biochimica II","q":"Che cosa decide il destino del glucosio 6-P tra glicolisi e via dei pentosi?","opts":["Le richieste di NADPH, ribosio 5-P e ATP della cellula","La sola concentrazione di glucosio","Solo l'insulina","La temperatura"],"ans":0,"why":"Ci sono quattro modalità a seconda di cosa serve.","note":null,"fixed":false},{"id":"m6n-01","topic":"m6-nadph","level":"f","page":"166","src":"Biochimica II","q":"Perché il NADPH è indispensabile all'eritrocita?","opts":["Mantiene ridotto il glutatione, che protegge dagli ossidanti","Produce ATP","Sintetizza emoglobina","Trasporta ossigeno"],"ans":0,"why":"L'eritrocita non ha mitocondri: la via dei pentosi è l'unica fonte di NADPH.","note":null,"fixed":false},{"id":"m6n-02","topic":"m6-nadph","level":"f","page":"169","src":"Biochimica II","q":"Che cos'è il favismo?","opts":["Una crisi emolitica da deficit di G6PD scatenata dalle fave","Un'allergia alle fave","Un deficit di vitamina B12","Una malattia del fegato"],"ans":0,"why":"Il deficit di G6PD è legato al cromosoma X.","note":null,"fixed":false},{"id":"m6n-03","topic":"m6-nadph","level":"m","page":"167","src":"Biochimica II","q":"In quali biosintesi serve NADPH?","opts":["Acidi grassi, colesterolo e steroidi, deossiribonucleotidi","Glicogeno","Proteine","Urea"],"ans":0,"why":"Il NADPH è il trasportatore di elettroni per le reazioni riduttive.","note":null,"fixed":false},{"id":"m6n-04","topic":"m6-nadph","level":"m","page":"167","src":"Biochimica II","q":"A che cosa serve il NADPH nei neutrofili?","opts":["Alla NADPH ossidasi, che produce superossido per uccidere i batteri (burst respiratorio)","A produrre ATP","A sintetizzare anticorpi","Al movimento"],"ans":0,"why":"Difetti della NADPH ossidasi causano la malattia granulomatosa cronica.","note":null,"fixed":false},{"id":"m6n-05","topic":"m6-nadph","level":"m","page":"168","src":"Biochimica II","q":"A che cosa servono i citocromi P450?","opts":["A idrossilare farmaci e steroidi usando O₂ e NADPH","A trasportare elettroni nella catena respiratoria","A trasportare ossigeno","A produrre glucosio"],"ans":0,"why":"Sono monossigenasi: un atomo di O va nel substrato, l'altro forma acqua.","note":null,"fixed":false},{"id":"m6n-06","topic":"m6-nadph","level":"a","page":"169","src":"Biochimica II","q":"Perché il deficit di G6PD è diffuso nelle zone malariche?","opts":["Dà una certa protezione contro il Plasmodium falciparum","Per mutazioni indotte dalla malaria","Perché le fave crescono lì","Per caso"],"ans":0,"why":"Il parassita sopporta male lo stress ossidativo dei globuli rossi carenti.","note":null,"fixed":false},{"id":"m6n-07","topic":"m6-nadph","level":"a","page":"169","src":"Biochimica II","q":"Che cosa sono i corpi di Heinz?","opts":["Precipitati di emoglobina ossidata e denaturata negli eritrociti","Frammenti di nucleo","Granuli di ferro","Inclusioni batteriche"],"ans":0,"why":"Si vedono nelle crisi emolitiche da deficit di G6PD.","note":null,"fixed":false},{"id":"m6n-08","topic":"m6-nadph","level":"a","page":"168","src":"Biochimica II","q":"Perché un sovradosaggio di paracetamolo danneggia il fegato?","opts":["Il P450 lo trasforma in NAPQI, che normalmente è coniugato al glutatione; quando il glutatione si esaurisce, il NAPQI lega le proteine epatiche","Perché inibisce la G6PD","Perché blocca il complesso IV","Perché consuma tutto il glicogeno"],"ans":0,"why":"L'antidoto è la N-acetilcisteina, che rigenera il glutatione.","note":"Sbobina di Biochimica II, p. 168: il metabolita tossico e il citocromo sono scritti in modo storpiato («cye2I»). Si tratta del NAPQI (N-acetil-p-benzochinone imina) prodotto soprattutto dal CYP2E1.","fixed":false},{"id":"m6n-09","topic":"m6-nadph","level":"a","page":"169","src":"Biochimica II","q":"Quali sostanze nelle fave scatenano l'emolisi nel deficit di G6PD?","opts":["Vicina e convicina","Solanina e caffeina","Lattosio e galattosio","Amilasi e lectine"],"ans":0,"why":"Generano specie reattive dell'ossigeno. Anche farmaci come primachina e sulfamidici possono scatenarla.","note":"Sbobina di Biochimica II, p. 169: c'è scritto che è «il polline di fava» ad avere azione ossidativa. La causa principale è l'ingestione delle fave (vicina e convicina); il polline è una causa rara e discussa.","fixed":false},{"id":"m6n-10","topic":"m6-nadph","level":"l","page":"168","src":"Biochimica II","q":"Come si chiama per esteso il metabolita tossico del paracetamolo?","opts":["N-acetil-p-benzochinone imina","N-acetil-p-amminofenolo","Paracetamolo glucuronide","Acido acetilsalicilico"],"ans":0,"why":"Sigla NAPQI.","note":null,"fixed":false},{"id":"m6n-11","topic":"m6-nadph","level":"l","page":"168","src":"Biochimica II","q":"Quale isoforma del P450 produce soprattutto il NAPQI, indotta dall'alcol?","opts":["CYP2E1","CYP3A4","CYP1A2","CYP2D6"],"ans":0,"why":"Per questo chi beve cronicamente è più esposto alla tossicità del paracetamolo.","note":null,"fixed":false},{"id":"m6n-12","topic":"m6-nadph","level":"l","page":"169","src":"Biochimica II","q":"Nei neutrofili, quale enzima trasforma H₂O₂ in acido ipocloroso?","opts":["Mieloperossidasi","Catalasi","NADPH ossidasi","Superossido dismutasi"],"ans":0,"why":"L'ipoclorito è un ossidante molto potente contro i batteri.","note":"Sbobina di Biochimica II, p. 169: c'è scritto che i cloruri reagiscono con i radicali formando «ipoclorito di sodio». È la mieloperossidasi a formare acido ipocloroso (HOCl) da H₂O₂ e Cl⁻.","fixed":false},{"id":"m6n-13","topic":"m6-nadph","level":"l","page":"169","src":"Biochimica II","q":"Nelle reazioni di coniugazione dei farmaci (fase II), che cosa sono glutatione, UDP-glucuronato e PAPS?","opts":["Molecole coniugate al farmaco per renderlo più idrosolubile","Trasportatori proteici di membrana","Enzimi del P450","Ormoni"],"ans":0,"why":"Il PAPS (3'-fosfoadenosina 5'-fosfosolfato) è il donatore di solfato.","note":"Sbobina di Biochimica II, p. 169: glutatione, UDP-glucuronico e PAPS sono definiti «trasportatori proteici». Sono molecole che si coniugano al farmaco, non proteine trasportatrici.","fixed":false},{"id":"m6n-14","topic":"m6-nadph","level":"l","page":"169","src":"Biochimica II","q":"A quale classe di farmaci appartengono le benzodiazepine?","opts":["Ansiolitici e ipnotico-sedativi","Antidepressivi triciclici","Inibitori della ricaptazione della serotonina","Antipsicotici"],"ans":0,"why":"Agiscono potenziando il recettore GABA-A; con l'alcol l'effetto sedativo si somma.","note":"Sbobina di Biochimica II, p. 169: le benzodiazepine sono chiamate «farmaci antidepressivi». Sono ansiolitici/ipnotici. Non è nelle sbobine il meccanismo GABA-A.","fixed":false},{"id":"x1c-01","topic":"m1-catabolismo","level":"a","page":"6–7","src":"Biochimica II","q":"Dopo un pasto, a che cosa servono soprattutto il NADPH e l'ATP prodotti dal catabolismo?","opts":["A sostenere le biosintesi riduttive (anabolismo), che consumano ATP e potere riducente","A produrre altro glucosio","A essere eliminati con le urine","A ridurre l'ossigeno nel citosol"],"ans":0,"why":"Catabolismo ossidativo e anabolismo riduttivo sono accoppiati da ATP e coenzimi ridotti.","note":"Sbobina di Biochimica II, p. 6: c'è scritto che per potere riducente delle biosintesi si intende «soprattutto NADH». Il coenzima delle biosintesi riduttive è il NADPH; il NADH serve soprattutto al catabolismo (lo dice la stessa sbobina a p. 159).","fixed":false},{"id":"x1c-02","topic":"m1-catabolismo","level":"a","page":"6","src":"Biochimica II","q":"Perché vitamine e sali minerali sono indispensabili pur non fornendo energia?","opts":["Perché da molte vitamine derivano i coenzimi (es. NAD, FAD) delle reazioni di ossidoriduzione","Perché vengono ossidati nel ciclo di Krebs","Perché formano ATP direttamente","Perché sono metaboliti terminali"],"ans":0,"why":"Sono micronutrienti: servono in piccole quantità come cofattori.","note":null,"fixed":false},{"id":"x1c-03","topic":"m1-catabolismo","level":"l","page":"6","src":"Biochimica II","q":"Come viene eliminato l'azoto in eccesso degli amminoacidi, secondo lo schema del catabolismo?","opts":["L'ammoniaca viene trasformata in urea nel fegato e poi eliminata con le urine","Viene espirata come NH₃","Viene eliminata come acido urico","Viene immagazzinata nel muscolo"],"ans":0,"why":"CO₂ con la respirazione, H₂O nel bilancio idrico, NH₃ come urea.","note":null,"fixed":false},{"id":"x1c-04","topic":"m1-catabolismo","level":"l","page":"7","src":"Biochimica II","q":"In una cellula che si prepara alla mitosi, quali precursori servono per le nuove membrane?","opts":["Acidi grassi, glicerolo e i composti delle teste polari dei fosfolipidi","Solo colesterolo","Amminoacidi e basi azotate","Glicogeno"],"ans":0,"why":"È l'esempio della sbobina: per duplicare la cellula servono DNA nuovo e fosfolipidi nuovi.","note":null,"fixed":false},{"id":"x1t-01","topic":"m1-termodinamica","level":"a","page":"11–12","src":"Biochimica II","q":"Una reazione ha ΔG°' = −20 kJ/mol ma nella cellula ha ΔG ≈ 0. Che cosa significa?","opts":["Le concentrazioni reali sono vicine a quelle di equilibrio: la reazione è reversibile e non è un buon punto di regolazione","Che la reazione è irreversibile","Che l'enzima manca","Che il ΔG°' è sbagliato"],"ans":0,"why":"Conta il ΔG reale, che dipende dal rapporto [prodotti]/[reagenti].","note":null,"fixed":false},{"id":"x1t-02","topic":"m1-termodinamica","level":"a","page":"11","src":"Biochimica II","q":"Se il ΔG°' di una reazione è 0, quanto vale la Keq?","opts":["1","0","10","Infinito"],"ans":0,"why":"ΔG°' = −RT ln Keq: ln 1 = 0.","note":null,"fixed":false},{"id":"x1t-03","topic":"m1-termodinamica","level":"a","page":"12","src":"Biochimica II","q":"Perché due reazioni consecutive possono procedere anche se la prima ha ΔG°' positivo?","opts":["Perché i ΔG°' di reazioni accoppiate si sommano: conta il ΔG complessivo","Perché l'enzima cambia il ΔG","Perché la temperatura aumenta","Non possono"],"ans":0,"why":"È il principio dell'accoppiamento energetico (es. aldolasi seguita dalle reazioni a valle).","note":null,"fixed":false},{"id":"x1t-04","topic":"m1-termodinamica","level":"l","page":"11","src":"Biochimica II","q":"Qual è la relazione tra ΔG e la concentrazione dei reagenti e dei prodotti?","opts":["ΔG = ΔG°' + RT ln([prodotti]/[reagenti])","ΔG = ΔG°' − RT ln([prodotti]/[reagenti])","ΔG = −nFΔE + RT","ΔG = ΔH + TΔS"],"ans":0,"why":"Con il rapporto pari a Keq, ΔG = 0 (equilibrio).","note":null,"fixed":false},{"id":"x1e-01","topic":"m1-enzimologia","level":"a","page":"27","src":"Biochimica II","q":"Un inibitore competitivo come modifica KM e Vmax?","opts":["Aumenta la KM apparente, Vmax invariata","Diminuisce la Vmax, KM invariata","Diminuisce entrambe","Aumenta entrambe"],"ans":0,"why":"Aumentando il substrato si supera l'inibizione.","note":null,"fixed":false},{"id":"x1e-02","topic":"m1-enzimologia","level":"a","page":"29–30","src":"Biochimica II","q":"Qual è la differenza tra regolazione allosterica e controllo della quantità di enzima?","opts":["L'allosterica è rapida (secondi); la sintesi o degradazione dell'enzima è lenta (ore)","Sono ugualmente rapide","L'allosterica è lenta","La quantità di enzima non è regolabile"],"ans":0,"why":"La modificazione covalente (fosforilazione) sta in mezzo: minuti.","note":null,"fixed":false},{"id":"x2f-01","topic":"m2-fosforilazione","level":"a","page":"37–38","src":"Biochimica II","q":"Perché il glucosio 6-fosfato inibisce l'esochinasi ma non la glucochinasi?","opts":["Il fegato deve continuare a fosforilare il glucosio dopo il pasto per immagazzinarlo, anche quando il G6P è alto","Perché la glucochinasi non lega il glucosio","Perché il G6P non entra nel fegato","Perché la glucochinasi è mitocondriale"],"ans":0,"why":"La glucochinasi è invece regolata dalla proteina regolatrice, che la sequestra nel nucleo.","note":null,"fixed":false},{"id":"x2f-02","topic":"m2-fosforilazione","level":"l","page":"55–56","src":"Biochimica II","q":"Dove porta la glucochinasi la sua proteina regolatrice (GKRP) in presenza di fruttosio 6-fosfato?","opts":["Nel nucleo, dove resta inattiva","Nel mitocondrio","Sulla membrana plasmatica","Nel reticolo endoplasmatico"],"ans":0,"why":"Il glucosio alto la libera e la fa tornare nel citosol.","note":null,"fixed":false},{"id":"x2n-01","topic":"m2-navette","level":"a","page":"53–54","src":"Biochimica II","q":"Perché il NADH prodotto nel citosol dalla glicolisi non entra direttamente nel mitocondrio?","opts":["La membrana mitocondriale interna è impermeabile al NADH: entrano solo i suoi elettroni, tramite le navette","Perché viene distrutto","Perché si ossida da solo","Entra liberamente"],"ans":0,"why":"Gli elettroni passano tramite molecole trasportatrici (glicerolo 3-P, malato).","note":null,"fixed":false},{"id":"x2n-02","topic":"m2-navette","level":"a","page":"54","src":"Biochimica II","q":"Nella navetta malato-aspartato, quale molecola attraversa la membrana interna portando gli elettroni?","opts":["Il malato","L'ossalacetato","Il NADH","Il glicerolo 3-fosfato"],"ans":0,"why":"L'ossalacetato non attraversa la membrana: torna fuori come aspartato dopo una transaminazione. Il dettaglio della navetta malato-aspartato non è nelle sbobine.","note":null,"fixed":false},{"id":"x2n-03","topic":"m2-navette","level":"l","page":"54","src":"Biochimica II","q":"Quale abbreviazione è corretta per il glicerolo 3-fosfato della navetta?","opts":["Gro3P (o G3P)","3-PG","GAP","DHAP"],"ans":0,"why":"3-PG è la sigla del 3-fosfoglicerato, un intermedio diverso della glicolisi.","note":"Sbobina di Biochimica II, p. 54: il glicerolo 3-fosfato è abbreviato «3-PG», che è la sigla del 3-fosfoglicerato. Attenzione a non confonderli.","fixed":false},{"id":"x2n-04","topic":"m2-navette","level":"l","page":"54","src":"Biochimica II","q":"Dove si trova la glicerolo 3-fosfato deidrogenasi mitocondriale?","opts":["Sulla faccia esterna della membrana mitocondriale interna, e cede gli elettroni al coenzima Q tramite FAD","Nella matrice","Nel citosol","Nella membrana esterna"],"ans":0,"why":"Per questo il glicerolo 3-P non deve entrare nella matrice.","note":null,"fixed":false},{"id":"x3r-01","topic":"m3-radicali","level":"a","page":"109","src":"Biochimica II","q":"Come viene rigenerato il glutatione ridotto dopo l'azione della glutatione perossidasi?","opts":["Dalla glutatione reduttasi, che usa NADPH","Dalla catalasi","Dalla superossido dismutasi","Dal NADH della catena respiratoria"],"ans":0,"why":"Per questo la via dei pentoso fosfati è fondamentale contro lo stress ossidativo.","note":null,"fixed":false},{"id":"x3r-02","topic":"m3-radicali","level":"a","page":"110","src":"Biochimica II","q":"Che cosa fa il fattore HIF nelle cellule tumorali ipossiche?","opts":["Aumenta gli enzimi glicolitici, la LDH e la PDH chinasi (che blocca la PDH), e sostituisce COX4-1 con COX4-2","Aumenta la β-ossidazione","Inibisce la glicolisi","Attiva la piruvato deidrogenasi"],"ans":0,"why":"Spinge la cellula verso la glicolisi e riduce la produzione di radicali.","note":null,"fixed":false},{"id":"x3r-03","topic":"m3-radicali","level":"l","page":"109","src":"Biochimica II","q":"Perché la glutatione perossidasi ha la selenocisteina invece della cisteina?","opts":["Il selenolato (Se⁻) è più facilmente ionizzato e più reattivo verso i perossidi del tiolato","Perché il selenio lega l'ossigeno","Perché è più stabile","Perché trasporta elettroni"],"ans":0,"why":"Il selenio sta nello stesso gruppo di O e S e cede più facilmente l'H⁺.","note":null,"fixed":false},{"id":"x3r-04","topic":"m3-radicali","level":"l","page":"108","src":"Biochimica II","q":"Quali vitamine sono classicamente considerate antiossidanti?","opts":["C, E e il β-carotene (provitamina A)","K e B12","B1 e B2","D e K"],"ans":0,"why":"La vitamina E protegge le membrane, la C agisce in ambiente acquoso.","note":"Sbobina di Biochimica II, p. 108: tra le vitamine antiossidanti è inclusa anche la K. Le antiossidanti classiche sono C, E e A/β-carotene; la K serve alla coagulazione.","fixed":false},{"id":"x3m-01","topic":"m3-malattie","level":"a","page":"112","src":"Biochimica II","q":"Nella cellula β, qual è la sequenza che porta alla secrezione di insulina?","opts":["Glucosio (GLUT2) → glicolisi e Krebs → ATP ↑ → chiusura canali K⁺ → depolarizzazione → ingresso di Ca²⁺ → esocitosi","Glucosio → cAMP → PKA → esocitosi","Glucosio → apertura canali K⁺ → iperpolarizzazione","Insulina → GLUT4 → ATP"],"ans":0,"why":"Se l'ATP cala (es. per UCP2), la secrezione si riduce.","note":null,"fixed":false},{"id":"x3m-02","topic":"m3-malattie","level":"a","page":"112","src":"Biochimica II","q":"Perché la gravità delle malattie mitocondriali varia tra i figli della stessa madre?","opts":["Per l'eteroplasmia: ogni figlio riceve una quota diversa di mitocondri mutati","Perché il padre trasmette mitocondri sani","Per mutazioni nucleari diverse","Perché il mtDNA si ricombina"],"ans":0,"why":"Sotto una soglia di mitocondri mutati i sintomi possono mancare.","note":null,"fixed":false},{"id":"x3m-03","topic":"m3-malattie","level":"l","page":"113","src":"Biochimica II","q":"Il DNA mitocondriale è più esposto al danno ossidativo del DNA nucleare. Perché?","opts":["È vicino alla catena respiratoria (fonte di radicali), non ha istoni e i suoi sistemi di riparazione sono limitati","Perché è lineare","Perché è più lungo","Perché ha gli istoni"],"ans":0,"why":"Questa è la base dell'ipotesi mitocondriale dell'invecchiamento.","note":"Sbobina di Biochimica II, p. 113: c'è scritto che il DNA mitocondriale «non può ripararsi». È una semplificazione: ha meccanismi di riparazione, ma più limitati di quelli nucleari.","fixed":false},{"id":"x4d-01","topic":"m4-degradazione","level":"a","page":"116–117","src":"Biochimica II","q":"La glicogeno fosforilasi lavora finché trova un punto di ramificazione. A quanti residui si ferma?","opts":["A 4 residui dal punto di ramificazione","A 1 residuo","A 10 residui","Non si ferma"],"ans":0,"why":"Resta una «destrina limite» che va sistemata dall'enzima deramificante.","note":null,"fixed":false},{"id":"x4d-02","topic":"m4-degradazione","level":"l","page":"116","src":"Biochimica II","q":"Perché la fosforolisi del glicogeno nel muscolo rende più ATP per glucosio rispetto al glucosio del sangue?","opts":["Il glucosio 1-P diventa G6P senza consumare l'ATP dell'esochinasi: 3 ATP netti in glicolisi anaerobia invece di 2","Perché produce più NADH","Perché salta la fosfofruttochinasi","Non è vero"],"ans":0,"why":"È un vantaggio della fosforolisi rispetto all'idrolisi.","note":null,"fixed":false},{"id":"x4d-03","topic":"m4-degradazione","level":"l","page":"115","src":"Biochimica II","q":"Che tipo di legami ha il glicogeno nelle catene e nelle ramificazioni?","opts":["α-1,4 nelle catene e α-1,6 nelle ramificazioni","β-1,4 e α-1,6","α-1,4 e β-1,6","Solo α-1,4"],"ans":0,"why":"Un'unica estremità riducente (legata alla glicogenina) e tante estremità non riducenti.","note":null,"fixed":false},{"id":"x4s-01","topic":"m4-sintesi","level":"a","page":"122–123","src":"Biochimica II","q":"Perché la sintesi e la degradazione del glicogeno usano enzimi diversi?","opts":["Così le due vie sono regolate separatamente e in modo reciproco, evitando un ciclo futile","Perché la fosforilasi non è reversibile in vitro","Perché avvengono in organelli diversi","Per caso"],"ans":0,"why":"Lo stesso principio vale per glicolisi e gluconeogenesi.","note":null,"fixed":false},{"id":"x4s-02","topic":"m4-sintesi","level":"l","page":"122","src":"Biochimica II","q":"Su quale estremità del glicogeno lavora la glicogeno sintasi?","opts":["Sulle estremità non riducenti","Sull'estremità riducente","Sui punti di ramificazione","Sulla glicogenina"],"ans":0,"why":"Anche la fosforilasi lavora sulle estremità non riducenti: più rami = più velocità.","note":null,"fixed":false},{"id":"x4s-03","topic":"m4-sintesi","level":"l","page":"122","src":"Biochimica II","q":"Quale nucleotide viene rigenerato dall'UDP con un ATP dopo la sintesi del glicogeno?","opts":["UTP, dalla nucleoside difosfato chinasi","GTP, dalla succinil-CoA sintetasi","CTP, dalla CTP sintetasi","ATP, dall'adenilato chinasi"],"ans":0,"why":"UDP + ATP → UTP + ADP. Il nome dell'enzima non è nelle sbobine.","note":null,"fixed":false},{"id":"x4o-01","topic":"m4-ormoni","level":"a","page":"129–131","src":"Biochimica II","q":"Perché la cascata del glucagone amplifica il segnale?","opts":["Ogni enzima attivato (adenilato ciclasi, PKA, fosforilasi chinasi) attiva molte molecole del passaggio successivo","Perché il glucagone è molto concentrato","Perché il glucagone entra nella cellula","Perché agisce sul DNA"],"ans":0,"why":"Poche molecole di ormone liberano moltissimo glucosio.","note":null,"fixed":false},{"id":"x4o-02","topic":"m4-ormoni","level":"a","page":"132","src":"Biochimica II","q":"Come porta l'insulina allo stoccaggio di glicogeno nel muscolo?","opts":["Aumenta GLUT4 in membrana e, tramite PKB, inattiva GSK3 lasciando attiva la glicogeno sintasi","Attiva la fosforilasi","Aumenta il cAMP","Inibisce l'esochinasi"],"ans":0,"why":"Attiva anche la PP1.","note":null,"fixed":false},{"id":"x4o-03","topic":"m4-ormoni","level":"l","page":"129–130","src":"Biochimica II","q":"Quale proteina G accoppia il recettore del glucagone all'adenilato ciclasi?","op co in caso di danno?","opts":["È un gradiente plastico: gli epatociti di una zona possono assumere le funzioni di un'altra","È fissa e non cambia","Il lobulo smette di fare gluconeogenesi","Gli epatociti perivenosi muoiono"],"ans":0,"why":"Non è una divisione netta ma un gradiente tra vena porta e vena centrale.","note":null,"fixed":false},{"id":"x6g-01","topic":"m6-regolazione","level":"a","page":"165","src":"Biochimica II","q":"Se la cellula sintetizza acidi grassi, che cosa succede alla via dei pentoso fosfati?","opts":["Accelera: la sintesi consuma NADPH, sale il NADP⁺ e la G6PD si attiva","Si blocca","Non cambia","Diventa gluconeogenesi"],"ans":0,"why":"Se il NADPH non viene consumato si accumula e blocca la G6PD.","note":null,"fixed":false},{"id":"x6g-02","topic":"m6-regolazione","level":"a","page":"165","src":"Biochimica II","q":"In una cellula in divisione che ha bisogno sia di ribosio sia di NADPH, quale modalità prevale?","opts":["Fase ossidativa completa: il ribulosio 5-P diventa ribosio 5-P, producendo 2 NADPH per glucosio 6-P","Solo la fase non ossidativa","Solo la glicolisi","Il riciclo completo a CO₂"],"ans":0,"why":"Le altre modalità servono quando prevale il bisogno di uno solo dei due prodotti.","note":null,"fixed":false},{"id":"x6g-03","topic":"m6-regolazione","level":"l","page":"165","src":"Biochimica II","q":"Quale enzima, oltre alla G6PD, produce NADPH nel citosol per la sintesi degli acidi grassi?","opts":["L'enzima malico","La lattato deidrogenasi","La gliceraldeide 3-P deidrogenasi","La piruvato carbossilasi"],"ans":0,"why":"Malato + NADP⁺ → piruvato + CO₂ + NADPH. Anche l'isocitrato deidrogenasi citosolica usa NADP⁺. L'enzima malico non è in questa parte della sbobina.","note":null,"fixed":false},{"id":"x6g-04","topic":"m6-regolazione","level":"l","page":"159","src":"Biochimica II","q":"Che cosa distingue strutturalmente il NADPH dal NADH?","opts":["Un fosfato sul 2' del ribosio dell'adenosina","Un fosfato sul 5' del nicotinammide","Un anello in più","Lo zolfo"],"ans":0,"why":"Il fosfato fa sì che gli enzimi distinguano nettamente i due coenzimi.","note":null,"fixed":false}]}};</script>
<script>

(function () {

  const REPORT_URL = "";

  const $ = (s, el = document) => el.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {

    chev: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',

    flask: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 18.5A2 2 0 006.2 21.5h11.6a2 2 0 001.7-3L14 9V3"/><path d="M7.5 15h9"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
    hex: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/></svg>',

    path: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v4a4 4 0 004 4h4a4 4 0 014 4"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>',
    dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',

    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>',
    board: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21l4-4 4 4M7 9h6M7 12h9"/></svg>',
    pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  };
  ICON.flame = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 01-10 0c0-2.2 1-3.7 2-4.8.3 1.8 1.2 2.8 2.3 2.8C11 8.5 11 6 12 3z"/></svg>';
  const svgIcon = n => { const s = h("span", { html: ICON[n] }); return s.firstChild; };

  /* ---------------- Stato locale ---------------- */
  const blank = () => ({ selected: [], lastChecked: null, onlyLast: false, mode: "write", theme: "system", welcomed: false, newPerDay: 20, device: "", levels: { f: true, m: true, a: true, l: true }, progressive: true, study: "", hardStats: {}, cards: {}, days: {} });
  let S = blank();
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) { /* storage non disponibile */ }
  // dal vecchio sistema a scatole: quelle card ripartono come nuove
  Object.keys(S.cards).forEach(k => { if (!S.cards[k].type) delete S.cards[k]; });
  // modalità di studio: graduale (sblocco al 70%), libera (scegli i livelli), hard (solo domande toste, si scrive)
  if (!["grad", "free", "hard"].includes(S.study)) S.study = S.progressive === false ? "free" : "grad";
  if (!S.hardStats) S.hardStats = {};
  // codice casuale del telefono: raggruppa le segnalazioni della stessa persona senza sapere chi è
  if (!S.device) S.device = "T-" + Math.random().toString(36).slice(2, 6).toUpperCase() + Math.random().toString(36).slice(2, 4).toUpperCase();
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } };

  /* ---------------- Argomenti ---------------- */
  const TOPICS = {};
  C.topics.forEach(sub => sub.blocks.forEach(b => b.topics.forEach(t => { TOPICS[t.id] = Object.assign({ subject: sub.subject, block: b.name }, t); })));

  /* ---------------- Mazzo di card ---------------- */
  const CARDS = [];
  D.molecules.forEach(m => CARDS.push({ id: "mol:" + m.id, kind: "mol", mol: m.id, topics: C.moleculeTopics[m.id] || [], level: "f" }));
  C.reactions.forEach(r => CARDS.push({ id: "rx:" + r.id, kind: "rx", rx: r, topics: [r.topic], level: "m" }));
  (C.exam || []).forEach(x => CARDS.push({ id: "ex:" + x.id, kind: "ex", ex: x, topics: [x.topic], level: x.level || "m" }));
  (C.bank || []).forEach(x => CARDS.push({ id: "q:" + x.id, kind: "ex", ex: x, bank: true, topics: [x.topic], level: x.level }));
  C.pathways.forEach(p => p.steps.forEach((st, i) => CARDS.push({ id: `nx:${p.id}:${i}`, kind: "nx", path: p, step: st, idx: i, topics: [st.topic || p.topic], level: "m" })));
  const CARD = Object.fromEntries(CARDS.map(c => [c.id, c]));

  const activeTopics = () => {
    if (S.onlyLast && S.lastChecked && S.selected.includes(S.lastChecked)) return [S.lastChecked];
    return S.selected.filter(t => TOPICS[t] && TOPICS[t].ready);
  };
  /* ---------------- Livelli ----------------
     Facile → Medio → Alta → 30 e lode. In modalità progressiva, per ogni argomento il livello successivo si sblocca
     quando almeno il 70% delle card del livello precedente è stato imparato (passato in ripasso). */
  const LEVELS = ["f", "m", "a", "l"];
  const LEVEL_NAME = { f: "Facile", m: "Medio", a: "Alta", l: "30 e lode", h: "Hard" };
  const STUDY_NAME = { grad: "Graduale", free: "Libera", hard: "Hard mode" };
  const isHard = () => S.study === "hard";
  // in hard mode: domande Alta e 30 e lode (anche verificate) + molecole e reazioni da scrivere senza opzioni
  const inHard = c => c.kind === "mol" || c.kind === "rx" || (c.kind === "ex" && (c.level === "a" || c.level === "l"));
  const UNLOCK = 0.7;
  const learned = c => { const x = S.cards[c.id]; return !!x && (x.type === "review" || (x.type === "relearn")); };
  function topicLevelState(tid) {
    const cs = CARDS.filter(c => c.topics.includes(tid));
    const by = {}; LEVELS.forEach(l => { const a = cs.filter(c => c.level === l); by[l] = { n: a.length, ok: a.filter(learned).length }; });
    let open = 0; // indice del livello più alto sbloccato
    for (let i = 0; i < LEVELS.length - 1; i++) {
      const cur = by[LEVELS[i]];
      if (cur.n === 0 || cur.ok / cur.n >= UNLOCK) open = i + 1; else break;
    }
    return { by, open };
  }
  const levelAllowed = (c, unlockCache) => {
    if (isHard()) return inHard(c);
    if (!S.levels[c.level]) return false;
    if (S.study !== "grad") return true;
    return c.topics.some(t => { const st = unlockCache[t] || (unlockCache[t] = topicLevelState(t)); return LEVELS.indexOf(c.level) <= st.open; });
  };
  const eligible = () => {
    const a = new Set(activeTopics()), cache = {};
    return CARDS.filter(c => c.topics.some(t => a.has(t)) && levelAllowed(c, cache));
  };
  const cardsInTopic = id => CARDS.filter(c => c.topics.includes(id)).length;
  const topicMeta = id => {
    if (isHard()) { const n = CARDS.filter(c => c.topics.includes(id) && inHard(c)).length; return `${n} card in hard mode`; }
    if (S.study !== "grad") return `${cardsInTopic(id)} card`;
    const st = topicLevelState(id);
    return `${cardsInTopic(id)} card · ${LEVEL_NAME[LEVELS[st.open]]}`;
  };

  /* ---------------- Ripetizione spaziata: algoritmo SM-2 ----------------
     Card nuove → passi di apprendimento (1 min, 10 min) → ripasso a giorni con intervallo × facilità.
     Errore su una card imparata = "lapse": facilità −20%, intervallo azzerato a 1 giorno, ripasso tra 10 min.
     La giornata inizia alle 4 di mattina. */
  const MIN = 60e3, HOUR = 36e5, DAY = 864e5;
  const CFG = { learn: [1 * MIN, 10 * MIN], relearn: [10 * MIN], gradIvl: 1, easyIvl: 4, startEase: 2.5, minEase: 1.3,
    easyBonus: 1.3, hardMult: 1.2, learnAhead: 20 * MIN, leech: 8, mature: 21, hardRelearn: [1 * MIN, 10 * MIN] };
  const dayStart = t => { const d = new Date(t - 4 * HOUR); d.setHours(4, 0, 0, 0); return d.getTime(); };
  const today = () => { const d = new Date(dayStart(Date.now())); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const newState = () => ({ type: "new", step: 0, ease: CFG.startEase, ivl: 0, due: 0, lapses: 0, right: 0, wrong: 0, seen: 0 });
  const fuzz = ivl => { if (ivl < 3) return ivl; const f = Math.max(1, Math.round(ivl * .05)); return ivl + Math.round((Math.random() * 2 - 1) * f); };
  // r: 1 = Di nuovo, 2 = Difficile, 3 = Buono, 4 = Facile
  function schedule(st, r, now, noFuzz) {
    const fz = noFuzz ? x => x : fuzz;
    if (st.type !== "review") {
      const relearning = st.type === "relearn";

  function molCard(c) {

  // Domanda specifica in base a cosa manca nella reazione
  function rxQuestion(r, hid) {
    if (hid.kind === "enz") return "Quale enzima catalizza questa reazione?";
    if (hid.kind === "co") return "Quale coenzima usa questo enzima?";
    const left = hid.side === "left", v = hid.val;
    if (hid.kind === "mol") {
      const sameSide = (left ? r.left : r.right).filter(x => x[0] === "m").length;
      if (left) return sameSide > 1 ? "Quale altro substrato manca?" : "Qual è il substrato di questa reazione?";
      return sameSide > 1 ? "Qual è l'altro prodotto della scissione?" : "Qual è il prodotto di questa reazione?";
    }
    const Q = {
      "ATP": left ? "Quale nucleotide cede il fosfato?" : "Quale nucleotide si forma?",
      "GTP": left ? "Quale nucleotide cede il fosfato?" : "Quale nucleotide si forma?",
      "ADP": left ? "Quale nucleotide accetta il fosfato?" : "Quale nucleotide resta dopo il trasferimento del fosfato?",
      "GDP": left ? "Quale nucleotide accetta il fosfato?" : "Quale nucleotide resta dopo il trasferimento del fosfato?",
      "NAD⁺": left ? "Quale coenzima accetta gli elettroni (si riduce)?" : "In che forma torna il coenzima dopo aver ceduto gli elettroni?",
      "NADH + H⁺": left ? "Quale coenzima cede gli elettroni (si ossida)?" : "In che forma esce il coenzima ridotto?",
      "Pi": left ? "Cosa viene incorporato nel prodotto senza consumare ATP?" : "Cosa viene liberato dall'idrolisi?",
      "H₂O": left ? "Quale molecola serve per l'idrolisi?" : "Quale molecola viene eliminata?",
      "CO₂": "Cosa viene liberato con la decarbossilazione?",
      "HCO₃⁻": "Da dove viene il carbonio aggiunto al piruvato?",
    };
    if (v === "ATP" && left && r.left.some(x => x[1] === "HCO₃⁻")) return "Quale nucleotide viene idrolizzato per attivare il bicarbonato?";
    return Q[v] || "Cosa manca per completare la reazione?";
  }
  const eqText = r => {
    const t = x => x[0] === "m" ? molName(x[1]) : x[1];
    return `${r.left.map(t).join(" + ")} ${r.irreversible ? "→" : "⇌"} ${r.right.map(t).join(" + ")}`;
  };
  function rxCard(c) {
    const r = c.rx;
    const { card, body } = shell(c, "Completa la reazione", "t-peach", "rxn");
    // elementi nascondibili: molecole, cofattori, enzima, coenzima
    const slots = [];
    r.left.forEach((x, i) => slots.push({ side: "left", i, kind: x[0] === "m" ? "mol" : "cof", val: x[1] }));
    r.right.forEach((x, i) => slots.push({ side: "right", i, kind: x[0] === "m" ? "mol" : "cof", val: x[1] }));
    slots.push({ kind: "enz", val: r.enzyme });
    if (r.coenzyme) slots.push({ kind: "co", val: r.coenzyme });
    // in hard mode si nasconde solo una molecola o l'enzima, e la risposta va scritta
    const hidable = isHard() ? slots.filter(s => s.kind === "mol" || s.kind === "enz") : slots;
    const hid = hidable[Math.floor(Math.random() * hidable.length)];
    const question = rxQuestion(r, hid);
    const label = s => s.kind === "mol" ? molName(s.val) : s.val;
    const answer = label(hid);
    const patch = h("span", { class: "patch" }, "?");
    const side = (arr, sideName) => {
      const row = h("div", { class: "rx-side" });
      arr.forEach((x, i) => {
        if (i) row.append(h("span", { class: "rx-plus" }, "+"));
        const isHid = hid.side === sideName && hid.i === i;
        row.append(isHid ? patch : h("span", { class: "rx-item" + (x[0] === "c" ? " cof" : "") }, x[0] === "m" ? molName(x[1]) : x[1]));
      });
      return row;
    };
    const enz = hid.kind === "enz" ? patch : h("span", { class: "enz" }, r.enzyme);
    const co = r.coenzyme ? h("span", { class: "co" }, "coenzima: ", hid.kind === "co" ? patch : r.coenzyme) : null;
    const where = r.where ? h("span", { class: "co" }, "sede: ", r.where) : null;
    body.append(
      h("h2", { class: "q" }, question),
      h("div", { class: "rx" }, side(r.left, "left"),
        h("div", { class: "rx-arrow" }, h("span", { class: "stem" + (r.irreversible ? "" : " rev"), "aria-label": r.irreversible ? "irreversibile" : "reversibile" }), h("div", { class: "rx-enz" }, enz, co, where)),
        side(r.right, "right")));
    let pool;
    if (hid.kind === "mol") pool = D.molecules.map(m => m.name);
    else if (hid.kind === "enz") pool = ALL_ENZYMES;
    else pool = C.cofactorPool;
    const present = slots.filter(s => s !== hid).map(label);
    const opts = shuffle([answer, ...sample(pool, 4, [answer, ...present])]);
    let note = r.note || null;
    if (hid.kind === "enz" && r.enzymeNotInNotes && !note) note = "Il nome dell'enzima non è nelle sbobine.";
    const done = (ok, btn) => {
      const g = grade(c.id, ok ? 3 : 1, c.extra);
      patch.textContent = answer; patch.classList.add("revealed"); if (!ok) patch.classList.add("miss");
      finish(card, btn, ok, `${r.enzyme}: ${eqText(r)}`, ref(subjectOf(r.topic), r.page), note, g);
    };
    if (isHard()) body.append(writeBox(c, hid.kind === "mol" ? "Scrivi il nome della molecola" : "Scrivi il nome dell'enzima",
      v => hid.kind === "mol" ? matchName(v, MOL[hid.val]) : matchText(v, answer), done));
    else body.append(optionList(opts, answer, done));
    return card;
  }

  function nxCard(c) {
    const p = c.path, st = c.step;
    const { card, body } = shell(c, "Cosa succede dopo", "t-sage", "path");
    const askEnzyme = Math.random() < .4;
    const where = st.where ? ` ${st.where}` : "";
    const withTxt = st.with ? ` (insieme al ${MOL[st.with].name.toLowerCase()})` : "";
    const pathName = p.name.charAt(0).toUpperCase() + p.name.slice(1);
    body.append(
      h("h2", { class: "q" }, askEnzyme
        ? `${pathName}: quale enzima agisce ${prep("su", st.from)}${where}?`
        : `${pathName}: cosa si forma ${prep("da", st.from)}${withTxt}${where}?`),
      molBox(st.from));
    const answer = askEnzyme ? st.enzyme : st.to.map(molName).join(" + ");
    let pool;
    if (askEnzyme) pool = ALL_ENZYMES;
    else {
      const inPath = [...new Set(p.steps.flatMap(s => [s.from, ...s.to]))].map(molName);
      pool = [...new Set([...inPath, ...D.molecules.map(m => m.name)])];
      if (st.to.length > 1) pool = ["2 Piruvato", "Glucosio 6-fosfato + Pi", "Fosfoenolpiruvato + Gliceraldeide 3-fosfato", "Diidrossiacetone fosfato + 3-fosfoglicerato", "2 Gliceraldeide 3-fosfato + ATP"];
    }
    const opts = shuffle([answer, ...sample(pool, 4, [answer, molName(st.from)])]);
    body.append(optionList(opts, answer, (ok, btn) => {
      const g = grade(c.id, ok ? 3 : 1, c.extra);
      const full = `${molName(st.from)} → ${st.to.map(molName).join(" + ")} · ${st.enzyme}`;
      const tp = st.topic || p.topic;
      finish(card, btn, ok, full, [ok ? null : `Risposta giusta: ${answer}`, ref(subjectOf(tp), (TOPICS[tp] || {}).pages)].filter(Boolean).join(" · ") || null, st.note || null, g);
    }));
    return card;
  }

  // Domanda verificata (proposta a lezione): opzioni nell'ordine originale (alcune rimandano alle altre: "Tutte e tre", "Nessuno")
  function examCard(c) {
    const x = c.ex;
    const kicker = c.bank ? (x.level === "l" ? "Rifinitura da 30 e lode" : "Domanda") : (x.times > 1 ? `Domanda verificata · uscita ${x.times} volte` : "Domanda verificata");
    const { card, body } = shell(c, kicker, c.bank ? (x.level === "l" ? "t-lilac" : "t-rose") : "t-sky", c.bank ? (x.level === "l" ? "star" : "hex") : "board");
    const qEl = h("h2", { class: "q ex-q" });
    // evidenzia le negazioni, come si fa a penna sul compito
    x.q.split(/(\bnon\b|\bfalsa\b|\btranne\b)/i).forEach(part => qEl.append(/^(non|falsa|tranne)$/i.test(part) ? h("u", {}, part) : part));
    body.append(qEl);
    const correct = x.opts[x.ans];
    const opts = c.bank && !x.fixed ? shuffle(x.opts) : x.opts;
    const letter = "ABCDE"[opts.indexOf(correct)];
    body.append(optionList(opts, correct, (ok, btn) => {
      const g = grade(c.id, ok ? 3 : 1, c.extra);
      finish(card, btn, ok, ok ? x.why : `Risposta: ${letter}. ${x.why}`, x.page ? ref(x.src || subjectOf(x.topic), x.page) : "Non è nelle sbobine", x.note, g);
    }));
    return card;
  }

  /* ---------------- Backup dei progressi ---------------- */
  const BACKUP_FIELDS = ["selected", "lastChecked", "onlyLast", "mode", "theme", "newPerDay", "levels", "progressive", "study", "hardStats", "cards", "days"];
  function backupBox() {
    const box = h("div", { class: "box" });
