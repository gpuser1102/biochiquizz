:"Mitchell la propose nel 1961 e ricevette il Nobel nel 1978.","note":"Sbobina di Biochimica II, p. 100: l'ipotesi dell'accoppiamento chimico è attribuita a Koshland e quella di Mitchell agli anni '70–'80. L'ipotesi chimica è di Slater (1953); Mitchell propose la teoria chemiosmotica nel 1961. Le date non sono nella sbobina, vengono dai testi di riferimento.","fixed":false},{"id":"m3r-01","topic":"m3-radicali","level":"f","page":"108","src":"Biochimica II","q":"Quale enzima trasforma l'anione superossido in perossido di idrogeno?","opts":["Superossido dismutasi","Catalasi","Glutatione perossidasi","NADPH ossidasi","Mieloperossidasi"],"ans":0,"why":"La catalasi poi scinde H₂O₂ in acqua e ossigeno.","note":null,"fixed":false},{"id":"m3r-02","topic":"m3-radicali","level":"m","page":"109","src":"Biochimica II","q":"Che cosa fa la glutatione perossidasi?","opts":["Riduce i perossidi ossidando due glutatione (GSH → GSSG)","Riduce il glutatione ossidato (GSSG → 2 GSH) usando il NADPH","Produce superossido per uccidere i batteri","Ossida il NADPH a NADP⁺ senza substrato","Scinde H₂O₂ in acqua e ossigeno molecolare"],"ans":0,"why":"Il GSSG viene poi ridotto dalla glutatione reduttasi con il NADPH.","note":null,"fixed":false},{"id":"m3r-03","topic":"m3-radicali","level":"m","page":"110","src":"Biochimica II","q":"Quando la catena respiratoria produce più radicali?","opts":["Quando l'ossigeno scarseggia: gli elettroni sostano sui trasportatori e riducono l'O₂ a superossido","Quando l'ossigeno è abbondante: l'eccesso di O₂ reagisce direttamente con il NADH della matrice","Quando c'è molto ADP: la catena lavora in fretta e perde elettroni a ogni passaggio","Mai: la catena respiratoria trasferisce sempre tutti gli elettroni fino all'acqua","Quando il complesso IV lavora troppo veloce e libera ossigeno parzialmente ridotto"],"ans":0,"why":"HIF sostituisce la subunità COX4-1 con COX4-2, più affine all'ossigeno.","note":null,"fixed":false},{"id":"m3r-04","topic":"m3-radicali","level":"a","page":"109","src":"Biochimica II","q":"Perché il selenio è importante nella difesa antiossidante?","opts":["È nel sito attivo della glutatione perossidasi come selenocisteina","È il cofattore metallico della catalasi, al posto del ferro dell'eme","Ripara direttamente il DNA danneggiato dai radicali","Forma il glutatione insieme a cisteina e glicina","È il metallo della superossido dismutasi mitocondriale"],"ans":0,"why":"Va però assunto in piccole quantità: in eccesso è tossico.","note":null,"fixed":false},{"id":"m3r-05","topic":"m3-radicali","level":"a","page":"109","src":"Biochimica II","q":"Quali metalli contengono le isoforme della superossido dismutasi?","opts":["Cu-Zn nel citosol, Mn nel mitocondrio","Fe nel citosol, Cu nel mitocondrio","Solo Zn, in tutti i compartimenti","Se nel citosol, Fe nel mitocondrio","Mn nel citosol, Cu-Zn nel mitocondrio"],"ans":0,"why":"Mutazioni della SOD1 (Cu-Zn) sono associate a forme di SLA.","note":null,"fixed":false},{"id":"m3r-06","topic":"m3-radicali","level":"l","page":"109","src":"Biochimica II","q":"Come si chiama il glutatione ossidato?","opts":["GSSG (disolfuro di glutatione)","GSH","GS-SeH","Glutatione perossido (GS-OOH)","GSH-SG ridotto"],"ans":0,"why":"Due GSH legati da un ponte disolfuro tra le cisteine.","note":null,"fixed":false},{"id":"m3m-01","topic":"m3-malattie","level":"f","page":"111","src":"Biochimica II","q":"Da chi si eredita il DNA mitocondriale?","opts":["Solo dalla madre","Solo dal padre","Da entrambi i genitori in parti uguali","Dipende dal sesso del figlio","Dalla madre per le figlie, dal padre per i figli"],"ans":0,"why":"I mitocondri dello spermatozoo non vengono trasmessi allo zigote.","note":null,"fixed":false},{"id":"m3m-02","topic":"m3-malattie","level":"m","page":"111","src":"Biochimica II","q":"Quante proteine codifica il DNA mitocondriale umano?","opts":["13","37","1000","Nessuna","2"],"ans":0,"why":"Tutte subunità della catena respiratoria e dell'ATP sintasi, più rRNA e tRNA.","note":null,"fixed":false},{"id":"m3m-03","topic":"m3-malattie","level":"m","page":"112","src":"Biochimica II","q":"Che cosa si intende per eteroplasmia?","opts":["Coesistenza in una cellula di mitocondri mutati e sani in proporzione variabile","Presenza di soli mitocondri mutati in tutte le cellule dell'organismo","Presenza nello zigote di mitocondri di origine paterna oltre a quelli materni","Mutazione del DNA nucleare che codifica le proteine mitocondriali","Presenza di due copie identiche di DNA mitocondriale per ogni mitocondrio"],"ans":0,"why":"L'omoplasmia è quando tutti i mitocondri sono uguali (tutti mutati o tutti sani).","note":null,"fixed":false},{"id":"m3m-04","topic":"m3-malattie","level":"a","page":"112","src":"Biochimica II","q":"Una donna ha una malattia da mutazione del mtDNA. Chi tra i suoi figli può ereditarla?","opts":["Sia i figli maschi sia le femmine","Solo le figlie, con il 50% di probabilità","Solo i figli maschi","Nessuno, perché il mtDNA non si trasmette","Metà dei figli, come una malattia dominante"],"ans":0,"why":"Tutti i figli ricevono i mitocondri materni; la gravità dipende dalla quota di mitocondri mutati. Solo le figlie la trasmettono alla generazione successiva.","note":"Sbobina di Biochimica II, p. 112: c'è scritto che «le figlie hanno il 50% di probabilità di ereditare la malattia, mentre i figli non sono a rischio». Il mtDNA va a tutti i figli, maschi e femmine; sono i maschi a non trasmetterlo.","fixed":false},{"id":"m3m-05","topic":"m3-malattie","level":"a","page":"112","src":"Biochimica II","q":"Come può l'aumento di UCP2 nelle cellule β contribuire al diabete di tipo 2?","opts":["Scarica il gradiente protonico: meno ATP e quindi meno secrezione di insulina","Aumenta la secrezione di glucagone dalle cellule α vicine, alzando la glicemia","Blocca i GLUT4 delle cellule β e impedisce l'ingresso del glucosio","Inibisce la glucochinasi della cellula β legandola nel nucleo","Aumenta l'ATP e quindi apre i canali K⁺ della cellula β"],"ans":0,"why":"L'aumento dei radicali (superossido) induce UCP2: meno ATP, canali K⁺ meno chiusi, meno insulina.","note":null,"fixed":false},{"id":"m3m-06","topic":"m3-malattie","level":"l","page":"113","src":"Biochimica II","q":"Qual è l'ipotesi mitocondriale dell'invecchiamento descritta nella sbobina?","opts":["I radicali danneggiano il mtDNA, poco riparato, e la catena respiratoria perde efficienza","I telomeri del DNA mitocondriale si accorciano a ogni divisione del mitocondrio","I mitocondri di origine paterna si accumulano con l'età e competono con quelli materni","L'ATP sintasi viene degradata dal proteasoma e non è più risintetizzata","I mitocondri smettono di dividersi e la cellula ne resta priva"],"ans":0,"why":"È una delle ipotesi; un'altra chiama in causa difetti della divisione mitocondriale.","note":null,"fixed":false},{"id":"m4d-01","topic":"m4-degradazione","level":"f","page":"115","src":"Biochimica II","q":"Dove si trova soprattutto il glicogeno nell'organismo?","opts":["Fegato e muscolo scheletrico","Cervello e rene","Tessuto adiposo bruno e rene","Eritrociti e muscolo","Intestino e pancreas"],"ans":0,"why":"Il glicogeno epatico serve alla glicemia, quello muscolare al muscolo stesso.","note":null,"fixed":false},{"id":"m4d-02","topic":"m4-degradazione","level":"f","page":"116","src":"Biochimica II","q":"Quale enzima stacca le unità di glucosio dal glicogeno?","opts":["Glicogeno fosforilasi","Glicogeno sintasi (reazione inversa)","Amilasi","Esochinasi","Fosfoglucomutasi"],"ans":0,"why":"È una fosforolisi: il legame α-1,4 viene scisso dal fosfato inorganico.","note":null,"fixed":false},{"id":"m4d-03","topic":"m4-degradazione","level":"f","page":"116","src":"Biochimica II","q":"Che prodotto libera la glicogeno fosforilasi?","opts":["Glucosio 1-fosfato","Glucosio libero","Glucosio 6-fosfato","UDP-glucosio","Glucosio 1,6-bisfosfato"],"ans":0,"why":"La fosforolisi conserva l'energia del legame sotto forma di estere fosforico.","note":null,"fixed":false},{"id":"m4d-04","topic":"m4-degradazione","level":"m","page":"116","src":"Biochimica II","q":"Che vantaggio ha la fosforolisi rispetto all'idrolisi?","opts":["Il glucosio esce già fosforilato, senza spendere ATP, e non può lasciare la cellula","Libera più molecole di glucosio per ogni legame rotto rispetto all'idrolisi","È più veloce perché non ha bisogno del piridossal fosfato come cofattore","Non richiede enzimi, perché il fosfato attacca il legame spontaneamente","Il glucosio esce libero e può passare subito nel sangue con i GLUT"],"ans":0,"why":"Nel muscolo si risparmia l'ATP dell'esochinasi.","note":null,"fixed":false},{"id":"m4d-05","topic":"m4-degradazione","level":"m","page":"116","src":"Biochimica II","q":"Quale enzima trasforma il glucosio 1-fosfato in glucosio 6-fosfato?","opts":["Fosfoglucomutasi","Fosfoglucoisomerasi","Glucosio 6-fosfatasi","Esochinasi","Glucochinasi"],"ans":0,"why":"Passa per il glucosio 1,6-bisfosfato.","note":"Sbobina di Biochimica II, p. 116: l'enzima è chiamato «mutazione». Il nome corretto è fosfoglucomutasi.","fixed":false},{"id":"m4d-06","topic":"m4-degradazione","level":"m","page":"117","src":"Biochimica II","q":"Perché il muscolo non può rilasciare glucosio nel sangue?","opts":["Non ha la glucosio 6-fosfatasi","Non ha la glicogeno fosforilasi","Non ha trasportatori GLUT in membrana","Non ha la fosfoglucomutasi","Non ha l'enzima deramificante"],"ans":0,"why":"Il glucosio 6-P del muscolo entra in glicolisi.","note":null,"fixed":false},{"id":"m4d-07","topic":"m4-degradazione","level":"m","page":"117–118","src":"Biochimica II","q":"Che cosa fa l'enzima deramificante?","opts":["Sposta tre residui di un ramo su una catena vicina e idrolizza l'ultimo, legato in α-1,6","Forma i nuovi legami α-1,6 staccando segmenti di sette residui dalle catene in crescita","Stacca glucosio 1-fosfato dai rami con fosforolisi dei legami α-1,6","Sintetizza la glicogenina e la lega alla prima catena di glucosio","Idrolizza tutti i legami α-1,4 dei rami fino al punto di ramificazione"],"ans":0,"why":"La fosforilasi si ferma a 4 residui dal punto di ramificazione.","note":null,"fixed":false},{"id":"m4d-08","topic":"m4-degradazione","level":"a","page":"117","src":"Biochimica II","q":"Dove si trova la glucosio 6-fosfatasi e quali organi la possiedono?","opts":["Nel lume del reticolo endoplasmatico; fegato e rene","Nel citosol; solo fegato","Nel citosol, legata al glicogeno; fegato e muscolo","Nel lisosoma; tutti i tessuti","Sulla membrana plasmatica; fegato e cervello"],"ans":0,"why":"Il G6P entra nel RE tramite un trasportatore (T1); il glucosio esce con GLUT.","note":"Sbobina di Biochimica II, p. 117: la glucosio 6-fosfatasi è definita «esclusiva del fegato». È presente anche nel rene (e nell'intestino), come la stessa sbobina dice a p. 137.","fixed":false},{"id":"m4d-09","topic":"m4-degradazione","level":"a","page":"116","src":"Biochimica II","q":"Quale cofattore usa la glicogeno fosforilasi?","opts":["Piridossal fosfato","Tiamina pirofosfato","Biotina","FAD","Lipoato"],"ans":0,"why":"Il PLP qui agisce col gruppo fosfato come catalizzatore acido-base, non con la base di Schiff.","note":null,"fixed":false},{"id":"m4d-10","topic":"m4-degradazione","level":"a","page":"118","src":"Biochimica II","q":"Quale percentuale circa del glicogeno viene liberata come glucosio libero e non come glucosio 1-P?","opts":["Circa il 10%","Circa il 50%","Circa il 90%","Nessuna","Circa il 30%"],"ans":0,"why":"Corrisponde ai residui legati in α-1,6 nei punti di ramificazione.","note":null,"fixed":false},{"id":"m4d-11","topic":"m4-degradazione","level":"l","page":"118","src":"Biochimica II","q":"Quale legame idrolizza l'attività α-1,6-glucosidasi del deramificante?","opts":["Il legame α-1,6 del residuo rimasto al punto di ramificazione","I legami α-1,4 dei residui terminali di ogni catena","Il legame tra il primo glucosio e la tirosina della glicogenina","I legami β-1,4 presenti tra i residui delle catene interne","Il legame α-1,4 tra i tre residui spostati dalla transferasi"],"ans":0,"why":"È un'unica proteina con due attività: transferasi e glucosidasi.","note":null,"fixed":false},{"id":"m4s-01","topic":"m4-sintesi","level":"f","page":"122","src":"Biochimica II","q":"Qual è il donatore di glucosio nella sintesi del glicogeno?","opts":["UDP-glucosio","Glucosio 1-fosfato","ADP-glucosio","Glucosio 6-fosfato","CDP-glucosio"],"ans":0,"why":"Nelle piante il donatore per l'amido è l'ADP-glucosio.","note":null,"fixed":false},{"id":"m4s-02","topic":"m4-sintesi","level":"f","page":"122","src":"Biochimica II","q":"Quale enzima allunga le catene del glicogeno con legami α-1,4?","opts":["Glicogeno sintasi","Glicogeno fosforilasi","Enzima ramificante","UDP-glucosio pirofosforilasi","Glicogenina"],"ans":0,"why":"Aggiunge glucosio all'estremità non riducente.","note":null,"fixed":false},{"id":"m4s-03","topic":"m4-sintesi","level":"m","page":"122","src":"Biochimica II","q":"Perché la formazione di UDP-glucosio è irreversibile?","opts":["Il pirofosfato prodotto viene idrolizzato dalla pirofosfatasi inorganica","La reazione consuma GTP, che ha un ΔG di idrolisi più negativo","Avviene nel reticolo endoplasmatico, da cui l'UDP-glucosio non esce","L'UTP inibisce la reazione inversa legando l'enzima","L'UDP-glucosio viene subito fosforilato dalla glicogeno sintasi"],"ans":0,"why":"Un trucco comune nelle biosintesi: si sposta l'equilibrio eliminando un prodotto.","note":null,"fixed":false},{"id":"m4s-04","topic":"m4-sintesi","level":"m","page":"123","src":"Biochimica II","q":"Che cosa fa la glicogenina?","opts":["Fa da innesco: si autoglicosila su una tirosina formando una corta catena di glucosio","Ramifica il glicogeno spostando segmenti di sette residui all'interno con legami α-1,6","Degrada il glicogeno nei lisosomi insieme all'α-glucosidasi acida","Trasporta il glucosio dentro l'epatocita insieme al GLUT2","Lega la glicogeno fosforilasi e la tiene attiva sulla particella"],"ans":0,"why":"La glicogeno sintasi non può partire da zero, ha bisogno di un primer.","note":null,"fixed":false},{"id":"m4s-05","topic":"m4-sintesi","level":"m","page":"123","src":"Biochimica II","q":"Come lavora l'enzima ramificante?","opts":["Stacca un segmento di circa 7 residui e lo riattacca con legame α-1,6 più all'interno","Aggiunge un singolo glucosio con legame α-1,6 usando l'UDP-glucosio","Idrolizza i legami α-1,6 dei rami e lascia catene lineari","Forma legami β-1,4 tra catene vicine per rendere il glicogeno compatto","Stacca un segmento di 3 residui e lo sposta su una catena vicina con legame α-1,4"],"ans":0,"why":"Le ramificazioni aumentano solubilità ed estremità non riducenti per sintesi e degradazione rapide.","note":null,"fixed":false},{"id":"m4s-06","topic":"m4-sintesi","level":"a","page":"122","src":"Biochimica II","q":"Quanti legami fosfoanidridici costa aggiungere un glucosio al glicogeno partendo da glucosio 6-P?","opts":["Due (UTP → UDP + PPi, poi PPi → 2 Pi)","Uno (UTP → UDP + PPi)","Tre (ATP per la fosforilazione più UTP e PPi)","Nessuno, perché la sintasi usa il glucosio 6-P","Quattro (due ATP e due UTP)"],"ans":0,"why":"L'UDP poi viene rifosforilato a UTP spendendo un ATP.","note":null,"fixed":false},{"id":"m4s-07","topic":"m4-sintesi","level":"a","page":"123","src":"Biochimica II","q":"A quale residuo della glicogenina si lega il primo glucosio?","opts":["Tirosina","Serina","Treonina","Asparagina","Lisina"],"ans":0,"why":"Il legame si forma con l'ossidrile fenolico della Tyr194.","note":null,"fixed":false},{"id":"m4s-08","topic":"m4-sintesi","level":"l","page":"122","src":"Biochimica II","q":"Qual è il nome esatto dell'enzima che forma UDP-glucosio?","opts":["UDP-glucosio pirofosforilasi","UDP-glucosio sintasi","Glucosio 1-P uridilchinasi","Glicogeno sintasi","UTP-glucosio fosforilasi"],"ans":0,"why":"Il nome viene dalla reazione inversa (pirofosforolisi).","note":null,"fixed":false},{"id":"m4s-09","topic":"m4-sintesi","level":"l","page":"123","src":"Biochimica II","q":"Come si chiama il nome tecnico dell'enzima ramificante?","opts":["Amilo-(1,4→1,6)-transglicosilasi","Amilo-1,6-glucosidasi","Oligo-(1,4→1,4)-glucantransferasi","α-amilasi","Glicogeno ramificasi 1,6"],"ans":0,"why":"Sposta un segmento da un legame 1,4 a un legame 1,6.","note":null,"fixed":false},{"id":"m4r-01","topic":"m4-regolazione","level":"f","page":"124","src":"Biochimica II","q":"La glicogeno fosforilasi è più attiva quando è:","opts":["Fosforilata (forma a)","Defosforilata (forma b)","Legata all'UDP-glucosio","Legata al glucosio libero","Legata all'insulina"],"ans":0,"why":"La fosforilasi chinasi la fosforila su una serina.","note":null,"fixed":false},{"id":"m4r-02","topic":"m4-regolazione","level":"f","page":"126","src":"Biochimica II","q":"La glicogeno sintasi è più attiva quando è:","opts":["Defosforilata","Fosforilata dalla PKA","Legata al cAMP","Legata all'AMP","Fosforilata dalla GSK3"],"ans":0,"why":"Fosforilazione e defosforilazione hanno effetti opposti su sintasi e fosforilasi.","note":null,"fixed":false},{"id":"m4r-03","topic":"m4-regolazione","level":"m","page":"125","src":"Biochimica II","q":"Nel muscolo, quale regolatore allosterico attiva la fosforilasi b anche senza fosforilazione?","opts":["AMP","ATP","Glucosio 6-fosfato","Glucosio","Ca²⁺ da solo"],"ans":0,"why":"AMP alto = poca energia. ATP e glucosio 6-P la inibiscono.","note":null,"fixed":false},{"id":"m4r-04","topic":"m4-regolazione","level":"m","page":"125","src":"Biochimica II","q":"Nel fegato, quale molecola inattiva la fosforilasi a?","opts":["Glucosio","AMP","Ca²⁺","cAMP","Glucagone"],"ans":0,"why":"Il glucosio la porta nello stato T ed espone le serine alla fosfatasi PP1: il fegato è un sensore della glicemia.","note":null,"fixed":false},{"id":"m4r-05","topic":"m4-regolazione","level":"m","page":"126","src":"Biochimica II","q":"Come agisce l'insulina sulla glicogeno sintasi?","opts":["Attiva PKB, che fosforila e inattiva GSK3: la sintasi resta defosforilata e attiva","Fosforila direttamente la sintasi sul recettore tirosin-chinasico e la attiva","Attiva la PKA, che fosforila la sintasi nella sua forma attiva","Inibisce la PP1, così la sintasi resta fosforilata e attiva","Attiva PKB, che fosforila e attiva GSK3: la sintasi viene fosforilata e attivata"],"ans":0,"why":"Inoltre attiva la PP1.","note":"Sbobina di Biochimica II, p. 126: c'è scritto che la PKB fosforila GSK3 «attivandola» e che così «la glicogeno fosforilasi rimanga defosforilata». La PKB inattiva GSK3 e a restare defosforilata (attiva) è la glicogeno sintasi.","fixed":false},{"id":"m4r-06","topic":"m4-regolazione","level":"a","page":"124–125","src":"Biochimica II","q":"Quali stimoli attivano la fosforilasi chinasi?","opts":["Fosforilazione da PKA e Ca²⁺ legato alla subunità δ (calmodulina)","Solo il glucosio, che si lega alla subunità α","L'insulina, tramite la PKB, e il glucosio 6-fosfato","Il glucosio 6-fosfato, come per la sintasi","La defosforilazione da parte della PP1 e l'ATP alto nel muscolo a riposo"],"ans":0,"why":"Nel muscolo il Ca²⁺ della contrazione accoppia contrazione e glicogenolisi.","note":null,"fixed":false},{"id":"m4r-07","topic":"m4-regolazione","level":"a","page":"126","src":"Biochimica II","q":"Perché il glucosio 6-fosfato attiva la glicogeno sintasi?","opts":["Rende la sintasi fosforilata un buon substrato della fosfatasi e la attiva allostericamente","È il donatore diretto di glucosio per la catena di glicogeno in crescita sulla glicogenina","Inibisce la secrezione di insulina e quindi la fosforilazione della sintasi","Attiva la PKA, che a sua volta fosforila la sintasi nella forma attiva","Viene trasformato in UDP-glucosio dalla sintasi stessa"],"ans":0,"why":"Se c'è tanto G6P conviene immagazzinarlo.","note":null,"fixed":false},{"id":"m4r-08","topic":"m4-regolazione","level":"a","page":"127","src":"Biochimica II","q":"Che ruolo ha la PP1 legata al glicogeno?","opts":["Defosforila fosforilasi, fosforilasi chinasi e sintasi: spegne la degradazione e accende la sintesi","Fosforila la sintasi e la fosforilasi: spegne la sintesi e accende la degradazione del glicogeno","Degrada il glicogeno nei lisosomi insieme all'α-glucosidasi acida","Sintetizza cAMP a partire dall'ATP quando arriva il glucagone","Defosforila solo la fosforilasi, senza effetto sulla sintasi"],"ans":0,"why":"La subunità GM la ancora al glicogeno; l'insulina ne favorisce l'attività.","note":null,"fixed":false},{"id":"m4r-09","topic":"m4-regolazione","level":"l","page":"124","src":"Biochimica II","q":"Quale residuo viene fosforilato nella glicogeno fosforilasi?","opts":["Ser14","Tyr194","Ser641","Thr172","Thr197"],"ans":0,"why":"Una sola serina per subunità basta a passare da b ad a.","note":null,"fixed":false},{"id":"m4r-10","topic":"m4-regolazione","level":"l","page":"126","src":"Biochimica II","q":"Che significa la sigla GSK3?","opts":["Glicogeno sintasi chinasi 3","Glucosio sensore chinasi 3","Glicogeno sintasi kinasi attivata da glucosio","Guanosina sintasi chinasi 3","Glicogeno sintasi kinasi fosfatasi 3"],"ans":0,"why":"Fosforila la sintasi in tre serine dopo un innesco dato dalla CKII (caseina chinasi II).","note":null,"fixed":false},{"id":"m4o-01","topic":"m4-ormoni","level":"f","page":"129","src":"Biochimica II","q":"Quale ormone stimola la degradazione del glicogeno nel fegato a digiuno?","opts":["Glucagone","Insulina","Leptina","Ossitocina","Cortisolo"],"ans":0,"why":"Il glucagone agisce sul fegato, non sul muscolo.","note":null,"fixed":false},{"id":"m4o-02","topic":"m4-ormoni","level":"m","page":"129–130","src":"Biochimica II","q":"Quale secondo messaggero media l'effetto del glucagone e dell'adrenalina (via β)?","opts":["cAMP","cGMP","IP₃","NO","Ca²⁺ da solo"],"ans":0,"why":"Il cAMP attiva la PKA, che fosforila la fosforilasi chinasi.","note":null,"fixed":false},{"id":"m4o-03","topic":"m4-ormoni","level":"m","page":"130","src":"Biochimica II","q":"Perché il glucagone non agisce sul muscolo?","opts":["Il muscolo non ha recettori per il glucagone","Il muscolo non produce cAMP","Il muscolo non contiene glicogeno","Il glucagone viene degradato nel sangue prima di arrivare","Il muscolo ha recettori, ma la PKA muscolare è inattiva"],"ans":0,"why":"Il muscolo risponde invece all'adrenalina.","note":null,"fixed":false},{"id":"m4o-04","topic":"m4-ormoni","level":"a","page":"131","src":"Biochimica II","q":"Come agisce l'adrenalina sui recettori α1 epatici?","opts":["Via IP₃ e Ca²⁺, attivando la fosforilasi chinasi","Via cAMP e PKA, esattamente come i recettori β","Via tirosin-chinasi e PKB, come l'insulina","Inibendo la PKA e attivando la PP1","Via cGMP, attivando la glicogeno sintasi"],"ans":0,"why":"Ca²⁺ si lega alla calmodulina della fosforilasi chinasi.","note":null,"fixed":false},{"id":"m4o-05","topic":"m4-ormoni","level":"a","page":"131","src":"Biochimica II","q":"Nel fegato, che effetto ha il glucagone sulla glicogeno sintasi?","opts":["Aumenta il cAMP; la PKA fosforila e inattiva la sintasi e attiva la degradazione","La attiva tramite PKB, che inattiva la GSK3 e lascia la sintasi defosforilata","Non ha effetto sulla sintasi, agisce solo sulla glicogeno fosforilasi","La defosforila tramite PP1 e accende la sintesi di glicogeno","Aumenta il Ca²⁺, che attiva la sintasi tramite calmodulina"],"ans":0,"why":"Sintesi e degradazione sono regolate in modo reciproco: non girano mai insieme a pieno regime.","note":"Sbobina di Biochimica II, p. 131: c'è scritto che il glucagone aumenta «i livelli di AMP» dove si intende cAMP, e si parla di inibizione «della distruzione del glicogeno» dove si intende la sintesi.","fixed":false},{"id":"m4o-06","topic":"m4-ormoni","level":"l","page":"132","src":"Biochimica II","q":"Che cosa sono PKB e Akt?","opts":["Due nomi della stessa chinasi attivata dall'insulina","Una proteasi e una chinasi della via dell'insulina","Due fosfatasi che defosforilano la glicogeno sintasi","Il recettore dell'insulina e il suo substrato IRS-1","Due isoforme della PKA presenti nel fegato"],"ans":0,"why":"La PKB/Akt è una serina/treonina chinasi.","note":"Sbobina di Biochimica II, p. 132: la PKB è chiamata «proteasi». È una chinasi.","fixed":false},{"id":"m4e-01","topic":"m4-attivita","level":"f","page":"134","src":"Biochimica II","q":"Durante uno sprint, da dove ricava energia il muscolo?","opts":["Dal glicogeno muscolare via glicolisi anaerobia","Dagli acidi grassi via β-ossidazione","Dai corpi chetonici prodotti dal fegato","Dalle proteine muscolari via transaminazione","Dal glucosio del sangue via respirazione aerobia"],"ans":0,"why":"Lo sforzo intenso e breve usa la fermentazione lattica.","note":null,"fixed":false},{"id":"m4e-02","topic":"m4-attivita","level":"m","page":"134–135","src":"Biochimica II","q":"Nella maratona, che cosa cambia rispetto allo sprint?","opts":["Il metabolismo è aerobio e usa sempre più acidi grassi, risparmiando glicogeno","Usa solo glicogeno muscolare, che basta per tutta la durata della corsa","Usa soprattutto creatina fosfato, che si rigenera durante lo sforzo","Produce più lattato, perché lo sforzo è più lungo","Usa soprattutto proteine muscolari come fonte principale di energia"],"ans":0,"why":"Quando il glicogeno si esaurisce si ha il «muro».","note":null,"fixed":false},{"id":"m4e-03","topic":"m4-attivita","level":"a","page":"135","src":"Biochimica II","q":"Perché con una dieta ricca di grassi e povera di carboidrati il glicogeno non si ricostituisce dopo lo sforzo?","opts":["Gli acidi grassi danno acetil-CoA, e dall'acetil-CoA non si torna al glucosio","I grassi inibiscono la glicogeno sintasi tramite la PKA muscolare attivata","Gli acidi grassi non entrano nel muscolo senza insulina","I grassi consumano tutto l'ATP necessario alla sintesi di glicogeno","I grassi bloccano i GLUT4 e impediscono l'ingresso del glucosio"],"ans":0,"why":"Serve mangiare carboidrati, subito dopo lo sforzo e poi a intervalli regolari nelle 24 ore successive.","note":"Sbobina di Biochimica II, p. 135: c'è scritto che «la reazione della piruvato carbossilasi è irreversibile». L'enzima irreversibile tra piruvato e acetil-CoA è la piruvato deidrogenasi.","fixed":false},{"id":"m4e-04","topic":"m4-attivita","level":"l","page":"134","src":"Biochimica II","q":"Quanto dura indicativamente la riserva di fosfocreatina in uno sforzo massimale?","opts":["Pochi secondi","Circa 10 minuti","Circa un'ora","Un giorno","Circa 2 minuti"],"ans":0,"why":"Dopo pochi secondi subentra la glicolisi anaerobia.","note":null,"fixed":false},{"id":"m4g-01","topic":"m4-glicogenosi","level":"f","page":"136","src":"Biochimica II","q":"Che cosa sono le glicogenosi?","opts":["Malattie da difetti enzimatici del metabolismo del glicogeno","Infezioni del fegato che causano accumulo di glicogeno","Forme di diabete con eccesso di glicogeno epatico","Malattie da eccesso di glucagone in circolo","Malattie autoimmuni contro la glicogeno sintasi"],"ans":0,"why":"Sono malattie ereditarie, quasi tutte autosomiche recessive.","note":null,"fixed":false},{"id":"m4g-02","topic":"m4-glicogenosi","level":"m","page":"137","src":"Biochimica II","q":"Quale enzima manca nella malattia di von Gierke (tipo I)?","opts":["Glucosio 6-fosfatasi","Glicogeno fosforilasi muscolare","Enzima deramificante","α-glucosidasi acida lisosomiale","Enzima ramificante"],"ans":0,"why":"Ipoglicemia grave a digiuno, epatomegalia, acidosi lattica.","note":null,"fixed":false},{"id":"m4g-03","topic":"m4-glicogenosi","level":"m","page":"138","src":"Biochimica II","q":"Quale enzima manca nella malattia di McArdle (tipo V)?","opts":["Glicogeno fosforilasi muscolare","Glucosio 6-fosfatasi","Enzima ramificante","Fosfofruttochinasi epatica","Glicogeno fosforilasi epatica"],"ans":0,"why":"Crampi e intolleranza all'esercizio; la glicemia è normale.","note":null,"fixed":false},{"id":"m4g-04","topic":"m4-glicogenosi","level":"a","page":"137","src":"Biochimica II","q":"Perché nella von Gierke si dà amido di mais crudo?","opts":["Viene digerito lentamente e libera glucosio poco per volta, evitando l'ipoglicemia","Contiene fruttosio, che entra nella glicolisi senza passare dal glucosio 6-P","Blocca la glicolisi epatica e lascia più glucosio 6-P per il sangue","Fornisce glucosio 6-fosfatasi vegetale che l'intestino assorbe","Viene trasformato in glicogeno direttamente nell'intestino"],"ans":0,"why":"Si danno anche pasti frequenti.","note":"Sbobina di Biochimica II, p. 137: c'è scritto che l'amido crudo rilascia glucosio in modo massiccio. Il senso è l'opposto: lo rilascia lentamente e a lungo.","fixed":false},{"id":"m4g-05","topic":"m4-glicogenosi","level":"a","page":"137","src":"Biochimica II","q":"Perché nella von Gierke c'è iperuricemia e iperlipidemia?","opts":["Il G6P accumulato alimenta glicolisi e pentosi: più acetil-CoA (grassi) e ribosio 5-P (purine → urato)","Manca l'insulina, quindi la lipolisi del tessuto adiposo resta sempre attiva e il rene trattiene l'urato","Il rene non filtra né l'acido urico né i trigliceridi per un danno glomerulare","Il glucagone alto stimola insieme la sintesi di purine e di trigliceridi","Il glicogeno accumulato viene trasformato direttamente in grassi e acido urico"],"ans":0,"why":"Anche il lattato compete con l'urato per l'escrezione renale.","note":null,"fixed":false},{"id":"m4g-06","topic":"m4-glicogenosi","level":"a","page":"138","src":"Biochimica II","q":"Nella McArdle, che cosa succede al lattato durante lo sforzo?","opts":["Non aumenta, perché il muscolo non può usare il glicogeno","Aumenta molto, perché il muscolo va subito in anaerobiosi","Diventa glucosio nel muscolo stesso","Si accumula nel fegato invece che nel sangue","Aumenta solo a riposo e cala durante lo sforzo"],"ans":0,"why":"È alla base del test da sforzo ischemico dell'avambraccio.","note":null,"fixed":false},{"id":"m4g-07","topic":"m4-glicogenosi","level":"l","page":"138","src":"Biochimica II","q":"Che cos'è la mioglobinuria che si vede nella McArdle?","opts":["Presenza di mioglobina nelle urine dopo danno muscolare","Presenza di mioglobina nel sangue dopo lo sforzo","Carenza ereditaria di mioglobina nel muscolo","Accumulo di mioglobina nel fegato","Presenza di mioglobina nel sangue, senza passaggio nelle urine"],"ans":0,"why":"Le urine diventano scure dopo sforzi intensi.","note":"Sbobina di Biochimica II, p. 138: la mioglobinuria è definita «presenza di mioglobina nel sangue». È la presenza di mioglobina nelle urine (la mioglobina nel sangue è la mioglobinemia).","fixed":false},{"id":"m4g-08","topic":"m4-glicogenosi","level":"l","page":"136","src":"Biochimica II","q":"Come si chiama la glicogenosi di tipo II e quale enzima manca?","opts":["Malattia di Pompe, α-glucosidasi acida lisosomiale","Malattia di Cori, enzima deramificante","Malattia di Andersen, enzima ramificante epatico","Malattia di Hers, fosforilasi epatica","Malattia di Tarui, fosfofruttochinasi"],"ans":0,"why":"È anche una malattia da accumulo lisosomiale.","note":null,"fixed":false},{"id":"m5f-01","topic":"m5-fonti","level":"f","page":"140","src":"Biochimica II","q":"Quali sono i precursori non glucidici della gluconeogenesi?","opts":["Lattato, amminoacidi (alanina), glicerolo","Acidi grassi a catena pari, acetil-CoA","Acetil-CoA e corpi chetonici","Colesterolo, glicerolo, urea","Lattato, acidi grassi a catena pari, acetone"],"ans":0,"why":"Dagli acidi grassi a catena pari non si forma glucosio; il propionil-CoA dei grassi dispari sì.","note":null,"fixed":false},{"id":"m5f-02","topic":"m5-fonti","level":"f","page":"140","src":"Biochimica II","q":"Dove avviene la gluconeogenesi?","opts":["Soprattutto nel fegato (circa 90%) e nel rene","Soprattutto nel muscolo scheletrico e nel cuore","Soprattutto nel cervello e nel midollo spinale","Negli eritrociti e nel tessuto adiposo","Soprattutto nell'intestino (circa 90%) e nel fegato"],"ans":0,"why":"Il rene contribuisce soprattutto di notte e nel digiuno prolungato.","note":null,"fixed":false},{"id":"m5f-03","topic":"m5-fonti","level":"m","page":"141","src":"Biochimica II","q":"Quali sono le tre fonti di glucosio ematico durante la giornata?","opts":["Dieta, glicogenolisi, gluconeogenesi","Dieta, β-ossidazione, chetogenesi","Glicolisi, glicogenolisi, lipolisi","Solo dieta e glicogeno epatico","Dieta, gluconeogenesi, via dei pentosi"],"ans":0,"why":"Dopo i pasti prevale la dieta, tra un pasto e l'altro la glicogenolisi, di notte cresce la gluconeogenesi.","note":null,"fixed":false},{"id":"m5f-04","topic":"m5-fonti","level":"m","page":"142","src":"Biochimica II","q":"Quale ormone, con ritmo circadiano, sostiene la gluconeogenesi notturna?","opts":["Cortisolo","Insulina","Melatonina","Ossitocina","Glucagone"],"ans":0,"why":"Il cortisolo ha il minimo verso mezzanotte e il picco al mattino.","note":null,"fixed":false},{"id":"m5f-05","topic":"m5-fonti","level":"a","page":"149","src":"Biochimica II","q":"Su quali tessuti agisce il cortisolo per favorire la gluconeogenesi?","opts":["Fegato (enzimi), muscolo (libera alanina), tessuto adiposo (rende disponibile il glicerolo)","Solo fegato, dove aumenta la sintesi di PEPCK e di glucosio 6-fosfatasi nel nucleo","Pancreas (inibisce l'insulina) e cervello (riduce il consumo di glucosio)","Rene (aumenta il riassorbimento) e intestino (aumenta l'assorbimento)","Muscolo (stimola la glicogenolisi) e fegato (inibisce la glicolisi)"],"ans":0,"why":"Per questo una terapia cortisonica può peggiorare la glicemia dei diabetici e far perdere massa muscolare.","note":null,"fixed":false},{"id":"m5f-06","topic":"m5-fonti","level":"a","page":"157","src":"Biochimica II","q":"Nel digiuno prolungato la gluconeogenesi a un certo punto si riduce. Perché?","opts":["Per risparmiare le proteine muscolari: il cervello usa sempre più corpi chetonici","Perché finisce il glicogeno epatico, che è il precursore della gluconeogenesi","Perché il cortisolo scende a zero dopo i primi giorni di digiuno","Perché il lattato prodotto dal muscolo si esaurisce del tutto","Perché il fegato perde la glucosio 6-fosfatasi nel digiuno"],"ans":0,"why":"Dopo il picco (circa 24–48 ore) la chetogenesi copre il fabbisogno e protegge la massa muscolare.","note":null,"fixed":false},{"id":"m5f-07","topic":"m5-fonti","level":"l","page":"140","src":"Biochimica II","q":"Quale enzima, senza cui il fegato non libera glucosio, è legato al reticolo endoplasmatico?","opts":["Glucosio 6-fosfatasi","Glucochinasi","Fruttosio 1,6-bisfosfatasi","Fosfoglucomutasi","Glicerolo chinasi"],"ans":0,"why":"Il G6P entra nel RE (trasportatore T1), viene idrolizzato e il glucosio esce (T3).","note":null,"fixed":false},{"id":"m5r-01","topic":"m5-reazioni","level":"f","page":"143","src":"Biochimica II","q":"Quali tappe della glicolisi la gluconeogenesi deve aggirare?","opts":["Esochinasi, PFK1, piruvato chinasi","Aldolasi, enolasi, fosfoglicerato chinasi","GAPDH, trioso fosfato isomerasi, fosfoglicerato mutasi","Solo la piruvato chinasi","Esochinasi, aldolasi, enolasi"],"ans":0,"why":"Sono le tre reazioni con ΔG molto negativo; le altre sono reversibili e usate al contrario.","note":null,"fixed":false},{"id":"m5r-02","topic":"m5-reazioni","level":"f","page":"144","src":"Biochimica II","q":"Quale coenzima usa la piruvato carbossilasi?","opts":["Biotina","Tiamina pirofosfato","Piridossal fosfato","Lipoato","Acido folico"],"ans":0,"why":"La biotina trasporta il carbossile dal bicarbonato al piruvato.","note":null,"fixed":false},{"id":"m5r-03","topic":"m5-reazioni","level":"m","page":"145","src":"Biochimica II","q":"Perché l'ossalacetato esce dal mitocondrio come malato?","opts":["Non ha un trasportatore nella membrana mitocondriale interna","Il malato è più energetico dell'ossalacetato","Per consumare NADH nel citosol","L'ossalacetato è instabile e si decarbossila nella matrice","Il malato serve per produrre ATP nel citosol"],"ans":0,"why":"La malato deidrogenasi mitocondriale lo riduce, quella citosolica lo riossida: così esce anche il NADH che serve alla GAPDH.","note":null,"fixed":false},{"id":"m5r-04","topic":"m5-reazioni","level":"m","page":"147","src":"Biochimica II","q":"Bilancio energetico della gluconeogenesi da 2 piruvato:","opts":["4 ATP + 2 GTP + 2 NADH","2 ATP + 2 NADH","6 ATP e nessun NADH","2 ATP + 2 GTP","4 ATP + 2 GTP + 2 FADH₂"],"ans":0,"why":"6 legami ad alta energia per un glucosio; il ΔG°' complessivo è circa −38 kJ/mol, mentre la glicolisi inversa sarebbe +84.","note":null,"fixed":false},{"id":"m5r-05","topic":"m5-reazioni","level":"m","page":"145","src":"Biochimica II","q":"Che cosa spinge la reazione della PEPCK verso la formazione del fosfoenolpiruvato?","opts":["La decarbossilazione: esce la CO₂ aggiunta dalla piruvato carbossilasi","L'idrolisi di due molecole di ATP nello stesso sito attivo dell'enzima","L'ossidazione del NADH citosolico accoppiata alla reazione","Il trasporto del PEP dentro il mitocondrio appena si forma","La riduzione del GTP a GDP con liberazione di energia"],"ans":0,"why":"Formare il PEP costa in tutto due nucleotidi (ATP nella carbossilazione, GTP nella PEPCK).","note":null,"fixed":false},{"id":"m5r-06","topic":"m5-reazioni","level":"a","page":"150","src":"Biochimica II","q":"Se la gluconeogenesi parte dal lattato invece che dall'alanina, come cambia la via?","opts":["Il NADH citosolico viene dalla LDH, quindi l'OAA diventa PEP già nel mitocondrio","Il lattato entra direttamente come PEP, senza passare dal piruvato né dall'ossalacetato","Serve più biotina, perché il lattato va carbossilato due volte","Non cambia nulla: lattato e alanina seguono esattamente la stessa via","Il lattato salta la piruvato carbossilasi ed entra come malato"],"ans":0,"why":"Dall'alanina il NADH citosolico si ottiene facendo uscire il malato; dal lattato lo fornisce già la LDH.","note":null,"fixed":false},{"id":"m5r-07","topic":"m5-reazioni","level":"a","page":"146","src":"Biochimica II","q":"Un paziente con deficit di glucosio 6-fosfatasi (glicogenosi di tipo I) ha ipoglicemia grave. Perché?","opts":["Né la glicogenolisi né la gluconeogenesi epatiche possono liberare glucosio nel sangue","Non può fare glicolisi, quindi il fegato consuma tutto il glucosio del sangue","Non produce insulina, quindi il glucosio non entra nel fegato","Non assorbe glucosio dall'intestino per un difetto degli SGLT1","Il fegato trasforma tutto il glucosio in acido urico"],"ans":0,"why":"Entrambe le vie finiscono nel G6P, che senza la fosfatasi non diventa glucosio libero.","note":"Sbobina di Biochimica II, p. 146: c'è scritto «malattia di tipo 1 di diabete mellito». Dal contesto (nessuna via di ripristino della glicemia funziona) si tratta della glicogenosi di tipo I (malattia di von Gierke).","fixed":false},{"id":"m5r-08","topic":"m5-reazioni","level":"a","page":"152","src":"Biochimica II","q":"Durante la gluconeogenesi epatica, perché la piruvato chinasi va bloccata?","opts":["Per non riconvertire il PEP in piruvato, in un ciclo futile che sprecherebbe ATP e GTP","Perché consuma il NADH che serve alla gliceraldeide 3-fosfato deidrogenasi citosolica","Perché produce lattato che acidificherebbe l'epatocita","Perché inibisce la PEPCK quando è attiva insieme a lei","Perché consuma il GTP prodotto dal ciclo di Krebs"],"ans":0,"why":"Il glucagone la fa fosforilare dalla PKA, ed è l'isoforma epatica (L) a essere regolata così.","note":null,"fixed":false},{"id":"m5r-09","topic":"m5-reazioni","level":"l","page":"145","src":"Biochimica II","q":"Quale nucleotide usa la PEPCK citosolica?","opts":["GTP","ATP","UTP","CTP","NAD⁺"],"ans":0,"why":"OAA + GTP → PEP + GDP + CO₂.","note":"Sbobina di Biochimica II, p. 145: c'è scritto che si formano PEP, «ADP» e CO₂. Si forma GDP.","fixed":false},{"id":"m5r-10","topic":"m5-reazioni","level":"l","page":"144","src":"Biochimica II","q":"Quale molecola attiva allostericamente la piruvato carbossilasi?","opts":["Acetil-CoA","ADP","Fruttosio 2,6-bisfosfato","Citrato","Malonil-CoA"],"ans":0,"why":"Di notte la β-ossidazione epatica produce acetil-CoA, che indirizza il piruvato verso l'ossalacetato.","note":"Sbobina di Biochimica II, p. 144: c'è scritto che l'acetil-CoA attiva la «piruvato decarbossilazione». Attiva la piruvato carbossilasi.","fixed":false},{"id":"m5r-11","topic":"m5-reazioni","level":"l","page":"146","src":"Biochimica II","q":"Nella gluconeogenesi, quale enzima converte il fruttosio 1,6-bisfosfato in fruttosio 6-fosfato?","opts":["Fruttosio 1,6-bisfosfatasi","Fosfofruttochinasi 2","Fruttosio 2,6-bisfosfatasi","Aldolasi","Fosfoglucomutasi"],"ans":0,"why":"Idrolizza il fosfato in C1. Non va confusa con la fruttosio 2,6-bisfosfatasi (dominio della PFK2).","note":null,"fixed":false},{"id":"m5g-01","topic":"m5-glicerolo","level":"f","page":"147","src":"Biochimica II","q":"Da dove viene il glicerolo usato nella gluconeogenesi?","opts":["Dalla lipolisi dei trigliceridi del tessuto adiposo","Dalla glicolisi muscolare, come diidrossiacetone fosfato","Dagli amminoacidi glucogenici del muscolo","Dai corpi chetonici prodotti nel fegato","Dalla digestione dei fosfolipidi di membrana dei globuli rossi"],"ans":0,"why":"Arriva al fegato col sangue.","note":null,"fixed":false},{"id":"m5g-02","topic":"m5-glicerolo","level":"m","page":"147","src":"Biochimica II","q":"Perché la via del glicerolo è «più semplice» della gluconeogenesi dal piruvato?","opts":["Entra come diidrossiacetone fosfato, saltando il bypass piruvato → PEP","Non consuma ATP in nessuna delle sue tappe e non richiede NAD⁺","Non avviene nel fegato, ma nel tessuto adiposo stesso, che ha la glicerolo chinasi","Non serve NAD⁺ per ossidare il glicerolo 3-fosfato","Entra come piruvato, saltando la fruttosio 1,6-bisfosfatasi"],"ans":0,"why":"Glicerolo → glicerolo 3-P → DHAP, poi la via prosegue verso il fruttosio 1,6-bisfosfato.","note":null,"fixed":false},{"id":"m5g-03","topic":"m5-glicerolo","level":"a","page":"149","src":"Biochimica II","q":"Perché il tessuto adiposo non può usare da sé il glicerolo dei trigliceridi?","opts":["Non ha la glicerolo chinasi: il glicerolo deve andare al fegato","Lo consuma tutto nella β-ossidazione insieme agli acidi grassi","Il glicerolo è tossico per l'adipocita e viene espulso","Manca la glicerolo 3-fosfato deidrogenasi citosolica","Lo trasforma tutto in lattato prima di rilasciarlo"],"ans":0,"why":"Per questo il glicerolo liberato dalla lipolisi è un substrato gluconeogenico epatico.","note":"L'assenza della glicerolo chinasi nell'adipocita non è nella sbobina (Lehninger).","fixed":false},{"id":"m5g-04","topic":"m5-glicerolo","level":"l","page":"141, 147","src":"Biochimica II","q":"Il glicerolo 3-fosfato della sbobina è chiamato anche glicerolo 1-fosfato. Perché?","opts":["Per la numerazione: è lo stesso composto (sn-glicerolo 3-fosfato = L-glicerolo 3-fosfato)","Perché sono due isomeri diversi, uno prodotto nel fegato e l'altro nel muscolo","Perché il glicerolo 1-fosfato si forma dalla lipolisi e il 3-fosfato dalla glicolisi","È un errore: il glicerolo 1-fosfato non esiste in natura","Perché uno ha il fosfato sul carbonio centrale e l'altro su quello terminale"],"ans":0,"why":"La numerazione stereospecifica (sn) dà sn-glicerolo 3-fosfato.","note":null,"fixed":false},{"id":"m5reg-01","topic":"m5-regolazione","level":"f","page":"150","src":"Biochimica II","q":"Come viene regolata soprattutto la PEPCK?","opts":["Variando la quantità di enzima (sintesi)","Per fosforilazione da parte della PKA","Allostericamente dall'AMP","Per compartimentazione nel nucleo","Allostericamente dall'acetil-CoA"],"ans":0,"why":"È un meccanismo lento: elementi di risposta nel promotore controllano la trascrizione.","note":null,"fixed":false},{"id":"m5reg-02","topic":"m5-regolazione","level":"f","page":"153","src":"Biochimica II","q":"Il fruttosio 2,6-bisfosfato:","opts":["Attiva la PFK1 e inibisce la fruttosio 1,6-bisfosfatasi","Inibisce la PFK1 e attiva la fruttosio 1,6-bisfosfatasi","Attiva sia la PFK1 sia la fruttosio 1,6-bisfosfatasi","È un intermedio della glicolisi tra F6P e FBP","Inibisce sia la PFK1 sia la fruttosio 1,6-bisfosfatasi"],"ans":0,"why":"Quando c'è si fa glicolisi, quando manca si fa gluconeogenesi.","note":null,"fixed":false},{"id":"m5reg-03","topic":"m5-regolazione","level":"m","page":"151","src":"Biochimica II","q":"Quali elementi del promotore della PEPCK ne stimolano la sintesi?","opts":["GRE (glucocorticoidi), TRE (ormoni tiroidei), CRE (cAMP/glucagone)","IRE (insulina), SRE (steroli), HRE (ipossia, tramite HIF-1α)","SRE (steroli), CRE (cAMP), ERE (estrogeni)","HRE (ipossia), IRE (insulina), TRE (ormoni tiroidei)","ARE (androgeni), GRE (glucocorticoidi), IRE (insulina)"],"ans":0,"why":"L'insulina invece riduce la sintesi.","note":null,"fixed":false},{"id":"m5reg-04","topic":"m5-regolazione","level":"m","page":"153","src":"Biochimica II","q":"Come agisce il glucagone sulla PFK2 epatica?","opts":["La fa fosforilare: prevale l'attività fosfatasica, scende il F2,6BP e parte la gluconeogenesi","La fa defosforilare: prevale l'attività chinasica, sale il F2,6BP e parte la glicolisi","La fa degradare dal proteasoma, così il F2,6BP non viene più prodotto","La sposta nel nucleo insieme alla glucochinasi, dove resta inattiva","La fa fosforilare: prevale l'attività chinasica, sale il F2,6BP e si blocca la gluconeogenesi"],"ans":0,"why":"L'insulina fa l'opposto: defosforila, prevale la chinasi, sale il F2,6BP.","note":"Sbobina di Biochimica II, p. 154: c'è scritto che con l'insulina «si attiva il dominio fosfatasico (N terminale)» e con il glucagone «il dominio chinasico (C terminale)». È il contrario, come dice la stessa sbobina a p. 153: l'insulina attiva la chinasi (N-terminale), il glucagone la fosfatasi (C-terminale).","fixed":false},{"id":"m5reg-05","topic":"m5-regolazione","level":"a","page":"152","src":"Biochimica II","q":"Come fa l'insulina a ridurre la sintesi della PEPCK?","opts":["Attiva la PKB, che fosforila FOXO1: il fattore viene degradato e non attiva più il gene","Il recettore dell'insulina entra nel nucleo e lega direttamente il promotore della PEPCK","Attiva la PKA, che fosforila la PEPCK e ne blocca il sito attivo","Aumenta il cAMP, che lega il CRE e reprime la trascrizione del gene","Attiva la PP1, che defosforila la PEPCK e la rende inattiva"],"ans":0,"why":"È il meccanismo con cui l'IRE risponde all'insulina.","note":"Sbobina di Biochimica II, p. 152: il fattore è chiamato «FOX1». Il nome corretto è FOXO1.","fixed":false},{"id":"m5reg-06","topic":"m5-regolazione","level":"a","page":"156–157","src":"Biochimica II","q":"Il glucagone nel fegato aumenta la glicemia agendo su più enzimi. Quale effetto è sbagliato?","opts":["Attiva la glicogeno sintasi","Attiva la glicogeno fosforilasi","Abbassa il fruttosio 2,6-bisfosfato","Inattiva la piruvato chinasi","Aumenta la sintesi della PEPCK"],"ans":0,"why":"La PKA inattiva la glicogeno sintasi: tutto converge sul liberare glucosio.","note":null,"fixed":false},{"id":"m5reg-07","topic":"m5-regolazione","level":"a","page":"155","src":"Biochimica II","q":"La fruttosio 1,6-bisfosfatasi è inibita da F2,6BP e da AMP. Che senso ha l'AMP?","opts":["AMP alto segnala fame energetica: la cellula non deve spendere ATP per fare glucosio","L'AMP è un prodotto della gluconeogenesi e ne frena la velocità per feedback","L'AMP attiva la PEPCK, quindi serve a coordinare i due enzimi","Non ha senso fisiologico: è un effetto osservato solo in vitro","AMP alto segnala abbondanza di energia: la cellula può fare glucosio"],"ans":0,"why":"Lo stesso AMP attiva la PFK1: le due vie sono regolate in modo reciproco.","note":"Sbobina di Biochimica II, p. 155: si parla del «fruttosio 1,6 bisfosfato inibito da F2,6BP e AMP». Si intende la fruttosio 1,6-bisfosfatasi.","fixed":false},{"id":"m5reg-08","topic":"m5-regolazione","level":"l","page":"154","src":"Biochimica II","q":"Perché la PFK2 si definisce un enzima «tandem» (bifunzionale)?","opts":["Ha due attività opposte (chinasi e fosfatasi) su un'unica catena, in due domini","È formato da due subunità diverse, una regolatrice e una catalitica, sempre unite","Lavora in coppia con la PFK1, a cui passa direttamente il prodotto","Usa due ATP per ogni molecola di fruttosio 2,6-bisfosfato prodotta","Ha due siti attivi che fanno entrambi la stessa reazione di chinasi"],"ans":0,"why":"PFK-2/FBPase-2: la fosforilazione decide quale dominio lavora.","note":null,"fixed":false},{"id":"m5reg-09","topic":"m5-regolazione","level":"l","page":"151","src":"Biochimica II","q":"Come si chiama il fattore di trascrizione inibito dall'insulina che stimola la PEPCK?","opts":["FOXO1","CREB","SREBP","HIF-1α","NF-κB"],"ans":0,"why":"PKB/Akt lo fosforila e ne causa l'esclusione dal nucleo e la degradazione.","note":null,"fixed":false},{"id":"m5reg-10","topic":"m5-regolazione","level":"l","page":"155","src":"Biochimica II","q":"Quale effetto ha l'ADP sulla PEPCK?","opts":["La inibisce","La attiva","Nessun effetto","La sposta nel mitocondrio","La attiva solo nel rene"],"ans":0,"why":"Con poca energia non conviene spendere GTP per fare PEP.","note":"Sbobina di Biochimica II, p. 155: c'è scritto che la PEPCK è favorita dall'ADP, con un dubbio aggiunto da chi ha sbobinato. Nei testi di riferimento l'ADP inibisce la PEPCK. Se a lezione è stato detto diversamente, fallo presente segnalandolo.","fixed":false},{"id":"m5a-01","topic":"m5-approfondimenti","level":"f","page":"158","src":"Biochimica II","q":"Perché bere alcol a digiuno può causare ipoglicemia?","opts":["L'ossidazione dell'etanolo aumenta il NADH e blocca lattato → piruvato e malato → ossalacetato","L'etanolo stimola fortemente la secrezione di insulina dalle cellule β e il glucosio entra nei tessuti","L'etanolo viene ossidato consumando glucosio come fonte di elettroni","L'etanolo blocca l'assorbimento intestinale del glucosio inibendo gli SGLT1","L'etanolo diventa acetaldeide, che inibisce direttamente la glucosio 6-fosfatasi"],"ans":0,"why":"Senza NAD⁺ i precursori non entrano nella gluconeogenesi.","note":"Sbobina di Biochimica II, p. 158: c'è scritto che l'acetaldeide viene «ulteriormente ossidata ad ossalacetato». Viene ossidata ad acetato.","fixed":false},{"id":"m5a-02","topic":"m5-approfondimenti","level":"m","page":"156","src":"Biochimica II","q":"Quali stimoli aumentano la secrezione di glucagone?","opts":["Ipoglicemia, amminoacidi, catecolammine","Iperglicemia, insulina e acidi grassi","Acidi grassi e corpi chetonici","Cortisolo e melatonina","Glucosio e GLP-1"],"ans":0,"why":"È inibita da iperglicemia e insulina.","note":null,"fixed":false},{"id":"m5a-03","topic":"m5-approfondimenti","level":"m","page":"156","src":"Biochimica II","q":"Con il jet lag, che cosa succede alla gluconeogenesi nei primi giorni?","opts":["La PEPCK segue ancora il vecchio ritmo: la glicemia notturna è regolata peggio","La gluconeogenesi si blocca del tutto finché il ritmo non si riadatta","La PEPCK raddoppia la sua espressione per compensare lo stress del viaggio","Non cambia nulla: la PEPCK non segue un ritmo circadiano","Il cortisolo smette di essere secreto e la PEPCK scompare"],"ans":0,"why":"Il ritmo si riallinea in pochi giorni con il cortisolo.","note":null,"fixed":false},{"id":"m5a-04","topic":"m5-approfondimenti","level":"a","page":"159","src":"Biochimica II","q":"Nel lobulo epatico, dove prevale la gluconeogenesi?","opts":["Negli epatociti periportali","Negli epatociti perivenosi (centrolobulari)","In modo uniforme in tutto il lobulo","Nelle cellule di Kupffer","Nelle cellule stellate"],"ans":0,"why":"Periportale: gluconeogenesi, ossidazione degli acidi grassi, urea. Perivenoso: glicolisi, lipogenesi, sintesi di glutammina.","note":null,"fixed":false},{"id":"m5a-05","topic":"m5-approfondimenti","level":"a","page":"153","src":"Biochimica II","q":"Topi con PEPCK espressa in modo costitutivo nel muscolo:","opts":["Correvano molto più a lungo, usavano più acidi grassi e producevano meno lattato","Erano obesi e sedentari, con accumulo di glicogeno nel muscolo","Avevano ipoglicemia grave, perché il muscolo consumava tutto il glucosio","Non mostravano differenze rispetto ai topi normali","Correvano meno, perché il muscolo produceva troppo lattato"],"ans":0,"why":"Mostravano anche più mitocondri e più sensibilità all'insulina, ma erano aggressivi.","note":null,"fixed":false},{"id":"m5a-06","topic":"m5-approfondimenti","level":"l","page":"157","src":"Biochimica II","q":"Nella cascata del glucagone, quale enzima attiva la glicogeno fosforilasi?","opts":["Fosforilasi chinasi","Protein chinasi A direttamente","Adenilato ciclasi","Glicogeno sintasi chinasi 3","Protein fosfatasi 1"],"ans":0,"why":"Glucagone → cAMP → PKA → fosforilasi chinasi → fosforilasi a.","note":"Sbobina di Biochimica II, p. 156: c'è scritto che il cAMP «fosforila enzimi chiave come la PKA». Il cAMP attiva la PKA legandosi alle subunità regolatrici; a fosforilare è la PKA.","fixed":false},{"id":"m6r-01","topic":"m6-reazioni","level":"f","page":"159","src":"Biochimica II","q":"Quali sono i due prodotti principali della via dei pentoso fosfati?","opts":["NADPH e ribosio 5-fosfato","ATP e NADH","Lattato e CO₂","Acetil-CoA e FADH₂","NADH e glucosio 6-fosfato"],"ans":0,"why":"Il NADPH serve alle biosintesi riduttive e alla difesa antiossidante; il ribosio 5-P ai nucleotidi.","note":null,"fixed":false},{"id":"m6r-02","topic":"m6-reazioni","level":"f","page":"159","src":"Biochimica II","q":"Dove avviene la via dei pentoso fosfati?","opts":["Nel citosol","Nella matrice mitocondriale","Nel reticolo endoplasmatico","Nel nucleo","Nei lisosomi"],"ans":0,"why":"Come la glicolisi, con cui condivide intermedi.","note":null,"fixed":false},{"id":"m6r-03","topic":"m6-reazioni","level":"f","page":"160","src":"Biochimica II","q":"Quale enzima catalizza la prima reazione della via?","opts":["Glucosio 6-fosfato deidrogenasi","Transchetolasi","Esochinasi","6-fosfogluconato deidrogenasi","Transaldolasi"],"ans":0,"why":"Ossida il glucosio 6-P a 6-fosfoglucono-δ-lattone, riducendo NADP⁺.","note":null,"fixed":false},{"id":"m6r-04","topic":"m6-reazioni","level":"m","page":"160–161","src":"Biochimica II","q":"Quanti NADPH produce la fase ossidativa per glucosio 6-fosfato?","opts":["2","1","3","4","6"],"ans":0,"why":"Uno dalla G6PD, uno dalla 6-fosfogluconato deidrogenasi; si libera anche una CO₂.","note":null,"fixed":false},{"id":"m6r-05","topic":"m6-reazioni","level":"m","page":"162","src":"Biochimica II","q":"Che cosa trasferisce la transchetolasi?","opts":["Un frammento di 2 atomi di carbonio","Un frammento di 3 atomi di carbonio","Un gruppo fosfato","Un'unità di CO₂","Un frammento di 4 atomi di carbonio"],"ans":0,"why":"La transaldolasi trasferisce invece 3 carboni.","note":null,"fixed":false},{"id":"m6r-06","topic":"m6-reazioni","level":"m","page":"162","src":"Biochimica II","q":"Quale coenzima usa la transchetolasi?","opts":["Tiamina pirofosfato","Piridossal fosfato","Biotina","NADP⁺","Lipoato"],"ans":0,"why":"Per questo l'attività della transchetolasi eritrocitaria si usa per valutare la carenza di tiamina.","note":null,"fixed":false},{"id":"m6r-07","topic":"m6-reazioni","level":"a","page":"161","src":"Biochimica II","q":"Quale enzima converte il ribulosio 5-P in ribosio 5-P?","opts":["Ribosio 5-fosfato isomerasi","Ribulosio 5-fosfato epimerasi","Transaldolasi","Fosfopentosio mutasi","Fosfoglucomutasi"],"ans":0,"why":"L'epimerasi forma invece lo xilulosio 5-P.","note":null,"fixed":false},{"id":"m6r-08","topic":"m6-reazioni","level":"a","page":"163","src":"Biochimica II","q":"Se la cellula ha bisogno solo di NADPH e non di ribosio, che cosa succede ai pentosi?","opts":["Transchetolasi e transaldolasi li riconvertono in fruttosio 6-P e gliceraldeide 3-P","Restano come ribosio 5-P e vengono esportati nel sangue per le biosintesi degli altri tessuti","Si accumulano nel citosol come riserva per le sintesi successive","Entrano direttamente nel ciclo di Krebs come intermedi a cinque carboni","La ribosio 5-P isomerasi li trasforma in glucosio libero"],"ans":0,"why":"Riciclando, in teoria tutto il glucosio può essere ossidato a CO₂ producendo 12 NADPH.","note":null,"fixed":false},{"id":"m6r-09","topic":"m6-reazioni","level":"a","page":"164","src":"Biochimica II","q":"Se a servono i citocromi P450?","opts":["A idrossilare farmaci e steroidi usando O₂ e NADPH","A trasportare elettroni nella catena respiratoria","A trasportare ossigeno nel muscolo","A produrre glucosio nel reticolo endoplasmatico","A ridurre il glutatione ossidato"],"ans":0,"why":"Sono monossigenasi: un atomo di O va nel substrato, l'altro forma acqua.","note":null,"fixed":false},{"id":"m6n-06","topic":"m6-nadph","level":"a","page":"169","src":"Biochimica II","q":"Perché il deficit di G6PD è diffuso nelle zone malariche?","opts":["Dà una certa protezione contro il Plasmodium falciparum","La malaria causa direttamente mutazioni nel gene della G6PD","Le fave crescono soprattutto nelle zone malariche","È un caso, senza un vantaggio selettivo","Aumenta la produzione di anticorpi contro il Plasmodium"],"ans":0,"why":"Il parassita sopporta male lo stress ossidativo dei globuli rossi carenti.","note":null,"fixed":false},{"id":"m6n-07","topic":"m6-nadph","level":"a","page":"169","src":"Biochimica II","q":"Che cosa sono i corpi di Heinz?","opts":["Precipitati di emoglobina ossidata e denaturata negli eritrociti","Frammenti di nucleo rimasti negli eritrociti immaturi dopo l'espulsione","Granuli di ferro accumulati nei siderociti","Inclusioni batteriche nei globuli rossi infetti","Aggregati di glutatione ossidato sulla membrana"],"ans":0,"why":"Si vedono nelle crisi emolitiche da deficit di G6PD.","note":null,"fixed":false},{"id":"m6n-08","topic":"m6-nadph","level":"a","page":"168","src":"Biochimica II","q":"Perché un sovradosaggio di paracetamolo danneggia il fegato?","opts":["Il P450 lo trasforma in NAPQI; finito il glutatione che lo coniuga, il NAPQI lega le proteine epatiche","Inibisce la G6PD epatica, così gli epatociti restano senza NADPH e senza difesa antiossidante","Blocca il complesso IV dei mitocondri epatici come fa il cianuro","Consuma tutto il glicogeno epatico e causa necrosi da ipoglicemia","Viene coniugato al glucuronato in eccesso e precipita nei canalicoli"]," are gli acidi grassi del tessuto adiposo"],"ans":0,"why":"Catabolismo ossidativo e anabolismo riduttivo sono accoppiati da ATP e coenzimi ridotti.","note":"Sbobina di Biochimica II, p. 6: c'è scritto che per potere riducente delle biosintesi si intende «soprattutto NADH». Il coenzima delle biosintesi riduttive è il NADPH; il NADH serve soprattutto al catabolismo (lo dice la stessa sbobina a p. 159).","fixed":false},{"id":"x1c-02","topic":"m1-catabolismo","level":"a","page":"6","src":"Biochimica II","q":"Perché vitamine e sali minerali sono indispensabili pur non fornendo energia?","opts":["Da molte vitamine derivano i coenzimi (es. NAD, FAD) delle ossidoriduzioni","Vengono ossidati nel ciclo di Krebs e forniscono elettroni alla catena","Formano direttamente ATP legandosi all'ADP nella matrice","Sono metaboliti terminali che regolano l'eliminazione dell'urea","Sostituiscono il glucosio come combustibile quando manca"],"ans":0,"why":"Sono micronutrienti: servono in piccole quantità come cofattori.","note":null,"fixed":false},{"id":"x1c-03","topic":"m1-catabolismo","level":"l","page":"6","src":"Biochimica II","q":"Come viene eliminato l'azoto in eccesso degli amminoacidi, secondo lo schema del catabolismo?","opts":["L'ammoniaca diventa urea nel fegato e viene eliminata con le urine","Viene espirata come NH₃ gassosa insieme alla CO₂ prodotta dal ciclo di Krebs","Viene eliminata come acido urico, come negli uccelli","Viene immagazzinata nel muscolo come glutammina","Diventa nitrato e viene eliminata con il sudore"],"ans":0,"why":"CO₂ con la respirazione, H₂O nel bilancio idrico, NH₃ come urea.","note":null,"fixed":false},{"id":"x1c-04","topic":"m1-catabolismo","level":"l","page":"7","src":"Biochimica II","q":"In una cellula che si prepara alla mitosi, quali precursori servono per le nuove membrane?","opts":["Acidi grassi, glicerolo e i composti delle teste polari dei fosfolipidi","Solo colesterolo, che da solo forma il doppio strato fosfolipidico delle membrane","Amminoa
