a reazione dell'aldolasi procede verso destra pur avendo ΔG°' positivo?","opts":["I triosi vengono consumati subito e il ΔG reale diventa vicino a zero","È accoppiata all'idrolisi di ATP, che rende negativo il ΔG","È irreversibile, quindi procede verso destra in ogni condizione","È attivata dall'AMP, che sposta l'equilibrio verso i triosi","Il FBP è un composto ad alta energia che si scinde da solo"],"ans":0,"why":"Per legge di azione di massa: nelle concentrazioni cellulari il ΔG è circa −0,2 kJ/mol.","note":null,"fixed":false},{"id":"m2g-06","topic":"m2-glicolisi","level":"m","page":"43","src":"Biochimica II","q":"Che cosa succede nella reazione della gliceraldeide 3-fosfato deidrogenasi?","opts":["L'aldeide viene ossidata e il Pi forma un'anidride mista ad alta energia","Viene consumato ATP per fosforilare il C1 della gliceraldeide, formando un fosfoestere","Il C1 viene eliminato come CO₂ con riduzione del NAD⁺","Viene ridotto il FAD e si forma un doppio legame C=C","Il fosfato passa dal C3 al C2 tramite un'istidina fosforilata"],"ans":0,"why":"È l'unica ossidoriduzione della glicolisi: si forma 1,3-BPG e NADH.","note":null,"fixed":false},{"id":"m2g-07","topic":"m2-glicolisi","level":"m","page":"45","src":"Biochimica II","q":"Perché la piruvato chinasi è così esoergonica?","opts":["La forma enolica del piruvato tautomerizza subito nella forma chetonica, più stabile","Consuma due molecole di ATP e quindi libera molta energia libera","Libera CO₂, che esce dalla cellula e sposta l'equilibrio","Consuma due molecole di ATP e accoppia la loro idrolisi alla formazione del piruvato","Il piruvato viene subito ridotto a lattato dalla LDH"],"ans":0,"why":"L'idrolisi del PEP (−62 kJ/mol) basta a formare ATP (+30) con ΔG°' complessivo di circa −32 kJ/mol.","note":null,"fixed":false},{"id":"m2g-08","topic":"m2-glicolisi","level":"m","page":"47","src":"Biochimica II","q":"La glicolisi è un processo:","opts":["Acidificante, perché produce 2 H⁺","Alcalinizzante","Alcalinizzante, perché consuma 2 H⁺","Che consuma protoni","Che dipende dall'ossigeno"],"ans":0,"why":"Glucosio + 2 NAD⁺ + 2 ADP + 2 Pi → 2 piruvato + 2 NADH + 2 H⁺ + 2 ATP + 2 H₂O.","note":null,"fixed":false},{"id":"m2g-09","topic":"m2-glicolisi","level":"a","page":"43","src":"Biochimica II","q":"Lo iodoacetato blocca la glicolisi. Su quale enzima agisce e come?","opts":["Gliceraldeide 3-P deidrogenasi, alchilando la cisteina del sito attivo","Piruvato chinasi, competendo con il fosfoenolpiruvato nel sito attivo","Aldolasi, legando il fruttosio 1,6-bisfosfato in modo irreversibile","Esochinasi, sostituendo l'ATP nel sito di legame del nucleotide","Enolasi, sottraendo il Mg²⁺ necessario alla catalisi"],"ans":0,"why":"Il gruppo SH della cisteina catalitica viene legato covalentemente e l'enzima perde l'attività.","note":null,"fixed":false},{"id":"m2g-10","topic":"m2-glicolisi","level":"a","page":"47","src":"Biochimica II","q":"Se in una soluzione con tutti gli enzimi glicolitici manca il NAD⁺, dove si ferma la via?","opts":["Alla gliceraldeide 3-fosfato","Al fruttosio 1,6-bisfosfato","Al fosfoenolpiruvato","Non si ferma","Al 3-fosfoglicerato"],"ans":0,"why":"La gliceraldeide 3-P deidrogenasi richiede NAD⁺: per questo il NADH va sempre riossidato (fermentazione o navette).","note":null,"fixed":false},{"id":"m2g-11","topic":"m2-glicolisi","level":"a","page":"47","src":"Biochimica II","q":"Delle reazioni della glicolisi, quale ha ΔG°' negativo ma ΔG reale vicino a zero nella cellula?","opts":["Fosfoglicerato chinasi","Piruvato chinasi","Fosfofruttochinasi 1","Esochinasi","Gliceraldeide 3-P deidrogenasi"],"ans":0,"why":"Con le concentrazioni reali la fosfoglicerato chinasi è all'equilibrio, per questo non è un punto di regolazione.","note":null,"fixed":false},{"id":"m2g-12","topic":"m2-glicolisi","level":"a","page":"45","src":"Biochimica II","q":"Come funziona la fosfoglicerato mutasi?","opts":["Un'istidina fosforilata cede il fosfato al C2 (intermedio 2,3-BPG), poi riprende quello in C3","Sposta direttamente il fosfato dal C3 al C2, senza intermedi e senza residui fosforilati","Usa ATP per fosforilare il C2, poi una fosfatasi rimuove il fosfato in C3","Idrolizza il fosfato in C3 e lo riattacca al C2 tramite il NAD⁺","Una serina fosforilata cede il fosfato al C3, formando 1,3-bisfosfoglicerato"],"ans":0,"why":"L'enzima va attivato con il 2,3-bisfosfoglicerato, che lo fosforila.","note":null,"fixed":false},{"id":"m2g-13","topic":"m2-glicolisi","level":"l","page":"40","src":"Biochimica II","q":"Nella glicolisi, come si chiama l'enzima che converte il glucosio 6-fosfato in fruttosio 6-fosfato?","opts":["Fosfoesoso isomerasi (fosfoglucosio isomerasi)","Fosfoglucomutasi","Trioso fosfato isomerasi","Fosfofruttochinasi 2","Fosfoglucomutasi (glucosio 6-fosfato mutasi)"],"ans":0,"why":"Aldoso → chetoso. Non va confusa con la fosfoglucomutasi (G1P ⇌ G6P).","note":null,"fixed":false},{"id":"m2g-14","topic":"m2-glicolisi","level":"l","page":"39","src":"Biochimica II","q":"Nell'aldolasi, quali carboni del fruttosio 1,6-bisfosfato diventano il diidrossiacetone fosfato?","opts":["C1–C3","C4–C6","C2–C4","C1, C2, C6","C3–C5"],"ans":0,"why":"La scissione è tra C3 e C4: C1–C3 → DHAP, C4–C6 → gliceraldeide 3-P.","note":null,"fixed":false},{"id":"m2g-15","topic":"m2-glicolisi","level":"l","page":"40","src":"Biochimica II","q":"Il prodotto della gliceraldeide 3-P deidrogenasi si chiama:","opts":["1,3-bisfosfoglicerato","2,3-bisfosfoglicerato","3-fosfoglicerato","Glicerolo 3-fosfato","Fosfoenolpiruvato"],"ans":0,"why":"Il fosfato aggiunto è in C1 (anidride mista), quello in C3 era già presente.","note":null,"fixed":false},{"id":"m2g-16","topic":"m2-glicolisi","level":"l","page":"41","src":"Biochimica II","q":"Nella glicolisi la reazione della PFK1 forma quale legame?","opts":["Fosfoestere sul C1 del fruttosio 6-P","Fosfoanidridico","Glicosidico","Fosfoanidridico tra il C1 e il fosfato β dell'ATP","Fosfoestere sul C6"],"ans":0,"why":"Il fosfato γ dell'ATP esterifica l'OH del C1.","note":null,"fixed":false},{"id":"m2r-01","topic":"m2-fermentazioni","level":"f","page":"49","src":"Biochimica II","q":"Qual è lo scopo della fermentazione lattica?","opts":["Rigenerare NAD⁺ per la glicolisi","Produrre ATP oltre a quello della glicolisi","Eliminare il piruvato in eccesso dalla cellula","Produrre glucosio per gli altri tessuti","Ridurre il FAD per la catena respiratoria"],"ans":0,"why":"Senza NAD⁺ la gliceraldeide 3-P deidrogenasi si ferma; la LDH riossida il NADH riducendo il piruvato.","note":null,"fixed":false},{"id":"m2r-02","topic":"m2-fermentazioni","level":"f","page":"49","src":"Biochimica II","q":"Quali cellule fanno sempre fermentazione lattica?","opts":["Eritrociti","Epatociti","Cardiomiociti","Neuroni","Adipociti"],"ans":0,"why":"Non hanno mitocondri.","note":null,"fixed":false},{"id":"m2r-03","topic":"m2-fermentazioni","level":"m","page":"50","src":"Biochimica II","q":"Quanti isoenzimi della LDH esistono e perché?","opts":["5, dalle combinazioni di subunità H e M nel tetramero","2, una per il cuore (H) e una per il muscolo (M)","4, una per ciascuna subunità del tetramero","3, una per cuore, muscolo e fegato","6, dalle combinazioni di tre tipi di subunità nel dimero"],"ans":0,"why":"H4, H3M, H2M2, HM3, M4.","note":null,"fixed":false},{"id":"m2r-04","topic":"m2-fermentazioni","level":"m","page":"53","src":"Biochimica II","q":"Nella fermentazione alcolica, quali sono le due tappe?","opts":["Decarbossilazione del piruvato ad acetaldeide, poi sua riduzione a etanolo con NADH","Riduzione del piruvato a lattato, poi decarbossilazione del lattato a etanolo","Ossidazione del piruvato ad acetil-CoA, poi riduzione dell'acetil-CoA a etanolo","Carbossilazione del piruvato a ossalacetato, poi sua riduzione a etanolo","Riduzione del piruvato ad acetaldeide con NADH, poi decarbossilazione a etanolo"],"ans":0,"why":"La prima è irreversibile (si perde CO₂), la seconda reversibile (alcol deidrogenasi).","note":null,"fixed":false},{"id":"m2r-05","topic":"m2-fermentazioni","level":"a","page":"52","src":"Biochimica II","q":"Secondo la sbobina, perché la riduzione del piruvato a lattato non acidifica la cellula?","opts":["La LDH consuma un H⁺ (NADH + H⁺) e il lattato esce con un H⁺ dal trasportatore MCT","Il lattato è un acido debole che a pH 7 resta quasi tutto protonato","La reazione libera ioni OH⁻ che neutralizzano i protoni della glicolisi","Il lattato viene subito ossidato a CO₂ nel mitocondrio della stessa cellula","L'anidrasi carbonica tampona tutti i protoni prodotti dalla LDH"],"ans":0,"why":"L'acidificazione muscolare viene soprattutto dall'idrolisi dell'ATP; il lattato esce con un protone verso il sangue.","note":"Il ruolo del lattato nell'acidosi è dibattuto: alcuni testi (Lehninger) attribuiscono l'acidificazione all'acido lattico. All'esame segui l'impostazione della sbobina.","fixed":false},{"id":"m2r-06","topic":"m2-fermentazioni","level":"a","page":"53","src":"Biochimica II","q":"Perché l'assunzione di molto etanolo può dare ipoglicemia e acidosi lattica?","opts":["L'ossidazione dell'etanolo produce NADH: piruvato → lattato e gluconeogenesi bloccata","L'etanolo inibisce la secrezione di insulina e attiva quella di glucagone","L'acetaldeide blocca la glicolisi epatica inattivando la fosfofruttochinasi","L'etanolo consuma tutto il NADH del fegato, bloccando la catena respiratoria","L'etanolo viene trasformato direttamente in lattato dalla LDH"],"ans":0,"why":"Con rapporto NADH/NAD⁺ alto il fegato non può ossidare il lattato a piruvato.","note":null,"fixed":false},{"id":"m2r-07","topic":"m2-fermentazioni","level":"l","page":"49","src":"Biochimica II","q":"Quale stereoisomero del lattato si forma nell'uomo?","opts":["L-lattato (S)","D-lattato (R)","Una miscela racemica","Meso-lattato","Una miscela di L e D in rapporto 3:1"],"ans":0,"why":"La LDH umana è stereospecifica e forma L-lattato.","note":"Sbobina di Biochimica II, p. 49: c'è scritto che si forma l'isomero «R». L'L-lattato è (S).","fixed":false},{"id":"m2r-08","topic":"m2-fermentazioni","level":"l","page":"53","src":"Biochimica II","q":"Quale metallo contiene l'alcol deidrogenasi?","opts":["Zinco","Ferro","Magnesio","Rame","Manganese"],"ans":0,"why":"È uno dei motivi per cui lo zinco è necessario nella dieta.","note":null,"fixed":false},{"id":"m2r-09","topic":"m2-fermentazioni","level":"l","page":"52","src":"Biochimica II","q":"L'isoenzima LDH1 corrisponde a:","opts":["H4 (cardiaco)","M4 (muscolare)","H2M2","M3H","H3M"],"ans":0,"why":"LDH1 = H4, LDH5 = M4.","note":null,"fixed":false},{"id":"m2n-01","topic":"m2-navette","level":"f","page":"53","src":"Biochimica II","q":"Perché servono i sistemi navetta?","opts":["La membrana mitocondriale interna è impermeabile al NADH","Il NADH è instabile nel citosol e si degrada in pochi secondi","Servono per portare l'ATP dal citosol dentro la matrice","Servono per portare il piruvato dal citosol nel mitocondrio","La membrana mitocondriale esterna è impermeabile al NAD⁺"],"ans":0,"why":"Si trasferiscono gli elettroni del NADH citosolico, non la molecola.","note":null,"fixed":false},{"id":"m2n-02","topic":"m2-navette","level":"m","page":"54","src":"Biochimica II","q":"Nella navetta del glicerolo fosfato, a chi cede gli elettroni il glicerolo 3-fosfato?","opts":["Al FAD della glicerolo 3-P deidrogenasi mitocondriale","Al NAD⁺ della matrice tramite la malato deidrogenasi","Direttamente all'O₂ del complesso IV","Al citocromo c nello spazio intermembrana","All'FMN del complesso I"],"ans":0,"why":"Poi passano al coenzima Q: si formano circa 1,5 ATP per NADH citosolico.","note":null,"fixed":false},{"id":"m2n-03","topic":"m2-navette","level":"a","page":"54","src":"Biochimica II","q":"Perché con la navetta malato-aspartato si ricava più ATP che con quella del glicerolo fosfato?","opts":["Gli elettroni arrivano al NAD⁺ mitocondriale ed entrano dal complesso I","Trasporta due NADH per ogni giro, uno come malato e uno come aspartato","Non consuma ATP, mentre la navetta del glicerolo fosfato sì","Produce GTP nella matrice oltre al NADH","Gli elettroni arrivano al FAD ed entrano dal complesso II"],"ans":0,"why":"NADH mitocondriale ≈ 2,5 ATP contro FADH₂ ≈ 1,5.","note":"La sbobina descrive in dettaglio solo la navetta del glicerolo fosfato.","fixed":false},{"id":"m2n-04","topic":"m2-navette","level":"l","page":"54","src":"Biochimica II","q":"Nella navetta del glicerolo fosfato, l'enzima citosolico usa NADH; quello mitocondriale usa FAD. Come si chiamano?","opts":["Glicerolo 3-fosfato deidrogenasi citosolica e mitocondriale","Glicerolo chinasi citosolica e glicerolo fosfatasi mitocondriale","Malato deidrogenasi citosolica e malato deidrogenasi mitocondriale","Trioso fosfato isomerasi citosolica e aldolasi mitocondriale","Gliceraldeide 3-P deidrogenasi citosolica e mitocondriale"],"ans":0,"why":"Sono due isoenzimi della glicerolo 3-fosfato deidrogenasi.","note":"Sbobina di Biochimica II, p. 54: il glicerolo 3-fosfato è chiamato «3-fosfoglicerolo (3-PG)». Non va confuso con il 3-fosfoglicerato.","fixed":false},{"id":"m2reg-01","topic":"m2-regolazione","level":"f","page":"57","src":"Biochimica II","q":"Qual è il principale punto di regolazione della glicolisi?","opts":["Fosfofruttochinasi 1","Aldolasi","Enolasi","Fosfoglicerato chinasi","Trioso fosfato isomerasi"],"ans":0,"why":"È il primo passaggio di non ritorno specifico della glicolisi.","note":null,"fixed":false},{"id":"m2reg-02","topic":"m2-regolazione","level":"f","page":"58","src":"Biochimica II","q":"Quali sono gli effettori allosterici positivi della PFK1?","opts":["AMP e fruttosio 2,6-bisfosfato","ATP e citrato","Acetil-CoA e NADH","Glucosio 6-fosfato e insulina","Fosfoenolpiruvato e alanina"],"ans":0,"why":"Negativi: ATP e citrato.","note":null,"fixed":false},{"id":"m2reg-03","topic":"m2-regolazione","level":"m","page":"59","src":"Biochimica II","q":"Perché l'AMP è un segnale così sensibile della carica energetica?","opts":["Con l'adenilato chinasi (2 ADP ⇌ ATP + AMP) un piccolo calo di ATP fa salire molto l'AMP in percentuale","È il più abbondante dei tre nucleotidi adenilici, quindi le sue variazioni sono le più grandi","Inibisce direttamente l'ATP sintasi, quindi segnala subito quando la sintesi di ATP rallenta","Viene prodotto dall'adenilato ciclasi in risposta al glucagone e all'adrenalina","Si forma solo quando l'ATP è esaurito del tutto, quindi indica uno stato di emergenza"],"ans":0,"why":"Con ATP 1 mM e AMP 0,02 mM, consumare 0,1 mM di ATP fa salire l'AMP a circa 0,07 mM (+300%).","note":null,"fixed":false},{"id":"m2reg-04","topic":"m2-regolazione","level":"m","page":"60","src":"Biochimica II","q":"Che cosa significa che il fruttosio 1,6-bisfosfato attiva la piruvato chinasi «a feed-forward»?","opts":["Il prodotto di un enzima a monte attiva un enzima a valle, preparando la via al flusso in arrivo","Il prodotto finale della via inibisce il primo enzima, così la via non accumula intermedi inutili","L'enzima è attivato dal suo stesso substrato, con cinetica cooperativa sigmoide","L'enzima viene fosforilato dalla PKA quando arriva il glucagone nel fegato","Un enzima a valle produce un attivatore per l'enzima che sta a monte"],"ans":0,"why":"Se la PFK1 è attiva, la piruvato chinasi viene accelerata per smaltire gli intermedi.","note":null,"fixed":false},{"id":"m2reg-05","topic":"m2-regolazione","level":"m","page":"61","src":"Biochimica II","q":"Che effetto ha la fosforilazione della piruvato chinasi epatica indotta dal glucagone?","opts":["La inattiva, così il PEP prodotto dalla gluconeogenesi non torna a piruvato","La attiva, perché il fegato a digiuno ha bisogno di produrre più ATP","Non cambia la sua attività, ma ne aumenta la degradazione","La sposta nel mitocondrio, dove lavora con la piruvato carbossilasi","La rende sensibile all'insulina, che poi la attiva dopo il pasto"],"ans":0,"why":"Evita il ciclo futile PEP → piruvato → OAA → PEP durante la gluconeogenesi.","note":"Sbobina di Biochimica II, p. 61: c'è scritto che la fosforilazione «rallenta la glicolisi e quindi riduce la produzione di glucosio». Al contrario, favorisce la produzione di glucosio (gluconeogenesi) perché evita il ciclo futile.","fixed":false},{"id":"m2reg-06","topic":"m2-regolazione","level":"a","page":"58","src":"Biochimica II","q":"Nella PFK1, che cosa cambia tra forma R e forma T nel sito attivo?","opts":["In R c'è Arg162 positiva che attira il F6P; in T arriva Glu161 negativo che lo respinge","In R c'è una cisteina che lega il F6P; in T una serina che lega l'ATP al suo posto","In T il sito attivo è occupato dall'ATP, in R dall'AMP che sposta l'ATP","Non cambia nulla nel sito attivo: tra R e T cambia solo la Vmax dell'enzima","In R c'è Glu161 che lega il Mg²⁺; in T arriva Arg162 che lega il citrato"],"ans":0,"why":"Il cambio di residuo spiega la diversa affinità per il fruttosio 6-fosfato.","note":null,"fixed":false},{"id":"m2reg-07","topic":"m2-regolazione","level":"a","page":"60","src":"Biochimica II","q":"Nel fegato, quale effettore della PFK1 è il più potente e perché?","opts":["Il fruttosio 2,6-bisfosfato, perché agisce a concentrazioni micromolari","L'ATP, perché è il più abbondante e lega sia il sito attivo sia quello allosterico","Il citrato, perché è il più stabile e arriva direttamente dal mitocondrio","L'AMP, perché è anche substrato dell'enzima e ne aumenta la Vmax","Il glucagone, perché lega direttamente l'enzima nel citosol"],"ans":0,"why":"Poi viene l'AMP; ATP e citrato agiscono a concentrazioni più alte.","note":null,"fixed":false},{"id":"m2reg-08","topic":"m2-regolazione","level":"a","page":"56","src":"Biochimica II","q":"Perché la glucochinasi viene riportata nel nucleo quando si accumula fruttosio 6-fosfato?","opts":["Se la glicolisi è ferma a valle è inutile continuare a fosforilare glucosio","Il fruttosio 6-fosfato è tossico e la glucochinasi lo produrrebbe in eccesso","Per favorire la gluconeogenesi a partire dal fruttosio della dieta","Il fruttosio 6-fosfato degrada l'enzima se resta nel citosol","Per lasciare il glucosio alla sintesi di glicogeno nel nucleo"],"ans":0,"why":"Il F6P attiva la proteina regolatrice, che sequestra la glucochinasi.","note":null,"fixed":false},{"id":"m2reg-09","topic":"m2-regolazione","level":"l","page":"58","src":"Biochimica II","q":"Quale residuo della PFK1 compare nel sito attivo nella forma R?","opts":["Arginina 162","Glutammato 161","Lisina 162","Istidina 161","Serina 161"],"ans":0,"why":"Arg162 (positiva) in R, Glu161 (negativo) in T.","note":null,"fixed":false},{"id":"m2reg-10","topic":"m2-regolazione","level":"l","page":"59","src":"Biochimica II","q":"L'enzima che interconverte ATP, ADP e AMP si chiama:","opts":["Adenilato chinasi (miochinasi)","Nucleotide difosfato chinasi","AMP deaminasi","Adenilato ciclasi","Creatina chinasi"],"ans":0,"why":"2 ADP ⇌ ATP + AMP. Da non confondere con l'adenilato ciclasi, che forma cAMP.","note":null,"fixed":false},{"id":"m2reg-11","topic":"m2-regolazione","level":"l","page":"60","src":"Biochimica II","q":"Quali sono gli effettori allosterici negativi della piruvato chinasi secondo la sbobina?","opts":["ATP e acetil-CoA","AMP e F1,6BP","Citrato e AMP","ADP e NADH","Alanina e glucagone"],"ans":0,"why":"Positivi: AMP e fruttosio 1,6-bisfosfato.","note":"Sbobina di Biochimica II, p. 60 e 62: a p. 60 l'acetil-CoA è un effettore negativo, a p. 62 c'è scritto che «l'ADP e l'acetil-CoA la attivano». La versione corretta è quella di p. 60: l'acetil-CoA inibisce.","fixed":false},{"id":"m2p-01","topic":"m2-pasteur","level":"f","page":"62","src":"Biochimica II","q":"Che cos'è l'effetto Pasteur?","opts":["Il calo del consumo di glucosio quando la cellula passa da anaerobiosi ad aerobiosi","L'aumento della glicolisi quando la cellula passa da anaerobiosi ad aerobiosi","La fermentazione alcolica dei lieviti in assenza di ossigeno","L'inibizione della respirazione mitocondriale da parte di molto glucosio","La glicolisi aerobia delle cellule tumorali anche in presenza di ossigeno"],"ans":0,"why":"In aerobiosi la fosforilazione ossidativa produce molto ATP e la glicolisi rallenta.","note":null,"fixed":false},{"id":"m2p-02","topic":"m2-pasteur","level":"m","page":"63","src":"Biochimica II","q":"Su quale enzima agisce soprattutto il citrato nell'effetto Pasteur?","opts":["Fosfofruttochinasi 1","Esochinasi","Piruvato chinasi","Piruvato deidrogenasi","Glucochinasi"],"ans":0,"why":"Il citrato esce dal mitocondrio quando l'ATP è abbondante e inibisce la PFK1.","note":"Sbobina di Biochimica II, p. 63: la PFK1 è definita «l'enzima che catalizza la prima reazione della glicolisi». È la terza reazione; è però il primo passaggio specifico e irreversibile della via.","fixed":false},{"id":"m2p-03","topic":"m2-pasteur","level":"m","page":"63","src":"Biochimica II","q":"Negli eritrociti, quale metabolita della glicolisi abbassa l'affinità dell'emoglobina per l'O₂?","opts":["2,3-bisfosfoglicerato","1,3-bisfosfoglicerato","Fosfoenolpiruvato","Lattato","3-fosfoglicerato"],"ans":0,"why":"Deriva dall'1,3-BPG tramite la bisfosfoglicerato mutasi (shunt di Rapoport-Luebering).","note":null,"fixed":false},{"id":"m2p-04","topic":"m2-pasteur","level":"a","page":"63–64","src":"Biochimica II","q":"In un deficit di piruvato chinasi negli eritrociti, la curva di dissociazione dell'emoglobina si sposta:","opts":["A destra, perché si accumulano intermedi a monte e aumenta il 2,3-BPG","A sinistra, perché manca il 2,3-BPG e l'emoglobina lega più saldamente l'ossigeno","Non si sposta, perché l'eritrocita compensa con l'esochinasi","A destra, perché aumenta il lattato prodotto dall'eritrocita","A sinistra, perché il pH intracellulare diventa più basico"],"ans":0,"why":"L'Hb cede più O₂, ma la cellula ha poco ATP: la pompa Na⁺/K⁺ funziona male, l'eritrocita si gonfia e viene eliminato (anemia emolitica).","note":null,"fixed":false},{"id":"m2p-05","topic":"m2-pasteur","level":"a","page":"63","src":"Biochimica II","q":"E in un deficit di esochinasi eritrocitaria?","opts":["A sinistra: c'è poco 2,3-BPG e l'Hb diventa più affine all'O₂","A destra: si accumula 2,3-BPG e l'Hb cede più ossigeno","Non cambia nulla, perché il 2,3-BPG dipende dalla piruvato chinasi","A destra, perché l'eritrocita produce più lattato e acidifica","A sinistra, perché si accumula glucosio libero nell'eritrocita"],"ans":0,"why":"Se la glicolisi non parte si forma poco 1,3-BPG e quindi poco 2,3-BPG.","note":null,"fixed":false},{"id":"m2p-06","topic":"m2-pasteur","level":"a","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Nell'intolleranza ereditaria al fruttosio, perché il fegato va in sofferenza?","opts":["Manca l'aldolasi B: il fruttosio 1-P si accumula, sequestra fosfato e l'ATP crolla","Manca la fruttochinasi: il fruttosio non viene fosforilato e passa nelle urine","Manca il GLUT5 intestinale: il fruttosio fermenta nel colon e dà diarrea","Il fruttosio inibisce la glucochinasi e blocca l'ingresso del glucosio","Manca la fruttosio 1,6-bisfosfatasi: si blocca la sintesi di glicogeno"],"ans":0,"why":"La fruttosuria essenziale (deficit di fruttochinasi) è invece benigna.","note":null,"fixed":false},{"id":"m2p-07","topic":"m2-pasteur","level":"a","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Perché un eccesso di fruttosio favorisce la steatosi epatica?","opts":["Nel fegato entra nella glicolisi a valle della PFK1, saltando il principale punto di controllo","Inibisce la β-ossidazione mitocondriale, quindi gli acidi grassi si accumulano come trigliceridi","Non viene fosforilato nel fegato e si accumula come tale negli epatociti","Stimola la secrezione di glucagone, che a sua volta attiva la lipogenesi","Viene trasformato in glicerolo dalla fruttosio reduttasi del fegato"],"ans":0,"why":"Il flusso non regolato verso piruvato e acetil-CoA alimenta la sintesi di acidi grassi.","note":"Sbobina di Biochimica II, pagine non numerate dopo p. 64: nel paragrafo sugli sciroppi c'è scritto «glucosio» dove si intende fruttosio («sciroppo di glucosio (miscela formata prevalentemente da fruttosio)», «consumo eccessivo di glucosio... tossico»). Il riferimento corretto è allo sciroppo ad alto contenuto di fruttosio.","fixed":false},{"id":"m2p-08","topic":"m2-pasteur","level":"m","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Come entra il galattosio nella glicolisi?","opts":["Galattosio → galattosio 1-P → (scambio con UDP-glucosio) glucosio 1-P → glucosio 6-P","Galattosio → galattosio 6-P → (isomerasi) fruttosio 6-P → glicolisi","Galattosio → galattosio 1-P → (aldolasi B) diidrossiacetone fosfato + gliceraldeide","Galattosio → glucosio libero per epimerizzazione diretta al C4 → esochinasi","Galattosio → UDP-galattosio → glicogeno → glucosio 1-P"],"ans":0,"why":"Galattochinasi, galattosio 1-P uridiltrasferasi, UDP-galattosio 4-epimerasi, fosfoglucomutasi.","note":null,"fixed":false},{"id":"m2p-09","topic":"m2-pasteur","level":"l","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Quale enzima manca nella forma più frequente di galattosemia?","opts":["Galattosio 1-fosfato uridiltrasferasi","Galattochinasi","UDP-galattosio 4-epimerasi (forma epatica)","Lattasi","Aldolasi B"],"ans":0,"why":"Il galattosio si accumula; nel cristallino viene ridotto a galattitolo e causa cataratta.","note":null,"fixed":false},{"id":"m2p-10","topic":"m2-pasteur","level":"l","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Nel fegato la triosio chinasi fosforila la gliceraldeide a:","opts":["Gliceraldeide 3-fosfato","Gliceraldeide 2-fosfato","Diidrossiacetone fosfato","Glicerolo 3-fosfato","Gliceraldeide 1-fosfato"],"ans":0,"why":"Poi la GA3P prosegue nella glicolisi.","note":"Sbobina di Biochimica II, pagine non numerate dopo p. 64: c'è scritto «gliceraldeide 2-fosfato». Il prodotto è la gliceraldeide 3-fosfato.","fixed":false},{"id":"m2p-11","topic":"m2-pasteur","level":"l","page":"63","src":"Biochimica II","q":"Come si chiama l'enzima eritrocitario che forma il 2,3-BPG?","opts":["Bisfosfoglicerato mutasi","Fosfoglicerato chinasi","Fosfoglicerato mutasi","2,3-BPG sintasi mitocondriale","Bisfosfoglicerato fosfatasi"],"ans":0,"why":"Sposta il fosfato dal C1 al C2 dell'1,3-BPG.","note":"Sbobina di Biochimica II, p. 63: c'è scritto «tramite una mutazione». Si intende tramite una mutasi.","fixed":false},{"id":"m2p-12","topic":"m2-pasteur","level":"l","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Il fruttosio 1-fosfato viene scisso da quale isoenzima dell'aldolasi?","opts":["Aldolasi B","Aldolasi A","Aldolasi C","Fruttosio 1,6-bisfosfatasi","Fruttochinasi"],"ans":0,"why":"L'aldolasi B (fegato) scinde F1P in DHAP e gliceraldeide.","note":null,"fixed":false},{"id":"m2d-01","topic":"m2-pdh","level":"f","page":"65","src":"Biochimica II","q":"Che cosa produce la piruvato deidrogenasi?","opts":["Acetil-CoA, CO₂ e NADH","Ossalacetato e ATP","Lattato e NAD⁺","Acetaldeide e CO₂","Acetil-CoA, CO₂ e FADH₂"],"ans":0,"why":"Piruvato + CoA + NAD⁺ → acetil-CoA + CO₂ + NADH.","note":null,"fixed":false},{"id":"m2d-02","topic":"m2-pdh","level":"f","page":"66","src":"Biochimica II","q":"Quanti e quali coenzimi usa il complesso della piruvato deidrogenasi?","opts":["Cinque: TPP, lipoato, CoA, FAD, NAD⁺","Tre: NAD⁺, FAD, CoA","Due: NAD⁺ e biotina","Quattro: TPP, biotina, NAD⁺, FAD","Cinque: TPP, biotina, CoA, FMN, NADP⁺"],"ans":0,"why":"Derivano da tiamina (B1), acido lipoico, pantotenato (B5), riboflavina (B2) e niacina (B3).","note":null,"fixed":false},{"id":"m2d-03","topic":"m2-pdh","level":"f","page":"65","src":"Biochimica II","q":"Dove si trova il complesso della piruvato deidrogenasi?","opts":["Nella matrice mitocondriale","Nel citosol","Nella membrana plasmatica","Nel reticolo endoplasmatico","Nello spazio intermembrana"],"ans":0,"why":"Il piruvato entra nel mitocondrio con un trasportatore specifico, insieme a un protone.","note":null,"fixed":false},{"id":"m2d-04","topic":"m2-pdh","level":"m","page":"71","src":"Biochimica II","q":"Come viene regolata covalentemente la PDH?","opts":["La PDH chinasi la fosforila e la inattiva; la PDH fosfatasi la defosforila e la attiva","La PDH chinasi la fosforila e la attiva; la PDH fosfatasi la defosforila e la inattiva","Non è regolata covalentemente: solo da NADH e acetil-CoA come effettori allosterici","La PKA la fosforila e la attiva quando arriva il glucagone nel fegato","La PDH viene acetilata dall'acetil-CoA in eccesso e così si inattiva"],"ans":0,"why":"La fosforilazione avviene sull'E1 e blocca tutto il complesso.","note":null,"fixed":false},{"id":"m2d-05","topic":"m2-pdh","level":"m","page":"70","src":"Biochimica II","q":"Quali prodotti inibiscono la PDH (inibizione da prodotto)?","opts":["Acetil-CoA e NADH","CO₂ e NADH","ATP e AMP","Piruvato e CoA","Citrato e ADP"],"ans":0,"why":"L'acetil-CoA inibisce E2, il NADH inibisce E3.","note":null,"fixed":false},{"id":"m2d-06","topic":"m2-pdh","level":"m","page":"66–67","src":"Biochimica II","q":"Quali sono i vantaggi di un complesso multienzimatico?","opts":["Il prodotto passa subito all'enzima successivo e gli intermedi reattivi non si disperdono","Usa meno coenzimi, perché più enzimi condividono lo stesso NAD⁺ legato al complesso","Non ha bisogno di regolazione, perché lavora sempre alla velocità massima","Funziona anche senza NAD⁺, perché gli elettroni restano sul lipoato","Consuma meno ATP per ogni molecola di substrato trasformata"],"ans":0,"why":"Si supera il limite della diffusione e si regola tutto bloccando E1.","note":null,"fixed":false},{"id":"m2d-07","topic":"m2-pdh","level":"a","page":"69","src":"Biochimica II","q":"Perché nell'uomo i grassi non possono diventare zuccheri?","opts":["La reazione della PDH è irreversibile: l'acetil-CoA non può tornare piruvato","Gli acidi grassi non producono acetil-CoA ma solo corpi chetonici","Nell'uomo manca la glucochinasi necessaria a fosforilare il glucosio","L'acetil-CoA inibisce la gluconeogenesi bloccando la piruvato carbossilasi","La β-ossidazione avviene nei perossisomi, lontano dagli enzimi della gluconeogenesi"],"ans":0,"why":"Gli zuccheri possono diventare grassi (via acetil-CoA), non il contrario. Fa eccezione il glicerolo dei trigliceridi.","note":null,"fixed":false},{"id":"m2d-08","topic":"m2-pdh","level":"a","page":"72","src":"Biochimica II","q":"Nel muscolo che si contrae, perché aumenta l'attività della PDH?","opts":["Il Ca²⁺ attiva la PDH fosfatasi, mentre ADP e piruvato inibiscono la chinasi","L'ATP prodotto dalla contrazione attiva allostericamente la PDH e ne aumenta la Vmax","Il NADH che si accumula nella contrazione attiva la PDH fosfatasi","L'insulina fosforila la PDH e ne aumenta l'attività","Il lattato prodotto dalla contrazione attiva la PDH chinasi"],"ans":0,"why":"Il calcio favorisce il legame della fosfatasi al complesso.","note":null,"fixed":false},{"id":"m2d-09","topic":"m2-pdh","level":"a","page":"73","src":"Biochimica II","q":"Un neonato con deficit di E1 della PDH presenterà soprattutto:","opts":["Acidosi lattica e problemi neurologici","Ipoglicemia isolata senza acidosi","Iperammoniemia e vomito","Anemia emolitica e ittero","Epatomegalia da accumulo di glicogeno"],"ans":0,"why":"Il piruvato non viene ossidato: il NADH si riossida solo con la fermentazione lattica; il cervello, che dipende dal glucosio, è il più colpito.","note":null,"fixed":false},{"id":"m2d-10","topic":"m2-pdh","level":"a","page":"73","src":"Biochimica II","q":"In ipossia, come agisce HIF sulla PDH?","opts":["Aumenta la PDH chinasi: la PDH viene fosforilata e inibita","Attiva la PDH fosfatasi: la PDH viene defosforilata e attivata","Aumenta la sintesi della subunità E1 della PDH","Non ha effetti sulla PDH, agisce solo sulla glicolisi","Sposta la PDH dal mitocondrio al citosol"],"ans":0,"why":"Il piruvato viene dirottato verso il lattato: è uno dei meccanismi dell'effetto Warburg.","note":null,"fixed":false},{"id":"m2d-11","topic":"m2-pdh","level":"l","page":"66","src":"Biochimica II","q":"Come si chiama l'enzima E2 della PDH?","opts":["Diidrolipoil transacetilasi","Diidrolipoil deidrogenasi","Piruvato decarbossilasi","Lipoamide sintasi","Diidrolipoil transsuccinilasi"],"ans":0,"why":"E1 piruvato deidrogenasi (decarbossilazione), E2 transacetilasi (trasferimento al CoA), E3 diidrolipoil deidrogenasi (riossida il lipoato con FAD → NAD⁺).","note":"Sbobina di Biochimica II, p. 68: lo scambio dell'acetile tra lipoato e CoA è attribuito all'«E3». Il trasferimento al CoA lo fa l'E2 (transacetilasi); l'E3 riossida il lipoato.","fixed":false},{"id":"m2d-12","topic":"m2-pdh","level":"l","page":"68","src":"Biochimica II","q":"Come si chiama l'intermedio legato alla TPP dopo la decarbossilazione del piruvato?","opts":["Idrossietil-TPP","Acetil-TPP","Carbossietil-TPP","Lattil-TPP","Acetaldeide libera"],"ans":0,"why":"Poi viene ossidato e trasferito all'acido lipoico come acetile (acetil-diidrolipoamide).","note":null,"fixed":false},{"id":"m2d-13","topic":"m2-pdh","level":"l","page":"67","src":"Biochimica II","q":"Il lipoato è legato covalentemente all'E2 tramite:","opts":["Un legame ammidico con una lisina (lipoamide)","Un ponte disolfuro con una cisteina dell'E2 (lipoil-S-S-Cys)","Un legame estere con una serina","Un legame glicosidico con un'asparagina","Un legame tioestere con il CoA"],"ans":0,"why":"Il lungo braccio lisina-lipoato oscilla tra E1 ed E3.","note":null,"fixed":false},{"id":"m2d-14","topic":"m2-pdh","level":"l","page":"67","src":"Biochimica II","q":"Il carbonio reattivo della tiamina pirofosfato si trova:","opts":["Nell'anello tiazolico, tra N e S","Nell'anello pirimidinico, accanto all'ammina","Nel pirofosfato, sull'ultimo fosfato","Nella catena laterale, tra i due anelli","Nell'anello tiazolico, sullo zolfo"],"ans":0,"why":"Il C2 del tiazolo si deprotona (carbanione/ilide) e attacca il carbonile del piruvato.","note":"Sbobina di Biochimica II, p. 67: c'è scritto «derivata dall'enzima B1». Si intende la vitamina B1 (tiamina).","fixed":false},{"id":"m3k-01","topic":"m3-krebs","level":"f","page":"74","src":"Biochimica II","q":"Dove avviene il ciclo di Krebs?","opts":["Nella matrice mitocondriale","Nel citosol","Nello spazio intermembrana","Nel reticolo endoplasmatico","Nella membrana mitocondriale esterna"],"ans":0,"why":"Tutti gli enzimi sono nella matrice tranne la succinato deidrogenasi, che è nella membrana interna.","note":null,"fixed":false},{"id":"m3k-02","topic":"m3-krebs","level":"f","page":"76","src":"Biochimica II","q":"Quale enzima unisce acetil-CoA e ossalacetato?","opts":["Citrato sintasi","Aconitasi","Isocitrato deidrogenasi","Piruvato carbossilasi","Malato deidrogenasi"],"ans":0,"why":"È una condensazione di Claisen che forma citrato e libera CoA.","note":null,"fixed":false},{"id":"m3k-03","topic":"m3-krebs","level":"f","page":"74","src":"Biochimica II","q":"Che cosa produce un giro del ciclo di Krebs per acetil-CoA?","opts":["3 NADH, 1 FADH₂, 1 GTP, 2 CO₂","2 NADH, 2 FADH₂, 1 ATP, 2 CO₂","4 NADH, 1 GTP, 1 CO₂","3 NADH, 1 FADH₂, 2 ATP","3 NADH, 2 FADH₂, 1 GTP, 1 CO₂"],"ans":0,"why":"NADH da isocitrato DH, α-chetoglutarato DH e malato DH; FADH₂ dalla succinato DH; GTP dalla succinil-CoA sintetasi.","note":null,"fixed":false},{"id":"m3k-04","topic":"m3-krebs","level":"f","page":"83","src":"Biochimica II","q":"Quale enzima del ciclo di Krebs è anche il complesso II della catena respiratoria?","opts":["Succinato deidrogenasi","Malato deidrogenasi","Fumarasi","Isocitrato deidrogenasi","Aconitasi"],"ans":0,"why":"È l'unico enzima del ciclo integrato nella membrana mitocondriale interna.","note":null,"fixed":false},{"id":"m3k-05","topic":"m3-krebs","level":"m","page":"79","src":"Biochimica II","q":"Perché la citrato sintasi lega prima l'ossalacetato e poi l'acetil-CoA (meccanismo sequenziale ordinato)?","opts":["L'ossalacetato è presente in quantità minime: l'enzima si assicura che ci sia prima di usare l'acetil-CoA","L'acetil-CoA è più grande e il sito attivo può accoglierlo solo dopo il cambio di forma indotto dall'ATP","L'ossalacetato è il prodotto della reazione e deve uscire prima che entri l'acetil-CoA","Così l'enzima consuma meno ATP per ogni molecola di citrato prodotta","L'acetil-CoA inibisce l'enzima se arriva per primo, quindi deve aspettare il secondo sito"],"ans":0,"why":"L'adattamento indotto evita anche l'idrolisi improduttiva del tioestere dell'acetil-CoA.","note":null,"fixed":false},{"id":"m3k-06","topic":"m3-krebs","level":"m","page":"84","src":"Biochimica II","q":"Quali sono le tre reazioni del ciclo con ΔG fortemente negativo, quindi regolate?","opts":["Citrato sintasi, isocitrato deidrogenasi, α-chetoglutarato deidrogenasi","Aconitasi, fumarasi, malato deidrogenasi","Succinil-CoA sintetasi, succinato deidrogenasi, fumarasi","Citrato sintasi, aconitasi, succinato deidrogenasi","Isocitrato deidrogenasi, succinil-CoA sintetasi, malato deidrogenasi"],"ans":0,"why":"Le altre sono vicine all'equilibrio.","note":null,"fixed":false},{"id":"m3k-07","topic":"m3-krebs","level":"m","page":"84–85","src":"Biochimica II","q":"Come viene regolato il ciclo di Krebs?","opts":["NADH e ATP lo rallentano, ADP e Ca²⁺ lo accelerano","Lo regola solo l'insulina, attivando la citrato sintasi","NADH e ATP lo accelerano, ADP e Ca²⁺ lo rallentano","Non è regolato: dipende solo dall'arrivo di acetil-CoA","Lo regola il glucagone tramite fosforilazione della PKA"],"ans":0,"why":"È il controllo «da parte dell'accettore»: se c'è ADP la cellula ha bisogno di ATP.","note":null,"fixed":false},{"id":"m3k-08","topic":"m3-krebs","level":"m","page":"87","src":"Biochimica II","q":"Qual è la reazione anaplerotica più importante?","opts":["Piruvato → ossalacetato (piruvato carbossilasi)","Citrato → isocitrato (aconitasi)","Malato → ossalacetato (malato deidrogenasi)","Acetil-CoA → citrato (citrato sintasi)","Glutammato → α-chetoglutarato (transaminasi)"],"ans":0,"why":"Riempie il ciclo di intermedi; è attivata dall'acetil-CoA.","note":null,"fixed":false},{"id":"m3k-09","topic":"m3-krebs","level":"a","page":"84","src":"Biochimica II","q":"Le due CO₂ che escono in un giro del ciclo provengono dai carboni dell'acetil-CoA appena entrato?","opts":["No: vengono dall'ossalacetato; i carboni dell'acetile escono nei giri successivi","Sì, entrambe vengono dai due carboni dell'acetile appena entrato, ossidati nello stesso giro","Una sì e una no: una viene dall'acetile, l'altra dall'ossalacetato","No: vengono dal CoA, che si stacca dall'acetile nella prima reazione","Sì, ma solo se il ciclo lavora alla massima velocità"],"ans":0,"why":"Per eliminare completamente i carboni di un acetile servono due giri.","note":"Sbobina di Biochimica II, p. 77: dopo la seconda decarbossilazione c'è scritto che «abbiamo così ossidato l'acetato». A p. 84 la stessa sbobina chiarisce che le CO₂ escono dai carboni dell'ossalacetato.","fixed":false},{"id":"m3k-10","topic":"m3-krebs","level":"a","page":"86","src":"Biochimica II","q":"Perché il beri-beri colpisce soprattutto sistema nervoso e cuore?","opts":["La TPP serve a PDH (cervello, che usa glucosio) e ad α-chetoglutarato DH (cuore, che usa il ciclo di Krebs)","La tiamina serve alla sintesi di acetilcolina nei neuroni e alla contrazione delle fibre del miocardio","La tiamina è un antiossidante e protegge soprattutto i neuroni e le fibre cardiache","Manca il NAD, che serve alla catena respiratoria dei tessuti a più alto consumo","La TPP serve alla glicogeno fosforilasi del cuore e alla glicolisi dei neuroni"],"ans":0,"why":"Senza TPP si bloccano le due decarbossilazioni ossidative.","note":null,"fixed":false},{"id":"m3k-11","topic":"m3-krebs","level":"a","page":"86","src":"Biochimica II","q":"Come agiscono arsenico e mercurio sul metabolismo energetico?","opts":["Legano i gruppi SH del lipoato, bloccando PDH e α-chetoglutarato DH","Inibiscono l'ATP sintasi legando la subunità c dell'F₀ e bloccando la rotazione","Bloccano il complesso IV legando il ferro dell'eme a3","Ossidano il NADH della matrice a NAD⁺ senza produrre ATP","Legano la TPP della PDH, impedendo la decarbossilazione"],"ans":0,"why":"I composti con ditioli possono liberare l'enzima legando l'arsenico.","note":null,"fixed":false},{"id":"m3k-12","topic":"m3-krebs","level":"a","page":"89","src":"Biochimica II","q":"Perché per ossidare completamente gli acidi grassi serve anche il glucosio?","opts":["L'acetil-CoA ha bisogno di ossalacetato, che si forma dal piruvato","Gli acidi grassi si ossidano solo nel citosol, dove serve la glicolisi","La β-ossidazione consuma glucosio per attivare gli acidi grassi","Servono i GLUT per far entrare gli acidi grassi nelle cellule","Il glucosio fornisce il CoA necessario alla β-ossidazione"],"ans":0,"why":"Si dice che i grassi «bruciano al fuoco dei carboidrati».","note":null,"fixed":false},{"id":"m3k-13","topic":"m3-krebs","level":"a","page":"85","src":"Biochimica II","q":"Pellagra: quale coenzima manca e perché in Veneto era endemica?","opts":["NAD (niacina, B3): si mangiava soprattutto mais, la cui niacina non è disponibile senza trattamento alcalino","FAD (riboflavina, B2): l'alimentazione era povera di latte e derivati, unica fonte della vitamina","TPP (tiamina, B1): si mangiava soprattutto riso brillato, privato della cuticola ricca di tiamina","CoA (acido pantotenico, B5): la carne era rara e i cereali non contengono pantotenato","NADP (niacina, B3): il mais conteneva troppo triptofano, che ne blocca l'assorbimento"],"ans":0,"why":"In America Latina la nixtamalizzazione (calce viva) rendeva disponibile la niacina. Sintomi: dermatite, diarrea, demenza.","note":null,"fixed":false},{"id":"m3k-14","topic":"m3-krebs","level":"l","page":"78, 82","src":"Biochimica II","q":"Come si chiama correttamente l'enzima che forma GTP dal succinil-CoA?","opts":["Succinil-CoA sintetasi","Succinil-CoA sintasi","Succinato chinasi","Succinato deidrogenasi","Succinil-CoA transferasi"],"ans":0,"why":"Si chiama sintetasi perché la reazione coinvolge un nucleotide trifosfato.","note":"Sbobina di Biochimica II, p. 78: l'enzima è chiamato «succinil-CoA sintasi (perché utilizziamo GDP)», contro la definizione data poco prima. A p. 82 è chiamato correttamente sintetasi.","fixed":false},{"id":"m3k-15","topic":"m3-krebs","level":"l","page":"80","src":"Biochimica II","q":"Qual è l'intermedio della reazione dell'aconitasi?","opts":["cis-Aconitato","trans-Aconitato","Citril-CoA","Ossalsuccinato","Ossalacetato"],"ans":0,"why":"Deidratazione e reidratazione: citrato → cis-aconitato → isocitrato.","note":null,"fixed":false},{"id":"m3k-16","topic":"m3-krebs","level":"l","page":"80","src":"Biochimica II","q":"Che tipo di centro ha l'aconitasi nel sito attivo?","opts":["Un centro 4Fe-4S","Un eme","Un atomo di zinco","Un centro rame","Un centro biotina-Mn²⁺"],"ans":0,"why":"Se perde un ferro diventa inattiva; l'isoforma citosolica è la IRP1, che regola ferritina e recettore della transferrina.","note":null,"fixed":false},{"id":"m3k-17","topic":"m3-krebs","level":"l","page":"82","src":"Biochimica II","q":"Come si chiama l'E2 del complesso dell'α-chetoglutarato deidrogenasi?","opts":["Diidrolipoil transsuccinilasi","Diidrolipoil transacetilasi","Succinil-CoA sintetasi","Diidrolipoil deidrogenasi","Diidrolipoil transferasi"],"ans":0,"why":"Trasferisce un gruppo succinile invece che acetile; l'E3 è uguale a quello della PDH.","note":null,"fixed":false},{"id":"m3k-18","topic":"m3-krebs","level":"l","page":"83","src":"Biochimica II","q":"Quale stereoisomero del malato forma la fumarasi?","opts":["L-malato","D-malato","Meso-malato","Racemo","Una miscela racemica"],"ans":0,"why":"L'idratazione del fumarato è stereospecifica.","note":null,"fixed":false},{"id":"m3c-01","topic":"m3-catena","level":"f","page":"90","src":"Biochimica II","q":"Qual è l'accettore finale degli elettroni nella catena respiratoria?","opts":["O₂","NAD⁺","Coenzima Q","Citocromo c","Ubichinone"],"ans":0,"why":"L'ossigeno viene ridotto ad acqua nel complesso IV.","note":null,"fixed":false},{"id":"m3c-02","topic":"m3-catena","level":"f","page":"91","src":"Biochimica II","q":"Dove si trova la catena respiratoria?","opts":["Nella membrana mitocondriale interna","Nella membrana mitocondriale esterna","Nella matrice mitocondriale","Nel citosol, vicino ai ribosomi","Nella membrana plasmatica"],"ans":0,"why":"Le creste aumentano la superficie disponibile.","note":null,"fixed":false},{"id":"m3c-03","topic":"m3-catena","level":"f","page":"95","src":"Biochimica II","q":"Quale complesso non pompa protoni?","opts":["Complesso II","Complesso I","Complesso III","Complesso IV","Nessuno, pompano tutti"],"ans":0,"why":"Il ΔE tra succinato e coenzima Q è troppo piccolo.","note":null,"fixed":false},{"id":"m3c-04","topic":"m3-catena","level":"m","page":"90","src":"Biochimica II","q":"Quanti ATP si ottengono circa dalla riossidazione di un NADH e di un FADH₂?","opts":["2,5 e 1,5","3 e 2","1,5 e 2,5","2 e 1","4 e 2"],"ans":0,"why":"Il FADH₂ entra al coenzima Q, saltando il complesso I.","note":null,"fixed":false},{"id":"m3c-05","topic":"m3-catena","level":"m","page":"92","src":"Biochimica II","q":"Come sono disposti i trasportatori della catena?","opts":["In ordine di potenziale di riduzione crescente, dal NADH (−0,32 V) all'O₂ (+0,81 V)","In ordine di potenziale di riduzione decrescente, dall'O₂ (+0,81 V) al NADH (−0,32 V)","In ordine di massa molecolare, dal complesso più grande a quello più piccolo","In ordine casuale: gli elettroni passano dove trovano un trasportatore libero","In ordine di potenziale crescente, dal FADH₂ (+0,81 V) all'O₂ (−0,32 V)"],"ans":0,"why":"Gli elettroni scendono «in discesa» verso l'accettore più affine.","note":null,"fixed":false},{"id":"m3c-06","topic":"m3-catena","level":"m","page":"95","src":"Biochimica II","q":"Da quali fonti il coenzima Q riceve elettroni?","opts":["Complesso I, complesso II, glicerolo 3-P deidrogenasi della navetta, β-ossidazione","Solo dal complesso I, che è l'unico a ossidare un coenzima ridotto prima del complesso III","Dal citocromo c e dal complesso IV, che glieli restituiscono","Dal complesso III e dal complesso IV, in ordine di potenziale","Dal NADH citosolico direttamente, senza passare dalle navette"],"ans":0,"why":"Convoglia gli elettroni di tutti gli enzimi flavinici.","note":null,"fixed":false},{"id":"m3c-07","topic":"m3-catena","level":"a","page":"104","src":"Biochimica II","q":"Se blocchi il complesso III con antimicina A, in che stato saranno i trasportatori?","opts":["Ridotti quelli a monte (NADH, complesso I, Q), ossidati quelli a valle (citocromo c, complesso IV)","Ossidati quelli a monte (NADH, complesso I, Q), ridotti quelli a valle (citocromo c, complesso IV)","Tutti ridotti, perché gli elettroni non possono più uscire verso l'ossigeno","Tutti ossidati, perché il NADH non riesce più a cedere elettroni al complesso I","Ridotto solo il complesso III, con tutti gli altri trasportatori ossidati"],"ans":0,"why":"È il metodo con cui è stata ricostruita la sequenza dei trasportatori.","note":null,"fixed":false},{"id":"m3c-08","topic":"m3-catena","level":"a","page":"96–97","src":"Biochimica II","q":"A che cosa serve il ciclo del Q nel complesso III?","opts":["A passare da un trasportatore a 2 elettroni (QH₂) a uno a 1 elettrone (citocromo c)","A produrre ATP direttamente nel complesso III, senza passare dall'ATP sintasi","A ridurre l'ossigeno ad acqua usando gli elettroni del coenzima Q","A trasportare il NADH citosolico dentro la matrice mitocondriale","A trasferire due elettroni insieme dal citocromo c al complesso IV"],"ans":0,"why":"Un elettrone va al citocromo c1 → c, l'altro torna attraverso i citocromi b a un Q.","note":null,"fixed":false},{"id":"m3c-09","topic":"m3-catena","level":"a","page":"99","src":"Biochimica II","q":"Quanta energia libera si libera nel trasferimento di 2 elettroni dal NADH all'O₂?","opts":["Circa −218 kJ/mol","Circa −30 kJ/mol","Circa −61 kJ/mol","Circa −1000 kJ/mol","Circa −120 kJ/mol"],"ans":0,"why":"ΔG°' = −nFΔE°' con ΔE°' = 0,81 − (−0,32) = 1,13 V.","note":null,"fixed":false},{"id":"m3c-10","topic":"m3-catena","level":"a","page":"104","src":"Biochimica II","q":"Il cianuro blocca il complesso IV. Cosa succede ai trasportatori?","opts":["Restano tutti ridotti","Restano tutti ossidati","Si riduce solo il citocromo c","Il coenzima Q si ossida e il NADH resta ridotto","Si ossidano quelli a monte e si riducono quelli a valle"],"ans":0,"why":"Gli elettroni non possono uscire verso l'ossigeno. Lo stesso fanno CO e sodio azide.","note":null,"fixed":false},{"id":"m3c-11","topic":"m3-catena","level":"l","page":"92","src":"Biochimica II","q":"Come si chiama il complesso I secondo la nomenclatura usata nella sbobina?","opts":["NADH-Q reduttasi","NADH ossidasi","Ubichinone deidrogenasi","Citocromo b reduttasi","Ubichinolo ossidasi"],"ans":0,"why":"Si scrive prima chi si ossida, poi chi si riduce, poi «reduttasi». Il complesso IV sarebbe correttamente citocromo c-ossigeno reduttasi.","note":null,"fixed":false},{"id":"m3c-12","topic":"m3-catena","level":"l","page":"93","src":"Biochimica II","q":"Quale gruppo prostetico flavinico contiene il complesso I?","opts":["FMN (flavin mononucleotide)","FAD (flavin adenin dinucleotide)","Biotina","Lipoato","Lipoammide"],"ans":0,"why":"L'FMN prende due elettroni dal NADH e li cede uno alla volta ai centri Fe-S.","note":null,"fixed":false},{"id":"m3c-13","topic":"m3-catena","level":"l","page":"96","src":"Biochimica II","q":"Come si chiama la proteina Fe-S del complesso III, con due cisteine e due istidine?","opts":["Proteina di Rieske","Adrenodossina","Ferredossina","Citocromo c1","Proteina di Mitchell"],"ans":0,"why":"A differenza delle Fe-S classiche, due ligandi del ferro sono istidine.","note":null,"fixed":false},{"id":"m3c-14","topic":"m3-catena","level":"l","page":"98","src":"Biochimica II","q":"Quali sono i centri metallici del complesso IV?","opts":["Eme a, eme a3, CuA e CuB","Eme b e eme c1","Solo l'eme a3","Centri Fe-S e FMN","Eme b, CuA e un centro Fe-S"],"ans":0,"why":"L'ossigeno viene ridotto nel centro binucleare eme a3–CuB.","note":null,"fixed":false},{"id":"m3c-15","topic":"m3-catena","level":"l","page":"97","src":"Biochimica II","q":"Che cosa coordina il ferro del citocromo c nella sesta posizione?","opts":["Lo zolfo di una metionina","Un'istidina distale","L'ossigeno","Una cisteina","Un'altra molecola di acqua"],"ans":0,"why":"Ferro coordinato da 4 N della porfirina, un'istidina e una metionina: tutte le posizioni sono occupate e non lega O₂.","note":null,"fixed":false},{"id":"m3c-16","topic":"m3-catena","level":"l","page":"94","src":"Biochimica II","q":"Il coenzima Q si trova:","opts":["Nella membrana mitocondriale interna","Nella membrana plasmatica","Nella matrice","Nello spazio intermembrana","Nella membrana mitocondriale esterna"],"ans":0,"why":"Ha una coda di 10 unità isopreniche che lo tiene nel doppio strato.","note":"Sbobina di Biochimica II, p. 94: c'è scritto che il coenzima Q è presente «nella membrana plasmatica». Si trova nella membrana mitocondriale interna.","fixed":false},{"id":"m3s-01","topic":"m3-atpsintasi","level":"f","page":"100","src":"Biochimica II","q":"Come si chiama la teoria che spiega la sintesi di ATP nel mitocondrio?","opts":["Teoria chemiosmotica di Mitchell","Teoria dell'adattamento indotto di Koshland","Teoria chiave-serratura di Fischer","Teoria dell'accoppiamento conformazionale di Boyer","Teoria dell'intermedio chimico di Michaelis"],"ans":0,"why":"Il gradiente protonico creato dalla catena alimenta l'ATP sintasi.","note":null,"fixed":false},{"id":"m3s-02","topic":"m3-atpsintasi","level":"f","page":"100","src":"Biochimica II","q":"Da quali parti è formata l'ATP sintasi?","opts":["F₀ nella membrana e F₁ verso la matrice","F₁ nella membrana e F₀ verso la matrice","F₀ nella membrana e F₁ verso lo spazio intermembrana","Solo F₁, immersa nella membrana interna","I complessi I e IV uniti alla subunità F₁"],"ans":0,"why":"F₀ è il canale e rotore per i protoni, F₁ catalizza la sintesi di ATP.","note":null,"fixed":false},{"id":"m3s-03","topic":"m3-atpsintasi","level":"m","page":"100","src":"Biochimica II","q":"Da quali due componenti è formata la forza motrice protonica?","opts":["Gradiente elettrico (potenziale di membrana) e gradiente chimico (ΔpH)","Gradiente di Na⁺ e gradiente di K⁺ tra matrice e spazio intermembrana","Concentrazione di ATP e concentrazione di ADP nella matrice","Differenza di temperatura e differenza di pressione tra i due lati","Gradiente di NADH e gradiente di ossigeno attraverso la membrana"],"ans":0,"why":"I protoni pompati fuori rendono il lato P positivo e più acido.","note":null,"fixed":false},{"id":"m3s-04","topic":"m3-atpsintasi","level":"m","page":"102","src":"Biochimica II","q":"Come funziona il meccanismo di «cambio di legame» delle subunità β?","opts":["Le tre β passano a turno per le conformazioni L (lega ADP + Pi), T (forma ATP) e O (rilascia ATP)","Ogni β sintetizza ATP da sola e lo rilascia quando la γ si ferma davanti a lei, in modo indipendente","Le tre β ruotano insieme all'anello c e catalizzano a turno durante la rotazione","Le α fanno la catalisi, mentre le β servono solo a legare il fosfato inorganico","Le tre β sono sempre nella stessa conformazione e lavorano tutte insieme"],"ans":0,"why":"La rotazione di γ cambia la conformazione delle β; il passaggio che costa più energia è il rilascio dell'ATP.","note":null,"fixed":false},{"id":"m3s-05","topic":"m3-atpsintasi","level":"m","page":"103–104","src":"Biochimica II","q":"Che cosa fa l'ATP/ADP traslocasi?","opts":["Scambia ATP della matrice con ADP del citosol, sfruttando il potenziale di membrana","Sintetizza ATP dall'ADP citosolico usando il gradiente di protoni della membrana interna","Trasporta il fosfato inorganico nella matrice insieme a un protone","Scambia ADP della matrice con ATP del citosol, consumando ATP","Trasporta il NADH citosolico dentro la matrice"],"ans":0,"why":"ATP⁴⁻ esce e ADP³⁻ entra: si sposta una carica negativa netta verso l'esterno.","note":null,"fixed":false},{"id":"m3s-06","topic":"m3-atpsintasi","level":"a","page":"105","src":"Biochimica II","q":"Che effetto ha il 2,4-dinitrofenolo?","opts":["Riporta protoni nella matrice scavalcando l'ATP sintasi: l'energia diventa calore","Blocca il complesso IV legando l'eme a3, come il cianuro, e ferma il consumo di O₂","Blocca l'ATP sintasi legando la subunità c del canale F₀","Aumenta la sintesi di ATP perché accelera il trasporto di elettroni","Inibisce l'ATP/ADP traslocasi, bloccando l'uscita dell'ATP"],"ans":0,"why":"È un disaccoppiante; usato in passato come dimagrante, con molti decessi.","note":null,"fixed":false},{"id":"m3s-07","topic":"m3-atpsintasi","level":"a","page":"105","src":"Biochimica II","q":"Con l'oligomicina, che succede al consumo di ossigeno?","opts":["Diminuisce: il gradiente non si scarica e il trasporto di elettroni rallenta","Aumenta: la catena lavora più in fretta per compensare la mancanza di ATP","Non cambia: trasporto di elettroni e sintesi di ATP sono indipendenti","Si azzera solo la glicolisi, mentre la catena respiratoria continua","Aumenta, perché i protoni rientrano liberamente nella matrice"],"ans":0,"why":"Trasporto di elettroni e sintesi di ATP sono accoppiati.","note":null,"fixed":false},{"id":"m3s-08","topic":"m3-atpsintasi","level":"a","page":"106","src":"Biochimica II","q":"A che cosa serve la termogenina (UCP1) nel tessuto adiposo bruno?","opts":["Lascia rientrare i protoni nella matrice producendo calore invece di ATP","Sintetizza ATP in più usando il gradiente dei protoni del tessuto bruno","Trasporta gli acidi grassi nella matrice al posto della carnitina","Pompa protoni fuori dalla matrice per aumentare il gradiente","Blocca il complesso IV per far accumulare calore nel mitocondrio"],"ans":0,"why":"È un disaccoppiante fisiologico, importante per la termoregolazione del neonato.","note":null,"fixed":false},{"id":"m3s-09","topic":"m3-atpsintasi","level":"a","page":"101–102","src":"Biochimica II","q":"Nell'anello c dell'F₀, perché l'aspartato si protona e si deprotona?","o
