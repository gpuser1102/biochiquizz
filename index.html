:"m1-atp","page":"15","src":"Biochimica II","q":"L'energia libera standard della scissione dell'ATP in ADP e fosfato è −30 kJ/mole. Al pH fisiologico questo valore:","opts":["diviene più negativo","diviene più positivo","resta invariato","dipende dalla concentrazione del magnesio","diventa uguale a zero"],"ans":0,"why":"Più alto è il pH, più l'idrolisi è favorita: a pH 7,4 il ΔG scende sotto −30 kJ/mol. Il magnesio stabilizza l'ATP, ma la domanda chiede l'effetto del pH.","note":null,"times":2,"pending":false,"level":"m"},{"id":"atp-legami","topic":"m1-atp","page":"14, 25","src":"Biochimica II","q":"Quale di questi legami non è presente nell'ATP?","opts":["N-glicosidico","Emiacetalico","Fosfodiestere","Fosfoestere","Fosfoanidridico"],"ans":2,"why":"Nell'ATP ci sono il legame N-glicosidico (adenina–ribosio), il fosfoestere (ribosio–fosfato α) e due fosfoanidridici. Il fosfodiestere lega i nucleotidi negli acidi nucleici.","note":"Sbobina di Biochimica II, p. 25: dice che il legame emiacetalico si trova «nel ribosio e nell'ATP». Nell'ATP il C1' del ribosio è legato all'adenina, quindi è un N-glicoside e non più un emiacetale. All'esame la risposta attesa resta fosfodiestere.","times":2,"pending":false,"level":"m"},{"id":"slp-def","topic":"m1-atp","page":"19, 44","src":"Biochimica II","q":"Che cos'è la fosforilazione dell'ATP a livello del substrato?","opts":["Il trasferimento del fosfato in gamma dell'ATP ad una molecola con formazione di un legame estere","La formazione dell'ATP dall'ADP e Pi mediante riossidazione del NADH","L'idrolisi dell'ATP","La formazione dell'ATP dall'ADP e Pi mediante energia rilasciata dalla scissione di un composto con un ΔG°' minore di −30 kJ/mole","La formazione dell'ATP dall'ADP e Pi grazie al gradiente protonico della membrana mitocondriale"],"ans":3,"why":"Un composto con potenziale di trasferimento più alto dell'ATP (1,3-BPG, PEP) cede il fosfato all'ADP. La B è la fosforilazione ossidativa, la A una normale reazione chinasica.","note":null,"times":2,"pending":false,"level":"m"},{"id":"ndpk","topic":"m1-atp","page":"17–18","src":"Biochimica II","q":"Quale di queste affermazioni è falsa riguardo alla nucleotide difosfato chinasi?","opts":["Trasferisce il fosfato in gamma da un trinucleotide ad un dinucleotide","Ha un'energia libera standard vicina allo zero","La sua azione favorisce i processi catabolici","La reazione dipende dal consumo degli NTP","Usa come substrati nucleotidi di e trifosfati"],"ans":2,"why":"Forma GTP, UTP e CTP per le biosintesi (proteine, zuccheri, lipidi): favorisce l'anabolismo. Ha ΔG°' ≈ 0 e va avanti perché gli NTP vengono consumati. «Trinucleotide/dinucleotide» sta per nucleoside trifosfato/difosfato.","note":null,"times":2,"pending":false,"level":"a"},{"id":"carica","topic":"m1-atp","page":"16–17","src":"Biochimica II","q":"In una cellula le concentrazioni di ATP ed ADP sono equivalenti e quella dell'AMP è trascurabile. In queste condizioni:","opts":["Prevarrà il catabolismo","Prevarrà l'anabolismo","I due processi sono equivalenti","Il ΔG°' di idrolisi aumenta","Si blocca la glicolisi"],"ans":0,"why":"Carica energetica = ([ATP] + ½[ADP]) / ([ATP] + [ADP] + [AMP]) = 1,5/2 = 0,75. Sotto il valore normale di 0,9 aumentano le vie che generano ATP.","note":null,"times":2,"pending":false,"level":"a"},{"id":"no-atp","topic":"m2-ingresso","page":"32–33","src":"Biochimica II","q":"Quale di questi processi non richiede ATP?","opts":["Fosforilazione del glucosio","Trasporto del glucosio dal sangue alle cellule","Pompa sodio potassio","Pompa del calcio","Sintesi del glicogeno"],"ans":1,"why":"I GLUT fanno diffusione facilitata secondo gradiente. Esochinasi, Na⁺/K⁺-ATPasi e Ca²⁺-ATPasi consumano ATP.","note":"Sbobina di Biochimica II, p. 32: l'SGLT1 (scritto «SGLUT1») è descritto prima come «trasportatore attivo che utilizza ATP» e poi come simporto senza ATP. È un trasporto attivo secondario: l'ATP lo consuma la pompa Na⁺/K⁺, non l'SGLT1.","times":2,"pending":false,"level":"f"},{"id":"legami-energia","topic":"m1-atp","page":"19–20","src":"Biochimica II","q":"Ordina per energia libera, dalla più positiva alla più negativa, la scissione di: fosfoguanidinico della creatina fosfato (A), fosfoestere (B), tioestere (C), fosfoanidridico (D).","opts":["A-B-C-D","B-D-C-A","C-D-B-A","B-C-A-D","D-B-A-C"],"ans":1,"why":"ΔG°' di idrolisi: fosfoestere (es. glucosio 6-P) ≈ −14 kJ/mol, fosfoanidridico dell'ATP ≈ −30, tioestere dell'acetil-CoA −31,4, fosfocreatina ≈ −43.","note":null,"times":1,"pending":false,"level":"l"},{"id":"pk-base","topic":"m1-coenzimi","page":"24","src":"Biochimica II","q":"La base B ha un pK pari a 9,0. A pH 9,0 in soluzione si avrà:","opts":["Uguale concentrazione di B e B⁻","Uguale concentrazione di B e B⁺","Prevalenza della forma B","Prevalenza della forma B⁺","Prevalenza della forma BH⁻"],"ans":1,"why":"A pH = pK le due forme sono in uguale concentrazione. La base B accetta un protone e diventa BH⁺ (B⁺).","note":null,"times":2,"pending":false,"level":"m"},{"id":"etanolo-nad","topic":"m1-coenzimi","page":"53","src":"Biochimica II","q":"L'etanolo, in presenza degli enzimi necessari, reagisce con due molecole di NAD⁺. Il prodotto finale è:","opts":["Etano","Acetaldeide","Acetato","Anidride carbonica","Acetil-CoA"],"ans":2,"why":"Etanolo → acetaldeide (alcol deidrogenasi, 1 NAD⁺) → acetato (aldeide deidrogenasi, 1 NAD⁺).","note":null,"times":2,"pending":false,"level":"m"},{"id":"chetoacido","topic":"m1-coenzimi","page":"23–24, 49","src":"Biochimica II","q":"La riduzione di un alfa-chetoacido produce:","opts":["un composto con un alcol primario e un gruppo aldeidico","un composto con alcol secondario e un gruppo carbossilico","un composto con un chetone ed un gruppo carbossilico","un composto con due gruppi carbossilici","un composto con un alcol terziario e un gruppo carbossilico"],"ans":1,"why":"Il chetone in α si riduce ad alcol secondario e il carbossile resta: piruvato → lattato.","note":null,"times":2,"pending":false,"level":"m"},{"id":"elettroni-glc","topic":"m1-coenzimi","page":"22","src":"Biochimica II","q":"Quanti elettroni vengono persi per la completa ossidazione della molecola di glucosio ad anidride carbonica ed acqua?","opts":["8","12","24","32","6"],"ans":2,"why":"Ogni carbonio del glucosio passa in media da 0 a +4: 6 × 4 = 24 elettroni, cioè le 12 coppie raccolte da 10 NADH e 2 FADH₂.","note":null,"times":1,"pending":false,"level":"a"},{"id":"ox-carbossile","topic":"m1-coenzimi","page":"22","src":"Biochimica II","q":"Quale di queste affermazioni è vera riguardo l'ossidazione di un gruppo carbossilico?","opts":["Non è possibile","Riguarda solo la forma deprotonata","Viene rilasciato come CO₂","È una reazione reversibile","Produce un gruppo aldeidico"],"ans":2,"why":"Il carbonio carbossilico è il più ossidato di una molecola organica: l'ultimo passaggio possibile è la sua eliminazione come CO₂, come nelle decarbossilazioni del ciclo di Krebs.","note":null,"times":1,"pending":false,"level":"m"},{"id":"elettroni-acoa","topic":"m1-coenzimi","page":"22","src":"Biochimica II","q":"L'acetil-CoA (CH₃COSCoA) viene ossidato nel ciclo di Krebs a 2 molecole di CO₂. Quanti elettroni vengono persi nell'ossidazione?","opts":["2","4","6","8","10"],"ans":3,"why":"I due carboni dell'acetile passano in totale da 0 a +8: 8 elettroni, raccolti da 3 NADH e 1 FADH₂ (4 coppie).","note":null,"times":1,"pending":false,"level":"a"},{"id":"c-secondario","topic":"m1-coenzimi","page":"23","src":"Biochimica II","q":"Per ossidare un carbonio secondario saturo a chetone quali passaggi sono necessari?","opts":["Ossidazione NAD dipendente con aggiunta di una molecola d'acqua","Idratazione seguita da un'ossidazione","Ossidazione, idratazione ed un ulteriore ossidazione","Non è possibile la trasformazione","Una sola ossidazione NAD-dipendente"],"ans":2,"why":"Ossidazione FAD-dipendente a doppio legame (succinato → fumarato), idratazione ad alcol secondario (→ malato), ossidazione NAD-dipendente a chetone (→ ossalacetato).","note":null,"times":1,"pending":false,"level":"a"},{"id":"no-acqua","topic":"m1-coenzimi","page":"25","src":"Biochimica II","q":"Quale tra questi legami non richiede la perdita di una molecola d'acqua per la sua formazione?","opts":["Estere","Fosfoanidridico","Emiacetalico","Glicosidico","Peptidico"],"ans":2,"why":"L'emiacetale si forma per addizione dell'OH al carbonile (C5–OH sul C1 del glucosio). Estere, fosfoanidride e glicoside sono condensazioni.","note":null,"times":1,"pending":false,"level":"m"},{"id":"glc-fru","topic":"m1-enzimologia","page":"23, 40","src":"Biochimica II","q":"La trasformazione da glucosio a fruttosio è catalizzata da:","opts":["Idrolasi","Ossidoreduttasi","Chinasi","Isomerasi","Mutasi"],"ans":3,"why":"Glucosio (aldoso) e fruttosio (chetoso) sono isomeri: la conversione non cambia lo stato di ossidazione (es. fosfoesoso isomerasi, G6P → F6P).","note":null,"times":2,"pending":false,"level":"f"},{"id":"idrolasi","topic":"m1-enzimologia","page":"31","src":"Biochimica II","q":"Quali di questi enzimi appartiene alla classe delle idrolasi?","opts":["Proteasi","Amilasi","Lipasi","Proteasi, amilasi e lipasi","Solo proteasi e lipasi"],"ans":3,"why":"Proteasi, amilasi e lipasi scindono legami usando l'acqua: sono tutte idrolasi.","note":null,"times":1,"pending":false,"level":"f"},{"id":"es-saturante","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"Se in una reazione enzimatica tutto l'enzima è nella forma ES vuol dire che:","opts":["Il substrato è uguale alla KM","La concentrazione dell'enzima è uguale a quella del substrato","Si è raggiunta metà della Vmax","Il substrato è saturante","L'enzima è inibito in modo competitivo"],"ans":3,"why":"Con tutto l'enzima legato come ES si lavora a Vmax: il substrato è saturante.","note":null,"times":1,"pending":false,"level":"f"},{"id":"primaria","topic":"m1-enzimologia","page":"25","src":"Biochimica I","q":"In quale livello di struttura di una proteina non intervengono legami deboli?","opts":["Primaria","Secondaria","Terziaria","Quaternaria","Nessuna: intervengono in tutti i livelli"],"ans":0,"why":"La primaria è la sequenza unita da legami peptidici covalenti. Secondaria, terziaria e quaternaria dipendono da legami deboli (idrogeno, ionici, idrofobici).","note":null,"times":1,"pending":false,"level":"f"},{"id":"piu-enzima","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"In una reazione enzimatica un ulteriore aumento dell'enzima provoca:","opts":["Aumento della KM","Aumento della Vmax","Diminuzione della KM","Aumento della kcat","Diminuzione della Vmax"],"ans":1,"why":"Vmax = k₂[E]: cresce con l'enzima. KM e kcat sono costanti.","note":null,"times":1,"pending":false,"level":"f"},{"id":"km-unita","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"Le dimensioni della KM sono:","opts":["s⁻¹","M","s M⁻¹","M⁻¹","M s⁻¹"],"ans":1,"why":"La KM è la concentrazione di substrato a cui v = ½ Vmax: si misura in M.","note":null,"times":1,"pending":false,"level":"m"},{"id":"k05-neg","topic":"m1-enzimologia","page":"28","src":"Biochimica II","q":"La K0,5 (KM apparente) di un enzima allosterico, in presenza di un effettore allosterico negativo:","opts":["Non subisce variazioni","Diminuisce","Aumenta","Dipende dalla concentrazione del substrato","Si annulla"],"ans":2,"why":"L'effettore negativo sposta l'equilibrio verso T: la sigmoide va a destra e la K0,5 aumenta.","note":null,"times":2,"pending":false,"level":"m"},{"id":"t-r","topic":"m1-enzimologia","page":"28","src":"Biochimica II","q":"In un enzima allosterico la transizione dalla forma T alla forma R è inibita da:","opts":["Effettore omotropico negativo","Effettore eterotropico negativo","Effettore eterotropico positivo","Gli effettori allosterici non hanno influenza","Substrato in concentrazione saturante"],"ans":1,"why":"La inibisce un effettore negativo diverso dal substrato (eterotropico). L'effettore omotropico è il substrato stesso e di solito è positivo.","note":null,"times":1,"pending":false,"level":"m"},{"id":"s-km","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"Quando la concentrazione di substrato è uguale alla KM:","opts":["La velocità è uguale alla velocità massima","Tutto l'enzima è legato al substrato","La velocità è metà della velocità massima","Diminuisce la formazione del prodotto","La velocità è un quarto della velocità massima"],"ans":2,"why":"È la definizione di KM: la concentrazione di substrato a cui v = ½ Vmax.","note":null,"times":1,"pending":false,"level":"f"},{"id":"serina","topic":"m1-enzimologia","page":"29","src":"Biochimica II","q":"Quale tra questi residui aminoacidici si può trovare nel sito di fosforilazione di una proteina substrato di una protein chinasi?","opts":["Fenilalanina","Serina","Aspartato","Lisina","Glicina"],"ans":1,"why":"Le protein chinasi fosforilano l'OH di serina e treonina (e tirosina).","note":null,"times":1,"pending":false,"level":"f"},{"id":"lento","topic":"m1-enzimologia","page":"30","src":"Biochimica II","q":"Tra i meccanismi di regolazione, quale tra questi rientra in un meccanismo lento?","opts":["Controllo allosterico","Espressione dell'enzima","Fosforilazione dell'enzima","Nessuno di questi","Inibizione da prodotto"],"ans":1,"why":"Allosteria e fosforilazione sono rapide. Cambiare la quantità di enzima (sintesi o degradazione) richiede ore.","note":null,"times":1,"pending":false,"level":"f"},{"id":"acqua-sub","topic":"m1-enzimologia","page":"146","src":"Biochimica II","q":"Quali tra questi enzimi ha l'acqua come substrato?","opts":["Isomerasi","Chinasi","Ossidoreduttasi (deidrogenasi)","Fosfatasi","Ligasi"],"ans":3,"why":"La fosfatasi idrolizza l'estere fosforico (es. glucosio 6-fosfatasi). Le chinasi usano ATP, le deidrogenasi NAD/FAD.","note":null,"times":1,"pending":false,"level":"m"},{"id":"mutasi","topic":"m1-enzimologia","page":"45","src":"Biochimica II","q":"Enzimi che trasferiscono gruppi sostituenti in posizioni diverse della stessa molecola si chiamano:","opts":["Isomerasi","Fosforilasi","Chinasi","Mutasi","Epimerasi"],"ans":3,"why":"Le mutasi spostano un gruppo nella stessa molecola: 3-fosfoglicerato → 2-fosfoglicerato.","note":null,"times":1,"pending":false,"level":"f"},{"id":"glut-fegato","topic":"m2-ingresso","page":"32–33","src":"Biochimica II","q":"Quali sono i trasportatori di glucosio nell'epatocita?","opts":["GLUT1","GLUT2","GLUT3","GLUT4","SGLT1"],"ans":1,"why":"GLUT2: fegato, pancreas e membrana basolaterale dell'enterocita. Kt 17 mM, alta capacità: lavora dopo i pasti.","note":null,"times":1,"pending":false,"level":"f"},{"id":"glut4","topic":"m2-ingresso","page":"33, 35","src":"Biochimica II","q":"In quali tra queste cellule l'insulina permette il trasferimento sulla superficie dei trasportatori GLUT4?","opts":["Neuroni","Globuli rossi","Epatociti","Adipociti","Enterociti"],"ans":3,"why":"GLUT4: muscolo scheletrico, cuore e tessuto adiposo.","note":null,"times":1,"pending":false,"level":"f"},{"id":"glut-entero","topic":"m2-ingresso","page":"32","src":"Biochimica II","q":"Quale trasportatore del glucosio si trova sulla membrana basolaterale degli enterociti?","opts":["GLUT1","GLUT2","GLUT3","GLUT4","SGLT1"],"ans":1,"why":"Dal lume il glucosio entra con l'SGLT1, verso il sangue esce con il GLUT2 basolaterale.","note":null,"times":1,"pending":false,"level":"f"},{"id":"glut-bidir","topic":"m2-ingresso","page":"33","src":"Biochimica II","q":"I trasportatori GLUT sono:","opts":["unidirezionali","bidirezionali","possono assumere una sola conformazione","sono tutti sotto controllo ormonale","accoppiati al gradiente del sodio"],"ans":1,"why":"Diffusione facilitata: il verso dipende solo dal gradiente (il fegato a digiuno libera glucosio con il GLUT2). Hanno due conformazioni, T1 e T2, e solo il GLUT4 è sotto controllo ormonale.","note":null,"times":1,"pending":false,"level":"m"},{"id":"glut-tumore","topic":"m2-ingresso","page":"64 e seguenti (pagine non numerate, effetto Warburg)","src":"Biochimica II","q":"In una cellula tumorale aumenta l'espressione di GLUT. Si tratterà di:","opts":["GLUT1","GLUT2","GLUT3","GLUT4","GLUT5"],"ans":0,"why":"Nelle cellule tumorali il fattore HIF è attivo anche con l'ossigeno e fa trascrivere enzimi glicolitici, LDH e trasportatori: soprattutto il GLUT1, ad alta affinità, che lavora già a glicemia basale (effetto Warburg).","note":"La sbobina cita sia GLUT1 sia GLUT3 tra i geni attivati da HIF: la risposta attesa è GLUT1. Se a lezione è stato detto diversamente, fallo presente segnalandolo.","times":1,"pending":false,"level":"a"},{"id":"gr-insulina","topic":"m2-ingresso","page":"33","src":"Biochimica II","q":"Quale di queste cellule non ha il recettore per l'insulina?","opts":["Epatocita","Miocita","Adipocita","Globulo rosso","Fibroblasto"],"ans":3,"why":"Il globulo rosso prende il glucosio con il GLUT1, indipendente dall'insulina. Esistono pochi recettori anche sugli eritrociti, ma la risposta attesa è questa.","note":null,"times":1,"pending":false,"level":"m"},{"id":"insulina-sec","topic":"m2-ingresso","page":"34","src":"Biochimica II","q":"Quali di questi eventi non è coinvolto nella secrezione dell'insulina?","opts":["Fosforilazione del glucosio per opera della glucochinasi","Fosforilazione ossidativa","Ingresso di ioni potassio","Ingresso del calcio","Chiusura dei canali K⁺ ATP-dipendenti"],"ans":2,"why":"L'ATP chiude i canali del K⁺: il potassio smette di uscire, la membrana si depolarizza, entra Ca²⁺ e partono le vescicole di insulina.","note":null,"times":1,"pending":false,"level":"m"},{"id":"glut1-neonati","topic":"m2-ingresso","page":"33","src":"Biochimica II","q":"Quali di questi eventi è più probabile che avvengano in neonati che presentano mutazioni del gene che codifica per GLUT1? (E come intervenire?)","opts":["Ipoglicemia","Problemi neurologici","Insufficienza renale","Insufficienza cardiaca","Diabete neonatale"],"ans":1,"why":"Il GLUT1 porta il glucosio oltre la barriera ematoencefalica: il deficit dà convulsioni e ritardo dello sviluppo con glicemia normale. Si interviene con la dieta chetogenica, perché i corpi chetonici entrano nel cervello con altri trasportatori.","note":"Il nome della sindrome (deficit di GLUT1) e la dieta chetogenica non sono nelle sbobine.","times":1,"pending":false,"level":"a"},{"id":"glut-placenta","topic":"m2-ingresso","page":null,"src":"Biochimica II","q":"Quale trasportatore del glucosio vi aspettate di trovare nelle cellule della placenta?","opts":["GLUT1","GLUT2","GLUT3","GLUT4","GLUT5"],"ans":0,"why":"Nella placenta il trasportatore principale è il GLUT1: come nella barriera ematoencefalica, deve far passare glucosio già a glicemia basale.","note":"Non è nelle sbobine (Lehninger).","times":1,"pending":false,"level":"m"},{"id":"peptide-c","topic":"m2-ingresso","page":"36","src":"Biochimica II","q":"Un paziente con iperglicemia presenta nel sangue valori normali del peptide C originato dal taglio della proinsulina. Questo dato indica che:","opts":["L'insulina non viene prodotta dalle cellule del pancreas","L'insulina non trasporta i GLUT4 sulle membrane delle cellule muscolari","Il trasporto del glucosio nel fegato è rallentato","La glucochinasi del pancreas è c… (fine illeggibile nella foto)","Le cellule β producono troppa insulina"],"ans":1,"why":"Peptide C normale = l'insulina viene prodotta. L'iperglicemia dipende dall'insulino-resistenza: i GLUT4 non vengono esposti sulla membrana.","note":null,"times":1,"pending":false,"level":"m"},{"id":"glc-atp","topic":"m2-fosforilazione","page":"37, 40","src":"Biochimica II","q":"Nella reazione: Glucosio + ATP → Glucosio 6P + ADP","opts":["Il fosfato in alfa dell'ATP è trasferito al glucosio","La scissione dell'ATP spinge la reazione verso destra","Si forma un legame anidridico","Il ΔG°' è ampiamente positivo","Il fosfato in beta dell'ATP è trasferito al glucosio"],"ans":1,"why":"Viene trasferito il fosfato γ e si forma un fosfoestere. La reazione è accoppiata all'idrolisi dell'ATP, che rende il ΔG negativo.","note":null,"times":2,"pending":false,"level":"m"},{"id":"glucochinasi","topic":"m2-fosforilazione","page":"37","src":"Biochimica II","q":"Quale delle seguenti affermazioni è vera per la glucochinasi?","opts":["È un enzima ubiquitario","Trasforma il glucosio in glucosio 1-P","Ha una KM superiore a quella dell'esochinasi","Forma un legame fosfoanidridico tra il glucosio ed il fosfato","È inibita dal glucosio 6-fosfato"],"ans":2,"why":"La glucochinasi (esochinasi IV) è solo in fegato e pancreas, ha una KM circa 100 volte più alta dell'esochinasi e forma glucosio 6-P con un fosfoestere.","note":null,"times":1,"pending":false,"level":"m"},{"id":"g6p-falsa","topic":"m2-fosforilazione","page":"38, 65","src":"Biochimica II","q":"Quale tra queste affermazioni non è vera per il glucosio 6P?","opts":["È il precursore del ribosio","Può essere immagazzinato sotto forma di glicogeno","Passa liberamente nel mitocondrio","Nell'epatocita può essere convertito in glucosio","Può entrare nella glicolisi"],"ans":2,"why":"La membrana mitocondriale interna è impermeabile: il G6P resta nel citosol. Dà ribosio (pentoso fosfati), glicogeno e, nel fegato, glucosio libero (glucosio 6-fosfatasi).","note":null,"times":1,"pending":false,"level":"m"},{"id":"bilancio-g6p","topic":"m2-glicolisi","page":"47","src":"Biochimica II","q":"Il bilancio della glicolisi a partire dal glucosio-6P dà:","opts":["La riduzione di una molecola di NAD⁺","La produzione di anidride carbonica","Un aumento del pH","La formazione di 3 molecole di ATP","La formazione di 2 molecole di ATP"],"ans":3,"why":"Partendo dal G6P non si spende l'ATP dell'esochinasi: 4 prodotti − 1 (PFK1) = 3 ATP. Si riducono 2 NAD⁺, non si forma CO₂ e il pH scende.","note":null,"times":1,"pending":false,"level":"a"},{"id":"glut5","topic":"m2-glicolisi","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Le cellule testicolari posseggono trasportatori GLUT5. Quanti ATP si formano nella glicolisi?","opts":["1","2","3","4","5"],"ans":1,"why":"Il GLUT5 trasporta fruttosio. Nel muscolo il fruttosio diventa fruttosio 6-P con l'esochinasi; nel fegato fruttosio 1-P con la fruttochinasi, poi DHAP e gliceraldeide. In entrambi i casi il bilancio è di 2 ATP netti per esoso (4 prodotti, 2 spesi).","note":"Sbobina di Biochimica II, pagine non numerate dopo p. 64: la triosio chinasi fosforila la gliceraldeide a «gliceraldeide 2-fosfato». Il prodotto è la gliceraldeide 3-fosfato, come mostra anche la figura accanto.","times":1,"pending":false,"level":"a"},{"id":"gapdh-legame","topic":"m2-glicolisi","page":"43","src":"Biochimica II","q":"Durante la catalisi della gliceraldeide 3P deidrogenasi quale legame non si forma?","opts":["Fosfoanidridico","Tioemiacetale","Fosfoestere","Tioestere","Legame carbonio-idrogeno con il NAD⁺ (idruro)"],"ans":2,"why":"Si formano il tioemiacetale (Cys–aldeide), il tioestere dopo l'ossidazione e il fosfoanidridico misto dell'1,3-BPG. Il fosfoestere in C3 c'era già nella GA3P.","note":"Sbobina di Biochimica II, p. 43: il meccanismo dice che va al NAD⁺ «l'H⁺ sotto forma di idruro» e che «la riduzione» trasforma l'aldeide. Va al NAD⁺ un idruro (H⁻), l'aldeide si ossida e si forma il tioestere con la cisteina.","times":1,"pending":false,"level":"l"},{"id":"gapdh-cys","topic":"m2-glicolisi","page":"43","src":"Biochimica II","q":"Quale residuo aminoacidico è coinvolto nella catalisi della gliceraldeide 3-fosfato deidrogenasi?","opts":["Serina","Cisteina","Lisina","Metionina","Istidina"],"ans":1,"why":"Il gruppo SH della cisteina attacca l'aldeide; per questo lo iodoacetato, che lo alchila, blocca la glicolisi.","note":null,"times":1,"pending":false,"level":"m"},{"id":"gapdh-nadh","topic":"m2-glicolisi","page":"43","src":"Biochimica II","q":"Nella reazione GA3P + Pi + NAD⁺ ⇌ 1,3-BPG + NADH + H⁺, un aumento del NADH produce:","opts":["Una diminuzione del NAD⁺","Un aumento della GA3P","Una diminuzione del pH","Nessun cambiamento","Un aumento dell'1,3-BPG"],"ans":1,"why":"Più NADH sposta l'equilibrio a sinistra (Le Chatelier): si riforma GA3P e aumenta il NAD⁺.","note":null,"times":1,"pending":false,"level":"a"},{"id":"slp-reazione","topic":"m2-glicolisi","page":"44","src":"Biochimica II","q":"Quale delle seguenti reazioni è una fosforilazione a livello del substrato?","opts":["Conversione della gliceraldeide in 1,3 bisfosfoglicerato","Conversione del 1,3 bisfosfoglicerato in 3-fosfoglicerato","Formazione del 2-fosfoglicerato","Formazione del fosfoenolpiruvato","Conversione del fruttosio 6-P in fruttosio 1,6-bisfosfato"],"ans":1,"why":"La fosfoglicerato chinasi: l'1,3-BPG cede il fosfato all'ADP. L'altra della glicolisi è la piruvato chinasi.","note":null,"times":1,"pending":false,"level":"f"},{"id":"dg-negativo","topic":"m2-glicolisi","page":"47","src":"Biochimica II","q":"Quale delle seguenti reazioni della glicolisi procede con un ΔG negativo?","opts":["Conversione del glucosio 6P in fruttosio 6P","Reazione della gliceraldeide 3 fosfato deidrogenasi","Reazione dell'enolasi","Reazione della piruvato chinasi","Reazione della fosfoglicerato mutasi"],"ans":3,"why":"Le tre reazioni con ΔG fortemente negativo sono esochinasi/glucochinasi, PFK1 e piruvato chinasi. Le altre sono vicine all'equilibrio.","note":null,"times":2,"pending":false,"level":"m"},{"id":"bpg-falsa","topic":"m2-glicolisi","page":"43–44","src":"Biochimica II","q":"Quale di queste affermazioni è falsa per l'1,3 bisfosfoglicerato?","opts":["Contiene un legame fosfoanidridico","Contiene un legame fosfoesterico","È meno ossidato del 3-fosfoglicerato","Ha un potenziale di trasferimento maggiore dell'ATP","Si forma nella reazione della GAPDH"],"ans":2,"why":"1,3-BPG e 3-fosfoglicerato hanno lo stesso stato di ossidazione (C1 a livello di acido): la fosfoglicerato chinasi sposta solo il fosfato.","note":null,"times":1,"pending":false,"level":"a"},{"id":"non-glicolisi","topic":"m2-glicolisi","page":"39","src":"Biochimica II","q":"Quali tra questi composti non partecipa alla glicolisi?","opts":["Esteri fosforici","Esosi","Acidi dicarbossilici","Fosfoanidridi","Triosi fosfati"],"ans":2,"why":"Nella glicolisi ci sono esosi, esteri fosforici e fosfoanidridi (ATP, 1,3-BPG). Gli acidi dicarbossilici (malato, ossalacetato, succinato) sono del ciclo di Krebs.","note":null,"times":1,"pending":false,"level":"m"},{"id":"doppio-legame","topic":"m2-glicolisi","page":"45","src":"Biochimica II","q":"Quale dei seguenti composti della glicolisi ha un doppio legame?","opts":["2-fosfoglicerato","Fosfoenolpiruvato","Fruttosio 1,6-bisfosfato","Piruvato","Glucosio 6-fosfato"],"ans":1,"why":"Il PEP ha un doppio legame C=C (forma enolica). Carbossili e chetoni hanno C=O, ma la domanda intende il doppio legame tra carboni.","note":null,"times":1,"pending":false,"level":"m"},{"id":"ga3p-fbp","topic":"m2-glicolisi","page":"41","src":"Biochimica II","q":"Una soluzione contiene gliceraldeide 3-P. Quali enzimi bisogna aggiungere per formare fruttosio 1,6 bisfosfato?","opts":["Gliceraldeide 3-P deidrogenasi + aldolasi","Gliceraldeide 3-P deidrogenasi + aldolasi + triosofosfato isomerasi","Triosofosfato isomerasi + diidrossiacetone 3-P deidrogenasi","Aldolasi + triosofosfato isomerasi","Solo aldolasi"],"ans":3,"why":"La trioso fosfato isomerasi forma DHAP da una parte della GA3P, poi l'aldolasi (reversibile) condensa DHAP + GA3P in FBP.","note":null,"times":1,"pending":false,"level":"a"},{"id":"fbp-f6p","topic":"m2-glicolisi","page":"41, 146","src":"Biochimica II","q":"Una soluzione contiene gliceraldeide 3-P, aldolasi e triosofosfato isomerasi, quindi si forma fruttosio 1,6-bisfosfato. Quale ulteriore enzima della via glicolitica, aggiunto, permetterà la formazione del fruttosio 6-P?","opts":["Nessuno","Bastano quelli presenti","Fosfofruttochinasi 1","Fosfoesoso isomerasi","Esochinasi"],"ans":0,"why":"Per FBP → F6P serve la fruttosio 1,6-bisfosfatasi, che è della gluconeogenesi. La PFK1 è irreversibile e la fosfoesoso isomerasi agisce su F6P/G6P.","note":"Nel foglio la domanda dice «alla soluzione precedente»: qui è collegata a quella sulla gliceraldeide 3-P. Se a lezione la soluzione era un'altra, fallo presente segnalandolo.","times":1,"pending":false,"level":"a"},{"id":"ferm-irrev","topic":"m2-fermentazioni","page":"53","src":"Biochimica II","q":"La fermentazione etanolica non è un processo reversibile. Perché?","opts":["Perché avviene in due tappe","Non ci sono nei microrganismi gli enzimi per le reazioni inverse","La prima tappa della fermentazione alcolica è una decarbossilazione","L'acetaldeide si ossida velocemente in acetato","L'etanolo viene subito eliminato dalla cellula"],"ans":2,"why":"Piruvato → acetaldeide + CO₂: la decarbossilazione è irreversibile. La riduzione ad etanolo (alcol deidrogenasi) invece è reversibile.","note":null,"times":1,"pending":false,"level":"m"},{"id":"etanolo-vera","topic":"m2-fermentazioni","page":"53","src":"Biochimica II","q":"Quale di queste affermazioni è vera per l'etanolo?","opts":["La conversione in acetato richiede 1 NADH","La conversione in acetato richiede l'aldeide deidrogenasi","In eccesso di etanolo, diminuisce la formazione di lattato","È consigliabile assumere etanolo prima di una attività sportiva","La conversione in acetaldeide richiede il FAD"],"ans":1,"why":"Etanolo → acetaldeide (alcol deidrogenasi) → acetato (aldeide deidrogenasi): si producono 2 NADH. L'NADH in eccesso spinge il piruvato a lattato, quindi il lattato aumenta.","note":null,"times":1,"pending":false,"level":"a"},{"id":"etanolo-falsa","topic":"m2-fermentazioni","page":"53, 169","src":"Biochimica II","q":"Quale affermazione è falsa per l'etanolo?","opts":["Passa la barriera ematoencefalica","La sua conversione in acetato avviene nel fegato","La produzione di acido acetico è un processo fermentativo","L'alcol deidrogenasi è un enzima costitutivo","È ossidato soprattutto nel fegato dall'alcol deidrogenasi"],"ans":2,"why":"Nel fegato l'etanolo viene ossidato con NAD⁺: è un'ossidazione, non una fermentazione (che serve a riossidare NADH). L'alcol deidrogenasi è costitutiva; inducibile è il citocromo P450.","note":null,"times":1,"pending":false,"level":"a"},{"id":"ldh-falsa","topic":"m2-fermentazioni","page":"50","src":"Biochimica II","q":"Quale affermazione è falsa per la lattico deidrogenasi?","opts":["È un enzima a chiralità selettiva","È sempre un omotetramero","È un enzima dipendente dal pH","È presente nei globuli rossi","Usa il NADH come coenzima"],"ans":1,"why":"È un tetramero di subunità H e M: solo H4 e M4 sono omotetrameri, M3H, M2H2 e MH3 sono eterotetrameri.","note":"Sbobina di Biochimica II, p. 49: c'è scritto che la LDH forma solo l'isomero «R». L'L-lattato è (S)-lattato.","times":1,"pending":false,"level":"m"},{"id":"ldh1","topic":"m2-fermentazioni","page":"50, 52","src":"Biochimica II","q":"La presenza nel sangue dell'isoenzima LDH1 può essere indice di:","opts":["Strappi muscolari","Fragilità dei globuli rossi","Infarto del miocardio","Cirrosi epatica","Insufficienza renale acuta"],"ans":2,"why":"LDH1 = H4, isoenzima cardiaco: marker tardivo di infarto (circa 48 ore). Sale anche nell'emolisi, ma la risposta attesa è l'infarto.","note":null,"times":1,"pending":false,"level":"m"},{"id":"cori","topic":"m2-fermentazioni","page":"51, 148","src":"Biochimica II","q":"Quale di queste condizioni deve essere soddisfatta dal fegato per il ciclo di Cori?","opts":["Deve essere attiva la via glicolitica","Ci deve essere un alto rapporto NAD⁺/NADH","Deve essere attiva la trasduzione del segnale dell'insulina","Deve essere attiva la glucochinasi","Deve essere inattiva la glucosio 6-fosfatasi"],"ans":1,"why":"Il fegato ossida il lattato a piruvato con la LDH: serve molto NAD⁺. Glicolisi e glucochinasi devono essere ferme, perché si fa gluconeogenesi.","note":null,"times":1,"pending":false,"level":"m"},{"id":"anion-gap","topic":"m2-fermentazioni","page":"52","src":"Biochimica II","q":"L'anion gap (AG) in biochimica clinica è dato da AG = [Na⁺] − ([Cl⁻] + [HCO₃⁻]). In presenza di lattato il valore dell'AG:","opts":["Rimane invariato","Aumenta","Diminuisce","Si annulla","Diventa negativo"],"ans":1,"why":"Il lattato è un anione non misurato: il bicarbonato cala per tamponare l'H⁺, quindi l'AG aumenta (acidosi lattica ad anion gap aumentato).","note":"L'anion gap non è nelle sbobine.","times":1,"pending":false,"level":"a"},{"id":"dhap-rid","topic":"m2-navette","page":"54","src":"Biochimica II","q":"Quale composto si forma dalla riduzione NADH dipendente del diidrossiacetone fosfato?","opts":["Non può essere ridotto","Gliceraldeide 3-P","Un alfachetoacido","Glicerolo fosfato","Glicerolo libero"],"ans":3,"why":"Il chetone del DHAP si riduce ad alcol secondario: glicerolo 3-fosfato. È il primo passo della navetta del glicerolo fosfato.","note":"Sbobina di Biochimica II, p. 54: chiama il glicerolo 3-fosfato «3-fosfoglicerolo (3-PG)». Non confonderlo con il 3-fosfoglicerato, che altrove è abbreviato 3-PG.","times":2,"pending":false,"level":"m"},{"id":"navetta-fad","topic":"m2-navette","page":"54","src":"Biochimica II","q":"Nel sistema navetta del glicerolo fosfato:","opts":["Il FADH₂ è ossidato dal diidrossiacetone fosfato","Il NADH cede gli elettroni direttamente al FAD","Il glicerolo fosfato è ossidato dal FAD","Il FADH₂ cede gli elettroni direttamente all'ossigeno","Il glicerolo fosfato è ossidato dal NAD⁺ mitocondriale"],"ans":2,"why":"La glicerolo 3-fosfato deidrogenasi mitocondriale, FAD-dipendente, ossida il glicerolo fosfato a DHAP; il FADH₂ passa gli elettroni alla catena respiratoria (coenzima Q).","note":null,"times":1,"pending":false,"level":"m"},{"id":"navetta-atp","topic":"m2-navette","page":"47, 54","src":"Biochimica II","q":"Se la riossidazione del NADH produce 2,5 ATP e quella del FADH₂ 1,5 ATP, quante ATP si formano in totale da glucosio a piruvato se il sistema navetta è quello del glicerolo fosfato?","opts":["3","4","5","7","6"],"ans":2,"why":"2 ATP netti + 2 NADH citosolici che, con la navetta del glicerolo fosfato, diventano FADH₂: 2 + 2 × 1,5 = 5.","note":null,"times":1,"pending":false,"level":"a"}],"bank":[{"id":"m1c-01","topic":"m1-catabolismo","level":"f","page":"5","src":"Biochimica II","q":"Il catabolismo è:","opts":["La degradazione di molecole complesse in molecole più semplici, che libera energia","La sintesi di molecole complesse a partire da precursori semplici, che consuma ATP","L'insieme delle reazioni che consumano ATP per produrre calore corporeo","L'eliminazione dei metaboliti terminali con urine, sudore e respirazione","Il trasporto dei nutrienti dal sangue all'interno delle cellule"],"ans":0,"why":"Il catabolismo degrada nutrienti e componenti cellulari ricavando energia (ATP) e potere riducente; l'anabolismo fa il contrario.","note":null,"fixed":false},{"id":"m1c-02","topic":"m1-catabolismo","level":"f","page":"6–9","src":"Biochimica II","q":"Quali sono i metaboliti terminali del catabolismo?","opts":["Piruvato e acetil-CoA","CO₂, H₂O e NH₃ (eliminata come urea)","Glucosio e acidi grassi","Piruvato e acetil-CoA, che poi vengono eliminati nel sangue","Lattato, urea e acetone"],"ans":1,"why":"I metaboliti terminali non rientrano nel metabolismo: CO₂ si elimina con la respirazione, H₂O si unisce all'acqua corporea, NH₃ diventa urea.","note":null,"fixed":false},{"id":"m1c-03","topic":"m1-catabolismo","level":"f","page":"8–9","src":"Biochimica II","q":"Verso quali intermedi comuni convergono le vie cataboliche di carboidrati, lipidi e proteine?","opts":["Glucosio e glicerolo","Piruvato e acetil-CoA","Urea e CO₂","Ossalacetato e citrato","Glicogeno e trigliceridi"],"ans":1,"why":"Piruvato e acetil-CoA sono i metaboliti intermedi in cui convergono le vie cataboliche.","note":null,"fixed":false},{"id":"m1c-04","topic":"m1-catabolismo","level":"m","page":"9","src":"Biochimica II","q":"Che cosa distingue un metabolita intermedio da uno terminale?","opts":["L'intermedio può essere ossidato per dare energia oppure usato per le biosintesi","L'intermedio è sempre più ossidato del terminale e non può essere ridotto","Il terminale entra nel ciclo di Krebs, mentre l'intermedio non vi accede","L'intermedio viene eliminato con le urine, il terminale resta nella cellula","Il terminale si accumula nel tessuto adiposo come riserva energetica"],"ans":0,"why":"L'acetil-CoA, ad esempio, può entrare nel ciclo di Krebs oppure diventare acidi grassi e colesterolo: la cellula decide in base alle sue necessità.","note":null,"fixed":false},{"id":"m1c-05","topic":"m1-catabolismo","level":"m","page":"6–7","src":"Biochimica II","q":"Perché l'anabolismo ha bisogno di potere riducente?","opts":["Perché le biosintesi sono in gran parte processi riduttivi","Perché l'anabolismo produce NADH che deve essere riossidato","Perché il potere riducente sostituisce l'ATP nelle biosintesi","Perché tutte le biosintesi avvengono all'interno del mitocondrio","Perché le biosintesi sono reazioni di ossidazione dei substrati"],"ans":0,"why":"Il catabolismo è ossidativo e produce coenzimi ridotti; l'anabolismo è riduttivo e li consuma. Per le biosintesi il coenzima è soprattutto il NADPH.","note":"Sbobina di Biochimica II, p. 6–7: c'è scritto che il potere riducente per le biosintesi è «soprattutto NADH». Per le biosintesi riduttive (acidi grassi, colesterolo) il coenzima è il NADPH; il NADH serve soprattutto alla fosforilazione ossidativa.","fixed":false},{"id":"m1c-06","topic":"m1-catabolismo","level":"a","page":"8","src":"Biochimica II","q":"Nella sequenza glicolisi → ciclo di Krebs → fosforilazione ossidativa, dove si forma la maggior parte dell'ATP e perché?","opts":["Nella fosforilazione ossidativa, che riossida i coenzimi ridotti cedendo elettroni all'O₂","Nella glicolisi, perché è la via più veloce e lavora anche senza ossigeno","Nel ciclo di Krebs, perché ossida completamente l'acetil-CoA a due CO₂","In tutte e tre in quantità simile, circa un terzo dell'ATP per ciascuna","Nella glicolisi, perché produce direttamente ATP con le fosforilazioni a livello del substrato"],"ans":0,"why":"Glicolisi e Krebs producono poco ATP ma molti coenzimi ridotti; la riossidazione di NADH e FADH₂ con l'ossigeno nella fosforilazione ossidativa produce la gran parte dell'ATP.","note":null,"fixed":false},{"id":"m1c-07","topic":"m1-catabolismo","level":"a","page":"7","src":"Biochimica II","q":"L'acetil-CoA è precursore di tutte le seguenti molecole tranne:","opts":["Acidi grassi","Colesterolo","Ormoni steroidei","Glucosio (nell'uomo)","Corpi chetonici (nel fegato)"],"ans":3,"why":"Nell'uomo l'acetil-CoA non può diventare glucosio: la piruvato deidrogenasi è irreversibile e nel ciclo di Krebs i due carboni dell'acetile escono come CO₂.","note":"Il fatto che l'acetil-CoA non dia glucosio non è detto esplicitamente in questa parte della sbobina.","fixed":false},{"id":"m1c-08","topic":"m1-catabolismo","level":"l","page":"6","src":"Biochimica II","q":"Come si chiama la forma ossidata del nicotinammide adenin dinucleotide fosfato?","opts":["NADP⁺","NADPH","NAD⁺","FADP","FAD⁺"],"ans":0,"why":"NADP⁺ è la forma ossidata, NADPH quella ridotta. Si distingue dal NAD⁺ per un fosfato sul 2' del ribosio legato all'adenina.","note":null,"fixed":false},{"id":"m1t-01","topic":"m1-termodinamica","level":"f","page":"10","src":"Biochimica II","q":"Che cosa dice la termodinamica di una reazione?","opts":["Se può avvenire spontaneamente","Quanto velocemente avviene","Quale enzima la catalizza","Quanta attivazione serve","Quanta energia serve per superare lo stato di transizione"],"ans":0,"why":"La termodinamica (ΔG) dice se una reazione è possibile; la velocità è oggetto della cinetica.","note":null,"fixed":false},{"id":"m1t-02","topic":"m1-termodinamica","level":"f","page":"11","src":"Biochimica II","q":"Se Keq > 1, il ΔG°' della reazione è:","opts":["Positivo","Negativo","Zero","Indeterminabile","Uguale alla Keq"],"ans":1,"why":"ΔG°' = −RT ln Keq: con Keq > 1 il logaritmo è positivo e il ΔG°' negativo, la reazione procede verso i prodotti.","note":"Sbobina di Biochimica II, p. 11: parla di «keq > 0», «keq = 0» e «keq < 0». La Keq è sempre positiva: i casi corretti sono Keq > 1, = 1 e < 1. Nella formula manca anche il logaritmo: ΔG°' = −RT ln Keq.","fixed":false},{"id":"m1t-03","topic":"m1-termodinamica","level":"m","page":"11","src":"Biochimica II","q":"Quali sono le condizioni standard biochimiche a cui si riferisce il ΔG°'?","opts":["pH 7, 25 °C, reagenti e prodotti 1 M","pH 7,4, 37 °C, concentrazioni cellulari","pH 0, 0 °C, 1 atm","pH 7, 37 °C, reagenti 1 mM","pH 7, 0 °C, reagenti 0,1 M"],"ans":0,"why":"pH 7, 298 K (25 °C) e tutte le specie a 1 M; per questo nella cellula il ΔG reale è diverso.","note":"Sbobina di Biochimica II, p. 10: c'è scritto «T = 273 °K (+25 °C)». 25 °C sono 298 K; 273 K sono 0 °C.","fixed":false},{"id":"m1t-04","topic":"m1-termodinamica","level":"m","page":"12","src":"Biochimica II","q":"In una serie A ⇌ B ⇌ C all'equilibrio, cosa succede se la cellula consuma C?","opts":["Aumenta la trasformazione di A in B e di B in C","Si forma più A, perché l'equilibrio si sposta a sinistra","Non cambia nulla, perché le reazioni sono già all'equilibrio","La Keq delle due reazioni aumenta per compensare","Si accumula B, perché solo la seconda reazione accelera"],"ans":0,"why":"Per il principio di Le Chatelier, sottrarre il prodotto sposta tutte le reazioni della serie verso destra.","note":null,"fixed":false},{"id":"m1t-05","topic":"m1-termodinamica","level":"a","page":"12","src":"Biochimica II","q":"Perché le reazioni regolate di una via metabolica hanno ΔG molto negativo?","opts":["Sono praticamente irreversibili: lì la via si accende o si spegne senza tornare indietro","Sono le più veloci della via: il loro enzima ha la kcat più alta e fissa da solo il flusso","Non hanno bisogno di enzimi, perché procedono spontaneamente in modo rapido","Sono all'equilibrio, quindi piccole variazioni di substrato le regolano","Consumano sempre ATP, e il ΔG negativo deriva solo da quell'idrolisi"],"ans":0,"why":"Le reazioni vicine all'equilibrio vanno nei due sensi secondo le concentrazioni; quelle con ΔG molto negativo vanno in un solo senso e sono il punto in cui intervengono gli enzimi allosterici.","note":null,"fixed":false},{"id":"m1t-06","topic":"m1-termodinamica","level":"a","page":"12","src":"Biochimica II","q":"Una reazione ha ΔG°' = +5 kJ/mol. Nella cellula procede verso destra. Come è possibile?","opts":["Il prodotto viene consumato e il rapporto prodotti/reagenti resta basso: il ΔG diventa negativo","Non è possibile: con ΔG°' positivo la reazione procede sempre verso sinistra","L'enzima abbassa l'energia di attivazione, e con essa diventa negativo anche il ΔG°' della reazione","A 37 °C il ΔG°' cambia segno, perché è definito a 25 °C","La reazione è accoppiata all'idrolisi di ATP, che rende negativo il ΔG°' tabulato"],"ans":0,"why":"ΔG = ΔG°' + RT ln([P]/[R]): se il prodotto è basso il termine logaritmico è negativo e può superare il ΔG°'. È il caso dell'aldolasi nella glicolisi.","note":null,"fixed":false},{"id":"m1t-07","topic":"m1-termodinamica","level":"l","page":"11","src":"Biochimica II","q":"Nella formula ΔG°' = −RT ln Keq, che cosa indica l'apice (')?","opts":["Che il valore è riferito a pH 7","Che il valore è a 37 °C","Che è la seconda misura","Che è espresso in kcal","Che il valore è misurato in vivo"],"ans":0,"why":"L'apice distingue lo standard biochimico (pH 7) da quello chimico (attività dell'H⁺ = 1, pH 0).","note":"La distinzione tra ΔG° e ΔG°' non è esplicitata nella sbobina.","fixed":false},{"id":"m1a-01","topic":"m1-atp","level":"f","page":"13","src":"Biochimica II","q":"Quanto vale il ΔG°' di idrolisi dell'ATP ad ADP + Pi?","opts":["−30,5 kJ/mol (−7,3 kcal/mol)","−61 kJ/mol (−14,6 kcal/mol)","−61 kJ/mol","+30 kJ/mol","−7,3 kJ/mol"],"ans":0,"why":"È il valore di riferimento per i composti ad alta energia.","note":"Sbobina di Biochimica II, p. 13: subito dopo il valore di −30 kJ/mol c'è scritto che il ΔG di idrolisi dell'ATP «è ampiamente positivo». È negativo: l'idrolisi è favorita.","fixed":false},{"id":"m1a-02","topic":"m1-atp","level":"f","page":"13","src":"Biochimica II","q":"Che legame unisce il fosfato α al ribosio nell'ATP?","opts":["Fosfoanidridico","Fosfoestere","N-glicosidico","Tioestere","Glicosidico"],"ans":1,"why":"Ribosio (OH in 5') + fosfato = fosfoestere. Tra α-β e β-γ ci sono legami fosfoanidridici.","note":null,"fixed":false},{"id":"m1a-03","topic":"m1-atp","level":"f","page":"19","src":"Biochimica II","q":"Quale di questi composti ha un potenziale di trasferimento del fosfato maggiore dell'ATP?","opts":["Glucosio 6-fosfato","Fosfoenolpiruvato","Glicerolo 3-fosfato","AMP","ADP"],"ans":1,"why":"PEP, 1,3-bisfosfoglicerato e fosfocreatina superano l'ATP e possono cedergli il fosfato.","note":null,"fixed":false},{"id":"m1a-04","topic":"m1-atp","level":"m","page":"14","src":"Biochimica II","q":"Perché l'idrolisi dei legami fosfoanidridici dell'ATP libera molta energia?","opts":["I prodotti sono più stabilizzati (risonanza, solvatazione) e cala la repulsione tra cariche","Il legame P–O è molto più debole dei legami C–C, e la sua rottura libera l'energia di legame accumulata","Si forma una molecola d'acqua, e la sua formazione libera molta energia","Il magnesio legato all'ATP viene liberato e rilascia energia di legame","L'adenina cambia conformazione e cede energia al gruppo fosfato"],"ans":0,"why":"Repulsione elettrostatica nel reagente e maggiore stabilizzazione per risonanza e solvatazione dei prodotti.","note":null,"fixed":false},{"id":"m1a-05","topic":"m1-atp","level":"m","page":"14","src":"Biochimica II","q":"La scissione ATP → AMP + PPi seguita dall'idrolisi del pirofosfato libera in tutto circa:","opts":["−30 kJ/mol","−45 kJ/mol","−60 kJ/mol","−90 kJ/mol","−15 kJ/mol"],"ans":2,"why":"Due legami fosfoanidridici scissi: circa −30 + −30. L'idrolisi del PPi rende irreversibili molte biosintesi.","note":null,"fixed":false},{"id":"m1a-06","topic":"m1-atp","level":"m","page":"15","src":"Biochimica II","q":"Qual è la forma dell'ATP che partecipa alle reazioni enzimatiche?","opts":["ATP libero","Mg-ATP","Ca-ATP","ATP protonato","K-ATP"],"ans":1,"why":"Il Mg²⁺ si lega ai fosfati, riduce la repulsione tra le cariche ed è la forma riconosciuta dagli enzimi ATP-dipendenti.","note":null,"fixed":false},{"id":"m1a-07","topic":"m1-atp","level":"m","page":"20","src":"Biochimica II","q":"Che cosa fa la creatina chinasi all'inizio di uno sforzo muscolare?","opts":["Trasferisce il fosfato della fosfocreatina all'ADP, formando ATP","Trasferisce il fosfato dell'ATP alla creatina, formando fosfocreatina","Idrolizza la fosfocreatina liberando fosfato inorganico e calore","Converte la creatina in creatinina, che viene eliminata con le urine","Trasferisce il fosfato dell'ADP all'AMP, formando due ATP"],"ans":0,"why":"La fosfocreatina (ΔG°' ≈ −43 kJ/mol) rigenera ATP dall'ADP: è la prima riserva di energia del muscolo. La reazione è reversibile e dipende dalle concentrazioni.","note":"Sbobina di Biochimica II, p. 20: c'è scritto che la creatina fosfato è in grado di «fosforilare l'ATP per riformare ADP». È il contrario: fosforila l'ADP e riforma ATP.","fixed":false},{"id":"m1a-08","topic":"m1-atp","level":"a","page":"14–16","src":"Biochimica II","q":"Nel muscolo, dopo un digiuno prolungato, una rialimentazione ricca di carboidrati può causare:","opts":["Ipofosfatemia, perché il fosfato entra nelle cellule per fosforilare gli zuccheri","Iperfosfatemia, perché l'eccesso di ATP prodotto libera fosfato nel sangue","Ipoglicemia grave, perché l'insulina blocca subito la glicogenolisi","Acidosi lattica immediata, perché il muscolo fermenta tutto il glucosio","Ipercalcemia, perché il fosfato sequestra il calcio nelle ossa"],"ans":0,"why":"È la sindrome da rialimentazione: il fosfato plasmatico crolla perché finisce negli zuccheri fosforilati e nell'ATP, con rischio soprattutto per il cuore.","note":null,"fixed":false},{"id":"m1a-09","topic":"m1-atp","level":"a","page":"16–17","src":"Biochimica II","q":"Se la carica energetica di una cellula scende da 0,9 a 0,6:","opts":["Accelerano le vie che generano ATP e rallentano quelle che lo consumano","Accelerano le vie che consumano ATP, per riportare la carica a 0,9","Catabolismo e anabolismo restano invariati, perché non dipendono dall'ATP","La cellula accelera la sintesi di glicogeno per immagazzinare energia","Rallentano sia le vie cataboliche sia quelle anaboliche"],"ans":0,"why":"Sotto 0,9 prevalgono le vie cataboliche; sopra prevalgono quelle anaboliche.","note":null,"fixed":false},{"id":"m1a-10","topic":"m1-atp","level":"a","page":"17–18","src":"Biochimica II","q":"Durante la sintesi proteica dopo un pasto, perché la nucleotide difosfato chinasi produce GTP solo quando serve?","opts":["Ha ΔG°' ≈ 0: è il consumo di GTP a spostare l'equilibrio verso la sua formazione","È regolata dall'insulina, che la attiva dopo il pasto tramite fosforilazione","È inibita dall'ATP alto, quindi lavora solo quando l'energia scarseggia","È un enzima allosterico attivato dal GDP che si accumula nella cellula","La sua sintesi aumenta solo quando i ribosomi chiedono GTP"],"ans":0,"why":"È un'azione di massa: più GTP viene consumato, più la reazione ATP + GDP ⇌ ADP + GTP va verso destra.","note":null,"fixed":false},{"id":"m1a-11","topic":"m1-atp","level":"l","page":"17","src":"Biochimica II","q":"Quale nucleotide trifosfato si usa soprattutto per la biosintesi dei lipidi complessi (fosfolipidi)?","opts":["UTP","GTP","CTP","TTP","ATP"],"ans":2,"why":"UTP per i carboidrati (UDP-glucosio), GTP per le proteine, CTP per i lipidi (CDP-diacilglicerolo, CDP-colina).","note":null,"fixed":false},{"id":"m1a-12","topic":"m1-atp","level":"l","page":"13","src":"Biochimica II","q":"Nell'ATP, l'adenina è legata al ribosio. Come si chiama correttamente la molecola adenina + ribosio?","opts":["Adenosina","Adenina","Adenilato","Desossiadenosina","Adenosina monofosfato"],"ans":0,"why":"Adenina è la base, adenosina il nucleoside (base + ribosio), adenilato (AMP) il nucleotide.","note":"Sbobina di Biochimica II, p. 13: c'è scritto «la base azotata adenosina». La base è l'adenina; l'adenosina è il nucleoside.","fixed":false},{"id":"m1a-13","topic":"m1-atp","level":"l","page":"20","src":"Biochimica II","q":"Qual è l'isoenzima della creatina chinasi usato come marker precoce di infarto?","opts":["CK-MM","CK-BB","CK-MB","CK-MiMi","Troponina-CK"],"ans":2,"why":"CK-MB è l'isoenzima cardiaco; CK-MM è muscolare scheletrico, CK-BB cerebrale.","note":null,"fixed":false},{"id":"m1a-14","topic":"m1-atp","level":"l","page":"15","src":"Biochimica II","q":"Quale concentrazione plasmatica di fosfato è nel range normale nell'adulto?","opts":["Circa 3–4,5 mg/dl","Circa 30 mg/dl","Circa 0,3 mg/dl","Circa 100 mg/dl","Circa 10–12 mg/dl"],"ans":0,"why":"La fosfatemia normale nell'adulto è circa 2,5–4,5 mg/dl.","note":"Sbobina di Biochimica II, p. 15: indica una fosfatemia di «30 mg/decilitro». Il valore normale è circa 3–4,5 mg/dl. Il range non è nella sbobina: viene dai testi di riferimento.","fixed":false},{"id":"m1o-01","topic":"m1-coenzimi","level":"f","page":"23","src":"Biochimica II","q":"L'ossidazione di un alcol secondario produce:","opts":["Un'aldeide","Un chetone","Un acido carbossilico","Un estere","Un etere"],"ans":1,"why":"Alcol primario → aldeide → acido; alcol secondario → chetone.","note":null,"fixed":false},{"id":"m1o-02","topic":"m1-coenzimi","level":"f","page":"21","src":"Biochimica II","q":"Da quali vitamine derivano NAD e FAD?","opts":["Niacina e riboflavina","Tiamina e piridossina","Biotina e acido folico","Cobalamina e acido pantotenico","Retinolo e calciferolo"],"ans":0,"why":"NAD da niacina (B3), FAD da riboflavina (B2).","note":null,"fixed":false},{"id":"m1o-03","topic":"m1-coenzimi","level":"m","page":"23","src":"Biochimica II","q":"Che cosa riceve il NAD⁺ quando si riduce?","opts":["Uno ione idruro (H⁻), cioè due elettroni","Due atomi di idrogeno, cioè due protoni e due elettroni","Un protone dal substrato ossidato","Un elettrone singolo, come i citocromi","Un atomo di ossigeno dall'acqua"],"ans":0,"why":"Il NAD⁺ accetta un idruro; il secondo protone va in soluzione (NADH + H⁺). Il FAD invece accetta due atomi di idrogeno.","note":null,"fixed":false},{"id":"m1o-04","topic":"m1-coenzimi","level":"m","page":"23","src":"Biochimica II","q":"Il passaggio succinato → fumarato:","opts":["È un'ossidazione FAD-dipendente che crea un doppio legame C=C","È un'idratazione che aggiunge acqua al doppio legame","È un'ossidazione NAD-dipendente che forma un gruppo carbonilico","Non è una reazione redox, ma un'isomerizzazione cis-trans","È una decarbossilazione ossidativa che libera CO₂"],"ans":0,"why":"Da due carboni saturi a un doppio legame si perdono 2 elettroni: il FAD è l'accettore adatto.","note":null,"fixed":false},{"id":"m1o-05","topic":"m1-coenzimi","level":"m","page":"24","src":"Biochimica II","q":"A pH 7,4 un acido carbossilico con pKa ≈ 3,5 si trova:","opts":["Quasi tutto protonato (–COOH)","Metà protonato e metà deprotonato","Quasi tutto deprotonato (–COO⁻)","Come estere","Legato al sodio come sale insolubile"],"ans":2,"why":"Il pH è molto sopra il pKa: per questo nella cellula si dice piruvato, lattato, malato (suffisso -ato).","note":null,"fixed":false},{"id":"m1o-06","topic":"m1-coenzimi","level":"a","page":"22–23","src":"Biochimica II","q":"Ordina dal più ridotto al più ossidato il carbonio in: metano, metanolo, formaldeide, acido formico, CO₂.","opts":["Metano → metanolo → formaldeide → acido formico → CO₂","CO₂ → acido formico → formaldeide → metanolo → metano","Metanolo → metano → formaldeide → CO₂ → acido formico","Formaldeide → metanolo → metano → acido formico → CO₂","Metano → formaldeide → metanolo → CO₂ → acido formico"],"ans":0,"why":"Stati di ossidazione: −4, −2, 0, +2, +4. Ogni passaggio perde 2 elettroni.","note":null,"fixed":true},{"id":"m1o-07","topic":"m1-coenzimi","level":"a","page":"23","src":"Biochimica II","q":"Una reazione redox biochimica si scrive con quattro termini. Quali?","opts":["Donatore ridotto + accettore ossidato → donatore ossidato + accettore ridotto","Donatore ossidato + accettore ridotto → donatore ridotto + accettore ossidato","Substrato + enzima → complesso enzima-substrato → prodotto + enzima","Ossidante + riducente → acqua + energia libera + calore","Reagente + ATP → prodotto fosforilato + ADP"],"ans":0,"why":"Es. malato (donatore ridotto) + NAD⁺ (accettore ossidato) → ossalacetato + NADH + H⁺.","note":null,"fixed":false},{"id":"m1o-08","topic":"m1-coenzimi","level":"a","page":"22–23","src":"Biochimica II","q":"Il passaggio da aldeide a chetone isomerico (es. gliceraldeide 3-P → diidrossiacetone fosfato) è:","opts":["Un'isomerizzazione, senza cambiare lo stato di ossidazione complessivo","Un'ossidazione, perché si forma un carbonile chetonico più ossidato","Una riduzione, perché il C1 perde il gruppo aldeidico","Una decarbossilazione, perché il C1 viene eliminato come CO₂","Una fosforilazione, perché il fosfato passa dal C3 al C1"],"ans":0,"why":"Aldeide e chetone isomerici hanno lo stesso numero di elettroni: lo catalizza un'isomerasi, senza NAD.","note":null,"fixed":false},{"id":"m1o-09","topic":"m1-coenzimi","level":"l","page":"24","src":"Biochimica II","q":"Qual è il nome corretto della specie deprotonata dell'acido piruvico?","opts":["Piruvato","Piruvico","Piruvile","Piruvinato","Piruvoile"],"ans":0,"why":"Suffisso -ico per l'acido protonato, -ato per la base coniugata, che è la forma presente a pH fisiologico.","note":null,"fixed":false},{"id":"m1o-10","topic":"m1-coenzimi","level":"l","page":"21","src":"Biochimica II","q":"Quale sigla indica la forma ridotta del flavin adenin dinucleotide?","opts":["FAD","FADH₂","FMN","FADH⁺","FADH"],"ans":1,"why":"Il FAD accetta due atomi di idrogeno (2 e⁻ + 2 H⁺) e diventa FADH₂. L'FMN è il flavin mononucleotide (complesso I).","note":null,"fixed":false},{"id":"m1e-01","topic":"m1-enzimologia","level":"f","page":"27","src":"Biochimica II","q":"Che cosa indica la KM?","opts":["La concentrazione di substrato a cui v = ½ Vmax","La velocità massima raggiunta a substrato saturante","La concentrazione di enzima necessaria per metà reazione","La costante di equilibrio della reazione catalizzata","Il numero di molecole trasformate al secondo da un enzima"],"ans":0,"why":"Più la KM è bassa, maggiore è l'affinità dell'enzima per il substrato.","note":null,"fixed":false},{"id":"m1e-02","topic":"m1-enzimologia","level":"f","page":"28","src":"Biochimica II","q":"Che forma ha la curva v/[S] di un enzima allosterico cooperativo?","opts":["Iperbolica","Sigmoide","Lineare","Esponenziale decrescente","A campana"],"ans":1,"why":"Gli enzimi di Michaelis-Menten danno un'iperbole; gli allosterici una sigmoide, descritta dalla K0,5.","note":null,"fixed":false},{"id":"m1e-03","topic":"m1-enzimologia","level":"f","page":"28","src":"Biochimica II","q":"Nella forma R un enzima allosterico è:","opts":["Inattivo (teso)","Attivo (rilassato)","Denaturato","Fosforilato","Legato all'inibitore"],"ans":1,"why":"R = relaxed, attiva; T = tense, inattiva.","note":null,"fixed":false},{"id":"m1e-04","topic":"m1-enzimologia","level":"m","page":"27","src":"Biochimica II","q":"Due enzimi hanno la stessa Vmax e KM₁ < KM₂. Quale è più affine al substrato?","opts":["L'enzima 1","L'enzima 2","Sono ugualmente affini","Dipende dalla concentrazione dell'enzima","Non si può dire senza la kcat"],"ans":0,"why":"KM più bassa = mezza velocità massima raggiunta a concentrazione di substrato più bassa = maggiore affinità.","note":null,"fixed":false},{"id":"m1e-05","topic":"m1-enzimologia","level":"m","page":"29","src":"Biochimica II","q":"Gli ormoni regolano gli enzimi soprattutto con:","opts":["Effettori allosterici che entrano nella cellula","Modificazioni covalenti come la fosforilazione","Variazioni di pH","Variazioni di temperatura","Variazioni della forza ionica"],"ans":1,"why":"La regolazione allosterica è locale (cellula per cellula); gli ormoni agiscono con protein chinasi e fosfatasi.","note":null,"fixed":false},{"id":"m1e-06","topic":"m1-enzimologia","level":"a","page":"27–29","src":"Biochimica II","q":"Un farmaco abbassa la K0,5 di un enzima allosterico senza cambiare la Vmax. Come si comporta?","opts":["Da effettore allosterico positivo","Da effettore allosterico negativo","Da inibitore competitivo","Da denaturante","Da inibitore incompetitivo"],"ans":0,"why":"La K0,5 più bassa sposta la sigmoide a sinistra: l'enzima lavora meglio a basse concentrazioni di substrato.","note":null,"fixed":false},{"id":"m1e-07","topic":"m1-enzimologia","level":"a","page":"29","src":"Biochimica II","q":"Perché le reazioni vicine all'equilibrio non sono buoni punti di regolazione?","opts":["Il flusso netto dipende dai rapporti tra reagenti e prodotti: cambiare l'enzima non ne sposta il verso","I loro enzimi sono troppo lenti per rispondere ai segnali ormonali e non hanno siti allosterici disponibili","Non usano coenzimi, quindi non possono essere modulate da effettori allosterici","Avvengono solo nel mitocondrio, dove gli ormoni non arrivano","Hanno tutte ΔG°' positivo e quindi non procedono senza ATP"],"ans":0,"why":"Il controllo del flusso si esercita sulle tappe lontane dall'equilibrio, catalizzate da enzimi allosterici.","note":null,"fixed":false},{"id":"m1e-08","topic":"m1-enzimologia","level":"l","page":"27","src":"Biochimica II","q":"Come si chiama la costante k₂ in Vmax = k₂[E]?","opts":["Costante catalitica (kcat)","Costante di Michaelis","Costante di dissociazione","Costante di specificità","Costante di Hill"],"ans":0,"why":"kcat è il numero di molecole di substrato trasformate per sito attivo al secondo. kcat/KM è la costante di specificità.","note":null,"fixed":false},{"id":"m1e-09","topic":"m1-enzimologia","level":"l","page":"42","src":"Biochimica II","q":"Un enzima con kcat/KM vicino a 10⁸–10⁹ M⁻¹ s⁻¹ si dice:","opts":["A perfezione catalitica (limitato dalla diffusione)","Allosterico","Saturato","Allosterico (con cooperatività positiva tra le subunità)","Cooperativo"],"ans":0,"why":"È il caso della trioso fosfato isomerasi: il limite è l'incontro tra enzima e substrato.","note":null,"fixed":false},{"id":"m1e-10","topic":"m1-enzimologia","level":"l","page":"29","src":"Biochimica II","q":"Quali residui hanno l'ossidrile usato dalle serina/treonina chinasi per legare il fosfato?","opts":["Serina e treonina","Tirosina e triptofano","Cisteina e metionina","Aspartato e glutammato","Istidina e lisina"],"ans":0,"why":"Si forma un fosfoestere con l'OH della catena laterale. Esistono anche tirosina chinasi (recettori per l'insulina).","note":null,"fixed":false},{"id":"m2i-01","topic":"m2-ingresso","level":"f","page":"31","src":"Biochimica II","q":"Quale enzima digerisce l'amido nella bocca e nell'intestino?","opts":["α-amilasi","β-amilasi","Lattasi","Glicogeno fosforilasi","Saccarasi"],"ans":0,"why":"L'α-amilasi salivare e pancreatica scinde i legami α1-4; l'uomo non ha enzimi per i legami β della cellulosa.","note":null,"fixed":false},{"id":"m2i-02","topic":"m2-ingresso","level":"f","page":"33","src":"Biochimica II","q":"Quale trasportatore è richiamato sulla membrana dall'insulina?","opts":["GLUT1","GLUT2","GLUT3","GLUT4","SGLT1"],"ans":3,"why":"Muscolo scheletrico, cuore e tessuto adiposo: i GLUT4 stanno in vescicole e l'insulina ne fa fondere le vescicole con la membrana.","note":null,"fixed":false},{"id":"m2i-03","topic":"m2-ingresso","level":"f","page":"33","src":"Biochimica II","q":"Quanti segmenti transmembrana hanno i trasportatori GLUT?","opts":["7","12","4","24","10"],"ans":1,"why":"Struttura comune a 12 eliche transmembrana, con due conformazioni (T1 verso l'esterno, T2 verso l'interno).","note":null,"fixed":false},{"id":"m2i-04","topic":"m2-ingresso","level":"m","page":"32","src":"Biochimica II","q":"Come entra il glucosio dal lume intestinale nell'enterocita?","opts":["In simporto con Na⁺ tramite SGLT1, grazie al gradiente della pompa Na⁺/K⁺","Per diffusione facilitata con GLUT2 sulla membrana apicale dell'enterocita","Per endocitosi mediata da recettore, insieme ai frammenti di amido","Con un'ATPasi specifica per il glucosio, che lo pompa contro gradiente","In antiporto con K⁺ tramite GLUT5, sfruttando il potenziale di membrana"],"ans":0,"why":"È un trasporto attivo secondario: l'SGLT1 non consuma ATP, lo consuma la Na⁺/K⁺-ATPasi.","note":"Sbobina di Biochimica II, p. 32: chiama il trasportatore «SGLUT1» e lo descrive prima come «trasportatore attivo che utilizza ATP». Il nome corretto è SGLT1 ed è attivo secondario.","fixed":false},{"id":"m2i-05","topic":"m2-ingresso","level":"m","page":"34","src":"Biochimica II","q":"Perché il cervello riceve glucosio anche a glicemia bassa?","opts":["GLUT1 (barriera ematoencefalica) e GLUT3 (neuroni) hanno Kt molto basse","Il cervello usa GLUT2, ad alta capacità, e quindi il trasporto non dipende dalla glicemia","È insulino-dipendente e riceve glucosio grazie al GLUT4","Usa SGLT1, che concentra il glucosio contro gradiente","Il glucosio attraversa la barriera per semplice diffusione"],"ans":0,"why":"GLUT3 ha Kt ≈ 0,1 mM: lavora vicino alla saturazione anche con poco glucosio.","note":null,"fixed":false},{"id":"m2i-06","topic":"m2-ingresso","level":"m","page":"34","src":"Biochimica II","q":"Che cosa innesca la secrezione di insulina nella cellula β?","opts":["L'aumento di ATP, che chiude i canali K⁺, depolarizza e fa entrare Ca²⁺","L'apertura dei canali K⁺, che iperpolarizza la cellula e libera i granuli","Il legame del glucosio a un recettore di membrana accoppiato a proteina G","L'aumento di AMP ciclico prodotto in risposta al glucagone","Il calo di ATP, che apre i canali Ca²⁺ della membrana"],"ans":0,"why":"Glucosio → GLUT2 → glucochinasi → glicolisi e fosforilazione ossidativa → ATP ↑ → canali K⁺ chiusi → Ca²⁺ in entrata → esocitosi.","note":null,"fixed":false},{"id":"m2i-07","topic":"m2-ingresso","level":"a","page":"33–34","src":"Biochimica II","q":"Dopo un pasto la glicemia passa da 4,5 a 9 mM. Quale trasportatore lse},{"id":"m2f-01","topic":"m2-fosforilazione","level":"f","page":"37","src":"Biochimica II","q":"Quale enzima fosforila il glucosio negli epatociti?","opts":["Glucochinasi (esochinasi IV)","Esochinasi I (ubiquitaria)","Fosfoglucomutasi","Glucosio 6-fosfatasi","Glicerolo chinasi"],"ans":0,"why":"Fegato e cellule β del pancreas usano la glucochinasi, a bassa affinità.","note":null,"fixed":false},{"id":"m2f-02","topic":"m2-fosforilazione","level":"f","page":"38","src":"Biochimica II","q":"Perché il glucosio fosforilato resta intrappolato nella cellula?","opts":["Il G6P è carico negativamente e non ha trasportatori di membrana","Si lega alle proteine del citosol e non diffonde più","Viene subito polimerizzato in glicogeno in tutte le cellule","È più grande del glucosio e non passa dai GLUT","Viene ossidato subito a CO₂ nel mitocondrio"],"ans":0,"why":"Le cariche negative del fosfato impediscono l'uscita attraverso i GLUT.","note":null,"fixed":false},{"id":"m2f-03","topic":"m2-fosforilazione","level":"m","page":"55","src":"Biochimica II","q":"Come viene regolata l'esochinasi ubiquitaria?","opts":["È inibita dal suo prodotto, il glucosio 6-fosfato","È attivata dall'insulina tramite fosforilazione","È inibita allostericamente dall'ATP e dal citrato","È sequestrata nel nucleo da una proteina regolatrice","È attivata dal fruttosio 2,6-bisfosfato"],"ans":0,"why":"Il G6P si lega a un sito allosterico e la inibisce.","note":null,"fixed":false},{"id":"m2f-04","topic":"m2-fosforilazione","level":"m","page":"55–56","src":"Biochimica II","q":"Come viene regolata la glucochinasi epatica?","opts":["È sequestrata nel nucleo da una proteina regolatrice e torna attiva nel citosol","È inibita dal glucosio 6-fosfato, come l'esochinasi delle altre cellule","È fosforilata dalla PKA e inattivata quando arriva il glucagone","Non è regolata: dipende solo dalla concentrazione di glucosio","È attivata allostericamente dall'AMP quando l'energia scarseggia"],"ans":0,"why":"Molto glucosio libera la glucochinasi dalla proteina regolatrice; il fruttosio 6-P la riporta nel nucleo.","note":null,"fixed":false},{"id":"m2f-05","topic":"m2-fosforilazione","level":"m","page":"40","src":"Biochimica II","q":"Perché l'esochinasi chiude il sito attivo quando legano glucosio e ATP (adattamento indotto)?","opts":["Per escludere l'acqua ed evitare l'idrolisi improduttiva dell'ATP","Per aumentare la KM per il glucosio quando la glicemia sale","Per legare il Mg²⁺, che entra solo a sito attivo chiuso","Per far uscire più in fretta il glucosio 6-fosfato","Per legare un secondo glucosio nel sito allosterico"],"ans":0,"why":"Il fosfato γ deve andare sul C6 del glucosio, non all'acqua.","note":null,"fixed":false},{"id":"m2f-06","topic":"m2-fosforilazione","level":"a","page":"37–38","src":"Biochimica II","q":"Perché il fegato usa un enzima con KM alta per il glucosio?","opts":["Per fosforilare il glucosio solo a glicemia alta, lasciandolo prima agli altri organi","Perché così consuma meno ATP per ogni molecola di glucosio fosforilata durante il digiuno","Perché la glucochinasi è più veloce dell'esochinasi a ogni concentrazione","Per inibire la glicolisi epatica durante il pasto","Perché il fegato non ha GLUT e deve trattenere il glucosio"],"ans":0,"why":"A digiuno la glucochinasi lavora poco e il glucosio resta disponibile per cervello ed eritrociti; dopo il pasto il fegato immagazzina l'eccesso.","note":null,"fixed":false},{"id":"m2f-07","topic":"m2-fosforilazione","level":"a","page":"38","src":"Biochimica II","q":"Il glucosio 6-fosfato è un crocevia. Quale via non parte da lui?","opts":["Glicolisi","Via dei pentoso fosfati","Sintesi del glicogeno","β-ossidazione","Sintesi dell'UDP-glucosio"],"ans":3,"why":"Il G6P va in glicolisi, pentoso fosfati, glicogeno o (nel fegato) torna glucosio.","note":null,"fixed":false},{"id":"m2f-08","topic":"m2-fosforilazione","level":"l","page":"37","src":"Biochimica II","q":"Come si chiama anche la glucochinasi?","opts":["Esochinasi IV","Esochinas
