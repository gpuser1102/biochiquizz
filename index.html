ormente ossidata ad ossalacetato». Viene ossidata ad acetato.","fixed":false},{"id":"m5a-02","topic":"m5-approfondimenti","level":"m","page":"156","src":"Biochimica II","q":"Quali stimoli aumentano la secrezione di glucagone?","opts":["Ipoglicemia, amminoacidi, catecolammine","Iperglicemia, insulina, acidi grassi","Acidi grassi, corpi chetonici, somatostatina","Iperglicemia, GLP-1, somatostatina","Ipoglicemia, insulina, corpi chetonici"],"ans":0,"why":"È inibita da iperglicemia e insulina.","note":null,"fixed":false},{"id":"m5a-03","topic":"m5-approfondimenti","level":"m","page":"156","src":"Biochimica II","q":"Con il jet lag, che cosa succede alla gluconeogenesi nei primi giorni?","opts":["La PEPCK segue ancora il vecchio ritmo: la glicemia notturna è regolata peggio","La gluconeogenesi si blocca del tutto finché il ritmo circadiano non si riadatta","La PEPCK raddoppia la sua espressione per compensare lo stress del viaggio","Non cambia nulla: la PEPCK è costitutiva e non segue un ritmo circadiano","Il cortisolo smette di essere secreto e la PEPCK scompare dagli epatociti"],"ans":0,"why":"Il ritmo si riallinea in pochi giorni con il cortisolo.","note":null,"fixed":false},{"id":"m5a-04","topic":"m5-approfondimenti","level":"a","page":"159","src":"Biochimica II","q":"Nel lobulo epatico, dove prevale la gluconeogenesi?","opts":["Negli epatociti periportali","Negli epatociti perivenosi (centrolobulari)","In modo uniforme in tutto il lobulo","Nelle cellule di Kupffer","Nelle cellule stellate"],"ans":0,"why":"Periportale: gluconeogenesi, ossidazione degli acidi grassi, urea. Perivenoso: glicolisi, lipogenesi, sintesi di glutammina.","note":null,"fixed":false},{"id":"m5a-05","topic":"m5-approfondimenti","level":"a","page":"153","src":"Biochimica II","q":"Topi con PEPCK espressa in modo costitutivo nel muscolo:","opts":["Correvano molto più a lungo, usavano più acidi grassi e producevano meno lattato","Erano obesi e sedentari, con accumulo di glicogeno nel muscolo e nel fegato","Avevano ipoglicemia grave, perché il muscolo consumava tutto il glucosio del sangue","Non mostravano differenze di resistenza, ma avevano più massa muscolare dei normali","Correvano meno, perché il muscolo produceva troppo lattato e consumava più glicogeno"],"ans":0,"why":"Mostravano anche più mitocondri e più sensibilità all'insulina, ma erano aggressivi.","note":null,"fixed":false},{"id":"m5a-06","topic":"m5-approfondimenti","level":"l","page":"157","src":"Biochimica II","q":"Nella cascata del glucagone, quale enzima attiva la glicogeno fosforilasi?","opts":["Fosforilasi chinasi","Protein chinasi A direttamente","Adenilato ciclasi","Glicogeno sintasi chinasi 3","Protein fosfatasi 1"],"ans":0,"why":"Glucagone → cAMP → PKA → fosforilasi chinasi → fosforilasi a.","note":"Sbobina di Biochimica II, p. 156: c'è scritto che il cAMP «fosforila enzimi chiave come la PKA». Il cAMP attiva la PKA legandosi alle subunità regolatrici; a fosforilare è la PKA.","fixed":false},{"id":"m6r-01","topic":"m6-reazioni","level":"f","page":"159","src":"Biochimica II","q":"Quali sono i due prodotti principali della via dei pentoso fosfati?","opts":["NADPH e ribosio 5-fosfato","NADH e glucosio 6-fosfato","ATP e ribulosio 5-fosfato","NADPH e desossiribosio","FADH₂ e xilulosio 5-fosfato"],"ans":0,"why":"Il NADPH serve alle biosintesi riduttive e alla difesa antiossidante; il ribosio 5-P ai nucleotidi.","note":null,"fixed":false},{"id":"m6r-02","topic":"m6-reazioni","level":"f","page":"159","src":"Biochimica II","q":"Dove avviene la via dei pentoso fosfati?","opts":["Nel citosol","Nella matrice mitocondriale","Nel reticolo endoplasmatico","Nel nucleo","Nei lisosomi"],"ans":0,"why":"Come la glicolisi, con cui condivide intermedi.","note":null,"fixed":false},{"id":"m6r-03","topic":"m6-reazioni","level":"f","page":"160","src":"Biochimica II","q":"Quale enzima catalizza la prima reazione della via?","opts":["Glucosio 6-fosfato deidrogenasi","Transchetolasi (con TPP)","Esochinasi I (ubiquitaria)","6-fosfogluconato deidrogenasi","Lattonasi (6-fosfogluconolattonasi)"],"ans":0,"why":"Ossida il glucosio 6-P a 6-fosfoglucono-δ-lattone, riducendo NADP⁺.","note":null,"fixed":false},{"id":"m6r-04","topic":"m6-reazioni","level":"m","page":"160–161","src":"Biochimica II","q":"Quanti NADPH produce la fase ossidativa per glucosio 6-fosfato?","opts":["2","1","3","4","6"],"ans":0,"why":"Uno dalla G6PD, uno dalla 6-fosfogluconato deidrogenasi; si libera anche una CO₂.","note":null,"fixed":false},{"id":"m6r-05","topic":"m6-reazioni","level":"m","page":"162","src":"Biochimica II","q":"Che cosa trasferisce la transchetolasi?","opts":["Un frammento di 2 atomi di carbonio","Un frammento di 3 atomi di carbonio","Un gruppo fosfato dal C1 al C6","Un'unità di CO₂ legata alla biotina","Un frammento di 4 atomi di carbonio"],"ans":0,"why":"La transaldolasi trasferisce invece 3 carboni.","note":null,"fixed":false},{"id":"m6r-06","topic":"m6-reazioni","level":"m","page":"162","src":"Biochimica II","q":"Quale coenzima usa la transchetolasi?","opts":["Tiamina pirofosfato","Piridossal fosfato","Biotina (vitamina H)","NADP⁺ legato","Acido lipoico"],"ans":0,"why":"Per questo l'attività della transchetolasi eritrocitaria si usa per valutare la carenza di tiamina.","note":null,"fixed":false},{"id":"m6r-07","topic":"m6-reazioni","level":"a","page":"161","src":"Biochimica II","q":"Quale enzima converte il ribulosio 5-P in ribosio 5-P?","opts":["Ribosio 5-fosfato isomerasi","Ribulosio 5-fosfato epimerasi","Transaldolasi (con base di Schiff)","Fosfopentosio mutasi","Ribosio fosfato pirofosfochinasi"],"ans":0,"why":"L'epimerasi forma invece lo xilulosio 5-P.","note":null,"fixed":false},{"id":"m6r-08","topic":"m6-reazioni","level":"a","page":"163","src":"Biochimica II","q":"Se la cellula ha bisogno solo di NADPH e non di ribosio, che cosa succede ai pentosi?","opts":["Transchetolasi e transaldolasi li riconvertono in fruttosio 6-P e gliceraldeide 3-P","Restano come ribosio 5-P e vengono esportati nel sangue per le biosintesi degli altri tessuti","Si accumulano nel citosol come riserva di pentosi per le sintesi successive","Entrano direttamente nel ciclo di Krebs come intermedi a cinque carboni","La ribosio 5-P isomerasi li trasforma in glucosio libero, che esce dalla cellula"],"ans":0,"why":"Riciclando, in teoria tutto il glucosio può essere ossidato a CO₂ producendo 12 NADPH.","note":null,"fixed":false},{"id":"m6r-09","topic":"m6-reazioni","level":"a","page":"164","src":"Biochimica II","q":"Se la cellula ha bisogno di ribosio e non di NADPH?","opts":["Usa solo la fase non ossidativa al contrario, partendo da fruttosio 6-P e gliceraldeide 3-P","Non può produrre ribosio senza fare anche la fase ossidativa, che dà sempre 2 NADPH per G6P","Usa la gluconeogenesi per trasformare il piruvato direttamente in ribosio","Usa solo la G6PD, bloccando la 6-fosfogluconato deidrogenasi a valle del lattone","Trasforma il glicogeno in ribosio tramite la fosforilasi e la ribosio 5-P isomerasi"],"ans":0,"why":"La fase non ossidativa è completamente reversibile.","note":"Sbobina di Biochimica II, p. 164: c'è scritto che «questa via è detta gluconeogenesi». Riformare glucosio 6-P dai pentosi non è la gluconeogenesi vera e propria, che parte da precursori non glucidici.","fixed":false},{"id":"m6r-10","topic":"m6-reazioni","level":"l","page":"160","src":"Biochimica II","q":"Come si chiama il prodotto della glucosio 6-fosfato deidrogenasi?","opts":["6-Fosfoglucono-δ-lattone","6-Fosfogluconato","Ribulosio 5-fosfato","Gluconolattone 1-fosfato","6-Fosfoglucono-γ-lattone"],"ans":0,"why":"Una lattonasi lo idrolizza poi a 6-fosfogluconato.","note":null,"fixed":false},{"id":"m6r-11","topic":"m6-reazioni","level":"l","page":"160","src":"Biochimica II","q":"Quale enzima idrolizza il lattone in 6-fosfogluconato?","opts":["6-Fosfogluconolattonasi","Glucosio 6-fosfatasi","Lattato deidrogenasi","6-Fosfogluconato deidrogenasi","Gluconato chinasi"],"ans":0,"why":"La reazione avverrebbe anche spontaneamente, ma più lentamente.","note":null,"fixed":false},{"id":"m6r-12","topic":"m6-reazioni","level":"l","page":"162","src":"Biochimica II","q":"Quale zucchero a 7 atomi di carbonio si forma nella fase non ossidativa?","opts":["Sedoeptulosio 7-fosfato","Eritrosio 7-fosfato (dalla transaldolasi)","Xilulosio 7-fosfato","Ribulosio 7-fosfato","Fruttosio 7-fosfato"],"ans":0,"why":"L'eritrosio 4-P invece ha 4 carboni ed è precursore degli amminoacidi aromatici nelle piante.","note":null,"fixed":false},{"id":"m6g-01","topic":"m6-regolazione","level":"f","page":"165","src":"Biochimica II","q":"Qual è l'enzima regolatore della via dei pentoso fosfati?","opts":["Glucosio 6-fosfato deidrogenasi","6-fosfogluconato deidrogenasi (seconda tappa ossidativa)","Ribosio 5-fosfato isomerasi A","Transchetolasi (con TPP)","6-fosfogluconolattonasi"],"ans":0,"why":"Catalizza la prima reazione, irreversibile.","note":null,"fixed":false},{"id":"m6g-02","topic":"m6-regolazione","level":"m","page":"165","src":"Biochimica II","q":"Che cosa regola principalmente la G6PD?","opts":["Il rapporto NADP⁺/NADPH","Il livello di ATP","Il glucagone tramite PKA","Il calcio citosolico","Il rapporto NAD⁺/NADH"],"ans":0,"why":"Il NADPH la inibisce; quando viene consumato, il NADP⁺ la attiva.","note":null,"fixed":false},{"id":"m6g-03","topic":"m6-regolazione","level":"a","page":"165","src":"Biochimica II","q":"In quali tessuti la via dei pentoso fosfati è particolarmente attiva?","opts":["Fegato, tessuto adiposo, ghiandola mammaria in lattazione, surrene, eritrociti","Muscolo scheletrico, cuore, diaframma e cervello, dove il consumo di energia è massimo","Cervello e midollo spinale, che usano quasi solo glucosio come fonte di energia","Osso e cartilagine, dove serve NADPH per la sintesi della matrice extracellulare","Rene e intestino tenue, dove la via fornisce l'energia per il trasporto del glucosio"],"ans":0,"why":"Sono tessuti con molta sintesi di acidi grassi o steroidi, o con forte stress ossidativ diluizione del ligando"],"ans":0,"why":"Nelle sinapsi la diluizione e la degradazione del neurotrasmettitore spostano subito l'equilibrio verso la forma dissociata.","note":null,"fixed":false},{"id":"b1r-01","topic":"bm1-recettore-ligando","level":"f","page":"lezione 1","src":"Biologia molecolare","q":"Che relazione c'è tra Ka e Kd?","opts":["Kd = 1/Ka","Kd = Ka","Kd = Ka²","Non sono collegate"],"ans":0,"why":"Kd bassa significa alta affinità.","note":null,"fixed":false},{"id":"b1r-02","topic":"bm1-recettore-ligando","level":"m","page":"lezione 1","src":"Biologia molecolare","q":"Come si riconosce il legame specifico in una curva di saturazione recettore-ligando?","opts":["Cresce rapidamente e raggiunge un plateau (Bmax) quando i siti sono saturi","Cresce lentamente e linearmente con il ligando, senza mai raggiungere un plateau","Diminuisce aumentando il ligando, perché i recettori vengono internalizzati","Non dipende dalla concentrazione di ligando, perché i siti sono sempre occupati","Ha un andamento sigmoide che non satura, perché i siti continuano ad aumentare"],"ans":0,"why":"Il legame aspecifico cresce lentamente e non satura.","note":null,"fixed":false},{"id":"b1r-03","topic":"bm1-recettore-ligando","level":"a","page":"lezione 1","src":"Biologia molecolare","q":"Nel grafico di Scatchard (legato/libero contro legato), che cosa dà la pendenza?","opts":["−1/Kd","Bmax","Kd","−Bmax","1/Bmax"],"ans":0,"why":"L'intercetta con l'asse dei legati dà Bmax, il numero massimo di siti.","note":null,"fixed":false},{"id":"b1r-04","topic":"bm1-recettore-ligando","level":"l","page":"lezione 1","src":"Biologia molecolare","q":"Perché l'analisi di Scatchard è utile in farmacologia?","opts":["Stima affinità e numero di recettori, utili per dosare agonisti e antagonisti","Misura la velocità massima degli enzimi bersaglio e la loro costante catalitica","Misura il punto isoelettrico dei recettori e la loro carica a pH fisiologico","Determina la sequenza amminoacidica del recettore e i suoi domini funzionali","Stima l'emivita del farmaco nel plasma e la sua velocità di eliminazione renale"],"ans":0,"why":"Molti farmaci agiscono come agonisti o antagonisti del ligando naturale.","note":null,"fixed":false},{"id":"bh1r-01","topic":"bm1-recettore-ligando","level":"h","page":"lezione 1","src":"Biologia molecolare","q":"Due farmaci si legano allo stesso recettore: A ha Kd = 1 nM, B ha Kd = 100 nM. Quale affermazione è corretta?","opts":["A ha affinità 100 volte maggiore: bastano concentrazioni più basse per occupare metà dei recettori","B ha affinità maggiore perché la sua Kd è più alta: lega più farmaco per ogni recettore occupato","Hanno la stessa affinità se hanno lo stesso Bmax: la Kd indica solo la velocità di dissociazione","A occupa per forza più recettori a saturazione: con Kd bassa il Bmax del farmaco A è maggiore","La Kd non dice nulla sull'affinità: per confrontarle serve conoscere la concentrazione di recettore"],"ans":0,"why":"La Kd è la concentrazione di ligando che occupa il 50% dei siti; Bmax (numero di siti) non dipende dal farmaco.","note":null,"fixed":false},{"id":"b1i-01","topic":"bm1-intra-superficie","level":"f","page":"lezione 1","src":"Biologia molecolare","q":"Dove si trova il recettore di un ormone idrofobico?","opts":["Nella cellula (citosol o nucleo)","Sulla membrana plasmatica (GPCR)","Nella matrice extracellulare","Nel sangue (proteine di trasporto)","Nel reticolo endoplasmatico liscio"],"ans":0,"why":"L'ormone attraversa la membrana; nel sangue viaggia legato a proteine di trasporto.","note":null,"fixed":false},{"id":"b1i-02","topic":"bm1-intra-superficie","level":"f","page":"lezione 1","src":"Biologia molecolare","q":"Quale dominio riconosce le fosfotirosine?","opts":["SH2","SH3","PH","Zinc finger"],"ans":0,"why":"Anche il dominio PTB lega fosfotirosine; SH3 lega sequenze ricche di prolina; PH lega fosfoinositidi.","note":null,"fixed":false},{"id":"b1i-03","topic":"bm1-intra-superficie","level":"m","page":"lezione 1","src":"Biologia molecolare","q":"Che cos'è un secondo messaggero?","opts":["Una piccola molecola intracellulare che amplifica il segnale del complesso recettore-ligando","L'ormone stesso, che entra nella cellula e agisce direttamente sugli enzimi bersaglio del citosol","Il recettore attivato, che si stacca dalla membrana e migra nel nucleo per agire sulla trascrizione","La proteina di trasporto che porta l'ormone nel sangue fino alla cellula bersaglio","Un secondo ormone rilasciato dalla cellula bersaglio che agisce sulle cellule vicine"],"ans":0,"why":"Esempi: Ca²⁺, cAMP, cGMP, DAG, fosfoinositidi.","note":null,"fixed":false},{"id":"b1i-04","topic":"bm1-intra-superficie","level":"m","page":"lezione 1","src":"Biologia molecolare","q":"Da quale precursore derivano catecolamine e ormoni tiroidei?","opts":["Tirosina","Colesterolo","Triptofano","Glutammato"],"ans":0,"why":"Gli ormoni steroidei derivano dal colesterolo.","note":null,"fixed":false},{"id":"b1i-05","topic":"bm1-intra-superficie","level":"a","page":"lezione 1","src":"Biologia molecolare","q":"A cosa servono le proteine adattatrici (scaffold)?","opts":["Avvicinano i partner della cascata rendendo la segnalazione rapida ed efficiente","Degradano i secondi messaggeri e spengono il segnale appena il ligando si stacca","Trasportano gli ormoni idrofobici nel sangue fino alle cellule bersaglio","Formano il poro dei recettori canale e ne regolano l'apertura e la chiusura","Fosforilano direttamente i fattori di trascrizione e li portano nel nucleo"],"ans":0,"why":"Usano domini SH2, PTB, PH e SH3 per tenere insieme recettore, chinasi e bersagli.","note":null,"fixed":false},{"id":"b1i-06","topic":"bm1-intra-superficie","level":"l","page":"lezione 1","src":"Biologia molecolare","q":"Quale dominio posiziona una proteina sulla membrana legando il fosfatidilinositolo?","opts":["PH","SH2","SH3","PTB","DD"],"ans":0,"why":"Il dominio PH lega i fosfoinositidi di membrana.","note":null,"fixed":false},{"id":"bh1i-01","topic":"bm1-intra-superficie","level":"h","page":"lezione 1","src":"Biologia molecolare","q":"Perché un ormone peptidico non agisce direttamente sui geni come uno steroide?","opts":["È idrofilico, non attraversa la membrana: lega un recettore di superficie che genera secondi messaggeri","È idrofobico ma troppo grande per attraversare la membrana: entra per endocitosi e viene degradato nei lisosomi","Viene sempre degradato nel sangue dalle proteasi plasmatiche, molto prima di poter raggiungere il nucleo","I peptidi non possono legare proteine nucleari, quindi agiscono solo su enzimi del citosol","Agisce solo su cellule vicine (paracrino), che non possiedono recettori nucleari per i peptidi"],"ans":0,"why":"Gli effetti sui geni possono comunque arrivare, ma indirettamente (es. CREB fosforilato dalla PKA).","note":null,"fixed":false},{"id":"b2c-01","topic":"bm2-canali","level":"f","page":"lezione 2","src":"Biologia molecolare","q":"Quali sono le quattro famiglie di recettori di membrana?","opts":["Recettori canale, accoppiati a proteine G, con attività catalitica, per le citochine","Nucleari, citosolici, di membrana plasmatica e mitocondriali, classificati in base alla sede","Recettori canale, accoppiati a proteine G, nucleari, per gli ormoni steroidei e tiroidei","Tirosin-chinasici, serin-chinasici, fosfatasi e proteasi di membrana","Recettori canale, con attività catalitica, per le integrine e per le caderine"],"ans":0,"why":"Sono i quattro tipi trattati a lezione.","note":null,"fixed":false},{"id":"b2c-02","topic":"bm2-canali","level":"f","page":"lezione 2","src":"Biologia molecolare","q":"Il recettore nicotinico dell'acetilcolina è:","opts":["Un canale per cationi controllato da ligando","Un recettore a 7 eliche accoppiato a proteina G","Un recettore tirosin-chinasico dimerico","Un recettore nucleare che lega il DNA","Un canale per anioni (Cl⁻) controllato da ligando"],"ans":0,"why":"Il muscarinico invece è un GPCR.","note":null,"fixed":false},{"id":"b2c-03","topic":"bm2-canali","level":"m","page":"lezione 2","src":"Biologia molecolare","q":"Quali neurotrasmettitori sono inibitori e perché?","opts":["GABA e glicina: aprono canali per anioni (Cl⁻) e iperpolarizzano","Acetilcolina e glutammato: aprono canali per Na⁺ e iperpolarizzano","Serotonina e ATP: aprono canali per Ca²⁺ e iperpolarizzano la membrana","Adrenalina e glicina: chiudono canali per K⁺ e depolarizzano","GABA e glutammato: aprono canali per cationi (Na⁺) e depolarizzano"],"ans":0,"why":"Gli eccitatori aprono canali per cationi e depolarizzano.","note":null,"fixed":false},{"id":"b2c-04","topic":"bm2-canali","level":"m","page":"lezione 2","src":"Biologia molecolare","q":"Come si spegne il segnale dell'acetilcolina?","opts":["Diffusione e idrolisi da parte dell'acetilcolinesterasi; la colina viene ricaptata e riutilizzata","Endocitosi del recettore nicotinico e sua successiva degradazione nei lisosomi della fibra muscolare","Attività GTPasica intrinseca del recettore, che idrolizza il GTP e chiude il canale","Fosforilazione del recettore da parte della PKA, che lo stacca dalla proteina G","Ricaptazione dell'acetilcolina intera nel terminale e sua idrolisi da parte delle MAO mitocondriali"],"ans":0,"why":"Con affinità bassa, la diluizione sposta l'equilibrio verso la forma dissociata.","note":null,"fixed":false},{"id":"b2c-05","topic":"bm2-canali","level":"a","page":"lezione 2","src":"Biologia molecolare","q":"Differenza tra curari veri e depolarizzanti:","opts":["I veri sono antagonisti dell'acetilcolina; i depolarizzanti (succinilcolina) sono agonisti che desensibilizzano il recettore","I veri sono agonisti che desensibilizzano il recettore; i depolarizzanti (succinilcolina) sono antagonisti dell'acetilcolina","Entrambi inibiscono l'acetilcolinesterasi: i veri in modo reversibile, i depolarizzanti (succinilcolina) in modo irreversibile","I veri bloccano i canali del Na⁺ della fibra muscolare; i depolarizzanti (succinilcolina) bloccano i canali del Ca²⁺","I veri agiscono sui recettori muscarinici; i depolarizzanti (succinilcolina) aprono i canali K⁺ e iperpolarizzano il muscolo"],"ans":0,"why":"La succinilcolina dà prima fascicolazioni e poi paralisi flaccida.","note":null,"fixed":false},{"id":"b2c-06","topic":"bm2-canali","level":"a","page":"lezione 2","src":"Biologia molecolare","q":"Perché la neostigmina antagonizza l'effetto di un curaro vero?","opts":["Inibisce l'acetilcolinesterasi: più acetilcolina compete con il curaro per il recettore","Lega direttamente il curaro nel plasma e lo inattiva prima che raggiunga la placca motrice","Attiva i recettori muscarinici, che sostituiscono i nicotinici bloccati nella contrazione","Blocca i canali del Na⁺ voltaggio-dipendenti, prolungando la depolarizzazione della fibra","Stimola la sintesi di acetilcolina nel terminale, che compete con il curaro per l'enzima"],"ans":0,"why":"Gli inibitori delle colinesterasi si usano anche in Alzheimer e myasthenia gravis.","note":null,"fixed":false},{"id":"b2c-07","topic":"bm2-canali","level":"a","page":"lezione 2","src":"Biologia molecolare","q":"Quali recettori muscarinici agiscono inibendo l'adenilato ciclasi?","opts":["M2 e M4 (numero pari)","M1, M3 e M5 (numero dispari)","Solo M1 (neuronale)","Tutti i cinque sottotipi","M3 e M5 (ghiandolari)"],"ans":0,"why":"I dispari agiscono attraverso la via dei fosfoinositidi.","note":null,"fixed":false},{"id":"b2c-08","topic":"bm2-canali","level":"l","page":"lezione 2","src":"Biologia molecolare","q":"Quale elica di ogni subunità del recettore nicotinico riveste il poro?","opts":["L'elica 2","L'elica 1","L'elica 4","L'elica 7"],"ans":0,"why":"Porta residui acidi che rendono il canale selettivo per i cationi; nel GABA-A porta residui basici (anioni).","note":null,"fixed":false},{"id":"b2c-09","topic":"bm2-canali","level":"l","page":"lezione 2","src":"Biologia molecolare","q":"Da quale molecola deriva il GABA?","opts":["Glutammato, per decarbossilazione","Glicina, per transamminazione","Tirosina, per idrossilazione","Triptofano, per decarbossilazione","Acetil-CoA, per condensazione"],"ans":0,"why":"Enzima: glutammato decarbossilasi.","note":null,"fixed":false},{"id":"b2c-10","topic":"bm2-canali","level":"l","page":"lezione 2","src":"Biologia molecolare","q":"Quale enzima sintetizza l'acetilcolina?","opts":["Colina acetiltransferasi","Acetilcolinesterasi (AChE)","Butirrilcolinesterasi","Glutammato decarbossilasi"],"ans":0,"why":"Acetil-CoA + colina → acetilcolina.","note":"Sbobina di Biologia molecolare, lezione 2: chiama «colinesterasi» l'enzima di sintesi; la colinesterasi la degrada, la sintesi è della colina acetiltransferasi.","fixed":false},{"id":"bh2c-01","topic":"bm2-canali","level":"h","page":"lezione 2","src":"Biologia molecolare","q":"Un paziente esposto a un gas nervino (inibitore irreversibile dell'acetilcolinesterasi) ha paralisi. Quale ragionamento spiega l'uso di un antagonista come l'atropina?","opts":["L'acetilcolina si accumula e iperstimola i recettori: un antagonista ne blocca l'azione e riequilibra il sistema","L'atropina riattiva l'acetilcolinesterasi bloccata, staccando il gas nervino dal sito attivo dell'enzima","L'atropina aumenta la sintesi di acetilcolina, compensando la perdita di segnale dovuta al gas nervino","L'atropina degrada il gas nervino nel plasma prima che raggiunga le sinapsi, impedendo nuovi danni","L'acetilcolina scende a zero perché il gas nervino la distrugge: l'atropina ne simula l'azione sul recettore"],"ans":0,"why":"Bloccare l'enzima che spegne il segnale lascia l'acetilcolina alta; l'antagonista toglie l'eccesso di stimolazione (l'atropina agisce sui muscarinici).","note":null,"fixed":false},{"id":"bh2c-02","topic":"bm2-canali","level":"h","page":"lezione 2","src":"Biologia molecolare","q":"Il GABA-B riduce l'eccitabilità del neurone. Con quale meccanismo?","opts":["Eterodimero GPCR: le subunità βγ della proteina G chiudono i canali Ca²⁺ e aprono quelli K⁺","Recettore canale: apre direttamente un poro per il Cl⁻ che iperpolarizza la membrana del neurone","Recettore catalitico: attiva una tirosin-chinasi che fosforila e chiude i canali Na⁺ voltaggio-dipendenti","Eterodimero GPCR: la subunità αs attiva l'adenilato ciclasi e apre i canali Ca²⁺","Recettore nucleare: lega il DNA e reprime la trascrizione dei geni eccitatori"],"ans":0,"why":"L'uscita di K⁺ iperpolarizza la membrana. Il GABA-A è invece il recettore canale per il Cl⁻.","note":null,"fixed":false},{"id":"b2r-01","topic":"bm2-rtk","level":"f","page":"lezione 2","src":"Biologia molecolare","q":"Come si attivano i recettori tirosin-chinasici?","opts":["Il ligando ne induce la dimerizzazione e l'autofosforilazione incrociata sulle tirosine","Il ligando li apre come un canale ionico e il Ca²⁺ entrato attiva il dominio chinasico","Il ligando fa scambiare GDP con GTP sulla subunità α associata alla coda intracellulare","Il ligando li fa entrare nel nucleo, dove fosforilano direttamente i fattori di trascrizione","Il ligando ne induce la dimerizzazione e la fosforilazione incrociata sulle serine da parte della PKA"],"ans":0,"why":"Le fosfotirosine reclutano proteine con domini SH2.","note":null,"fixed":false},{"id":"b2r-02","topic":"bm2-rtk","level":"f","page":"lezione 2","src":"Biologia molecolare","q":"Ras è attiva quando lega:","opts":["GTP","GDP","ATP","cAMP"],"ans":0,"why":"È una piccola proteina G monomerica ancorata alla membrana per prenilazione.","note":null,"fixed":false},{"id":"b2r-03","topic":"bm2-rtk","level":"m","page":"lezione 2","src":"Biologia molecolare","q":"Qual è l'ordine della via di Ras?","opts":["RTK → SOS → Ras → Raf → MEK → MAP chinasi → fos/jun","RTK → Raf → Ras → MEK → MAP chinasi → STAT","RTK → SOS → Raf → Ras → MAP chinasi → MEK → fos/jun","RTK → GRB2 → PKA → Ras → MEK → CREB","RTK → Ras → SOS → MEK → Raf → MAP chinasi → fos/jun"],"ans":0,"why":"La MAP chinasi fosforilata entra nel nucleo e attiva fattori di trascrizione.","note":null,"fixed":false},{"id":"b2r-04","topic":"bm2-rtk","level":"m","page":"lezione 2","src":"Biologia molecolare","q":"Che ruolo hanno GEF e GAP su Ras?","opts":["GEF scambia GDP con GTP (attiva); GAP stimola l'idrolisi del GTP (spegne)","GEF idrolizza il GTP (spegne); GAP scambia GDP con GTP (attiva)","Entrambi la attivano: GEF in membrana, GAP nel citosol con il GTP","Entrambi la fosforilano: GEF su serine (attiva), GAP su tirosine (spegne)","GEF lega Ras al recettore (attiva); GAP la stacca dalla membrana (spegne)"],"ans":0,"why":"Si legano alla stessa regione di Ras: agisce l'una o l'altra.","note":null,"fixed":false},{"id":"b2r-05","topic":"bm2-rtk","level":"a","page":"lezione 2","src":"Biologia molecolare","q":"Una mutazione impedisce a Ras di idrolizzare il GTP. Che cosa succede?","opts":["Ras resta sempre attiva e la via proliferativa è accesa anche senza fattore di crescita","Ras resta sempre inattiva e la via proliferativa non si accende neanche con il fattore di crescita","Il recettore non dimerizza più e la via si ferma a monte di Ras, senza autofosforilazione","Si blocca solo MEK, mentre Raf e la MAP chinasi restano attivabili normalmente dal recettore","Ras resta legata al GDP e SOS non riesce più a caricare il GTP, spegnendo la cascata"],"ans":0,"why":"È il meccanismo di molte mutazioni oncogeniche di Ras.","note":null,"fixed":false},{"id":"b2r-06","topic":"bm2-rtk","level":"a","page":"lezione 2","src":"Biologia molecolare","q":"Come si è capito che MEK sta a valle di Ras e Raf?","opts":["In un mutante Ras bloccato su GDP (N17), un Raf oncogenico ripristina l'attivazione di MEK","Con la cristallografia di MEK legato a Raf e a Ras, che ha mostrato l'ordine di contatto","Bloccando MEK con un inibitore, Ras non si attiva più: quindi MEK sta a monte di Ras","Misurando il cAMP prodotto da MEK dopo l'attivazione di Ras con il fattore di crescita","In un mutante Raf inattivo, una Ras oncogenica ripristina comunque l'attivazione di MEK"],"ans":0,"why":"Se un attivatore a valle bypassa il blocco a monte, sta più in basso nella cascata.","note":null,"fixed":false},{"id":"b2r-07","topic":"bm2-rtk","level":"l","page":"lezione 2","src":"Biologia molecolare","q":"Su quali residui viene fosforilata la MAP chinasi?","opts":["Thr183 e Tyr185","Ser e Thr qualsiasi","Tyr del dominio SH2","His e Asp"],"ans":0,"why":"Si trovano nella regione «labbro» e ne cambiano la conformazione.","note":null,"fixed":false},{"id":"b2r-08","topic":"bm2-rtk","level":"l","page":"lezione 2","src":"Biologia molecolare","q":"Che cosa ha di particolare il recettore dell'insulina?","opts":["È già un tetramero (2α + 2β) anche senza ligando","È un canale ionico che si apre quando lega l'insulina","Non ha attività chinasica e usa la JAK associata","È un recettore nucleare che lega l'insulina nel citosol","È un monomero che dimerizza solo dopo il legame"],"ans":0,"why":"Le subunità α legano l'insulina, le β hanno attività tirosin-chinasica.","note":null,"fixed":false},{"id":"bh2r-01","topic":"bm2-rtk","level":"h","page":"lezione 2","src":"Biologia molecolare","q":"In una cellula tumorale il recettore EGF è sovraespresso, ma il fattore di crescita è normale. Perché la via proliferativa è comunque iperattiva?","opts":["Con molti recettori in membrana la dimerizzazione avviene anche senza ligando","Con molti recettori in membrana il recettore diventa un canale ionico sempre aperto","Con tanti recettori Ras perde il GTP più in fretta e resta attiva più a lungo nel tempo","Con molti recettori manca SOS, quindi Ras resta carica di GTP senza essere regolata","Con molti recettori questi migrano nel nucleo e attivano direttamente la trascrizione"],"ans":0,"why":"Ipersintesi del recettore, recettore attivo da monomero o fattore di crescita sovraespresso: tutte accendono la via in modo anomalo.","note":null,"fixed":false},{"id":"bh2r-02","topic":"bm2-rtk","level":"h","page":"lezione 2","src":"Biologia molecolare","q":"Una cellula ha una GAP non funzionante. Quale effetto ti aspetti?","opts":["Ras resta più a lungo nella forma GTP e la via MAPK è iperattiva","Ras non si attiva mai, perché senza GAP non può caricare il GTP","Il recettore non si autofosforila e la via MAPK resta spenta","Aumenta il cAMP, perché Ras attiva l'adenilato ciclasi al posto di Raf","La MAP chinasi non entra nel nucleo e i geni bersaglio restano spenti"],"ans":0,"why":"La GAP spegne Ras accelerandone l'attività GTPasica; perderla equivale a mantenere Ras accesa.","note":null,"fixed":false},{"id":"b2t-01","topic":"bm2-terapia","level":"f","page":"lezione 2","src":"Biologia molecolare","q":"Contro quale recettore è diretto il trastuzumab?","opts":["HER2","HER1 (EGFR)","HER3","Recettore dell'insulina"],"ans":0,"why":"È un anticorpo monoclonale umanizzato ricombinante; il cetuximab è contro HER1.","note":null,"fixed":false},{"id":"b2t-02","topic":"bm2-terapia","level":"m","page":"lezione 2","src":"Biologia molecolare","q":"Perché HER2 è importante nei tumori pur non legando fattori di crescita?","opts":["Forma eterodimeri con gli altri HER e li attiva","È un canale ionico che depolarizza la cellula tumorale","Degrada gli altri HER e libera i loro fattori di crescita","Lega direttamente il DNA come un fattore di trascrizione","Forma omodimeri solo con EGF e li rende sempre attivi"],"ans":0,"why":"La sua sovraespressione favorisce la proliferazione.","note":null,"fixed":false},{"id":"b2t-03","topic":"bm2-terapia","level":"a","page":"lezione 2","src":"Biologia molecolare","q":"Quale tumore è associato a HER3 nella sbobina?","opts":["Carcinoma mammario","Glioblastoma","Tumore dell'ovaio","Tumore della vescica"],"ans":0,"why":"HER1: vescica, seno, rene, prostata, glioblastoma; HER4: ovaio.","note":null,"fixed":false},{"id":"b2t-04","topic":"bm2-terapia","level":"l","page":"lezione 2","src":"Biologia molecolare","q":"Contro quale recettore è diretto il cetuximab?","opts":["HER1 (EGFR)","HER2 (ErbB2)","HER4 (ErbB4)","TGF-β (tipo II)","HER3 (ErbB3)"],"ans":0,"why":"Entrambi sono anticorpi monoclonali.","note":null,"fixed":false},{"id":"bh2t-01","topic":"bm2-terapia","level":"h","page":"lezione 2","src":"Biologia molecolare","q":"Quali due strategie terapeutiche contro i recettori tirosin-chinasici descrive la sbobina?","opts":["Molecole anti-recettore che bloccano la segnalazione e anticorpi monoclonali selettivi","Inibitori dell'acetilcolinesterasi e curari, che bloccano la trasmissione del segnale","Analoghi del cAMP e inibitori delle fosfodiesterasi, che spengono la via di Ras e Raf","Agonisti di Ras e inibitori di GAP, che esauriscono la cellula tumorale per iperstimolo","Steroidi e ormoni tiroidei, che riducono la trascrizione dei recettori nel nucleo"],"ans":0,"why":"L'immunoterapia colpisce i recettori attivati in modo anomalo nella trasformazione.","note":null,"fixed":false},{"id":"b2s-01","topic":"bm2-sertre","level":"f","page":"lezione 2","src":"Biologia molecolare","q":"Quali ligandi legano i recettori serin/treonin-chinasici?","opts":["TGF-β e BMP","Insulina ed EGF","Acetilcolina e GABA","EPO e interleuchine","PDGF e NGF"],"ans":0,"why":"Le loro mutazioni contribuiscono ad alcune forme di cancro.","note":null,"fixed":false},{"id":"b2s-02","topic":"bm2-sertre","level":"m","page":"lezione 2","src":"Biologia molecolare","q":"Quali proteine trasmettono il segnale del TGF-β al nucleo?","opts":["Le Smad","Le STAT","MAP chinasi","CREB"],"ans":0,"why":"Fosforilate, formano eterodimeri, aumentano l'affinità per il DNA e attivano geni.","note":null,"fixed":false},{"id":"b2s-03","topic":"bm2-sertre","level":"a","page":"lezione 2","src":"Biologia molecolare","q":"Che cosa cambia nelle Smad quando vengono fosforilate dal recettore?","opts":["Formano eterodimeri e la loro affinità per il DNA aumenta molto","Vengono subito degradate nel proteasoma e la loro affinità per il DNA cala","Escono dal nucleo e si legano al recettore come monomeri inattivi in membrana","Diventano canali ionici e fanno entrare Ca²⁺ che attiva la trascrizione","Formano omodimeri che fosforilano JAK e attivano STAT nel citosol"],"ans":0,"why":"Normalmente la loro affinità per il DNA è bassa.","note":null,"fixed":false},{"id":"b2s-04","topic":"bm2-sertre","level":"l","page":"lezione 2","src":"Biologia molecolare","q":"Su quali residui si autofosforilano i recettori del TGF-β?","opts":["Serina e treonina","Tirosina","Istidina e aspartato","Lisina e arginina","Tirosina e istidina"],"ans":0,"why":"Hanno un solo dominio transmembrana, N-terminale extracellulare che lega il ligando e C-terminale catalitico.","note":null,"fixed":false},{"id":"b2k-01","topic":"bm2-citochine","level":"f","page":"lezione 2","src":"Biologia molecolare","q":"Quale via di segnalazione usano i recettori per le citochine?","opts":["JAK-STAT","Ras-MAPK","cAMP-PKA","IP₃-Ca²⁺"],"ans":0,"why":"È coinvolta in processi immunitari, divisione e morte cellulare.","note":null,"fixed":false},{"id":"b2k-02","topic":"bm2-citochine","level":"m","page":"lezione 2","src":"Biologia molecolare","q":"Che differenza c'è tra un recettore per le citochine e un RTK?","opts":["Il recettore per le citochine non ha attività enzimatica: lo fosforila la chinasi JAK associata","Il recettore per le citochine è un canale ionico: lo apre la chinasi JAK associata alla membrana","L'RTK non si fosforila mai: è la JAK associata a fosforilare le proteine bersaglio","Sono identici: entrambi hanno attività tirosin-chinasica intrinseca nel dominio intracellulare","Il recettore per le citochine ha attività serin-chinasica intrinseca e non ha bisogno di JAK"],"ans":0,"why":"Negli RTK il recettore si autofosforila.","note":null,"fixed":false},{"id":"b2k-03","topic":"bm2-citochine","level":"a","page":"lezione 2","src":"Biologia molecolare","q":"Quale ormone che controlla la proliferazione dei globuli rossi usa la via JAK-STAT?","opts":["Eritropoietina","Insulina","Glucagone","Aldosterone","Tireotropina (TSH)"],"ans":0,"why":"Ha un ruolo fondamentale nell'emopoiesi.","note":null,"fixed":false},{"id":"b2k-04","topic":"bm2-citochine","level":"l","page":"lezione 2","src":"Biologia molecolare","q":"Che cosa fa STAT dopo essere stata fosforilata?","opts":["Dimerizza, entra nel nucleo e attiva la trascrizione","Fosforila JAK e la stacca dal recettore per spegnere il segnale","Apre canali ionici della membrana e fa entrare il Ca²⁺","Viene secreta e agisce come citochina sulle cellule vicine","Resta nel citosol e attiva Ras tramite il complesso GRB2-SOS"],"ans":0,"why":"Le combinazioni di diversi JAK e STAT rendono la segnalazione selettiva.","note":null,"fixed":false},{"id":"bh2k-01","topic":"bm2-citochine","level":"h","page":"lezione 2","src":"Biologia molecolare","q":"Una mutazione elimina l'attività chinasica di JAK. Quale effetto ha sulla segnalazione dell'eritropoietina?","opts":["Il recettore non viene fosforilato, STAT non si lega e non c'è attivazione genica","Il recettore si autofosforila comunque e STAT viene attivata normalmente in membrana","STAT entra nel nucleo anche senza fosforilazione e attiva i geni in modo ridotto","Aumenta la produzione di globuli rossi perché il segnale non viene più spento","Si attiva la via di Ras al suo posto, che compensa del tutto la mancanza di JAK"],"ans":0,"why":"Il recettore per le citochine dipende interamente da JAK, perché non ha un dominio catalitico.","note":null,"fixed":false},{"id":"b3g-01","topic":"bm3-gpcr","level":"f","page":"lezione 3","src":"Biologia molecolare","q":"Quante eliche transmembrana ha un GPCR?","opts":["7","12","4","1"],"ans":0,"why":"N-terminale extracellulare, C-terminale citosolico.","note":null,"fixed":false},{"id":"b3g-02","topic":"bm3-gpcr","level":"f","page":"lezione 3","src":"Biologia molecolare","q":"Quale subunità della proteina G trimerica lega GDP/GTP?","opts":["α","β","γ","Tutte e tre"],"ans":0,"why":"β e γ l'accompagnano; α e γ hanno ancore preniliche.","note":null,"fixed":false},{"id":"b3g-03","topic":"bm3-gpcr","level":"m","page":"lezione 3","src":"Biologia molecolare","q":"Quale loop del GPCR interagisce con la proteina G?","opts":["Il loop citoplasmatico C3, il più lungo","Il loop extracellulare E1, il più corto","L'N-terminale extracellulare glicosilato","Il C-terminale, sede della palmitoilazione","Il loop citoplasmatico C1, il più corto"],"ans":0,"why":"Il cambio conformazionale indotto dal ligando lo modifica.","note":null,"fixed":false},{"id":"b3g-04","topic":"bm3-gpcr","level":"m","page":"lezione 3","src":"Biologia molecolare","q":"Che cosa succede quando la Gα scambia GDP con GTP?","opts":["Perde affinità per βγ e si separa, restando in membrana, per attivare l'effettore","Si lega più forte a βγ e il trimero si stacca dalla membrana per raggiungere l'effettore","Si separa da βγ ed entra nel nucleo, dove attiva direttamente la trascrizione genica","Viene subito ubiquitinata e degradata nel proteasoma per spegnere il segnale","Resta legata a βγ e al recettore e attiva l'effettore solo dopo aver idrolizzato il GTP"],"ans":0,"why":"Gli effettori principali sono adenilato ciclasi e fosfolipasi C.","note":null,"fixed":false},{"id":"b3g-05","topic":"bm3-gpcr","level":"a","page":"lezione 3","src":"Biologia molecolare","q":"Perché le combinazioni di subunità della proteina G sono così numerose?","opts":[">20 geni per α, 5 per β e 6 per γ: oltre mille combinazioni, che permettono una regolazione fine","Ogni GPCR ha una sola proteina G dedicata, codificata dallo stesso gene del recettore","La proteina G si autoassembla a caso, quindi ogni cellula ne produce combinazioni sempre diverse e imprevedibili","Le combinazioni nascono dallo splicing alternativo del recettore, non da geni diversi","Pochi geni per α, β e γ, ma moltissime modificazioni post-traduzionali che le rendono tutte diverse"],"ans":0,"why":"Le classi di Gα si distinguono per l'effettore con cui interagiscono.","note":null,"fixed":false},{"id":"b3g-06","topic":"bm3-gpcr","level":"l","page":"lezione 3","src":"Biologia molecolare","q":"Come si chiama l'oncogene che codifica una Gαs mutata senza attività GTPasica?","opts":["gsp","ras","raf","erbB"],"ans":0,"why":"Trovato in quasi metà dei tumori ipofisari con alta produzione di GH.","note":null,"fixed":false},{"id":"bh3g-01","topic":"bm3-gpcr","level":"h","page":"lezione 3","src":"Biologia molecolare","q":"Nei tumori ipofisari con Gαs mutata (gsp) la secrezione di GH è altissima. Perché?","opts":["La Gαs non idrolizza il GTP, resta attiva e stimola continuamente l'adenilato ciclasi","La Gαs non lega più il GTP, quindi il recettore del GHRH resta sempre attivo","Il recettore del GHRH è assente e l'ipofisi secerne GH senza alcun controllo","L'ipofisi non riceve più il feedback del fegato, che smette di produrre IGF-1","La Gαs mutata attiva la fosfolipasi C al posto dell'adenilato ciclasi, alzando il Ca²⁺"],"ans":0,"why":"Senza attività GTPasica il segnale non si spegne: proliferazione e secrezione incontrollate.","note":null,"fixed":false},{"id":"b3c-01","topic":"bm3-camp","level":"f","page":"lezione 3","src":"Biologia molecolare","q":"Quale enzima produce il cAMP?","opts":["Adenilato ciclasi","Fosfodiesterasi 4","Guanilato ciclasi","Fosfolipasi C (β)"],"ans":0,"why":"ATP → cAMP + PPi; la fosfodiesterasi lo degrada ad AMP.","note":null,"fixed":false},{"id":"b3c-02","topic":"bm3-camp","level":"f","page":"lezione 3","src":"Biologia molecolare","q":"Quale chinasi è attivata dal cAMP?","opts":["PKA","PKC","PKG","MAP chinasi"],"ans":0,"why":"PKA = protein chinasi A, attivata dall'AMP ciclico.","note":null,"fixed":false},{"id":"b3c-03","topic":"bm3-camp","level":"m","page":"lezione 3","src":"Biologia molecolare","q":"Come si attiva la PKA?","opts":["Il cAMP si lega alle subunità regolatrici (2 per subunità), che rilasciano le subunità catalitiche","Viene fosforilata dal recettore attivato, che la stacca dalla membrana e la porta libera nel citosol","Lega il GTP sulla subunità catalitica, che si separa dalle subunità regolatrici come una proteina G","Il cAMP si lega alle subunità catalitiche (2 per subunità), che rilasciano le regolatrici","Entra nel nucleo, dove il cAMP la separa dal DNA e libera le subunità catalitiche"],"ans":0,"why":"Servono 4 cAMP per liberare le 2 subunità catalitiche; il legame è cooperativo.","note":null,"fixed":false},{"id":"b3c-04","topic":"bm3-camp","level":"m","page":"lezione 3","src":"Biologia molecolare","q":"Quali ormoni usano Gs e quali Gi?","opts":["Gs: adrenalina, glucagone, ACTH. Gi: prostaglandine, adenosina","Gs: prostaglandine, adenosina. Gi: adrenalina, glucagone, ACTH","Tutti usano Gs, che può attivare o inibire l'adenilato ciclasi","Gs: insulina, IGF-1. Gi: adrenalina, glucagone, noradrenalina","Gs: acetilcolina (muscarinici dispari). Gi: glucagone, ACTH"],"ans":0,"why":"Gs aumenta l'attività dell'adenilato ciclasi, Gi la riduce.","note":null,"fixed":false},{"id":"b3c-05","topic":"bm3-camp","level":"a","page":"lezione 3","src":"Biologia molecolare","q":"Che cosa fa CREB dopo essere stato fosforilato dalla PKA?","opts":["Entra nel nucleo, lega le sequenze CRE e attiva la trascrizione di geni specifici","Apre i canali del Ca²⁺ della membrana plasmatica e attiva la calmodulina nel citosol","Degrada il cAMP residuo nel citosol, spegnendo così la PKA che lo ha fosforilato","Inattiva il recettore β-adrenergico fosforilandone la coda C-terminale","Lega le sequenze CRE nel citosol e blocca la traduzione degli mRNA bersaglio"],"ans":0,"why":"La PKA può quindi modulare enzimi già presenti e anche la sintesi di nuove proteine.","note":null,"fixed":false},{"id":"b3c-06","topic":"bm3-camp","level":"a","page":"lezione 3","src":"Biologia molecolare","q":"Come agisce la tossina del colera?","opts":["ADP-ribosila un'arginina della Gαs, che non idrolizza più il GTP: cAMP sempre alto e perdita di acqua e sali","Inibisce l'adenilato ciclasi degli enterociti, che non producono più cAMP: si perdono acqua e sali","ADP-ribosila la Gαi, che resta sempre attiva: il cAMP scende e l'intestino non riassorbe più acqua e sali","Degrada il cAMP attivando la fosfodiesterasi intestinale, che apre i canali del Cl⁻ e fa perdere acqua e sali","Fosforila un'arginina della Gαs, che non lega più il GTP: il cAMP crolla e l'acqua resta nel lume"],"ans":0,"why":"Le subunità B legano un ganglioside dell'epitelio intestinale; la A1 ha l'attività enzimatica.","note":null,"fixed":false},{"id":"b3c-07","topic":"bm3-camp","level":"a","page":"lezione 3","src":"Biologia molecolare","q":"Come agisce la tossina della pertosse?","opts":["ADP-ribosila la Gαi, che non viene più attivata: l'adenilato ciclasi non è inibita e il cAMP sale","Attiva la Gαs in modo permanente, quindi l'adenilato ciclasi resta stimolata e il cAMP sale","Blocca la fosfodiesterasi del cAMP, che non viene più degradato e resta alto nella cellula","ADP-ribosila la Gαi rendendola sempre attiva: l'adenilato ciclasi resta inibita e il cAMP scende","ADP-ribosila la Gαs, che non idrolizza più il GTP: l'adenilato ciclasi è attiva e il cAMP sale"],"ans":0,"why":"La Gi modificata non può più essere attivata dal recettore.","note":"Sbobina di Biologia molecolare, lezione 3: dice che la Gi «rimane costantemente attiva» e il cAMP diminuisce; è il contrario.","fixed":false},{"id":"b3c-08","topic":"bm3-camp","level":"l","page":"lezione 3","src":"Biologia molecolare","q":"Quale proteina ancora la PKA vicino ad adenilato ciclasi e recettore?","opts":["AKAP","β-arrestina","βARK","Calmodulina"],"ans":0,"why":"AKAP5 recluta anche una fosfatasi per spegnere il segnale.","note":null,"fixed":false},{"id":"b3c-09","topic":"bm3-camp","level":"l","page":"lezione 3","src":"Biologia molecolare","q":"Che effetto ha la fosforilazione della glicogeno sintasi da parte della PKA?","opts":["La inattiva","La attiva","Nessun effetto","La porta nel nucleo"],"ans":0,"why":"La PKA attiva invece la fosforilasi chinasi, che attiva la degradazione del glicogeno.","note":"Sbobina di Biologia molecolare, lezione 3: mette la glicogeno sintasi tra le proteine «attivate» dalla PKA; la fosforilazione la inattiva.","fixed":false},{"id":"b3c-10","topic":"bm3-camp","level":"l","page":"lezione 3","src":"Biologia molecolare","q":"Con la FRET sulla PKA (sonde su subunità regolatrice e catalitica), cosa indica la perdita del segnale FRET?","opts":["Che il cAMP è salito e le subunità si sono separate","Che il cAMP è assente e le subunità sono legate tra loro","Che la PKA è stata degradata nel proteasoma","Che la proteina G è inattiva e lega il GDP","Che il cAMP è salito e le subunità si sono riunite insieme"],"ans":0,"why":"La FRET avviene solo se le due sonde sono vicinissime.","note":null,"fixed":false},{"id":"bh3c-01","topic":"bm3-camp","level":"h","page":"lezione 3","src":"Biologia molecolare","q":"Nel cuore, adrenalina e acetilcolina arrivano insieme. Come contribuiscono le subunità βγ liberate dal recettore dell'acetilcolina a bilanciare l'effetto?","opts":["Formano trimeri «spuri» con la Gαs attivata dall'adrenalina, sottraendola all'adenilato ciclasi","Attivano direttamente la PKA, che fosforila e desensibilizza il recettore β-adrenergico del cardiomiocita","Aumentano il cAMP attivando l'adenilato ciclasi, che compensa il calo dovuto alla Gαi attivata","Bloccano il recettore muscarinico, impedendo all'acetilcolina di agire troppo a lungo","Fosforilano il recettore β-adrenergico tramite la βARK e lo staccano dall'adrenalina"],"ans":0,"why":"L'acetilcolina apre anche i canali K⁺ (iperpolarizzazione), rafforzando l'effetto inibitorio.","note":null,"fixed":false},{"id":"bh3c-02","topic":"bm3-camp","level":"h","page":"lezione 3","src":"Biologia molecolare","q":"Un paziente ha diarrea acquosa profusa dopo un viaggio. Quale catena di eventi molecolari è la più coerente con il colera?","opts":["Gαs ADP-ribosilata → adenilato ciclasi sempre attiva → cAMP alto → canali aperti nell'enterocita → perdita di acqua e sali","Gαi ADP-ribosilata → adenilato ciclasi inibita → cAMP basso → riassorbimento bloccato nell'enterocita → perdita di acqua e sali","Gαs ADP-ribosilata → fosfodiesterasi attivata → cAMP basso → canali chiusi nell'enterocita → acqua trattenuta nel lume","Recettore muscarinico bloccato → Gq inattiva → IP₃ basso → Ca²⁺ basso → secrezione di acqua e sali","Gαs fosforilata → PKA inibita → chiusura dei canali Cl⁻ → riassorbimento ridotto → diarrea acquosa"],"ans":0,"why":"La tossina blocca l'attività GTPasica della Gαs: il segnale non si spegne più.","note":null,"fixed":false},{"id":"bh3c-03","topic":"bm3-camp","level":"h","page":"lezione 3","src":"Biologia molecolare","q":"Tra i bersagli della PKA c'è una fosfodiesterasi del cAMP. Che significato ha?","opts":["È un meccanismo di spegnimento: il segnale attiva l'enzima che degrada il proprio secondo messaggero","Amplifica il segnale: la fosfodiesterasi produce altro cAMP a partire dall'AMP già presente nel citosol","Serve a produrre cGMP dal cAMP, così la cellula attiva anche la PKG insieme alla PKA","Attiva la proteina G: il prodotto della fosfodiesterasi riporta la subunità Gα nella forma legata al GTP","Non ha significato fisiologico: è un bersaglio casuale della PKA, osservato solo in vitro"],"ans":0,"why":"Insieme all'attività GTPasica di Gα, alla β-arrestina e alle fosfatasi reclutate da AKAP.","note":null,"fixed":false},{"id":"b3s-01","topic":"bm3-spegnimento","level":"f","page":"lezione 3","src":"Biologia molecolare","q":"Qual è il meccanismo di spegnimento intrinseco della proteina G?","opts":["L'attività GTPasica della Gα","La fosforilazione della Gα","La degradazione della Gβγ","L'endocitosi della Gα con il recettore","L'attività GTPasica della Gβγ"],"ans":0,"why":"Idrolizzato il GTP, la Gα si riassocia a βγ nel trimero inattivo.","note":null,"fixed":false},{"id":"b3s-02","topic":"bm3-spegnimento","level":"m","page":"lezione 3","src":"Biologia molecolare","q":"Quale proteina si lega al recettore β-adrenergico fosforilato e ne blocca l'interazione con la proteina G?","opts":["β-arrestina","AKAP-79","GRB2","SOS (GEF)","Calmodulina"],"ans":0,"why":"Si lega alla stessa superficie usata dalla proteina G.","note":null,"fixed":false},{"id":"b3s-03","topic":"bm3-spegnimento","level":"a","page":"lezione 3","src":"Biologia molecolare","q":"Quale chinasi fosforila la coda C-terminale del recettore β-adrenergico e chi la richiama?","opts":["La βARK, richiamata dalle subunità βγ liberate","La PKA, richiamata dal cAMP prodotto dalla Gαs","La PKC, richiamata dal DAG di membrana","La βARK, richiamata dalla Gαs legata al GTP","La MAP chinasi, richiamata da Ras attivata"],"ans":0,"why":"Anche la PKA può fosforilare il recettore.","note":null,"fixed":false},{"id":"b3s-04","topic":"bm3-spegnimento","level":"l","page":"lezione 3","src":"Biologia molecolare","q":"Che cosa succede al recettore desensibilizzato dopo l'endocitosi?","opts":["Viene defosforilato e riportato in membrana, oppure degradato nel lisosoma","Viene sempre degradato nel lisosoma, senza possibilità di riciclo in membrana","Resta nell'endosoma per sempre, legato alla β-arrestina e al ligando","Viene secreto nello spazio extracellulare insieme all'ormone legato","Viene fosforilato di nuovo dalla PKA e torna in membrana già attivo"],"ans":0,"why":"Nell'endosoma l'arrestina si dissocia.","note":null,"fixed":false},{"id":"bh3s-01","topic":"bm3-spegnimento","level":"h","page":"lezione 3","src":"Biologia molecolare","q":"Durante una stimolazione adrenergica prolungata la risposta cardiaca diminuisce, anche se l'adrenalina è ancora legata. Perché?","opts":["Il recettore fosforilato da βARK lega la β-arrestina, non attiva più la Gs e viene internalizzato","L'adrenalina viene degradata dalle MAO del cuore e la sua concentrazione effettiva crolla","La Gs perde la sua ancora prenilica e si stacca dalla membrana, lontano dall'adenilato ciclasi","Il cAMP non attiva più la PKA, perché le subunità regolatrici vengono degradate nel tempo","L'adenilato ciclasi viene sintetizzata di meno, perché la PKA ne reprime il gene tramite CREB"],"ans":0,"why":"È la desensibilizzazione o adattamento del recettore.","note":null,"fixed":false},{"id":"b3m-01","topic":"bm3-cgmp","level":"f","page":"lezion re","q":"Come fa l'NO a provocare vasodilatazione?","opts":["↑cGMP → PKG → abbassa il Ca²⁺ e attiva la fosfatasi delle catene leggere della miosina → rilassamento","↑cAMP → PKA → fosforila la chinasi delle catene leggere della miosina → contrazione del vaso sanguigno","↑cGMP → PKG → apre i canali del Ca²⁺ voltaggio-dipendenti → contrazione e poi rilassamento","↑IP₃ → rilascio di Ca²⁺ dal reticolo → attivazione della NO sintasi endoteliale → rilassamento del vaso","↑DAG → PKC → inibisce la fosfatasi delle catene leggere della miosina → rilassamento del vaso"],"ans":0,"why":"La PKG apre anche canali K⁺ (iperpolarizzazione) e inibisce i canali del Ca²⁺ voltaggio-dipendenti.","note":null,"fixed":false},{"id":"b3m-06","topic":"bm3-cgmp","level":"a","page":"lezione 3","src":"Biologia molecolare","q":"Come agisce il sildenafil (Viagra)?","opts":["Inibisce la fosfodiesterasi 5, mantenendo alto più a lungo il cGMP nella muscolatura dei vasi","Attiva la guanilato ciclasi solubile, che produce più cGMP nella muscolatura liscia dei vasi","Libera NO nell'endotelio, che diffonde nel muscolo liscio e fa salire il cAMP","Blocca la PKG, impedendo la contrazione della muscolatura liscia del tessuto erettile","Inibisce la fosfodiesterasi 3, mantenendo alto più a lungo il cAMP nella muscolatura dei vasi"],"ans":0,"why":"La vasodilatazione aumenta l'afflusso di sangue nel tessuto erettile.","note":null,"fixed":false},{"id":"b3m-07","topic":"bm3-cgmp","level":"l","page":"lezione 3","src":"Biologia molecolare","q":"Perché una seconda stimolazione con NO a breve distanza produce molto meno cGMP?","opts":["La PKG ha attivato una fosfodiesterasi del cGMP che resta attiva","L'NO non attraversa più la membrana, che si è irrigidita dopo il primo stimolo","La guanilato ciclasi solubile è stata degradata dal proteasoma dopo il primo picco","Il GTP della cellula è esaurito e non può essere convertito in cGMP","La PKA ha fosforilato la guanilato ciclasi e l'ha staccata dal suo gruppo eme"],"ans":0,"why":"Lo spegnimento è intrinseco alla via: picco rapido di cGMP e poi calo.","note":null,"fixed":false},{"id":"b3m-08","topic":"bm3-cgmp","level":"l","page":"lezione 3","src":"Biologia molecolare","q":"Quale gruppo prostetico lega l'NO nella guanilato ciclasi solubile?","opts":["Eme","FAD","Biotina","Centro Fe-S"],"ans":0,"why":"L'NO si coordina al ferro in sesta posizione.","note":null,"fixed":false},{"id":"bh3m-01","topic":"bm3-cgmp","level":"h","page":"lezione 3","src":"Biologia molecolare","q":"Una cellula muscolare liscia vascolare riceve NO. Quale sequenza è corretta?","opts":["NO → guanilato ciclasi citosolica → cGMP → PKG → ↓Ca²⁺ e defosforilazione delle catene leggere → rilassamento","NO → GPCR di membrana → Gs → adenilato ciclasi → cAMP → PKA → fosforilazione della miosina → contrazione","NO → recettore di membrana → PLCβ → IP₃ → rilascio di Ca²⁺ dal RE → calmodulina → contrazione","NO → guanilato ciclasi di membrana → cGMP → PKC → ↑Ca²⁺ e fosforilazione delle catene leggere → contrazione","NO → fosfodiesterasi 5 → più cGMP → PKA → ↓Ca²⁺ e fosforilazione delle catene pesanti → rilassamento"],"ans":0,"why":"La PDE5 degrada il cGMP: inibirla prolunga l'effetto.","note":"Sbobina di Biologia molecolare, lezione 3: nel riepilogo scrive «Il GMP ciclico attiva la proteina G» e «la proteina G fosforila i suoi bersagli»; si intende la PKG (protein chinasi G).","fixed":false},{"id":"b4c-01","topic":"bm4-calcio","level":"f","page":"lezione 4","src":"Biologia molecolare","q":"Qual è la concentrazione di Ca²⁺ nel citosol a riposo?","opts":["≈ 10⁻⁷–10⁻⁸ M","≈ 10⁻³–10⁻⁴ M","≈ 10⁻¹–10⁻² M","≈ 10⁻¹⁰–10⁻¹¹ M","≈ 10⁻⁵–10⁻⁶ M"],"ans":0,"why":"Fuori dalla cellula e negli organuli (RE, mitocondrio) è circa 10⁻³ M.","note":null,"fixed":false},{"id":"b4c-02","topic":"bm4-calcio","level":"f","page":"lezione 4","src":"Biologia molecolare","q":"Come viene portato fuori dalla cellula il Ca²⁺?","opts":["Con la Ca²⁺-ATPasi e con l'antiporto Na⁺/Ca²⁺","Per diffusione semplice secondo
