<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biochiquiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f4f6fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Biochiquiz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Layout: app a una schermata — feed a scroll verticale con snap, una card per schermata,
   tab bar blu notte fissa in basso con voce attiva a pillola corallo. Palette B: corallo e blu notte. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #f4f6fa;
  --line: #dde3ee;
  --ink: #0e1a33;
  --muted: #5a6782;
  --accent: #f24e2a;
  --accent-ink: #ffffff;
  --accent-soft: #ffe6df;
  --tabbar-bg: #0e1a33;
  --tabbar-ink: #8a97b3;
  --tabbar-on: #ffffff;
  --tile-rose: #ffe6df;
  --tile-peach: #e2f5f3;
  --tile-sage: #e2f4ea;
  --tile-sky: #e3ecfb;
  --tile-lilac: #ece8fb;
  --good: #16884a;
  --good-soft: #e3f6ea;
  --bad: #d23a2a;
  --bad-soft: #fde7e3;
  --warn: #5b3fd6;
  --warn-soft: #efebff;
  --patch: #ffe6df;
  --patch-line: #f24e2a;
  --young: #8ea3d6;
  --tile-ring: transparent;
  --lv-m: #2c5ea8;
  --key-bg: rgba(48, 82, 156, .74);
  --key-hi: rgba(255, 255, 255, .42);
  --key-ring: rgba(255, 255, 255, .5);
  --mol-ink: #0e1a33;
  --shadow: 0 1px 2px rgba(14, 26, 51, .05), 0 10px 28px rgba(14, 26, 51, .08);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r-card: 28px;
  --r-ctl: 16px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #050608; --surface: #0e1014; --surface-2: #15181e; --line: #2e333e;
    --ink: #f1f3f7; --muted: #9aa1b0; --accent: #ff6a47; --accent-ink: #ffffff; --accent-soft: #3a1a14;
    --tabbar-bg: #000000; --tabbar-ink: #7d8494; --tabbar-on: #ffffff;
    --tile-rose: #33171a; --tile-peach: #0f2a28; --tile-sage: #10291c; --tile-sky: #142035; --tile-lilac: #211c3a;
    --tile-ring: rgba(255, 255, 255, .14); --lv-m: #8fb4f0;
    --key-bg: rgba(150, 170, 220, .24); --key-hi: rgba(255, 255, 255, .24); --key-ring: rgba(255, 255, 255, .26);
    --good: #5ed493; --good-soft: #0f2a1b; --bad: #ff8575; --bad-soft: #33130f; --warn: #b9a8ff; --warn-soft: #1d1833;
    --patch: #3a1a14; --patch-line: #ff6a47; --young: #5f7bc0; --mol-ink: #f1f3f7;
    --shadow: 0 0 0 1px rgba(255,255,255,.04), 0 10px 28px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #050608; --surface: #0e1014; --surface-2: #15181e; --line: #2e333e;
    --ink: #f1f3f7; --muted: #9aa1b0; --accent: #ff6a47; --accent-ink: #ffffff; --accent-soft: #3a1a14;
    --tabbar-bg: #000000; --tabbar-ink: #7d8494; --tabbar-on: #ffffff;
    --tile-rose: #33171a; --tile-peach: #0f2a28; --tile-sage: #10291c; --tile-sky: #142035; --tile-lilac: #211c3a;
    --tile-ring: rgba(255, 255, 255, .14); --lv-m: #8fb4f0;
    --key-bg: rgba(150, 170, 220, .24); --key-hi: rgba(255, 255, 255, .24); --key-ring: rgba(255, 255, 255, .26);
    --good: #5ed493; --good-soft: #0f2a1b; --bad: #ff8575; --bad-soft: #33130f; --warn: #b9a8ff; --warn-soft: #1d1833;
    --patch: #3a1a14; --patch-line: #ff6a47; --young: #5f7bc0; --mol-ink: #f1f3f7;
    --shadow: 0 0 0 1px rgba(255,255,255,.04), 0 10px 28px rgba(0,0,0,.6);
    color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--font);
  -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

.app { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.view { flex: 1; min-height: 0; position: relative; }
.view[hidden] { display: none !important; }

/* ---------- Tab bar ---------- */
.tabbar {
  display: flex; justify-content: space-around; align-items: center; gap: 4px;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  background: var(--tabbar-bg);
}
.tab {
  flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: 0; padding: 4px 0; color: var(--tabbar-ink); font-size: 11px; font-weight: 600; cursor: pointer;
}
.tab .pill { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 999px; transition: background .2s; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--tabbar-on); }
.tab[aria-selected="true"] .pill { background: var(--accent); }

/* ---------- Pagine scrollabili (argomenti, statistiche, info) ---------- */
.page {
  height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
}
.page-inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.h1 { font: 800 30px/1.1 var(--font-display); letter-spacing: -.02em; margin: 6px 0 0; text-wrap: balance; }
.lead { color: var(--muted); margin: 0; font-size: 15px; }
.h2 { font: 700 13px/1.2 var(--font); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 4px 0; }

.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 6px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; min-width: 0; }
.row + .row { border-top: 1px solid var(--line); border-radius: 0; }
.tile { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); box-shadow: inset 0 0 0 1px var(--tile-ring); }
.tile svg { width: 21px; height: 21px; }
.t-rose { background: var(--tile-rose); } .t-peach { background: var(--tile-peach); } .t-sage { background: var(--tile-sage); }
.t-sky { background: var(--tile-sky); } .t-lilac { background: var(--tile-lilac); }
.row-text { flex: 1; min-width: 0; }
.row-title { font-weight: 700; font-size: 16px; }
.row-sub { color: var(--muted); font-size: 13px; margin-top: 1px; }

/* Argomenti */
.block-head { width: 100%; background: none; border: 0; text-align: left; cursor: pointer; }
.block-head .chev { transition: transform .2s; color: var(--muted); }
.block-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.topics { padding: 0 6px 6px 64px; display: flex; flex-direction: column; gap: 2px; }
.topic { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 14px; cursor: pointer; }
.topic input { position: absolute; opacity: 0; pointer-events: none; }
.check { flex: none; width: 24px; height: 24px; border-radius: 8px; border: 1.5px solid var(--line); display: grid; place-items: center; background: var(--surface); }
.check svg { width: 16px; height: 16px; opacity: 0; color: var(--accent-ink); }
.topic input:checked + .check { background: var(--accent); border-color: var(--accent); }
.topic input:checked + .check svg { opacity: 1; }
.topic input:focus-visible + .check { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.topic .tname { flex: 1; min-width: 0; font-size: 15px; }
.topic .tmeta { font-size: 12px; color: var(--muted); white-space: nowrap; }
.topic.soon { cursor: default; opacity: .5; }
.topic.soon .check { border-style: dashed; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.badge.new { background: var(--accent-soft); color: var(--accent); }

.switch-row { display: flex; align-items: center; gap: 12px; padding: 12px; }
.switch { position: relative; flex: none; width: 50px; height: 30px; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }

.seg { display: flex; background: var(--surface-2); border-radius: 14px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 6px; border-radius: 11px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r-ctl); padding: 14px 18px; font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: var(--bad-soft); color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: default; }

/* ---------- Feed ---------- */
.feed {
  height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
}
.slide {
  height: 100%; scroll-snap-align: start; scroll-snap-stop: always;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px; display: flex;
}
.card {
  flex: 1; max-width: 560px; margin: 0 auto; min-width: 0; min-height: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.card-body { flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 14px); }
.card-body > * { flex-shrink: 0; }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-kicker { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.card-topic { font-size: 13px; color: var(--muted); margin-top: 1px; }
.q { font: 800 clamp(18px, 2.6vh, 22px)/1.2 var(--font-display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }

.mol-box { background: var(--surface-2); border-radius: 22px; display: flex; align-items: center; justify-content: center; padding: 8px; position: relative; }
.card-body > .mol-box { flex: 1 1 0; min-height: 96px; }
.mol-box svg { width: 100%; height: 100%; max-height: 300px; display: block; }
.mol-box .fallback { color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }
.mol-tag { position: absolute; left: 12px; top: 10px; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

.options { display: flex; flex-direction: column; gap: clamp(5px, .9vh, 8px); }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: clamp(8px, 1.35vh, 12px) 12px; font-size: 15px; font-weight: 600;
}
.opt .key { flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--surface-2); color: var(--muted); }
.opt:not([disabled]):active { transform: scale(.99); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .key { background: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: var(--surface); }
.opt[disabled] { cursor: default; }

.write { display: flex; gap: 8px; }
.write input {
  flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 13px 14px; border-radius: var(--r-ctl);
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
}
.write input:focus { outline: none; border-color: var(--accent); }
.linkish { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 14px; padding: 4px 0; cursor: pointer; align-self: flex-start; }

/* Reazione da completare */
.rx { background: var(--surface-2); border-radius: 22px; padding: clamp(10px, 1.6vh, 16px) 14px; display: flex; flex-direction: column; gap: 10px; }
.rx-side { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rx-item { padding: 7px 11px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-weight: 650; font-size: 15px; }
.rx-item.cof { font-weight: 600; color: var(--muted); }
.rx-plus { color: var(--muted); font-weight: 700; }
.rx-arrow { display: flex; align-items: center; gap: 10px; padding-left: 4px; }
.rx-arrow .stem { flex: none; width: 2px; height: clamp(28px, 4.5vh, 46px); background: var(--ink); position: relative; margin-left: 10px; }
.rx-arrow .stem::after { content: ""; position: absolute; left: -5px; bottom: -2px; border: 6px solid transparent; border-top: 9px solid var(--ink); border-bottom: 0; }
.rx-arrow .stem.rev::before { content: ""; position: absolute; left: -5px; top: -2px; border: 6px solid transparent; border-bottom: 9px solid var(--ink); border-top: 0; }
.rx-enz { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rx-enz .enz { font-weight: 700; color: var(--accent); font-size: 15px; }
.rx-enz .co { font-size: 13px; color: var(--muted); }
.patch {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 12px; font-weight: 800; font-size: 15px;
  background: var(--patch); min-width: 64px; justify-content: center;
  border: 1.5px dashed var(--patch-line); color: var(--patch-line);
}
.patch.revealed { transform: none; background: var(--good-soft); border: 1.5px solid var(--good); color: var(--ink); }
.patch.revealed.miss { background: var(--bad-soft); border-color: var(--bad); }

.feedback { border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.feedback.ok { background: var(--good-soft); }
.feedback.ko { background: var(--bad-soft); }
.feedback .verdict { font-weight: 800; font-size: 17px; }
.feedback.ok .verdict { color: var(--good); }
.feedback.ko .verdict { color: var(--bad); }
.feedback .meta { color: var(--muted); font-size: 13px; }
.note { background: var(--warn-soft); border-radius: 18px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; }
.note b { color: var(--warn); }

.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px 12px 18px; border-top: 1px solid var(--line); }
.report { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 6px 0; text-decoration: none; }
.report svg { width: 16px; height: 16px; }
.next-hint { font-size: 13px; font-weight: 700; color: var(--accent); display: inline-flex; align-items: center; gap: 4px; opacity: 0; transition: opacity .3s; }
.answered .next-hint { opacity: 1; }
.next-hint svg { width: 16px; height: 16px; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

.empty { height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
.empty .box { padding: 26px 22px; max-width: 420px; display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* Statistiche */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px 12px; }
.stat .num { font: 800 26px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat .lbl { font-size: 12px; color: var(--muted); margin-top: 6px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* Benvenuto */
.welcome {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(20px, env(safe-area-inset-left, 0px));
}
.welcome-inner { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.hero-mark { width: 64px; height: 64px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.hero-mark svg { width: 36px; height: 36px; }
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 2px; }
.step { display: flex; gap: 12px; align-items: flex-start; padding: 12px; }
.step + .step { border-top: 1px solid var(--line); }
.step::before { counter-increment: s; content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 14px; }
.inline-ico { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; color: var(--accent); }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px);
}
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
.confirm .btns { display: flex; gap: 8px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  .feed { scroll-behavior: auto; }
}


/* Feedback a pop-up ancorato alla risposta */
.opt, .write { position: relative; }
.opt.has-pop, .write.has-pop { z-index: 3; }
.opt-label { flex: 1; min-width: 0; }
.write.right input { border-color: var(--good); background: var(--good-soft); }
.write.wrong input { border-color: var(--bad); background: var(--bad-soft); }
.pop {
  position: absolute; left: 10px; right: 10px; top: calc(100% - 4px); z-index: 4;
  display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: default;
  padding: 10px 12px; border-radius: 16px; border: 1.5px solid; font-size: 14px; font-weight: 500; line-height: 1.35;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .16); animation: pop-in .2s cubic-bezier(.2, .9, .3, 1.2) both; transform-origin: 24px 0;
}
.pop::before { content: ""; position: absolute; left: 18px; top: -7px; width: 12px; height: 12px; background: inherit; border: inherit; border-right: 0; border-bottom: 0; transform: rotate(45deg); }
.pop.up { top: auto; bottom: calc(100% - 4px); transform-origin: 24px 100%; }
.pop.up::before { top: auto; bottom: -7px; transform: rotate(225deg); }
.pop.ok { background: var(--good-soft); border-color: var(--good); }
.pop.ko { background: var(--bad-soft); border-color: var(--bad); }
.pop-verdict { font-weight: 800; font-size: 15px; }
.pop-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; margin: -10px -12px 0; padding: 10px 12px 2px; border-radius: 16px; -webkit-tap-highlight-color: transparent; pointer-events: auto; }
.pop-toggle { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.pop-toggle svg { width: 16px; height: 16px; transform: rotate(180deg); transition: transform .2s; }
.pop.collapsed { gap: 0; box-shadow: none; position: static; flex-basis: 100%; margin: 10px 0 0; animation: none; }
.pop.collapsed::before { display: none; }
.opt.pop-closed, .write.pop-closed { flex-wrap: wrap; }
.pop.collapsed .pop-head { padding-bottom: 10px; margin-bottom: -10px; }
.pop.collapsed > :not(.pop-head) { display: none; }
.pop.collapsed .pop-toggle svg { transform: none; }
.pop, .pop * { pointer-events: auto; }
.pop.ok .pop-verdict { color: var(--good); }
.pop.ko .pop-verdict { color: var(--bad); }
.pop-meta { color: var(--muted); font-size: 12.5px; }
.pop-note { margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--line); font-size: 13px; }
.pop-note b { color: var(--warn); }

@keyframes pop-in { from { opacity: 0; transform: scale(.94) translateY(-4px); } to { opacity: 1; transform: none; } }

/* Valutazione dentro il pop-up */
.rate { display: flex; gap: 6px; margin-top: 6px; }
.rate-b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 4px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer; }
.rate-b small { font-size: 11px; font-weight: 600; color: var(--muted); }
.rate-b[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.rate-b[aria-pressed="true"] small { color: var(--surface); opacity: .75; }
.bar.two { display: flex; }
.bar.two i { border-radius: 0; }
.bar.two i.young { background: var(--young); }
.stats-grid .lbl { line-height: 1.25; }

/* Nessuna barra di scorrimento visibile: si scorre solo tra una card e l'altra */
.feed, .page { scrollbar-width: none; }
.feed::-webkit-scrollbar, .page::-webkit-scrollbar { display: none; }
/* card con molto testo su schermi bassi: si compatta invece di scorrere */
.card.tight .card-head { display: none; }
.card.tight .rx-item, .card.tight .patch { padding: 5px 9px; font-size: 14px; }
.card.tight .opt { padding-block: 7px; }
.card.tight .opt .key { width: 24px; height: 24px; }
/* crediti */
.credit { display: flex; align-items: center; gap: 14px; padding: 14px; }
.credit .mono { flex: none; width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 20px/1 var(--font-display); letter-spacing: .02em; box-shadow: inset 0 0 0 1px var(--tile-ring); }
.credit .who { font: 800 19px/1.15 var(--font-display); }
.credit .role { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* Domande verificate: testo lungo, opzioni su più righe */
.ex-q { font-size: clamp(17px, 2.4vh, 20px); line-height: 1.25; }
.ex-q u { text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--accent); }
.opt .opt-label { line-height: 1.3; }
.card.tight .ex-q { font-size: 16px; }
.card.tight .opt { font-size: 14px; }
.pop-note.info b { color: var(--muted); }

/* Segnalazione: foglio dal basso */
.sheet-wrap { position: fixed; inset: 0; z-index: 70; background: rgba(5, 8, 15, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease both; }
.sheet {
  width: 100%; max-width: 560px; background: var(--surface); border-radius: 26px 26px 0 0; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px; max-height: 92%; overflow-y: auto; scrollbar-width: none;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  animation: rise .22s cubic-bezier(.2, .9, .3, 1) both;
}
.sheet::-webkit-scrollbar { display: none; }
.sheet-grip { width: 40px; height: 5px; border-radius: 99px; background: var(--line); align-self: center; margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sheet textarea, .sheet input[type="text"], .copy-area { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: var(--r-ctl); border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); resize: none; }
.sheet textarea:focus, .sheet input[type="text"]:focus { outline: none; border-color: var(--accent); }
.sheet input.bad { border-color: var(--bad); }
.field-err { color: var(--bad); font-size: 13px; font-weight: 600; margin-top: -4px; }
.copy-area { margin: 0 12px 12px; width: calc(100% - 24px); height: 120px; font-size: 12px; }
.sheet-btns { display: flex; gap: 8px; }
.sheet-btns .btn { flex: 1; }
.update-bar {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 65;
  display: flex; align-items: center; gap: 12px; width: calc(100% - 28px); max-width: 520px;
  background: var(--ink); color: var(--bg); border-radius: 18px; padding: 8px 8px 8px 16px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow);
}
.update-bar span { flex: 1; min-width: 0; }
.update-bar .btn { padding: 9px 14px; font-size: 14px; }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Livelli */
.lv { flex: none; font-size: 11px; font-weight: 800; letter-spacing: .02em; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.lv-f { background: var(--good-soft); color: var(--good); }
.lv-m { background: var(--tile-sky); color: var(--lv-m); }
.lv-a { background: var(--accent-soft); color: var(--accent); }
.lv-l { background: var(--ink); color: var(--surface); }
.lv.locked { opacity: .45; }
.lv-row { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 4px; }
.lv-chip[aria-pressed="false"] { background: var(--surface); color: var(--muted); border-color: var(--line); text-decoration: line-through; }
.lv-chip.lvc-f[aria-pressed="true"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.lv-chip.lvc-m[aria-pressed="true"] { background: var(--tile-sky); border-color: var(--lv-m); color: var(--lv-m); }
.lv-chip.lvc-a[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.lv-chip.lvc-l[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.lv-chip.lvc-h[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Modalità di studio */
#view-feed { display: flex; flex-direction: column; }
#view-feed .feed { flex: 1; height: auto; min-height: 0; }
.modebar { flex: none; padding: 8px max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); }
.modebar .seg { max-width: 560px; margin: 0 auto; }
.modebar .seg button { padding: 7px 4px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 5px; }
.modebar .seg button svg { width: 14px; height: 14px; }
.seg button.hard-b[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.card.hard { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.lv-h { background: var(--accent); color: var(--accent-ink); }
.mode-list { display: flex; flex-direction: column; gap: 8px; }
.mode-opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 18px; padding: 12px 14px; cursor: pointer; }
.mode-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.mode-opt .row-title { font-size: 15px; }

</style>
</head>

m3-krebs"],"icit":["m3-krebs"],"akg":["m3-krebs"],"suc":["m3-krebs"],"fum":["m3-krebs"],"g1p":["m4-degradazione","m4-sintesi"],"fru":["m2-ingresso"],"gal":["m2-ingresso"],"man":["m2-ingresso"],"r5p":["m6-reazioni"],"ru5p":["m6-reazioni"],"xu5p":["m6-reazioni"],"pg6":["m6-reazioni"],"e4p":["m6-reazioni"],"s7p":["m6-reazioni"],"acal":["m2-fermentazioni"],"etoh":["m2-fermentazioni"],"asp":["m2-navette","m5-fonti"],"glu":["m5-fonti"]},"cofactorPool":["ATP","ADP","AMP","GTP","GDP","NAD⁺","NADH + H⁺","NADP⁺","FAD","FADH₂","Pi","PPi","H₂O","CO₂","HCO₃⁻","Biotina","Tiamina pirofosfato","Coenzima A","Mg²⁺"],"extraEnzymes":["Glucosio 6-fosfato deidrogenasi","Glicogeno fosforilasi","Fosfoglucomutasi","Piruvato deidrogenasi","Citrato sintasi","Fosfofruttochinasi 2","Lattico deidrogenasi","Transaminasi"],"exam":[{"id":"eq","topic":"m1-termodinamica","page":"10–12","src":"Biochimica II","q":"La definizione migliore per una reazione vicina all'equilibrio è:","opts":["avviene sempre con una variazione di energia libera","ha una variazione di energia libera vicina a zero","di solito è un punto di controllo di una via metabolica","avviene molto lentamente","è sempre catalizzata da un enzima allosterico"],"ans":1,"why":"Vicino all'equilibrio ΔG ≈ 0: la reazione è reversibile e il verso dipende solo dalle concentrazioni. I punti di controllo sono invece le reazioni con ΔG molto negativo.","note":null,"times":2,"pending":false,"level":"f"},{"id":"dg-dg0","topic":"m1-termodinamica","page":"11–12","src":"Biochimica II","q":"Il ΔG differisce dal ΔG°' quando si ha:","opts":["una variazione della concentrazione di enzima","una variazione della concentrazione degli ioni divalenti","una variazione del Keq","una diversa concentrazione dei reagenti e prodotti","una variazione della temperatura di 1 °C"],"ans":3,"why":"ΔG = ΔG°' + RT ln([prodotti]/[reagenti]): cambia con le concentrazioni. L'enzima cambia solo la velocità e la Keq è una costante.","note":null,"times":2,"pending":false,"level":"f"},{"id":"atp-ph","topic":"m1-atp","page":"15","src":"Biochimica II","q":"L'energia libera standard della scissione dell'ATP in ADP e fosfato è −30 kJ/mole. Al pH fisiologico questo valore:","opts":["diviene più negativo","diviene più positivo","resta invariato","dipende dalla concentrazione del magnesio","diventa uguale a zero"],"ans":0,"why":"Più alto è il pH, più l'idrolisi è favorita: a pH 7,4 il ΔG scende sotto −30 kJ/mol. Il magnesio stabilizza l'ATP, ma la domanda chiede l'effetto del pH.","note":null,"times":2,"pending":false,"level":"m"},{"id":"atp-legami","topic":"m1-atp","page":"14, 25","src":"Biochimica II","q":"Quale di questi legami non è presente nell'ATP?","opts":["N-glicosidico","Emiacetalico","Fosfodiestere","Fosfoestere","Fosfoanidridico"],"ans":2,"why":"Nell'ATP ci sono il legame N-glicosidico (adenina–ribosio), il fosfoestere (ribosio–fosfato α) e due fosfoanidridici. Il fosfodiestere lega i nucleotidi negli acidi nucleici.","note":"Sbobina di Biochimica II, p. 25: dice che il legame emiacetalico si trova «nel ribosio e nell'ATP». Nell'ATP il C1' del ribosio è legato all'adenina, quindi è un N-glicoside e non più un emiacetale. All'esame la risposta attesa resta fosfodiestere.","times":2,"pending":false,"level":"m"},{"id":"slp-def","topic":"m1-atp","page":"19, 44","src":"Biochimica II","q":"Che cos'è la fosforilazione dell'ATP a livello del substrato?","opts":["Il trasferimento del fosfato in gamma dell'ATP ad una molecola con formazione di un legame estere","La formazione dell'ATP dall'ADP e Pi mediante riossidazione del NADH","L'idrolisi dell'ATP","La formazione dell'ATP dall'ADP e Pi mediante energia rilasciata dalla scissione di un composto con un ΔG°' minore di −30 kJ/mole","La formazione dell'ATP dall'ADP e Pi grazie al gradiente protonico della membrana mitocondriale"],"ans":3,"why":"Un composto con potenziale di trasferimento più alto dell'ATP (1,3-BPG, PEP) cede il fosfato all'ADP. La B è la fosforilazione ossidativa, la A una normale reazione chinasica.","note":null,"times":2,"pending":false,"level":"m"},{"id":"ndpk","topic":"m1-atp","page":"17–18","src":"Biochimica II","q":"Quale di queste affermazioni è falsa riguardo alla nucleotide difosfato chinasi?","opts":["Trasferisce il fosfato in gamma da un trinucleotide ad un dinucleotide","Ha un'energia libera standard vicina allo zero","La sua azione favorisce i processi catabolici","La reazione dipende dal consumo degli NTP","Usa come substrati nucleotidi di e trifosfati"],"ans":2,"why":"Forma GTP, UTP e CTP per le biosintesi (proteine, zuccheri, lipidi): favorisce l'anabolismo. Ha ΔG°' ≈ 0 e va avanti perché gli NTP vengono consumati. «Trinucleotide/dinucleotide» sta per nucleoside trifosfato/difosfato.","note":null,"times":2,"pending":false,"level":"a"},{"id":"carica","topic":"m1-atp","page":"16–17","src":"Biochimica II","q":"In una cellula le concentrazioni di ATP ed ADP sono equivalenti e quella dell'AMP è trascurabile. In queste condizioni:","opts":["Prevarrà il catabolismo","Prevarrà l'anabolismo","I due processi sono equivalenti","Il ΔG°' di idrolisi aumenta","Si blocca la glicolisi"],"ans":0,"why":"Carica energetica = ([ATP] + ½[ADP]) / ([ATP] + [ADP] + [AMP]) = 1,5/2 = 0,75. Sotto il valore normale di 0,9 aumentano le vie che generano ATP.","note":null,"times":2,"pending":false,"level":"a"},{"id":"no-atp","topic":"m2-ingresso","page":"32–33","src":"Biochimica II","q":"Quale di questi processi non richiede ATP?","opts":["Fosforilazione del glucosio","Trasporto del glucosio dal sangue alle cellule","Pompa sodio potassio","Pompa del calcio","Sintesi del glicogeno"],"ans":1,"why":"I GLUT fanno diffusione facilitata secondo gradiente. Esochinasi, Na⁺/K⁺-ATPasi e Ca²⁺-ATPasi consumano ATP.","note":"Sbobina di Biochimica II, p. 32: l'SGLT1 (scritto «SGLUT1») è descritto prima come «trasportatore attivo che utilizza ATP» e poi come simporto senza ATP. È un trasporto attivo secondario: l'ATP lo consuma la pompa Na⁺/K⁺, non l'SGLT1.","times":2,"pending":false,"level":"f"},{"id":"legami-energia","topic":"m1-atp","page":"19–20","src":"Biochimica II","q":"Ordina per energia libera, dalla più positiva alla più negativa, la scissione di: fosfoguanidinico della creatina fosfato (A), fosfoestere (B), tioestere (C), fosfoanidridico (D).","opts":["A-B-C-D","B-D-C-A","C-D-B-A","B-C-A-D","D-B-A-C"],"ans":1,"why":"ΔG°' di idrolisi: fosfoestere (es. glucosio 6-P) ≈ −14 kJ/mol, fosfoanidridico dell'ATP ≈ −30, tioestere dell'acetil-CoA −31,4, fosfocreatina ≈ −43.","note":null,"times":1,"pending":false,"level":"l"},{"id":"pk-base","topic":"m1-coenzimi","page":"24","src":"Biochimica II","q":"La base B ha un pK pari a 9,0. A pH 9,0 in soluzione si avrà:","opts":["Uguale concentrazione di B e B⁻","Uguale concentrazione di B e B⁺","Prevalenza della forma B","Prevalenza della forma B⁺","Prevalenza della forma BH⁻"],"ans":1,"why":"A pH = pK le due forme sono in uguale concentrazione. La base B accetta un protone e diventa BH⁺ (B⁺).","note":null,"times":2,"pending":false,"level":"m"},{"id":"etanolo-nad","topic":"m1-coenzimi","page":"53","src":"Biochimica II","q":"L'etanolo, in presenza degli enzimi necessari, reagisce con due molecole di NAD⁺. Il prodotto finale è:","opts":["Etano","Acetaldeide","Acetato","Anidride carbonica","Acetil-CoA"],"ans":2,"why":"Etanolo → acetaldeide (alcol deidrogenasi, 1 NAD⁺) → acetato (aldeide deidrogenasi, 1 NAD⁺).","note":null,"times":2,"pending":false,"level":"m"},{"id":"chetoacido","topic":"m1-coenzimi","page":"23–24, 49","src":"Biochimica II","q":"La riduzione di un alfa-chetoacido produce:","opts":["un composto con un alcol primario e un gruppo aldeidico","un composto con alcol secondario e un gruppo carbossilico","un composto con un chetone ed un gruppo carbossilico","un composto con due gruppi carbossilici","un composto con un alcol terziario e un gruppo carbossilico"],"ans":1,"why":"Il chetone in α si riduce ad alcol secondario e il carbossile resta: piruvato → lattato.","note":null,"times":2,"pending":false,"level":"m"},{"id":"elettroni-glc","topic":"m1-coenzimi","page":"22","src":"Biochimica II","q":"Quanti elettroni vengono persi per la completa ossidazione della molecola di glucosio ad anidride carbonica ed acqua?","opts":["8","12","24","32","6"],"ans":2,"why":"Ogni carbonio del glucosio passa in media da 0 a +4: 6 × 4 = 24 elettroni, cioè le 12 coppie raccolte da 10 NADH e 2 FADH₂.","note":null,"times":1,"pending":false,"level":"a"},{"id":"ox-carbossile","topic":"m1-coenzimi","page":"22","src":"Biochimica II","q":"Quale di queste affermazioni è vera riguardo l'ossidazione di un gruppo carbossilico?","opts":["Non è possibile","Riguarda solo la forma deprotonata","Viene rilasciato come CO₂","È una reazione reversibile","Produce un gruppo aldeidico"],"ans":2,"why":"Il carbonio carbossilico è il più ossidato di una molecola organica: l'ultimo passaggio possibile è la sua eliminazione come CO₂, come nelle decarbossilazioni del ciclo di Krebs.","note":null,"times":1,"pending":false,"level":"m"},{"id":"elettroni-acoa","topic":"m1-coenzimi","page":"22","src":"Biochimica II","q":"L'acetil-CoA (CH₃COSCoA) viene ossidato nel ciclo di Krebs a 2 molecole di CO₂. Quanti elettroni vengono persi nell'ossidazione?","opts":["2","4","6","8","10"],"ans":3,"why":"I due carboni dell'acetile passano in totale da 0 a +8: 8 elettroni, raccolti da 3 NADH e 1 FADH₂ (4 coppie).","note":null,"times":1,"pending":false,"level":"a"},{"id":"c-secondario","topic":"m1-coenzimi","page":"23","src":"Biochimica II","q":"Per ossidare un carbonio secondario saturo a chetone quali passaggi sono necessari?","opts":["Ossidazione NAD dipendente con aggiunta di una molecola d'acqua","Idratazione seguita da un'ossidazione","Ossidazione, idratazione ed un ulteriore ossidazione","Non è possibile la trasformazione","Una sola ossidazione NAD-dipendente"],"ans":2,"why":"Ossidazione FAD-dipendente a doppio legame (succinato → fumarato), idratazione ad alcol secondario (→ malato), ossidazione NAD-dipendente a chetone (→ ossalacetato).","note":null,"times":1,"pending":false,"level":"a"},{"id":"no-acqua","topic":"m1-coenzimi","page":"25","src":"Biochimica II","q":"Quale tra questi legami non richiede la perdita di una molecola d'acqua per la sua formazione?","opts":["Estere","Fosfoanidridico","Emiacetalico","Glicosidico","Peptidico"],"ans":2,"why":"L'emiacetale si forma per addizione dell'OH al carbonile (C5–OH sul C1 del glucosio). Estere, fosfoanidride e glicoside sono condensazioni.","note":null,"times":1,"pending":false,"level":"m"},{"id":"glc-fru","topic":"m1-enzimologia","page":"23, 40","src":"Biochimica II","q":"La trasformazione da glucosio a fruttosio è catalizzata da:","opts":["Idrolasi","Ossidoreduttasi","Chinasi","Isomerasi","Mutasi"],"ans":3,"why":"Glucosio (aldoso) e fruttosio (chetoso) sono isomeri: la conversione non cambia lo stato di ossidazione (es. fosfoesoso isomerasi, G6P → F6P).","note":null,"times":2,"pending":false,"level":"f"},{"id":"idrolasi","topic":"m1-enzimologia","page":"31","src":"Biochimica II","q":"Quali di questi enzimi appartiene alla classe delle idrolasi?","opts":["Proteasi","Amilasi","Lipasi","Proteasi, amilasi e lipasi","Solo proteasi e lipasi"],"ans":3,"why":"Proteasi, amilasi e lipasi scindono legami usando l'acqua: sono tutte idrolasi.","note":null,"times":1,"pending":false,"level":"f"},{"id":"es-saturante","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"Se in una reazione enzimatica tutto l'enzima è nella forma ES vuol dire che:","opts":["Il substrato è uguale alla KM","La concentrazione dell'enzima è uguale a quella del substrato","Si è raggiunta metà della Vmax","Il substrato è saturante","L'enzima è inibito in modo competitivo"],"ans":3,"why":"Con tutto l'enzima legato come ES si lavora a Vmax: il substrato è saturante.","note":null,"times":1,"pending":false,"level":"f"},{"id":"primaria","topic":"m1-enzimologia","page":"25","src":"Biochimica I","q":"In quale livello di struttura di una proteina non intervengono legami deboli?","opts":["Primaria","Secondaria","Terziaria","Quaternaria","Nessuna: intervengono in tutti i livelli"],"ans":0,"why":"La primaria è la sequenza unita da legami peptidici covalenti. Secondaria, terziaria e quaternaria dipendono da legami deboli (idrogeno, ionici, idrofobici).","note":null,"times":1,"pending":false,"level":"f"},{"id":"piu-enzima","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"In una reazione enzimatica un ulteriore aumento dell'enzima provoca:","opts":["Aumento della KM","Aumento della Vmax","Diminuzione della KM","Aumento della kcat","Diminuzione della Vmax"],"ans":1,"why":"Vmax = k₂[E]: cresce con l'enzima. KM e kcat sono costanti.","note":null,"times":1,"pending":false,"level":"f"},{"id":"km-unita","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"Le dimensioni della KM sono:","opts":["s⁻¹","M","s M⁻¹","M⁻¹","M s⁻¹"],"ans":1,"why":"La KM è la concentrazione di substrato a cui v = ½ Vmax: si misura in M.","note":null,"times":1,"pending":false,"level":"m"},{"id":"k05-neg","topic":"m1-enzimologia","page":"28","src":"Biochimica II","q":"La K0,5 (KM apparente) di un enzima allosterico, in presenza di un effettore allosterico negativo:","opts":["Non subisce variazioni","Diminuisce","Aumenta","Dipende dalla concentrazione del substrato","Si annulla"],"ans":2,"why":"L'effettore negativo sposta l'equilibrio verso T: la sigmoide va a destra e la K0,5 aumenta.","note":null,"times":2,"pending":false,"level":"m"},{"id":"t-r","topic":"m1-enzimologia","page":"28","src":"Biochimica II","q":"In un enzima allosterico la transizione dalla forma T alla forma R è inibita da:","opts":["Effettore omotropico negativo","Effettore eterotropico negativo","Effettore eterotropico positivo","Gli effettori allosterici non hanno influenza","Substrato in concentrazione saturante"],"ans":1,"why":"La inibisce un effettore negativo diverso dal substrato (eterotropico). L'effettore omotropico è il substrato stesso e di solito è positivo.","note":null,"times":1,"pending":false,"level":"m"},{"id":"s-km","topic":"m1-enzimologia","page":"27","src":"Biochimica II","q":"Quando la concentrazione di substrato è uguale alla KM:","opts":["La velocità è uguale alla velocità massima","Tutto l'enzima è legato al substrato","La velocità è metà della velocità massima","Diminuisce la formazione del prodotto","La velocità è un quarto della velocità massima"],"ans":2,"why":"È la definizione di KM: la concentrazione di substrato a cui v = ½ Vmax.","note":null,"times":1,"pending":false,"level":"f"},{"id":"serina","topic":"m1-enzimologia","page":"29","src":"Biochimica II","q":"Quale tra questi residui aminoacidici si può trovare nel sito di fosforilazione di una proteina substrato di una protein chinasi?","opts":["Fenilalanina","Serina","Aspartato","Lisina","Glicina"],"ans":1,"why":"Le protein chinasi fosforilano l'OH di serina e treonina (e tirosina).","note":null,"times":1,"pending":false,"level":"f"},{"id":"lento","topic":"m1-enzimologia","page":"30","src":"Biochimica II","q":"Tra i meccanismi di regolazione, quale tra questi rientra in un meccanismo lento?","opts":["Controllo allosterico","Espressione dell'enzima","Fosforilazione dell'enzima","Nessuno di questi","Inibizione da prodotto"],"ans":1,"why":"Allosteria e fosforilazione sono rapide. Cambiare la quantità di enzima (sintesi o degradazione) richiede ore.","note":null,"times":1,"pending":false,"level":"f"},{"id":"acqua-sub","topic":"m1-enzimologia","page":"146","src":"Biochimica II","q":"Quali tra questi enzimi ha l'acqua come substrato?","opts":["Isomerasi","Chinasi","Ossidoreduttasi (deidrogenasi)","Fosfatasi","Ligasi"],"ans":3,"why":"La fosfatasi idrolizza l'estere fosforico (es. glucosio 6-fosfatasi). Le chinasi usano ATP, le deidrogenasi NAD/FAD.","note":null,"times":1,"pending":false,"level":"m"},{"id":"mutasi","topic":"m1-enzimologia","page":"45","src":"Biochimica II","q":"Enzimi che trasferiscono gruppi sostituenti in posizioni diverse della stessa molecola si chiamano:","opts":["Isomerasi","Fosforilasi","Chinasi","Mutasi","Epimerasi"],"ans":3,"why":"Le mutasi spostano un gruppo nella stessa molecola: 3-fosfoglicerato → 2-fosfoglicerato.","note":null,"times":1,"pending":false,"level":"f"},{"id":"glut-fegato","topic":"m2-ingresso","page":"32–33","src":"Biochimica II","q":"Quali sono i trasportatori di glucosio nell'epatocita?","opts":["GLUT1","GLUT2","GLUT3","GLUT4","SGLT1"],"ans":1,"why":"GLUT2: fegato, pancreas e membrana basolaterale dell'enterocita. Kt 17 mM, alta capacità: lavora dopo i pasti.","note":null,"times":1,"pending":false,"level":"f"},{"id":"glut4","topic":"m2-ingresso","page":"33, 35","src":"Biochimica II","q":"In quali tra queste cellule l'insulina permette il trasferimento sulla superficie dei trasportatori GLUT4?","opts":["Neuroni","Globuli rossi","Epatociti","Adipociti","Enterociti"],"ans":3,"why":"GLUT4: muscolo scheletrico, cuore e tessuto adiposo.","note":null,"times":1,"pending":false,"level":"f"},{"id":"glut-entero","topic":"m2-ingresso","page":"32","src":"Biochimica II","q":"Quale trasportatore del glucosio si trova sulla membrana basolaterale degli enterociti?","opts":["GLUT1","GLUT2","GLUT3","GLUT4","SGLT1"],"ans":1,"why":"Dal lume il glucosio entra con l'SGLT1, verso il sangue esce con il GLUT2 basolaterale.","note":null,"times":1,"pending":false,"level":"f"},{"id":"glut-bidir","topic":"m2-ingresso","page":"33","src":"Biochimica II","q":"I trasportatori GLUT sono:","opts":["unidirezionali","bidirezionali","possono assumere una sola conformazione","sono tutti sotto controllo ormonale","accoppiati al gradiente del sodio"],"ans":1,"why":"Diffusione facilitata: il verso dipende solo dal gradiente (il fegato a digiuno libera glucosio con il GLUT2). Hanno due conformazioni, T1 e T2, e solo il GLUT4 è sotto controllo ormonale.","note":null,"times":1,"pending":false,"level":"m"},{"id":"glut-tumore","topic":"m2-ingresso","page":"64 e seguenti (pagine non numerate, effetto Warburg)","src":"Biochimica II","q":"In una cellula tumorale aumenta l'espressione di GLUT. Si tratterà di:","opts":["GLUT1","GLUT2","GLUT3","GLUT4","GLUT5"],"ans":0,"why":"Nelle cellule tumorali il fattore HIF è attivo anche con l'ossigeno e fa trascrivere enzimi glicolitici, LDH e trasportatori: soprattutto il GLUT1, ad alta affinità, che lavora già a glicemia basale (effetto Warburg).","note":"La sbobina cita sia GLUT1 sia GLUT3 tra i geni attivati da HIF: la risposta attesa è GLUT1. Se a lezione è stato detto diversamente, fallo presente segnalandolo.","times":1,"pending":false,"level":"a"},{"id":"gr-insulina","topic":"m2-ingresso","page":"33","src":"Biochimica II","q":"Quale di queste cellule non ha il recettore per l'insulina?","opts":["Epatocita","Miocita","Adipocita","Globulo rosso","Fibroblasto"],"ans":3,"why":"Il globulo rosso prende il glucosio con il GLUT1, indipendente dall'insulina. Esistono pochi recettori anche sugli eritrociti, ma la risposta attesa è questa.","note":null,"times":1,"pending":false,"level":"m"},{"id":"insulina-sec","topic":"m2-ingresso","page":"34","src":"Biochimica II","q":"Quali di questi eventi non è coinvolto nella secrezione dell'insulina?","opts":["Fosforilazione del glucosio per opera della glucochinasi","Fosforilazione ossidativa","Ingresso di ioni potassio","Ingresso del calcio","Chiusura dei canali K⁺ ATP-dipendenti"],"ans":2,"why":"L'ATP chiude i canali del K⁺: il potassio smette di uscire, la membrana si depolarizza, entra Ca²⁺ e partono le vescicole di insulina.","note":null,"times":1,"pending":false,"level":"m"},{"id":"glut1-neonati","topic":"m2-ingresso","page":"33","src":"Biochimica II","q":"Quali di questi eventi è più probabile che avvengano in neonati che presentano mutazioni del gene che codifica per GLUT1? (E come intervenire?)","opts":["Ipoglicemia","Problemi neurologici","Insufficienza renale","Insufficienza cardiaca","Diabete neonatale"],"ans":1,"why":"Il GLUT1 porta il glucosio oltre la barriera ematoencefalica: il deficit dà convulsioni e ritardo dello sviluppo con glicemia normale. Si interviene con la dieta chetogenica, perché i corpi chetonici entrano nel cervello con altri trasportatori.","note":"Il nome della sindrome (deficit di GLUT1) e la dieta chetogenica non sono nelle sbobine.","times":1,"pending":false,"level":"a"},{"id":"glut-placenta","topic":"m2-ingresso","page":null,"src":"Biochimica II","q":"Quale trasportatore del glucosio vi aspettate di trovare nelle cellule della placenta?","opts":["GLUT1","GLUT2","GLUT3","GLUT4","GLUT5"],"ans":0,"why":"Nella placenta il trasportatore principale è il GLUT1: come nella barriera ematoencefalica, deve far passare glucosio già a glicemia basale.","note":"Non è nelle sbobine (Lehninger).","times":1,"pending":false,"level":"m"},{"id":"peptide-c","topic":"m2-ingresso","page":"36","src":"Biochimica II","q":"Un paziente con iperglicemia presenta nel sangue valori normali del peptide C originato dal taglio della proinsulina. Questo dato indica che:","opts":["L'insulina non viene prodotta dalle cellule del pancreas","L'insulina non trasporta i GLUT4 sulle membrane delle cellule muscolari","Il trasporto del glucosio nel fegato è rallentato","La glucochinasi del pancreas è c… (fine illeggibile nella foto)","Le cellule β producono troppa insulina"],"ans":1,"why":"Peptide C normale = l'insulina viene prodotta. L'iperglicemia dipende dall'insulino-resistenza: i GLUT4 non vengono esposti sulla membrana.","note":null,"times":1,"pending":false,"level":"m"},{"id":"glc-atp","topic":"m2-fosforilazione","page":"37, 40","src":"Biochimica II","q":"Nella reazione: Glucosio + ATP → Glucosio 6P + ADP","opts":["Il fosfato in alfa dell'ATP è trasferito al glucosio","La scissione dell'ATP spinge la reazione verso destra","Si forma un legame anidridico","Il ΔG°' è ampiamente positivo","Il fosfato in beta dell'ATP è trasferito al glucosio"],"ans":1,"why":"Viene trasferito il fosfato γ e si forma un fosfoestere. La reazione è accoppiata all'idrolisi dell'ATP, che rende il ΔG negativo.","note":null,"times":2,"pending":false,"level":"m"},{"id":"glucochinasi","topic":"m2-fosforilazione","page":"37","src":"Biochimica II","q":"Quale delle seguenti affermazioni è vera per la glucochinasi?","opts":["È un enzima ubiquitario","Trasforma il glucosio in glucosio 1-P","Ha una KM superiore a quella dell'esochinasi","Forma un legame fosfoanidridico tra il glucosio ed il fosfato","È inibita dal glucosio 6-fosfato"],"ans":2,"why":"La glucochinasi (esochinasi IV) è solo in fegato e pancreas, ha una KM circa 100 volte più alta dell'esochinasi e forma glucosio 6-P con un fosfoestere.","note":null,"times":1,"pending":false,"level":"m"},{"id":"g6p-falsa","topic":"m2-fosforilazione","page":"38, 65","src":"Biochimica II","q":"Quale tra queste affermazioni non è vera per il glucosio 6P?","opts":["È il precursore del ribosio","Può essere immagazzinato sotto forma di glicogeno","Passa liberamente nel mitocondrio","Nell'epatocita può essere convertito in glucosio","Può entrare nella glicolisi"],"ans":2,"why":"La membrana mitocondriale interna è impermeabile: il G6P resta nel citosol. Dà ribosio (pentoso fosfati), glicogeno e, nel fegato, glucosio libero (glucosio 6-fosfatasi).","note":null,"times":1,"pending":false,"level":"m"},{"id":"bilancio-g6p","topic":"m2-glicolisi","page":"47","src":"Biochimica II","q":"Il bilancio della glicolisi a partire dal glucosio-6P dà:","opts":["La riduzione di una molecola di NAD⁺","La produzione di anidride carbonica","Un aumento del pH","La formazione di 3 molecole di ATP","La formazione di 2 molecole di ATP"],"ans":3,"why":"Partendo dal G6P non si spende l'ATP dell'esochinasi: 4 prodotti − 1 (PFK1) = 3 ATP. Si riducono 2 NAD⁺, non si forma CO₂ e il pH scende.","note":null,"times":1,"pending":false,"level":"a"},{"id":"glut5","topic":"m2-glicolisi","page":"64 e seguenti (pagine non numerate)","src":"Biochimica II","q":"Le cellule testicolari posseggono trasportatori GLUT5. Quanti ATP si formano nella glicolisi?","opts":["1","2","3","4","5"],"ans":1,"why":"Il GLUT5 trasporta fruttosio. Nel muscolo il fruttosio diventa fruttosio 6-P con l'esochinasi; nel fegato fruttosio 1-P con la fruttochinasi, poi DHAP e gliceraldeide. In entrambi i casi il bilancio è di 2 ATP netti per esoso (4 prodotti, 2 spesi).","note":"Sbobina di Biochimica II, pagine non numerate dopo p. 64: la triosio chinasi fosforila la gliceraldeide a «gliceraldeide 2-fosfato». Il prodotto è la gliceraldeide 3-fosfato, come mostra anche la figura accanto.","times":1,"pending":false,"level":"a"},{"id":"gapdh-legame","topic":"m2-glicolisi","page":"43","src":"Biochimica II","q":"Durante la catalisi della gliceraldeide 3P deidrogenasi quale legame non si forma?","opts":["Fosfoanidridico","Tioemiacetale","Fosfoestere","Tioestere","Legame carbonio-idrogeno con il NAD⁺ (idruro)"],"ans":2,"why":"Si formano il tioemiacetale (Cys–aldeide), il tioestere dopo l'ossidazione e il fosfoanidridico misto dell'1,3-BPG. Il fosfoestere in C3 c'era già nella GA3P.","note":"Sbobina di Biochimica II, p. 43: il meccanismo dice che va al NAD⁺ «l'H⁺ sotto forma di idruro» e che «la riduzione» trasforma l'aldeide. Va al NAD⁺ un idruro (H⁻), l'aldeide si ossida e si forma il tioestere con la cisteina.","times":1,"pending":false,"level":"l"},{"id":"gapdh-cys","topic":"m2-glicolisi","page":"43","src":"Biochimica II","q":"Quale residuo aminoacidico è coinvolto nella catalisi della gliceraldeide 3-fosfato deidrogenasi?","opts":["Serina","Cisteina","Lisina","Metionina","Istidina"],"ans":1,"why":"Il gruppo SH della cisteina attacca l'aldeide; per questo lo iodoacetato, che lo alchila, blocca la glicolisi.","note":null,"times":1,"pending":false,"level":"m"},{"id":"gapdh-nadh","topic":"m2-glicolisi","page":"43","src":"Biochimica II","q":"Nella reazione GA3P + Pi + NAD⁺ ⇌ 1,3-BPG + NADH + H⁺, un aumento del NADH produce:","opts":["Una diminuzione del NAD⁺","Un aumento della GA3P","Una diminuzione del pH","Nessun cambiamento","Un aumento dell'1,3-BPG"],"ans":1,"why":"Più NADH sposta l'equilibrio a sinistra (Le Chatelier): si riforma GA3P e aumenta il NAD⁺.","note":null,"times":1,"pending":false,"level":"a"},{"id":"slp-reazione","topic":"m2-glicolisi","page":"44","src":"Biochimica II","q":"Quale delle seguenti reazioni è una fosforilazione a livello del substrato?","opts":["Conversione della gliceraldeide in 1,3 bisfosfoglicerato","Conversione del 1,3 bisfosfoglicerato in 3-fosfoglicerato","Formazione del 2-fosfoglicerato","Formazione del fosfoenolpiruvato","Conversione del fruttosio 6-P in fruttosio 1,6-bisfosfato"],"ans":1,"why":"La fosfoglicerato chinasi: l'1,3-BPG cede il fosfato all'ADP. L'altra della glicolisi è la piruvato chinasi.","note":null,"times":1,"pending":false,"level":"f"},{"id":"dg-negativo","topic":"m2-glicolisi","page":"47","src":"Biochimica II","q":"Quale delle seguenti reazioni della glicolisi procede con un ΔG negativo?","opts":["Conversione del glucosio 6P in fruttosio 6P","Reazione della gliceraldeide 3 fosfato deidrogenasi","Reazione dell'enolasi","Reazione della piruvato chinasi","Reazione della fosfoglicerato mutasi"],"ans":3,"why":"Le tre reazioni con ΔG fortemente negativo sono esochinasi/glucochinasi, PFK1 e piruvato chinasi. Le altre sono vicine all'equilibrio.","note":null,"times":2,"pending":false,"level":"m"},{"id":"bpg-falsa","topic":"m2-glicolisi","page":"43–44","src":"Biochimica II","q":"Quale di queste affermazioni è falsa per l'1,3 bisfosfoglicerato?","opts":["Contiene un legame fosfoanidridico","Contiene un legame fosfoesterico","È meno ossidato del 3-fosfoglicerato","Ha un potenziale di trasferimento maggiore dell'ATP","Si forma nella reazione della GAPDH"],"ans":2,"why":"1,3-BPG e 3-fosfoglicerato hanno lo stesso stato di ossidazione (C1 a livello di acido): la fosfoglicerato chinasi sposta solo il fosfato.","note":null,"times":1,"pending":false,"level":"a"},{"id":"non-glicolisi","topic":"m2-glicolisi","page":"39","src":"Biochimica II","q":"Quali tra questi composti non partecipa alla glicolisi?","opts":["Esteri fosforici","Esosi","Acidi dicarbossilici","Fosfoanidridi","Triosi fosfati"],"ans":2,"why":"Nella glicolisi ci sono esosi, esteri fosforici e fosfoanidridi (ATP, 1,3-BPG). Gli acidi dicarbossilici (malato, ossalacetato, succinato) sono del ciclo di Krebs.","note":null,"times":1,"pending":false,"level":"m"},{"id":"doppio-legame","topic":"m2-glicolisi","page":"45","src":"Biochimica II","q":"Quale dei seguenti composti della glicolisi ha un doppio legame?","opts":["2-fosfoglicerato","Fosfoenolpiruvato","Fruttosio 1,6-bisfosfato","Piruvato","Glucosio 6-fosfato"],"ans":1,"why":"Il PEP ha un doppio legame C=C (forma enolica). Carbossili e chetoni hanno C=O, ma la domanda intende il doppio legame tra carboni.","note":null,"times":1,"pending":false,"level":"m"},{"id":"ga3p-fbp","topic":"m2-glicolisi","page":"41","src":"Biochimica II","q":"Una soluzione contiene gliceraldeide 3-P. Quali enzimi bisogna aggiungere per formare fruttosio 1,6 bisfosfato?","opts":["Gliceraldeide 3-P deidrogenasi + aldolasi","Gliceraldeide 3-P deidrogenasi + aldolasi + triosofosfato isomerasi","Triosofosfato isomerasi + diidrossiacetone 3-P deidrogenasi","Aldolasi + triosofosfato isomerasi","Solo aldolasi"],"ans":3,"why":"La trioso fosfato isomerasi forma DHAP da una parte della GA3P, poi l'aldolasi (reversibile) condensa DHAP + GA3P in FBP.","note":null,"times":1,"pending":false,"level":"a"},{"id":"fbp-f6p","topic":"m2-glicolisi","page":"41, 146","src":"Biochimica II","q":"Una soluzione contiene gliceraldeide 3-P, aldolasi e triosofosfato isomerasi, quindi si forma fruttosio 1,6-bisfosfato. Quale ulteriore enzima della via glicolitica, aggiunto, permetterà la formazione del fruttosio 6-P?","opts":["Nessuno","Bastano quelli presenti","Fosfofruttochinasi 1","Fosfoesoso isomerasi","Esochinasi"],"ans":0,"why":"Per FBP → F6P serve la fruttosio 1,6-bisfosfatasi, che è della gluconeogenesi. La PFK1 è irreversibile e la fosfoesoso isomerasi agisce su F6P/G6P.","note":"Nel foglio la domanda dice «alla soluzione precedente»: qui è collegata a quella sulla gliceraldeide 3-P. Se a lezione la soluzione era un'altra, fallo presente segnalandolo.","times":1,"pending":false,"level":"a"},{"id":"ferm-irrev","topic":"m2-fermentazioni","page":"53","src":"Biochimica II","q":"La fermentazione etanolica non è un processo reversibile. Perché?","opts":["Perché avviene in due tappe","Non ci sono nei microrganismi gli enzimi per le reazioni inverse","La prima tappa della fermentazione alcolica è una decarbossilazione","L'acetaldeide si ossida velocemente in acetato","L'etanolo viene subito eliminato dalla cellula"],"ans":2,"why":"Piruvato → acetaldeide + CO₂: la decarbossilazione è irreversibile. La riduzione ad etanolo (alcol deidrogenasi) invece è reversibile.","note":null,"times":1,"pending":false,"level":"m"},{"id":"etanolo-vera","topic":"m2-fermentazioni","page":"53","src":"Biochimica II","q":"Quale di queste affermazioni è vera per l'etanolo?","opts":["La conversione in acetato richiede 1 NADH","La conversione in acetato richiede l'aldeide deidrogenasi","In eccesso di etanolo, diminuisce la formazione di lattato","È consigliabile assumere etanolo prima di una attività sportiva","La conversione in acetaldeide richiede il FAD"],"ans":1,"why":"Etanolo → acetaldeide (alcol deidrogenasi) → acetato (aldeide deidrogenasi): si producono 2 NADH. L'NADH in eccesso spinge il piruvato a lattato, quindi il lattato aumenta.","note":null,"times":1,"pending":false,"level":"a"},{"id":"etanolo-falsa","topic":"m2-fermentazioni","page":"53, 169","src":"Biochimica II","q":"Quale affermazione è falsa per l'etanolo?","opts":["Passa la barriera ematoencefalica","La sua conversione in acetato avviene nel fegato","La produzione di acido acetico è un processo fermentativo","L'alcol deidrogenasi è un enzima costitutivo","È ossidato soprattutto nel fegato dall'alcol deidrogenasi"],"ans":2,"why":"Nel fegato l'etanolo viene ossidato con NAD⁺: è un'ossidazione, non una fermentazione (che serve a riossidare NADH). L'alcol deidrogenasi è costitutiva; inducibile è il citocromo P450.","note":null,"times":1,"pending":false,"level":"a"},{"id":"ldh-falsa","topic":"m2-fermentazioni","page":"50","src":"Biochimica II","q":"Quale affermazione è falsa per la lattico deidrogenasi?","opts":["È un enzima a chiralità selettiva","È sempre un omotetramero","È un enzima dipendente dal pH","È presente nei globuli rossi","Usa il NADH come coenzima"],"ans":1,"why":"È un tetramero di subunità H e M: solo H4 e M4 sono omotetrameri, M3H, M2H2 e MH3 sono eterotetrameri.","note":"Sbobina di Biochimica II, p. 49: c'è scritto che la LDH forma solo l'isomero «R». L'L-lattato è (S)-lattato.","times":1,"pending":false,"level":"m"},{"id":"ldh1","topic":"m2-fermentazioni","page":"50, 52","src":"Biochimica II","q":"La presenza nel sangue dell'isoenzima LDH1 può essere indice di:","opts":["Strappi muscolari","Fragilità dei globuli rossi","Infarto del miocardio","Cirrosi epatica","Insufficienza renale acuta"],"ans":2,"why":"LDH1 = H4, isoenzima cardiaco: marker tardivo di infarto (circa 48 ore). Sale anche nell'emolisi, ma la risposta attesa è l'infarto.","note":null,"times":1,"pending":false,"level":"m"},{"id":"cori","topic":"m2-fermentazioni","page":"51, 148","src":"Biochimica II","q":"Quale di queste condizioni deve essere soddisfatta dal fegato per il ciclo di Cori?","opts":["Deve essere attiva la via glicolitica","Ci deve essere un alto rapporto NAD⁺/NADH","Deve essere attiva la trasduzione del segnale dell'insulina","Deve essere attiva la glucochinasi","Deve essere inattiva la glucosio 6-fosfatasi"],"ans":1,"why":"Il fegato ossida il lattato a piruvato con la LDH: serve molto NAD⁺. Glicolisi e glucochinasi devono essere ferme, perché si fa gluconeogenesi.","note":null,"times":1,"pending":false,"level":"m"},{"id":"anion-gap","topic":"m2-fermentazioni","page":"52","src":"Biochimica II","q":"L'anion gap (AG) in biochimica clinica è dato da AG = [Na⁺] − ([Cl⁻] + [HCO₃⁻]). In presenza di lattato il valore dell'AG:","opts":["Rimane invariato","Aumenta","Diminuisce","Si annulla","Diventa negativo"],"ans":1,"why":"Il lattato è un anione non misurato: il bicarbonato cala per tamponare l'H⁺, quindi l'AG aumenta (acidosi lattica ad anion gap aumentato).","note":"L'anion gap non è nelle sbobine.","times":1,"pending":false,"level":"a"},{"id":"dhap-rid","topic":"m2-navette","page":"54","src":"Biochimica II","q":"Quale composto si forma dalla riduzione NADH dipendente del diidrossiacetone fosfato?","opts":["Non può essere ridotto","Gliceraldeide 3-P","Un alfachetoacido","Glicerolo fosfato","Glicerolo libero"],"ans":3,"why":"Il chetone del DHAP si riduce ad alcol secondario: glicerolo 3-fosfato. È il primo passo della navetta del glicerolo fosfato.","note":"Sbobina di Biochimica II, p. 54: chiama il glicerolo 3-fosfato «3-fosfoglicerolo (3-PG)». Non confonderlo con il 3-fosfoglicerato, che altrove è abbreviato 3-PG.","times":2,"pending":false,"level":"m"},{"id":"navetta-fad","topic":"m2-navette","page":"54","src":"Biochimica II","q":"Nel sistema navetta del glicerolo fosfato:","opts":["Il FADH₂ è ossidato dal diidrossiacetone fosfato","Il NADH cede gli elettroni direttamente al FAD","Il glicerolo fosfato è ossidato dal FAD","Il FADH₂ cede gli elettroni direttamente all'ossigeno","Il glicerolo fosfato è ossidato dal NAD⁺ mitocondriale"],"ans":2,"why":"La glicerolo 3-fosfato deidrogenasi mitocondriale, FAD-dipendente, ossida il glicerolo fosfato a DHAP; il FADH₂ passa gli elettroni alla catena respiratoria (coenzima Q).","note":null,"times":1,"pending":false,"level":"m"},{"id":"navetta-atp","topic":"m2-navette","page":"47, 54","src":"Biochimica II","q":"Se la riossidazione del NADH produce 2,5 ATP e quella del FADH₂ 1,5 ATP, quante ATP si formano in totale da glucosio a piruvato se il sistema navetta è quello del glicerolo fosfato?","opts":["3","4","5","7","6"],"ans":2,"why":"2 ATP netti + 2 NADH citosolici che, con la navetta del glicerolo fosfato, diventano FADH₂: 2 + 2 × 1,5 = 5.","note":null,"times":1,"pending":false,"level":"a"},{"id":"fa-glucosio","topic":"m2-pdh","page":"70–71, 181","src":"Biochimica II","q":"Un aumento della degradazione degli acidi grassi nel mitocondrio provoca:","opts":["Una diminuzione del flusso del ciclo di Krebs","Una inibizione della citrato sintasi","Una diminuzione del catabolismo del glucosio","Un'attivazione della piruvato deidrogenasi","Un'attivazione della fosfofruttochinasi 1"],"ans":2,"why":"La β-ossidazione produce acetil-CoA e NADH, che inibiscono la PDH; il citrato in eccesso esce nel citosol e inibisce la PFK1. Risultato: si risparmia glucosio. La PDH quindi è inibita, non attivata.","note":"Il collegamento β-ossidazione → risparmio di glucosio (ciclo di Randle) non è spiegato in modo esplicito nelle sbobine: si ricava dalla regolazione di PDH e PFK1.","times":1,"pending":false,"level":"a"},{"id":"pdh-lipoico","topic":"m2-pdh","page":"66–71","src":"Biochimica II","q":"La conversione del piruvato in acetil CoA e CO₂:","opts":["è reversibile.","richiede la partecipazione dell'acido lipoico.","è attivata dalla fosforilazione del complesso della piruvato deidrogenasi da parte di una proteina chinasi in presenza di ATP.","avviene nel citosol.","dipende dal coenzima biotina."],"ans":1,"why":"Il lipoato è il braccio flessibile di E2. La reazione è irreversibile, avviene nella matrice, la fosforilazione da parte della PDH chinasi la inattiva e la biotina è il coenzima della piruvato carbossilasi.","note":null,"times":1,"pending":false,"level":"f"},{"id":"pdh-tiamina","topic":"m2-pdh","page":"66, 73, 86","src":"Biochimica II","q":"Un neonato di un mese mostra anomalie del sistema nervoso e acidosi lattica. Il dosaggio enzimatico dell'attività della piruvato deidrogenasi (PDH) su estratti di fibroblasti cutanei in coltura mostra un'attività pari al 5% del livello normale quando la concentrazione della tiamina pirofosfato (TPP) è bassa (1 × 10⁻⁴ mM), e un'attività pari all'80% del normale quando la concentrazione della TPP è elevata (0,4 mM). Quale delle seguenti affermazioni riguardo al paziente è la più corretta?","opts":["Un livello elevato di lattato e di piruvato nel sangue sono segni chiari di una carenza di PDH.","Ci si aspetta che il paziente presenti delle alterazioni nella degradazione degli acidi grassi.","Questo paziente potrebbe trarre giovamento da una dieta ricca di carboidrati.","Ci si può aspettare che la concentrazione di alanina nel sangue sia inferiore al normale.","La somministrazione della tiamina dovrebbe ridurre la concentrazione del lattato nel siero e portare a un miglioramento del quadro clinico."],"ans":4,"why":"L'E1 mutato ha bassa affinità per la TPP: con molta TPP l'attività torna all'80%, quindi la tiamina ad alte dosi aiuta. Lattato e piruvato alti non sono specifici (anche ipossia), la β-ossidazione è normale, i carboidrati peggiorano l'acidosi e l'alanina sale (il piruvato si accumula).","note":"Il caso clinico del deficit di PDH sensibile alla tiamina non è nelle sbobine (Lippincott); si ragiona su E1 e TPP.","times":1,"pending":false,"level":"a"},{"id":"anapl","topic":"m3-krebs","page":"87","src":"Biochimica II","q":"Una reazione anaplerotica può formare:","opts":["NADH","Piruvato","Ossalacetato","GTP","Acetil-CoA"],"ans":2,"why":"Le reazioni anaplerotiche riforniscono il ciclo di intermedi: la principale è piruvato → ossalacetato (piruvato carbossilasi).","note":null,"times":1,"pending":false,"level":"f"},{"id":"pc-biotina","topic":"m3-krebs","page":"87, 143","src":"Biochimica II","q":"Quale delle seguenti affermazioni è vera per la piruvato carbossilasi?","opts":["E' un enzima citosolico","Richiede la biotina","E' regolato dal NADH","Non si formano intermedi di reazione","È inibita dall'acetil-CoA"],"ans":1,"why":"È mitocondriale, usa la biotina (si forma l'intermedio carbossibiotina) ed è attivata dall'acetil-CoA, non regolata dal NADH.","note":null,"times":1,"pending":false,"level":"f"},{"id":"acoa-allost","topic":"m3-krebs","page":"48, 70, 87","src":"Biochimica II","q":"Di quale tra questi enzimi l'acetilCoA non è un effettore allosterico?","opts":["Piruvato deidrogenasi","Citrato sintasi","Piruvato chinasi","Piruvato carbossilasi","Piruvato deidrogenasi chinasi"],"ans":1,"why":"Per la citrato sintasi l'acetil-CoA è un substrato. Inibisce la PDH e la piruvato chinasi, attiva la piruvato carbossilasi.","note":null,"times":1,"pending":false,"level":"m"},{"id":"lattacidemia","topic":"m3-krebs","page":"73, 86","src":"Biochimica II","q":"Quali di questi eventi producono una lattacidemia?","opts":["Deficit di tiamina","Avvelenamento da arsenico","Avvelenamento da mercurio","Tutti e tre gli eventi","Nessuno dei tre eventi"],"ans":3,"why":"Tutti bloccano la PDH: la tiamina (TPP) serve a E1, arsenico e mercurio legano i gruppi SH del lipoato. Il piruvato non ossidato diventa lattato.","note":null,"times":1,"pending":false,"level":"m"},{"id":"krebs-nadh","topic":"m3-krebs","page":"84–85","src":"Biochimica II","q":"Quale delle seguenti condizioni fa diminuire l'ossidazione dell'acetil CoA attraverso il ciclo dell'acido citrico?","opts":["Un rapporto ATP/ADP basso.","Un basso livello del NADH dovuto alla rapida ossidazione a NAD⁺ attraverso la catena respiratoria.","Un rapporto NAD⁺/NADH basso.","Una concentrazione elevata dell'AMP.","Un rapporto GTP/GDP basso."],"ans":2,"why":"Con poco NAD⁺ le deidrogenasi del ciclo (isocitrato, α-chetoglutarato, malato DH) rallentano e il NADH le inibisce. Le altre condizioni segnalano bisogno di energia e accelerano il ciclo.","note":null,"times":1,"pending":false,"level":"m"},{"id":"krebs-3tappe","topic":"m3-krebs","page":"81–83","src":"Biochimica II","q":"La seguente equazione è la somma di tre tappe del ciclo dell'acido citrico: A + B + FAD + H₂O ⇌ C + FADH₂ + NADH. Quale combinazione è corretta (Reagente A, Reagente B, Prodotto C)?","opts":["A: succinil CoA; B: GDP; C: succinato","A: succinato; B: NAD⁺; C: ossalacetato","A: fumarato; B: NAD⁺; C: ossalacetato","A: succinato; B: NAD⁺; C: malato","A: fumarato; B: GTP; C: malato"],"ans":1,"why":"Succinato → fumarato (FAD), fumarato + H₂O → malato, malato → ossalacetato (NAD⁺). Partendo dal fumarato mancherebbe il FAD.","note":null,"times":1,"pending":false,"level":"a"},{"id":"mito-falsa","topic":"m2-navette","page":"54, 74","src":"Biochimica II","q":"Quale affermazione è falsa riguardo ai mitocondri?","opts":["Sono presenti in copie multiple all'interno della cellula","La matrice mitocondriale contiene DNA","La membrana mitocondriale interna è impermeabile agli ioni","Il NADH può entrare all'interno della matrice","La membrana esterna è permeabile alle piccole molecole"],"ans":3,"why":"La membrana interna è impermeabile al NADH: entrano solo i suoi elettroni, tramite le navette del glicerolo fosfato e del malato-aspartato.","note":null,"times":1,"pending":false,"level":"f"},{"id":"pila-nad","topic":"m3-catena","page":"91–92","src":"Biochimica II","q":"La seguente reazione: NAD⁺ + 2H⁺ + 2e → NADH + H⁺ ha un ΔE°' di −0,32 V. Questo significa che in una pila ad idrogeno:","opts":["gli elettroni migrano verso la semicella che contiene NAD","la pressione dell'H₂ diminuisce","il pH della semicella ad idrogeno diminuisce","nessuna delle tre","il NAD⁺ della semicella viene ridotto a NADH"],"ans":3,"why":"Potenziale negativo: il NADH cede elettroni, che vanno verso l'elettrodo a idrogeno. Lì gli H⁺ si riducono a H₂: la pressione dell'H₂ aumenta e il pH sale. Quindi A, B e C sono tutte false.","note":null,"times":1,"pending":false,"level":"a"},{"id":"de-positivo","topic":"m3-catena","page":"91–92, 99","src":"Biochimica II","q":"Se il ΔE°' è > 0 la reazione:","opts":["procederà verso destra","la direzione dipenderà dalle concentrazioni delle specie","procederà verso sinistra","la reazione è all'equilibrio","il ΔG°' della reazione sarà positivo"],"ans":0,"why":"ΔG°' = −nFΔE°': con ΔE°' positivo il ΔG°' è negativo e la reazione è spontanea verso destra (in condizioni standard).","note":"Risposta da confermare con quella data a lezione: in condizioni reali la direzione dipende anche dalle concentrazioni (equazione di Nernst), come per ΔG e ΔG°'. Se il docente ha indicato la B, segnalalo.","times":1,"pending":false,"level":"m"},{"id":"pompe-h","topic":"m3-catena","page":"93–99","src":"Biochimica II","q":"Quale di queste affermazioni è vera per le pompe protoniche?","opts":["Sono bidirezionali","Sono presenti in tutti i complessi","Sono attivate dall'energia ossidoriduttiva","Depolarizzano la membrana mitocondriale interna","Consumano ATP per trasportare i protoni"],"ans":2,"why":"I complessi I, III e IV pompano protoni sfruttando l'energia del trasferimento di elettroni. Il complesso II non pompa; il pompaggio è vettoriale (matrice → spazio intermembrana) e polarizza la membrana.","note":null,"times":1,"pending":false,"level":"m"},{"id":"coq-falsa","topic":"m3-catena","page":"93–96","src":"Biochimica II","q":"Quali tra queste affermazioni riguardo il coenzima Q è falsa?","opts":["E' ridotto dai complessi contenenti coenzimi flavinici","Presenta una coda isoprenoide idrofobica","Puo' assumere una forma semichinonica","Riduce le proteine ferro-zolfo del complesso I","Diffonde nel doppio strato della membrana interna"],"ans":3,"why":"Il Q riceve gli elettroni dai centri Fe-S del complesso I (e dai complessi con FAD), non li cede a loro. Ha 10 unità isopreniche e passa per il semichinone.","note":null,"times":1,"pending":false,"level":"m"},{"id":"flavinico","topic":"m3-catena","page":"66, 87, 93","src":"Biochimica II","q":"Quali dei seguenti complessi/enzimi non contiene un derivato flavinico?","opts":["Glicerolo fosfato deidrogenasi mitocondriale","Complesso I","Piruvato carbossilasi","Piruvato deidrogenasi","Succinato deidrogenasi"],"ans":2,"why":"La piruvato carbossilasi usa la biotina. Glicerolo fosfato DH mitocondriale (FAD), complesso I (FMN) e PDH (FAD su E3) contengono flavine.","note":null,"times":1,"pending":false,"level":"m"},{"id":"inib-c3","topic":"m3-catena","page":"104","src":"Biochimica II","q":"Se un inibitore blocca il complesso III:","opts":["Il complesso 1 è ossidato","Il complesso 2 è ridotto","Il citocromo c è ridotto","Il rapporto Q/QH2 è alto","Il complesso 4 è ridotto"],"ans":1,"why":"A monte del blocco i trasportatori restano ridotti (complessi I e II, QH₂ alto, quindi Q/QH₂ basso); a valle restano ossidati (citocromo c, complesso IV).","note":null,"times":1,"pending":false,"level":"a"},{"id":"c3-falsa","topic":"m3-catena","page":"96–97","src":"Biochimica II","q":"Quali delle seguenti affermazioni è falsa riguardo al complesso III?","opts":["Serve a riossidare l'ubichinolo","Contiene la proteina di Rieske","Gli elettroni passano dal citocromo b_L al citocromo c₁","I gruppi eme dei citocromi c1 e c vengono a stretto contatto","Pompa protoni nello spazio intermembrana"],"ans":2,"why":"Dal QH₂ un elettrone va alla proteina di Rieske → citocromo c₁ → citocromo c; l'altro va al citocromo b_L → b_H e torna a un Q (ciclo del Q). Il b_L non cede a c₁.","note":null,"times":1,"pending":false,"level":"l"},{"id":"ubichinone","topic":"m3-catena","page":"93–95","src":"Biochimica II","q":"Una diminuita sintesi dell'ubichinone produrrà:","opts":["incremento del ciclo di Krebs","aumento di lattato","maggiore consumo di ossigeno","aumento dell'attività della piruvato DH","aumento della sintesi di ATP"],"ans":1,"why":"Senza Q la catena si blocca: il NADH non si riossida, Krebs e PDH rallentano, cala il consumo di O₂ e il piruvato viene ridotto a lattato.","note":null,"times":1,"pending":false,"level":"a"}],"bank":[{"id":"m1c-01","topic":"m1-catabolismo","level":"f","page":"5","src":"Biochimica II","q":"Il catabolismo è:","opts":["La degradazione di molecole complesse in molecole più semplici, che libera energia","La sintesi di molecole complesse a partire da precursori semplici, che consuma ATP","L'insieme delle reazioni che consumano ATP per produrre il calore corporeo","L'eliminazione dei metaboliti terminali con urine, sudore e respirazione","Il trasporto dei nutrienti dal sangue all'interno delle cellule, che consuma ATP"],"ans":0,"why":"Il catabolismo degrada nutrienti e componenti cellulari ricavando energia (ATP) e potere riducente; l'anabolismo fa il contrario.","note":null,"fixed":false},{"id":"m1c-02","topic":"m1-catabolismo","level":"f","page":"6–9","src":"Biochimica II","q":"Quali sono i metaboliti terminali del catabolismo?","opts":["Piruvato e acetil-CoA","CO₂, H₂O e NH₃ (eliminata come urea)","Glucosio, acidi grassi e glicerolo","Piruvato e acetil-CoA, che poi vengono eliminati nel sangue","Lattato, urea e acetone (nel digiuno)"],"ans":1,"why":"I metaboliti terminali non rientrano nel metabolismo: CO₂ si elimina con la respirazione, H₂O si unisce all'acqua corporea, NH₃ diventa urea.","note":null,"fixed":false},{"id":"m1c-03","topic":"m1-catabolismo","level":"f","page":"8–9","src":"Biochimica II","q":"Verso quali intermedi comuni convergono le vie cataboliche di carboidrati, lipidi e proteine?","opts":["Glucosio e glicerolo","Piruvato e acetil-CoA","Urea e CO₂","Ossalacetato e citrato","Glicogeno e trigliceridi"],"ans":1,"why":"Piruvato e acetil-CoA sono i metaboliti intermedi in cui convergono le vie cataboliche.","note":null,"fixed":false},{"id":"m1c-04","topic":"m1-catabolismo","level":"m","page":"9","src":"Biochimica II","q":"Che cosa distingue un metabolita intermedio da uno terminale?","opts":["L'intermedio può essere ossidato per dare energia oppure usato per le biosintesi","L'intermedio è sempre più ossidato del terminale e per questo non può più essere ridotto","Il terminale entra nel ciclo di Krebs, mentre l'intermedio non vi può accedere","L'intermedio viene eliminato con le urine, mentre il terminale resta nella cellula","Il terminale si accumula nel tessuto adiposo come riserva energetica a lungo termine"],"ans":0,"why":"L'acetil-CoA, ad esempio, può entrare nel ciclo di Krebs oppure diventare acidi gras
