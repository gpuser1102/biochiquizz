i (fegato, adiposo, mammella in lattazione, corteccia surrenale); glutatione (eritrociti); ribosio (tessuti in rapida proliferazione).","note":null,"fixed":false},{"id":"h6g-04","topic":"m6-regolazione","level":"h","page":"165","src":"Biochimica II","q":"Perché nel muscolo scheletrico la fase ossidativa della via è poco attiva?","opts":["Fa poche biosintesi riduttive: il NADPH resta alto","Non ha glucosio 6-fosfato disponibile nel citosol","Non ha bisogno di ribosio, perché non sintetizza nucleotidi","È inibita dal glucagone tramite fosforilazione della G6PD","Non contiene NADP⁺, ma solo NAD⁺ legato agli enzimi glicolitici"],"ans":0,"why":"Il NADPH alto inibisce la G6PD: la via segue la domanda di NADPH.","note":null,"fixed":false},{"id":"h6g-05","topic":"m6-regolazione","level":"h","page":"160–164","src":"Biochimica II","q":"Perché le reazioni della fase non ossidativa sono reversibili mentre la fase ossidativa no?","opts":["La fase ossidativa ha deidrogenazioni e una decarbossilazione con ΔG molto negativo","La fase non ossidativa consuma ATP a ogni trasferimento, e questo la rende reversibile","La fase ossidativa avviene nel mitocondrio, dove i prodotti non possono tornare indietro","La fase non ossidativa usa NADPH come riducente, che la rende reversibile","In realtà sono tutte irreversibili, perché la via è regolata solo dalla G6PD"],"ans":0,"why":"La fase non ossidativa trasferisce unità carboniose tra zuccheri fosfato con ΔG ≈ 0: può lavorare nei due sensi a seconda dei bisogni.","note":null,"fixed":false},{"id":"h6g-06","topic":"m6-regolazione","level":"h","page":"164","src":"Biochimica II","q":"Se la G6PD è inibita, una cellula in divisione può ancora produrre ribosio 5-P?","opts":["Sì, dalla fase non ossidativa invertita, ma senza NADPH","No, perché il ribosio deriva solo dalla fase ossidativa","Sì, ma solo nel mitocondrio, dove c'è una seconda G6PD","Sì, tramite la gluconeogenesi, che produce ribosio 5-P dal piruvato","No, perché la transchetolasi richiede NADPH come coenzima"],"ans":0,"why":"F6P + GAP → pentosi: ribosio e NADPH hanno vie di produzione separabili.","note":null,"fixed":false},{"id":"h6g-07","topic":"m6-regolazione","level":"h","page":"159","src":"Biochimica II","q":"Perché il ribosio 5-P è importante anche per i coenzimi?","opts":["Serve per i nucleotidi presenti anche in NAD, FAD e CoA","Il ribosio è esso stesso un coenzima delle deidrogenasi","Il ribosio trasporta elettroni come il NADPH","Il ribosio fornisce il fosfato all'ATP","Il ribosio è il precursore diretto del glucosio nel fegato e quindi delle vitamine idrosolubili"],"ans":0,"why":"Le vitamine vengono «attivate» legandole a parti di nucleotidi (es. AMP in NAD, FAD e CoA).","note":null,"fixed":false},{"id":"h6g-08","topic":"m6-regolazione","level":"h","page":"160","src":"Biochimica II","q":"Che cosa succede se il ribosio 5-P non viene usato ma serve NADPH?","opts":["Diventa ribulosio 5-P e poi xilulosio 5-P, ed entra nella fase ricombinativa","Il ribosio 5-P inibisce la G6PD e blocca la via finché non viene consumato","Il ribosio 5-P viene ossidato a CO₂ dalla transaldolasi, producendo NADPH","Il ribosio 5-P esce dalla cellula con i GLUT e viene usato dal fegato","Il ribosio 5-P viene trasformato in NADPH dalla 6-fosfogluconato deidrogenasi"],"ans":0,"why":"Il ribosio 5-P accumulato torna ribulosio 5-P (isomerasi) e l'epimerasi produce xilulosio 5-P. Ribulosio 5-P e xilulosio 5-P sono epimeri al C3.","note":null,"fixed":false},{"id":"h6n-01","topic":"m6-nadph","level":"h","page":"170","src":"Biochimica II","q":"Un uomo con deficit di G6PD mangia fave e dopo un giorno ha urine scure, ittero e anemia. Quale meccanismo?","opts":["Senza NADPH il glutatione non si rigenera: l'Hb si ossida e gli eritrociti si lisano","Le fave contengono un inibitore della piruvato chinasi eritrocitaria","Le fave bloccano la sintesi dell'emoglobina nei reticolociti, che si lisano","Le fave causano una carenza acuta di ferro e folati, che blocca l'eritropoiesi","Le fave contengono anticorpi diretti contro la membrana degli eritrociti del soggetto"],"ans":0,"why":"Le sostanze ossidanti delle fave aumentano i perossidi; l'emoglobina ossidata precipita (corpi di Heinz). È il favismo; anche farmaci e infezioni possono scatenare crisi.","note":"Sbobina di Biochimica II, p. 170: si attribuisce l'azione ossidativa al «polline di fava». Le crisi sono scatenate soprattutto dall'ingestione delle fave (vicina e convicina); l'inalazione del polline è un'evenienza molto più rara.","fixed":false},{"id":"h6n-02","topic":"m6-nadph","level":"h","page":"170","src":"Biochimica II","q":"Perché il deficit di G6PD colpisce soprattutto gli eritrociti e soprattutto i maschi?","opts":["L'eritrocita non ha altre fonti di NADPH; il gene è sul cromosoma X","Solo gli eritrociti hanno la G6PD; il gene è sul cromosoma Y, presente solo nei maschi","Il gene è sul cromosoma Y; negli eritrociti l'enzima è più instabile che negli altri tessuti","Le donne non hanno eritrociti con G6PD, ma usano solo l'enzima malico per il NADPH","È autosomico dominante ma più grave nei maschi per motivi ormonali legati al testosterone"],"ans":0,"why":"L'eritrocita non ha mitocondri; i maschi emizigoti esprimono il difetto. Le femmine eterozigoti possono essere affette in parte per inattivazione dell'X.","note":null,"fixed":false},{"id":"h6n-03","topic":"m6-nadph","level":"h","page":"166–167","src":"Biochimica II","q":"Come funziona il citocromo P450 epatico nella idrossilazione di un farmaco?","opts":["Usa O₂ e due elettroni del NADPH: un O al substrato, l'altro all'acqua","Usa NADH come donatore di elettroni e produce ATP durante l'idrossilazione","Trasferisce il fosfato dall'ATP al farmaco per renderlo più solubile in acqua","Usa il glutatione come donatore di ossigeno e lo trasferisce al farmaco","Usa O₂ e due elettroni del NADPH: entrambi gli atomi di O vanno al substrato"],"ans":0,"why":"Gli elettroni arrivano tramite la P450 reduttasi (FAD/FMN): RH → ROH. È una monoossigenasi (ossidasi a funzione mista).","note":"Sbobina di Biochimica II, pp. 166 e 168: compaiono «citocromo p5» e «P450 (cye2I)». Sono il citocromo b5 e il CYP2E1. Inoltre l'adrenodossina è descritta per il sistema mitocondriale, ma nella spiegazione del meccanismo viene usata anche per quello del reticolo, dove gli elettroni arrivano dalla P450 reduttasi.","fixed":false},{"id":"h6n-04","topic":"m6-nadph","level":"h","page":"168–169","src":"Biochimica II","q":"Un forte bevitore assume dosi abituali di paracetamolo e sviluppa epatite acuta. Perché?","opts":["L'alcol induce il CYP2E1: più metabolita tossico e meno glutatione","L'alcol inibisce tutti i citocromi P450 e il paracetamolo si accumula","Il paracetamolo inibisce l'alcol deidrogenasi e l'acetaldeide si accumula","L'alcol aumenta la glucuronazione del paracetamolo","Il paracetamolo viene trasformato in acetaldeide dal CYP2E1 indotto"],"ans":0,"why":"Il CYP2E1 trasforma più paracetamolo nel metabolita tossico NAPQI; il glutatione, già impoverito, non basta a coniugarlo. L'antidoto (N-acetilcisteina) ricostituisce il glutatione: non è nelle sbobine.","note":"Sbobina di Biochimica II, p. 168: il metabolita è chiamato «N-acetil-β-benzochinone imina»; è la N-acetil-p-benzochinone imina (NAPQI).","fixed":false},{"id":"h6n-05","topic":"m6-nadph","level":"h","page":"169","src":"Biochimica II","q":"Nei neutrofili e nei macrofagi, a che cosa serve il NADPH durante la fagocitosi?","opts":["La NADPH ossidasi produce superossido nel fagolisosoma","Serve a produrre l'ATP necessario alla fagocitosi","Serve a sintetizzare gli anticorpi nel fagolisosoma","Serve a ridurre il glutatione dei batteri fagocitati","Serve a degradare il lattato prodotto durante l'infiammazione"],"ans":0,"why":"Dal superossido derivano H₂O₂ e, tramite mieloperossidasi, acido ipocloroso, che uccidono i batteri. Un difetto della NADPH ossidasi causa la malattia granulomatosa cronica (non nelle sbobine).","note":"Sbobina di Biochimica II, p. 169: si parla di «ipoclorito di sodio». La mieloperossidasi produce acido ipocloroso (HOCl) da H₂O₂ e Cl⁻.","fixed":false},{"id":"h6n-06","topic":"m6-nadph","level":"h","page":"167","src":"Biochimica II","q":"Come può il citocromo P450 aumentare la tossicità di una sostanza?","opts":["Producendo metaboliti più reattivi, come dal benzopirene","Il P450 inattiva sempre le sostanze che idrossila","Rendendo le sostanze più idrofobiche, come il benzopirene","Consumando tutto il NADPH della cellula epatica","Il P450 non agisce sugli xenobiotici ma solo sugli steroidi"],"ans":0,"why":"Il benzopirene del fumo idrossilato diventa cancerogeno. Altre volte il P450 attiva un profarmaco (es. alcuni antistaminici) o inattiva un farmaco (ibuprofene, diazepam).","note":null,"fixed":false},{"id":"h6n-07","topic":"m6-nadph","level":"h","page":"169","src":"Biochimica II","q":"Perché due pazienti possono rispondere in modo molto diverso alla stessa dose di un chemioterapico come il 5-fluorouracile?","opts":["Per i polimorfismi degli enzimi che lo metabolizzano","Perché il farmaco viene eliminato solo dai reni","Perché la risposta dipende solo dal peso corporeo","Perché il farmaco agisce solo nelle donne","Perché il farmaco non viene metabolizzato e resta in circolo per settimane"],"ans":0,"why":"Chi inattiva il farmaco più rapidamente ha meno farmaco attivo, chi lentamente rischia più tossicità: è la base della medicina di precisione. Non è nelle sbobine che per il 5-FU l'enzima chiave è la diidropirimidina deidrogenasi (DPD), più che un P450.","note":null,"fixed":false},{"id":"h6n-08","topic":"m6-nadph","level":"h","page":"168","src":"Biochimica II","q":"Nel metabolismo del paracetamolo, perché il NADPH serve due volte?","opts":["Per il citocromo P450 e per rigenerare il glutatione","Per produrre ATP e per sintetizzare il farmaco","Per ridurre il farmaco e per ossidare il glutatione","Per attivare due volte la G6PD","Per idrolizzare il farmaco e poi coniugarlo con l'acido glucuronico"],"ans":0,"why":"Il NADPH fornisce elettroni al P450 e alla glutatione reduttasi; il glutatione ridotto coniuga il metabolita tossico (glutatione S-transferasi).","note":null,"fixed":false},{"id":"x1c-01","topic":"m1-catabolismo","level":"a","page":"6–7","src":"Biochimica II","q":"Dopo un pasto, a che cosa servono soprattutto il NADPH e l'ATP prodotti dal catabolismo?","opts":["A sostenere le biosintesi riduttive, che consumano ATP e potere riducente","A produrre altro glucosio, che il fegato esporta subito nel sangue per gli altri organi","A essere eliminati con le urine, perché sono metaboliti terminali","A ridurre l'ossigeno nel citosol per produrre calore dopo il pasto","A ossidare gli acidi grassi del tessuto adiposo, che vengono liberati"],"ans":0,"why":"Catabolismo ossidativo e anabolismo riduttivo sono accoppiati da ATP e coenzimi ridotti.","note":"Sbobina di Biochimica II, p. 6: c'è scritto che per potere riducente delle biosintesi si intende «soprattutto NADH». Il coenzima delle biosintesi riduttive è il NADPH; il NADH serve soprattutto al catabolismo (lo dice la stessa sbobina a p. 159).","fixed":false},{"id":"x1c-02","topic":"m1-catabolismo","level":"a","page":"6","src":"Biochimica II","q":"Perché vitamine e sali minerali sono indispensabili pur non fornendo energia?","opts":["Da molte vitamine derivano i coenzimi (es. NAD, FAD) delle ossidoriduzioni","Vengono ossidati nel ciclo di Krebs e forniscono elettroni alla catena respiratoria","Formano direttamente ATP legandosi all'ADP nella matrice mitocondriale","Sono metaboliti terminali che regolano l'eliminazione dell'urea nel rene","Sostituiscono il glucosio come combustibile quando la glicemia si abbassa"],"ans":0,"why":"Sono micronutrienti: servono in piccole quantità come cofattori.","note":null,"fixed":false},{"id":"x1c-03","topic":"m1-catabolismo","level":"l","page":"6","src":"Biochimica II","q":"Come viene eliminato l'azoto in eccesso degli amminoacidi, secondo lo schema del catabolismo?","opts":["L'ammoniaca diventa urea nel fegato e viene eliminata con le urine","Viene espirata come NH₃ gassosa insieme alla CO₂ prodotta dal ciclo di Krebs","Viene eliminata come acido urico, come negli uccelli","Viene immagazzinata nel muscolo come glutammina di riserva","Diventa nitrato nel fegato e viene eliminata con il sudore"],"ans":0,"why":"CO₂ con la respirazione, H₂O nel bilancio idrico, NH₃ come urea.","note":null,"fixed":false},{"id":"x1c-04","topic":"m1-catabolismo","level":"l","page":"7","src":"Biochimica II","q":"In una cellula che si prepara alla mitosi, quali precursori servono per le nuove membrane?","opts":["Acidi grassi, glicerolo e i composti delle teste polari dei fosfolipidi","Solo colesterolo, che da solo forma il doppio strato fosfolipidico delle membrane","Amminoacidi e basi azotate, che formano le membrane nuove","Glicogeno e glucosio, che vengono trasformati in fosfolipidi","Corpi chetonici e acetone, precursori diretti dei fosfolipidi"],"ans":0,"why":"È l'esempio della sbobina: per duplicare la cellula servono DNA nuovo e fosfolipidi nuovi.","note":null,"fixed":false},{"id":"x1t-01","topic":"m1-termodinamica","level":"a","page":"11–12","src":"Biochimica II","q":"Una reazione ha ΔG°' = −20 kJ/mol ma nella cellula ha ΔG ≈ 0. Che cosa significa?","opts":["Le concentrazioni reali sono vicine all'equilibrio: la reazione è reversibile e poco regolabile","La reazione è irreversibile e rappresenta il punto di regolazione principale di tutta la via","L'enzima che la catalizza manca nella cellula, quindi la reazione non procede in nessun verso","Il ΔG°' tabulato è sbagliato, perché misurato in condizioni lontane da quelle biologiche","La reazione procede solo se accoppiata all'idrolisi di ATP, che sposta il ΔG verso lo zero"],"ans":0,"why":"Conta il ΔG reale, che dipende dal rapporto [prodotti]/[reagenti].","note":null,"fixed":false},{"id":"x1t-02","topic":"m1-termodinamica","level":"a","page":"11","src":"Biochimica II","q":"Se il ΔG°' di una reazione è 0, quanto vale la Keq?","opts":["1","0","10","Infinito","−1"],"ans":0,"why":"ΔG°' = −RT ln Keq: ln 1 = 0.","note":null,"fixed":false},{"id":"x1t-03","topic":"m1-termodinamica","level":"a","page":"12","src":"Biochimica II","q":"Perché due reazioni consecutive possono procedere anche se la prima ha ΔG°' positivo?","opts":["I ΔG°' di reazioni accoppiate si sommano: conta il ΔG complessivo","L'enzima cambia il ΔG°' della prima reazione e la rende spontanea","La temperatura corporea rende negativo il ΔG°' della prima reazione","Non possono: una reazione con ΔG°' positivo blocca tutta la sequenza","La seconda reazione cede ATP alla prima"],"ans":0,"why":"È il principio dell'accoppiamento energetico (es. aldolasi seguita dalle reazioni a valle).","note":null,"fixed":false},{"id":"x1t-04","topic":"m1-termodinamica","level":"l","page":"11","src":"Biochimica II","q":"Qual è la relazione tra ΔG e la concentrazione dei reagenti e dei prodotti?","opts":["ΔG = ΔG°' + RT ln([prodotti]/[reagenti])","ΔG = ΔG°' − RT ln([prodotti]/[reagenti])","ΔG = ΔG°' + RT ln([reagenti]/[prodotti])","ΔG = ΔG°' × RT ln([prodotti]/[reagenti])","ΔG = −RT ln([prodotti]/[reagenti])"],"ans":0,"why":"Con il rapporto pari a Keq, ΔG = 0 (equilibrio).","note":null,"fixed":false},{"id":"x1e-01","topic":"m1-enzimologia","level":"a","page":"27","src":"Biochimica II","q":"Un inibitore competitivo come modifica KM e Vmax?","opts":["Aumenta la KM apparente, Vmax invariata","Diminuisce la Vmax apparente, KM invariata","Diminuisce sia la KM sia la Vmax apparenti","Aumenta sia la KM sia la Vmax apparenti","Diminuisce la KM, Vmax invariata"],"ans":0,"why":"Aumentando il substrato si supera l'inibizione.","note":null,"fixed":false},{"id":"x1e-02","topic":"m1-enzimologia","level":"a","page":"29–30","src":"Biochimica II","q":"Qual è la differenza tra regolazione allosterica e controllo della quantità di enzima?","opts":["L'allosterica agisce in secondi; sintesi o degradazione dell'enzima in ore","Sono ugualmente rapide, perché entrambe agiscono direttamente sul sito attivo","L'allosterica è lenta, perché richiede la trascrizione di nuovi geni nel nucleo","La quantità di enzima non è regolabile: dipende solo dal genoma della cellula","Il controllo della quantità agisce in secondi; l'allosterica in giorni"],"ans":0,"why":"La modificazione covalente (fosforilazione) sta in mezzo: minuti.","note":null,"fixed":false},{"id":"x2f-01","topic":"m2-fosforilazione","level":"a","page":"37–38","src":"Biochimica II","q":"Perché il glucosio 6-fosfato inibisce l'esochinasi ma non la glucochinasi?","opts":["Il fegato deve fosforilare il glucosio dopo il pasto per immagazzinarlo, anche con G6P alto","La glucochinasi non lega il glucosio 6-fosfato perché ha un sito attivo troppo piccolo","Il glucosio 6-fosfato non si forma nel fegato, perché viene subito defosforilato nel RE","La glucochinasi è mitocondriale e il glucosio 6-fosfato resta confinato nel citosol","Il glucosio 6-fosfato attiva la glucochinasi invece di inibirla, per accumulare glicogeno"],"ans":0,"why":"La glucochinasi è invece regolata dalla proteina regolatrice, che la sequestra nel nucleo.","note":null,"fixed":false},{"id":"x2f-02","topic":"m2-fosforilazione","level":"l","page":"55–56","src":"Biochimica II","q":"Dove porta la glucochinasi la sua proteina regolatrice (GKRP) in presenza di fruttosio 6-fosfato?","opts":["Nel nucleo, dove resta inattiva","Nel mitocondrio, dove fosforila il glucosio","Sulla membrana plasmatica, accanto al GLUT2","Nel reticolo endoplasmatico, accanto alla glucosio 6-fosfatasi","Nel lisosoma, dove viene degradata"],"ans":0,"why":"Il glucosio alto la libera e la fa tornare nel citosol.","note":null,"fixed":false},{"id":"x2n-01","topic":"m2-navette","level":"a","page":"53–54","src":"Biochimica II","q":"Perché il NADH prodotto nel citosol dalla glicolisi non entra direttamente nel mitocondrio?","opts":["La membrana mitocondriale interna è impermeabile al NADH: entrano solo i suoi elettroni","Il NADH citosolico viene distrutto dalle deidrogenasi prima di arrivare al mitocondrio","Il NADH citosolico si ossida da solo a NAD⁺ a contatto con l'ossigeno","Entra liberamente, ma la sbobina usa le navette per semplificare lo schema","La membrana mitocondriale esterna è impermeabile al NADH, quella interna no"],"ans":0,"why":"Gli elettroni passano tramite molecole trasportatrici (glicerolo 3-P, malato).","note":null,"fixed":false},{"id":"x2n-02","topic":"m2-navette","level":"a","page":"54","src":"Biochimica II","q":"Nella navetta malato-aspartato, quale molecola attraversa la membrana interna portando gli elettroni?","opts":["Il malato","L'ossalacetato","Il NADH","Il glicerolo 3-fosfato","L'aspartato"],"ans":0,"why":"L'ossalacetato non attraversa la membrana: torna fuori come aspartato dopo una transaminazione. Il dettaglio della navetta malato-aspartato non è nelle sbobine.","note":null,"fixed":false},{"id":"x2n-03","topic":"m2-navette","level":"l","page":"54","src":"Biochimica II","q":"Quale abbreviazione è corretta per il glicerolo 3-fosfato della navetta?","opts":["Gro3P (o G3P)","3-PG (o 3PG)","DHAP (o DAP)","Glc3P (glucosio 3-P)","GAP (o GA3P)"],"ans":0,"why":"3-PG è la sigla del 3-fosfoglicerato, un intermedio diverso della glicolisi.","note":"Sbobina di Biochimica II, p. 54: il glicerolo 3-fosfato è abbreviato «3-PG», che è la sigla del 3-fosfoglicerato. Attenzione a non confonderli.","fixed":false},{"id":"x2n-04","topic":"m2-navette","level":"l","page":"54","src":"Biochimica II","q":"Dove si trova la glicerolo 3-fosfato deidrogenasi mitocondriale?","opts":["Sulla faccia esterna della membrana interna, e cede elettroni al Q tramite FAD","Nella matrice mitocondriale, dove riduce il NAD⁺ e cede gli elettroni al complesso I","Nel citosol, legata alla membrana mitocondriale esterna, e riduce il NAD⁺","Nella membrana esterna, dove cede elettroni al citocromo c tramite FMN","Sulla faccia interna della membrana interna, dentro il complesso I"],"ans":0,"why":"Per questo il glicerolo 3-P non deve entrare nella matrice.","note":null,"fixed":false},{"id":"x3r-01","topic":"m3-radicali","level":"a","page":"109","src":"Biochimica II","q":"Come viene rigenerato il glutatione ridotto dopo l'azione della glutatione perossidasi?","opts":["Dalla glutatione reduttasi, che usa NADPH","Dalla catalasi, che usa H₂O₂","Dalla superossido dismutasi, che usa il superossido","Dal NADH della catena respiratoria, direttamente","Dalla glutatione perossidasi stessa, che usa il selenio"],"ans":0,"why":"Per questo la via dei pentoso fosfati è fondamentale contro lo stress ossidativo.","note":null,"fixed":false},{"id":"x3r-02","topic":"m3-radicali","level":"a","page":"110","src":"Biochimica II","q":"Che cosa fa il fattore HIF nelle cellule tumorali ipossiche?","opts":["Aumenta enzimi glicolitici, LDH e PDH chinasi, e sostituisce COX4-1 con COX4-2","Aumenta la β-ossidazione, la sintesi di nuovi mitocondri e la PDH fosfatasi","Inibisce la glicolisi e spinge la cellula verso la respirazione","Attiva la piruvato deidrogenasi, il ciclo di Krebs e la catena respiratoria","Aumenta la PDH fosfatasi e la sintesi di ATP mitocondriale con COX4-1"],"ans":0,"why":"Spinge la cellula verso la glicolisi e riduce la produzione di radicali.","note":null,"fixed":false},{"id":"x3r-03","topic":"m3-radicali","level":"l","page":"109","src":"Biochimica II","q":"Perché la glutatione perossidasi ha la selenocisteina invece della cisteina?","opts":["Il selenolato (Se⁻) è più ionizzato e più reattivo verso i perossidi del tiolato","Il selenio lega l'ossigeno molecolare e lo trasforma direttamente in acqua nel citosol","La selenocisteina è più stabile della cisteina e non si ossida mai, neanche con i perossidi","Il selenio trasporta elettroni dalla catena respiratoria al glutatione ossidato","La selenocisteina lega il NADPH e lo trasferisce direttamente al perossido da ridurre"],"ans":0,"why":"Il selenio sta nello stesso gruppo di O e S e cede più facilmente l'H⁺.","note":null,"fixed":false},{"id":"x3r-04","topic":"m3-radicali","level":"l","page":"108","src":"Biochimica II","q":"Quali vitamine sono classicamente considerate antiossidanti?","opts":["C, E e il β-carotene (provitamina A)","K e B12 (cobalamina)","B1, B2 e la niacina (provitamina B3)","D, K e il colecalciferolo (provitamina D)","K, B12 e acido folico (provitamine)"],"ans":0,"why":"La vitamina E protegge le membrane, la C agisce in ambiente acquoso.","note":"Sbobina di Biochimica II, p. 108: tra le vitamine antiossidanti è inclusa anche la K. Le antiossidanti classiche sono C, E e A/β-carotene; la K serve alla coagulazione.","fixed":false},{"id":"x3m-01","topic":"m3-malattie","level":"a","page":"112","src":"Biochimica II","q":"Nella cellula β, qual è la sequenza che porta alla secrezione di insulina?","opts":["Glucosio (GLUT2) → glicolisi e Krebs → ATP ↑ → chiusura canali K⁺ → depolarizzazione → Ca²⁺ → esocitosi","Glucosio → recettore di membrana accoppiato a Gs → cAMP ↑ → PKA → apertura dei canali Ca²⁺ → esocitosi","Glucosio (GLUT4) → glicolisi → ATP ↓ → apertura canali K⁺ → iperpolarizzazione → esocitosi","Glucosio (GLUT2) → glicolisi e Krebs → ATP ↑ → apertura canali K⁺ → ingresso di Na⁺ → esocitosi","Insulina → GLUT4 → glucosio → glicolisi → ATP ↑ → chiusura canali Ca²⁺ → iperpolarizzazione → esocitosi"],"ans":0,"why":"Se l'ATP cala (es. per UCP2), la secrezione si riduce.","note":null,"fixed":false},{"id":"x3m-02","topic":"m3-malattie","level":"a","page":"112","src":"Biochimica II","q":"Perché la gravità delle malattie mitocondriali varia tra i figli della stessa madre?","opts":["Per l'eteroplasmia: ogni figlio riceve una quota diversa di mitocondri mutati","Il padre trasmette mitocondri sani ad alcuni figli e non ad altri, compensando il difetto","Ogni figlio ha mutazioni nucleari diverse che modificano il fenotipo mitocondriale","Il mtDNA si ricombina con quello paterno in modo diverso in ogni figlio","La madre trasmette il mtDNA mutato solo ai figli maschi, mentre le femmine sono portatrici"],"ans":0,"why":"Sotto una soglia di mitocondri mutati i sintomi possono mancare.","note":null,"fixed":false},{"id":"x3m-03","topic":"m3-malattie","level":"l","page":"113","src":"Biochimica II","q":"Il DNA mitocondriale è più esposto al danno ossidativo del DNA nucleare. Perché?","opts":["È vicino alla catena respiratoria, non ha istoni e si ripara poco","È lineare, molto lungo, e le sue estremità sono esposte agli ossidanti del citosol","È molto più lungo del DNA nucleare e offre più bersagli","È avvolto negli istoni, che producono radicali durante la replicazione","Si replica solo una volta nella vita della cellula e non si ripara"],"ans":0,"why":"Questa è la base dell'ipotesi mitocondriale dell'invecchiamento.","note":"Sbobina di Biochimica II, p. 113: c'è scritto che il DNA mitocondriale «non può ripararsi». È una semplificazione: ha meccanismi di riparazione, ma più limitati di quelli nucleari.","fixed":false},{"id":"x4d-01","topic":"m4-degradazione","level":"a","page":"116–117","src":"Biochimica II","q":"La glicogeno fosforilasi lavora finché trova un punto di ramificazione. A quanti residui si ferma?","opts":["A 4 residui dal punto di ramificazione","A 1 residuo dal punto di ramificazione","A 10 residui dal punto di ramificazione","Non si ferma: stacca anche il residuo α-1,6","A 7 residui, la lunghezza di un ramo"],"ans":0,"why":"Resta una «destrina limite» che va sistemata dall'enzima deramificante.","note":null,"fixed":false},{"id":"x4d-02","topic":"m4-degradazione","level":"l","page":"116","src":"Biochimica II","q":"Perché la fosforolisi del glicogeno nel muscolo rende più ATP per glucosio rispetto al glucosio del sangue?","opts":["Il glucosio 1-P diventa G6P senza l'ATP dell'esochinasi: 3 ATP netti invece di 2","La fosforolisi produce più NADH, che il muscolo usa nella catena respiratoria","Il glucosio del glicogeno salta la fosfofruttochinasi e quindi un ATP: 3 netti","Non è vero: la resa è identica, 2 ATP per glucosio in entrambi i casi","Il glucosio 1-P produce due molecole di 1,3-BPG in più: 4 ATP netti invece di 2"],"ans":0,"why":"È un vantaggio della fosforolisi rispetto all'idrolisi.","note":null,"fixed":false},{"id":"x4d-03","topic":"m4-degradazione","level":"l","page":"115","src":"Biochimica II","q":"Che tipo di legami ha il glicogeno nelle catene e nelle ramificazioni?","opts":["α-1,4 nelle catene e α-1,6 nelle ramificazioni","β-1,4 nelle catene e α-1,6 nelle ramificazioni","α-1,4 nelle catene e β-1,6 nelle ramificazioni","Solo α-1,4, senza ramificazioni","α-1,6 nelle catene e α-1,4 nelle ramificazioni"],"ans":0,"why":"Un'unica estremità riducente (legata alla glicogenina) e tante estremità non riducenti.","note":null,"fixed":false},{"id":"x4s-01","topic":"m4-sintesi","level":"a","page":"122–123","src":"Biochimica II","q":"Perché la sintesi e la degradazione del glicogeno usano enzimi diversi?","opts":["Così le due vie sono regolate separatamente e in modo reciproco, senza ciclo futile","La fosforilasi non può funzionare al contrario, nemmeno in vitro con alte concentrazioni di glucosio 1-P","Sintesi e degradazione avvengono in organelli diversi della cellula (RE e lisosomi)","È un caso dell'evoluzione, senza vantaggi per la cellula: una sola via basterebbe","La sintasi lavora solo nel fegato e la fosforilasi solo nel muscolo"],"ans":0,"why":"Lo stesso principio vale per glicolisi e gluconeogenesi.","note":null,"fixed":false},{"id":"x4s-02","topic":"m4-sintesi","level":"l","page":"122","src":"Biochimica II","q":"Su quale estremità del glicogeno lavora la glicogeno sintasi?","opts":["Sulle estremità non riducenti","Sulle estremità riducenti libere","Sui punti di ramificazione","Sulla glicogenina centrale","Su entrambe le estremità di ogni catena"],"ans":0,"why":"Anche la fosforilasi lavora sulle estremità non riducenti: più rami = più velocità.","note":null,"fixed":false},{"id":"x4s-03","topic":"m4-sintesi","level":"l","page":"122","src":"Biochimica II","q":"Quale nucleotide viene rigenerato dall'UDP con un ATP dopo la sintesi del glicogeno?","opts":["UTP, dalla nucleoside difosfato chinasi","GTP, dalla succinil-CoA sintetasi","CTP, dalla CTP sintetasi citosolica","ATP, dall'adenilato chinasi (miochinasi)","UTP, dalla UDP-glucosio pirofosforilasi"],"ans":0,"why":"UDP + ATP → UTP + ADP. Il nome dell'enzima non è nelle sbobine.","note":null,"fixed":false},{"id":"x4o-01","topic":"m4-ormoni","level":"a","page":"129–131","src":"Biochimica II","q":"Perché la cascata del glucagone amplifica il segnale?","opts":["Ogni enzima attivato (adenilato ciclasi, PKA, fosforilasi chinasi) attiva molte molecole a valle","Il glucagone circola a concentrazioni molto alte e satura tutti i recettori epatici disponibili","Il glucagone entra nella cellula e attiva direttamente tutte le fosforilasi del glicogeno","Il glucagone agisce sul DNA e aumenta rapidamente la sintesi della glicogeno fosforilasi","Ogni recettore attivato produce una sola molecola di cAMP, che basta per tutta la cellula"],"ans":0,"why":"Poche molecole di ormone liberano moltissimo glucosio.","note":null,"fixed":false},{"id":"x4o-02","topic":"m4-ormoni","level":"a","page":"132","src":"Biochimica II","q":"Come porta l'insulina allo stoccaggio di glicogeno nel muscolo?","opts":["Aumenta GLUT4 in membrana e, tramite PKB, inattiva GSK3: la sintasi resta attiva","Attiva la glicogeno fosforilasi tramite la fosforilasi chinasi e aumenta il glucosio 6-P disponibile","Aumenta il cAMP, che attiva la sintasi tramite la PKA e la PP1","Inibisce l'esochinasi, così il glucosio resta libero per la sintasi","Aumenta GLUT2 in membrana e, tramite PKB, attiva GSK3: la sintasi è fosforilata"],"ans":0,"why":"Attiva anche la PP1.","note":null,"fixed":false},{"id":"x4o-03","topic":"m4-ormoni","level":"l","page":"129–130","src":"Biochimica II","q":"Quale proteina G accoppia il recettore del glucagone all'adenilato ciclasi?","opts":["Gs","Gi","Gq","Gt (transducina)","G12"],"ans":0,"why":"I recettori α1 dell'adrenalina usano Gq (fosfolipasi C, IP₃, Ca²⁺).","note":null,"fixed":false},{"id":"x4e-01","topic":"m4-attivita","level":"a","page":"135","src":"Biochimica II","q":"Che cos'è la supercompensazione del glicogeno?","opts":["Dopo averlo esaurito con lo sforzo, una dieta ricca di carboidrati lo porta sopra i livelli iniziali","Il fegato produce glicogeno dai grassi quando il muscolo lo ha esaurito, e lo cede al muscolo stesso","Il glicogeno resta sempre alto, qualunque sia la dieta o lo sforzo, per adattamento genetico","È una malattia da accumulo di glicogeno nel muscolo degli atleti, dovuta a un deficit enzimatico","Dopo lo sforzo, a digiuno, il glicogeno torna da solo sopra i livelli iniziali"],"ans":0,"why":"A digiuno o con una dieta povera di carboidrati il glicogeno non si ricostituisce.","note":null,"fixed":false},{"id":"x4e-02","topic":"m4-attivita","level":"a","page":"134","src":"Biochimica II","q":"In uno sforzo leggero e prolungato, quanto glicogeno muscolare si consuma?","opts":["Poco: il muscolo usa soprattutto acidi grassi e glucosio del sangue","Tutto in pochi minuti, come nello sprint, perché il muscolo lavora sempre in anaerobiosi","Solo quello epatico, mentre quello muscolare resta del tutto intatto","Nessuno, perché lo sforzo leggero usa solo fosfocreatina e ATP","Molto: è la fonte principale di qualsiasi sforzo prolungato"],"ans":0,"why":"Sforzo moderato e soprattutto intenso consumano invece molto glicogeno.","note":null,"fixed":false},{"id":"x4e-03","topic":"m4-attivita","level":"l","page":"135","src":"Biochimica II","q":"Quando conviene assumere carboidrati per recuperare dopo lo sforzo?","opts":["Subito dopo lo sforzo e poi a intervalli regolari nelle 24 ore successive","Solo il giorno dopo, quando la glicogeno sintasi torna attiva e l'insulina risale","Solo prima dello sforzo, perché dopo non vengono più assorbiti","Mai, perché bastano le proteine a ricostituire il glicogeno muscolare","Solo la sera, perché di notte la sintesi di glicogeno è più rapida"],"ans":0,"why":"Subito dopo l'esercizio la sintesi del glicogeno muscolare è più rapida.","note":null,"fixed":false},{"id":"x4e-04","topic":"m4-attivita","level":"l","page":"133","src":"Biochimica II","q":"Il grafico delle fonti di energia nello sforzo mostra la quota di metabolismo aerobio e anaerobio. Come si chiamano correttamente?","opts":["Metabolismo aerobio e anaerobio (catabolismo)","Anabolismo aerobio e anaerobio (sintesi)","Gluconeogenesi aerobia e anaerobia (muscolare)","Glicogenosintesi aerobia e anaerobia (muscolo)","Lipogenesi aerobia e anaerobia (sintesi)"],"ans":0,"why":"Sono vie che producono energia: catabolismo.","note":"Sbobina di Biochimica II, p. 133: le curve sono chiamate «anabolismo aerobio» e «anabolismo anaerobio». Sono vie cataboliche: metabolismo (o catabolismo) aerobio e anaerobio.","fixed":false},{"id":"x4g-01","topic":"m4-glicogenosi","level":"a","page":"137","src":"Biochimica II","q":"Nella von Gierke, perché il glucagone non alza la glicemia?","opts":["La glicogenolisi epatica dà glucosio 6-P, che senza glucosio 6-fosfatasi non diventa glucosio","Il fegato non ha recettori per il glucagone in questa malattia, e il cAMP non sale","Il fegato non contiene glicogeno, perché manca anche la glicogeno sintasi, e il glucagone non ha substrato","Il glucagone non viene prodotto, perché le cellule α del pancreas sono distrutte dal glicogeno","Il glucagone attiva la glicolisi epatica invece della glicogenolisi, e il G6P viene consumato"],"ans":0,"why":"Anzi: il G6P accumulato alimenta lattato, lipidi e acido urico.","note":null,"fixed":false},{"id":"x5f-01","topic":"m5-fonti","level":"a","page":"140","src":"Biochimica II","q":"Circa quanto glucosio consuma l'organismo al giorno e quanto ne usa il cervello?","opts":["Circa 160 g, di cui circa il 70% dal cervello","Circa 50 g, quasi tutto dal muscolo","Circa 500 g, di cui metà dal fegato","Circa 20 g, quasi tutto dagli eritrociti","Circa 160 g, di cui circa il 70% dal muscolo"],"ans":0,"why":"Il glicogeno epatico non basta per più di circa un giorno: serve la gluconeogenesi.","note":null,"fixed":false},{"id":"x5f-02","topic":"m5-fonti","level":"a","page":"141","src":"Biochimica II","q":"Tra mezzanotte e colazione, come cambiano glicogenolisi e gluconeogenesi?","opts":["La gluconeogenesi aumenta, la glicogenolisi cala man mano che il glicogeno finisce","Entrambe si azzerano, perché di notte il consumo di glucosio è praticamente nullo","Aumenta solo la glicogenolisi, mentre la gluconeogenesi resta spenta","Si attiva la sintesi di glicogeno, che continua fino alla colazione del mattino","La glicogenolisi aumenta, la gluconeogenesi cala man mano che il glicogeno finisce"],"ans":0,"why":"Dopo i pasti la gluconeogenesi si azzera e riparte la glicogeno sintesi.","note":null,"fixed":false},{"id":"x5f-03","topic":"m5-fonti","level":"l","page":"142","src":"Biochimica II","q":"Come agisce il cortisolo sulla gluconeogenesi?","opts":["È uno steroide: lega un recettore intracellulare che va nel nucleo e aumenta la trascrizione degli enzimi","Lega un recettore di membrana accoppiato a Gs, attiva l'adenilato ciclasi e la PKA fosforila gli enzimi","È un peptide: fosforila direttamente la PFK2 nel citosol e abbassa il fruttosio 2,6-bisfosfato","Inibisce l'insulina nel sangue legandola e impedendole di raggiungere il recettore epatico","Lega un recettore tirosin-chinasico, attiva la PKB e aumenta la trascrizione degli enzimi"],"ans":0,"why":"Sul muscolo ha effetto catabolico: libera amminoacidi come substrati.","note":"Sbobina di Biochimica II, p. 142: il cortisolo è definito «ormone anabolizzante». Stimola la sintesi di enzimi epatici, ma a livello dell'organismo è catabolico (degrada le proteine muscolari, come dice la sbobina a p. 157).","fixed":false},{"id":"x5f-04","topic":"m5-fonti","level":"l","page":"140","src":"Biochimica II","q":"Quale percentuale della gluconeogenesi avviene nel rene secondo la sbobina?","opts":["Circa il 10%","Circa il 50%","Circa il 90%","Nessuna","Circa il 30%"],"ans":0,"why":"Il resto (circa 90%) avviene nel fegato. Nel digiuno prolungato la quota renale aumenta (questo non è nelle sbobine).","note":null,"fixed":false},{"id":"x5g-01","topic":"m5-glicerolo","level":"a","page":"141, 147","src":"Biochimica II","q":"Quali due enzimi portano il glicerolo a diidrossiacetone fosfato?","opts":["Glicerolo chinasi e glicerolo 3-fosfato deidrogenasi","Esochinasi e aldolasi, come per gli altri zuccheri","Trioso fosfato isomerasi e PEPCK citosolica del fegato","Glicerolo fosfatasi e aldolasi B epatica (citosolica)","Glicerolo chinasi e trioso fosfato isomerasi"],"ans":0,"why":"Il DHAP entra poi nella gluconeogenesi a livello dei triosi.","note":null,"fixed":false},{"id":"x5g-02","topic":"m5-glicerolo","level":"a","page":"147","src":"Biochimica II","q":"Da quale tappa della gluconeogenesi entra il glicerolo?","opts":["Dai triosi fosfati (DHAP), saltando le reazioni del piruvato e del PEP","Dal piruvato, come il lattato e l'alanina, passando per la piruvato carbossilasi","Dall'ossalacetato, tramite la PEPCK, saltando la piruvato carbossilasi","Dal glucosio 6-P, saltando la fruttosio 1,6-bisfosfatasi e l'aldolasi","Dal fosfoenolpiruvato, saltando la piruvato carbossilasi"],"ans":0,"why":"Non servono piruvato carbossilasi e PEPCK.","note":null,"fixed":false},{"id":"x5g-03","topic":"m5-glicerolo","level":"l","page":"147","src":"Biochimica II","q":"Il propionil-CoA (dagli acidi grassi a numero dispari di carboni) è glucogenico perché:","opts":["Diventa succinil-CoA e quindi ossalacetato","Diventa acetil-CoA e poi citrato nel ciclo di Krebs","Diventa glicerolo e poi diidrossiacetone fosfato","Diventa piruvato tramite la lattato deidrogenasi","Diventa malonil-CoA e poi ossalacetato"],"ans":0,"why":"Gli acidi grassi a numero pari invece non danno glucosio. Il passaggio per il succinil-CoA non è nella sbobina in questo punto.","note":null,"fixed":false},{"id":"x5g-04","topic":"m5-glicerolo","level":"l","page":"148","src":"Biochimica II","q":"Perché il lattato si forma nel muscolo e diventa glucosio nel fegato?","opts":["Nel muscolo sotto sforzo NAD⁺/NADH è basso (lattato); nel fegato è alto e la LDH lo riossida","Il fegato non ha LDH, quindi il lattato non può tornare a piruvato e va riossidato dal muscolo stesso","Il muscolo ha la glucosio 6-fosfatasi, quindi rilascia glucosio e non lattato","Il lattato non può entrare nel muscolo, quindi va per forza al fegato per essere ossidato","Nel fegato NAD⁺/NADH è basso, e la LDH riduce il piruvato a lattato prima della gluconeogenesi"],"ans":0,"why":"È il ciclo di Cori. Il cuore usa invece il lattato come combustibile (LDH1).","note":null,"fixed":false},{"id":"x5a-01","topic":"m5-approfondimenti","level":"a","page":"157","src":"Biochimica II","q":"Perché nel digiuno prolungato i corpi chetonici «salvano» le proteine muscolari?","opts":["Il cervello li usa come combustibile, quindi serve meno glucosio da amminoacidi muscolari","I corpi chetonici si trasformano in glucosio nel fegato e nel rene tramite la PEPCK citosolica","Inibiscono direttamente la proteolisi muscolare legando il proteasoma","Attivano la sintesi proteica nel muscolo durante il digiuno prolungato","Il muscolo li usa al posto delle proteine come fonte di azoto per sintetizzare l'urea"],"ans":0,"why":"Per questo dopo alcuni giorni la gluconeogenesi si dimezza.","note":null,"fixed":false},{"id":"x5a-02","topic":"m5-approfondimenti","level":"a","page":"158","src":"Biochimica II","q":"L'alcol inibisce la gluconeogenesi. Quali due reazioni vengono bloccate dall'aumento di NADH?","opts":["Lattato → piruvato (LDH) e malato → ossalacetato (malato DH citosolica)","PEP → piruvato (piruvato chinasi) e G6P → glucosio (glucosio 6-fosfatasi)","Piruvato → acetil-CoA (PDH) e citrato → isocitrato (aconitasi)","Glicerolo → DHAP (glicerolo chinasi) e F6P → F1,6BP (PFK1)","Piruvato → ossalacetato (piruvato carbossilasi) e OAA → PEP (PEPCK)"],"ans":0,"why":"Entrambe richiedono NAD⁺.","note":null,"fixed":false},{"id":"x5a-03","topic":"m5-approfondimenti","level":"l","page":"153","src":"Biochimica II","q":"I topi con PEPCK sovraespressa nel muscolo, oltre a correre di più, avevano:","opts":["Più mitocondri, più uso di acidi grassi, meno lattato e più sensibilità all'insulina","Più lattato, più tessuto adiposo, meno mitocondri e un'insulino-resistenza marcata","Meno mitocondri, ma muscoli più grandi, più glicogeno e più forza massima","Diabete di tipo 2 con iperglicemia a digiuno e ridotta sensibilità periferica all'insulina","Meno acidi grassi usati e accumulo di trigliceridi nelle fibre muscolari"],"ans":0,"why":"La sbobina la cita per mostrare che un solo enzima può cambiare tutto il metabolismo.","note":null,"fixed":false},{"id":"x5a-04","topic":"m5-approfondimenti","level":"l","page":"159","src":"Biochimica II","q":"Che cosa succede alla zonazione del lobulo epatico in caso di danno?","opts":["È un gradiente plastico: gli epatociti di una zona possono assumere le funzioni di un'altra","È fissa e non cambia: ogni epatocita ha un ruolo definito alla nascita e non può riconvertirsi","Il lobulo smette di fare gluconeogenesi e urea finché il danno non si è riparato","Gli epatociti perivenosi muoiono e vengono sostituiti da tessuto fibroso","Le cellule di Kupffer prendono il posto degli epatociti periportali e ne assumono le funzioni"],"ans":0,"why":"Non è una divisione netta ma un gradiente tra vena porta e vena centrale.","note":null,"fixed":false},{"id":"x6g-01","topic":"m6-regolazione","level":"a","page":"165","src":"Biochimica II","q":"Se la cellula sintetizza acidi grassi, che cosa succede alla via dei pentoso fosfati?","opts":["Accelera: la sintesi consuma NADPH, sale il NADP⁺ e la G6PD si attiva","Si blocca, perché gli acidi grassi e il malonil-CoA inibiscono allostericamente la G6PD","Non cambia, perché la via dipende solo dal glucosio e non dal NADPH","Diventa gluconeogenesi, per fornire glicerolo ai trigliceridi","Accelera solo la fase non ossidativa, per produrre ribosio e non NADPH"],"ans":0,"why":"Se il NADPH non viene consumato si accumula e blocca la G6PD.","note":null,"fixed":false},{"id":"x6g-02","topic":"m6-regolazione","level":"a","page":"165","src":"Biochimica II","q":"In una cellula in divisione che ha bisogno sia di ribosio sia di NADPH, quale modalità prevale?","opts":["Fase ossidativa completa: il ribulosio 5-P diventa ribosio 5-P, con 2 NADPH per G6P","Solo la fase non ossidativa, partendo dai triosi della glicolisi e senza produrre NADPH","Solo la glicolisi, che fornisce ribosio dall'aldolasi e NADPH dalla GAP deidrogenasi","Il riciclo completo del glucosio 6-P a CO₂, con 12 NADPH e nessun ribosio residuo","Solo la G6PD, che produce ribosio senza la 6-fosfogluconato deidrogenasi"],"ans":0,"why":"Le altre modalità servono quando prevale il bisogno di uno solo dei due prodotti.","note":null,"fixed":false},{"id":"x6g-03","topic":"m6-regolazione","level":"l","page":"165","src":"Biochimica II","q":"Quale enzima, oltre alla G6PD, produce NADPH nel citosol per la sintesi degli acidi grassi?","opts":["L'enzima malico","La lattato deidrogenasi","La GAP deidrogenasi","La piruvato chinasi","La malato deidrogenasi"],"ans":0,"why":"Malato + NADP⁺ → piruvato + CO₂ + NADPH. Anche l'isocitrato deidrogenasi citosolica usa NADP⁺. L'enzima malico non è in questa parte della sbobina.","note":null,"fixed":false},{"id":"x6g-04","topic":"m6-regolazione","level":"l","page":"159","src":"Biochimica II","q":"Che cosa distingue strutturalmente il NADPH dal NADH?","opts":["Un fosfato sul 2' del ribosio dell'adenosina","Un fosfato sul 5' della nicotinammide","Un anello aromatico in più nella nicotinammide","Un atomo di zolfo al posto dell'ossigeno","Un fosfato sul 3' del ribosio della nicotinammide"],"ans":0,"why":"Il fosfato fa sì che gli enzimi distinguano nettamente i due coenzimi.","note":null,"fixed":false}]}};</script>

  // codice casuale del telefono: raggruppa le segnalazioni della stessa persona senza sapere chi è
  if (!S.device) S.device = "T-" + Math.random().toString(36).slice(2, 6).toUpperCase() + Math.random().toString(36).slice(2, 4).toUpperCase();
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } };

  /* ---------------- Argomenti ---------------- */
  const TOPICS = {};

  /* ---------------- Mazzo di card ---------------- */
  const CARDS = [];
  const MOL_PATHS_IDS = "glc g6p f6p fbp dhap ga3p bpg13 pg3 pg2 pep pyr oaa mal lac ala gly gro3p cit icit akg suc fum g1p fru gal man r5p ru5p xu5p pg6 e4p s7p acal etoh asp glu".split(" ");

  D.molecules.forEach(m => { if ((C.moleculeTopics[m.id] || []).length && MOL_PATHS_IDS.includes(m.id)) CARDS.push({ id: "mv:" + m.id, kind: "mv", mol: m.id, topics: C.moleculeTopics[m.id], level: "m" }); });
  C.reactions.forEach(r => CARDS.push({ id: "rx:" + r.id, kind: "rx", rx: r, topics: [r.topic], level: "m" }));

  C.pathways.forEach(p => p.steps.forEach((st, i) => CARDS.push({ id: `nx:${p.id}:${i}`, kind: "nx", path: p, step: st, idx: i, topics: [st.topic || p.topic], level: "m" })));
  const CARD = Object.fromEntries(CARDS.map(c => [c.id, c]));

  const activeTopics = () => {
    if (S.onlyLast && S.lastChecked && S.selected.includes(S.lastChecked)) return [S.lastChecked];

  /* ---------------- Livelli ----------------
     Facile → Medio → Alta → 30 e lode. In modalità progressiva, per ogni argomento il livello successivo si sblocca
     quando almeno il 70% delle card del livello precedente è stato imparato (passato in ripasso). */
  const LEVELS = ["f", "m", "a", "l", "h"];

  const UNLOCK = 0.7;
  const learned = c => { const x = S.cards[c.id]; return !!x && (x.type === "review" || (x.type === "relearn")); };
  function topicLevelState(tid) {
    const cs = CARDS.filter(c => c.topics.includes(tid));
    const by = {}; LEVELS.forEach(l => { const a = cs.filter(c => c.level === l); by[l] = { n: a.length, ok: a.filter(learned).length }; });
    let open = 0; // indice del livello più alto sbloccato

  };

  const cardsInTopic = id => CARDS.filter(c => c.topics.includes(id)).length;
  const topicMeta = id => {
    if (isHard()) { const n = CARDS.filter(c => c.topics.includes(id) && inHard(c)).length; return `${n} card in hard mode`; }
    if (S.study !== "grad") return `${cardsInTopic(id)} card`;
    const st = topicLevelState(id);
    return `${cardsInTopic(id)} card · ${LEVEL_NAME[LEVELS[st.open]]}`;

  /* ---------------- Ripetizione spaziata: algoritmo SM-2 ----------------

  const MIN = 60e3, HOUR = 36e5, DAY = 864e5;

  function schedule(st, r, now, noFuzz) {

      const steps = relearning ? (isHard() ? CFG.hardRelearn : CFG.relearn) : CFG.learn;
      if (st.type === "new") st.type = "learn";
      if (r === 1) { st.step = 0; st.due = now + steps[0]; return; }
      if (r === 2) { const cur = steps[st.step] || steps[0], nxt = steps[st.step + 1]; st.due = now + (nxt ? (cur + nxt) / 2 : cur * 1.5); return; }
      if (r === 3 && st.step + 1 < steps.length) { st.step++; st.due = now + steps[st.step]; return; }
      if (!relearning) st.ivl = r === 4 ? CFG.easyIvl : CFG.gradIvl;

    }

  const pendingNew = new Set(); // card nuove già messe nel feed ma non ancora risposte
  function grade(id, r, extra) {
    const prev = S.cards[id] ? Object.assign({}, S.cards[id]) : null;

    const wasNew = !prev || prev.type === "new";
    const apply = rr => {
      const st = Object.assign(newState(), prev || {});

      if (!(extra && rr > 1)) schedule(st, rr, now);
      st.leech = st.lapses >= CFG.leech;
      S.cards[id] = st;
    };
    apply(r);
    if (isHard() && CARD[id]) CARD[id].topics.forEach(t => { const x = S.hardStats[t] = S.hardStats[t] || { n: 0, ok: 0 }; x.n++; if (r > 1) x.ok++; });
    pendingNew.delete(id);
    const d = today(); S.days[d] = S.days[d] || { n: 0, ok: 0, new: 0 }; S.days[d].n++; if (r > 1) S.days[d].ok++; if (wasNew) S.days[d].new = (S.days[d].new || 0) + 1;
    save();
    return {
      extra, rating: r,
      regrade(rr) { this.rating = rr; apply(rr); save(); },
      preview(rr) { if (extra && rr > 1) return null; const st = Object.assign(newState(), prev || {}); schedule(st, rr, now, true); return st.due - now; },
    };
  }
  const fmtIvl = ms => {
    if (ms == null) return "";
    if (ms < HOUR) return `${Math.max(1, Math.round(ms / MIN))} min`;
    if (ms < DAY * .9) return `${Math.round(ms / HOUR)} h`;
    const d = Math.round(ms / DAY);
    if (d < 30) return d === 1 ? "domani" : `${d} g`;
    return `${(d / 30).toFixed(d < 300 ? 1 : 0).replace(".", ",")} mesi`;
  };
  let shown = 0, recent = [], extraMode = false, doneShown = false;
  const newToday = () => ((S.days[today()] || {}).new || 0) + pendingNew.size;
  function pickNext() {
    const pool = eligible(); if (!pool.length) return null;
    const now = Date.now();
    const fresh = c => !recent.includes(c.id);
    const st = c => S.cards[c.id];
    const learning = c => st(c) && (st(c).type === "learn" || st(c).type === "relearn");
    const byDue = (a, b) => st(a).due - st(b).due;
    let l = pool.filter(c => fresh(c) && learning(c) && st(c).due <= now).sort(byDue);
    if (l.length) return { c: l[0] };
    const rv = pool.filter(c => fresh(c) && st(c) && st(c).type === "review" && st(c).due <= now).sort(byDue);
    if (rv.length) return { c: rv[0] };
    if (newToday() < S.newPerDay) {
      let nw = pool.filter(c => fresh(c) && !pendingNew.has(c.id) && (!st(c) || st(c).type === "new"));
      if (!isHard()) {
        const minLv = Math.min(...nw.map(c => LEVELS.indexOf(c.level)));
        nw = nw.filter(c => LEVELS.indexOf(c.level) === minLv);

      if (nw.length) { const c = nw[Math.floor(Math.random() * nw.length)]; pendingNew.add(c.id); return { c }; }
    }

    if (l.length) return { c: l[0] };
    if (extraMode) {

      const list = pool.filter(c => fresh(c) && st(c));
      const src = list.length ? list : pool.filter(fresh).length ? pool.filter(fresh) : pool;
      const w = src.map(c => st(c) ? (3.2 - st(c).ease) + st(c).lapses * .5 + (st(c).wrong > st(c).right ? 1 : 0) + .2 : 1);
      let x = Math.random() * w.reduce((a, b) => a + b, 0);
      for (let i = 0; i < src.length; i++) { x -= w[i]; if (x <= 0) return { c: src[i], extra: true }; }
      return { c: src[src.length - 1], extra: true };
    }
    return { done: true };
  }

  /* ---------------- Utilità ---------------- */
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sample = (arr, n, not = []) => shuffle(arr.filter(x => !not.includes(x))).slice(0, n);
  const norm = s => s.toLowerCase().replace(/α/g, "alfa").replace(/β/g, "beta").normalize("NFD").replace(/[̀-ͯ]/g, "")

    for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
    return prev[n];
  }
  function matchName(input, mol) {
    const x = norm(input); if (!x) return false;

    // tolleranza sui refusi solo se i numeri coincidono (2-PG ≠ 3-PG)

  }
  const molName = id => MOL[id].name;

    const cands = [answer, answer.replace(/\s*\(.*?\)/g, "")].map(norm);
    if (cands.includes(x)) return true;
    return cands.some(c => c.length >= 6 && digits(c) === digits(x) && lev(c, x) <= (c.length >= 20 ? 3 : c.length >= 12 ? 2 : 1));
  }
  // casella per scrivere la risposta (hard mode)
  function writeBox(c, placeholder, test, onDone) {
    const inp = h("input", { type: "text", id: "ans-" + c.id.replace(/\W/g, "-") + "-" + shown, placeholder, autocomplete: "off", autocapitalize: "off", spellcheck: "false", enterkeyhint: "done", "aria-label": placeholder });
    const go = h("button", { class: "btn btn-primary", type: "button" }, "Verifica");
    const form = h("div", { class: "write" }, inp, go);
    const check = () => {
      if (!inp.value.trim()) { inp.focus(); return; }
      const ok = test(inp.value); inp.disabled = go.disabled = true; inp.blur();
      form.classList.add(ok ? "right" : "wrong");

    };

    inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
    return form;
  }
  const subjectOf = topic => ((TOPICS[topic] || {}).subject || "Biochimica II");
  const pg = p => (/^\d/.test(String(p)) ? "p. " : "") + p; // le lezioni senza numeri di pagina si citano per nome
  const ref = (subject, page) => page ? `Riferimento: sbobina di ${subject}, ${pg(page)}` : null;
  // "dal glucosio", "dall'ossalacetato", "sull'1,3-bisfosfoglicerato"

  const ALL_ENZYMES = [...new Set([...C.reactions.map(r => r.enzyme), ...C.pathways.flatMap(p => p.steps.map(s => s.enzyme)), ...C.extraEnzymes])];
  const topicLabel = c => { if (c.kind === "mv") return "Vie metaboliche"; const t = TOPICS[c.topics.find(x => activeTopics().includes(x)) || c.topics[0]]; return t ? t.name : ""; };
  let toastTimer;
  function toast(msg) {

    t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600);
  }

  /* ---------------- Disegno delle molecole ---------------- */
  const isDark = () => document.documentElement.dataset.theme === "dark" ||
    (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  const molInk = () => getComputedStyle(document.documentElement).getPropertyValue("--mol-ink").trim() || "#222";
  const SVGNS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, a) => { const e = document.createElementNS(SVGNS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };

  function drawHaworth(m) {
    const hw = m.haworth, ink = molInk();
    const W = 380, H = 236, X = 20;
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Struttura in proiezione di Haworth" });
    const pyr = hw.size === 6;
    // vertici: [O, C anomerico, ... ] in senso orario visto dall'alto
    const P = pyr
      ? { O: [218 + X, 84], ring: [[262 + X, 120], [222 + X, 158], [128 + X, 158], [86 + X, 120], [124 + X, 84]] }

      const a = verts[i], b = verts[(i + 1) % verts.length];
      const isFront = front.some(([x, y]) => (i === x && (i + 1) % verts.length === y));

      const [x, y] = P.ring[i];

  // Formula condensata verticale (stile Lehninger): una riga per carbonio
  function drawFischer(m) {

    const line = (x1, y1, x2, y2) => svgEl("line", { x1, y1, x2, y2, stroke: ink, "stroke-width": 2, "stroke-linecap": "round" });

  /* ---------------- Card ---------------- */
  /* ---------------- Segnalazioni ---------------- */
  const REASONS = ["Risposta sbagliata", "Spiegazione sbagliata o poco chiara", "Formula o struttura sbagliata", "Domanda ambigua", "Errore di battitura", "Altro"];

  let sending = false;
  // conteggio anonimo degli accessi: solo codice casuale, versione e sistema
  async function pingUsage() {
    if (!REPORT_URL || !navigator.onLine) return;
    // al massimo un segnale ogni 30 minuti: il foglio conta i giorni e registra l'ora dell'ultimo accesso
    const d = today(), now = Date.now();
    if (S.lastPing === d && now - (S.lastPingAt || 0) < 30 * 60 * 1000) return;
    try {
      await fetch(REPORT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ kind: "ping", device: S.device, version: "v" + C.version, platform: platform(), standalone: standalone() }) });
      S.lastPing = d; S.lastPingAt = now; save();
    } catch (e) { }
  }
  async function flushReports() {
    if (!REPORT_URL || sending || !navigator.onLine) return;

    try {
      for (const r of loadReports().filter(x => !x.sent)) {
        try {
          // text/plain evita il preflight CORS; la risposta è opaca ma la richiesta arriva
          await fetch(REPORT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(r) });
          const all = loadReports(); const x = all.find(y => y.reportId === r.reportId); if (x) { x.sent = Date.now(); saveReports(all); }
        } catch (e) { break; }
      }
    } finally { sending = false; }
  }

    return { cardId, topic: (c.topics || [])[0] || "", question: (q ? q.textContent : "") + (c.kind === "mol" || c.kind === "mv" ? ` [${MOL[c.mol].name}]` : ""), options: opts, correct, given: card.classList.contains("answered") ? given : "" };
  }

  function shell(c, kicker, tileClass, icon) {

  function noteEl(text) { return h("div", { class: "note" }, h("div", {}, h("b", {}, "⚠ Sbobina · "), text)); }
  // Feedback a pop-up: si apre dalla risposta toccata e si sovrappone un po' alle opzioni sotto
  function finish(card, anchor, ok, text, meta, note, g) {
    card.classList.add("answered");
    const last = false;
    let rate = null;
    if (g && ok && !g.extra) {
      // dopo una risposta giusta puoi dire quanto è stata facile (Buono è già applicato)
      rate = h("div", { class: "rate", role: "group", "aria-label": "Quanto è stata facile" });
      [[2, "Difficile"], [3, "Buono"], [4, "Facile"]].forEach(([r, l]) => {
        const b = h("button", { type: "button", class: "rate-b", "aria-pressed": String(r === 3) }, h("span", {}, l), h("small", {}, fmtIvl(g.preview(r))));
        b.addEventListener("click", e => { e.stopPropagation(); g.regrade(r); rate.querySelectorAll(".rate-b").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
        rate.append(b);
      });
    }
    const when = g && !ok ? `Torna tra ${fmtIvl(g.preview(1))}` : g && g.extra ? "Ripasso extra: la programmazione non cambia" : null;
    const pop = h("div", { class: "pop " + (ok ? "ok" : "ko") + (last ? " up" : ""), role: "status" },
      h("div", { class: "pop-head", role: "button", tabindex: "0", "aria-expanded": "true", title: "Chiudi o riapri la spiegazione" },
        h("span", { class: "pop-verdict" }, ok ? "Giusto" : "Sbagliato"),
        h("span", { class: "pop-toggle" }, h("span", { class: "pop-toggle-l" }, "Nascondi"), svgIcon("down"))),
      text ? h("div", { class: "pop-text" }, text) : null,
      meta ? h("div", { class: "pop-meta" }, meta) : null,
      when ? h("div", { class: "pop-meta" }, when) : null,
      note ? (/^Sbobina /.test(note)
        ? h("div", { class: "pop-note" }, h("b", {}, "⚠ " + note.split(":")[0] + ":"), note.slice(note.indexOf(":") + 1))
        : h("div", { class: "pop-note info" }, h("b", {}, "Nota · "), note)) : null,
      rate);
    // la spiegazione si chiude come un menu a tendina per vedere le opzioni sotto
    const head = pop.querySelector(".pop-head");
    const toggle = e => {
      e.preventDefault(); e.stopPropagation();
      const closed = pop.classList.toggle("collapsed");
      head.setAttribute("aria-expanded", String(!closed));
      anchor.classList.toggle("pop-closed", closed);
      head.querySelector(".pop-toggle-l").textContent = closed ? "Mostra" : "Nascondi";
    };
    head.addEventListener("click", toggle);
    head.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") toggle(e); });
    pop.addEventListener("click", e => e.stopPropagation());
    anchor.classList.add("has-pop");
    anchor.append(pop);
    // sotto la risposta se c'è spazio nella card, altrimenti sopra
    const body = card.querySelector(".card-body");
    if (body) {
      const pr = pop.getBoundingClientRect(), br = body.getBoundingClientRect(), ar = anchor.getBoundingClientRect();
      if (pr.bottom > br.bottom - 4 && ar.top - br.top > br.bottom - ar.bottom) pop.classList.add("up");
    }
  }
  function optionList(opts, correct, onDone) {
    const wrap = h("div", { class: "options", role: "group" });
    opts.forEach((o, i) => {
      const b = h("button", { class: "opt", type: "button" }, h("span", { class: "key" }, "ABCDE"[i]), h("span", { class: "opt-label" }, o));
      b.addEventListener("click", () => {
        const ok = o === correct;
        wrap.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.querySelector(".opt-label").textContent === correct) x.classList.add("right"); });

  // vie metaboliche in cui compare ogni molecola: "si" = compare, "forse" = escluso dai distrattori perché discutibile
  const PATHS = ["Glicolisi", "Gluconeogenesi", "Ciclo di Krebs", "Via dei pentoso fosfati", "Metabolismo del glicogeno", "Fermentazione alcolica",
    "Navetta malato-aspartato", "Navetta del glicerolo fosfato", "Ciclo di Cori", "Ciclo dell'urea", "β-ossidazione degli acidi grassi", "Chetogenesi"];
  const [GLI, GNG, TCA, PPP, GLY, FALC, NMA, NGP, CORI, UREA] = PATHS;
  const MOL_PATHS = {
    glc: [[GLI, GNG, GLY, CORI], [PPP]], g6p: [[GLI, GNG, GLY, PPP], [CORI]], f6p: [[GLI, GNG, PPP], [CORI]], fbp: [[GLI, GNG], [CORI]],
    dhap: [[GLI, GNG, NGP], [CORI]], ga3p: [[GLI, GNG, PPP], [CORI]], bpg13: [[GLI, GNG], [CORI]], pg3: [[GLI, GNG], [CORI]], pg2: [[GLI, GNG], [CORI]],
    pep: [[GLI, GNG], [CORI]], pyr: [[GLI, GNG, FALC, CORI], [TCA]], oaa: [[TCA, GNG, NMA], [UREA, CORI]], mal: [[TCA, GNG, NMA], [CORI]],
    lac: [[CORI, GNG], [GLI]], ala: [[GNG], [UREA]], gly: [[GNG], []], gro3p: [[NGP, GNG], []],
    cit: [[TCA], []], icit: [[TCA], []], akg: [[TCA], [NMA, UREA, GNG]], suc: [[TCA], []], fum: [[TCA, UREA], []],
    g1p: [[GLY], [GNG]], fru: [[GLI], [GNG, GLY]], gal: [[GLI], [GLY]], man: [[GLI], []],
    r5p: [[PPP], []], ru5p: [[PPP], []], xu5p: [[PPP], []], pg6: [[PPP], []], e4p: [[PPP], []], s7p: [[PPP], []],
    acal: [[FALC], []], etoh: [[FALC], []], asp: [[NMA, UREA], [GNG, TCA]], glu: [[NMA], [UREA, GNG, TCA]],
  };
  function mvCard(c) {
    const m = MOL[c.mol];
    const { card, body } = shell(c, "Riconosci la molecola", "t-rose", "hex");
    body.append(h("h2", { class: "q" }, "In quale di queste vie compare questa molecola?"), molBox(m.id));
    const [yes, maybe] = MOL_PATHS[m.id];
    const answer = yes[Math.floor(Math.random() * yes.length)];
    const pool = PATHS.filter(p => !yes.includes(p) && !maybe.includes(p));
    const opts = shuffle([answer, ...shuffle(pool).slice(0, 4)]);
    body.append(optionList(opts, answer, (ok, btn) => {
      const g = grade(c.id, ok ? 3 : 1, c.extra);
      finish(card, btn, ok, `È ${m.name}.`, "Compare in: " + yes.join(", ") + ".", null, g);
    }));
    return card;
  }
  function molCard(c) {
    const m = MOL[c.mol];
    const { card, body } = shell(c, "Riconosci la molecola", "t-rose", "hex");
    body.append(h("h2", { class: "q" }, "Che molecola è?"), molBox(m.id));
    const detail = `${m.formula} · PubChem CID ${m.cid}`;
    const done = (ok, anchor) => { const g = grade(c.id, ok ? 3 : 1, c.extra); finish(card, anchor, ok, ok ? m.name : `È ${m.name}.`, detail, null, g); };
    // distrattori: prima le molecole dello stesso argomento, poi le altre
    const near = shuffle(D.molecules.filter(x => x.id !== m.id && (C.moleculeTopics[x.id] || []).some(t => c.topics.includes(t))).map(x => x.name));
    const far = shuffle(D.molecules.filter(x => x.id !== m.id && !near.includes(x.name)).map(x => x.name));
    const opts = shuffle([m.name, ...near.concat(far).slice(0, 4)]);
    const showOptions = () => body.append(optionList(opts, m.name, done));
    if (S.mode === "choice" && !isHard()) showOptions();
    else {
      const inp = h("input", { type: "text", id: "ans-" + c.id.replace(/\W/g, "-") + "-" + shown, placeholder: "Scrivi il nome (va bene anche la sigla)", autocomplete: "off", autocapitalize: "off", spellcheck: "false", enterkeyhint: "done", "aria-label": "Nome della molecola" });

  // Domanda specifica in base a cosa manca nella reazione
  function rxQuestion(r, hid) {
    if (hid.kind === "enz") return "Quale enzima catalizza questa reazione?";
    if (hid.kind === "co") return "Quale coenzima usa questo enzima?";
    const left = hid.side === "left", v = hid.val;
    if (hid.kind === "mol") {
      const sameSide = (left ? r.left : r.right).filter(x => x[0] === "m").length;
      if (left) return sameSide > 1 ? "Quale altro substrato manca?" : "Qual è il substrato di questa reazione?";
      return sameSide > 1 ? "Qual è l'altro prodotto della scissione?" : "Qual è il prodotto di questa reazione?";
    }
    const Q = {
      "ATP": left ? "Quale nucleotide cede il fosfato?" : "Quale nucleotide si forma?",
      "GTP": left ? "Quale nucleotide cede il fosfato?" : "Quale nucleotide si forma?",
      "ADP": left ? "Quale nucleotide accetta il fosfato?" : "Quale nucleotide resta dopo il trasferimento del fosfato?",
      "GDP": left ? "Quale nucleotide accetta il fosfato?" : "Quale nucleotide resta dopo il trasferimento del fosfato?",
      "NAD⁺": left ? "Quale coenzima accetta gli elettroni (si riduce)?" : "In che forma torna il coenzima dopo aver ceduto gli elettroni?",
      "NADH + H⁺": left ? "Quale coenzima cede gli elettroni (si ossida)?" : "In che forma esce il coenzima ridotto?",
      "Pi": left ? "Cosa viene incorporato nel prodotto senza consumare ATP?" : "Cosa viene liberato dall'idrolisi?",
      "H₂O": left ? "Quale molecola serve per l'idrolisi?" : "Quale molecola viene eliminata?",
      "CO₂": "Cosa viene liberato con la decarbossilazione?",
      "HCO₃⁻": "Da dove viene il carbonio aggiunto al piruvato?",
    };
    if (v === "ATP" && left && r.left.some(x => x[1] === "HCO₃⁻")) return "Quale nucleotide viene idrolizzato per attivare il bicarbonato?";
    return Q[v] || "Cosa manca per completare la reazione?";
  }
  const eqText = r => {
    const t = x => x[0] === "m" ? molName(x[1]) : x[1];
    return `${r.left.map(t).join(" + ")} ${r.irreversible ? "→" : "⇌"} ${r.right.map(t).join(" + ")}`;
  };
  function rxCard(c) {
    const r = c.rx;
    const { card, body } = shell(c, "Completa la reazione", "t-peach", "rxn");
    // elementi nascondibili: molecole, cofattori, enzima, coenzima
    const slots = [];
    r.left.forEach((x, i) => slots.push({ side: "left", i, kind: x[0] === "m" ? "mol" : "cof", val: x[1] }));
    r.right.forEach((x, i) => slots.push({ side: "right", i, kind: x[0] === "m" ? "mol" : "cof", val: x[1] }));
    slots.push({ kind: "enz", val: r.enzyme });
    if (r.coenzyme) slots.push({ kind: "co", val: r.coenzyme });
    // in hard mode si nasconde solo una molecola o l'enzima, e la risposta va scritta
    const hidable = isHard() ? slots.filter(s => s.kind === "mol" || s.kind === "enz") : slots;
    const hid = hidable[Math.floor(Math.random() * hidable.length)];
    const question = rxQuestion(r, hid);
    const label = s => s.kind === "mol" ? molName(s.val) : s.val;
    const answer = label(hid);
    const patch = h("span", { class: "patch" }, "?");
    const side = (arr, sideName) => {
      const row = h("div", { class: "rx-side" });
      arr.forEach((x, i) => {
        if (i) row.append(h("span", { class: "rx-plus" }, "+"));
        const isHid = hid.side === sideName && hid.i === i;
        row.append(isHid ? patch : h("span", { class: "rx-item" + (x[0] === "c" ? " cof" : "") }, x[0] === "m" ? molName(x[1]) : x[1]));
      });
      return row;
    };
    const enz = hid.kind === "enz" ? patch : h("span", { class: "enz" }, r.enzyme);
    const co = r.coenzyme ? h("span", { class: "co" }, "coenzima: ", hid.kind === "co" ? patch : r.coenzyme) : null;
    const where = r.where ? h("span", { class: "co" }, "sede: ", r.where) : null;
    body.append(
      h("h2", { class: "q" }, question),
      h("div", { class: "rx" }, side(r.left, "left"),
        h("div", { class: "rx-arrow" }, h("span", { class: "stem" + (r.irreversible ? "" : " rev"), "aria-label": r.irreversible ? "irreversibile" : "reversibile" }), h("div", { class: "rx-enz" }, enz, co, where)),
        side(r.right, "right")));
    let pool;
    if (hid.kind === "mol") pool = D.molecules.map(m => m.name);
    else if (hid.kind === "enz") pool = ALL_ENZYMES;
    else pool = C.cofactorPool;
    const present = slots.filter(s => s !== hid).map(label);
    const opts = shuffle([answer, ...sample(pool, 4, [answer, ...present])]);
    let note = r.note || null;
    if (hid.kind === "enz" && r.enzymeNotInNotes && !note) note = "Il nome dell'enzima non è nelle sbobine.";
    const done = (ok, btn) => {
      const g = grade(c.id, ok ? 3 : 1, c.extra);
      patch.textContent = answer; patch.classList.add("revealed"); if (!ok) patch.classList.add("miss");
      finish(card, btn, ok, `${r.enzyme}: ${eqText(r)}`, ref(subjectOf(r.topic), r.page), note, g);
    };
    if (isHard()) body.append(writeBox(c, hid.kind === "mol" ? "Scrivi il nome della molecola" : "Scrivi il nome dell'enzima",
      v => hid.kind === "mol" ? matchName(v, MOL[hid.val]) : matchText(v, answer), done));
    else body.append(optionList(opts, answer, done));
    return card;
  }

  function nxCard(c) {
    const p = c.path, st = c.step;
    const { card, body } = shell(c, "Cosa succede dopo", "t-sage", "path");
    const askEnzyme = Math.random() < .4;
    const where = st.where ? ` ${st.where}` : "";
    const withTxt = st.with ? ` (insieme al ${MOL[st.with].name.toLowerCase()})` : "";
    const pathName = p.name.charAt(0).toUpperCase() + p.name.slice(1);
    body.append(
      h("h2", { class: "q" }, askEnzyme
        ? `${pathName}: quale enzima agisce ${prep("su", st.from)}${where}?`
        : `${pathName}: cosa si forma ${prep("da", st.from)}${withTxt}${where}?`),
      molBox(st.from));
    const answer = askEnzyme ? st.enzyme : st.to.map(molName).join(" + ");
    let pool;
    if (askEnzyme) pool = ALL_ENZYMES;
    else {
      const inPath = [...new Set(p.steps.flatMap(s => [s.from, ...s.to]))].map(molName);
      pool = [...new Set([...inPath, ...D.molecules.map(m => m.name)])];
      if (st.to.length > 1) pool = ["2 Piruvato", "Glucosio 6-fosfato + Pi", "Fosfoenolpiruvato + Gliceraldeide 3-fosfato", "Diidrossiacetone fosfato + 3-fosfoglicerato", "2 Gliceraldeide 3-fosfato + ATP"];
    }
    const opts = shuffle([answer, ...sample(pool, 4, [answer, molName(st.from)])]);
    body.append(optionList(opts, answer, (ok, btn) => {
      const g = grade(c.id, ok ? 3 : 1, c.extra);
      const full = `${molName(st.from)} → ${st.to.map(molName).join(" + ")} · ${st.enzyme}`;
      const tp = st.topic || p.topic;
      finish(card, btn, ok, full, [ok ? null : `Risposta giusta: ${answer}`, ref(subjectOf(tp), (TOPICS[tp] || {}).pages)].filter(Boolean).join(" · ") || null, st.note || null, g);
    }));
    return card;
  }

  // Domanda verificata (proposta a lezione): opzioni nell'ordine originale (alcune rimandano alle altre: "Tutte e tre", "Nessuno")
  function examCard(c) {
    const x = c.ex;
    const kicker = c.bank ? (x.level === "h" ? "Domanda Hard · da esame" : x.level === "l" ? "Rifinitura da 30 e lode" : "Domanda") : (x.times > 1 ? `Domanda verificata · uscita ${x.times} volte` : "Domanda verificata");
    const { card, body } = shell(c, kicker, c.bank ? (x.level === "h" ? "t-peach" : x.level === "l" ? "t-lilac" : "t-rose") : "t-sky", c.bank ? (x.level === "h" ? "flame" : x.level === "l" ? "star" : "hex") : "board");
